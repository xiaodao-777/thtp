# Psalm of Waves

 origin_libra_psalm_of_waves: "浪潮诗篇"
 origin_libra_psalm_of_waves_text: "这一物种生于大海，也归于大海：他们在水中生存进化，而后登上海岸繁衍后代，再回到海洋里度过余生。在无数波浪洗礼之后，他们形成了自己的文明——一个追随潮汐韵律的海洋文明。"
 origin_libra_psalm_of_waves_desc: "$origin_libra_psalm_of_waves_text$\n$libraf_or_banner_2$"
 origin_libra_psalm_of_waves_effects: "—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_temple_of_waves']\n—$SPECIES_TRAITS$可以选择['concept_libra_psalm_of_waves_traits']\n—$libra_start_leader_string$\n$t$—$libra_commander_trait$§Y$leader_trait_libra_psalm_of_waves_commander$§!\n$t$—$libra_official_trait$§Y$leader_trait_libra_psalm_of_waves_official$§!\n$t$—$libra_scientist_trait$§Y$leader_trait_libra_psalm_of_waves_scientist$§!\n—$libra_agenda$\n$t$—§Y$council_agenda_agenda_libra_psalm_of_waves_a_name$§!，强化$commander_with_icon$\n$t$—§Y$council_agenda_agenda_libra_psalm_of_waves_b_name$§!，强化$official_with_icon$\n$t$—§Y$council_agenda_agenda_libra_psalm_of_waves_c_name$§!，强化$scientist_with_icon$\n—$libra_extra_council_position$['concept_councilor_libra_psalm_of_waves']\n—$HOMEWORLD$['concept_pc_ocean']（$libra_planetsize$23）\n—$STARTING_SYSTEM$§G+1§!§Y$frozen_terraforming_candidate$§!"
 START_SCREEN_LIBRA_PSALM_OF_WAVES: "一如海浪拍打礁石，[this.GetSpeciesName]在漫长的演化过程中曾多次来到陆地上修养生息，又退回海洋哺育新生。[this.GetName]在这悠久的循环往复中寻求生命的意义，花费千年的时间将自己的存在遍及整个[this.GetHomeWorldName]。\n\n在最初的最初，先祖只是柔弱且欠缺自我的浮游生物，强大的掠食者时刻威胁着他们的安全，但敌人并不全能。我们的祖先在死亡中进化，利用周围的一切谋取生存，终于使[this.GetSpeciesName]得以诞生。他们站在食物链的最顶端，掌控着母星的全部海域，睥睨着渺小而无谓的陆地——那是彼时未能掌控的最后领域。随着时间的推移，[this.GetSpeciesName]间发生了各种各样的变故，而留下来的我们是其中最优秀的一支，潜入深海或登上地面都不在话下，我们的历史就这么展开了。\n\n追随浪潮的脚步，[this.GetSpeciesName]的发展异常迅速，随着星际航行技术的实现，我们已经准备好在星辰间远游了。"
 libra_psalm_of_waves_start_NAME: "海蓝宝石"
 libra_psalm_of_waves_start_DESC: "当使用$origin_libra_psalm_of_waves$$ORIGIN$时的默认起始恒星系。"
 d_libra_psalm_of_waves: "冰晶宝藏"
 d_libra_psalm_of_waves_desc: "埋藏在冰层之下的资源，具有相当的价值。"
 building_libra_temple_of_waves: "洋流环礁"
 building_libra_temple_of_waves_desc: "千百年来，我们在这样的一座环形礁里观察着潮汐的涌动，唱诵着海洋的赞歌。"
 building_libra_temple_of_waves_effect: "殖民地每有$pop_group_unit$£pop£§Y$POP$§!就消耗£trade£§R1§!生产£physics£§G0.5§!£society£§G0.5§!£engineering£§G0.5§!。"
