 libra_origin.0520.name: "又见红月"
 libra_origin.0520.desc: "是的，我们再一次看见了——那天空中高悬的血红色月亮。\n\n被破坏的过去和未来的诸多可能，于此交杂融合，是时候决定我们的方向了。"
 libra_origin.0520.a: "这是新时代的夜晚。"
 libra_origin.0520.b: "举杯庆祝。"
 libra_origin.0521.name: "重返人间"
 libra_origin.0521.desc: "满月之下，我们的力量回到了原本应该有的位置，尽管未来仍不确定，但现在我们能够选择当下的道路。"
 libra_origin.0521.a: "我们将会递出橄榄枝。"
 libra_origin.0521.a.tooltip: "解锁['tradition_category:tradition_libra_crimson_vampire']的§Y和平§!路线效果\n$situation_libra_journey_to_the_end_stage_tooltip$"
 libra_origin.0521.b: "我们将会拿起剑与盾。"
 libra_origin.0521.b.tooltip: "解锁['tradition_category:tradition_libra_crimson_vampire']的§Y战争§!路线效果\n$situation_libra_journey_to_the_end_stage_tooltip$"
 libra_crimson_nights_war_effect: "剑与盾"
 libra_crimson_nights_peace_effect: "橄榄枝"
 libra_origin.0525.name: "狭间十字路"
 libra_origin.0525.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n如果要将一群人变成我们的仆从，我们会："
 libra_origin.0525.a: "为其注入血族之血。"
 libra_origin.0525.b: "啃咬他们的脖颈。"
 libra_origin.0525.c: "不失礼仪地加以迷惑。"
 libra_origin.0526.name: "$libra_origin.0525.name$"
 libra_origin.0526.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n如果眼前有一杯处女的鲜血，我们会："
 libra_origin.0526.a: "小心地珍藏起来。"
 libra_origin.0526.b: "举杯一饮而尽。"
 libra_origin.0526.c: "制成最高级的饰品。"
 libra_origin.0527.name: "$libra_origin.0525.name$"
 libra_origin.0527.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n在参加宴会之时，我们会选择："
 libra_origin.0527.a: "黑红相间的礼服。"
 libra_origin.0527.b: "打理整齐的便装。"
 libra_origin.0527.c: "合乎礼仪的服装。"
 libra_origin.0528.name: "$libra_origin.0525.name$"
 libra_origin.0528.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n身处险境之时，我们应该："
 libra_origin.0528.a: "操纵魔法解决威胁。"
 libra_origin.0528.b: "化身气雾迅速脱身。"
 libra_origin.0528.c: "以贵族之名审慎应对。"
 libra_origin.0529.name: "$libra_origin.0525.name$"
 libra_origin.0529.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n在休憩时，我们将会选择："
 libra_origin.0529.a: "铺满墓地土壤的棺材。"
 libra_origin.0529.b: "铺满家乡土壤的棺材。"
 libra_origin.0529.c: "合乎身份装饰的棺材。"
 libra_origin.0530.name: "$libra_origin.0525.name$"
 libra_origin.0530.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n从关闭的正门造访居所时，我们将会："
 libra_origin.0530.a: "寻找门铃的位置。"
 libra_origin.0530.b: "直接去敲门。"
 libra_origin.0530.c: "让仆从代劳。"
 libra_origin.0531.name: "$libra_origin.0525.name$"
 libra_origin.0531.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n遭遇禁忌物品时，我们的选择是："
 libra_origin.0531.a: "置之不理。"
 libra_origin.0531.b: "直接摧毁。"
 libra_origin.0531.c: "妥善处理。"
 libra_origin.0532.name: "$libra_origin.0525.name$"
 libra_origin.0532.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n外出时阳光灼烈，我们的选择是："
 libra_origin.0532.a: "改变行程，稍后出行。"
 libra_origin.0532.b: "没什么可以阻挡我们前进。"
 libra_origin.0532.c: "我们拥有仆从和载具。"
 libra_origin.0533.name: "$libra_origin.0525.name$"
 libra_origin.0533.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n如果有两本典籍可供阅读，我们会拿起："
 libra_origin.0533.a: "精神魔法书。"
 libra_origin.0533.b: "诅咒魔法书。"
 libra_origin.0533.c: "无需为基本素养担忧。"
 libra_origin.0534.name: "$libra_origin.0525.name$"
 libra_origin.0534.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n遭遇其他夜行者时，我们的行动是："
 libra_origin.0534.a: "礼貌问好。"
 libra_origin.0534.b: "干翻他们。"
 libra_origin.0534.c: "让管家去打交道。"
 libra_origin.0535.name: "$libra_origin.0525.name$"
 libra_origin.0535.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n面对逝去的同伴，我们会："
 libra_origin.0535.a: "树立简易的墓碑。"
 libra_origin.0535.b: "举行一场哀悼会。"
 libra_origin.0535.c: "举办贵族的葬礼。"
 libra_origin.0536.name: "$libra_origin.0525.name$"
 libra_origin.0536.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n在捕杀猎物时，我们所想的是："
 libra_origin.0536.a: "又能饱餐一顿了。"
 libra_origin.0536.b: "感谢自然的恩赐。"
 libra_origin.0536.c: "一场优雅的狩猎。"
 libra_origin.0537.name: "$libra_origin.0525.name$"
 libra_origin.0537.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n在生命的尽头，我们会："
 libra_origin.0537.a: "诅咒自己的敌人。"
 libra_origin.0537.b: "尽量安排后事。"
 libra_origin.0537.c: "静待终结的到来。"
 libra_origin.0538.name: "$libra_origin.0525.name$"
 libra_origin.0538.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n如果要整理仪容，我们会："
 libra_origin.0538.a: "凭感觉处理。"
 libra_origin.0538.b: "用电子设备映照自己的形象。"
 libra_origin.0538.c: "照着镜子让仆人打理。"
 libra_origin.0539.name: "$libra_origin.0525.name$"
 libra_origin.0539.desc: "在回归真实的道路上，有一些问题我们亟待解决。\n\n在享用鲜血时，理想的途径是："
 libra_origin.0539.a: "直接吸取。"
 libra_origin.0539.b: "涂抹在面包上。"
 libra_origin.0539.c: "装在华丽的酒杯里饮用。"
