 libra_origin.0101.name: "新年"
 libra_origin.0101.desc: "又一个春夏秋冬的循环结束了，我们的时间就像航行中飞船的引擎那样从来不曾停止，但总有在星港中停泊休整的时刻。\n无论每一个我们现在何处，都有这样一个共同的时刻，从紧张的事务中放松，而纪念过去的这一年。"
 libra_origin.0101.a: "庆祝时间到！"
 libra_origin.0101.b: "把庆典交由专员监督吧。"
 libra_origin.0101.b.tt: "自动循环§Y$situation_libra_praises_to_life_a$§!局势"
 libra_origin.0102.name: "岁月回环"
 libra_origin.0102.desc: "一转眼又是12年，空间偏移了多少，而我们又发现了多远？\n修缮设施，重整规划，新的循环开始了。"
 libra_origin.0102.a: "旅途仍在继续。"
 libra_origin.0102.b: "未来更加美好。"
 libra_origin.0102.tooltip: "获得§G8§!张['concept_libra_ceremony_characters']"
