 decision_libra_centurion_a: "巩固政令"
 decision_libra_centurion_a_desc: "一心同体的国家能在不可预知的局势中发挥最大的优势，我们可以从局部工作入手，巩固帝国的向心力。"
 decision_libra_centurion_a_effect: "根据累计§Y$origin_libra_centurion$决议§!次数获得§G4~100§!£influence£ §Y$influence$§!"
 decision_libra_centurion_a_fail: "$TRIGGER_FAIL$殖民地总督是内阁官员"
 decision_libra_centurion_b: "宣教忠诚"
 decision_libra_centurion_b_desc: "我们的战争史上写满了对英雄豪杰的赞美，尤其是那些舍己为国的个体。无论身在何处，爱国主义教育都将点燃公民的热血。"
 decision_libra_centurion_b_effect: "提升至多§G+3§!§Y$planetary_ascension$§!至§Y9§!级\n根据累计§Y$origin_libra_centurion$决议§!次数获得§G0.25~6§!个月的£unity£ §Y$unity$§!"
 decision_libra_centurion_c: "整合储备"
 decision_libra_centurion_c_desc: "很多事情无法在一般情况下一蹴而就，但我们作为拥有悠久军事传统的帝国，在这些领域并不会受到多少限制，动员全部力量总可以腾出必要的资源。"
 decision_libra_centurion_c_effect: "获得§G8§!个月的 £alloys£ £consumer_goods£ 产出\n根据累计§Y$origin_libra_centurion$决议§!次数获得§G600~15000§!£trade£ §Y$trade$§!"
 decision_libra_centurion_d: "战略精修"
 decision_libra_centurion_d_desc: "那些珍贵的战术典籍在我们的文明之中流传和完善了无数代直到今天，它们的参考和教育意义从来不曾减退。"
 decision_libra_centurion_d_effect: "在所有£leader£§Y领袖§!间共享§G5000§!经验\n根据累计§Y$origin_libra_centurion$决议§!次数为§Y$ethic_militarist$§!领袖额外增加§G40~1000§!经验"
 libra_centurion_event_tt: "§G+3§!§Y$origin_libra_centurion$决议§!次数"
 libra_origin.1830.name: "钢铁长城"
 libra_origin.1830.desc: "防御不只是消极的等待，我们以领土为磨盘，将入侵者彻底碾碎歼灭。每一座堡垒，每一道屏障，都是我们对家园的承诺。敌人终将明白，试图突破我们的防线，如同撞击永恒之岩。我们守卫的不仅是领土，更是信念。\n\n在这片星空下，没有比守护更崇高的使命。即使炮火与鲜血染红天际，我们的防线依旧屹立，如同钢铁铸就的意志，不可动摇。敌人可以计算我们的兵力，却无法衡量我们保卫家园的决心。"
 libra_origin.1830.a: "在这里，无人能越雷池一步。"
 libra_origin.1831.name: "蛰伏与雷霆"
 libra_origin.1831.desc: "在和平的间隙，我们收敛锋芒，如冬眠的巨兽，看似满是破绽，实际上随时可以苏醒。战略的艺术在于选择何时隐藏，何时显现。当战争的阴云重新笼罩，我们积蓄的力量将以雷霆之势爆发，让敌人措手不及。\n\n真正的强者懂得在沉默中等待，在黑暗中磨砺爪牙。和平不是终点，是下一次冲锋前的深呼吸。我们从不沉溺于安逸，因为每一刻的宁静都在为未来的风暴积蓄能量。"
 libra_origin.1831.a: "让敌人在我们沉睡时恐惧，在我们苏醒时颤抖。"
 libra_origin.1832.name: "千锤百炼"
 libra_origin.1832.desc: "演武场里的金属撞击声早已沉淀为帝国的心跳，每一批新兵在踏入战场前，都必须经历无数道试炼——从单兵格斗到军团协同，从星球登陆到真空作战。试炼的伤痕成为荣誉的勋章，战备的积累化作无形的威慑。我们知道，誓言不只是言语，更是战士最基本的信念。\n\n试炼的烈火从未熄灭，它燃烧在每一个战士的胸膛。那些在极限中幸存者，将带着不可磨灭的印记，成为后来者的标杆。而我们，作为他们的统帅，见证着这永恒的循环——每一次试炼都让军团的根基更深一寸，让胜利的天平更倾斜一分。"
 libra_origin.1832.a: "让这誓言成为我们存在的证明。"
 libra_origin.1833.name: "凯旋之刃"
 libra_origin.1833.desc: "最后的敌舰在星空中化为尘埃，胜利的号角响彻星河。然而，在庆祝的喧嚣之后，是墓地的沉默。我们从不问胜利的代价，因为代价本身就是胜利的一部分。每一次胜利都让我们更接近那个终极目标——证明我们存在的意义。\n\n荣耀不止于敌人的鲜血，也在于我们对自己极限的超越。那些倒下者用生命铺就了通往胜利的道路，而活着的人将背负着他们的意志继续前进。战争是残酷的，但我们会以最崇高的方式回应它的呼唤。"
 libra_origin.1833.a: "胜者享有历史，败者成为历史。"