# Sing Praises to Fleeting Life

 origin_libra_praises_to_life: "流年如歌"
 origin_libra_praises_to_life_text: "随着四季的韵律，时间如白驹过隙般飞逝，而我们则在历史的波澜中迂回向前：时而流连幽美的花海，时而静候初放的荷包，时而捡拾沉醉的红叶，时而探寻覆雪的寒梅。\n月落星沉复始吟，冬去春来再尽年。"
 origin_libra_praises_to_life_desc: "$origin_libra_praises_to_life_text$\n$libraf_or_banner_1$"
 origin_libra_praises_to_life_effects: "—$libra_situation$\n$t$—['concept_situation_libra_praises_to_life_a']\n$t$—['concept_situation_libra_praises_to_life_b']\n—$libra_active_tradition$\n$t$—['tradition_category:tradition_libra_ceremony',$tr_libra_ceremony_adopt$]\n$t$—['tradition:tr_libra_ceremony_1']\n—$libra_start_council_agenda$§Y$council_agenda_agenda_libra_ceremony_a_name$§!（$libra_progress$80%）\n—$libra_agenda$§Y$council_agenda_agenda_libra_praises_to_life_name$§!，根据消耗的['concept_libra_ceremony_characters']获得增益\n—$STARTING_PLANET$\n$t$—$libra_planetsize$18\n$t$—$libra_planet_modifier$['concept_origin_libra_praises_to_life_cm']\n—$STARTING_SYSTEM$\n$t$—丰富资源矿藏\n$t$—未殖民的['concept_pc_gaia']（$libra_planetsize$13）\n—$libra_trade_action$['concept_trade_action_libra_praises_to_life']\n—$libra_extra_council_position$['concept_councilor_libra_praises_to_life']\n—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_libra_praises_to_life_start_tech']"
 START_SCREEN_LIBRA_PRAISES_TO_LIFE: "我从这首歌出发\n踩着节奏的魔法\n找寻那天错过的回答\n音符在风中里飘荡\n旋律随河水流淌\n沿途绮丽景色令人向往\n\n你是冰雪消融唤醒万物第一缕花香\n闯进我的心扉揭开暖春神秘的面纱\n你是清风拂过荷塘掀起回忆化作漫天星光\n璀璨了盛夏如梦一场\n\n湖面上 小船儿晃晃岁月长\n摇碎了时光摇不到你的身旁\n那是我日思夜想的爱呀\n黑夜中 点燃前路的守望\n\n若如当年邂逅红墙碧瓦\n或犹红豆心里悄悄萌芽\n兴许是有意偏要去误会雪月风花\n今朝独留我伴闲暇\n难遗忘曾经的情话\n人去楼空已看罢\n白云苍狗付予潇洒"
 libra_praises_to_life_start_NAME: "岁月赞诗"
 libra_praises_to_life_start_DESC: "当使用$origin_libra_praises_to_life$$ORIGIN$时的默认起始恒星系。"
 origin_libra_praises_to_life_cm: "典礼施设"
 origin_libra_praises_to_life_cm_desc: "这一整套完备的行星基础设施只为一个目的而建造：举办最盛大、最奢华的庆会。"
