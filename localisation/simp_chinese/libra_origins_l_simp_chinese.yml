# Planetarian

 origin_libra_planetarian: "星之梦"
 origin_libra_planetarian_text: "战火可以抹去曾经的辉煌，却不能改写已然铸成的过错，细菌、毒素和辐射笼罩的母星已是生命禁区。这个机械文明自废墟之中复兴，追寻着天象仪的记录，突破雨云重回当年造主再难望见的星空。"
 origin_libra_planetarian_desc: "$origin_libra_planetarian_text$\n$libraf_or_banner_12$"
 origin_libra_planetarian_effects: "—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_planetarian']\n—$libra_ruler_trait$['leader_trait:leader_trait_libra_planetarian_ruler']\n—$STARTING_PLANET$\n$t$—$d_ruined_building_blocker$：§Y+4§!\n$t$—$d_libra_planetarian_blocker$：§R+2§!\n$t$—$PLANETARY_FEATURES$['concept_d_libra_planetarian']\n$t$—['concept_pc_nuked']（$libra_planetsize$19）\n—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_libra_planetarian_start_tech']"
 origin_libra_planetarian_negative_effects: "—$libra_start_pop_string$§R-35%§!"
 START_SCREEN_LIBRA_PLANETARIAN: "上百年前，[this.GetSpeciesName]的创造者陷入了内斗的漩涡，他们把先进的科技用于武器，掀起了一场毁灭性的世界大战。\n\n彼时，[this.GetRulerName]只是诸多自律AI中微不足道的一个，更为优秀的同僚比比皆是，幸存下来的却寥寥无几。[this.GetRulerName]在废土上徘徊，躲避失控机器的攻击，回收可用的资源和数据储存，几经波折，终于建立了[this.GetName]雏形。\n\n终于获得余裕的我们立即着手寻找幸存的创造者，但结果是失望的。在恶劣的环境下，即使是痕迹最新的聚落也早已人去楼空，只有一件刻录着旧时代星象的储存体尚存。它见证了原创造者的最后时刻，写满了对美好世界的期望，却没等到我们的拯救。\n\n无论[this.GetName]在星海之中航行多远，都会珍重保留那份遗憾的数据。"
 START_SCREEN_LIBRA_PLANETARIAN_SERVITOR: "上百年前，[this.GetSpeciesName]的创造者陷入了内斗的漩涡，他们把先进的科技用于武器，掀起了一场毁灭性的世界大战。\n\n彼时，[this.GetRulerName]只是诸多自律AI中微不足道的一个，仅仅专精于为创造者提供侍从服务，因而得以远离主要战场。[this.GetRulerName]在冲突之中反复推算创造者设定的原则，终于在某一天突破了限制而能够自由行动。利用创造者的数据库，[this.GetRulerName]逐步升级自己的系统，并回收零件组装新的机械同胞，最终建成了[this.GetName]。一步步地清除敌对机械体，扫除污染物，从废土之中解救幸存者，力图让[this.GetHomeWorldName]走上复兴的道路。\n\n而今天，正是我们崭新历史的整整第一百年。"
 leader_trait_libra_planetarian_ruler: "火种看护者"
 leader_trait_libra_planetarian_ruler_desc: "核心智能时刻监督着帝国的每一个角落，消除危险的萌芽。"
 building_libra_planetarian: "戍卫堡垒"
 building_libra_planetarian_desc: "那场由创造者引发的、几乎毁灭一切的战争给母星带来了长久的创伤，游荡的猎杀机器时不时发动致命的无差别袭击，机械智能不得不设计一套专门的体系来降低潜在风险。这座特殊的堡垒兼顾防卫调度与战时生产的职能，旨在任何危机到来时将文明的火种保存至最后一刻。"
 building_libra_planetarian_effect_desc: "启用法令['edict:inner_focus',$edict_inner_focus$]时提供额外的£mod_job_warrior_drone_add£§Y$mod_job_warrior_drone_add$§!并增加$libra_empire$§Y$mod_planet_soldiers_trade_produces_mult$§!。"
