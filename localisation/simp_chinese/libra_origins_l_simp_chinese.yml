 libra_origin.0541.desc: "复甦之初，我们不得不在仅有的可能中做出选择，但现在的我们足够强大，足以掌控。\n\n无论是圣水还是圣约都不能再妨碍我们分毫。"
 libra_origin.0541.a: "让我们在黑夜中起舞吧。"
 libra_origin.0541.b: "夕阳西下，但我们不会。"
 libra_origin.0541.c: "不错，再来一品脱鲜血。"
