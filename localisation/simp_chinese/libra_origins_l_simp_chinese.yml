 trait_libra_ex_iteration_energy_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R1§!£trade£ §Y$trade$§!生产§G3§!£energy£ §Y$energy$§!"
 trait_libra_ex_iteration_energy_3: "反应堆探针"
 trait_libra_ex_iteration_energy_3_desc: "此设计专门用于检测反应堆状态并加以调整，确保其能够时刻维持最大功率输出。"
 trait_libra_ex_iteration_minerals_1: "狂暴轴承"
 trait_libra_ex_iteration_minerals_1_desc: "一旦程序启动，这些机械就会以钻穿星核的态势持续工作，知道轴承断裂为止。"
 trait_libra_ex_iteration_minerals_2: "超级精炼器"
 trait_libra_ex_iteration_minerals_2_desc: "这些机械可以从建筑废料、城市垃圾和小行星碎屑中提取矿物，从而回收遗留价值，可维护它们同样需要一笔不小的代价。"
 trait_libra_ex_iteration_minerals_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R1§!£trade£ §Y$trade$§!生产§G2§!£minerals£ §Y$minerals$§!"
 trait_libra_ex_iteration_minerals_3: "终级钻头"
 trait_libra_ex_iteration_minerals_3_desc: "这个超级巨无霸钻头能够轻易粉碎采掘过程中遇到的任何坚硬岩层，不过，携带了这种设备的机械单位通常难以保养，要如何安置和维护它们是一个大问题。"
 trait_libra_ex_iteration_food_1: "营养套组"
 trait_libra_ex_iteration_food_1_desc: "质优而价廉的营养学套件使得这个机械物种能够生产高质量的强化食品。但模组很容易受到环境污染而报废却是一个棘手的问题。"
 trait_libra_ex_iteration_food_2: "丰饶索引"
 trait_libra_ex_iteration_food_2_desc: "每一台机器都是一个小型水培仓，每一分钟都在产出新的有机质。"
 trait_libra_ex_iteration_food_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R1§!£trade£ §Y$trade$§!生产§G2§!£food£ §Y$food$§!"
 trait_libra_ex_iteration_food_3: "乐土播种者"
 trait_libra_ex_iteration_food_3_desc: "智能学习系统使这些机械能够精准把控每一种外星植株的生态偏好，精准调控环境并施予肥料，建成欣欣向荣的高科技农场。"
 trait_libra_ex_iteration_soldier_1: "强袭单元"
 trait_libra_ex_iteration_soldier_1_desc: "战术和战略上的奇迹在历史上出现了无数次，而这个机械物种今天也在模拟那样一次完美的突袭。"
 trait_libra_ex_iteration_soldier_2: "亡命装甲"
 trait_libra_ex_iteration_soldier_2_desc: "以高度军事化为标准而设计，这一机械物种具有强大的战斗力，但过激的任务指令使得它们经常在日常巡逻间擦枪走火地误击友方。"
 trait_libra_ex_iteration_soldier_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R1§!£trade£ §Y$trade$§!生产§G0.01§!£influence£ §Y$influence$§!"
 trait_libra_ex_iteration_soldier_3: "末日指令"
 trait_libra_ex_iteration_soldier_3_desc: "终极的杀戮机器是对它们最好的形容，一旦狂暴模式启动，传感器范围内的所有可能目标都将在瞬间迎来精确而致命的饱和式攻击。"
 trait_libra_ex_iteration_alloys_1: "卓越铸造者"
 trait_libra_ex_iteration_alloys_1_desc: "高度精简的铸造协议可以在极大程度上优化冶金流程，代价则是装配它们的机械体将难以胜任其它工作。"
 trait_libra_ex_iteration_alloys_2: "自动熔炼协议"
 trait_libra_ex_iteration_alloys_2_desc: "装配了这个特殊协议的机械体会源源不断地收集周边的原材料以产出优质合金——无论这材料来自工程废料还是自身零件。"
 trait_libra_ex_iteration_alloys_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£minerals£ §Y$minerals$§!生产§G1§!£alloys£ §Y$alloys$§!"
 trait_libra_ex_iteration_alloys_3: "过载电炉"
 trait_libra_ex_iteration_alloys_3_desc: "该机械物种配置了大功率电弧熔炉，能够以惊人的效率熔解和提炼矿物。如果不考虑熔炉熔穿或爆炸的个别事故，它们可以称得上是最优秀的冶金师。"
 trait_libra_ex_iteration_goods_1: "精密机床"
 trait_libra_ex_iteration_goods_1_desc: "得益于对空间的极致利用，这个机械物种的灵活却脆弱的机械臂能够在消费品加工过程中覆盖任何一个死角。"
 trait_libra_ex_iteration_goods_2: "华丽打印机"
 trait_libra_ex_iteration_goods_2_desc: "在不同的星球上，一天的时间长短不一，而这个机械物种把所有时间都花在了奢侈品的复制上。"
 trait_libra_ex_iteration_goods_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£minerals£ §Y$minerals$§!生产§G2§!£consumer_goods£ §Y$consumer_goods$§!"
 trait_libra_ex_iteration_goods_3: "幻梦机师"
 trait_libra_ex_iteration_goods_3_desc: "这些高端机械专事先进消耗品的生产，无论是现实中存在的还是仅理论可行的，只要材料齐全便不是问题。"
 trait_libra_ex_iteration_unity_1: "压制传输"
 trait_libra_ex_iteration_unity_1_desc: "这个机械物种使用的通讯方式中应用了强而有力的压缩和反编译手段，即使是相同型号的机械单位也很难实施破解。"
 trait_libra_ex_iteration_unity_2: "蜂巢拟网"
 trait_libra_ex_iteration_unity_2_desc: "在相当程度上，这套机械社会设计参考了蚂蚁和蜂群的行为方式，他们更加团结，但原本的缺点也更明显。"
 trait_libra_ex_iteration_unity_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£minerals£ §Y$minerals$§!生产§G2§!£unity£ §Y$unity$§!"
 trait_libra_ex_iteration_unity_3: "隐蔽后门"
 trait_libra_ex_iteration_unity_3_desc: "通过预留的程序后门，处于支配地位的一方可以对其他机械单位的指令肆意改动从而维持高度同调，缺点是程序崩溃或感染病毒的几率也因此大大提升。"
 trait_libra_ex_iteration_trade_1: "虚拟矿站"
 trait_libra_ex_iteration_trade_1_desc: "这个机械物种非常擅长通过无谓的计算来提取莫须有的经济价值。"
 trait_libra_ex_iteration_trade_2: "投机算法"
 trait_libra_ex_iteration_trade_2_desc: "这一机械物种具有强大的商业推演能力，能够很好地利用金钱生产金钱，也会无意识地回避繁琐的工作。"
 trait_libra_ex_iteration_trade_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£energy£ §Y$energy$§!生产§G2§!£trade£ §Y$trade$§!"
 trait_libra_ex_iteration_trade_3: "经济蠕虫"
 trait_libra_ex_iteration_trade_3_desc: "无论是贸易计算能力还是物流运输能力，这个机械物种都拥有毋庸置疑的优势，能够像蠕虫病毒一样迅速掏空一整个殖民地的经济储备。"
 trait_libra_ex_iteration_physics_1: "超频演算"
 trait_libra_ex_iteration_physics_1_desc: "如果一个处理器不够用，多装几个上去总能解决问题，即便大幅超频易损的核心元件将显著缩短设备的预期寿命。"
 trait_libra_ex_iteration_physics_2: "谜题数列"
 trait_libra_ex_iteration_physics_2_desc: "数学的奥妙深不可测，为了解开更多的谜题，这个机械物种将所有的待机时间都投入在无止尽的计算之中。"
 trait_libra_ex_iteration_physics_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£energy£ §Y$energy$§!生产§G2§!£physics_research£ §Y$physics_research$§!"
 trait_libra_ex_iteration_physics_3: "拟真主脑"
 trait_libra_ex_iteration_physics_3_desc: "通过模拟有机物种的神经回路，这个机械物种实现了运算和学习能力的双重飞跃……虽然也一并复制了它们那柔弱的中枢神经系统。"
 trait_libra_ex_iteration_society_1: "分析程序"
 trait_libra_ex_iteration_society_1_desc: "这一机械物种的每个终端都装配了高度专业化的模拟程序，通过对基础生产活动的分析总结，可以为社会研究提供大量的实验数据，虽然这降低了单位的适应性。"
 trait_libra_ex_iteration_society_2: "社会实验单元"
 trait_libra_ex_iteration_society_2_desc: "这些金属质的行为艺术家活跃在可能的任何角落，以搜集实验数据为名做出各种各样的怪诞行动。"
 trait_libra_ex_iteration_society_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£energy£ §Y$energy$§!生产§G2§!£society_research£ §Y$society_research$§!"
 trait_libra_ex_iteration_society_3: "进化解码器"
 trait_libra_ex_iteration_society_3_desc: "从生物基因、社会演化等一系列过程中，这个机械物种提取出精确的规律曲线，而执行这样的工作需要极为庞大的算力支持。"
 trait_libra_ex_iteration_engineering_1: "工作齿轮"
 trait_libra_ex_iteration_engineering_1_desc: "这些机械的工程学验证组件会一直运转，直到它们彻底磨损为止。"
 trait_libra_ex_iteration_engineering_2: "自检预案"
 trait_libra_ex_iteration_engineering_2_desc: "这个机械物种每天都会进行杀毒或自我审视以免遭到程序入侵，尽管这种每天重复多次的全面扫描实完全超出了必要限度。"
 trait_libra_ex_iteration_engineering_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£energy£ §Y$energy$§!生产§G2§!£engineering_research£ §Y$engineering_research$§!"
 trait_libra_ex_iteration_engineering_3: "实验工程模块"
 trait_libra_ex_iteration_engineering_3_desc: "集合了一个时代里最先进的工程学研究框架，这个机械物种得以开展史无前例的大规模实验，但养护这些器材也是实实在在的麻烦。"
 trait_libra_ex_iteration_upkeep: "低廉成本"
 trait_libra_ex_iteration_upkeep_desc: "对维护成本的极致压缩使得这个机械物种即便处于恶劣环境下也不会产生太高的维护费用。"
 trait_libra_ex_iteration_housing: "复合关节"
 trait_libra_ex_iteration_housing_desc: "折叠、折叠再折叠，这一机械物种可以将自身压缩到极小的空间内以便安置和运输，只可惜实现这一切的金属关节并不牢固。"
 trait_libra_ex_iteration_happiness: "快乐协议"
 trait_libra_ex_iteration_happiness_desc: "这一机械物种相比通常情况更容易受到环境影响而作出正面的应激反应，因此易于管理。"
 trait_libra_ex_iteration_maintenance: "高效维护"
 trait_libra_ex_iteration_maintenance_desc: "这一机械物种具有高度优化、专为提升维护效率而标定的建设基准，这使它们在除此之外的领域中乏善可陈。"
 trait_libra_ex_iteration_empire_size: "精简数据"
 trait_libra_ex_iteration_empire_size_desc: "这一机械物种装配了空前强大的处理器，能够并行推进多个复杂项目。"
 trait_libra_ex_iteration_rare: "先进化合"
 trait_libra_ex_iteration_rare_desc: "这些包含大量技术结晶却缺乏安全性的化工机械可以以惊人的效率合成稀有资源。"
 trait_libra_ex_iteration_rare_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.02§!£exotic_gases£ §G0.02§!£rare_crystals£ §G0.02§!£volatile_motes£ §Y稀有资源§!"
 trait_libra_ex_iteration_productive: "极速处理"
 trait_libra_ex_iteration_productive_desc: "这一机械物种装配了空前强大的处理器，能够并行推进多个复杂项目。"
 councilor_libra_extreme_iteration: "零号改造员"
 councilor_libra_extreme_iteration_female: "$councilor_libra_extreme_iteration$"
 councilor_libra_extreme_iteration_desc: "$councilor_libra_extreme_iteration$是我们帝国中最杰出的机械师的荣誉职位，其行动指引着每一个机械个体追寻更快更强的未来。"
 councilor_libra_extreme_iteration_unlock_title: "§H来自$origin_libra_extreme_iteration$$ORIGIN$的内阁席位§!"
 councilor_libra_extreme_iteration_conditional_tooltip: "领袖是§Y$MACHINE$§!物种"
 concept_councilor_libra_extreme_iteration: "$councilor_libra_extreme_iteration$"
 concept_councilor_libra_extreme_iteration_desc: "$libra_disable_for_gestalt$\n\n$COUNCIL_POSITION_MODIFIER_BASE$\n$t$—$mod_planet_pops_robotics_upkeep_mult$: §G-1%§!\n$t$—$MOD_POP_AMENITIES_USAGE_ROBOTIC_MULT$: §G-1%§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$official_with_icon$\n$t$$commander_with_icon$\n$t$$scientist_with_icon$\n\n§L$councilor_libra_extreme_iteration_desc$§!"

# centurion

 origin_libra_centurion: "百夫长"
 origin_libra_centurion_text: "勇气，铸成破军的锋刃；纪律，造就永恒的壁垒；前进，为了胜利的荣光。\n我们为战斗而生，若不能功成列青史，便要杀身以成仁，绝无临阵脱逃之可能，绝无苟且偷生之希望。"
 origin_libra_centurion_desc: "$origin_libra_centurion_text$\n$libraf_or_banner_18$"
 origin_libra_centurion_effects: "—$libra_army_type$['concept_libra_centurion_army']\n—$STARTING_PLANET$£building£ ['building:building_libra_centurion_mirror']\n—$libra_extra_council_position$['concept_councilor_libra_primus_pilus']、['concept_councilor_libra_praetorian_commander']\n—$libra_decision$\n$t$—§Y$decision_libra_centurion_a$§!，增加§Y内阁议程进度§!\n$t$—§Y$decision_libra_centurion_b$§!，提升§Y$planetary_ascension$§!\n$t$—§Y$decision_libra_centurion_c$§!，获得 £alloys£ £consumer_goods£ £trade£ 产出\n$t$—§Y$decision_libra_centurion_d$§!，为£leader£§Y领袖§!提供经验\n—从以下途径获得决议次数：\n$t$—攻陷星球，每次§G+1§!\n$t$—毁灭文明，每次§G+2§!\n$t$—发动战争，每§Y13§!年可§G+3§!\n$t$—时间流逝，每§Y8~10§!年§G+1§!\n—启用['concept_libra_military_traditions']无需§Y前置科技§!，完成时触发§Y额外事件§!"
 START_SCREEN_LIBRA_CENTURION: "可曾听闻枪火齐放之声？那是弱者畏惧而强者向往的乐曲。\n\n在这弱肉强食的世界上，自身的安全只能凭借自身的力量来确保，否则任何愿景都是明日黄花；在这孤立无援的宇宙间，唯有强大才是自立之本，否则一切皆如浮云般挥之即去。\n\n战争，是实现每一个[this.GetSpeciesName]人生价值的最好方式：它给了我们一项经久不衰的娱乐，一个勠力同心的目标，使我们总是众志成城地一致对外。千年以来，士兵始终是最火热的职业，将军从来是最高尚的梦想，而战场，则是最荣耀的职场——抑或坟场。\n\n苍穹长眺峰烟过，紫宙报谒血铁存。"
 councilor_libra_centurion_unlock_title: "§H来自$origin_libra_centurion$$ORIGIN$的内阁席位§!"
 councilor_libra_primus_pilus: "首席军团长"
 councilor_libra_primus_pilus_female: "$councilor_libra_primus_pilus$"
 councilor_libra_primus_pilus_desc: "$councilor_libra_primus_pilus$是帝国军队的最高指挥官，一位富有经验的统帅者。"
 councilor_libra_primus_pilus_conditional_tooltip: "领袖是£commander£§Y$commander$§!或技能等级达到§Y8§!级"
 concept_councilor_libra_primus_pilus: "$councilor_libra_primus_pilus$"
 concept_councilor_libra_primus_pilus_desc: "$COUNCIL_POSITION_MODIFIER_BASE$\n$t$—$mod_country_alloys_produces_mult$: §G+2%§!\n$t$—$MOD_COUNTRY_WAR_EXHAUSTION_MULT$: §G-2%§!\n$t$—$mod_country_power_projection_influence_produces_mult$: §G+2%§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$official_with_icon$\n$t$$commander_with_icon$\n$t$$scientist_with_icon$\n\n$COUNCIL_POSITION_REQUIREMENTS$$councilor_libra_primus_pilus_conditional_tooltip$\n\n§L$councilor_libra_primus_pilus_desc$§!"
 councilor_libra_praetorian_commander: "禁卫指挥官"
 councilor_libra_praetorian_commander_female: "$councilor_libra_praetorian_commander$"
 councilor_libra_praetorian_commander_desc: "$councilor_libra_praetorian_commander$主导后勤事务，旨在提升军队的训练效率和战斗能力。"
 councilor_libra_praetorian_commander_conditional_tooltip: "领袖是£commander£§Y$commander$§!或拥有§Y$ethic_militarist$§!思潮"
 concept_councilor_libra_praetorian_commander: "$councilor_libra_praetorian_commander$"
 concept_councilor_libra_praetorian_commander_desc: "$COUNCIL_POSITION_MODIFIER_BASE$\n$t$—$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+2%§!\n$t$—$MOD_ARMY_DAMAGE_TAKEN_MULT$: §G-2%§!\n$t$—$mod_planet_soldiers_consumer_goods_produces_add$: §G+0.20§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$official_with_icon$\n$t$$commander_with_icon$\n$t$$scientist_with_icon$\n\n$COUNCIL_POSITION_REQUIREMENTS$$councilor_libra_praetorian_commander_conditional_tooltip$\n\n§L$councilor_libra_praetorian_commander_desc$§!"
 concept_libra_centurion_army: "$origin_libra_centurion$$ARMIES$"
 concept_libra_centurion_army_desc: "强大的陆军进攻部队，拥有极高的生命值和士气，包括：\n$t$—§Y$libra_centurion_army$§!\n$t$—§Y$libra_centurion_elite_army$§!（$libra_prerequisites$£society_research£ ['technology:tech_command_matrix']）"
 libra_centurion_army: "无畏战团"
 libra_centurion_army_desc: "这些战士是从帝国各个作战部队中提拔而来的佼佼者。"
 libra_centurion_elite_army: "先锋军团"
 libra_centurion_elite_army_desc: "通过多种途径的强化和训练，先锋军团拥有足以踏破任何防线的强大战斗力。"
 building_libra_centurion_mirror: "军团宝鉴"
 building_libra_centurion_mirror_desc: "原本是建造在一处资源矿脉上的古迹，经历数个时代的维护和翻修，其中收录的典籍曾被广泛复制和学习。"
 LIBRA_CENTURION_ORIGIN_EFFECT_TITLE: "军事进展"
 LIBRA_CENTURION_ORIGIN_EFFECT_DESC: "我们从军事行动中取得了新突破。\n\n§H获得$origin_libra_centurion$决议次数§!"
