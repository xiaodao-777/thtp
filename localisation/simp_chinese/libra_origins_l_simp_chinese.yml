 libra_planetarian_start_NAME: "余烬之下的太阳系"
 libra_planetarian_start_DESC: "当使用$origin_libra_planetarian$$ORIGIN$时的默认起始恒星系。"
 d_libra_planetarian_blocker: "£blocker£ 失控战争机器"
 d_libra_planetarian_blocker_desc: "这些危险的武装机器人在行星上游荡了数百年，无差别袭击任何遭遇到的对象。"
 d_libra_planetarian: "星象馆遗址"
 d_libra_planetarian_desc: "当这个星球的原主人还处在黄金时代的时候，这座建造在百货商场顶部的星象馆曾向无数访客展示星辰大海的胜景，如今却只有断壁残垣。"
 concept_d_libra_planetarian: "$d_libra_planetarian$"
