 libra_origin.0723.name: "第二回的开始"
 libra_origin.0723.desc: "在前一个世界里，先祖花费千万年走到了星际食物链的顶端，而在轮回之后的今天，我们又在此启程。\n\n我们知道自己并不孤独，也设想过其他旧世界的幸存者的存在，这些事情在以往无暇顾及，现在则有充足的精力可以一探究竟。"
 libra_origin.0723.a: "出发！"
