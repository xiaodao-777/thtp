 concept_libra_shadow_consciousness_edicts: "$sr_dark_matter$法令"
 concept_libra_shadow_consciousness_edicts_desc: "消耗 £sr_dark_matter£ §Y$sr_dark_matter$§!的特殊法令，包括：\n$t$—['edict:libra_shadow_consciousness_1',$edict_libra_shadow_consciousness_1$]\n$t$—['edict:libra_shadow_consciousness_2',$edict_libra_shadow_consciousness_2$]\n$t$—['edict:libra_shadow_consciousness_3',$edict_libra_shadow_consciousness_3$]\n$t$—['edict:libra_shadow_consciousness_4',$edict_libra_shadow_consciousness_4$]\n$t$—['edict:libra_shadow_consciousness_5',$edict_libra_shadow_consciousness_5$]\n$t$—['edict:libra_shadow_consciousness_6',$edict_libra_shadow_consciousness_6$]"
 edict_libra_shadow_consciousness_1: "暗影矩阵"
 edict_libra_shadow_consciousness_1_desc: "暗物质处理单元提供的电子模糊性产生了即使最优秀的代码破解者也难以应对的软件。"
 edict_libra_shadow_consciousness_2: "暗之适应"
 edict_libra_shadow_consciousness_2_desc: "我们自黑洞周边的恶劣环境演化而来，不会被寻常的环境阻拦脚步。"
 edict_libra_shadow_consciousness_3: "帷幕工程"
 edict_libra_shadow_consciousness_3_desc: "在建造大型结构的过程中，巨大的能源消耗往往是影响施工进度的主要因素，暗物质能源可以很好地解决这一问题。"
 edict_libra_shadow_consciousness_4: "深渊凝视"
 edict_libra_shadow_consciousness_4_desc: "暗物质共振特性不仅仅可以用于隐形探测，协助我们的传感器和作战电脑以分析敌舰弱点也是不错的选择。"
 edict_libra_shadow_consciousness_5: "混沌整合"
 edict_libra_shadow_consciousness_5_desc: "在不同节点的优先任务中，借助暗物质强化的神经系统迅速梳理出优先事项并加以执行。"
 edict_libra_shadow_consciousness_6: "湮灭释能"
 edict_libra_shadow_consciousness_6_desc: "蕴藏在暗物质构成的键中间的能量可以被解开，成为有价值的产出。"
 libra_shadow_consciousness_civic_negative_effects: "$t$—在开局§Y20§!年内§R降低§! £sr_dark_matter£ §Y$sr_dark_matter$§!产出"
 libra_shadow_consciousness_negative_modifier: "暗影过载"
 libra_shadow_consciousness_negative_modifier_desc: "一直以来，蜂巢思维驱使工蜂从各种各样的途径中大量收集暗物质，这给它们造成了不小负担。"
 civic_libra_shadow_consciousness_a: "寂灭军团"
 civic_libra_shadow_consciousness_a_desc: "使用暗物质武装自己的战斗工蜂，这个蜂巢思维将所有敌视之物化归虚无。\n$libraf_oc_banner_2$"
 civic_tooltip_libra_shadow_consciousness_a:  "$t$—$libra_start_pop_string$§G+350§!\n$t$—$STARTING_PLANET$§G+1§!£building£ ['building:building_foundry_1']\n$t$—$libra_edict$\n$tt$—['edict:libra_shadow_consciousness_a_1',$edict_libra_shadow_consciousness_a_1$]\n$tt$—['edict:libra_shadow_consciousness_a_2',$edict_libra_shadow_consciousness_a_2$]\n$tt$—['edict:libra_shadow_consciousness_a_3',$edict_libra_shadow_consciousness_a_3$]\n$t$—$libra_agenda$§Y$council_agenda_agenda_libra_shadow_consciousness_a_name$§!，将 £sr_dark_matter£ §Y$sr_dark_matter$§!转化为 £alloys£ §Y$alloys$§!"
 edict_libra_shadow_consciousness_a_1: "幽暮行军"
 edict_libra_shadow_consciousness_a_1_desc: "我们的猎手自黑暗中潜伏，对敌人发起致命的袭击。"
 edict_libra_shadow_consciousness_a_2: "暗牙之蚀"
 edict_libra_shadow_consciousness_a_2_desc: "强大的暗物质在转化为能量释放的那一刻，将给我们的敌人造成难以想象的伤害。"
 edict_libra_shadow_consciousness_a_3: "虚空集群"
 edict_libra_shadow_consciousness_a_3_desc: "以暗物质为滋养，蜂巢思维可以驱动无与伦比的庞大舰队。"
 council_agenda_agenda_libra_shadow_consciousness_a_name: "拆解重构"
 council_agenda_agenda_libra_shadow_consciousness_a_desc: "暗物质重组对蜂巢思维来说并不是一项陌生的技术，唯一的问题在于转化效率并不稳定。"
 agenda_libra_shadow_consciousness_a_finish_effect: "将§Y75%§!的 £sr_dark_matter£ §Y$sr_dark_matter$§!储存转化为§G500%~600%§!的 £alloys£ §Y$alloys$§!"
 civic_libra_shadow_consciousness_b: "终界蔓生"
 civic_libra_shadow_consciousness_b_desc: "蜂巢思维的触角无所不及，就像有光亮的地方必有阴影存在。\n$libraf_oc_banner_2$"
 civic_tooltip_libra_shadow_consciousness_b:  "$t$—$libra_start_pop_string$§G+350§!\n$t$—$STARTING_PLANET$§G+1§!£building£ ['building:building_hive_node']\n$t$—$libra_edict$\n$tt$—['edict:libra_shadow_consciousness_b_1',$edict_libra_shadow_consciousness_b_1$]\n$tt$—['edict:libra_shadow_consciousness_b_2',$edict_libra_shadow_consciousness_b_2$]\n$tt$—['edict:libra_shadow_consciousness_b_3',$edict_libra_shadow_consciousness_b_3$]\n$t$—$libra_decision$§Y$decision_libra_shadow_consciousness_b$§!，将 £sr_dark_matter£ §Y$sr_dark_matter$§!转化为 £pop£ §Y$POP$§!"
 decision_libra_shadow_consciousness_b: "蔓延之触"
 decision_libra_shadow_consciousness_b_desc: "蜂巢的触手延展而出，将荒野吸纳入主脑的领域。"
 decision_libra_shadow_consciousness_b_effect: "创建§G300§!个 £pop£ §Y$POP$§!"
 decision_libra_shadow_consciousness_b_modifier: "影子强化"
 decision_libra_shadow_consciousness_b_modifier_desc: "暗物质的注入刺激了这个殖民地的繁殖个体，使它们能够在更短时间内繁殖更多子嗣。"
 edict_libra_shadow_consciousness_b_1: "暗物质锻造"
 edict_libra_shadow_consciousness_b_1_desc: "暗物质作为我们铸造厂的助熔剂具有独特的结合性能，可以显著增加产量。"
 edict_libra_shadow_consciousness_b_2: "暗物质织网"
 edict_libra_shadow_consciousness_b_2_desc: "使繁殖子个体编织富含暗物质的几丁质结构，如此将有效提升新生子个体的存活率。"
 edict_libra_shadow_consciousness_b_3: "暗物质同调"
 edict_libra_shadow_consciousness_b_3_desc: "借助暗物质强化的突触，蜂巢思维可以在所有个体间共享经验。"
 civic_libra_shadow_consciousness_c: "迷纱思维"
 civic_libra_shadow_consciousness_c_desc: "这个蜂巢思维将暗物质作为自身思维活动的催化剂，从而获取更高的思维强度。\n$libraf_oc_banner_2$"
 civic_tooltip_libra_shadow_consciousness_c:  "$t$—$libra_start_pop_string$§G+350§!\n$t$—$STARTING_PLANET$§G+1§!£building£ ['concept_research_lab',$building_research_lab_1$]\n$t$—$libra_edict$\n$tt$—['edict:libra_shadow_consciousness_c_1',$edict_libra_shadow_consciousness_c_1$]\n$tt$—['edict:libra_shadow_consciousness_c_2',$edict_libra_shadow_consciousness_c_2$]\n$tt$—['edict:libra_shadow_consciousness_c_3',$edict_libra_shadow_consciousness_c_3$]\n—$t$§d$leader_trait_libra_shadow_consciousness$§!基于§Y$councilor_gestalt_cognitive_with_icon$$MOD_COUNCILOR_SKILL_ADD$§!提升§Y$mod_planet_researchers_produces_mult$§!"
 edict_libra_shadow_consciousness_c_1: "神经幕网"
 edict_libra_shadow_consciousness_c_1_desc: "共享、互补的意识网络助力蜂巢思维走向高峰。"
 edict_libra_shadow_consciousness_c_2: "重子分析"
 edict_libra_shadow_consciousness_c_2_desc: "将搜集到的暗物质再次注入脑部工蜂，强化它们的计算能力。"
 edict_libra_shadow_consciousness_c_3: "演化增强"
 edict_libra_shadow_consciousness_c_3_desc: "我们的脑细胞可以像暗物质一样演变，以最巅峰的形态构筑我们最高效的思维。"
 civic_libra_shadow_consciousness_d: "暮光凝识"
 civic_libra_shadow_consciousness_d_desc: "借助暗物质强化免疫反应，这个蜂巢思维在面对未知时表现出极强的统一性，它们的工蜂也比一般情况下更为活跃。\n$libraf_oc_banner_2$"
 civic_tooltip_libra_shadow_consciousness_d:  "$t$—$libra_start_pop_string$§G+350§!\n$t$—$STARTING_PLANET$§G+1§!£district£ ['concept_generator_district',$district_generator$]\n$t$—$libra_edict$\n$tt$—['edict:libra_shadow_consciousness_d_1',$edict_libra_shadow_consciousness_d_1$]\n$tt$—['edict:libra_shadow_consciousness_d_2',$edict_libra_shadow_consciousness_d_2$]\n$tt$—['edict:libra_shadow_consciousness_d_3',$edict_libra_shadow_consciousness_d_3$]\n$t$—$libra_agenda$§Y$council_agenda_agenda_libra_shadow_consciousness_d_name$§!，消耗 £sr_dark_matter£ §Y$sr_dark_matter$§!为领袖添加经验"
 council_agenda_agenda_libra_shadow_consciousness_d_name: "深渊凝想"
 council_agenda_agenda_libra_shadow_consciousness_d_desc: "更多地更进一步地使用暗物质干预工蜂的精神，蜂巢思维会变得更加强大。"
 agenda_libra_shadow_consciousness_d_finish_effect: "消耗至多§R1500§!£sr_dark_matter£ §Y$sr_dark_matter$§!\n每消耗§Y50§!£sr_dark_matter£ §Y$sr_dark_matter$§!就为§Y技能等级§!最低的领袖添加§G2500§!经验"
 edict_libra_shadow_consciousness_d_1: "黑曜石之纱"
 edict_libra_shadow_consciousness_d_1_desc: "在森林中隐藏自己，应该覆没泥土。在太空中隐藏自己，应该身披虚空。"
 edict_libra_shadow_consciousness_d_2: "质量强化"
 edict_libra_shadow_consciousness_d_2_desc: "接受暗物质强化的工蜂将会拥有更高的生产效率，更好地建设蜂巢整体。"
 edict_libra_shadow_consciousness_d_3: "深层之音"
 edict_libra_shadow_consciousness_d_3_desc: "面对未知的接触，我们的子个体比起本能行动更应该倾听主脑的声音。"

# dragonborn

 origin_libra_dragonborn: "龙裔"
 origin_libra_dragonborn_text: "古老世界的遗族、虚空之龙的末裔，宇宙坍缩未能将其击倒，新星爆发未能使其灭亡，但，终究不是这个世界的居民，新生的银河没有他们的容身之处；而在亿万年的适应与演化之后，适应了这个维度的他们终于东山再起。"
 origin_libra_dragonborn_desc: "$origin_libra_dragonborn_text$\n$libraf_or_banner_7$"
 origin_libra_dragonborn_effects: "—$libra_start_leader_string$§G+6§!\n—$libra_start_fleet_string$替换为§G2§!£military_ship£§Y$libra_dragonborn_small$§!\n—$libra_traditions$['concept_libra_dragonborn_tradition']\n—$libra_country_modifier$['concept_origin_libra_dragonborn_effect']\n—$SPECIES_TRAITS$['trait:trait_libra_dragonborn_0']\n—$STARTING_PLANET$\n$t$—$libra_planetsize$27\n$t$—$PLANETARY_FEATURES$['concept_d_libra_dragonborn_home']\n—$HOME_SYSTEM$['concept_arc_site_libra_dragonborn']['concept_archaeology_site']\n—$libra_extra_council_position$['concept_councilor_libra_dragonborn']"
 origin_libra_dragonborn_negative_effects: "—$libra_start_pop_string$§R-1200§!\n—$STARTING_PLANET$['concept_pc_nuked']"
 START_SCREEN_LIBRA_DRAGONBORN: "如果要讨论历史的长度，这世界上没有物种能比[this.GetSpeciesName]更加长寿；若是要考量遭际的波澜，则宇宙中无一文明经历过[this.GetSpeciesName]的窒碍。\n\n在旧世界里，我们是唯一的至尊，既不需要借助科学的力量，也不依靠秘术的增幅，仅凭自然演化就抵达了生物形态的终点，我们曾经的地位就像世界存在本身一样不可撼动，“龙”是唯一配得上我们的名字。\n\n但，毁灭也不期而至：那个曾经孕育我们族群的宇宙衰落了，它以越来越快的速度坍缩，最终在爆炸中毁于一旦，只留下[this.GetSpeciesName]孤零零地漂泊。终于，我们流落至此，可灾厄却只是刚刚开始。过去宇宙的物理法则同这里有所差异，而仅仅是这微小的不同就带来了巨大的负担，神经变得迟钝，鳞甲变得脆弱……无数同裔在困苦中死亡，[this.GetSpeciesName]也再不是过去的霸主了。\n\n所幸，天无绝人之路，在这充满敌意的世界一隅，我们找到了自己的安身之处。我们放弃来原本悠游星际的骄傲，降落至地表蹒跚爬行，在一代又一代的演化中有意识地调整血脉，一点点地适应这个维度。\n\n日月如梭，转眼已是亿万年之久，我们——回来了。"
 libra_dragonborn_start_NAME: "寻龙旧地"
 libra_dragonborn_start_DESC: "当使用$origin_libra_dragonborn$$ORIGIN$时的默认起始恒星系。"
 NAME_Libra_Dragonborn_Inital: "伊始之龙"
 origin_libra_dragonborn_ship_effect: "初入虚空"
 origin_libra_dragonborn_effect: "旧日余章"
 origin_libra_dragonborn_effect_desc: "长久以来我们挣扎求生，但现在我们终于得以重拾过往的荣耀。"
 concept_origin_libra_dragonborn_effect: "$origin_libra_dragonborn_effect$"
 concept_origin_libra_dragonborn_effect_desc: "—$mod_leaders_cost_mult$: §R+100%§!\n—$MOD_SHIP_ARCHAEOLOGICAL_SITE_CLUES_ADD$: §G+4§!\n—$mod_country_unity_produces_mult$: §G+20%§!\n—$MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!\n—将在§Y10§!年后过期\n\n§L$origin_libra_dragonborn_effect_desc$§!"
 trait_libra_dragonborn_0: "天龙血裔"
 trait_libra_dragonborn_0_desc: "这个物种是虚空之龙的末裔，历经时间的蹂躏存活至今；虽然淡薄，但古老的血液仍然在他们体内流淌。"
 trait_libra_dragonborn_1: "虚空天龙"
 trait_libra_dragonborn_1_desc: "经过漫长的适应与高度的基因改造，这个物种已经能够发挥出过去全盛时代的力量。"
 trait_libra_dragonborn_2: "赛博龙"
 trait_libra_dragonborn_2_desc: "这个物种是经过植入体强化的以太龙裔，他们完全克服了太古时期水土不服的缺陷。"
 trait_libra_dragonborn_3: "机械天龙"
 trait_libra_dragonborn_3_desc: "机械龙也是龙！为了回归过去的荣耀，这个物种将合成材料作为自己重返巅峰的踏板。"
 trait_libra_dragonborn_4: "虚域之龙"
 trait_libra_dragonborn_4_desc: "这些龙族凭借着无比的灵能力量翱翔于洲际，他们夹杂着灵爆的吐息无坚不摧。"
 trait_libra_dragonborn_5: "高维龙裔"
 trait_libra_dragonborn_5_desc: "比起回归，他们选择了超越。这个物种借用虚境的力量来实现自身存在的飞跃。"
 trait_libra_dragonborn_6: "龙血觉醒"
 trait_libra_dragonborn_6_desc: "正因为我们是我们——矗立于此，龙的传承才有意义。不借助任何外来力量的辅助，这个物种实现了自身存在的复兴。"
 libra_dragonborn_small: "小龙"
 libra_dragonborn_small_cap: "$libra_dragonborn_small$"
 libra_dragonborn_small_plural: "小龙"
 libra_dragonborn_small_desc: "翱翔于虚空——我们重返巅峰的重要一步。虽然起初数量较少，但已有部分个体能够在设备的协助下于无重力环境中自由活动。"
 SHIP_GRAPHICS_LIBRA_DRAGONBORN_SMALL_DESC: "$libra_dragonborn_small_desc$"
 LIBRA_DB_SMALL_MID_X1M4S8: "龙息"
 LIBRA_DB_SMALL_MID_L2M4P8: "小龙"
 libra_dragonborn_medium: "巨龙"
 libra_dragonborn_medium_cap: "$libra_dragonborn_medium$"
 libra_dragonborn_medium_plural: "巨龙"
 libra_dragonborn_medium_desc: "我们曾对太古的荣光念念不忘，如今则再造了自己的辉煌。至少，我们族群中的绝大多数都获得了遨游太虚的能力。"
 SHIP_GRAPHICS_LIBRA_DRAGONBORN_MEDIUM_DESC: "$libra_dragonborn_medium_desc$"
 LIBRA_DB_MEDIUM_MID_T1L4M4P8: "龙息"
 LIBRA_DB_MEDIUM_MID_X2H6S4S4: "族母"
 libra_dragonborn_large: "天龙"
 libra_dragonborn_large_cap: "$libra_dragonborn_large$"
 libra_dragonborn_large_plural: "天龙"
 libra_dragonborn_large_desc: "振兴之后，我们的目标理所当然的就变成了超越。天龙，这一伟大的形态在先史中寥寥无几，在现世中亦不可多得。"
 SHIP_GRAPHICS_LIBRA_DRAGONBORN_LARGE_DESC: "$libra_dragonborn_large_desc$"
 LIBRA_DB_LARGE_MID: "天龙"
 libra_dragonborn_aura: "言灵"
 libra_dragonborn_aura_desc: "起始于上个世界的咒术，在这个新生的世界里同样有效。"
 LIBRA_DRAGONBORN_AURA_1: "迷失之语"
 LIBRA_DRAGONBORN_AURA_1_DESC: "巨龙低语，使敌人迷失方向。"
 LIBRA_DRAGONBORN_AURA_2: "失衡之言"
 LIBRA_DRAGONBORN_AURA_2_DESC: "这些类似声音的波动可使触及者失去平衡，在诸多选项中选择较差的一项。"
 LIBRA_DRAGONBORN_AURA_3: "忘却之声"
 LIBRA_DRAGONBORN_AURA_3_DESC: "忘记吧——你的铠甲与利刃，你不是屠龙的勇士，你是祂们卑微的仆从。"
 LIBRA_DRAGONBORN_AURA_4: "苏生之音"
 LIBRA_DRAGONBORN_AURA_4_DESC: "以流传自先史纪元的祝福庇护众生。"
 LIBRA_DRAGONBORN_AURA_5: "命定之辞"
 LIBRA_DRAGONBORN_AURA_5_DESC: "会达到的地方，就不可能偏离。"
