 civic_libra_eden_accord_f: "星海珍藏"
 civic_libra_eden_accord_f_desc: "这个机械智能从星系各处搜集奇珍异宝，以此取悦主人们。\n$libraf_oc_banner_10$"
 civic_tooltip_libra_eden_accord_f: "—获得§Y$RELICS$§!或§Y$specimens$§!后的 £time£§Y3§!年内：\n$t$—$MOD_POP_HAPPINESS$: §G+15%§!\n$t$—$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+15%§!\n$t$—$mod_planet_evaluators_unity_produces_add$: §G+1§!\n$t$—§Y持续时间§!可叠加至 £time£§Y15§!年\n—举办§Y巡回展览§!时随机提升§G+3§!§Y$planetary_ascension$§!\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_galactic_archivism']"
