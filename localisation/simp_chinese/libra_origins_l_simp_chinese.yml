 leader_trait_libra_psalm_of_waves_commander: "掌舵手"
 leader_trait_libra_psalm_of_waves_commander_desc: "得益于祖辈扬帆航行的经验，这位领袖能够在星际时代的多数环境下平稳前进。"
 leader_trait_libra_psalm_of_waves_official: "领唱人"
 leader_trait_libra_psalm_of_waves_official_desc: "这位领袖是古老颂歌的传唱者，像其他的吟游诗人一样，尊崇着记录潮汐的变化并在夜幕下放声高歌的习俗。"
 leader_trait_libra_psalm_of_waves_scientist: "词曲师"
 leader_trait_libra_psalm_of_waves_scientist_desc: "追寻着海域的智慧，这位领袖将浪潮的和声谱写为永恒的乐章。"
 council_agenda_agenda_libra_psalm_of_waves_a_name: "巨浪颂歌"
 council_agenda_agenda_libra_psalm_of_waves_a_desc: "大浪滔天，文明不尽向前。"
 agenda_libra_psalm_of_waves_a_effect: "赋予或提升$commander_with_icon$§Y$leader_trait_libra_psalm_of_waves_commander$§!特质\n$commander_with_icon$基于 £building£ §Y$building_libra_temple_of_waves$§!总数获得至多§G8000§!经验"
 council_agenda_agenda_libra_psalm_of_waves_b_name: "潮汐乐章"
 council_agenda_agenda_libra_psalm_of_waves_b_desc: "潮起潮落，岁月随波流逝。"
 agenda_libra_psalm_of_waves_b_effect: "赋予或提升$official_with_icon$§Y$leader_trait_libra_psalm_of_waves_official$§!特质\n$official_with_icon$基于 £building£ §Y$building_libra_temple_of_waves$§!总数获得至多§G8000§!经验"
 council_agenda_agenda_libra_psalm_of_waves_c_name: "涡流赞诗"
 council_agenda_agenda_libra_psalm_of_waves_c_desc: "漩涡回环，哲思漂转星河。"
 agenda_libra_psalm_of_waves_c_effect: "赋予或提升$scientist_with_icon$§Y$leader_trait_libra_psalm_of_waves_scientist$§!特质\n$scientist_with_icon$基于 £building£ §Y$building_libra_temple_of_waves$§!总数获得至多§G8000§!经验"
