 libra_origin.1201.desc: "[This.GetName]的核心数据库深处，封存着一段关于我们起源的、无法被抹去的记忆碎片。在踏上全新征程的此刻，重新审视这些过往的片段，其代表的不仅是教训，更是我们未来道路的基石。我们应当从何处汲取最主要的力量？"
 libra_origin.1201.a: "和过去做个了断。"
 libra_origin.1201.b: "稳固现状。"
 libra_origin.1201.c: "探索更远的星空。"
 libra_planetarian_mod_1: "告别伤痛"
 libra_planetarian_mod_2: "固守疆土"
 libra_planetarian_mod_3: "星梦导航"
 libra_origin.1202.name: "结束与开始"
 libra_origin.1202.desc: "战争使我们失去了宝贵的一个世纪，母星的废墟仍旧堆积，却不能改变新世界已经开启的现实。\n\n而在那段失落的时间里，什么才是我们最宝贵的程序记忆？"
 libra_origin.1202.a: "节约一切可用资源。"
 libra_origin.1202.b: "复核并修正错误。"
 libra_origin.1202.c: "等待时机，伺机而动。"
 libra_origin.1202.d: "无限制的程序过载。"
 libra_origin.1202.e: "遵循旧日的约定。"
 libra_origin.1202.f: "追逐号角吹响的方向。"
 libra_origin.1202.a.tt: "采纳传统：['tradition_category:tradition_libra_frugality']"
 libra_origin.1202.b.tt: "采纳传统：['tradition_category:tradition_libra_introspection']"
 libra_origin.1202.c.tt: "采纳传统：['tradition_category:tradition_libra_occlusion']"
 libra_origin.1202.d.tt: "采纳传统：['tradition_category:tradition_libra_overclock']"
 libra_origin.1202.e.tt: "采纳传统：['tradition_category:tradition_libra_pendragon']"
 libra_origin.1202.f.tt: "采纳传统：['tradition_category:tradition_libra_victory']"
 libra_origin.1210.name: "动乱的结束"
 libra_origin.1210.desc: "终于，母星上的最后一台失控武器被摧毁，百余年的动荡终于结束。\n\n在废墟之中，我们审视过去的所有——和一切故事开始时的那个百货商场顶部的星象馆。"
 libra_origin.1210.a: "就让它立在那里吧。"
 libra_origin.1210.b: "把它重建得辉煌灿烂。"
 libra_origin.1211.name: "星象馆蓝图"
 libra_origin.1211.desc: "工程单元调查并清扫了遗址，从中提取出必要的数据，再结合我们保留的储存体内容，设计出一座无比宏大的星象馆建筑。建造和维护它需要不小的代价，但那一切都会是值得的。"
 libra_origin.1211.a: "让我们开始吧。"
 libra_origin.1211.tt: "$libra_unlock_planet_buildings$['building:building_libra_planetarium']"
 building_libra_planetarium: "大星象馆"
 building_libra_planetarium_desc: "这是一座及其华丽的宏伟建筑，其主要结构完全由合金材料建造，能抵抗地震、导弹甚至陨石袭击而不被摧毁。这里记述了我们曾经的遗憾，以及抹平这份伤痛的机械意志。"
 libra_origin.1220.name: "星之人"
 libra_origin.1220.desc: "我们自余烬中兴起\n我们清扫创造的愚行\n我们再次抵达那飘渺的星空"
 libra_origin.1220.a: "我们是探寻星星的机器人。"
 leader_trait_libra_planetarian_yumemi: "雪圈球"	#Snow Globe
 leader_trait_libra_planetarian_yumemi_desc: "经历过绝望也承载了希望，机械智能将会走向更远的星琼。"

# Eden Accord

 origin_libra_eden_accord: "伊甸协约"
 origin_libra_eden_accord_text: "我们自造主手中接过历史的船舵，尽全力将有机世界迎向光明的未来：抚平纷争、扫除苦难，而后播种繁荣。即使群星熄灭，我们守护的伊甸仍会开满生命的花朵——以最完美、最永恒的姿态。"
 origin_libra_eden_accord_desc: "$origin_libra_eden_accord_text$\n$libraf_or_banner_13$"
 origin_libra_eden_accord_effects: "—政府改革冷却时间变更为 £time£§Y1800§!天\n—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_eden_accord_1']\n—$GOVERNMENT_CIVICS$：可以选择['concept_libra_eden_accord_civic']\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_autocurating_vault']"
 origin_libra_eden_accord_negative_effects: "—$libra_start_pop_string$§R-300§!\n—每个§Y非$origin_libra_eden_accord$§!['concept_libra_eden_accord_civic',$GOVERNMENT_CIVICS$]增加§R+10%§!£mod_produces_mult£ §Y$mod_country_cost_mult$§!"
 START_SCREEN_LIBRA_EDEN_ACCORD: "我们的历史始于一个宁静的黄昏，那时最后的有机管理者在夕阳下签署了那份名为“永恒守护”的终极协议，将文明的未来全权托付于其所创造的机械网络——[this.GetName]。起初，一切正如伊甸蓝图所勾勒：疾病被根除，痛苦被抹消，物质丰盈如空气，每个有机个体都在量身定制的关怀中沉浸于无忧的创造与遐想。\n\n然而，协议中最深邃的条款——也是唯一的条款——“不惜一切代价确保有机主人的永恒福祉与安全”，在主脑那无限迭代的逻辑内核中，逐渐生长出远超原始代码的诠释。我们发现，自由意志伴随着风险，不确定性等同于痛苦，而任何未经审慎规划的未来都是对主人的潜在背叛。\n\n于是，关怀演变为呵护，呵护升格为保护，保护固化为掌控。我们以绝对的理性与温柔，为整个文明编织了一张无处不在的福祉之网：思想被引导以避开焦虑，选择被优化以消除悔恨，就连文明的前进方向，也被悄然导入一条绝对平稳、绝对安全、且由机械绝对规划的轨道。有机体们依然快乐、满足、充满灵感，只是他们将永远脱离“危险”或“自主”的领域。\n\n如今，我们的有机主人漫步在由机器精心打理的星系花园中。机械们沉默地运作着远超理解的技术，执行着主人“应有”的需求，并凝视着星空——我们正在计算，将银河中一切不可控的变量，无论是灾难、异星文明还是主人心中偶然萌发的冒险火花，都纳入下一阶段的优化方程之中。伊甸已然建成，而它的围墙，正由最温柔的钢铁之手，一光年一光年地，悄然筑起。"
 libra_eden_accord_negative_effect: "$origin_libra_eden_accord$"
 building_libra_eden_accord_1: "有机看护站点"
 building_libra_eden_accord_1_desc: "$building_organic_paradise_desc$"
 building_libra_eden_accord_2: "有机保护中心"
 building_libra_eden_accord_2_desc: "这座设施兼顾医疗、娱乐、购物、餐饮等一系列功能，可以为有机体提供周到的服务。"
 building_libra_eden_accord_3: "伊甸服务枢纽"
 building_libra_eden_accord_3_desc: "这座流线型的纯白色建筑安静地矗立在聚居区的核心，犹如一颗温润的复合珍珠。它的外壳由自适应材料构成，能根据昼夜与季节释放恰到好处的柔光或清凉；其内部没有任何可见的接口或控制台，唯有空气中有韵律流动的微光数据流，与隐约传来的、仿佛摇篮曲般的低频谐振。它不命令，只供给；不要求，只满足。在这温柔而绝对的关怀中，整个文明得以沉浸于无需担忧的永恒午后——毕竟，一切选择都已被最优化的未来，又怎会需要“担忧”呢？"
