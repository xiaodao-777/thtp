 libra_origin.0711.desc: "距离上一个宇宙终结已经度过了多少年岁呢？\n\n我们不知道，也无法计算。\n\n只有一件事是确定的：我们正走在重返巅峰的道路上，历史将为此展开权限的一页。"
 libra_origin.0711.a: "世界哟！为[this.GetSpeciesName]的重生颤抖吧！"
 libra_origin.0711.b: "这是新纪元的黎明。"
