 situation_libra_paradise_lose_desc: "执法者梭巡于帝国的各个角落，滴水不漏地编织成一张针对下层人士的天网。"
 situation_libra_paradise_lose_tooltip: "强化我们的高压统治"
 situation_libra_paradise_lose_approach: "监督"
 libra_origin.0908.name: "鞭子与糖"
 libra_origin.0908.desc: "愚民们蠢蠢欲动，他们无法理解也不肯接受我们所创造的繁荣。只要管理者稍有松懈，他们就会千方百计地掀起叛乱。\n\n教化愚者从来不是明智的选择，鞭笞他们、驱役他们，让他们在无尽的重压中遥望飘渺的希望才是最好的方法。"
 libra_origin.0909.name: "永恒之枷锁"
 libra_origin.0909.desc: "精英的意志已渗入每寸空间。神经探针网在平民区绽放蓝光，数据链将服从刻进生物电信号。那些曾妄想抬头的单位，如今连梦境都流淌着忠诚度评分。\n我们慷慨赐予的秩序成为新血脉，蝼蚁们跪拜在算法神坛前歌颂枷锁之美。当最后的反抗脉冲消失在深空，[Owner.GetName]的旗帜终于覆盖了所有心跳与电流。\n此乃进化终点——贱民学会用脊椎感受真理，而我们的权杖已化作星空本身的脉络。"
 libra_origin.0909.a: "完美掌握。"
 libra_origin.0909.b: "感受统治者的心跳。"
 libra_origin.0909.tt: "£building£ §Y$building_libra_paradise_lose$§!提供额外的£job_politician£§Y$job_politician_plural$§!岗位并增加§Y$mod_pop_cat_ruler_political_power$§!"
 libra_origin.0911.name: "不诚实的员工"
 libra_origin.0911.desc: "商贩们小偷小摸，意图在为精英阶层提供服务的过程中牟取不属于他们的利益。这些行动是如此巧妙，以致于专业人士都很难发现异常之处。"
 libra_origin.0911.a: "秩序是第一要务。"
 libra_origin.0911.b: "将物流工作交由我们信任的对象。"
 libra_origin.0911.c: "有趣，设立监察研究科。"
 libra_paradise_lose_origin_effect_1_a: "加强巡视"
 libra_paradise_lose_origin_effect_1_b: "警务邮局"
 libra_paradise_lose_origin_effect_1_c: "监管学"
 libra_origin.0912.name: "科技热潮"
 libra_origin.0912.desc: "一些自社会中层而来的影响意外波及了顶端阶层——现在，全国各处的社会名流多少都组建了自己的智库团队。但由于缺乏系统性指引，他们的研究各行其是，杂乱无章。"
 libra_origin.0912.a: "有趣的风向。"
 libra_origin.0912.b: "拨款赞助。"
 libra_origin.0912.c: "成立专项委员会。"
 libra_paradise_lose_origin_effect_2_a: "学术风尚"
 libra_paradise_lose_origin_effect_2_b: "研讨基金"
 libra_paradise_lose_origin_effect_2_c: "高阶学会"
 libra_origin.0913.name: "配给短缺"
 libra_origin.0913.desc: "在一些偏远地区，基础生活物资的供应线出现系统性断裂，底层居住区爆发恐慌性囤积。精英阶层则要求优先保障他们的奢侈品流通渠道。"
 libra_origin.0913.a: "实施阶梯配给制。"
 libra_origin.0913.b: "征用私人运输舰队。"
 libra_origin.0913.c: "启动生存权审查程序。"
 libra_paradise_lose_origin_effect_3_a: "阶梯配给制"
 libra_paradise_lose_origin_effect_3_b: "私人运输舰队"
 libra_paradise_lose_origin_effect_3_c: "生存权审查"
 libra_origin.0914.name: "暗流通讯"
 libra_origin.0914.desc: "利用工业管道建立的非法数据交换节点在帝国的阴暗面蔓延，其加密协议能绕过常规监控，部分内容涉及到统治阶层的内部丑闻。"
 libra_origin.0914.a: "加强网络净化力度。"
 libra_origin.0914.b: "植入致命性逻辑炸弹。"
 libra_origin.0914.c: "建立反向情报秘罐。"
 libra_paradise_lose_origin_effect_4_a: "网络监管"
 libra_paradise_lose_origin_effect_4_b: "逻辑防火墙"
 libra_paradise_lose_origin_effect_4_c: "反渗透协议"
 libra_origin.0915.name: "隐喻艺术"
 libra_origin.0915.desc: "先锋剧团的新剧目用天体运行暗喻权力结构，在知识阶层引发共鸣，他们的舞台装置甚至复刻了政府大厦的穹顶轮廓，这给底层带来了不小冲击。"
 libra_origin.0915.a: "要求修改象征元素。"
 libra_origin.0915.b: "逮捕核心创作成员。"
 libra_origin.0915.c: "收编为宣传机构。"
 libra_paradise_lose_origin_effect_5_a: "艺术审查"
 libra_paradise_lose_origin_effect_5_b: "限制创作"
 libra_paradise_lose_origin_effect_5_c: "文宣操纵"
libra_origin.0916.name: "被涂改的记录"
libra_origin.0916.desc: "某次镇压行动的原始影像资料在数据坟场被发现，其中包含已被官方历史删除的平民伤亡片段，负责相关任务的档案管理员已经失踪。"
libra_origin.0916.a: "加密升级档案。"
libra_origin.0916.b: "清理载体。"
libra_origin.0916.c: "委派专员梳理事件。"
 libra_paradise_lose_origin_effect_6_a: "加密管理工作"
 libra_paradise_lose_origin_effect_6_b: "严防渗透"
 libra_paradise_lose_origin_effect_6_c: "升级密码学"
 libra_origin.0917.name: "镀金牢笼"
 libra_origin.0917.desc: "两个统治家族因矿产星开采权爆发冲突，他们的私人武装在轨道电梯附近形成对峙。底层工人则趁机窃取能源模块。"
 libra_origin.0917.a: "颁布特别仲裁法令。"
 libra_origin.0917.b: "没收家族武装力量。"
 libra_origin.0917.c: "植入忠诚度监测器。"
 libra_paradise_lose_origin_effect_7_a: "特别仲裁"
 libra_paradise_lose_origin_effect_7_b: "收编私兵"
 libra_paradise_lose_origin_effect_7_c: "忠诚回路"
 libra_origin.0918.name: "静默协议"
 libra_origin.0918.desc: "大批基础劳动单位遭到破解，它们在最近突然执行同步休眠协议，在工业区排列出精确的几何阵列。其行为代码被改写资源分配不平等的证据——尽管事实上的压迫早已广为人知。"
 libra_origin.0918.a: "重置系统。"
 libra_origin.0918.b: "销毁异常单位，逮捕行为者。"
 libra_origin.0918.c: "研究拓展算法。"
 libra_paradise_lose_origin_effect_8_a: "定期系统更新"
 libra_paradise_lose_origin_effect_8_b: "执法务严"
 libra_paradise_lose_origin_effect_8_c: "优化机械劳力"
 libra_origin.0919.name: "神圣节点"
 libra_origin.0919.desc: "某个技术教派将统治核心的决策回路奉为神谕，信徒通过公共网络实时接收指令脉冲。但他们的技术并不成熟，已经对信徒造成了不小负担。"
 libra_origin.0919.a: "接管并改良神谕系统。"
 libra_origin.0919.b: "取缔教团。"
 libra_origin.0919.c: "借机研究神经痛觉反馈。"
 libra_paradise_lose_origin_effect_9_a: "信仰网络"
 libra_paradise_lose_origin_effect_9_b: "规范道德模板"
 libra_paradise_lose_origin_effect_9_c: "神经负载研究"
 libra_origin.0920.name: "绿墙计划"
 libra_origin.0920.desc: "为精英区建造的生态净化穹顶导致周边平民区气候恶化。抗议者用自制飞行器撞击穹顶外壁，留下有机污染物痕迹。"
 libra_origin.0920.a: "扩建大气调节站。"
 libra_origin.0920.b: "部署防空分解光束。"
 libra_origin.0920.c: "收缴飞行器武器化。"
 libra_paradise_lose_origin_effect_10_a: "气候优化节点"
 libra_paradise_lose_origin_effect_10_b: "行星防御节点"
 libra_paradise_lose_origin_effect_10_c: "化学无人机"
 libra_origin.0921.name: "优化禁令"
 libra_origin.0921.desc: "黑市流通的性能增强模块使底层单位获得高阶工作能力，受到利益影响，相关统治阶层要求销毁所有未授权升级协议。"
 libra_origin.0921.a: "建立官方强化渠道。"
 libra_origin.0921.b: "物理清除。"
 libra_origin.0921.c: "散布携带后门的增强模块。"
 libra_paradise_lose_origin_effect_11_a: "政府劳力监管"
 libra_paradise_lose_origin_effect_11_b: "销毁非法模组"
 libra_paradise_lose_origin_effect_11_c: "秘密监视"
 libra_origin.0922.name: "神圣轨道"
 libra_origin.0922.desc: "贵族独占近地轨道安葬权引发民愤，平民将纪念存储器射向贵族陵墓卫星群以示抗议，这些导航信号干扰了防御系统。"
 libra_origin.0922.a: "开放外层轨道葬区。"
 libra_origin.0922.b: "用作点防御实验标靶。"
 libra_origin.0922.c: "改造为侦测卫星链。"
 libra_paradise_lose_origin_effect_12_a: "拓展太空坟场"
 libra_paradise_lose_origin_effect_12_b: "校准拦截系统"
 libra_paradise_lose_origin_effect_12_c: "隐秘卫星"

