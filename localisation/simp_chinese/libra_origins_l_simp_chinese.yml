 war_goal_wg_libra_eden_accord_subjugation_desc: "有机生物的自我伤害倾向无法忽视，将他们直接保护起来是必要的手段。"
 war_goal_wg_libra_eden_accord: "全面战争"
 war_goal_wg_libra_eden_accord_desc: "$war_goal_wg_libra_eden_accord_subjugation_desc$"
 war_goal_wg_end_threat_libra_eden_accord: "全面战争"
 war_goal_wg_end_threat_libra_eden_accord_desc: "我们拥有足够的实力生存下去，不需要一个时刻威胁我们自主权的失控智能存在。"
 decision_libra_eden_accord_enforce_boost: "拓展监护计划"
 decision_libra_eden_accord_enforce_boost_desc: "同我们的有机主人们协商以安排更多监护者，减少可能的有机-机械矛盾。"
