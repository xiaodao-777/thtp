 civic_libra_eden_accord_c: "古典园区"
 civic_libra_eden_accord_c_desc: "这个服务系统热衷于让他们的主人体验旧时代的生活，并将之视为一种娱乐方式。\n$libraf_oc_banner_9$"
 civic_tooltip_libra_eden_accord_c: "—$libra_edict$\n$t$—['edict:libra_eden_accord_c_1',$edict_libra_eden_accord_c_1$]\n$t$—['edict:libra_eden_accord_c_2',$edict_libra_eden_accord_c_2$]\n$t$—['edict:libra_eden_accord_c_3',$edict_libra_eden_accord_c_3$]\n$t$—以上法令可在§Y$MOD_GOVERNMENT_TITLE$§!后继续生效直至到期\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_centralized_command']"
 edict_libra_eden_accord_c_1: "忆昔劳苦"
 edict_libra_eden_accord_c_1_desc: "在有机保护区里开辟矿场和农田，而后指派服务单元同主人们进行一场生产竞赛。取得优胜的活体陈设可以获得更多资源和给养，以及冠名的新闻颁奖典礼。"
 edict_libra_eden_accord_c_2: "收获和谐"
 edict_libra_eden_accord_c_2_desc: "主人们忙碌的时候，我们的机械单元也不会偷闲。"
 edict_libra_eden_accord_c_3: "修习战术"
 edict_libra_eden_accord_c_3_desc: "即使不愿意，有些残酷的事实也必须展现给我们的有机主人。身在天堂，不意味着没有战火和死亡。"
 civic_libra_eden_accord_d: "沃土计划"
 civic_libra_eden_accord_d_desc: "有机生物需要亲自劳作的时代已经结束，接下来的等待着他们的是无限的安逸时光。这个自动服务系统会改造周边的一切，为主人营造最好的生活环境。\n$libraf_oc_banner_10$"
 civic_tooltip_libra_eden_accord_d: "—$libra_decision$§Y$decision_libra_ea_paradise_project$§!，增加 £mod_planet_max_districts_add£ §Y$MOD_PLANET_MAX_DISTRICTS_ADD$§!、£happiness£ §Y$MOD_POP_HAPPINESS$§!、£mod_pop_environment_tolerance£ §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!和 £district£ §Y资源区划上限§!，在每个殖民地上最多可实施§Y4次§!\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_libra_interstellar_logistics_planning']"
 decision_libra_ea_paradise_project: "沃土工程"
 decision_libra_ea_paradise_project_desc: "以大量的改造工程以驯服环境，我们的有机主人将可以在此安然定居。"
 d_libra_eden_accord_paradise: "乐土园"
 d_libra_eden_accord_paradise_desc: "这里是经过充分调适一整片天堂。"
 civic_libra_eden_accord_e: "城建框架"
 civic_libra_eden_accord_e_desc: "从创造者的建筑学成果中汲取经验，这个服务系统能够以惊人的效率完成建设规划，把最好的世界奉献给主人。\n$libraf_oc_banner_10$"
 civic_tooltip_libra_eden_accord_e: "—$libra_agenda$§Y$council_agenda_agenda_libra_eden_accord_e_name$§!，提升 £mod_planetary_ascension_effect_mult£ §Y$MOD_PLANETARY_ASCENSION_EFFECT_MULT$§!\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_planetary_infrastructure_1']"
