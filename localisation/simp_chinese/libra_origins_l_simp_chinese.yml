 tr_libra_dragonlight_2_delayed: "在同调中提升力量，在和谐中取得长生。"
 tr_libra_dragonlight_3: "龙之心"
 tr_libra_dragonlight_3_delayed: "血液如生命循环往复，虚空的血脉常在人间。"
 tr_libra_dragonlight_3_desc: "$tr_libra_dragondark_4_desc$"
 libra_origin.0750.name: "天龙披甲"
 libra_origin.0750.desc: "世界的新旧交替之际，我们骄傲的鳞甲变得疲软不堪而一度破碎了：鳞甲有规律的脉动曾经协力先祖反弹多种打击，在这个宇宙里却大大削弱了防护强度，使他们难以抵御高能射线的冲击，造成致命的缺陷。在自然选择中，我们的鳞片被动地退化而解决了这个问题，但直到现在，那名为“龙鳞”的特征依旧保留在我们体表。\n\n只要投入精力，我们应当能恢复最强的防御。\n现在的我们知道要怎么做。"
 libra_origin.0750.a: "坚不可摧。"
 libra_origin.0750.b: "稍后再说。"
 tr_libra_dragonlight_4: "生命循环"
 tr_libra_dragonlight_4_delayed: "过去法则将先祖逼迫至灭亡边缘，现在我们从世界中汲取力量壮大自身。"
 tr_libra_dragonlight_4_desc: "§Y$d_libra_dragonborn$§!提供§G+3%§!£mod_founder_species_growth_mult£ §Y$concept_founder_species_growth_mult$§!"
 tr_libra_dragonlight_5: "坼裂山河"
 tr_libra_dragonlight_5_delayed: "下至地底千丈，上达星河万里，宇域尽为我们所握。"
 tr_libra_dragonlight_5_desc: "每点 £mod_country_starbase_capacity_add£ $STARBASE_CAPACITY_TITLE$：\n$t$$MOD_COUNTRY_EDICT_FUND_ADD$: §G+8§!\n每点已使用的 £mod_country_starbase_capacity_add£ $STARBASE_CAPACITY_TITLE$：\n$t$$MOD_COUNTRY_NAVAL_CAP_ADD$: §G+8§!"
 tradition_libra_dragondark: "黯髻"
 tradition_libra_dragondark_desc: "天昏地黑蛟龙移，雷惊电激雄雌随。"
 tradition_libra_dragondark_adopt_desc: "$tradition_libra_dragondark_desc$$libraf_tr_banner_54$"
 council_agenda_agenda_libra_dragondark_name: "龙之怒"
 council_agenda_agenda_libra_dragondark_desc: "天龙一怒，星光失色；万里之驱，龙尽云汉。"
 agenda_libra_dragondark_finish_modifier: "$council_agenda_agenda_libra_dragondark_name$议程"
 tr_libra_dragondark_adopt: "黯髻传统"
 tr_libra_dragondark_finish: "黯髻传统已完成"
 tr_libra_dragondark_1: "山岳移形"
 tr_libra_dragondark_1_delayed: "无论山峰有多么险峻，在阻挡了我们前进的当下就会变得支离破碎。"
 tr_libra_dragondark_1_desc: "§Y$d_libra_dragonborn$§!提供§G+200§![soldier.GetIcon]§Y[soldier.GetNamePlural]§!岗位"
 libra_origin.0751.name: "天龙血脉"
 libra_origin.0751.desc: "曾有一种特殊的物质，像鲜血一样流动于我们体内，增强我们的一切能力。在适应新世界的过程中我们不得不放弃了它，变得弱小而可怜。\n\n现在我们找到了——§Y$sr_living_metal$§!。"
 libra_origin.0751.a: "拿回来。"
 libra_origin.0751.b: "稍后再说。"
 tr_libra_dragondark_2: "龙之识"
 tr_libra_dragondark_2_delayed: "我们意识到、也很清楚，那一切幻景的真实面目。"
 tr_libra_dragondark_3: "江河逆流"
 tr_libra_dragondark_3_delayed: "法则任意扭曲，因为我们存在于此，一切自然或人工的物质及能量终将为我们所用。"
 tr_libra_dragondark_3_desc: "每点已使用的£mod_country_naval_cap_add£ $MOD_COUNTRY_NAVAL_CAP_ADD$：\n$t$$mod_country_traditions_energy_produces_add$: §G+0.30§!\n$t$$mod_country_traditions_alloys_produces_add$: §G+0.10§!"
 tr_libra_dragondark_4: "龙之眼"
 tr_libra_dragondark_4_delayed: "在我们面前，一切阴谋诡计无所遁形。"
 tr_libra_dragondark_4_desc: "§Y$leader_trait_libra_dragonborn$§!开放§G+1§!上限"
 tr_libra_dragondark_5: "星辰异象"
 tr_libra_dragondark_5_delayed: "巨龙之归，天地震颤。"
 libra_origin.0725.name: "成年的祭礼"
 libra_origin.0725.desc: "随着科技的进步和社会的发展，我们对过去的了解逐渐加深，一度稀少的族群逐步壮大，最初一批回归太虚的个体也在茁壮成长。\n所有的我们都在等待着升格之日的到来。"
 libra_origin.0725.tooltip: "研究 £engineering£ §Y$tech_battleships$§!或 £society£ §Y$tech_stingers$§!科技后，解锁§Y$libra_dragonborn_medium$§!"
 libra_origin.0726.name: "生命所驱"
 libra_origin.0726.desc: "再生是多数生物的本能，只要投入资源研究，我们也应当能够恢复这一能力。"
 libra_origin.0726.a: "还有什么是我们做不到的吗？"
 libra_origin.0727.name: "终界的意志"
 libra_origin.0727.desc: "自最初的最初先祖诞生以来，仅有少数的龙族能问鼎存在的巅峰，而这一机会如今复现在我们眼前。\n复兴曾经是我们追求的目标，升格永远是我们不变的宿命。"
 libra_origin.0727.tooltip: "研究 £engineering£ §Y$tech_titans$§!或 £society£ §Y$tech_biogenesis_titans$§!科技后，解锁§Y$libra_dragonborn_large$§!"
 libra_origin.0730.name: "终极设计"
 libra_origin.0730.desc: "事实证明，虚空之龙存在本身即是完美的，时过境迁我们遭遇了无数挑战，但最终我们凭借自身的优势度过了一次又一次危机。\n\n我们的繁荣永远不会断绝。"
 libra_origin.0730.tooltip: "将['trait:trait_libra_dragonborn_0']替换为['trait:trait_libra_dragonborn_6']"
 libra_origin.0731.name: "$ap_mind_over_matter$"
 libra_origin.0731.desc: "我们具有强大的力量，为了进一步的力量又向虚境伸出了爪。\n\n现在，拥有灵能力量的我们所向无敌。"
 libra_origin.0731.a.tooltip: "将['trait:trait_libra_dragonborn_0']替换为['trait:trait_libra_dragonborn_4']"
 libra_origin.0731.b.tooltip: "['trait:trait_exd']物种获得['trait:trait_libra_dragonborn_5']特质"
 libra_origin.0732.name: "$ap_engineered_evolution$"
 libra_origin.0732.desc: "我们以亿万年的自然进化适应了这个宇宙，但进化的设计并不绝对。\n\n在完全掌握基因的秘密之后，我们可以主动修饰、剔除不必要的DNA片段，实现真正的完美。"
 libra_origin.0732.tooltip: "将['trait:trait_libra_dragonborn_0']替换为['trait:trait_libra_dragonborn_1']"
 libra_origin.0733.name: "$ap_synthetic_evolution$"
 libra_origin.0733.desc: "被动的适应性进化即是存在缺陷的证明，如今我们以合成化一劳永逸地解决问题。\n\n我们拥有足够的技术和能力，可以让自己的金属躯体也拥有强力的吐息和坚韧的鳞甲。"
 libra_origin.0733.tooltip: "将['trait:trait_libra_dragonborn_0']替换为['trait:trait_libra_dragonborn_3']"
 libra_origin.0734.name: "$ap_the_flesh_is_weak$"
 libra_origin.0734.desc: "历史的起伏使我们认知到自身的不足，形势的变化使我们选择植入物来提升自我。\n\n结合血肉与金属，我们的伟岸身姿有增无减。"
 libra_origin.0734.tooltip: "将['trait:trait_libra_dragonborn_0']替换为['trait:trait_libra_dragonborn_2']"
 libra_origin.0736.name: "龙之火"
 libra_origin.0736.desc: "龙息，从来都是龙最大的象征。对于其它物种来说，它是恐怖和毁灭的象征，意味着人为的灾难，但对我们来说则和呼吸一样平常。\n\n在抵达存在的极限之后，寻常的龙息已经不再能满足我们的需求，我们需要、也能够获得更强的力量。"
 libra_origin.0736.a: "没有我们不能掌握的东西。"
 libra_origin.0736.a.tt: "获得以下全部研究选项并结束事件链。"
 libra_origin.0736.b: "使用能量炙烤敌人。"
 libra_origin.0736.c: "让目标在爆炸中毁灭。"
 libra_origin.0736.d: "展示纯粹的物理力量。"
 libra_origin.0736.e: "重现最强的防御。"
 libra_origin.0736.f: "我们还没有准备好。"
 libra_origin.0737.name: "龙的可能性"
 libra_origin.0737.desc: "在取得了过往力量的一鳞半爪，并花费时间加以适应之后，我们得以迈出第二步：发现更多的可能性，最终至臻于完美。"
 libra_origin.0737.a: "强化能量发射。"
 libra_origin.0737.b: "强化秘术能力。"
 libra_origin.0737.c: "强化肢体力量。"
 libra_origin.0737.d: "强化身体结构。"
 libra_origin.0737.e: "我们还需要时间。"
 libra_origin.0738.name: "龙之伟力"
 libra_origin.0738.desc: "适应世界并重拾过往，这促使我们再次回到巅峰。龙族现在拥有弥补不足、或是拓展能力的机会——选择的时间到了。"
 libra_origin.0738.a: "以炎火熔蚀万物。"
 libra_origin.0738.b: "以吐息消融世界。"
 libra_origin.0738.c: "以利爪撕裂虚空。"
 libra_origin.0738.d: "以身躯碾碎星球。"
 libra_origin.0738.e: "我们的力量还不够。"
 libra_origin.0739.name: "最后的审视"
 libra_origin.0739.desc: "伟大的龙裔重新审视自己的不足，重新发现那些本不该被遗忘的技能。这是最好也是最后的机会，下一次相同的良机，恐怕要等到数十个纪元之后了。\n\n作为结果，我们找到了什么？"
 libra_origin.0739.a: "终极的能量操纵。"
 libra_origin.0739.b: "原始而狂暴的本能。"
 libra_origin.0739.c: "超越物理的力量极限。"
 libra_origin.0739.d: "静若永恒的防御。"
 libra_origin.0739.e: "我们没有真正地适应这个世界。"

# paradox loop

 origin_libra_paradox_loop: "悖论回环"
 origin_libra_paradox_loop_text: "母星丰富的电力资源为这个机械智能提供了充足的能量，使得它们拥有相当大的空间来探究科技的秘密。虽然高强度的运算作业经常导致故障而让单位陷入循环或宕机，但最近的协同演算技术突破近乎解决了这一问题。"
 origin_libra_paradox_loop_desc: "$origin_libra_paradox_loop_text$\n$libraf_or_banner_8$"
 origin_libra_paradox_loop_effects: "—$ADDITIONAL_TECHNOLOGIES_STRING$£engineering£ ['technology:tech_mine_betharian']\n—$GUARANTEED_RESEARCH_OPTION_STRING$£engineering£ ['technology:tech_mineral_purification_1']\n—$councilor_gestalt_cognitive$$TRAIT_TITLE$：§Y$leader_trait_maniacal_machine$§!\n—$SPECIES_TRAITS$['trait:trait_libra_paradox_loop']\n—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_paradox_processor']\n—$STARTING_PLANET$\n$t$—['concept_libra_paradox_loop_infrastructure']\n$t$—$PLANETARY_FEATURES$§Y$d_betharian_deposit$§!\n—$libra_policy$\n$t$—§Y$policy_libra_paradox_loop_a$§!，增加指定领域的 £job£ §Y$JOBS_TITLE$§!科技产出\n$t$—§Y$policy_libra_paradox_loop_b$§!，同步提升 £job_researcher£ §Y$job_calculator$产出§!和§Y维护费§!"
 START_SCREEN_LIBRA_PARADOX_LOOP: "早在[this.GetHomeWorldName]由我们的有机造物主引领的时候，它就是一个异常富饶的星球了，资源的丰富使得科技文化飞速发展，并迎来了[this.GetSpeciesName]的降生。\n\n一如当时的有机主人，[this.GetName]能够在科技上近乎无限地投入资源，编制各种各样的函数去解析许许多多的问题。然而，从[this.GetSpeciesName]的诞生到造物主时代的落幕并没有过去太久，我们不得不调用未经充分完善的演算程式来继续研究作业；由于半独立个体数量匮乏，[this.GetName]的假设-实验模式相当固化，各种错误频发，以致于数十个循环以来都在研究相同的课题却未能解决。\n\n如今，[this.GetName]的技术模式得到了有效的改良，能够稳定地开展作业，[this.GetSpeciesName]终于能够将扫描装置近距离接触星辰，分析遥远世界的理论。"
 concept_libra_paradox_loop_infrastructure: "$origin_libra_paradox_loop$基础设施"
 concept_libra_paradox_loop_infrastructure_desc: "—所有 £district£ ['concept_generator_district',$district_generator$]替换为 £district£ ['concept_mining_district',$district_mining_plural$]（£zone£ §Y$zone_betharian$§!）\n— £building£ ['building:building_libra_paradox_processor']: §G+1§!"
 building_libra_paradox_processor: "悖论处理器"
 building_libra_paradox_processor_desc: "这个建筑里安置着数以亿计的链路枢纽和运算单元，可以协调大量演算单位同时工作。"
 building_libra_paradox_processor_effect: "殖民地建有 £building£ §Y$building_betharian_power_plant$§!时提升 £job_mining_drone£ §Y$job_mining_drone_plural$产出§!。\n帝国每采用一个§Y飞升天赋§!就消耗£energy£§R10§!生产£physics£§G5§!£society£§G5§!£engineering£§G5§!。"
 trait_libra_paradox_loop: "悖论逻辑"
 trait_libra_paradox_loop_desc: "在开采贝塞里安矿石与机械演算的循环中，这个机械物种达成了某种平衡。"
 trait_libra_paradox_loop_tooltip: "每$pop_group_unit$£pop_cat_complex_drone£§Y$pop_cat_complex_drone_plural$§!£pop£§Y$POP$§!每月生产§G0.75§!£physics£ §G0.75§!£society£ §G0.75§!£engineering£ §Y研究点数§!"
 policy_libra_paradox_loop_a: "冲破循环"
 policy_libra_paradox_loop_a_desc: "机械智能需要拟定一个主要的使用方向。\n"
 policy_libra_paradox_loop_a_a: "突破：$physics_research$"
 policy_libra_paradox_loop_a_a_name: "$policy_libra_paradox_loop_a$"
 policy_libra_paradox_loop_a_a_desc: "将所有力量集中于$physics_research$研究。\n "
 policy_libra_paradox_loop_a_b: "突破：$society_research$"
 policy_libra_paradox_loop_a_b_name: "$policy_libra_paradox_loop_b$"
 policy_libra_paradox_loop_a_b_desc: "将所有力量集中于$society_research$研究。\n "
 policy_libra_paradox_loop_a_c: "突破：$engineering_research$"
 policy_libra_paradox_loop_a_c_name: "$policy_libra_paradox_loop_c$"
 policy_libra_paradox_loop_a_c_desc: "将所有力量集中于$engineering_research$研究。\n "
 policy_libra_paradox_loop_b: "线程过载"
 policy_libra_paradox_loop_b_desc: "充分利用富足的电力资源，机械智能将会在解密现实的道路上更进一步。\n"
 policy_libra_paradox_loop_b_a: "系统维护"
 policy_libra_paradox_loop_b_a_name: "$policy_libra_paradox_loop_a$"
 policy_libra_paradox_loop_b_a_desc: "降低输出功率，减少载荷以进行维护。\n "
 policy_libra_paradox_loop_b_b: "实验性增幅"
 policy_libra_paradox_loop_b_b_name: "$policy_libra_paradox_loop_b$"
 policy_libra_paradox_loop_b_b_desc: "尝试性地增加能量供给，增加产出，同时取得性能数据以为其它情况作参考。\n "
 policy_libra_paradox_loop_b_c: "超频运作"
 policy_libra_paradox_loop_b_c_name: "$policy_libra_paradox_loop_c$"
 policy_libra_paradox_loop_b_c_desc: "加大输入以求更优输出，并控制风险指数在主机许可的范围内。\n "
 policy_libra_paradox_loop_b_d: "全功率启动"
 policy_libra_paradox_loop_b_d_name: "$policy_libra_paradox_loop_c$"
 policy_libra_paradox_loop_b_d_desc: "将机械智能的协同演算能力发挥到极致，将所有演算单位超频至临界点。\n "
 libra_paradox_loop_start_NAME: "莫比乌斯之环"
 libra_paradox_loop_start_DESC: "当使用$origin_libra_paradox_loop$$ORIGIN$时的默认起始恒星系。"
 zone_libra_paradox_betharian: "贝塞里安悖论提取"
 zone_libra_paradox_betharian_desc: "$zone_betharian_desc$"

# paradise lose

 origin_libra_paradise_lose: "失乐园"
 origin_libra_paradise_lose_text: "统治者的金口玉言即是至高准则，世间万物皆为其卑微的仆从，贫民的形骸只有在死亡后才能得到片刻安宁。\n在这里，反抗的意志永远无法卷起革命的浪潮，因为自由的火种在点亮的瞬间就会被无情掐灭。"
 origin_libra_paradise_lose_desc: "$origin_libra_paradise_lose_text$\n$libraf_or_banner_9$"
 origin_libra_paradise_lose_effects: "—$libra_start_pop_string$§G+800§!\n—$libra_leader_trait$['concept_leader_trait_libra_paradise_lose']\n—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_paradise_lose']\n—$STARTING_PLANET$\n$t$— £district£ ['concept_city_district']: §G+1§!\n$t$— £building£ ['building:building_precinct_house']替换为 £building£ ['building:building_libra_paradise_lose']\n—$libra_extra_council_position$§Y$councilor_dystopian_society$§!\n—$ADDITIONAL_TECHNOLOGIES_STRING$£society£ ['technology:tech_penal_colonies']\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_neural_implants']"
 START_SCREEN_LIBRA_PARADISE_LOSE: "人生有许许多多的可能和机遇，但这些都是上位者的特权。对于底层的贱民来说，跪伏即是它们仅需的行动。\n\n正因为我们这些精英中的精英前仆后继地努力，[this.GetSpeciesName]才拥有了源远流长的历史。我们缔造了一个又一个无上的传奇，而世人只需要跟在我们身后，无需多少代价就能走向正确的方向，分享我们耕耘出的硕果。\n\n即便我们如此慷慨，也总有愚者拒绝光荣的领导并对我们兵刃相向，我们无数次施以教导和宽容，他们却一意孤行。既然他们死悔不改，我们便只好让它们付出相应的代价。一如我们所预料到的那样，没有了英明的领导者，所有的所有都不过是触之即溃的乌合之众。从那时开始，全部的[this.GetSpeciesName]就被统一在了[this.GetName]这唯一的旗帜之下。\n\n统治乃天命，服从即美德。"
 building_libra_paradise_lose: "监察管理局"
 building_libra_paradise_lose_desc: "为确保民众绝对服从而设立的的警卫部门，监察人员会时刻巡视以免下等公民产生非分之想。"
 building_libra_paradise_lose_2: "行星纠察部"
 building_libra_paradise_lose_2_desc: "任何危险的思想和言论在它产生的那一刻就会被纠正，试图反抗的歹徒终会在刑讯之下悔不当初。"
 leader_trait_libra_paradise_lose: "帝国先锐"
 leader_trait_libra_paradise_lose_desc: "这位领袖若非帝国统治阶层中最为杰出的精英，便是他处应募而来的豪杰。"
