 trait_libra_crimson_nights_ancestor: "真祖"
 trait_libra_crimson_nights_ancestor_desc: "这个物种中最杰出的一部分个体已经觉醒了吸血鬼真祖的全能，具有无可比拟的强大力量。"
 leader_trait_libra_crimson_nights_ancestor_commander: "真血觉醒"
 leader_trait_libra_crimson_nights_ancestor_commander_desc: "历经波折之后，这位领袖参悟了血族的全力——其本身就是真祖等级的存在。"
