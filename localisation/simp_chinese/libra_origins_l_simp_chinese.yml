 agenda_libra_praises_to_life_effect: "每张累计消耗的['concept_libra_ceremony_characters']带来：\n$t$每月 £physics£ £society£ £engineering£ 研究点数: §G+2§!（可叠加）\n$t$$mod_country_energy_produces_mult$: §G+0.2%§!（最大: §G+68%§!）\n$t$$mod_country_minerals_produces_mult$: §G+0.2%§!（最大: §G+68%§!）\n$t$$mod_country_food_produces_mult$: §G+0.2%§!（最大: §G+68%§!）"
