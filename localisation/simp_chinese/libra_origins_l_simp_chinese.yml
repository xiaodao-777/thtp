 edict_libra_eden_accord_h_1: "技巧：资源提取"
 edict_libra_eden_accord_h_1_desc: "就像创造者曾经那样，机械智能不会放过任何可以利用的资源。"
 edict_libra_eden_accord_h_2: "技巧：工作效率"
