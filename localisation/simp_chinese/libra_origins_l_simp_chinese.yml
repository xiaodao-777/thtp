# shadow consciousness

 origin_libra_shadow_consciousness: "影子意识"
 origin_libra_shadow_consciousness_text: "黑暗对这一蜂巢思维具有无与伦比的吸引力，无论是其发展的历程还是踏入虚空的理由，都无非是为了向着阴影更进一步；出于相同的原因，它们在第一次星际航行之前就完成了对暗物质的开发，并籍此维持突触间的同调。"
 origin_libra_shadow_consciousness_desc: "$origin_libra_shadow_consciousness_text$\n$libraf_or_banner_6$"
 origin_libra_shadow_consciousness_effects: "—$libra_edict$['concept_libra_shadow_consciousness_edicts']\n—$libra_agenda$§Y$council_agenda_agenda_libra_shadow_consciousness_name$§!\n—可选$GOVERNMENT_CIVICS$：\n$t$—['civic:civic_libra_shadow_consciousness_a']\n$t$—['civic:civic_libra_shadow_consciousness_b']\n$t$—['civic:civic_libra_shadow_consciousness_c']\n$t$—['civic:civic_libra_shadow_consciousness_d']\n—$STARTING_SYSTEM$§Y$pc_black_hole$星系§!\n—$libra_ruler_trait$§Y$leader_trait_libra_shadow_consciousness$§!\n—$ADDITIONAL_TECHNOLOGIES_STRING$£physics£ ['technology:tech_mine_dark_matter']"
 START_SCREEN_LIBRA_SHADOW_CONSCIOUSNESS: "[this.GetSpeciesName]的历史就是追逐黑暗的历史，即便在最遥远的过去，[this.GetName]还是[this.GetHomeWorldName]上一个个散落的小型蜂巢的时候，就已经在下意识地寻找影子——摄入暗物质了。\n\n黑暗让我们安宁，令我们同步，给我们能量，使我们得以跨过无数天敌的追猎幸存下来。而后，我们披着夜色的外衣踏过曾经的任何危险，将曾经的强敌一一击倒。\n\n现在，得益于超光速技术的发展，[this.GetSpeciesName]终于能够更进一步地拥抱黑暗。"
 libra_shadow_consciousness_start_NAME: "影之巢"
 libra_shadow_consciousness_start_DESC: "当使用$origin_libra_shadow_consciousness$$ORIGIN$时的默认起始恒星系。"
 leader_trait_libra_shadow_consciousness: "暗影主脑"
 leader_trait_libra_shadow_consciousness_desc: "习惯了光亮环境生物多有恐惧黑暗的本能，而这一蜂巢思维常年栖身于阴影之中。"
