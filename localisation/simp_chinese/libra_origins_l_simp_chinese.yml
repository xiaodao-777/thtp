 libra_origin.0704.name: "龙之骸"
 libra_origin.0704.desc: "没有任何一条龙会愿意打扰先祖的安眠之所，但为了光复过去的辉煌我们别无选择。\n\n根据记录，这个星球是先祖安置旧世界遗产的地方，现在则被一层又一层的遗骸所覆盖。不仅仅是这里，在整个母星系，虚空龙的尸体都随处可见。\n\n我们为适应这个维度而暂时放弃了在太空中自由活动的能力，仅有极少数个体能够飞翔，现在则终于能够为逝者修筑坟墓。"
 libra_origin.0704.a: "愿他们安息。"
 libra_origin.0705.name: "朽之路"
 libra_origin.0705.desc: "由“不适应物理法则”造成的危机是极其恐怖的，好比自己存在本身遭到否定一样，相对弱小的个体会迅速崩坏，强大的个体也会于长时间的折磨之后走向死亡，只有小部分特例——我们得以幸存。\n\n由于小行星的撞击等因素，行星表层的遗骸大多支离破碎，我们的科研单位只能从其中获取极为有限的信息，一点一点地重现先祖的面目。"
 libra_origin.0705.a: "我们……再挖深一点。"
 libra_origin.0706.name: "龙之躯"
 libra_origin.0706.desc: "在较为深层的区域，遗骸显得相对完整，但仍旧不可丈量。先祖的鳞甲在另一个世界里固若金汤，在这里却异常脆弱。层层积压的残骸大多变形毁坏，我们的考古单位搜集了大量样本，却仍不能凑出一副年代相近的完整躯体。"
 libra_origin.0706.a: "世界予我灭亡，我辈向死而生。"
 libra_origin.0706.b: "小心处理，以免有误。"
 libra_origin.0707.name: "熔之烬"
 libra_origin.0707.desc: "维持钻掘速度，我们已经达到了行星原本的地表，在这里有大型的遗骸、龙息灼烧的痕迹，以及明显来自旧世界的物质。\n\n我们的研究单位正在对这些样本进行解析，但距离得出成果还需要一定时间。"
 libra_origin.0707.a: "那就抓紧。"
 libra_origin.0707.b: "尽可能地实验。"
 libra_origin.0708.name: "龙之心"
 libra_origin.0708.desc: "样本的分析进展顺利，就结果而言，我们并未失去发射龙息的能力，只是多数个体需要一定时间才能适应聚焦并发射吐息的方法。然而其他的能力，比如使用翼叉卷起闪电的自卫手段，则作为我们适应性进化的代价永远的遗失了。\n\n考古单位正在从整个星系中收集遗骸，一是为科研单位提供样本，二是为惨死的先裔修筑坟墓。"
 libra_origin.0708.a: "至少我们可以安心了。"
 libra_origin.0709.name: "重燃虚空之火"
 libra_origin.0709.desc: "完成了，我们取回了龙族骄傲的象征，那熊熊燃烧的炎火预示着我们族群复兴的起始。\n\n同时，在这个世界里“母星”的某处，我们建立了一座宁静的墓园，以此安置逝去的祖先。"
 libra_origin.0709.a: "归来的时间到了。"
