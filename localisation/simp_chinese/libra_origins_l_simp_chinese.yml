 concept_libra_psalm_of_waves_traits_desc: "额外的['concept_libra_aquatic_traits']，包括：\n$t$—['trait:trait_libra_psalm_of_waves_0']\n$t$—['trait:trait_libra_psalm_of_waves_1']\n$t$—['trait:trait_libra_psalm_of_waves_2']\n$t$—['trait:trait_libra_psalm_of_waves_3']\n$t$—['trait:trait_libra_psalm_of_waves_4']\n$t$—['trait:trait_libra_psalm_of_waves_5']\n$t$—['trait:trait_libra_psalm_of_waves_6']\n$t$—['trait:trait_libra_psalm_of_waves_7']\n$t$—['trait:trait_libra_psalm_of_waves_8']\n$t$—['trait:trait_libra_psalm_of_waves_9']\n如果没有选择任何特质，则添加['trait:trait_libra_psalm_of_waves_0']$TRAIT_TITLE$"
 trait_libra_psalm_of_waves_0: "移山填海"
 trait_libra_psalm_of_waves_0_desc: "这个巨大但灵活的水生物种在他们的领域中拥有无与伦比的影响力，足以按自身意志扭曲多数规则。"
 trait_libra_psalm_of_waves_0_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.5§!£society£ §Y$society_research$§!"
 trait_libra_psalm_of_waves_1: "深渊之触"
 trait_libra_psalm_of_waves_1_desc: "这个水生物种拥有灵活但可怕的触手——不过，它们的恐怖之处只有敌人才知道。"
 trait_libra_psalm_of_waves_2: "他山之石"
 trait_libra_psalm_of_waves_2_desc: "只要情况允许，这个水生物种就能够充分发挥自己的价值。"
 trait_libra_psalm_of_waves_3: "三十六进"
 trait_libra_psalm_of_waves_3_desc: "这个水生物种的内结构错综有序，它们通过这种复杂的演化成果来适应环境。"
 trait_libra_psalm_of_waves_4: "异体同心"
 trait_libra_psalm_of_waves_4_desc: "尽管偶尔会发生冲突，但这个水生物种在团结一致时总会发挥出最大的力量。"
 trait_libra_psalm_of_waves_4_tooltip: "$MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-10%§!\n$t$—$mod_official_skill_add$: §G+2§!\n$t$—每拥有一个负面§Y$TRAIT_TITLE$§!：\n$tt$—$MOD_POP_HOUSING_USAGE_ADD$: §G-5%§!"
 trait_libra_psalm_of_waves_5: "浪迹天涯"
 trait_libra_psalm_of_waves_5_desc: "这个物种是天生的旅者，或是洋流，或是天象，他们追随着自然的脚步漫游天下。"
 trait_libra_psalm_of_waves_5_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!带来§G0.01§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_psalm_of_waves_6: "随遇常安"
 trait_libra_psalm_of_waves_6_desc: "这个水生物种善于在不确定的未来中寻找合适的位置，巧妙地安排栖身之所。"
 trait_libra_psalm_of_waves_6_tooltip: "处于§Y$climate_wet$§!环境时：\n$tt$—$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+7.5%§!\n$t$—未处于§Y$climate_wet$§!环境时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!"
 trait_libra_psalm_of_waves_7: "吞天巨口"
 trait_libra_psalm_of_waves_7_desc: "这个水生物种有着巨大的食器的惊人的咬合力，这使他们成为了深海之中最危险的存在。"
 trait_libra_psalm_of_waves_7_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.1§!£minerals£ §Y$minerals$§!"
 trait_libra_psalm_of_waves_8: "烟波钓徒"
 trait_libra_psalm_of_waves_8_desc: "这些起源于水域的物种是老练且狡诈的猎手，他们的敌人永远想不到自己是以何种手段被消灭的。"
 trait_libra_psalm_of_waves_9: "匣中珍宝"
 trait_libra_psalm_of_waves_9_desc: "你永远无法想象这个水生物种囊中藏了什么令人惊奇的宝贝——可能他们自己也无法估量那有多少价值。"
 trait_libra_psalm_of_waves_9_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.5§!£trade£ §Y$trade$§!"

# Ultimate Market

 origin_libra_ultimate_market: "终极市场"
 origin_libra_ultimate_market_text: "植入体的兴盛带来社会的繁荣，迷宫般的市场造就无限的可能，不安定因素则潜伏于浪潮之下蠢蠢欲动。\n无尽的商机转瞬即逝、无穷的风险擦身而过，在这瞬息万变的市场上，谁将成为最优秀的投资者？"
 origin_libra_ultimate_market_desc: "$origin_libra_ultimate_market_text$\n$libraf_or_banner_3$"
 origin_libra_ultimate_market_effects: "—$libra_agenda$§Y$council_agenda_agenda_libra_ultimate_market_name$§!，可清除政策冷却\n—$libra_policy$['concept_libra_ultimate_market_policies']\n—$SPECIES_TRAITS$['concept_libra_ultimate_market_traits']\n—$ADDITIONAL_TECHNOLOGIES_STRING$£engineering£ ['concept_powered_exoskeletons',$tech_powered_exoskeletons$]\n—$GUARANTEED_RESEARCH_OPTION_STRING$\n$t$— £engineering£ ['concept_robotic_workers',$tech_robotic_workers$]\n$t$— £engineering£ ['concept_integrated_cybernetics',$tech_integrated_cybernetics$]"
 START_SCREEN_LIBRA_ULTIMATE_MARKET: "在[this.GetHomeWorldName]，从最初的义体开发完成到实验性义体的大规模应用并没有太久。几乎是一夜之间，[this.GetSpeciesName]就获得了过去难以想象的非人力量和高超耐力。\n\n能力的增强也放大了[this.GetSpeciesName]的欲望，各种反社会行动纷纷涌现，未能及时应对的时任政府最终走向了崩溃。就这样，混乱和疫病支配了[this.GetHomeWorldName]，无政府状态持续了数百年——直到[this.GetName]建立为止。\n\n竞争对手们那不成熟的义体技术和糟糕的卫生环境曾使[this.GetSpeciesName]人口大量减少，此时却成了[this.GetName]一统母星的最佳助力。在忠诚的顾客们的支持下，我们迅速占领了整个市场，整个[this.GetHomeWorldName]的[this.GetSpeciesName]都用上了[this.GetName]生产的高级植入体。最终，我们凭借压倒性的植入体性能差距统一了母星，实现了[this.GetSpeciesName]文明的伟大复兴。\n\n时代在前进，市场在扩展，开发义体的道路还远远没有走到终点。"
 council_agenda_agenda_libra_ultimate_market_name: "投资转移"
 council_agenda_agenda_libra_ultimate_market_desc: "新的市场在向我们招手，是时候谋划新的蓝图了。"
 agenda_libra_ultimate_market_modifier: "$council_agenda_agenda_libra_ultimate_market_name$议程"
 concept_libra_ultimate_market_policies: "$origin_libra_ultimate_market$政策"
 concept_libra_ultimate_market_policies_desc: "用以发掘义体企业潜力的政策，包括：\n$t$—§Y$policy_libra_ultimate_market_1$§!\n$t$—§Y$policy_libra_ultimate_market_2$§!\n$t$—§Y$policy_libra_ultimate_market_3$§!\n$t$—§Y$policy_libra_ultimate_market_4$§!\n$t$—§Y$policy_libra_ultimate_market_5$§!\n$t$—§Y$policy_libra_ultimate_market_6$§!\n$t$—§Y$policy_libra_ultimate_market_7$§!"
 policy_libra_ultimate_market_1: "本地市场目标"
 policy_libra_ultimate_market_1_desc: "即使是企业内部也有商机可图，而收获这些利益只需要微小的调整。\n"
 policy_libra_ultimate_market_1_a: "社会消费"
 policy_libra_ultimate_market_1_a_name: "$policy_libra_ultimate_market_1_a$"
 policy_libra_ultimate_market_1_a_desc: "所有居民自愿缴纳等额税收，目的是确保所有人都可以享受到最好的义体服务。\n "
 policy_libra_ultimate_market_1_b: "上层阶级"
 policy_libra_ultimate_market_1_b_name: "$policy_libra_ultimate_market_1_b$"
 policy_libra_ultimate_market_1_b_desc: "社会中上层往往拥有大量富余资金，只要他们将这些资产用于购买和升级义体，渴望权力的人就能获得更多权力，而追求平等的人将会比他人更加平等。\n "
 policy_libra_ultimate_market_1_c: "基础建筑"
 policy_libra_ultimate_market_1_c_name: "$policy_libra_ultimate_market_1_c$"
 policy_libra_ultimate_market_1_c_desc: "这个义体有助于起居生活，那个商品方便于工作效率……而将它们通通买下之后，劳工们的账户里早已空空如也。\n "
 policy_libra_ultimate_market_1_d: "充分调度"
 policy_libra_ultimate_market_1_d_name: "$policy_libra_ultimate_market_1_d$"
 policy_libra_ultimate_market_1_d_desc: "义体的流通是我们经济中不可或缺的一环，我们可以在方方面面都做到最好，但这需要所有人的共同努力。\n "
 policy_libra_ultimate_market_2: "附属公司指令"
 policy_libra_ultimate_market_2_desc: "妥善利用分公司可以使企业更加繁荣。\n"
 policy_libra_ultimate_market_2_a: "行业专精"
 policy_libra_ultimate_market_2_a_name: "$policy_libra_ultimate_market_2_a$"
 policy_libra_ultimate_market_2_a_desc: "专精一项业务需要大量的时间与精力，我们应该为分公司提供一定的指导以减少这个过程中的资源浪费。\n "
 policy_libra_ultimate_market_2_b: "拓展业务"
 policy_libra_ultimate_market_2_b_name: "$policy_libra_ultimate_market_2_b$"
 policy_libra_ultimate_market_2_b_desc: "要占领更加广阔的市场就需要更多的人力，为此需要对我们的分公司采取怀柔策略。\n "
 policy_libra_ultimate_market_2_c: "后勤供给"
 policy_libra_ultimate_market_2_c_name: "$policy_libra_ultimate_market_2_c$"
 policy_libra_ultimate_market_2_c_desc: "为确保企业利益不受损害，附属公司应全力为母公司提供勤务支持。\n "
 policy_libra_ultimate_market_2_d: "账目助理"
 policy_libra_ultimate_market_2_d_name: "$policy_libra_ultimate_market_2_d$"
 policy_libra_ultimate_market_2_d_desc: "附属公司的首要任务是协力母公司的各种繁杂业务。\n "
 policy_libra_ultimate_market_3: "拓展战略管控"
 policy_libra_ultimate_market_3_desc: "对外经营是企业活动的重要环节，而义体如今为这一活动带来了更多选择。\n"
 policy_libra_ultimate_market_3_a: "优化管理"
 policy_libra_ultimate_market_3_a_name: "$policy_libra_ultimate_market_3_a$"
 policy_libra_ultimate_market_3_a_desc: "植入式义体使企业管理者能够迅速收发信息，这可以有效节省行政资源。\n "
 policy_libra_ultimate_market_3_b: "商品倾销"
 policy_libra_ultimate_market_3_b_name: "$policy_libra_ultimate_market_3_b$"
 policy_libra_ultimate_market_3_b_desc: "销售是企业攫取利润的关键之一，我们拥有许多手段来推广自己的产品，比如在合法领域的极限上为义体零件内置广告。\n "
 policy_libra_ultimate_market_3_c: "扩大经营"
 policy_libra_ultimate_market_3_c_name: "$policy_libra_ultimate_market_3_c$"
 policy_libra_ultimate_market_3_c_desc: "我们对于潜在市场的追求从来没有尽头。\n "
 policy_libra_ultimate_market_3_d: "犯罪诱导"
 policy_libra_ultimate_market_3_d_name: "$policy_libra_ultimate_market_4_c$"
 policy_libra_ultimate_market_3_d_desc: "只要一点点小小的手段，我们就能正大光明地贩售诸多处于灰色地带或更进一步的商品，比如能够为用户带来大量神经信号冲击的脑部植入体，当然，这些义体不会在本地销售。\n "
 policy_libra_ultimate_market_4: "商品生产计划"
 policy_libra_ultimate_market_4_desc: "没有生产何谈销售，使人耳目一新的植入物总能带来最多的客户群。\n"
 policy_libra_ultimate_market_4_a: "前沿技术开发"
 policy_libra_ultimate_market_4_a_name: "$policy_libra_ultimate_market_4_a$"
 policy_libra_ultimate_market_4_a_desc: "高速迭代的义体不仅能加快市场的拓展，还能让一部分顾客为更好的性能付出更多的钱。\n "
 policy_libra_ultimate_market_4_b: "军事外包服务"
 policy_libra_ultimate_market_4_b_name: "$policy_libra_ultimate_market_4_b$"
 policy_libra_ultimate_market_4_b_desc: "我们自己的武装当然会装配最好的军用级义体，这样才能为客人提供富于安全感且无法拒绝的保护。\n "
 policy_libra_ultimate_market_4_c: "先进工艺技术"
 policy_libra_ultimate_market_4_c_name: "$policy_libra_ultimate_market_4_c$"
 policy_libra_ultimate_market_4_c_desc: "坚固、耐用且物美价廉，优质合金锭可以敲开绝大多数外星文明市场的大门，而闪闪发光且富有异国情调的高级品会成为任何一个文明都无法拒绝的抢手货。\n "
 policy_libra_ultimate_market_4_d: "星际物流承包"
 policy_libra_ultimate_market_4_d_name: "$policy_libra_ultimate_market_4_d$"
 policy_libra_ultimate_market_4_d_desc: "我们发达的贸易网络不仅仅可以用来输送自己的商品，也能代客户投递他们的邮件——只要价钱合理。\n "
 policy_libra_ultimate_market_5: "内阁事务统一"
 policy_libra_ultimate_market_5_desc: "为企业制订一个合理的短期目标有利于发展，而具有吸引力的长期目标则可以促进员工间的团结。\n"
 policy_libra_ultimate_market_5_a: "研修技能"
 policy_libra_ultimate_market_5_a_name: "$policy_libra_ultimate_market_5_a$"
 policy_libra_ultimate_market_5_a_desc: "实践证明，时刻学习最新的知识的董事会成员才能更好地指导企业本身，为此有必要为他们安装强化学习套件以减轻负担。\n "
 policy_libra_ultimate_market_5_b: "精进职责"
 policy_libra_ultimate_market_5_b_name: "$policy_libra_ultimate_market_5_b$"
 policy_libra_ultimate_market_5_b_desc: "汇总的报表将在初步处理后直接发送到理事会成员的脑部植入体中并督促其决策，因此通常不会有领袖怠慢工作的实例发生。\n "
 policy_libra_ultimate_market_5_c: "强化政令"
 policy_libra_ultimate_market_5_c_name: "$policy_libra_ultimate_market_5_c$"
 policy_libra_ultimate_market_5_c_desc: "电子植入体大大降低了在信息处理过程中实施人为干预的难度，收集来的数据价值得以最大化，要推行议程也就轻而易举了。\n "
 policy_libra_ultimate_market_5_d: "领袖培养"
 policy_libra_ultimate_market_5_d_name: "$policy_libra_ultimate_market_5_d$"
 policy_libra_ultimate_market_5_d_desc: "在古代，继承人的才能会极大地左右一个王国的盛衰，到了太空时代也同样如此，只有精明、能干且生生不息领导的阶层才能让企业一直发展下去。\n "
 policy_libra_ultimate_market_6: "义体强化标准"
 policy_libra_ultimate_market_6_desc: "义体零件的多种配型带来了无数选择，企业需要将最好的部分应用到最合适的地方。\n"
 policy_libra_ultimate_market_6_a: "专注制造"
 policy_libra_ultimate_market_6_a_name: "$policy_libra_ultimate_market_6_a$"
 policy_libra_ultimate_market_6_a_desc: "没有无数专业人士从事技术作业，企业将会难以运作，优质的强化设备应当首先供应给这些专家。\n "
 policy_libra_ultimate_market_6_b: "专注生产"
 policy_libra_ultimate_market_6_b_name: "$policy_libra_ultimate_market_6_b$"
 policy_libra_ultimate_market_6_b_desc: "企业的一砖一瓦离不开那些辛苦劳作的工人，支援他们是我们的首要目标。\n "
 policy_libra_ultimate_market_6_c: "均衡强化"
 policy_libra_ultimate_market_6_c_name: "$policy_libra_ultimate_market_6_c$"
 policy_libra_ultimate_market_6_c_desc: "所有人都会得到均等且免费支援服务，这是我们企业文化先进性的证明。\n "
 policy_libra_ultimate_market_6_d: "技艺优先"
 policy_libra_ultimate_market_6_d_name: "$policy_libra_ultimate_market_6_d$"
 policy_libra_ultimate_market_6_d_desc: "在各行各业之中，我们培养了大量具有高超技术的精英人士，而植入体广播可以将他们的技力发扬光大。\n "
 policy_libra_ultimate_market_6_e: "共建未来"
 policy_libra_ultimate_market_6_e_name: "$policy_libra_ultimate_market_6_e$"
 policy_libra_ultimate_market_6_e_desc: "没有什么困难是集体力量克服不了的，我们会齐心协力地建设自己的国家。\n "
 policy_libra_ultimate_market_7: "植入体着力点"
 policy_libra_ultimate_market_7_desc: "神经芯片、机械外骨骼……最新世代的控制论研究成果使企业能够在这些领域牟取更多的利益。\n"
 policy_libra_ultimate_market_7_a: "机械设计"
 policy_libra_ultimate_market_7_a_name: "$policy_libra_ultimate_market_7_a$"
 policy_libra_ultimate_market_7_a_desc: "传统的机械设计并不完美，通过对材料和结构的改良，我们将生产出更优秀的机器人。\n "
 policy_libra_ultimate_market_7_b: "义体构造"
 policy_libra_ultimate_market_7_b_name: "$policy_libra_ultimate_market_7_b$"
 policy_libra_ultimate_market_7_b_desc: "对于机械的开发已经告一段落，我们应该将注意力放到自己的植入物上来。\n "
 SPECIES_TRAIT_LIBRA_ULTIMATE_MARKET: "['concept_libra_ultimate_market_traits']"
 concept_libra_ultimate_market_traits: "$origin_libra_ultimate_market$$TRAIT_TITLE$"
 concept_libra_ultimate_market_traits_desc: "固定携带['trait:trait_libra_ultimate_market_cyborg']$TRAIT_TITLE$，并能从以下初始特质间选择其一：\n$t$—['trait:trait_libra_ultimate_market_cyborg_1']\n$t$—['trait:trait_libra_ultimate_market_cyborg_2']\n$t$—['trait:trait_libra_ultimate_market_cyborg_3']\n$t$—['trait:trait_libra_ultimate_market_cyborg_4']\n$t$—['trait:trait_libra_ultimate_market_cyborg_5']\n$t$—['trait:trait_libra_ultimate_market_cyborg_6']\n如果没有选择任何特质，则添加['trait:trait_libra_ultimate_market_cyborg_6']$TRAIT_TITLE$"
 trait_libra_ultimate_market_cyborg: "强化植入体"
 trait_libra_ultimate_market_cyborg_desc: "经过多年的秘密实验和实际测试，这个物种使用的生化植入体已经趋于完善。"
 trait_libra_ultimate_market_cyborg_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1§!£trade£ §Y$trade$§!"
 trait_libra_ultimate_market_cyborg_1: "军用级义肢"
 trait_libra_ultimate_market_cyborg_1_desc: "这个物种的每一个个体都植入了杀伤力巨大的军用义体。"
 trait_libra_ultimate_market_cyborg_2: "脑强化组件"
 trait_libra_ultimate_market_cyborg_2_desc: "这个物种具有能够大幅提升思考能力的神经植入体。"
 trait_libra_ultimate_market_cyborg_3: "巧匠指导"
 trait_libra_ultimate_market_cyborg_3_desc: "在这项工作中该如何行动才能做到最低损耗？只要接入这个服务网络就可以从经验者得到充分的指导。"
 trait_libra_ultimate_market_cyborg_4: "同调广播"
 trait_libra_ultimate_market_cyborg_4_desc: "在这个物种的历史中，当政者通过义体直接向居民播送政令已经成为传统。"
 trait_libra_ultimate_market_cyborg_5: "微笑法则"
 trait_libra_ultimate_market_cyborg_5_desc: "这个物种的植入体会在与他人见面时自动控制其面部表情，做出自然、标准且使人愉悦的笑容。"
 trait_libra_ultimate_market_cyborg_6: "信号增强"
 trait_libra_ultimate_market_cyborg_6_desc: "这个物种装配了信号传输性能优异的插件，这使得他们无需担忧通讯不良造成网络中断的问题。"

# Enlightenment Wisdom

 origin_libra_enlightenment_wisdom: "启明哲智"
 origin_libra_enlightenment_wisdom_text: "当未知低语从地心回荡，辉光自此寄宿于先知之眸。统帅撕裂长夜，哲人重塑山河——传奇在石碑上永恒，却无人知晓荣耀之下隐藏的真实：不朽的存在并非永恒，古旧的传奇终成绝响。"
 origin_libra_enlightenment_wisdom_desc: "$origin_libra_enlightenment_wisdom_text$\n$libraf_or_banner_4$"
 origin_libra_enlightenment_wisdom_effects: "—$libra_start_pop_string$§G+600§!\n—$libra_start_leader_string$\n$t$—补足数量至 £official£ £commander£ £scientist£ 各类型§Y3§!位\n$t$—§Y技能等级§!为§Y5~10§!并携带§d$origin_libra_enlightenment_wisdom$特质§!\n—$STARTING_PLANET$\n$t$—$PLANETARY_FEATURES$['concept_d_libra_enlightenment_wisdom']\n$t$—$libra_planetary_building$['building:building_libra_enlightenment_wisdom']\n—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_libra_enlightenment_wisdom_tech_option']\n—$libra_start_council_agenda$§Y$council_agenda_agenda_unlock_slot_name$§!（$libra_progress$5000）"
 origin_libra_enlightenment_wisdom_negative_effects: "—§R禁用§!领袖储备\n—多数初始£leader£§Y$LEADER$§!将在§Y35§!年内§R去世§!\n—$STARTING_PLANET$§R无法§!进行§Y$TERRAFORM_TITLE$§!或§Y$decision_arcology_project$§!"
 START_SCREEN_LIBRA_ENLIGHTENMENT_WISDOM: "觉醒的契机，深藏于星核之下的脉动。并非凡俗的矿藏，而是一股流淌在岩石裂隙间的古老回响，一种触及生命本质的低语能量。它浸润了文明的根源，催生了一场指向存在本身的哲学革命。深邃的思辨取代了盲目的摸索，逻辑的经纬编织出全新的认知图谱。随之涌现的，是承载这觉醒火种的个体——他们的智慧被地脉回响所淬炼，其存在本身似乎短暂地挣脱了时光的惯常束缚，步入了一种凝滞的千载春秋。他们是洞悉迷雾的引路人，以澄澈的理性规划疆域，以纯粹的思辨雕琢现实。他们的功业如同初铸的星辰，光芒夺目，奠定了文明的基石。\n\n然而，源自地核的馈赠，其本质深邃难测。那赐予漫长岁月的生命回响，并未许诺真正的永恒。不朽的承诺之下，潜藏着未言明的代价与归途。文明的摇篮根植于聆听这脉动之地，矗立的方尖碑既是这非凡认知灯塔，也映照着其下流转的无形流沙。此刻，星海的画卷初展，引路者的晨曦尚在。未来的道路悬于微光：必须在命运的潮汐尚未彻底转向之前，将这源自地核的哲学之火与洞见传递下去，在浩瀚群星间，为这注定与众不同的智慧，寻获能使其星火不熄的崭新基石。因为即便是凝固的时光，也终有归于星尘的旅途。"
 libra_enlightenment_wisdom_start_NAME: "哲人石"
 libra_enlightenment_wisdom_start_DESC: "当使用$origin_libra_enlightenment_wisdom$$ORIGIN$时的默认起始恒星系。"
 libra_enlightenment_wisdom_sol_start_NAME: "迷思之太阳系"
 libra_enlightenment_wisdom_sol_start_DESC: "当使用$origin_libra_enlightenment_wisdom$$ORIGIN$时的可选起始恒星系。"
 libra_enlightenment_wisdom_start_modifier: "$origin_libra_enlightenment_wisdom$"
 d_libra_enlightenment_wisdom: "沉寂深渊"
 d_libra_enlightenment_wisdom_desc: "一处巨大、广阔而深不见底的裂隙，中央闪烁着幽冥的光泽，直达地层深处。"
 concept_d_libra_enlightenment_wisdom: "$d_libra_enlightenment_wisdom$"
 concept_d_libra_enlightenment_wisdom_desc: "—$PRODUCES_RESOURCES$ £unity£ 5\n\n—$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+2§!\n\n§L$d_libra_enlightenment_wisdom_desc$§!"
 building_libra_enlightenment_wisdom: "启明方尖碑"
 building_libra_enlightenment_wisdom_desc: "也许这座巨碑不能刻录我们的全部智慧，但它确实记载了我们从历史中学到的最精要的部分。"
 libra_enlightenment_wisdom_unlock_building: "可以建造§G1§!座额外的 £building£ §Y$building_libra_enlightenment_wisdom$§!"
 concept_libra_enlightenment_wisdom_tech_option: "$origin_libra_enlightenment_wisdom$科技选项"
 concept_libra_enlightenment_wisdom_tech_option_desc: "— £physics£ ['concept_administrative_ai',$tech_administrative_ai$]\n— £physics£ ['technology:tech_automated_exploration']\n— £engineering£ ['concept_powered_exoskeletons',$tech_powered_exoskeletons$]\n— £engineering£ ['technology:tech_assembly_pattern']"
 leader_trait_libra_enlightenment_wisdom_official: "启明信使"
 leader_trait_libra_enlightenment_wisdom_official_desc: "神秘的能量将这位领袖定格在了[this.GetHisHer]的巅峰时代，使其安然度过了一般生命难以想象的漫长岁月，在这无数纪元中绽放光辉。然而，未知的庇护并非永恒，当能量消散，曾经完美的躯壳又能余下几分旧我？"
 leader_trait_libra_enlightenment_wisdom_commander: "启明督统"
 leader_trait_libra_enlightenment_wisdom_commander_desc: "$leader_trait_libra_enlightenment_wisdom_official_desc$"
 leader_trait_libra_enlightenment_wisdom_scientist: "启明向导"
 leader_trait_libra_enlightenment_wisdom_scientist_desc: "$leader_trait_libra_enlightenment_wisdom_official_desc$"
 leader_trait_libra_enlightenment_heritage_official: "光辉继业者"
 leader_trait_libra_enlightenment_heritage_official_desc: "永恒的生命，这既是祝福也是诅咒，更是这一文明无法摆脱的轮回。这位领袖踏上了无数先辈一样的道路，而不出意外的话，[this.GetHeShe]会在未来的数十个世纪里引领世界，又在数千年之后黯然凋零。"
 leader_trait_libra_enlightenment_heritage_commander: "光辉守护者"
 leader_trait_libra_enlightenment_heritage_commander_desc: "$leader_trait_libra_enlightenment_heritage_official_desc$"
 leader_trait_libra_enlightenment_heritage_scientist: "光辉传承者"
 leader_trait_libra_enlightenment_heritage_scientist_desc: "$leader_trait_libra_enlightenment_heritage_official_desc$"
 leader_trait_libra_enlightenment_heritage_tt: "$leader_trait_libra_councilor_position_effect_tt$$leader_trait_libra_total_skill_effect_tt$\n这个特质的§E统治者效果§!随§Y领袖工作时间§!增加而提高"
 libra_origin.0401.name: "闪烁的启明星"
 libra_origin.0401.a.desc: "启明者以其智慧引导[Root.GetName]走过上千年荣耀的历史，由地底异能赐福的黄金时代一经开始便未曾断绝，但就像文明中少数个体感知到的那样，母星的地下活动在衰退。能够担当大业的人选，已经数百年没有出现过了。\n\n我们帝国的继承人，§Y[Root.GetHeirName]§!，以及可靠的助手们，已经明锐地察觉到了这一异常。"
 libra_origin.0401.b.desc: "启明者以其智慧引导[Root.GetName]走过上千年荣耀的历史，由地底异能赐福的黄金时代一经开始便未曾断绝，但就像文明中少数个体感知到的那样，母星的地下活动在衰退。能够担当大业的人选，已经数百年没有出现过了。\n\n作为新一代中最有力的候选人，§Y[libra_enlightenment_wisdom_leader.GetName]§!等人，正在寻找改变的可能。"
 libra_origin.0401.a: "我们能做些什么吗？"
 libra_origin.0401.a.tt: "新的领袖加入了帝国"
 libra_origin.0402.name: "衰落的开始"
 libra_origin.0402.desc: "来自母星的能量正在减弱，那些庇护了我们千年的力量正在消散。尽管如此，启明者们的力量依旧强大。"
 libra_origin.0402.a: "预言兑现了。"
 libra_origin.0402.a.tt: "我们的领袖劣化了"
 libra_origin.0403.name: "式微"
 libra_origin.0403.desc: "衰减仍在继续。\n\n出于对未来的考量，启明者们正以各自的方式保留自己的智慧：提携门徒、或是著书立说。"
 libra_origin.0403.a: "母星地下究竟发生了什么？"
 libra_origin.0403.b: "愿他们行事顺利"
 libra_origin.0403.tt: "$libra_origin.0402.a.tt$\n$libra_enlightenment_wisdom_unlock_building$"
 libra_origin.0404.name: "熄灭"
 libra_origin.0404.desc: "在持续十余年的衰退之后，来自母星的能量终于消失。这些力量曾经保护我们中最杰出的个体，如今却离我们而去——启明者们已时日无多。\n\n但幸运的是，第一批合格的继任者们也已经准备好接手前辈们的事务了。\n虽然，他们的能力远不及那般出众。"
 libra_origin.0404.a: "谁将肩负我们的传承？"
 libra_origin.0404.a.tt: "$libra_origin.0402.a.tt$\n§G解锁§!领袖储备"
 libra_origin.0411.name: "消逝的辉光"
 libra_origin.0411.desc: "维系[Root.GetName]漫长岁月的凝滞辉光，如同风中之烛般摇曳、黯淡，最终彻底消散。没有痛苦，没有征兆，这位以逻辑经纬编织我们早期文明的哲人，其意识核心仿佛耗尽了地脉最后的馈赠，平静地融入了[Owner.GetHomeWorldName]永恒的阴影。"
 libra_origin.0411.a: "举办一场隆重的葬礼。"
 libra_origin.0411.b: "建立一座纪念碑。"
 libra_origin.0411.c: "愿[Root.GetHeShe]安息。"
 libra_origin.0412.name: "回响过载"
 libra_origin.0412.desc: "[Owner.GetHomeWorldName]的地脉监测网络捕捉到一次剧烈的、针对[Root.GetName]意识场的定向能量反冲。这位以思辨重塑早期社会的哲人，其不朽核心在瞬间承受了超越容许极限的地核低语强度。其存在形态如同超新星爆发般短暂闪耀，随后彻底湮灭，只留下监测站内刺耳的谐波警报和一缕融入地脉回响的思维残影。"
 libra_origin.0412.a: "设立静默纪念碑。"
 libra_origin.0412.b: "归档数据。"
 libra_origin.0413.name: "陨落"
 libra_origin.0413.desc: "[Root.GetName]察觉到自己的生命已经接近尽头，并在早前交代了自己身后的安排。作为最后的愿望，[Root.GetHeShe]回到了母星的家乡，最后一次地观赏日落。"
 libra_origin.0413.a: "我们会记住[Root.GetName]的。"
 libra_origin.0414.name: "坍缩的哲思"
 libra_origin.0414.desc: "哲人[Root.GetName]静坐于方尖碑基座下，身躯渐化为莹蓝光尘。[Root.GetHisHer]的思维曾如地脉般奔涌，今日却坍缩崩落直至消散。\n\n碑塔上，崭新的铭文发出幽光：“认知即枷锁。”"
 libra_origin.0414.a: "愿[Root.GetHeShe]在另一个世界里悟道真理。"
 libra_origin.0415.name: "涟漪"
 libra_origin.0415.desc: "据最后接触者描述，[Root.GetName]在[Owner.GetHomeWorldName]的深渊观测站内，其身影逐渐变得透明，仿佛与回荡的低语产生了不可逆的共振。最终，其完全融入了观测站下方的岩壁，如同从未存在，只留下地脉能量一丝微弱的、不同寻常的涟漪。"
 libra_origin.0415.a: "在最后的地点设立纪念碑。"
 libra_origin.0415.b: "建造一座纪念馆。"
 libra_origin.0416.name: "凝思之茧"
 libra_origin.0416.desc: "警报来自[Root.GetName]的静滞力场。监测显示其意识图谱在极短的时间内经历了指数级的信息熵增，远超其不朽框架的承载极限。我们伟大的统帅，在试图理解超越维度的结构时，其思维本身化为了一团不可解析的乱序光点。"
 libra_origin.0416.a: "我们终究无法逃脱牢笼吗？"
 libra_origin.0417.name: "扭曲"
 libra_origin.0417.desc: "一次短暂但剧烈的局部时空扰动席卷了[Root.GetName]所在的区域。当扭曲平息，这位统帅连同其周围的空间坐标一同消失。深层扫描仅探测到一丝来自遥远未来的、带有其思维印记的微弱回响，随后归于彻底的虚无。地脉的低语似乎也为之沉默了一瞬。"
 libra_origin.0417.a: "刻录这段回响。"
 libra_origin.0417.b: "在那里修建一座地标。"
 libra_origin.0418.name: "静默消逝"
 libra_origin.0418.desc: "如同设定好的程序走向终结，[Root.GetName]的存在信号在例行维护中毫无预警地终止。诊断显示其不朽核心并未受损，但驱动其千载春秋的“火花”已悄然熄灭。这位曾重塑我们认知山河的引路人，其凝滞时光走到了尽头。"
 libra_origin.0418.a: "安排葬礼。"
 libra_origin.0418.b: "修建纪念馆以供后人瞻仰。"
 libra_origin.0419.name: "最后的启迪"
 libra_origin.0419.desc: "科学家在尖碑实验室中欢呼：“我接触到了世界核心！”瞬间强光吞没塔顶。次日，人们只寻得[Root.GetHeShe]结晶化的右手指向星空，身下瓷砖烙刻着未完成的能量拓扑方程。"
 libra_origin.0419.a: "妥善安置结晶体。"
 libra_origin.0440.name: "智慧之渊"
 libra_origin.0440.desc: "一些声音认为，母系地下的变化和我们当前的情况应当有所关联。组织一场调研或许是不错的方法，但在那之前，我们需要先探索裂谷，以便安全地进入地下深处。"
 libra_origin.0440.a: "筹备行动。"
 libra_origin.0441.name: "调查规划"
 libra_origin.0441.desc: "在花费了十余年仔细勘测地质环境后，我们规划了一条可行的路径，使我们能够探索裂隙深处——也是我们历史中最初的哲人诞生的地方。我们的科考团队已做好准备，只差一位经验老道的科学家来指挥行动。"
 libra_origin.0441.a: "许可执行。"
 LIBRA_ENLIGHTENMENT_WISDOM_PROJECT: "探索沉寂深渊"
 LIBRA_ENLIGHTENMENT_WISDOM_PROJECT_DESC: "探寻神秘能量的源头，寻找它庇护我们、却又悄然衰退的秘密。"
 libra_origin.0442.name: "神之球"
 libra_origin.0442.desc: "十年时间对过去的我们来说不过是弹指一瞬，现在却显得尤为漫长。我们的科考团队在动荡不安的地层中前进、探索，历经千辛万苦之后，终于达到了地心深处。\n\n眼前是一片由未知晶体构成的洞穴，它透露着紫红的迷幻色泽，却又是如此的坚固，以至于我们所有的工具都不能将其开采，也就无法取样分析。在水晶洞穴的中央，一个约一掌大小的球体静静漂浮着，它散发着异常强烈的存在感但拒绝任何物体的接近，似乎它只是某种……投影。\n\n在这附近的空间里，近似灵能的未知力量裹挟着飘渺的思绪不断回转，那是我们过去几千年历史的缩影，而其中最早的部分，则揭示了我们遗忘的历史——以千年为单位的、英豪的轮回。他们降生，引导文明前进，而后逝去，为新的人选空出位置。庇护是不可预测的，但只要我们执着，就会继续存在。"
 libra_origin.0442.a: "史诗循环。"
 libra_origin.0442.tt: "$libra_enlightenment_wisdom_unlock_building$\n只要§Y[FromFrom.GetName]§!仍在我们控制之下，领袖将随时间获得经验并有几率觉醒§d光辉特质§!"
 libra_origin.0450.name: "智者千虑，百无一失"
 libra_origin.0450.desc: "时光悠悠流转，[Root.GetName]在明灯的指引下度过了又一个三十六年。天灾人祸打断不了我们文明的进程，哲思的辉光将会永远延续。"
 libra_origin.0450.a: "献上我们的尊崇。"
 libra_enlightenment_wisdom_mod_1: "崇敬智者"

# crimson nights

 origin_libra_crimson_nights: "绯红之夜"
 origin_libra_crimson_nights_text: "历史被冷冽的圣水洗刷，过往由无情的烈焰葬送，躯体被沉重的棺椁禁锢，心灵则在重重封印下摇摇欲坠……直到时间冲淡了诅咒、腐朽了圣印，终于、我们打破了束缚。\n如今红月重现——小心，可别一睡不醒。"
 origin_libra_crimson_nights_desc: "$origin_libra_crimson_nights_text$\n$libraf_or_banner_5$"
 origin_libra_crimson_nights_effects: "—$SPECIES_TRAITS$['concept_libra_crimson_nights_traits']\n—$libra_traditions$['concept_libra_crimson_nights_tradition']\n—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_crimson_nights']\n—$STARTING_PLANET$ ['concept_libra_crimson_nights_infrastructure']\n—$libra_extra_council_position$['concept_councilor_libra_crimson_nights']"
 origin_libra_crimson_nights_negative_effects: "—降低来自其他帝国的 £opinion£ §Y$OPINION$§!§R-200§!\n—殖民或攻占的星球：['concept_libra_crimson_nights_planet_sideeffect']行星修正"
 START_SCREEN_LIBRA_CRIMSON_NIGHTS: "过去的历史对他人而言可能是荣耀，而对[this.GetSpeciesName]来说，则是虚无。\n\n毫无缘由地，我们拥有的一切在转瞬间灰飞烟灭，等到我们再次复苏时，[this.GetHomeWorldName]早已人去楼空，只剩下些许废墟与荒野。不过，血族的力量是强大的，[this.GetSpeciesName]的每一个成熟个体都能够胜任其他物种数人份的工作，即使醒来的我们只有一小部分，也足以完成复兴的大业。\n\n复苏之初[this.GetSpeciesName]受困于食物的贫乏，但这难不倒我们：在饥饿之中，我们学会了忍耐和等待，知道了如何能克制自己过去无法抵抗的本能。尽管如此，忍耐并非长久之策，为了解决这个问题，我们把视线移向了头顶的天空。\n\n现在，星际航行的手段已然完备，我们唤醒了仍在沉睡中的同伴，共同追求一个简单明了的目标：踏足宇域，重拾迷失的一切。"
 libra_origin.0511.name: "最初的回忆"
 libra_origin.0511.desc: "过去，我们渴望着……"
 libra_origin.0511.a: "无尽的鲜血。"
 libra_origin.0511.b: "无上的力量。"
 libra_origin.0511.c: "无穷的从仆。"
 libra_origin.0511.d: "无限的荣华。"
 libra_origin.0512.name: "稍近的回想"
 libra_origin.0512.desc: "后来，我们成就了……"
 libra_origin.0512.a: "华丽的废墟。"
 libra_origin.0512.b: "一时的繁荣。"
 libra_origin.0512.c: "分裂的世界。"
 libra_origin.0512.d: "空虚的学术。"
 libra_origin.0513.name: "当下的回望"
 libra_origin.0513.desc: "纵观我们的过去，那是……"
 libra_origin.0513.a: "可笑的闹剧。"
 libra_origin.0513.b: "壮丽的史诗。"
 libra_origin.0513.c: "伤感的悲剧。"
 libra_origin.0513.d: "无上的传说。"
 libra_origin.0514.name: "未来的展望"
 libra_origin.0514.desc: "不管过去的成败荣辱。\n\n无论历史的波澜曲折。\n\n归来的我们，将要："
 libra_origin.0514.a: "铸成全新的伟业。"
 libra_origin.0514.b: "清算所有的罪责。"
 libra_origin.0514.c: "实现未竟的遗志。"
 libra_origin.0514.d: "探索全新的宇宙。"
 libra_origin.0514.e: "延续尊贵的传统。"
 libra_origin.0543.name: "复兴的结果"
 libra_origin.0543.desc: "近年，我们做到了……"
 libra_origin.0543.a: "最高的效率。"
 libra_origin.0543.b: "稳定的后勤。"
 libra_origin.0543.c: "长久的饱足。"
 libra_origin.0543.d: "共同的秘密。"
 libra_origin.0544.name: "重来的印象"
 libra_origin.0544.desc: "然后，我们被称为……"
 libra_origin.0544.a: "虚空的魅影。"
 libra_origin.0544.b: "深渊的尊主。"
 libra_origin.0544.c: "战场的匠师。"
 libra_origin.0544.d: "节律的判官。"
 libra_origin.0545.name: "后世的诺言"
 libra_origin.0545.desc: "最终，我们承诺以……"
 libra_origin.0545.a: "慧眼的抉择。"
 libra_origin.0545.b: "明智的协作。"
 libra_origin.0545.c: "砥砺的执行。"
 libra_origin.0545.d: "锐意的进取。"
