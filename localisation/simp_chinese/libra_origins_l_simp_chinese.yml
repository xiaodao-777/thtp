 concept_libra_crimson_nights_traits_desc: "固定携带['trait:trait_libra_crimson_nights_vampire']特质，并能选择仅限§Y$HUM$§!物种使用的§H负面特质§!，游戏开始后能且仅能应用['trait:trait_libra_crimson_nights_ancestor']物种，包括：\n$t$—['trait:trait_libra_crimson_nights_0']\n$t$—['trait:trait_libra_crimson_nights_1']\n$t$—['trait:trait_libra_crimson_nights_2']\n$t$—['trait:trait_libra_crimson_nights_3']\n$t$—['trait:trait_libra_crimson_nights_4']\n$t$—['trait:trait_libra_crimson_nights_5']\n$t$—['trait:trait_libra_crimson_nights_6']\n$t$—['trait:trait_libra_crimson_nights_7']\n$t$—['trait:trait_libra_crimson_nights_8']\n$t$—['trait:trait_libra_crimson_nights_9']\n$t$—['trait:trait_libra_crimson_nights_10']\n$t$—['trait:trait_libra_crimson_nights_11']\n$t$—['trait:trait_libra_crimson_nights_12']\n$t$—['trait:trait_libra_crimson_nights_13']\n$t$—['trait:trait_libra_crimson_nights_14']\n$t$—['trait:trait_libra_crimson_nights_15']\n$t$—['trait:trait_libra_crimson_nights_16']"
 trait_libra_crimson_nights_0: "夜行"
 trait_libra_crimson_nights_0_desc: "即便随着科技的进步已不再需要躲避日光，这些吸血鬼仍保留着他们偏好阴暗环境的习性。"
 trait_libra_crimson_nights_1: "银弹"
 trait_libra_crimson_nights_1_desc: "不管弹头是银质还是合金，都会对这些吸血鬼造成莫大伤害，他们不得不为此多花不少心思。"
 trait_libra_crimson_nights_2: "利爪"
 trait_libra_crimson_nights_2_desc: "尖锐的指甲在中古时代是恐怖的象征，但在星际时代，这些特征一无是处。"
 trait_libra_crimson_nights_3: "流水"
 trait_libra_crimson_nights_3_desc: "不能从流动的水上方通过——即使诅咒已经淡化，这些吸血鬼仍为此而苦恼。"
 trait_libra_crimson_nights_4: "尸毒"
 trait_libra_crimson_nights_4_desc: "这些吸血鬼会产生一些具有腐蚀性的物质，对周边环境造成显著负担。"
 trait_libra_crimson_nights_5: "魅影"
 trait_libra_crimson_nights_5_desc: "没有脚下的土地，这些吸血鬼的力量会变得不稳定，在太空中搬家对他们而言是一桩麻烦事。"
 trait_libra_crimson_nights_6: "圣餐"
 trait_libra_crimson_nights_6_desc: "这些吸血鬼需要摄入大量的食物才能稳定保持他们的力量。"
 trait_libra_crimson_nights_7: "血痕"
 trait_libra_crimson_nights_7_desc: "以这些吸血鬼本当尊贵的身份来说，他们糟糕的进食姿态实在是恶劣至极——到处飞溅的血液打扫起来总是相当麻烦。"
 trait_libra_crimson_nights_8: "尖牙"
 trait_libra_crimson_nights_8_desc: "保养自己靓丽的牙齿是一件费时费力的工作，即使说，这对其它物种也难以理解。"
 trait_libra_crimson_nights_9: "刺钉"
 trait_libra_crimson_nights_9_desc: "只要将木桩钉入心脏，这些吸血鬼看似无尽的寿命就会顷刻终结，在回避如此危险的方面，他们不择手段。"
 trait_libra_crimson_nights_10: "忌物"
 trait_libra_crimson_nights_10_desc: "标志着特定符号的事物能够对这些吸血鬼造成无名的压力，无论何时何地他们都会设法将其一带而过。"
 trait_libra_crimson_nights_11: "沉眠"
 trait_libra_crimson_nights_11_desc: "只有环境足够宽敞舒适时，这些吸血鬼才能够在休憩时安然入梦。"
 trait_libra_crimson_nights_12: "圣剑"
 trait_libra_crimson_nights_12_desc: "这些吸血鬼惧怕附有神圣概念的攻击，这会使他们死于非命。"
 trait_libra_crimson_nights_13: "月盈"
 trait_libra_crimson_nights_13_desc: "只有在特定的恒星日到来之际，这些吸血鬼才能发挥出自身全部的物理力量。"
 trait_libra_crimson_nights_14: "光灼"
 trait_libra_crimson_nights_14_desc: "强光会损害这些吸血鬼的身体结构，他们对环境变化极度敏感。"
 trait_libra_crimson_nights_15: "颂裁"
 trait_libra_crimson_nights_15_desc: "哪怕是最简单的诗颂也会给这些吸血鬼造成不小负担，他们之间不能很好地协作。"
 trait_libra_crimson_nights_16: "咒蚀"
 trait_libra_crimson_nights_16_desc: "可怕的圣约限制着这些吸血鬼走向长生：他们被剥夺了通过吸血续命的权能。"
