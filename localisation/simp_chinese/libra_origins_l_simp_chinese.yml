 libra_origin.0519.name: "The Vampyre"
 libra_origin.0519.desc: "我们为无尽的白日披上暗幕\n我们给躁动的心灵带去永宁\n\n赤瞳，尖耳，锐齿，利爪，咒印……我们背负着我们的所有功与赏和罪与罚，渡过时间的长河从神话传说中走到今天。\n\n我们追逐的，终将难以摆脱我们；我们贪求的，再也无法拒绝我们；我们乐道的，永远不会背离我们。\n\n现在，\n\n我们可以久违地在阳光下欣赏日出。"
 libra_origin.0519.a: "静默无言。"
 libra_origin.0519.b: "举杯欢庆。"
