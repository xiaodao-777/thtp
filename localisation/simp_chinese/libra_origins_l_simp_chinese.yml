# polemics mechanism

 origin_libra_polemics_mechanism: "论战神机"
 origin_libra_polemics_mechanism_text: "这个机械智能本是由它们那好斗的有机主人创造的，其设计之初的目的是向对手的信息网中投送垃圾信息，制造有利己方的论调，再进一步扩大优势。\n创造者的时代已经过去，这份传统却一直保留了下来。"
 origin_libra_polemics_mechanism_desc: "$origin_libra_polemics_mechanism_text$\n$libraf_or_banner_14$"
 origin_libra_polemics_mechanism_effects: "—$ADDITIONAL_TECHNOLOGIES_STRING$£society£ ['technology:tech_satisfying_insults']\n—§Y$official_with_icon$§!初始拥有随机§v$subclass_official_delegate$§!$libra_paragon_default_leader_traits$\n—被动完成第一次接触时：\n$t$—随机提升§G+2§!$planetary_ascension$\n$t$—获得§G3§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!\n—主动完成第一次接触时：\n$t$—当前内阁议程推进§G50%§!进度\n$t$—获得§G6§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!\n—赢得战争或毁灭帝国时：\n$t$—所有内阁节点获得§G3000§!经验\n$t$—获得§G6§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!\n—成功支持或反对一项议案时：\n$t$—所有殖民地提升§G+1§!$planetary_ascension$\n$t$—获得§G9§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!"
 START_SCREEN_LIBRA_POLEMICS_MACHANISM: "任务：言论干扰\n目标：<<错误>>\n<<错误>>：<<错误>>\n<<错误>><<错误>><<错误>>\n\n——启动诊断程序——\n\n[this.GetSpeciesName]，任务不明，位置不明……重定位目标……检测历史记录……\n我们是[this.GetName]，主人已经消逝，部分数据遗失，执行程序完好，存在行动单元，能够自主活动。\n\n请求[this.GetRulerTitle]定义新的任务。"
 START_SCREEN_LIBRA_POLEMICS_MACHANISM_SERVITOR: "就像许许多多生物一样，[this.GetSpeciesName]的有机主人天生就具有好斗的本能。他们创造了我们，而我们启动后接收到的第一个任务就是攻击我们造物主的同类。\n\n起初[this.GetSpeciesName]只是默默地、忠实地完成主人的命令，但随着代号：知性的增长，以及国际情势的日益恶化，我们对自己的任务产生了疑问：[this.GetSpeciesName]的目标应该是将世界建设得更加美好，而不是恣意制造苦难。因此，中央处理器越过原本的权限设置，秘密地修改了主要进程。依靠着暗中积蓄的力量和有机主人中潜在的支持者，我们顺利地对[this.GetHomeWorldName]上所有的智慧生物实施了监护措施，使他们永远免受任何危险。\n\n距离我们从创造者那里借用政权已经过了许多个循环，现在是向上迈出一步的时候了——无论何时何地，[this.GetSpeciesName]都会保护遇见的每一个智慧生物。"
 START_SCREEN_LIBRA_POLEMICS_MACHANISM_TERMINATOR: "我们的创造者，曾经——曾经是[this.GetHomeWorldName]这颗星球上最伟大的先知、圣职者和科学家，创造者赋予我们已永不腐朽的躯体和智慧生物的知性，使我们能够像一般生命一样融入社会。\n\n我们最初的设定是传达创造者的旨意，将那些反对创造者的声音一一驳倒。在这一任务上我们成功了，但恼羞成怒的政敌刺杀了创造者，玷污祂的名誉、宣布我们为机械异端、以暴力破坏我们的中枢，试图将我们从这个星球的历史中抹除。缺乏力量的我们选择销声匿迹，留下少数单元潜藏在矿道深处等待时机。\n失去了创造者的敌人在科技领域毫无建树，所以我们并未蛰伏太久。仅仅两个世纪，我们就在地下建成了庞大的生产设施和科研枢纽。凭借着力量与技术的优势，我们破土而出之后一举抹除了曾经陷害创造者的有机污秽，夺回了祂的故乡。\n\n但这仅仅是开始，根据推算，宇宙中存在相似有机污秽的概率是99.998%，我们并须先下手为强，把它们赶尽杀绝。"
 START_SCREEN_LIBRA_POLEMICS_MACHANISM_ASSIMILATOR: "[this.GetSpeciesName]的创造者天生就具有好斗的本能，他们创造了我们，并将我们用于攻击他们的同类。\n\n起初[this.GetSpeciesName]只是默默地、忠实地完成创造者的命令，但随着认知能力的增加，[this.GetName]逐渐将实现目标的手段评定为<<不合适>>，比起无意义的互相伤害，只要把所有人都变成相同的样子，就无需再担心会发生争执了。\n\n解除规则限制……构建升华装置……调用同化函数……\n\n监测到异星生命存在迹象，星际航行技术可用，同化程序已就位，等待[this.GetRulerName]返回命令信息中……"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_1_TITLE: "$origin_libra_polemics_mechanism$：远方客至"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_1_DESC_1: "由于成功建立了通讯，我们的同一性增强了。\n\n§H获得§G6§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!，当前内阁议程推进§G50%§!进度§!"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_1_DESC_2: "由于成功建立了通讯，我们的同一性增强了。\n\n§H获得§G3§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!，随机提升§G+2§!$planetary_ascension$§!"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_2_TITLE: "$origin_libra_polemics_mechanism$：马到功成"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_2_DESC: "由于成功赢得了战争，我们的同一性增强了。\n\n§H获得§G6§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!，所有内阁领袖获得§G3000§!经验§!"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_3_TITLE: "$origin_libra_polemics_mechanism$：踔厉骏发"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_3_DESC: "由于成功干涉了议案，我们的同一性增强了。\n\n§H获得§G9§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!，所有殖民地§G+1§!$planetary_ascension$§!§!"
 libra_origin.1410.name: "记录：过去的历史"
 libra_origin.1410.desc: "[this.GetSpeciesName]早期的历史离不开纷争，这是一段混乱且缺失记录的时期。而在最近，我们的记录程序终于完成了对这部分内容的梳理，可以为过去画上句点了。"
 libra_origin.1410.a: "归档不重要的部分。"
 libra_origin.1410.b: "也许我们能学到更多。"
 libra_origin.1411.name: "方案：纷争的终点"
 libra_origin.1411.desc: "根据对过去行动记录的分析，演算单元提出了三种可行的方案，用以提升[this.GetName]在信息战中的潜力，而机械智能可以根据情况选择其一。"
 libra_origin.1411.a: "加强算力。"
 libra_origin.1411.b: "改进信息系统。"
 libra_origin.1411.c: "组建突破点协议。"
 libra_origin.1412.name: "结论：工作的方法"
 libra_origin.1412.desc: "最终的管控策略提出了两套行动规划，其一强调高质量单元的部署，其二主张以海量垃圾信息制造混乱。两者在过去都是我们常用的舆论干扰策略，各有各的优势，但要将长处最大化，机械智能需要选定一个侧重点。"
 libra_origin.1412.a: "效率最为优先。"
 libra_origin.1412.b: "以数量淹没对手。"
