 situation_libra_return_to_mortal_monthly_change_tooltip: "启用各个['tradition_category:tradition_libra_crimson_vampire']传统以加速局势进度。"
 situation_libra_return_to_mortal_desc: "我们正站在自身历史的分水岭上：唤醒沉睡的力量，并决定以何种姿态回归人间——递出新芽生长的橄榄枝，或笼罩世界以第二次的恐怖。"
