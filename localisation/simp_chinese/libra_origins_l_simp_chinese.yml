 civic_libra_eden_accord_a: "仿生菁英"
 civic_libra_eden_accord_a_desc: "长久以来，这个机械智能从它们的造物主那里汲取知识，像知性生物一样活动，即使步入星空，这一习惯也没有改变。\n$libraf_oc_banner_9$"
 civic_tooltip_libra_eden_accord_a: "—§Y$MOD_GOVERNMENT_TITLE$§!后刷新§Y领袖储备§!\n—§Y领袖储备§!初始拥有随机$libra_paragon_default_leader_traits$\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_embodied_dynamism']"
 civic_libra_eden_accord_b: "先制措施"
 civic_libra_eden_accord_b_desc: "在见证太多有机生物自我毁灭的实例之后，这个机械智能选择主动排除所有可能的隐患，不管目标是否愿意，无论行动是否激进。\n$libraf_oc_banner_9$"
 civic_tooltip_libra_eden_accord_b: "—对非蜂巢思维有机物种拥有“§Y$casus_belli_cb_libra_eden_accord_subjugation$§!”及“§Y$casus_belli_cb_libra_eden_accord_total_war$§!”宣战理由\n—$libra_decision$§Y$decision_libra_eden_accord_enforce_boost$§!、§Y$decision_libra_eden_accord_stability_boost$§!和§Y$decision_libra_eden_accord_expel_population$§!\n—$GUARANTEED_RESEARCH_OPTION_STRING$£society£ ['technology:tech_autonomous_agents']"
