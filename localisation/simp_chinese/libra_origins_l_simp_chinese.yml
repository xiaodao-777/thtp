 origin_libra_interstellar_port: "天下熙攘"
 origin_libra_interstellar_port_text: "多少回，财富之风拂过苍穹，带来贸易的勃勃生机：追逐着贸易的脚步，我们羁旅四方，既见证过王朝的迭起兴衰，也看遍了社会的风云变幻，更阅尽了事故的人情冷暖。\n繁荣富贵可能名不虚行，抑或南柯一梦。"
 origin_libra_interstellar_port_desc: "$origin_libra_interstellar_port_text$\n$libraf_or_banner_10$"
 origin_libra_interstellar_port_effects: "—$libra_start_pop_string$§G+600§!\n—$libra_leader_trait$['concept_leader_trait_libra_interstellar_port']\n—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_interstellar_exchange']\n—$BRANCH_OFFICE_BUILDINGS$：£building£ ['building:building_libra_interstellar_port_office']\n—$AVAILABLE_HOLDINGS$£building£ ['building:holding_libra_interstellar_port_office']\n—$STARTING_PLANET$['concept_libra_interstellar_port_infrastructure']\n—$GOVERNMENT_CIVICS$：可以选择['concept_origin_libra_interstellar_port_civic']"
 START_SCREEN_LIBRA_INTERSTELLAR_PORT: "天下熙熙，皆为利来，天下攘攘，皆为利往。\n\n在漫长的过往间，[this.GetSpeciesName]曾经是农民、手工业者，也可能是士兵和商人。无论如何，有贸易的地方，就有[this.GetSpeciesName]的身影。货物随从我们的身影流动，将繁荣传播至母星各处，使时代不息前进。\n\n虽然贸易的历程并非一帆风顺，天灾人祸无数次给予[this.GetName]以危机的洗礼，但它们都未能将我们击垮。在历经历史的波折之后，[this.GetName]从幕后走向台前：接过没落的权柄，统合所有的企业，终于使繁华遍布[this.GetHomeWorldName]各处。\n\n如今，我们精通交涉的技巧、拥有优秀的商品，势必能在星宇间开启一片荣华的天地。"
 building_libra_interstellar_exchange: "星际码头"
 building_libra_interstellar_exchange_desc: "前往异星的货物由这里分拣和发送，保卫资产的卫士也在这里实习和训练。"
 building_libra_interstellar_exchange_effect_desc: "殖民地每有$pop_group_unit$£pop£§Y$POP$§!就生产£trade£§G1§!。"
 building_libra_interstellar_port_office: "繁荣商埠"
 building_libra_interstellar_port_office_desc: "在这里你可以换取自己想要的一切——无论是知识、财富还是力量，只要付钱就会有丰厚的回报。"
 building_libra_interstellar_port_office_effect: "殖民地每有$pop_group_unit$£pop£§Y$POP$§!就消耗£consumer_goods£§R1§!生产£physics£§G1§!£society£§G1§!£engineering£§G1§!。"
 holding_libra_interstellar_port_office: "商贸渡口"
 holding_libra_interstellar_port_office_desc: "在这座地产里任职的是宗主国外派团队中的精英，通过吸取附属国的经验，他们会把市场开拓得更加广大。"
