 libra_origin.0540.name: "降临"
 libra_origin.0540.desc.a: "回归巅峰，这从来都只是一个时间问题，现在的我们已经迈出了最后一步。\n\n但，化身机械、抛弃血族传统的我们还能算血族吗？"
 libra_origin.0540.desc.b: "我们经历了浩劫之上的苦难。\n我们遵循了冥冥之中宿命的呼唤。\n我们预知了夜幕之下的复兴。\n\n而现在，红月正圆，是大摆筵席的好时间。"
 libra_origin.0540.tooltip: "['trait:trait_libra_crimson_nights_vampire']物种获得['trait:trait_libra_crimson_nights_ancestor']特质"
 libra_origin.0540.a: "机械血族也是吸血鬼！"
 libra_origin.0540.b: "机油也是不错的血液。"
 libra_origin.0540.c: "我在，故我是。"
 libra_origin.0540.d: "开始吧，专属于血族的晚会。"
 libra_origin.0540.e: "荣耀归于血族。"
 tr_libra_crimson_ancestor_finish: "飨宴传统已完成"
 libra_origin.0542.name: "君临"
 libra_origin.0542.desc: "赤红上的渴望，子夜中的妖魅，牙月下的瞬影，尖锐锋利的獠牙，血红邪魅的眼眸，尽享高脚杯中甘甜的液体……\n\n我们，夜晚的王者，无上的特权。"
 libra_origin.0542.a: "呵，吸血鬼。"
 libra_origin.0542.b: "优雅与神秘，全新的篇章。"
 libra_origin.0542.c: "干杯。"
