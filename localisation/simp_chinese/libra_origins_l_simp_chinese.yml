# miracle builder

 origin_libra_miracle_builder: "奇迹工程师"
 origin_libra_miracle_builder_text: "一些不可能的发现，一些冲击性的研究，告诉我们脚下的母星并非寻常之地：这里埋藏着先史文明的资源储备和技术结晶，只要伸手就可以取得——而后，我们将把文献记载的天观奇迹变为现实。"
 origin_libra_miracle_builder_desc: "$origin_libra_miracle_builder_text$\n$libraf_or_banner_15$"
 origin_libra_miracle_builder_effects: "—$libra_active_tradition$\n$t$—['tradition_category:tradition_libra_cosmoplasty',$tr_libra_cosmoplasty_adopt$]\n$t$—['tradition:tr_libra_cosmoplasty_3']\n—$STARTING_PLANET$\n$t$—$libra_planetsize$30\n$t$—$PLANETARY_FEATURES$['concept_d_libra_miracle_builder']\n—建成或升级$megastructures$时：\n$t$—$mod_country_produces_mult$: §G+0.50%§!（最大: §G+25%§!）\n$t$—所有殖民地以§Y20%§!几率提升§G+1§!$planetary_ascension$\n—$libra_starbase_buildings$['starbase_building:libra_miracle_builder_hub',$sm_libra_miracle_builder_hub$]\n—免除§Y$dyson_swarm_3$§!和§Y$orbital_arc_furnace_4$§!的建造上限\n—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_libra_miracle_builder_start_tech']\n—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_libra_miracle_builder_guaranteed_tech']"
 START_SCREEN_LIBRA_MIRACLE_BUILDER: "一次考古行动改变了[this.GetSpeciesName]对母星的认知，深埋地下的宝藏被发现，我们第一次见到了那璀璨神迹的可能性，[this.GetName]的历史由此改写。\n\n记录证实，[this.GetHomeWorldName]及其整个星系都是古代文明的杰作，只是他们早早离开了这个世界。[this.GetSpeciesName]花费了上百年时间研究以破译文件，而我们的社会也由此飞速发展，终于在几十年前首次踏入了太空。\n\n我们发现，过去传说中黯淡的天河，实际是破碎星基的遗址；飘忽不定的双月，其表面满是奔涌的能量。我们知道，现在轮到[this.GetSpeciesName]缔造神话了。"
 concept_libra_miracle_builder_start_tech: "奇迹工程师起始科技"
 concept_libra_miracle_builder_start_tech_desc: "— £physics£ ['technology:tech_dyson_swarm']\n— £engineering£ ['technology:tech_starbase_3']\n— £engineering£ ['technology:tech_starbase_4']\n—若与['civic:civic_privatized_exploration']国民理念结合： £engineering£ ['technology:tech_starbase_5']"
 concept_libra_miracle_builder_guaranteed_tech: "奇迹工程师科技选项"
 concept_libra_miracle_builder_guaranteed_tech_desc: "— £engineering£ ['technology:tech_starbase_5']\n— £engineering£ ['concept_orbital_arc_furnace',$tech_orbital_arc_furnace$]\n— £engineering£ ['technology:tech_orbital_ring_tier_1']\n— £engineering£ ['concept_habitat_1',$tech_habitat_1$]"
 d_libra_miracle_builder: "宝藏之地"
 d_libra_miracle_builder_desc: "这片土地无比丰饶，不仅有壮丽的自然风景，浅层矿脉也都是高纯度的优质矿物，只需简单的加工就可以成为强韧的材料。"
 concept_d_libra_miracle_builder: "$d_libra_miracle_builder$"
 concept_d_libra_miracle_builder_desc: "—$PRODUCES_RESOURCES$ £alloys£ 15 £engineering£ 5\n\n§L$d_libra_miracle_builder_desc$§!"
 libra_miracle_builder_start_NAME: "神造天堂"
 libra_miracle_builder_start_DESC: "当使用$origin_libra_miracle_builder$$ORIGIN$时的默认起始恒星系。"
 libra_miracle_builder_effect_1: "$origin_libra_miracle_builder$"
 libra_miracle_builder_effect_2: "$origin_libra_miracle_builder$"
 sm_libra_miracle_builder_hub: "奇迹研究所"
 sm_libra_miracle_builder_hub_desc: "这座建筑专用于研究太空环境下的结构学研究，帮助我们将深空建筑修建得更大更宏伟。\n "
 sm_libra_miracle_builder_hub_desc_modifier: "建筑工作时：\n$t$在每个星球上维持§Y1§!£physics£ §Y1§!£society£ §Y1§!£engineering£"
 d_libra_miracle_builder_1: "奇迹研究站"
 d_libra_miracle_builder_1_desc: "对当地天体环境进行研究和试验的小型站点。"
 d_libra_miracle_builder_2: "$d_libra_miracle_builder_1$"
 d_libra_miracle_builder_2_desc: "$d_libra_miracle_builder_1_desc$"
 libra_origin.1505.name: "遗存中的幽灵"
 libra_origin.1505.desc: "我们对母星上遗址的研究日渐深入，我们终于解密了最后的文件，它是一段影像记录：一个头戴王冠的虚影在宏伟的宫殿中演说，我们无法理解这些语言，但可以从中感到遗憾和希望。很明显，我们母星系里的所有“馈赠”，都是这个文明所为，而现在，他们将火炬交给了我们。"
 libra_origin.1505.a: "我们会好好利用这些遗产的。"
 libra_origin.1505.b: "谢谢你给我们留下这些。"

# may storm

 origin_libra_may_storm: "五月风暴"
 origin_libra_may_storm_text: "我们见识过卓越的君王，也经历过明智的独裁，但这些通通成为了过去——统治阶层随着时间的流逝而腐化，杰出的领袖虽十代而不出一辈，终究化作历史中飘散的尘埃。\n为使民主与平等永世长存，人民的力量与智慧必不可少。"
 origin_libra_may_storm_desc: "$origin_libra_may_storm_text$\n$libraf_or_banner_16$"
 origin_libra_may_storm_effects: "—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_may_storm']\n—对['concept_libra_may_storm_autocratic_empire']拥有“§Y$casus_belli_cb_libra_may_storm$§!”宣战理由\n—$GOVERNMENT_CIVICS$：可以选择['concept_origin_libra_may_storm_civic']$GOVERNMENT_CIVICS$\n—$libra_policy$\n$t$—§Y$policy_libra_may_storm_1$§!，提供$EMPIRE_EFFECTS_W_ICON$\n$t$—§Y$policy_libra_may_storm_2$§!，强化 £building£ ['building:building_libra_may_storm']\n—$libra_decision$\n$t$—§Y$decision_libra_may_storm_1$§!，增加§Y$job_libra_peoples_deputy_swap_plural_with_icon$§!岗位\n$t$—§Y$decision_libra_may_storm_2$§!，增加§Y$job_libra_industry_commissar_swap_plural_with_icon$§!岗位\n$t$—§Y$decision_libra_may_storm_3$§!，增加§Y$job_libra_shock_worker_swap_plural_with_icon$§!岗位\n—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_libra_may_storm_guaranteed_tech']"
 START_SCREEN_LIBRA_MAY_STROM: "[this.GetSpeciesName]的历史上有过无数个高峰，但只有我们缔造的那一座最为长久。时光流逝千百载，多少王侯将相皆成过眼云烟，只有人民生生不息以至今日。\n\n专制是腐化的源泉，当权者背弃民众、天下为私之时，即是人民决起之刻。\n\n革命的旅程并非一帆风顺，有些起义在诞生之初就被残酷镇压，有些反乱因矛盾间计而分崩离析，还有些政变事成之后演变为了新的专制政府。但人民是睿智的，即使再愚钝，也不会在变革中一无所获。\n\n随着社会的进步，集体的力量愈发强大，而个人的力量愈加渺小。统治者们惊慌失措地施以决策，却无法再次愚弄觉醒的民众，终于被永远驱逐出了历史的舞台。\n\n时光荏苒，[this.GetName]已经走过了上百年的岁月，在这期间[this.GetSpeciesName]蓬勃发展，一路破除难关，剑指天上苍穹。\n\n[this.GetName]所在之处，民主平等亘古长存。"
