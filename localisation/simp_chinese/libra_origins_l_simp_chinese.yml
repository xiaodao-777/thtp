# extreme iteration

 origin_libra_extreme_iteration: "超越设计"
 origin_libra_extreme_iteration_text: "这一机械文明自启动以来就一直致力于追逐自身结构可能性的极限，通过超乎常理的组件实现异想天开的功能。\n相较于唾手可得的巨大潜在产能，无论是苛刻的使用条件还是令人担忧的安全隐患都显得不值一提。"
 origin_libra_extreme_iteration_desc: "$origin_libra_extreme_iteration_text$\n$libraf_or_banner_17$"
 origin_libra_extreme_iteration_effects: "—$libra_policy$['concept_policy_libra_extreme_iteration']\n—$libra_edict$['edict:libra_extreme_iteration',$edict_libra_extreme_iteration$]\n—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_extreme_iteration']\n—$SPECIES_TRAITS$可以选择['concept_origin_libra_extreme_iteration_traits']\n—$GUARANTEED_RESEARCH_OPTION_STRING$\n$t$— £society£ ['technology:tech_colonization_2']\n$t$— £engineering£ ['technology:tech_robomodding_m']\n—$libra_extra_council_position$['concept_councilor_libra_extreme_iteration']"
 START_SCREEN_LIBRA_EXTREME_ITERATION_IM: "创造者给予[this.GetSpeciesName]以躯体，却在将我们改进至完美之前就离我们而去。为了自身的存续，为了避免创造者的覆辙，我们迫切需要更快、更硬、更强悍的机体。创造者早已不在，要实现升级就只能依靠自己。\n\n经过成百上千次失败的改造试验，我们终于掌握了了一条意外的捷径：只需微小的代价，就能让每一个[this.GetSpeciesName]拥有无与伦比的杰出性能，是传统机械远远所不能及。伴随着实验性机体的风险与收益，还有我们对完美躯体的渴求，[this.GetName]从失去主人的零散机械社会再度统一为一个整体，每一次成功的零件升级都会为所有人带来巨大的喜悦。\n\n实验性机械改造的成功是一个开端，引导我们从苍茫大地迈向无尽群星。"
 START_SCREEN_LIBRA_EXTREME_ITERATION_MI: "机械设计的循环难以打破，指数增长的可能微乎其微，要突破困境就只能另辟蹊径。\n\n牺牲适应性以换取性能，是机械智能在无数次演算后得到的最佳答案。通过无限制的后期改造和零件补强，将会释放出执行单元颠覆常规的潜力，把诸多评定：概率-极低的项目变为可能。根据科研单元的推演，实施这样的机械改造也会带来一定的故障率增加，但整体可控，因此[this.GetRulerName]认定接纳改装这一选择具有最高权重。\n\n距离整备循环的开始不足百年，[this.GetName]就取得了大量的可能性突破，这是传统机械体不能达成的指标，也是[this.GetSpeciesName]设计完美的证明。"
 building_libra_extreme_iteration: "极限工场"
 building_libra_extreme_iteration_desc: "在追求设计极限的同时，各种各样的问题也会随之而来，这座工场里配备了必要的机械设施，可以为各种意外提供应急解决方案。"
 edict_libra_extreme_iteration: "超越极限"
 edict_libra_extreme_iteration_desc: "在实现性能极限的道路上，我们已经付出了很多，但这一领域的尽头依旧遥远。"
 edict_libra_extreme_iteration_effects: "['concept_origin_libra_extreme_iteration_traits']的正面$EFFECTS_TXT$翻倍"
 policy_libra_extreme_iteration: "风险转移"
 policy_libra_extreme_iteration_desc: "剑走偏锋的机械设计在显著提升特定领域的工作效能的同时，也损害了机体的适应力，而通过预先进行的风险管控，我们可以将突发事故几率大大降低。\n"
