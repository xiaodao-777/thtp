 civic_libra_eden_accord_g: "生态编目"
 civic_libra_eden_accord_g_desc: "见证了创造者在工业时代的污染与星系时代的破坏，这个机械智能将环境保护与生态调试列为优先事项。\n$libraf_oc_banner_11$"
