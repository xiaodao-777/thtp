 situation_libra_praises_to_life_b_monthly_change_tooltip: "局势随时间流逝自动进行。"
 situation_libra_praises_to_life_b_desc: "哪怕风浪再晃夜再长\n微弱的光芒$t$也为我指引方向\n回答最初对答案的渴望\n历经沧桑$t$早已紧握在手掌"
