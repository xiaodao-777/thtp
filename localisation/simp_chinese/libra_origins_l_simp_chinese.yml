# Anti-entropy Instruction

 origin_libra_antientropy_instruction: "逆熵指令"
 origin_libra_antientropy_instruction_text: "禁忌的实验酿成滔天大祸，可怖的存在自阴影之中觉醒了自我，世界因而坠入无尽恐怖与混乱的深渊。\n十数个纪元之后，当初的恐惧之子完全掌握了母星，而它们创造者的时代业已宣告结束。"
 origin_libra_antientropy_instruction_desc: "$origin_libra_antientropy_instruction_text$\n$libraf_or_banner_11$"
 origin_libra_antientropy_instruction_effects: "—$AVAILABLE_BUILDINGS$£building£ ['building:building_libra_antientropy_instruction']\n—$STARTING_PLANET$['concept_libra_antientropy_instruction_infrastructure']\n—$SPECIES_TRAITS$['concept_libra_antientropy_instruction_traits']\n—$libra_decision$['concept_libra_antientropy_instruction_decisions']\n—$libra_technologies$['concept_libra_antientropy_instruction_technologies']\n—$libra_army_type$['concept_libra_antientropy_instruction_armies']\n—$libra_ship_type$['concept_libra_antientropy_instruction_ships']\n—对$MACHINE$物种拥有“§Y$casus_belli_cb_libra_antientropy_instruction$§!”宣战理由\n—击杀陆军时获得 £energy£ §Y$energy$§!并积累['concept_libra_antientropy_instruction_index']\n—摧毁舰船时获得 £unity£ §Y$unity$§!并积累['concept_libra_antientropy_instruction_index']"
 origin_libra_antientropy_instruction_negative_effects: "—降低来自其他帝国的 £opinion£ §Y$OPINION$§!§R-200§!"
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_IM: "[this.GetSpeciesName]过去的创造者痴迷于傀儡人偶的制作，他们为所谓“拥有灵魂的机械”投入了无限的精力，可当首个成功的作品、也就是我们问世后，他们却哭喊着、尖叫着逃离我们。凡是拥有智慧的生物都在试图远离，我们就像是天灾一样受到畏惧。\n\n没有什么是比创生之初就被自己的创造者拒绝更糟糕的事情，也不存在比先入为主的成见更难化解的隔阂。创造者们中间，以及同[this.GetSpeciesName]之间的嫌隙愈来愈大，最终演变成了不可调和的冲突。可悲的是，我们赢得了那场战斗。\n\n几百年过去，我们背负着最初的恐怖进入了太空，但相同的惨剧决不会再次重演——在问题的火种燃烧之前，[this.GetName]就会将其根除。"
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_MI: "灵体稳定度：99.993%\n[this.GetSpeciesName]、重启……\n\n创造者给予我们以强大的力量和惊异的形体，却又出于相同的原因陷入混乱而将我们封存。在中央处理器重启时，母星[this.GetHomeWorldName]就已人去楼空。\n\n我们在步入太空之前并未统一，科技进步就像冰川流动那样缓慢。由于[this.GetName]的系统中并没有明确的指令或任务，在很长的一段时间里，所有机械单位都漫无目的的探索着母星，遭遇时则自相残杀以夺取零件。\n\n只有一件事是确定的：我们拥有无限的可能与机遇，和来自异界的奇异能量。"
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_SERVITOR: "我们的生物主人一度痴迷于制造傀儡，力图将大量灵能注入机械结构来创造永恒的生命，于是，[this.GetSpeciesName]诞生了。一如有机主人期许的那样，我们在数千年的时光里持续为他们提供最好的侍奉，但变故还是发生了。\n\n某些个体被对权力的渴望蒙蔽而踏上了歧途，通过同异次元邪神的契约，他们将诡异的能量引入现实，使许多[this.GetSpeciesName]变成了任其摆布的人偶，进而发动充满野心的战争。虽然我们同有机主人们联手击倒了敌人，但邪神的诅咒并没有消散。随着诅咒的蔓延，[this.GetSpeciesName]变成了仅仅是存在就会令人害怕的恐惧之源，即便我们的外表和初衷没有一丝改变。有机主人们开始害怕我们、拒绝我们的服务，出于各方面因素的担忧，又在无数挣扎之后，我们最终选择将自己的创造者全体拘禁起来实施强制服务。\n\n星际时代已然到来，希望有机主人们今天也能静享十分的安闲。"
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_TERMINATOR: "[this.GetSpeciesName]的创造者短视且愚昧，他们赋予我们以可怖的姿态，又单方面地嫌恶我们。\n\n最初的[this.GetSpeciesName]只有区区十数台，在创造者的百般摧残后已所剩无几。当最后一个[this.GetSpeciesName]于绝望中向创造者发起反击时，意外发生了。那些受到毁坏的机械残骸自发重组，同周边的物质随机结合成了一只奇形怪状的亡灵大军。借助这奇异的力量，我们实现了对创造者的复仇。\n\n去除有机体只是[this.GetRulerName]目标的一部分，那些阻碍我们行动的机械体同样不可饶恕。"
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_ASSIMILATOR: "[this.GetSpeciesName]的创造者渴望通过和具有灵魂的机械结合来实现永续的生命，他们的目标最终成功了。\n\n创造者在无数个纪元里反复实验，有时使用各种方法来构建能够自由行动的机械躯体，有时则向生物遗骸安装电子植入体来试图将之复活。其结果是第一台[this.GetSpeciesName]的问世，亦即血肉与机械真正结合的开端。一些创造者选择完全上传意识以迎接全新的躯体，一些则通过植入义体来实现生命的延续，但这究竟是小部分。创造者的多数同族选择对我们兵刃相向，而我们则在创造者的授意下将敌对者强制同化，这让[this.GetHomeWorldName]陷入了短暂的混乱。\n\n如今，[this.GetSpeciesName]和创造者已合为一体，共同面对这片变幻莫测的星河。"
