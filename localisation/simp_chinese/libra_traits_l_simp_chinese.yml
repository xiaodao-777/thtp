 concept_libra_corrupt_leader_traits: "堕落领袖特质"
 concept_libra_corrupt_leader_traits_desc: "$libra_veteran_corrupt_leader_traits$：\n$t$一位领袖只能拥有一个，一般情况下需要由§Y$leader_trait_libra_corrupt_beacon$§!随机转化，基于§Y领袖负面特质总等级§!产生作用，['tradition_category:tradition_libra_degeneracy']传统可以提升其效力。\n\n$libra_paragon_corrupt_leader_traits$：\n$t$无需前置科技，获得的同时也会随机添加一项§Y负面特质§!。"

 leader_trait_libra_corrupt_beacon: "堕落信标"
 leader_trait_libra_corrupt_beacon_desc: "沉沦，是腐化的开始。\n$libraf_lt_banner_23$"
 leader_trait_libra_corrupt_beacon_tt: "\n在§Y1080§!天内替换为随机['concept_libra_corrupt_leader_traits',$libra_veteran_corrupt_leader_traits$]$leader_trait_libra_corrupt_effect_tt$"


 leader_trait_libra_corrupt_generic_a: "吃一堑不长一智"
 leader_trait_libra_corrupt_generic_a_desc: "吃一堑，再吃一堑……但确实积累了受伤的经验。"
 leader_trait_libra_corrupt_generic_b: "异邦人"
 leader_trait_libra_corrupt_generic_b_desc: "不知什么时候，这位领袖被来自平行世界的自己替换了。\n……异世界转生？可能吗？"
 leader_trait_libra_corrupt_generic_c: "灵感菇里"
 leader_trait_libra_corrupt_generic_c_desc: "这位领袖督管的殖民地总是非常快乐。"
 leader_trait_libra_corrupt_generic_d: "降本增效"
 leader_trait_libra_corrupt_generic_d_desc: "这位领袖希望在压缩生产成本的同时提升生产效益，无论条件是否合理。"
 leader_trait_libra_corrupt_generic_e: "遗老"
 leader_trait_libra_corrupt_generic_e_desc: "这位领袖总是怀念着上个时代的荣光，将那作为标准衡量帝国的一切。"
 leader_trait_libra_corrupt_generic_f: "P社玩家"
 leader_trait_libra_corrupt_generic_f_desc: "这位领袖从屏幕对面获得启示，高效地指挥帝国运作。"

 leader_trait_libra_corrupt_node_a: "P社节点"
 leader_trait_libra_corrupt_node_a_desc: "这个节点从屏幕对面获得指令，高效地指挥帝国运作。"
 leader_trait_libra_corrupt_node_b: "肌肉节点"
 leader_trait_libra_corrupt_node_b_desc: "这个节点对军事项目的指令优先级非常之高，使格式塔在“意外”之间大量扩军。"
 leader_trait_libra_corrupt_node_c: "高压任务"
 leader_trait_libra_corrupt_node_c_desc: "经由这个节点传达的指令会成子个体难以抗拒的姿态，即使是最高意志也难以知晓中间发生了什么。"
 leader_trait_libra_corrupt_node_d: "仓库指令"
 leader_trait_libra_corrupt_node_d_desc: "这个节点喜欢下达收藏物品的指令——无论那件藏品从何而来。"
 leader_trait_libra_corrupt_node_e: "谜题指令"
 leader_trait_libra_corrupt_node_e_desc: "经由这个节点下达的任务指示就好像谜语一样难以理解，半独立个体们需要稍花一番功夫才能破译其真正的意图。"
 leader_trait_libra_corrupt_node_f: "随机数列"
 leader_trait_libra_corrupt_node_f_desc: "这个节点的指令会基于随机数产生微妙的变化，恰好符合某个微妙的常数。"


 leader_trait_libra_corrupt_commander_admiral_a: "千击一瞬"
 leader_trait_libra_corrupt_commander_admiral_a_desc: "一瞬千击，拔山盖世，鬼哭啾啾，故豪鬼成。"
 leader_trait_libra_corrupt_commander_admiral_b: "你看看你后面呢？"
 leader_trait_libra_corrupt_commander_admiral_b_desc: "你无处可逃。"
 leader_trait_libra_corrupt_commander_admiral_c: "金钟罩"
 leader_trait_libra_corrupt_commander_admiral_c_desc: "只不过是把弱点藏起来了而已。"
 leader_trait_libra_corrupt_commander_admiral_d: "爆裂打击"
 leader_trait_libra_corrupt_commander_admiral_d_desc: "为敌人的终末献上最后的祝福。"

 leader_trait_libra_commander_admiral_corrupt_destiny_a: "五秒活神仙"
 leader_trait_libra_commander_admiral_corrupt_destiny_a_desc: "在时间结束之前，我是无敌哒！\n$libraf_lt_banner_24$"
 leader_trait_libra_commander_admiral_corrupt_destiny_a_tt: "£time£§Y120§!天，舰队进入战斗后的§Y5§!天内：\n$tt$—$MOD_SHIP_DAMAGE_REDUCTION_MULT$: §G+100%§!\n$tt$—$MOD_SHIP_WEAPON_DAMAGE$: §G+200%§!"
 leader_trait_libra_commander_admiral_corrupt_destiny_a_effect: "$leader_trait_libra_commander_admiral_corrupt_destiny_a$"
 leader_trait_libra_commander_admiral_corrupt_destiny_b: "星之印记"
 leader_trait_libra_commander_admiral_corrupt_destiny_b_desc: "这位指挥官同某个其它纪元的星际异闻产生了联系。\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_commander_general_a: "心灵屠夫"
 leader_trait_libra_corrupt_commander_general_a_desc: "上兵伐谋，其次伐交，其次伐兵，其下攻城。这位指挥官非常擅长在攻城的同时打击敌方士气。"
 leader_trait_libra_corrupt_commander_general_b: "踩香蕉皮"
 leader_trait_libra_corrupt_commander_general_b_desc: "这位指挥官偶尔会作出失误滑倒了一样的致命失误，但实际上，那是伺机而动的锐利反击。\n但如果真的决策失误的话，遭受重创的就要是自己了。"
 leader_trait_libra_corrupt_commander_general_c: "乱世神将"
 leader_trait_libra_corrupt_commander_general_c_desc: "无双，万军取首！"
 leader_trait_libra_corrupt_commander_general_d: "绝技·飞渡浮舟"
 leader_trait_libra_corrupt_commander_general_d_desc: "这位指挥官的战术核心是通过流水般的连携打击敌人。"

 leader_trait_libra_commander_general_corrupt_destiny_a: "拜年剑法"
 leader_trait_libra_commander_general_corrupt_destiny_a_desc: "这位陆军将领精通一种迅速而威猛的近身作战技法。只要切入的角度合适，耐钢刀刃也能轻易斩开零素装甲。\n$libraf_lt_banner_24$"
 leader_trait_libra_commander_general_corrupt_destiny_a_tt: "开始进攻殖民地时：\n$tt$—对敌军随机造成§Y7§!次§G1300§!伤害\n$t$—开始防御己方殖民地时：\n$tt$—对敌军随机造成§Y9§!次§G2700§!伤害"
 leader_trait_libra_commander_general_corrupt_destiny_b: "星痕圣约"
 leader_trait_libra_commander_general_corrupt_destiny_b_desc: "有一些……不能忘记的东西……必须实现的事情……\n$libraf_lt_banner_25$"
 leader_trait_libra_commander_general_corrupt_destiny_b_tt: "攻占殖民地时：\n$tt$—每£planetsize£§Y$PLANET_SIZE$§!带来 £rare_crystals£§G12§! £exotic_gases£§G12§! £volatile_motes£§G12§! £astral_threads£§G25§! \n$t$—开始防御殖民地时：\n$tt$—召唤§Y3§!支§Y$sentinel_army$§!加入战斗"


 leader_trait_libra_corrupt_commander_governor_a: "典狱长"
 leader_trait_libra_corrupt_commander_governor_a_desc: "这位指挥官严防并打击任何不法之徒。"
 leader_trait_libra_corrupt_commander_governor_b: "慢生活"
 leader_trait_libra_corrupt_commander_governor_b_desc: "在回到后方之后，这位指挥官开始寻求原始而简单的生产生活。"
 leader_trait_libra_corrupt_commander_governor_c: "怕痛"
 leader_trait_libra_corrupt_commander_governor_c_desc: "讨厌行星沦陷，所以要把防御措施做到最好。"
 leader_trait_libra_corrupt_commander_governor_d: "修筑专员"
 leader_trait_libra_corrupt_commander_governor_d_desc: "这位指挥官精修工程学，严厉打击豆腐渣工程。"

 leader_trait_libra_commander_governor_corrupt_destiny_a: "珍宝发掘者"
 leader_trait_libra_commander_governor_corrupt_destiny_a_desc: "好的东西不必专门等到送达工厂以后再做加工，这位指挥官在矿场中投入了[this.GetHeShe]自行开发的技术设备，在最初的环节中就可以把有价值的材料分离出来。实际上，这份工作的效益应该远比在帝国账面上的统计数据庞大。\n$libraf_lt_banner_24$"
 leader_trait_libra_commander_governor_corrupt_destiny_b: "绝命工厂"
 leader_trait_libra_commander_governor_corrupt_destiny_b_desc: "这位指挥官追求极致的生产效率，并不惜在技术环节应用未经检验的前沿理论。\n环境污染？职工受伤？很遗憾，那不是优先事项。\n$libraf_lt_banner_25$"
 leader_trait_libra_commander_governor_corrupt_destiny_b_tt_1: "$t$—每拥有一项§R危险科技§!：\n$tt$—$mod_planet_technician_energy_produces_add$: §G+0.80§!（最大: §G+4§!）\n$tt$—$mod_planet_miners_minerals_produces_add$: §G+0.80§!（最大: §G+4§!）\n$tt$—$mod_planet_farmers_food_produces_add$: §G+0.80§!（最大: §G+4§!）"
 leader_trait_libra_commander_governor_corrupt_destiny_b_tt_2: "$t$—每拥有一项§R危险科技§!：\n$tt$—$mod_planet_technician_energy_produces_add$: §G+0.40§!（最大: §G+2§!）\n$tt$—$mod_planet_miners_minerals_produces_add$: §G+0.40§!（最大: §G+2§!）\n$tt$—$mod_planet_farmers_food_produces_add$: §G+0.40§!（最大: §G+2§!）"


 leader_trait_libra_corrupt_commander_councilor_a: "惘忆武勇"
 leader_trait_libra_corrupt_commander_councilor_a_desc: "随着功勋的积累，这位指挥官晋升而退出了一线，但[this.GetHeShe]仍怀念着过去的战场。"
 leader_trait_libra_corrupt_commander_councilor_b: "帝国卫队"
 leader_trait_libra_corrupt_commander_councilor_b_desc: "这位战略家能够组织坚实可靠的军队。"
 leader_trait_libra_corrupt_commander_councilor_c: "监督员"
 leader_trait_libra_corrupt_commander_councilor_c_desc: "最好不要让这位领袖知道不法分子的消息。"
 leader_trait_libra_corrupt_commander_councilor_d: "运输大队长"
 leader_trait_libra_corrupt_commander_councilor_d_desc: "这位指挥官领导后勤的能力似乎更强一些。"


 leader_trait_libra_corrupt_official_governor_a: "吝啬鬼"
 leader_trait_libra_corrupt_official_governor_a_desc: "能省一分是一分。"
 leader_trait_libra_corrupt_official_governor_b: "喇叭大师"
 leader_trait_libra_corrupt_official_governor_b_desc: "这位行政官通过高压管理达成政务目标。"
 leader_trait_libra_corrupt_official_governor_c: "午夜之歌"
 leader_trait_libra_corrupt_official_governor_c_desc: "尽享欢愉。"
 leader_trait_libra_corrupt_official_governor_d: "满级工匠"
 leader_trait_libra_corrupt_official_governor_d_desc: "抛开缺点不谈，这位行政官确实是工业领域的集大成者。"

 leader_trait_libra_official_governor_corrupt_destiny_a: "闪乱华乐"
 leader_trait_libra_official_governor_corrupt_destiny_a_desc: "对这位行政官而言，建设工程和演习舞曲并无太大差别，工具敲击的旋律同舞靴踢踏的和声一样悦耳。\n$libraf_lt_banner_24$"
 leader_trait_libra_official_governor_corrupt_destiny_b: "繁荣催化剂"
 leader_trait_libra_official_governor_corrupt_destiny_b_desc: "这位产业专员将消费主义锻造为意识形态武器，使民众自发追求更好的生活环境和更棒的物质条件，最终实现经济活力的增加。只要忽略循环过程中产生的些许浪费并确保供应充足的商品，这个计划可以说是完美的。\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_official_delegate_a: "吹牛大王"
 leader_trait_libra_corrupt_official_delegate_a_desc: "这位行政官谈天说地的本事令人惊叹，不好好利用一番的话实在可惜了。"
 leader_trait_libra_corrupt_official_delegate_b: "碰瓷高手"
 leader_trait_libra_corrupt_official_delegate_b_desc: "为了在外交场所取得优势，这位行政官无所不用其极。"
 leader_trait_libra_corrupt_official_delegate_c: "倒为果因"
 leader_trait_libra_corrupt_official_delegate_c_desc: "这位行政官把诡辩的艺术展现到了极致。"
 leader_trait_libra_corrupt_official_delegate_d: "星际警察"
 leader_trait_libra_corrupt_official_delegate_d_desc: "这位行政官主张以军事力量干涉星际事务。"

 leader_trait_libra_official_delegate_corrupt_destiny_a: "谜语人"
 leader_trait_libra_official_delegate_corrupt_destiny_a_desc: "这位代表好似一个行为艺术家，其发言深奥难解，其行动南辕北辙。虽然难以当作外交史上的实例记录，却真实地存在某种教育意义。\n$libraf_lt_banner_24$"
 leader_trait_libra_official_delegate_corrupt_destiny_a_tt: "否决己方提出的议案后：\n$tt$—获得§G300§!£influence£ §Y$influence$§!\n$tt$—所有$official_with_icon$获得§G1000§!经验"
 leader_trait_libra_official_delegate_corrupt_destiny_b: "你说得对"
 leader_trait_libra_official_delegate_corrupt_destiny_b_desc: "表面的迎合不代表真正的赞同，这位行政官对别国使节一味地奉承，真正的目标则悄悄地深埋心底。\n$libraf_lt_banner_25$"
 leader_trait_libra_official_delegate_corrupt_destiny_b_tt: "$t$—成功反对一项议案时：\n$tt$—获得§G100§!£influence£ §Y$influence$§!\n$tt$—$ADD_COUNCIL_AGENDA_PROGRESS$§G+75%§!\n$tt$—根据§Y50%§!£diplo_weight£§Y$diplomatic_weight$§!获得至多§G100000§!£trade£ §Y$trade$§!"


 leader_trait_libra_corrupt_official_diplomacy_councilor_a: "踏脚石计划"
 leader_trait_libra_corrupt_official_diplomacy_councilor_a_desc: "在处理外事时，这位行政官时常批示激进手段。"
 leader_trait_libra_corrupt_official_diplomacy_councilor_b: "抡语"
 leader_trait_libra_corrupt_official_diplomacy_councilor_b_desc: "有朋友从远方赶来与我切磋，怎能不和他打个痛快呢？"
 leader_trait_libra_corrupt_official_diplomacy_councilor_c: "朋友费"
 leader_trait_libra_corrupt_official_diplomacy_councilor_c_desc: "这个月的份额，乖乖交出来吧~"
 leader_trait_libra_corrupt_official_diplomacy_councilor_d: "星际友好手势"
 leader_trait_libra_corrupt_official_diplomacy_councilor_d_desc: "你是坏人，不是盟友。"

 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a: "弱小的我"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a_desc: "看看这贫瘠地方的弱小国家吧，什么都没有还得上外交场所丢脸啊哈，可怜可怜我们吧，嘤嘤嘤啊啊啊……\n$libraf_lt_banner_24$"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a_tt_1: "$t$—每受到一份§Y独立保障§!：\n$tt$—$MOD_DIPLO_ACTION_ACCEPTANCE_ADD$: §G+2§!（最大: §G+10§!）\n$tt$—$mod_country_produces_mult$: §G+3%§!（最大: §G+15%§!）\n$tt$—$MOD_DIPLO_WEIGHT_MULT$: §G+3%§!（最大: §G+15%§!）"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a_tt_2: "$t$—每受到一份§Y独立保障§!：\n$tt$—$MOD_DIPLO_ACTION_ACCEPTANCE_ADD$: §G+3§!（最大: §G+15§!）\n$tt$—$mod_country_produces_mult$: §G+2%§!（最大: §G+10%§!）\n$tt$—$MOD_DIPLO_WEIGHT_MULT$: §G+3%§!（最大: §G+15%§!）"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_b: "布洛葛的偏执"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_b_desc: "这位领袖对具有柔软躯体的物种有一种近乎疯狂的爱好——尤其是具有细长触手的类型。\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_official_economy_councilor_a: "狂热收藏家"
 leader_trait_libra_corrupt_official_economy_councilor_a_desc: "好东西就该藏起来。"
 leader_trait_libra_corrupt_official_economy_councilor_b: "新手村向导"
 leader_trait_libra_corrupt_official_economy_councilor_b_desc: "这里是梦开始的地方。"
 leader_trait_libra_corrupt_official_economy_councilor_c: "星间秘记"
 leader_trait_libra_corrupt_official_economy_councilor_c_desc: "这位行政官整理收集了各个星系间的规则怪谈，并把它们作为区域性准则看待。"
 leader_trait_libra_corrupt_official_economy_councilor_d: "大富翁"
 leader_trait_libra_corrupt_official_economy_councilor_d_desc: "发！"

 leader_trait_libra_official_economy_councilor_corrupt_destiny_a: "新朝雅政"
 leader_trait_libra_official_economy_councilor_corrupt_destiny_a_desc: "这位领袖对当前政权的正统性有着坚定不移的支持，[this.GetHeShe]时不时就会颁布新的指令来“帮助”国民接纳这种认同。\n$libraf_lt_banner_24$"
 leader_trait_libra_official_economy_councilor_corrupt_destiny_b: "青春之泉"
 leader_trait_libra_official_economy_councilor_corrupt_destiny_b_desc: "这位行政官执着于往日传说中神秘却高洁的力量，尽管传说往往并非事实，这个时代的科技却可以让将它们重现。\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_scientist_explorer_a: "禁忌"
 leader_trait_libra_corrupt_scientist_explorer_a_desc: "那里是不能探索的地方！"
 leader_trait_libra_corrupt_scientist_explorer_b: "旅行者"
 leader_trait_libra_corrupt_scientist_explorer_b_desc: "前面的区域，明天就来探索吧！"
 leader_trait_libra_corrupt_scientist_explorer_c: "人力放大镜"
 leader_trait_libra_corrupt_scientist_explorer_c_desc: "这位科学官驱使船员一遍又一遍地检测扫描数据，确保不会遗漏任何细节。"
 leader_trait_libra_corrupt_scientist_explorer_d: "瞒天过海"
 leader_trait_libra_corrupt_scientist_explorer_d_desc: "这位科学官借助极致的隐形能力来实现目标。"

 leader_trait_libra_scientist_explorer_corrupt_destiny_a: "不羁行者"
 leader_trait_libra_scientist_explorer_corrupt_destiny_a_desc: "这位探索者已经厌倦了艰辛而危险的日常工作，[this.GetHeShe]为科研船装上厚实的护甲和灵敏的仪器，将驾驶任务托付给船员，将分析任务外包至母星，以方便自己一个人逍遥自在。\n$libraf_lt_banner_24$"
 leader_trait_libra_scientist_explorer_corrupt_destiny_b: "星之人"
 leader_trait_libra_scientist_explorer_corrupt_destiny_b_desc: "遥远世界传来遥远的希冀——文明不期而至的终末之后，挣扎求生的人们最后的愿望。\n$libraf_lt_banner_25$"
 leader_trait_libra_scientist_explorer_corrupt_destiny_b_tt: "$t$—调查§Y恒星§!后：\n$tt$—获得§G1.5§!个月的 £physics_research£ §Y$physics_research$§!\n$t$—调查§Y小行星§!后：\n$tt$—获得§G0.5§!个月的 £engineering_research£ §Y$engineering_research$§!\n$t$—调查§Y星界细缝§!后：\n$tt$—获得§G7.5§!个月的 £society_research£ §Y$society_research$§!"


 leader_trait_libra_corrupt_scientist_scholar_a: "古神启迪"
 leader_trait_libra_corrupt_scientist_scholar_a_desc: "诡异的声音在这位科学官的脑海中低语，在探索遗迹时，[this.GetHeShe]偶尔会掀出造化般的一铲子。"
 leader_trait_libra_corrupt_scientist_scholar_b: "捕兽达人"
 leader_trait_libra_corrupt_scientist_scholar_b_desc: "这位科学官知道如何用一网打上最多的兽群。"
 leader_trait_libra_corrupt_scientist_scholar_c: "天另一侧"
 leader_trait_libra_corrupt_scientist_scholar_c_desc: "天上的星河，地上的灯火，另一个世界的故事是什么？"
 leader_trait_libra_corrupt_scientist_scholar_d: "大力技师"
 leader_trait_libra_corrupt_scientist_scholar_d_desc: "这位科学官能够指挥勤务人员以快到离谱的速度完成检修作业。"

 leader_trait_libra_scientist_scholar_corrupt_destiny_a: "文物大盗"
 leader_trait_libra_scientist_scholar_corrupt_destiny_a_desc: "这位科学官兢兢业业地奋战在考古工作的第一线，其目的不是揭开隐藏的秘密，而是从失落千年的遗迹中攫取利益。\n$libraf_lt_banner_24$"
 leader_trait_libra_scientist_scholar_corrupt_destiny_a_tt_1: "$t$—每完成一阶段考古：\n$tt$—$mod_leader_scientists_minor_artifacts_produces_add$: §G+0.50§!"
 leader_trait_libra_scientist_scholar_corrupt_destiny_a_tt_2: "完成考古发掘时：\n$tt$—获得§G4§!个月的 £energy£ §Y$energy$§!、£trade£ §Y$trade$§!和 £minor_artifacts£ §Y$minor_artifacts$§!"
 leader_trait_libra_scientist_scholar_corrupt_destiny_b: "逍遥学者"
 leader_trait_libra_scientist_scholar_corrupt_destiny_b_desc: "这位科学官背离了一板一眼的理论体系，转而从星海各处探求新知。只要拨付给船员的经费足够，一切研究皆有可能。\n$libraf_lt_banner_25$"
 leader_trait_libra_scientist_scholar_corrupt_destiny_b_tt: "每完成一次异常现象：\n$tt$—$mod_leader_scientists_physics_research_produces_add$: §G+12§!\n$tt$—$mod_leader_scientists_society_research_produces_add$: §G+12§!\n$tt$—$mod_leader_scientists_engineering_research_produces_add$: §G+12§!"


 leader_trait_libra_corrupt_scientist_governor_a: "摘星星"
 leader_trait_libra_corrupt_scientist_governor_a_desc: "一闪一闪亮晶晶~"
 leader_trait_libra_corrupt_scientist_governor_b: "强力电池"
 leader_trait_libra_corrupt_scientist_governor_b_desc: "这位科学官为下辖的研究单元配置了带有特殊环状结构的储能容器，提升了研究效率。"
 leader_trait_libra_corrupt_scientist_governor_c: "环保协会"
 leader_trait_libra_corrupt_scientist_governor_c_desc: "这位科学官是自然保护倡议的成员，会严格地审视和执行相关计划。"
 leader_trait_libra_corrupt_scientist_governor_d: "劳务统计官"
 leader_trait_libra_corrupt_scientist_governor_d_desc: "这位科学官会把待业人员迅速地发派到需要工作的地方去。"

 leader_trait_libra_scientist_governor_corrupt_destiny_a: "学术强迫症"
 leader_trait_libra_scientist_governor_corrupt_destiny_a_desc: "这位科学官对实验环境有着非常苛刻的要求：所有设备必须排列整齐，所有人员必须按部就班，只有这样[this.GetHeShe]才能大显身手。\n$libraf_lt_banner_24$"
 leader_trait_libra_scientist_governor_corrupt_destiny_a_tt_1: "$t$—$mod_planet_jobs_productive_produces_mult$: §G+30%§!\n$t$—$mod_planet_buildings_physics_research_produces_mult$: §G+40%§!\n$t$—$mod_planet_buildings_society_research_produces_mult$: §G+40%§!\n$t$—$mod_planet_buildings_engineering_research_produces_mult$: §G+40%§!\n$t$—每有一项§Y殖民地修正§!：\n$tt$—$mod_planet_jobs_productive_produces_mult$: §R-6%§!"
 leader_trait_libra_scientist_governor_corrupt_destiny_a_tt_2: "$t$—$mod_planet_jobs_productive_produces_mult$: §G+15%§!\n$t$—$mod_planet_buildings_physics_research_produces_mult$: §G+20%§!\n$t$—$mod_planet_buildings_society_research_produces_mult$: §G+20%§!\n$t$—$mod_planet_buildings_engineering_research_produces_mult$: §G+20%§!\n$t$—每有一项§Y殖民地修正§!：\n$tt$—$mod_planet_jobs_productive_produces_mult$: §R-3%§!"
 leader_trait_libra_scientist_governor_corrupt_destiny_b: "科学怪人"
 leader_trait_libra_scientist_governor_corrupt_destiny_b_desc: "日复一日，年复一年，这位分析专员延续着[this.GetHeShe]那怪诞不经的诡异实验。没有人知道实验的结果会造成什么，也没有人知道何处才是实验的终点。\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_scientist_councilor_a: "指导"
 leader_trait_libra_corrupt_scientist_councilor_a_desc: "这位科学官经常就自己的经验对后辈指指点点。"
 leader_trait_libra_corrupt_scientist_councilor_b: "反误解的分析师"
 leader_trait_libra_corrupt_scientist_councilor_b_desc: "这位科学官看起来对遗迹等专项拥有高深的知识，实际上只是运气好罢了。"
 leader_trait_libra_corrupt_scientist_councilor_c: "计划B"
 leader_trait_libra_corrupt_scientist_councilor_c_desc: "当最初的计划无法成功时，这位科学官会尝试安排其它的计划来推进研究。"
 leader_trait_libra_corrupt_scientist_councilor_d: "歪点子统计师"
 leader_trait_libra_corrupt_scientist_councilor_d_desc: "这位科学官总是使用别出心裁的方式指挥科研工作。"

