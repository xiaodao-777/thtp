# 产业专员

 leader_trait_libra_official_governor_destiny_a: "效应触发器"
 leader_trait_libra_official_governor_destiny_a_desc: "规模效应是一把双刃剑，但对这位行政官来说则不是问题。\n[this.GetHeShe]机警地平衡风险与收益，将产业集群带来的生产力优势最大化。\n$libraf_lt_banner_15$"
 leader_trait_libra_official_governor_destiny_a_tt_1: "$t$—§Y$SECTOR$§!中每有一处殖民地：\n$tt$—$mod_planet_buildings_produces_mult$: §G+5%§!（最大: §G+35%§!）\n$tt$—$mod_planet_jobs_specialist_produces_mult$: §G+5%§!（最大: §G+35%§!）"
 leader_trait_libra_official_governor_destiny_a_tt_2: "$t$—§Y$SECTOR$§!中每有一处殖民地：\n$tt$—$mod_planet_buildings_produces_mult$: §G+3%§!（最大: §G+21%§!）\n$tt$—$mod_planet_jobs_specialist_produces_mult$: §G+3%§!（最大: §G+21%§!）"

 leader_trait_libra_official_governor_destiny_b: "效能集中"
 leader_trait_libra_official_governor_destiny_b_desc: "这位行政官可谓效率的代名词，[this.GetHeShe]巧妙的生产规划能把整个星域的损耗降低至极限。\n$libraf_lt_banner_15$"
 leader_trait_libra_official_governor_destiny_b_tt_1: "$t$—§Y$SECTOR$§!中每有一个星系：\n$tt$—$mod_planet_jobs_productive_upkeep_mult$: §G-2%§!（最大: §G-30%§!）"
 leader_trait_libra_official_governor_destiny_b_tt_2: "$t$—§Y$SECTOR$§!中每有一个星系：\n$tt$—$mod_planet_jobs_productive_upkeep_mult$: §G-1%§!（最大: §G-15%§!）"

 leader_trait_libra_official_governor_destiny_c: "统制归一"
 leader_trait_libra_official_governor_destiny_c_desc: "集中力量才能办成大事，人心不齐的殖民地难以长远地发展，这位领袖坚定地认为。\n$libraf_lt_banner_15$"
 leader_trait_libra_official_governor_destiny_c_tt_1: "$t$—殖民地每有1%£pop£§Y主流思潮$POP$§!：\n$tt$—$specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+0.3%§!"
 leader_trait_libra_official_governor_destiny_c_tt_2: "$t$—殖民地每有1%£pop£§Y主流思潮$POP$§!：\n$tt$—$specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+0.2%§!"

 leader_trait_libra_official_governor_destiny_d: "帝国文书"
 leader_trait_libra_official_governor_destiny_d_desc: "帝国犹如机器，行星即是齿轮，而行政效率，则是影响整体运作的润滑油。\n$libraf_lt_banner_15$"

 leader_trait_libra_official_governor_militarist: "炉芯熔火"
 leader_trait_libra_official_governor_militarist_desc: "这位专员将冶金车间视为战场前线，对所有人员施以军事化管理。在[this.GetHeShe]督管下，熔炉如同过载的等离子炮持续咆哮，合金产量在刺耳警报中飙升，而为了维持这种战争级生产强度，资源储备也正以同样惊人的速度大量消耗。\n$libraf_lt_banner_2$"

 leader_trait_libra_official_governor_pacifist: "桃源缔造者"
 leader_trait_libra_official_governor_pacifist_desc: "这位产业专员用数学般精密的规划取代暴力管控：生产单元如自组织细胞般扩展，人口化作轻盈的传粉者而非消耗者。当资源如光合作用自然循环时，督管星系的产出便迎来永久春天，恰似古人梦想中永不凋零的桃花源。\n$libraf_lt_banner_3$"

 leader_trait_libra_official_governor_authoritarian: "坚定维序者"
 leader_trait_libra_official_governor_authoritarian_desc: "如果说秩序是光，那么法律就是折射光线的棱镜。作为这位行政官的左右手，无数探员和秘密警察正时刻监督着居民的一举一动，以确保秩序之光能够照耀殖民地的每一个角落。\n$libraf_lt_banner_4$"
 leader_trait_libra_official_governor_authoritarian_tt_1: "$t$—殖民地每有$pop_group_unit$[enforcer.GetIcon]§Y$planet_enforcers$§!：\n$tt$—$mod_planet_jobs_productive_produces_mult$: §G+2%§!（最大: §G+30%§!）\n$tt$—$mod_planet_enforcers_energy_upkeep_add$: §R+0.40§!（最大: §R+6§!）"
 leader_trait_libra_official_governor_authoritarian_tt_2: "$t$—殖民地每有$pop_group_unit$[enforcer.GetIcon]§Y$planet_enforcers$§!：\n$tt$—$mod_planet_jobs_productive_produces_mult$: §G+1%§!（最大: §G+15%§!）\n$tt$—$mod_planet_enforcers_energy_upkeep_add$: §R+0.20§!（最大: §R+3§!）"

 leader_trait_libra_official_governor_egalitarian: "共智熔炉"
 leader_trait_libra_official_governor_egalitarian_desc: "在这位产业专员深谙集体智慧的价值，在[this.GetHeShe]督管的星球上，尖端工具与智库储存的访问权限不会被特权垄断，而是平等地授予给每一位工作者。\n$libraf_lt_banner_5$"

 leader_trait_libra_official_governor_spiritualist: "神谕再现"
 leader_trait_libra_official_governor_spiritualist_desc: "当殖民地的灵性飞升至新的高度，神谕便不再仅是缥缈的箴言——祭司们凝视星云般旋转的经文，指尖流淌出的科技蓝图愈发清晰。\n$libraf_lt_banner_6$"
 leader_trait_libra_official_governor_spiritualist_tt_1: "$t$—殖民地每有一级§Y$planetary_ascension$§!：\n$tt$—$mod_planet_bureaucrats_physics_research_produces_add$: §G+0.25§!（最大: §G+2§!）\n$tt$—$mod_planet_bureaucrats_society_research_produces_add$: §G+0.25§!（最大: §G+2§!）\n$tt$—$mod_planet_bureaucrats_engineering_research_produces_add$: §G+0.25§!（最大: §G+2§!）\n$tt$—$mod_planet_bureaucrats_consumer_goods_upkeep_add$: §R+0.50§!（最大: §R+4§!）"
 leader_trait_libra_official_governor_spiritualist_tt_2: "$t$—殖民地每有一级§Y$planetary_ascension$§!：\n$tt$—$mod_planet_bureaucrats_physics_research_produces_add$: §G+0.125§!（最大: §G+1§!）\n$tt$—$mod_planet_bureaucrats_society_research_produces_add$: §G+0.125§!（最大: §G+1§!）$tt$—$mod_planet_bureaucrats_engineering_research_produces_add$: §G+0.125§!（最大: §G+1§!）\n$tt$—$mod_planet_bureaucrats_consumer_goods_upkeep_add$: §R+0.25§!（最大: §R+2§!）"

 leader_trait_libra_official_governor_materialist: "晶格先知"
 leader_trait_libra_official_governor_materialist_desc: "知识指导行动，而实践可以检验真理。这位行政官将古老的格言融入现代化生产，推动殖民地在相关领域形成良性循环。\n$libraf_lt_banner_7$"
 leader_trait_libra_official_governor_materialist_tt_1: "$t$—每拥有一项§M稀有科技§!：\n$tt$—$mod_planet_artisans_physics_research_produces_add$: §G+0.10§!（最大: §G+4§!）\n$tt$—$mod_planet_metallurgists_engineering_research_produces_add$: §G+0.10§!（最大: §G+4§!）"
 leader_trait_libra_official_governor_materialist_tt_2: "$t$—每拥有一项§M稀有科技§!：\n$tt$—$mod_planet_artisans_physics_research_produces_add$: §G+0.05§!（最大: §G+2§!）\n$tt$—$mod_planet_metallurgists_engineering_research_produces_add$: §G+0.05§!（最大: §G+2§!）"

 leader_trait_libra_official_governor_xenophobe: "伊甸守望者"
 leader_trait_libra_official_governor_xenophobe_desc: "这位领袖渴望着远离星际尘嚣的乐土，[this.GetHeShe]的苦心经营，只为确保自己脚下的一亩三分地不受外界污染。\n$libraf_lt_banner_8$"
 leader_trait_libra_official_governor_xenophobe_tt_1: "$t$—殖民地每有1%£happiness£§Y平均$MOD_POP_HAPPINESS$§!：\n$tt$—$mod_planet_pops_upkeep_mult$: §R+0.4%§!\n$tt$—$concept_founder_species_growth_mult$: §G+0.2%§!\n$tt$—$mod_planet_buildings_produces_mult$: §G+0.2%§!\n$tt$—$mod_planet_jobs_productive_produces_mult$: §G+0.2%§!"
 leader_trait_libra_official_governor_xenophobe_tt_2: "$t$—殖民地每有1%£happiness£§Y平均$MOD_POP_HAPPINESS$§!：\n$tt$—$mod_planet_pops_upkeep_mult$: §R+0.2%§!\n$tt$—$concept_founder_species_growth_mult$: §G+0.1%§!\n$tt$—$mod_planet_buildings_produces_mult$: §G+0.1%§!\n$tt$—$mod_planet_jobs_productive_produces_mult$: §G+0.1%§!"

 leader_trait_libra_official_governor_xenophile: "星尘出纳师"
 leader_trait_libra_official_governor_xenophile_desc: "这位产业专员将异星关系学编织进贸易网络，通过种族间一视同仁的公平监督来促进商业发展。当帝国取得外交进展时，[this.GetHeShe]管理的领域总是最先受益。\n$libraf_lt_banner_9$"
 leader_trait_libra_official_governor_xenophile_tt_1: "$t$—§Y$councilor_state$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$—$mod_planet_traders_trade_produces_add$: §G+0.20§!（最大: §G+6§!）"
 leader_trait_libra_official_governor_xenophile_tt_2: "$t$—§Y$councilor_state$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$—$mod_planet_traders_trade_produces_add$: §G+0.10§!（最大: §G+3§!）"

# 帝国代表

 leader_trait_libra_official_delegate_destiny_a: "移民宣传部"
 leader_trait_libra_official_delegate_destiny_a_desc: "这位行政官的行动使人相信，[this.GetHeShe]祖国是这个星系里最完美的地方，每一寸土地都堆积着黄金、洒满了蜜水。\n$libraf_lt_banner_16$"
 leader_trait_libra_official_delegate_destiny_a_tt: "$t$—成功支持一项议案时：\n$tt$—提升§G+15%§!£mod_trade_produces_mult£ §Y$mod_country_trade_produces_mult$§!持续§Y5§!年\n$tt$—首都获得提案发起国物种的§G1200§!£pop£ §Y$POP$§!"
 leader_trait_libra_official_delegate_destiny_a_effect: "外星狂热"
 leader_trait_libra_official_delegate_destiny_a_effect_desc: "外星游客的涌入大大增加了本地商业的营运额。"

 leader_trait_libra_official_delegate_destiny_b: "联邦金桥"
 leader_trait_libra_official_delegate_destiny_b_desc: "异星港口的关税壁垒在[this.GetHeShe]的谈判发言下如冰霜般消融，而帝国商队的货舱内，稀有金属正随着联邦成员国好感度的攀升而自发增殖。外交是浇筑贸易洪流的熔炉，而这位代表，便是掌管它的好手。\n$libraf_lt_banner_16$"
 leader_trait_libra_official_delegate_destiny_b_tt: "$t$—派遣至£federation£§Y联邦§!时：\n$tt$—每100£diplo_weight£§Y$diplomatic_weight$§!产出§G3§!£trade£ §Y$trade$§!（最大: §G+6000§!）"

 leader_trait_libra_official_delegate_destiny_c: "联合舰队"
 leader_trait_libra_official_delegate_destiny_c_desc: "我们的联盟从不计算各自舰船的数量，只展示共同锋芒的长度。在齐心协力之下，领疆繁荣昌盛，而敌人只能一溃千里。\n$libraf_lt_banner_16$"

 leader_trait_libra_official_delegate_destiny_d: "终极辩手"
 leader_trait_libra_official_delegate_destiny_d_desc: "这位领袖反驳他人辩词时的发言洪亮而自信，可谓是教科书式的示例，当[this.GetHeShe]站上讲台的那一刻，星河为之屏息——接下来，在座的各位将见识到当代最伟大的演讲。\n$libraf_lt_banner_16$"
 leader_trait_libra_official_delegate_destiny_d_tt: "成功反对一项议案时：\n$tt$—随机技能等级小于§Y7§!的£leader£领袖提升§G+1§!技能等级\n$tt$—随机技能等级小于§Y9§!的£leader£领袖提升§G+1§!技能等级\n$tt$—提升来自提案发起国的 £opinion£ §Y$OPINION$§!§G+50§!（最大: §G+300§!）"
 opinion_libra_official_delegate_destiny_d: "无可辩驳的正论"

 leader_trait_libra_official_delegate_militarist: "武备教条"
 leader_trait_libra_official_delegate_militarist_desc: "“我军炮口所向之处，既是帝国的边疆，亦是知识与律法的前沿。”\n这位代表将联邦议事厅与星海共同体讲坛视作另一种形式的战场——[this.GetHeShe]身后虚空中无声列阵的舰队群，才是[this.GetHeShe]唯一认可的外交辞令。\n$libraf_lt_banner_2$"
 leader_trait_libra_official_delegate_militarist_tt_1: "$t$—派遣至£federation£§Y联邦§!时：\n$tt$—每点已使用的 £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!产出§G0.60§!£physics_research£ §G0.60§!£society_research£ §G0.60§!£engineering_research£ §Y研究点数§!"
 leader_trait_libra_official_delegate_militarist_tt_2: "$t$—派遣至£diplo_weight£§Y星海共同体§!时：\n$tt$—每点已使用的 £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!产出§G0.75§!£unity£ §Y$unity$§!"

 leader_trait_libra_official_delegate_pacifist: "共识回响"
 leader_trait_libra_official_delegate_pacifist_desc: "这位代表将外交胜利视作文明和谐的种子——每当一项议案随着[this.GetHeShe]的投票键落下而通过，其蕴含的和平理念便化作滋养母星的精神光谱。在议案光辉尚未消散的日子里，帝国各派系因共享这份星际认同而空前团结：艺术家以立法条文为灵感谱写颂歌，工程师将合作蓝图转化为更高效的生产模组，而街头巷尾的每一次对话，都闪烁着理性共识的余温。\n$libraf_lt_banner_3$"
 leader_trait_libra_official_delegate_pacifist_tt: "$t$—成功支持一项议案时：\n$tt$—获得§G4§!个月的 £alloys£ §Y$alloys$§!\n$tt$—提升§G+50%§!£mod_produces_mult£ §Y$mod_pop_factions_produces_mult$§!持续§Y5§!年"
 leader_trait_libra_official_delegate_pacifist_effect: "和平之声"
 leader_trait_libra_official_delegate_pacifist_effect_desc: "真正的胜利从不征服他者，而是让万民之心在同一律法下共振。"

 leader_trait_libra_official_delegate_authoritarian: "至高权柄"
 leader_trait_libra_official_delegate_authoritarian_desc: "这位代表的权威并非源于星际公约或外交辞令，而是根植于理事会准则或星海帝国敕令构成的绝对秩序。于[this.GetHeShe]而言，真理无需辩论，它只需被服从。\n$libraf_lt_banner_4$"
 leader_trait_libra_official_delegate_authoritarian_tt_1: "$t$—巩固£diplo_weight£§Y星海帝国§!时：\n$tt$—$mod_leader_officials_influence_produces_add$: §G+1§!\n$tt$—$mod_leader_officials_unity_produces_add$: §G+75§!"
 leader_trait_libra_official_delegate_authoritarian_tt_2: "$t$—作为理事会成员成功支持或反对一项议案后的§Y5§!年内：\n$tt$—$mod_country_cost_mult$: §G-5%§!\n$tt$—$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+25%§!"
 leader_trait_libra_official_delegate_authoritarian_effect: "帝国权威"
 leader_trait_libra_official_delegate_authoritarian_effect_desc: "外交领域的优势增加了我们在国内的支配度。"

 leader_trait_libra_official_delegate_egalitarian: "双面织锦"
 leader_trait_libra_official_delegate_egalitarian_desc: "这位代表的外交辞令如同双纹丝绸——面对友邦时，[this.GetHeShe]用贸易协定的甜腻糖浆浇灌出繁茂的商业藤蔓；而面对威胁时，所有谄媚的余音尚未在星空中消散，[this.GetHeShe]已将谈判桌上的鲜花替换为舰队的炮火坐标。\n$libraf_lt_banner_5$"
 leader_trait_libra_official_delegate_egalitarian_tt: "$t$—通过一项§Y$resolution_category_commerce$§!、§Y$resolution_category_industry$§!、§Y$resolution_category_market$§!、§Y$resolution_category_greatergood$§!、§Y$resolution_category_ecology$§!、§Y$resolution_category_galactic_focus$§!或§Y$tr_politics_adopt$§!类别的议案后：\n$tt$—获得§G12§!个月的 £unity£ §Y$unity$§!\n$tt$—提升§G+10%§!£mod_produces_mult£ §Y$mod_country_produces_mult$§!持续§Y8§!年"
 leader_trait_libra_official_delegate_egalitarian_effect: "双面锦锻"
 leader_trait_libra_official_delegate_egalitarian_effect_desc: "我们通过平等的对话获得了更多发展的机会。"

 leader_trait_libra_official_delegate_spiritualist: "布道圣徒"
 leader_trait_libra_official_delegate_spiritualist_desc: "当[this.GetHeShe]在星海共同体的水晶讲台上睁开双眼时，灵能低语便如星云般渗入所有代表的潜意识层。敌方谈判官发现自己不由自主地在条约附件上镌刻赞美[this.GetHerHis]母星的韵文，而联邦数据库的访问权限则在集体无意识的暖流中，向着帝国悄然洞开。\n$libraf_lt_banner_6$"
 leader_trait_libra_official_delegate_spiritualist_tt: "$t$—派遣至£federation£§Y联邦§!或£diplo_weight£§Y星海共同体§!时：\n$tt$—$mod_leader_officials_influence_produces_add$: §G+3§!"

 leader_trait_libra_official_delegate_materialist: "提词分析员"
 leader_trait_libra_official_delegate_materialist_desc: "受不同的历史文化影响，来自不同文明的外交措辞往往千奇百怪。这位代表总是细心地记录自己于外交场所的所见所闻，为相同领域的后辈们留下有益的见解。\n$libraf_lt_banner_7$"
 leader_trait_libra_official_delegate_materialist_tt: "议案结束时：\n$tt$—提升§G+10%§!£mod_country_all_tech_research_speed£§Y$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$§!持续§Y5§!年\n$tt$—获得§G3§!个月的 £physics£ £society£ £engineering£ §Y研究点数§!"
 leader_trait_libra_official_delegate_materialist_effect: "语法研究"
 leader_trait_libra_official_delegate_materialist_effect_desc: "对外星文化的一手资料推动了我们的科技进展。"

 leader_trait_libra_official_delegate_xenophobe: "作壁上观"
 leader_trait_libra_official_delegate_xenophobe_desc: "事不关己，高高挂起。这位代表秉持着为人处事中最为冷漠的原则，静静地看待星际诸事。\n$libraf_lt_banner_8$"
 leader_trait_libra_official_delegate_xenophobe_tt: "$t$—议案通过时保持沉默：\n$tt$—获得§G135§!£influence£ §Y$influence$§!\n$tt$—获得§G6§!个月的 £unity£ §Y$unity$§!\n$t$—议案否决时保持沉默：\n$tt$—获得§G150§!£influence£ §Y$influence$§!\n$tt$—获得§G6§!个月的 £energy£ §Y$energy$§!"

 leader_trait_libra_official_delegate_xenophile: "繁荣回响"
 leader_trait_libra_official_delegate_xenophile_desc: "我们播下共识的种子，培育信任的根系，收获银河回响的丰硕果实；我们从不索取，只因所有真诚的馈赠，终将以整个银河的丰饶回响作答。\n$libraf_lt_banner_9$"
 leader_trait_libra_official_delegate_xenophile_tt: "成功支持一项议案时：\n$tt$—获得§G6§!个月的 £energy£ §Y$energy$§!、£trade£ §Y$trade$§!和 £unity£ §Y$unity$§!"

# 外交使节

 leader_trait_libra_official_diplomacy_councilor_destiny_a: "封臣专员"
 leader_trait_libra_official_diplomacy_councilor_destiny_a_desc: "这位行政官专注于附庸事务并取得了相当的成就，[this.GetHeShe]有无数种方法以在相关谈判中取得有利的结果。\n$libraf_lt_banner_17$"

 leader_trait_libra_official_diplomacy_councilor_destiny_b: "大棒使者"
 leader_trait_libra_official_diplomacy_councilor_destiny_b_desc: "这位使节精通威慑的艺术——[this.GetHeShe]将每一次外交对抗都锻造成砝码，让宿敌的每一次抗议、威胁乃至舰队调动，都成为帝国谈判桌上新增的筹码。[this.GetHeShe]深谙一个真理：宇宙间最稳固的利益，往往从对手的恐惧与愤怒中淬炼而出。\n$libraf_lt_banner_17$"

 leader_trait_libra_official_diplomacy_councilor_destiny_c: "好客的大佬"
 leader_trait_libra_official_diplomacy_councilor_destiny_c_desc: "这位使节在故乡修建了一座挺大的房子，[this.GetHeShe]总是热情地邀请各种各样的星际友人进来做客。\n$libraf_lt_banner_17$"

 leader_trait_libra_official_diplomacy_councilor_destiny_d: "密码大师"
 leader_trait_libra_official_diplomacy_councilor_destiny_d_desc: "这位外交官非常擅长于利用本国的现状发起渗透行动，少有能难住[this.GetHeShe]的情报网。\n$libraf_lt_banner_17$"
 leader_trait_libra_official_diplomacy_councilor_destiny_d_tt: "$t$—每100£diplo_weight£§Y$diplomatic_weight$§!产出 £physics_research£§G2§! £society_research£§G2§! £engineering_research£§G2§!（最大: §G+4000§!）"


 leader_trait_libra_official_diplomacy_councilor_militarist: "战争税吏"
 leader_trait_libra_official_diplomacy_councilor_militarist_desc: "当星海燃起烽烟时，[this.GetHeShe]的算盘便在废墟上敲响：每一艘敌舰的残骸都可以被折价为合金入库，每一颗沦陷星球的哭嚎都能够换算成能源指标。胜仗为帝国增添荣耀，而败仗则被[this.GetHeShe]榨取出最后一枚可用于下次征服的铜板。\n$libraf_lt_banner_2$"
 leader_trait_libra_official_diplomacy_councilor_militarist_tt: "$t$—处于§Y战争§!期间时：\n$tt$—$mod_country_produces_mult$: §G+5%§!\n$tt$—$MOD_POP_CITIZEN_HAPPINESS$: §G+15%§!\n$tt$—$mod_pop_ethic_militarist_attraction_mult$: §G+25%§!"

 leader_trait_libra_official_diplomacy_councilor_pacifist: "繁荣守望者"
 leader_trait_libra_official_diplomacy_councilor_pacifist_desc: "这位行政官通常是温和而平易近人的，但只要出现任何威胁到己方安危的事物，[this.GetHeShe]就会摇身一变成为严厉的裁决者。\n$libraf_lt_banner_3$"
 leader_trait_libra_official_diplomacy_councilor_pacifist_tt: "处于§Y和平§!状态时：\n$tt$—$mod_country_produces_mult$: §G+10%§!\n$t$—处于§Y危机§!期间时：\n$tt$—$mod_country_produces_mult$: §G+10%§!\n$t$—处于§Y防御战争§!期间时：\n$tt$—$MOD_STARBASE_SHIPYARD_BUILD_COST_MULT$: §G-10%§!"

 leader_trait_libra_official_diplomacy_councilor_authoritarian: "大统领"
 leader_trait_libra_official_diplomacy_councilor_authoritarian_desc: "领导是一种才能，领袖是天赋的位置。这位使节不遗余力地巩固本国作为宗主的地位，并从中牟取利益。\n$libraf_lt_banner_4$"
 leader_trait_libra_official_diplomacy_councilor_authoritarian_tt_1: "$t$—每有一个§Y附属国§!：\n$tt$—$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+1%§!（最大: §G+10%§!）"
 leader_trait_libra_official_diplomacy_councilor_authoritarian_tt_2: "$t$—每有一个§Y保护国§!：\n$tt$—$MOD_COUNTRY_NAVAL_CAP_MULT$: §G+2%§!（最大: §G+10%§!）"

 leader_trait_libra_official_diplomacy_councilor_egalitarian: "契约基石"
 leader_trait_libra_official_diplomacy_councilor_egalitarian_desc: "这位外交官将对等的约定视作链接文明间信任的最佳桥梁，以温和可亲的手段潜移默化地施加影响力。\n$libraf_lt_banner_5$"
 leader_trait_libra_official_diplomacy_councilor_egalitarian_tt: "$t$—每签订一份§Y互不侵犯条约§!：\n$tt$—$mod_country_produces_mult$: §G+2%§!（最大: §G+8%§!）\n$tt$—$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$: §G+5%§!（最大: §G+20%§!）"

 leader_trait_libra_official_diplomacy_councilor_spiritualist: "试炼之路"
 leader_trait_libra_official_diplomacy_councilor_spiritualist_desc: "比起提升本国的地位，这位行政官更注重于外交带来的机遇与挑战，切实地获取利益。\n$libraf_lt_banner_6$"
 leader_trait_libra_official_diplomacy_councilor_spiritualist_tt_1: "$t$—每签订一份§Y商业协议§!：\n$tt$—$MOD_COUNTRY_EDICT_FUND_MULT$: §G+4%§!（最大: §G+16%§!）\n$tt$—$mod_specimens_produces_mult$: §G+4%§!（最大: §G+16%§!）"
 leader_trait_libra_official_diplomacy_councilor_spiritualist_tt_2: "$t$—每签订一份§Y移民协议§!：\n$tt$—$MOD_PLANET_POP_ASSEMBLY_MULT$: §G+4%§!（最大: §G+16%§!）\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$: §G+4%§!（最大: §G+16%§!）"

 leader_trait_libra_official_diplomacy_councilor_materialist: "异域架构师"
 leader_trait_libra_official_diplomacy_councilor_materialist_desc: "这位使节将研究协定视作知识流通的最优解——[this.GetHeShe]在协议条款中植入数据引流算法，使每一字节的异星科研成果都精准汇入帝国智库的神经中枢。真正的智者从不区分来源，只关心如何将万界的知识炼成统一的星辰语法。\n$libraf_lt_banner_7$"
 leader_trait_libra_official_diplomacy_councilor_materialist_tt: "$t$—每签署一份§Y研究协定§!：\n$tt$—$mod_scientist_exp_gain$: §G+5%§!（最大: §G+20%§!）\n$tt$—$mod_planet_researchers_produces_mult$: §G+8%§!（最大: §G+32%§!）"

 leader_trait_libra_official_diplomacy_councilor_xenophobe: "孤立之墙"
 leader_trait_libra_official_diplomacy_councilor_xenophobe_desc: "仔细观察，审慎分析，剥离出来自外域的一切不友好迹象，这位行政官最擅长的工作就是如此简单却必要。\n$libraf_lt_banner_8$"
 leader_trait_libra_official_diplomacy_councilor_xenophobe_tt_1: "$t$—每对一个帝国§Y关闭边境§!：\n$tt$—$mod_planet_jobs_productive_produces_mult$: §G+1%§!（最大: §G+10%§!）"
 leader_trait_libra_official_diplomacy_councilor_xenophobe_tt_2: "$t$—每向一个帝国§Y宣布宿敌§!：\n$tt$—$mod_planet_structures_upkeep_mult$: §G-3%§!（最大: §G-15%§!）"

 leader_trait_libra_official_diplomacy_councilor_xenophile: "自由卫士"
 leader_trait_libra_official_diplomacy_councilor_xenophile_desc: "这位行政官将每一次驰援他国的军事行动，都转化为辐射性的外交资产：护航舰队的轨迹在星海间织出信任网络，而被护卫星球的感恩则沉淀为帝国的凝聚力结晶。当其他文明仍在孤立中颤抖时，[this.GetHeShe]已用守护的誓言将散落的星辰铸成共荣星座。\n$libraf_lt_banner_9$"
 leader_trait_libra_official_diplomacy_councilor_xenophile_tt_1: "$t$—每对一个帝国§Y保障独立§!：\n$tt$—$mod_official_exp_gain$: §G+5%§!（最大: §G+20%§!）\n$tt$—$MOD_COUNTRY_TRUST_GROWTH$: §G+10%§!（最大: §G+40%§!）"
 leader_trait_libra_official_diplomacy_councilor_xenophile_tt_2: "$t$—每签订一份§Y共同防御条约§!：\n$tt$—$mod_commander_exp_gain$: §G+5%§!（最大: §G+20%§!）\n$tt$—$MOD_SHIP_FRIENDLY_TERRITORY_FIRE_RATE_MULT$: §G+10%§!（最大: §G+40%§!）"

# 国务顾问

 leader_trait_libra_official_economy_councilor_destiny_a: "议政要员"
 leader_trait_libra_official_economy_councilor_destiny_a_desc: "真正的治理效率，不在于决议通过的速度，而在于让每项决议在落地后都获得自我生长的呼吸节律。这位顾问深谙政治时机的艺术，当其他同僚还在争论条款细节时，[this.GetHeShe]已让政策的齿轮以自我强化的频率开始旋转。\n$libraf_lt_banner_18$"
 leader_trait_libra_official_economy_councilor_destiny_a_tt: "$t$—根据当前议程进度提供至多§G100%§!£mod_council_agenda_progress_speed£ §Y$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$§!"

 leader_trait_libra_official_economy_councilor_destiny_b: "遗产大师"
 leader_trait_libra_official_economy_councilor_destiny_b_desc: "[this.GetHeShe]能听见青铜法典在恒温展柜中的低语，也能解析星空壁画每一道刻痕里的熵值密码：时间从未流逝，它只是以更精致的形态折叠在了大师的陈列架上。\n$libraf_lt_banner_18$"
 leader_trait_libra_official_economy_councilor_destiny_b_tt: "$t$—每拥有一件§Y$relics$§!：\n$tt$—$mod_planet_jobs_specialist_produces_mult$: §G+2%§!（最大: §G+10%§!）"

 leader_trait_libra_official_economy_councilor_destiny_c: "核心工程师"
 leader_trait_libra_official_economy_councilor_destiny_c_desc: "星空中的结构是地上文明的骨骼延伸，每一寸材料的构筑都代表着人们追求美好的意志。这位顾问将人民的期盼凝结成型，以夜空为幕布建造出最美好的星图。\n$libraf_lt_banner_18$"

 leader_trait_libra_official_economy_councilor_destiny_d: "升格架构师"
 leader_trait_libra_official_economy_councilor_destiny_d_desc: "我们每突破苍穹的一道刻痕，地壳便更顺从于我们存在的标记。我们每向上攀登一级天梯，脚下的大地便加速成为我们思想的形状。\n$libraf_lt_banner_18$"
 leader_trait_libra_official_economy_councilor_destiny_d_tt: "$t$—每拥有一项§Y飞升天赋§!：\n$tt$—$MOD_PLANET_COLONY_DEVELOPMENT_SPEED_MULT$: §G+5%§!（最大: §G+40%§!）\n$tt$—$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+5%§!（最大: §G+40%§!）"


 leader_trait_libra_official_economy_councilor_militarist: "大都督"
 leader_trait_libra_official_economy_councilor_militarist_desc: "这位领袖调度星际物资的指令稳如泰山，[this.GetHeShe]可以确保在任何意外发生时，相关工作者都能在第一时间进行应对。\n$libraf_lt_banner_2$"
 leader_trait_libra_official_economy_councilor_militarist_tt: "$t$—每控制一个§Y星系§!：\n$tt$—$mod_country_councilor_trade_produces_add$: §G+5§!\n$tt$—$mod_country_councilor_unity_produces_add$: §G+4§!"

 leader_trait_libra_official_economy_councilor_pacifist: "和鸣执政官"
 leader_trait_libra_official_economy_councilor_pacifist_desc: "真正的繁荣从不需要横征暴敛，只需让文明的每一次呼吸都更轻盈，让智慧的每一次传承都更完整。\n$libraf_lt_banner_3$"

 leader_trait_libra_official_economy_councilor_authoritarian: "赦令听谕使"
 leader_trait_libra_official_economy_councilor_authoritarian_desc: "这位行政官是帝国内阁的绝对权威，[owner.Ruler.GetName]指令的首要传达人。\n$libraf_lt_banner_4$"

 leader_trait_libra_official_economy_councilor_egalitarian: "谐音共唱"
 leader_trait_libra_official_economy_councilor_egalitarian_desc: "这位顾问将帝国各派系视作一首未完成的交响乐——[this.GetSheHe]不压制任何声部，而是为每个群体校准独特的共鸣频率。当商业行会的逐利渴望与环保阵线的生态诉求在[this.GetSheHe]搭建的对话场中碰撞时，分歧本身便成了产出新思想火花的燧石。所有派系都在其调度下发现：唯有当不同声音被平等聆听时，各自的主张才会化作推动文明前进的真实动力。\n$libraf_lt_banner_5$"

 leader_trait_libra_official_economy_councilor_spiritualist: "灵阶溯源"
 leader_trait_libra_official_economy_councilor_spiritualist_desc: "是者每观天阶晋升，则引灵波淬遗珍之脉。飞升一层，古物自鸣其识；再升一层，残碑浮映星图。万般遗痕迭加辉光，如奉梵音于文明庙堂。\n$libraf_lt_banner_6$"
 leader_trait_libra_official_economy_councilor_spiritualist_tt: "$t$—每拥有一组§Y传统§!：\n$tt$—$MOD_PLANETARY_ASCENSION_COST_MULT$: §G-1%§!（最大: §G-7%§!）\n$tt$—$mod_aesthetic_wonder_specimens_produces_mult$: §G+5%§!（最大: §G+35%§!）\n$tt$—$mod_xeno_geology_specimens_produces_mult$: §G+5%§!（最大: §G+35%§!）"

 leader_trait_libra_official_economy_councilor_materialist: "星际智库"
 leader_trait_libra_official_economy_councilor_materialist_desc: "这位行政官致力于构建一个联通整个帝国的管理体系，以知识的完美共享促进所有领导者在保持一致的前提下共同进步。\n$libraf_lt_banner_7$"
 leader_trait_libra_official_economy_councilor_materialist_tt: "$t$—§Y$councilor_research$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$—$MOD_LEADER_SPECIES_EXP_GAIN$: §G+1%§!（最大: §G+30%§!）"

 leader_trait_libra_official_economy_councilor_xenophobe: "纯血锻炉"
 leader_trait_libra_official_economy_councilor_xenophobe_desc: "我们的血脉与齿轮皆需消毒，唯有绝对纯净的复制，才能让文明躯体对银河病体产生永久抗体。我们的繁衍从不依赖异质污染，唯有在绝对纯净的培养皿中，种族之火才能以指数级复燃。\n$libraf_lt_banner_8$"

 leader_trait_libra_official_economy_councilor_xenophile: "愿景描绘者"
 leader_trait_libra_official_economy_councilor_xenophile_desc: "富有理想并为之不懈努力，这位行政官力求打造一个和谐世界。\n$libraf_lt_banner_9$"
 leader_trait_libra_official_economy_councilor_xenophile_tt: "$t$—每有一个§Y物种§!：\n$tt$—$mod_planet_jobs_produces_mult$: §G+0.50%§!（最大: §G+10%§!）"

# 探索者

 leader_trait_libra_scientist_explorer_destiny_a: "观星日志"
 leader_trait_libra_scientist_explorer_destiny_a_desc: "这位探索者将调查记录总结为详尽的手稿出版发行，作为外星生态研究的第一手资料，[this.GetHeShe]的著作备受民间研究者欢迎。\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_a_tt: "$t$—每扫描一个天体：\n$tt$—$mod_leader_scientists_energy_produces_add$: §G+2§!\n$tt$—$mod_leader_scientists_trade_produces_add$: §G+1§!"

 leader_trait_libra_scientist_explorer_destiny_b: "星图测绘师"
 leader_trait_libra_scientist_explorer_destiny_b_desc: "当这位探索者的传感器掠过陌生星系时，每颗天体的轨道参数与矿物光谱都会被编译成两份截然不同的报告：一份化为精装星图送入行政中枢，让官僚们为的新领土宣称权举杯欢庆；另一份则作为原始资料送达研究中心，为研究员提供乍现的灵感。\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_b_tt: "$t$—探索新星系时：\n$tt$—获得§G1§!个月的 £physics£ £society£ £engineering£ §Y研究点数§!\n$tt$—若星系被其他帝国占据：\n$ttt$—所有£leader£内阁官员获得§G125§!经验"

 leader_trait_libra_scientist_explorer_destiny_c: "星网编织者"
 leader_trait_libra_scientist_explorer_destiny_c_desc: "这位科学官将宇宙活动诠释为逻辑代码、社会现象或是工程理论。这些由星辰直接书写的研究笔记，正持续涌入帝国的数据库，如同永不枯竭的星河自发汇入文明的杯盏。\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_c_tt: "$t$—每扫描一个星系：\n$tt$—$mod_leader_scientists_physics_research_produces_add$: §G+12§!\n$tt$—$mod_leader_scientists_society_research_produces_add$: §G+12§!\n$tt$—$mod_leader_scientists_engineering_research_produces_add$: §G+12§!"

 leader_trait_libra_scientist_explorer_destiny_d: "洞见之源"
 leader_trait_libra_scientist_explorer_destiny_d_desc: "我们丈量星空的距离，最终丈量出的是文明在宇宙天平上的重量。从无尽的冒险中，我们获得了知识、名誉和未来的定义权。\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_d_tt: "$t$—完成星系调查时：\n$tt$—随机科技§G+25%§!进展\n$tt$—根据产出获得§G25~50§!£influence£ §Y$influence$§!"

 leader_trait_libra_scientist_explorer_militarist: "碎片整理员"
 leader_trait_libra_scientist_explorer_militarist_desc: "古战场中有的不只是遗址，这位科学官拥有一支打捞舰队，可以从[this.GetHeShe]见过的任何残骸场或废弃物处理点收集可重复利用的原材料。\n$libraf_lt_banner_2$"
 leader_trait_libra_scientist_explorer_militarist_tt: "$t$—$mod_leader_scientists_alloys_produces_add$: §G+18§!\n$t$—每扫描一个星系：\n$tt$—$mod_leader_scientists_alloys_produces_add$: §G+4§!\n$tt$—$mod_leader_scientists_engineering_research_produces_add$: §G+4§!"

 leader_trait_libra_scientist_explorer_pacifist: "异域志怪录"
 leader_trait_libra_scientist_explorer_pacifist_desc: "我们探索世界的目标不是为了制造更多的冲突，而是将彼方的传说带回故乡，向世人展示和乐的胜景。\n$libraf_lt_banner_3$"
 leader_trait_libra_scientist_explorer_pacifist_tt: "$t$—探索新星系时：\n$tt$—获得 £minerals£§G300§! £consumer_goods£§G300§!\n$t$—完成星系调查时：\n$tt$—获得§G2§!个月的 £volatile_motes£ £exotic_gases£ £rare_crystals£ §Y稀有资源§!"

 leader_trait_libra_scientist_explorer_authoritarian: "工作齿轮"
 leader_trait_libra_scientist_explorer_authoritarian_desc: "这位科学官的地位源于其不懈的努力和强大的幕僚团队：处于前沿的勇士们一往直前，处于后方的顾问们严阵以待。两者的努力跨越时空紧密拼接，才是这位探索巨头的成功秘诀。\n$libraf_lt_banner_4$"
 leader_trait_libra_scientist_explorer_authoritarian_tt: "$t$—舰队任务期间：\n$tt$—$mod_leader_scientists_influence_produces_add$: §G+1§!\n$tt$—$mod_leader_scientists_unity_produces_add$: §G+20§!"

 leader_trait_libra_scientist_explorer_egalitarian: "公共勘探者"
 leader_trait_libra_scientist_explorer_egalitarian_desc: "这位科学官致力于将研究结果服务公民大众，使恒星光谱都化作公共能源网络的免费馈赠，让宜居星球的生态数据直接生成殖民地规划模板。这些知识从不被封存在研究院的保险库，而是成为每个公民终端可随时调用的生活工具——从学童的气候作业到农夫的播种算法，星空从未如此平等地照耀所有人。\n$libraf_lt_banner_5$"
 leader_trait_libra_scientist_explorer_egalitarian_tt: "完成调查时：\n$tt$—获得 £physics£§G300§! £society£§G300§! £engineering£§G300§!\n$tt$—若调查对象为§Y中央天体§!：\n$ttt$—$ADD_COUNCIL_AGENDA_PROGRESS$§G+600§!\n$tt$—若调查对象为§Y宜居星球§!：\n$ttt$—随机$scientist_with_icon$获得§G600§!经验"

 leader_trait_libra_scientist_explorer_spiritualist: "天域引路人"
 leader_trait_libra_scientist_explorer_spiritualist_desc: "当[this.GetHeShe]的圣歌在舰桥响起时，舰体便褪去钢铁之躯，化作浸透虚境圣辉的灵箔。跃迁引擎的每一次颤动皆是与星神脉动的虔诚和声，令舰队如忏悔者接过宇宙的恩典般，沿着命定的灵能丝线滑向彼岸。\n$libraf_lt_banner_6$"

 leader_trait_libra_scientist_explorer_materialist: "星痕速记员"
 leader_trait_libra_scientist_explorer_materialist_desc: "宇宙的答案早已写满星空，我们只是缺一位能同步翻译的速记员——这位探索者的神经接口与科研船扫描仪保持着常时共鸣，[this.GetHeShe]将异常现象转化为标准化的数据胶囊，通过超光速通信传递回母星。\n$libraf_lt_banner_7$"
 leader_trait_libra_scientist_explorer_materialist_tt_1: "$t$—每扫描一个天体：\n$tt$—$mod_leader_scientists_unity_produces_add$: §G+0.50§!"
 leader_trait_libra_scientist_explorer_materialist_tt_2: "$t$—完成星系调查时：\n$tt$—获得§G2§!个月的 £physics£ £society£ £engineering£ §Y研究点数§!"

 leader_trait_libra_scientist_explorer_xenophobe: "异种图鉴"
 leader_trait_libra_scientist_explorer_xenophobe_desc: "这位探索者将外星行星视作需解剖的异端标本，所有非我族类的数据都会被处理成警示帝国的红灯，使民众在共同的恐惧中紧密凝聚成钢铁般的整体。\n$libraf_lt_banner_8$"
 leader_trait_libra_scientist_explorer_xenophobe_tt: "完成调查时：\n$tt$—获得§G0.5§!个月的 £unity£ §Y$unity$§!\n$tt$—调查对象为§Y宜居星球§!时额外获得§G0.5§!个月的 £unity£ §Y$unity$§!"

 leader_trait_libra_scientist_explorer_xenophile: "星尘织者"
 leader_trait_libra_scientist_explorer_xenophile_desc: "以触须轻抚星光，\n异忆凝作琥珀徽章。\n万族心绪渗入母邦之魂，\n共谱无疆。\n$libraf_lt_banner_9$"
 leader_trait_libra_scientist_explorer_xenophile_tt: "探索新星系时：\n$tt$—获得 £influence£§G25§!\n$tt$—根据产出获得§G500~5000§!£unity£ §Y$unity$§!"

# 前沿学者

 leader_trait_libra_scientist_scholar_destiny_a: "星尘聚宝盆"
 leader_trait_libra_scientist_scholar_destiny_a_desc: "星海是最大的宝藏，静静地等待着有能之士前往发掘。这位学者的勘探仪器从不预设扫描模式，而是如共生体般适应环境：在甲烷海洋中捕捉生化脉冲为气体仓储，于视界边缘记录光之终结为研究报告，将再正常不过的自然现象转变为潜在收益。\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_a_tt_1: "$t$—处于§Y$pc_black_hole$§!星系时：\n$tt$—$mod_leader_scientists_physics_research_produces_add$: §G+200§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_2: "$t$—处于§Y$pc_neutron_star$§!星系时：\n$tt$—$mod_leader_scientists_society_research_produces_add$: §G+200§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_3: "$t$—处于§Y$pc_pulsar$§!星系时：\n$tt$—$mod_leader_scientists_engineering_research_produces_add$: §G+200§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_4: "$t$—处于§Y小行星带§!时：\n$tt$—$mod_leader_scientists_volatile_motes_produces_add$: §G+18§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_5: "$t$—处于§Y星云内部§!时：\n$tt$—$mod_leader_scientists_exotic_gases_produces_add$: §G+18§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_6: "$t$—处于§Y风暴内部§!时：\n$tt$—$mod_leader_scientists_rare_crystals_produces_add$: §G+18§!"

 leader_trait_libra_scientist_scholar_destiny_b: "窥见真理"
 leader_trait_libra_scientist_scholar_destiny_b_desc: "异常现象标示于仪表面板之上，这位学者看见的却不是无序的噪音，而是散落星海的认知拼图碎片。[this.GetHeShe]在数据流中轻抚，将这些碎片重新拼合，变回原本应有的模样。\n每解开一道谜题，帝国的声音便多一分重量，而未来的道路则少一团迷雾。\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_b_tt: "完成异常现象时：\n$tt$—获得 £influence£§G25§!\n$tt$—获得§G3§!个月的 £physics£ £society£ £engineering£ §Y研究点数§!"

 leader_trait_libra_scientist_scholar_destiny_c: "再利用大师"
 leader_trait_libra_scientist_scholar_destiny_c_desc: "这位前沿学者将战场残骸视作未启封的技术圣典——当[this.GetHeShe]的扫描束掠过碎裂的外星舰壳时，每一道熔毁的焊缝都在低语能量回路的奥秘，每一块变形的装甲都在传授材料学的禁忌诗篇。\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_c_tt: "完成打捞或研究残骸时：\n$tt$—$ADD_COUNCIL_AGENDA_PROGRESS$§G+10%§!\n$tt$—提升§G+20%§!£mod_country_engineering_tech_research_speed£§Y$MOD_COUNTRY_ENGINEERING_TECH_RESEARCH_SPEED$§!持续§Y5§!年"
 leader_trait_libra_scientist_scholar_destiny_c_effect: "残骸再利用"
 leader_trait_libra_scientist_scholar_destiny_c_effect_desc: "从异星舰船碎片上获得的数据促进了帝国的工程学发展。"

 leader_trait_libra_scientist_scholar_destiny_d: "星界社会学"
 leader_trait_libra_scientist_scholar_destiny_d_desc: "借助裂隙对其它位面的惊鸿一瞥，这位学者可以感知到多元文化的无形碰撞，进而归纳出大量值得探讨的社会性课题。\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_d_tt: "$t$—完成星界裂隙时：\n$tt$—获得§G3§!个月的 £society_research£ §Y$society_research$§!和 £unity£ §Y$unity$§!\n$tt$—提升§G+25%§!£mod_country_society_tech_research_speed£§Y$MOD_COUNTRY_SOCIETY_TECH_RESEARCH_SPEED$§!持续§Y5§!年"
 leader_trait_libra_scientist_scholar_destiny_d_effect: "星界社会学"
 leader_trait_libra_scientist_scholar_destiny_d_effect_desc: "我们获得了其它位面的社会学知识。"

 leader_trait_libra_scientist_scholar_militarist: "地勤联络官"
 leader_trait_libra_scientist_scholar_militarist_desc: "当[this.GetHeShe]的演算纸带接入军用频道时，巡洋舰的引擎喷流轨迹立刻被优化为能量消耗最低的斐波那契螺旋，而战列舰炮台的冷却液循环系统则开始遵循[this.GetHeShe]编写的热力学十四行诗——在战地前沿，鲜有人可以比这位领袖更好地指挥后勤。\n$libraf_lt_banner_2$"

 leader_trait_libra_scientist_scholar_pacifist: "装甲矿工"
 leader_trait_libra_scientist_scholar_pacifist_desc: "学者指挥着[this.GetHeShe]的舰船，安然无恙地穿行于破碎的天体之间。舰体装甲会自动校准共振频率，使陨石冲击转化为缓冲动能；而勘探激光则在扫描岩层成分的同时，也会将富矿碎片直接吸入改造过的货舱。\n$libraf_lt_banner_3$"
 leader_trait_libra_scientist_scholar_pacifist_tt: "$t$—所处星系每有一条§Y小行星带§!：\n$tt$—$mod_leader_scientists_energy_produces_add$: §G+36§!\n$tt$—$mod_leader_scientists_minerals_produces_add$: §G+36§!"

 leader_trait_libra_scientist_scholar_authoritarian: "前沿导师"
 leader_trait_libra_scientist_scholar_authoritarian_desc: "这位学者不仅仅是一位老练的工程师，也是一整个学派的带头人。[this.GetHeShe]精细地安排，只为使自己的帝国能长远发展。\n$libraf_lt_banner_4$"
 leader_trait_libra_scientist_scholar_authoritarian_tt: "完成考古发掘时：\n$tt$—随机科技§G+100%§!进展\n$tt$—技能等级最低的£leader£领袖提升§G+3§!技能等级"

 leader_trait_libra_scientist_scholar_egalitarian: "星云异闻录"
 leader_trait_libra_scientist_scholar_egalitarian_desc: "知识真正的力量，从不局限于伟人一时的指引，而存在于千万人共同点燃的星火之间。遥远故去的每一个故事，星辰彼岸的每一种可能，都静静地诉说着未知的传奇。\n$libraf_lt_banner_5$"
 leader_trait_libra_scientist_scholar_egalitarian_tt: "每完成一次星界裂隙：\n$tt$—$mod_leader_scientists_physics_research_produces_add$: §G+36§!\n$tt$—$mod_leader_scientists_astral_threads_produces_add$: §G+2§!\n$t$—每完成一次考古发掘：\n$tt$—$mod_leader_scientists_society_research_produces_add$: §G+36§!\n$tt$—$mod_leader_scientists_minor_artifacts_produces_add$: §G+2§!"

 leader_trait_libra_scientist_scholar_spiritualist: "授圣谕使"
 leader_trait_libra_scientist_scholar_spiritualist_desc: "知识不应被独占，凡震颤过宇宙谜题之弦者，皆会使整个帝国的意识网络升华一分。\n$libraf_lt_banner_6$"
 leader_trait_libra_scientist_scholar_spiritualist_tt: "完成异常现象时：\n$tt$—所有$official_with_icon$获得§G200§!经验\n$tt$—所有$commander_with_icon$获得§G200§!经验"

 leader_trait_libra_scientist_scholar_materialist: "博物学士"
 leader_trait_libra_scientist_scholar_materialist_desc: "这位学者通晓多个领域的知识，从气态巨行星上的罕见气旋到失落殖民地上的建筑残骸，[this.GetHeShe]都有一番独到的见解。宇宙间从无孤立的知识，唯有未被发现关联性的数据尘埃。\n$libraf_lt_banner_7$"
 leader_trait_libra_scientist_scholar_materialist_tt: "$t$—完成异常现象时：\n$tt$—$ADD_COUNCIL_AGENDA_PROGRESS$§G+2500§!\n$t$—完成打捞或研究残骸时：\n$tt$—获得 £physics£§G900§! £society£§G900§! £engineering£§G900§! £trade£§G1500§!"

 leader_trait_libra_scientist_scholar_xenophobe: "异种清道夫"
 leader_trait_libra_scientist_scholar_xenophobe_desc: "敌舰残骸是需要彻底消毒的尸体，而这位冷酷的学者则是最佳的行刑人：从残骸中发现的资源会被再次利用，在角落里拖出的俘虏则将被即刻处决。\n$libraf_lt_banner_8$"
 leader_trait_libra_scientist_scholar_xenophobe_tt: "完成打捞或研究残骸时：\n$tt$—获得 £energy£§G1800§! £influence£§G35§!"

 leader_trait_libra_scientist_scholar_xenophile: "星之语"
 leader_trait_libra_scientist_scholar_xenophile_desc: "当其他研究者对星界裂隙的混沌低语充耳不闻时，这位科学官却将探测仪主动伸入维度褶皱之中——并非为了取样，而是为了握手。每一次裂隙的脉冲都被[this.GetHeShe]译作跨文明的情书，那些扭曲的物理法则在[this.GetHeShe]的实验室里重组成桥梁，让帝国的科技树生长出借由异界阳光滋养的新枝。\n$libraf_lt_banner_9$"
 leader_trait_libra_scientist_scholar_xenophile_tt: "完成星界裂隙后的§Y5§!年内：\n$tt$—$MOD_COUNTRY_PHYSICS_TECH_RESEARCH_SPEED$: §G+5%§!\n$tt$—$mod_planet_jobs_productive_upkeep_mult$: §G-10%§!"
 leader_trait_libra_scientist_scholar_xenophile_effect: "拥抱裂隙"
 leader_trait_libra_scientist_scholar_xenophile_effect_desc: "我们永远选择伸手而非握拳，因为每一次对未知的拥抱，终将收获整个多维度的回吻。"

# 分析专员

 leader_trait_libra_scientist_governor_destiny_a: "苛求式学督"
 leader_trait_libra_scientist_governor_destiny_a_desc: "这位专员将自身学识化为衡量万物的准绳——[this.GetHeShe]的思维能力每提升一阶，实验室内的容错阈值便收紧一分；寻常人员要想跟上其步伐，嗑药式努力是仅有的选择。\n卓越从不乞求满足，它只回应智者的索取。\n$libraf_lt_banner_21$"

 leader_trait_libra_scientist_governor_destiny_b: "田垄寻迹者"
 leader_trait_libra_scientist_governor_destiny_b_desc: "这位细致入微的科学家不会放过任何一个值得探讨的问题，[this.GetHeShe]漫步于山间原野，将见识到的谜题整编成册。而后，将有专业的助理团队将这些洞见转化为新知。\n$libraf_lt_banner_21$"
 leader_trait_libra_scientist_governor_destiny_b_tt_1: "$t$—每拥有一项§H洞见科技§!：\n$tt$—$mod_planet_technician_physics_research_produces_add$: §G+0.30§!（最大: §G+3§!）\n$tt$—$mod_planet_technician_trade_upkeep_add$: §R+0.20§!（最大: §R+2§!）\n$tt$—$mod_planet_miners_engineering_research_produces_add$: §G+0.30§!（最大: §G+3§!）\n$tt$—$mod_planet_miners_energy_upkeep_add$: §R+0.20§!（最大: §R+2§!）\n$tt$—$mod_planet_farmers_society_research_produces_add$: §G+0.30§!（最大: §G+3§!）\n$tt$—$mod_planet_farmers_energy_upkeep_add$: §R+0.20§!（最大: §R+2§!）"
 leader_trait_libra_scientist_governor_destiny_b_tt_2: "$t$—每拥有一项§H洞见科技§!：\n$tt$—$mod_planet_technician_physics_research_produces_add$: §G+0.15§!（最大: §G+1.50§!）\n$tt$—$mod_planet_technician_trade_upkeep_add$: §R+0.10§!（最大: §R+1§!）\n$tt$—$mod_planet_miners_engineering_research_produces_add$: §G+0.15§!（最大: §G+1.50§!）\n$tt$—$mod_planet_miners_energy_upkeep_add$: §R+0.10§!（最大: §R+1§!）\n$tt$—$mod_planet_farmers_society_research_produces_add$: §G+0.15§!（最大: §G+1.50§!）\n$tt$—$mod_planet_farmers_energy_upkeep_add$: §R+0.10§!（最大: §R+1§!）"

 leader_trait_libra_scientist_governor_destiny_c: "超频学者"
 leader_trait_libra_scientist_governor_destiny_c_desc: "科学研究势必需要经费投入，这位分析专员慷慨地拨付研究预算，为辖下的每一处实验室都安排了充足的稀有资源补给，使实验员们能够无忧代价问题，全身心地进行实验。\n$libraf_lt_banner_21$"

 leader_trait_libra_scientist_governor_destiny_d: "民间学派"
 leader_trait_libra_scientist_governor_destiny_d_desc: "这位分析专员深信智慧深植于市井街巷。[this.GetHeShe]鼓励平民将额外配给额度投入家庭实验与自发研讨——无论是用厨房器皿验证化学猜想，还是借纺织机演算符文序列。当千家万户的窗台透出钻研的灯火时，[this.GetHeShe]便穿行于这繁星般的民间智库间，将零散的灵光编织成体系化的理论模型。\n$libraf_lt_banner_21$"

 leader_trait_libra_scientist_governor_militarist: "军工科技"
 leader_trait_libra_scientist_governor_militarist_desc: "能在战场上发挥价值的技术才是真正有用的技术，一切研究活动必须以助力军事行动为目标。这位科学官致力在军事演习的同时开发和检验武器科技，[this.GetHeShe]督管的殖民地既是训练场，也是试验场。\n$libraf_lt_banner_2$"

 leader_trait_libra_scientist_governor_pacifist: "和谐方程式"
 leader_trait_libra_scientist_governor_pacifist_desc: "和乐是这位科学官的最高追求，由理性主导的方程式的每一步都象征着富饶。在这里，所有未被消耗的安宁时光，最终都会汇入实验室的静流池，化作纯粹理性凝结的星辰。\n$libraf_lt_banner_3$"
 leader_trait_libra_scientist_governor_pacifist_tt_1: "$t$—每有1%£stability£§Y$PLANET_STABILITY_TITLE$§!：\n$tt$—$mod_country_physics_research_produces_mult$: §G+0.5%§!\n$tt$—$mod_country_society_research_produces_mult$: §G+0.5%§!\n$tt$—$mod_country_engineering_research_produces_mult$: §G+0.5%§!"
 leader_trait_libra_scientist_governor_pacifist_tt_2: "$t$—每有1%£stability£§Y$PLANET_STABILITY_TITLE$§!：\n$tt$—$mod_planet_jobs_physics_research_produces_mult$: §G+0.3%§!\n$tt$—$mod_planet_jobs_society_research_produces_mult$: §G+0.3%§!\n$tt$—$mod_planet_jobs_engineering_research_produces_mult$: §G+0.3%§!"

 leader_trait_libra_scientist_governor_authoritarian: "学阀首领"
 leader_trait_libra_scientist_governor_authoritarian_desc: "智慧唯有在阶序的圣坛上供奉，方能结晶为文明的利器。象牙塔内的学者沉醉于额外配给的特酿咖啡，下级实验室里的研究员则沉浸于繁重作业的缄默哀叹中。尽管如此，却没有人会明目张胆地表达不满——因为，取得足够的研究成果是他们取得阶级突破的唯一途径。\n$libraf_lt_banner_4$"
 leader_trait_libra_scientist_governor_authoritarian_tt_1: "$t$—殖民地每有$pop_group_unit$£pop_cat_ruler£§Y$pop_cat_ruler_plural$§!：\n$tt$—$mod_planet_researchers_produces_mult$: §G+6%§!（最大: §G+60%§!）"
 leader_trait_libra_scientist_governor_authoritarian_tt_2: "$t$—殖民地每有$pop_group_unit$£pop_cat_ruler£§Y$pop_cat_ruler_plural$§!：\n$tt$—$mod_planet_researchers_produces_mult$: §G+3%§!（最大: §G+30%§!）"

 leader_trait_libra_scientist_governor_egalitarian: "前沿科学院"
 leader_trait_libra_scientist_governor_egalitarian_desc: "当知识回归其创造者手中时，真理便从每一双劳动之手中绽放。科技成果终将平等地惠及每一个个体，先后问题只是上个时代生产力不足的旧谈。\n$libraf_lt_banner_5$"
 leader_trait_libra_scientist_governor_egalitarian_tt: "$t$—每拥有一项§M稀有科技§!：\n$tt$—$mod_job_libra_analyst_add$: §G+125§!（最大: §G+5000§!）"

 leader_trait_libra_scientist_governor_spiritualist: "至高合唱"
 leader_trait_libra_scientist_governor_spiritualist_desc: "哲士将星域编织成多维的共鸣圣殿——当[this.GetHeShe]督管的首府星球响起第一声圣歌时，所有研究员的思维便通过亚空间和弦彼此交联。主实验室溢出的光尘圣歌使数据流自发晶化成理论模型，而遥远殖民地中的学者虽未闻其声，笔尖却已流淌出被共鸣强化的公式，仿佛整条银河的智慧皆在此刻同频震颤。\n$libraf_lt_banner_6$"
 leader_trait_libra_scientist_governor_spiritualist_tt: "$t$—殖民地每有一级§Y$planetary_ascension$§!：\n$tt$—$mod_planet_physicists_unity_produces_add$: §G+0.25§!（最大: §G+2§!）\n$tt$—$mod_planet_biologists_unity_produces_add$: §G+0.25§!（最大: §G+2§!）\n$tt$—$mod_planet_engineers_unity_produces_add$: §G+0.25§!（最大: §G+2§!）"

 leader_trait_libra_scientist_governor_materialist: "智慧源泉"
 leader_trait_libra_scientist_governor_materialist_desc: "思维的火花就像多米诺骨牌，一传十十传百地绽放在这个世代。\n凡计算必有所耗，凡灌溉必得泉涌。\n$libraf_lt_banner_7$"
 leader_trait_libra_scientist_governor_materialist_tt_1: "$t$—§Y$councilor_research$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$—$mod_planet_physicists_physics_research_produces_add$: §G+0.10§!（最大: §G+3§!）\n$tt$—$mod_planet_biologists_society_research_produces_add$: §G+0.10§!（最大: §G+3§!）\n$tt$—$mod_planet_engineers_engineering_research_produces_add$: §G+0.10§!（最大: §G+3§!）"
 leader_trait_libra_scientist_governor_materialist_tt_2: "$t$—§Y$councilor_research$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$—$mod_planet_physicists_physics_research_produces_add$: §G+0.05§!（最大: §G+1.50§!）\n$tt$—$mod_planet_biologists_society_research_produces_add$: §G+0.05§!（最大: §G+1.50§!）\n$tt$—$mod_planet_engineers_engineering_research_produces_add$: §G+0.05§!（最大: §G+1.50§!）"

 leader_trait_libra_scientist_governor_xenophobe: "纯种思维殿堂"
 leader_trait_libra_scientist_governor_xenophobe_desc: "人多代表着手杂，族异意味着志乱；真理厌恶杂音，纯净的思维方是照亮深空的唯一炬火。\n$libraf_lt_banner_8$"
 leader_trait_libra_scientist_governor_xenophobe_tt_1: "$t$—殖民地物种数量少于§Y3§!时：\n$tt$—$mod_planet_jobs_physics_research_produces_mult$: §G+30%§!\n$tt$—$mod_planet_jobs_society_research_produces_mult$: §G+40%§!\n$tt$—$mod_planet_jobs_engineering_research_produces_mult$: §G+30%§!"
 leader_trait_libra_scientist_governor_xenophobe_tt_2: "$t$—殖民地物种数量少于§Y3§!时：\n$tt$—$mod_planet_jobs_physics_research_produces_mult$: §G+15%§!\n$tt$—$mod_planet_jobs_society_research_produces_mult$: §G+20%§!\n$tt$—$mod_planet_jobs_engineering_research_produces_mult$: §G+15%§!"

 leader_trait_libra_scientist_governor_xenophile: "异星摇篮曲"
 leader_trait_libra_scientist_governor_xenophile_desc: "星尘为枕，异香盈舱~\n沉入星裔温暖的怀抱~\n让歌声抚平忧虑的褶皱~\n当所有不安都在异族音律中融解时~~\n数据流便在安宁的梦境里自发绽放成星辰。\n$libraf_lt_banner_9$"
 leader_trait_libra_scientist_governor_xenophile_tt_1: "$t$—每有100£amenities£§Y空余$PLANET_AMENITIES_TITLE$§!：\n$tt$—$researcher_jobs_bonus_workforce_mult$: §G+0.8%§!（最大: §G+40%§!）"
 leader_trait_libra_scientist_governor_xenophile_tt_2: "$t$—每有100£amenities£§Y空余$PLANET_AMENITIES_TITLE$§!：\n$tt$—$researcher_jobs_bonus_workforce_mult$: §G+0.4%§!（最大: §G+20%§!）"