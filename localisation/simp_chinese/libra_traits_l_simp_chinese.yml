 leader_trait_libra_commander_admiral_militarist: "铁雨织造者"
 leader_trait_libra_commander_admiral_militarist_desc: "摧毁敌人有很多种方式，而这位指挥官对其中的一种尤其精通：[this.GetHeShe]的舰队总是能无情而致命地倾泻火力，将任何敌人化为齑粉。\n$libraf_lt_banner_2$"

 leader_trait_libra_commander_admiral_pacifist: "止战坚垒"
 leader_trait_libra_commander_admiral_pacifist_desc: "这位指挥官的舰队在战场上如沉默的堡垒般巍然矗立，以不可撼动的存在吸引并阻绝一切战火。\n$libraf_lt_banner_3$"

