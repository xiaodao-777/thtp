 concept_libra_radiation_resistance: "辐射抵抗力"
 concept_libra_radiation_resistance_desc: "拥有以下任意特质的物种，将被认为具有§Y$concept_libra_radiation_resistance$§!：\n$t$—['trait:trait_libra_lithoid_0']\n$t$—['trait:trait_libra_lithoid_1']\n$t$—['trait:trait_plantoid_radiotrophic']\n$t$—['trait:trait_presapient_irradiated']\n$t$—['trait:trait_survivor']\n$t$—['trait:trait_robot_survivor']\n$t$—['trait:trait_robot_shielded_components']\n$t$—['trait:trait_pc_nuked_preference']"
#\n$t$—['trait:trait_machine_pc_nuked_preference']

 concept_libra_radiation_adaptability: "辐射适应性"
 concept_libra_radiation_adaptability_desc: "拥有以下任意特质的物种，将被认为具有§Y$concept_libra_radiation_adaptability$§!：\n$t$—['trait:trait_plantoid_radiotrophic']\n$t$—['trait:trait_presapient_irradiated']\n$t$—['trait:trait_pc_nuked_preference']"

 SPECIES_TRAIT_LIBRA_HUMANOID: "§E$libra_mod_name$§! ['concept_libra_humanoid_traits']"
 concept_libra_humanoid_traits: "人形物种特质"
 concept_libra_humanoid_traits_desc: "适用于§Y$HUM$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_humanoid_0']\n$t$—['trait:trait_libra_humanoid_1']\n$t$—['trait:trait_libra_humanoid_2']\n$t$—['trait:trait_libra_humanoid_3']\n$t$—['trait:trait_libra_humanoid_4']\n$t$—['trait:trait_libra_humanoid_5']\n$t$—['trait:trait_libra_humanoid_6']\n$t$—['trait:trait_libra_humanoid_7']\n$t$—['trait:trait_libra_humanoid_8']\n$t$—['trait:trait_libra_humanoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_humanoid_0: "铮铮铁骨"
 trait_libra_humanoid_0_desc: "这个直立物种进化出了优秀的神经系统和脊柱结构，不会因为冲击而轻易折断，也不会在传递神经信号的过程中发生低级错误。"
 trait_libra_humanoid_1: "能工巧匠"
 trait_libra_humanoid_1_desc: "这个人形物种拥有灵活的四肢，他们操作起工具来得心应手。"
 trait_libra_humanoid_2: "星火永续"
 trait_libra_humanoid_2_desc: "为信仰的延续，这些人形生物聚集在同一旗帜下不断接力——即便这旗帜可能同帝国相悖。"
 trait_libra_humanoid_3: "青子长青"
 trait_libra_humanoid_3_desc: "这个人形物种向往和平，他们渴望着繁荣的延续。"
 trait_libra_humanoid_4: "历战方旗"
 trait_libra_humanoid_4_desc: "自纷争与战火中一路走来，这个人形物种养成了在硝烟之中实现自我的传统。"
 trait_libra_humanoid_5: "古卷长新"
 trait_libra_humanoid_5_desc: "这个人形物种重视古典传统，他们普遍拥有很高的哲学素养。"
 trait_libra_humanoid_6: "兼人好胜"
 trait_libra_humanoid_6_desc: "带着对出人头地的渴望，这些人形生物踏上了群星间的不归路。"
 trait_libra_humanoid_7: "颖悟绝人"
 trait_libra_humanoid_7_desc: "长期的演化赋予这个人形物种以极高的智能，他们因此造就了辉煌的文明。"
 trait_libra_humanoid_8: "商贾之才"
 trait_libra_humanoid_8_desc: "这些人形生物极具商业头脑，他们从商业行动中获利颇丰。"
 trait_libra_humanoid_9: "衣冠绅士"
 trait_libra_humanoid_9_desc: "这些人形生物面相不凡，似有君子之仪。"

 SPECIES_TRAIT_LIBRA_MAM: "§E$libra_mod_name$§! ['concept_libra_mammalian_traits']"
 concept_libra_mammalian_traits: "哺乳物种特质"
 concept_libra_mammalian_traits_desc: "适用于§Y$MAM$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_mammalian_0']\n$t$—['trait:trait_libra_mammalian_1']\n$t$—['trait:trait_libra_mammalian_2']\n$t$—['trait:trait_libra_mammalian_3']\n$t$—['trait:trait_libra_mammalian_4']\n$t$—['trait:trait_libra_mammalian_5']\n$t$—['trait:trait_libra_mammalian_6']\n$t$—['trait:trait_libra_mammalian_7']\n$t$—['trait:trait_libra_mammalian_8']\n$t$—['trait:trait_libra_mammalian_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_mammalian_0: "发达乳腺"
 trait_libra_mammalian_0_desc: "这些哺乳物种拥有能够分泌富含大量营养物质且乳量较多的腺体。"
 trait_libra_mammalian_0_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R0.5§!£food£ §Y$food$§!生产§G0.5§!£food£ §Y$food$§!\n$t$—§Y物种$GENDER$§!为§Y$female$§!时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+30%§!\n$t$—§Y物种$GENDER$§!为§Y其他§!时：\n$tt$—$farmer_jobs_bonus_workforce_mult$: §G+40%§!"
 trait_libra_mammalian_1: "毛皮"
 trait_libra_mammalian_1_desc: "出于需要，这个哺乳物种在生命周期的某个阶段拥有毛发，可以保温、保护皮肤、传递社交信号或实现其它目的。"
 trait_libra_mammalian_1_tooltip: "§Y殖民地历史§!达到§Y8§!年前：\n$tt$—$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+30%§!\n$t$—§Y殖民地历史§!达到§Y8§!年后：\n$tt$—$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+5%§!\n$tt$—$specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+10%§!"
 trait_libra_mammalian_2: "敏锐骨传导"
 trait_libra_mammalian_2_desc: "在漫长的进化之后，这些哺乳类获得了独特的耳结构，相较于其它物种额外生长的听小骨大大增加了他们的听觉灵敏度。"
 trait_libra_mammalian_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.25§!£physics_research£ §Y$physics_research$§!"
 trait_libra_mammalian_3: "横膈膜"
 trait_libra_mammalian_3_desc: "通过将胸腔和腹腔分开，这个哺乳物种获得了更高的肺部通气效率，进而增加适应性与运动能力。"
 trait_libra_mammalian_4: "新皮质"
 trait_libra_mammalian_4_desc: "这个哺乳物种的大脑体积比例较大，其中容纳的是进化程度较高级的皮质。这赋予了它们极强的学习能力、记忆力、问题解决能力、复杂的社会行为、情感和自我意识。"
 trait_libra_mammalian_5: "恒温代谢"
 trait_libra_mammalian_5_desc: "恒温动物并不少见，但鲜有物种能进化出如此高效和复杂的温血机制，这使得他们能够在广泛的环境温度下保持活跃。"
 trait_libra_mammalian_5_tooltip: "$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+15%§!\n$t$—$MOD_ARMY_HEALTH$: §G+50%§!\n$t$—每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+1%§!（最大: §G+10%§!）"
 trait_libra_mammalian_6: "异形齿系"
 trait_libra_mammalian_6_desc: "经过漫长演化带来的高度特化，这个哺乳物种的牙齿分化成了不同的类型，可以使用不同位置的牙齿实现不同的功能。"
 trait_libra_mammalian_7: "育儿袋"
 trait_libra_mammalian_7_desc: "这个哺乳物种有一个育儿袋，能够在体外支持幼儿继续发育至拥有一定的行为能力的阶段。"
 trait_libra_mammalian_7_tooltip: "§Y殖民地历史§!小于§Y5§!年时：\n$tt$—每个£pop£§Y人口组§!获得§G+0.50§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_mammalian_8: "反刍胃"
 trait_libra_mammalian_8_desc: "这个哺乳物种利用多室胃初步消化食物，而后反刍回口中重新咀嚼，可以更高效地消化纤维素等营养物质。"
 trait_libra_mammalian_9: "多胎生育"
 trait_libra_mammalian_9_desc: "这个哺乳物种拥有多个子宫，以及频繁的发情期，这大大加速了他们的人口增长。然而，大量增加的人口显著消耗了环境承载力。"
 trait_libra_mammalian_9_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!带来§G0.02§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"

 SPECIES_TRAIT_LIBRA_MOL: "§E$libra_mod_name$§! ['concept_libra_molluscoid_traits']"
 concept_libra_molluscoid_traits: "软体物种特质"
 concept_libra_molluscoid_traits_desc: "适用于§Y$MOL$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_molluscoid_0']\n$t$—['trait:trait_libra_molluscoid_1']\n$t$—['trait:trait_libra_molluscoid_2']\n$t$—['trait:trait_libra_molluscoid_3']\n$t$—['trait:trait_libra_molluscoid_4']\n$t$—['trait:trait_libra_molluscoid_5']\n$t$—['trait:trait_libra_molluscoid_6']\n$t$—['trait:trait_libra_molluscoid_7']\n$t$—['trait:trait_libra_molluscoid_8']\n$t$—['trait:trait_libra_molluscoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_molluscoid_0: "外套膜"
 trait_libra_molluscoid_0_desc: "这一物种的外套膜比寻常更为优异，它能以较低的消耗分泌碳酸钙和有机质以巩固外壳，也能辅助日常活动的进行。"
 trait_libra_molluscoid_1: "齿舌"
 trait_libra_molluscoid_1_desc: "这个带状、由几丁质构成的锉刀状结构可以帮助其主人迅速磨碎食物——或者其它任何必要的东西。"
 trait_libra_molluscoid_1_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.10§!£alloys£ §Y$alloys$§!"
 trait_libra_molluscoid_2: "肌肉足"
 trait_libra_molluscoid_2_desc: "由肌肉构成的足赋予这一物种优秀的运动能力，对于掠食者来说则是不错的食物来源。"
 trait_libra_molluscoid_2_tooltip: "$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+15%§!\n$t$—每拥有一个§Y负面$TRAIT_TITLE$§!：\n$tt$—$livestock_jobs_bonus_workforce_mult$: §G+25%§!"
 trait_libra_molluscoid_3: "开放循环"
 trait_libra_molluscoid_3_desc: "这一软体物种的循环系统相对简单，虽然在复杂活动方面有所欠缺，但胜在稳定和低消耗。"
 trait_libra_molluscoid_4: "特殊呼吸法"
 trait_libra_molluscoid_4_desc: "这个软体物种可以利用皮肤或泄殖腔进行呼吸，从而提升活动能力并适应环境。"
 trait_libra_molluscoid_5: "极端智能"
 trait_libra_molluscoid_5_desc: "这一头足物种演化出了高度复杂的脑，以及高度发达的感官，他们表现出极强的学习、记忆、问题解决和使用工具的能力。"
 trait_libra_molluscoid_6: "滤食特化"
 trait_libra_molluscoid_6_desc: "高度特化的滤食结构，再加上纤毛系统的组合，使这一物种能高效地从流体中过滤出食物颗粒。"
 trait_libra_molluscoid_6_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.50§!£engineering_research£ §Y$engineering_research$§!"
 trait_libra_molluscoid_7: "荧光"
 trait_libra_molluscoid_7_desc: "这些软体物种拥有发光能力，可以诱捕猎物、迷惑天敌，也能用来求偶。"
 trait_libra_molluscoid_7_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!带来§G0.01§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_molluscoid_8: "拟态变形"
 trait_libra_molluscoid_8_desc: "不仅仅是变色能力，这个头足物种也能在极高程度上模仿自然环境或其它物种，这使得他们几乎没有天敌。"
 trait_libra_molluscoid_8_tooltip: "殖民地每有一个物种：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+2%§!（最大: §G+10%§!）\n$tt$—$MOD_POP_POLITICAL_POWER$: §G+10%§!（最大: §G+50%§!）"
 trait_libra_molluscoid_9: "触手"
 trait_libra_molluscoid_9_desc: "触手的用途多种多样，从摄食到取物，再到社交和繁殖，没有它们不能助力的领域。"
 trait_libra_molluscoid_9_tooltip: "殖民地每有$pop_group_unit$£pop£§Y$POP$§!：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+1%§!（最大: §G+15%§!）"

 SPECIES_TRAIT_LIBRA_FUN: "§E$libra_mod_name$§! ['concept_libra_fungoid_traits']"
 concept_libra_fungoid_traits: "真菌物种特质"
 concept_libra_fungoid_traits_desc: "适用于§Y$FUN$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_fungoid_0']\n$t$—['trait:trait_libra_fungoid_1']\n$t$—['trait:trait_libra_fungoid_2']\n$t$—['trait:trait_libra_fungoid_3']\n$t$—['trait:trait_libra_fungoid_4']\n$t$—['trait:trait_libra_fungoid_5']\n$t$—['trait:trait_libra_fungoid_6']\n$t$—['trait:trait_libra_fungoid_7']\n$t$—['trait:trait_libra_fungoid_8']\n$t$—['trait:trait_libra_fungoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_fungoid_0: "地衣"
 trait_libra_fungoid_0_desc: "这个共生复合体可以适应极端气候环境，可以分泌珍贵的生物激素，却对污染的抵抗力较弱。"
 trait_libra_fungoid_0_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.02§!£exotic_gases£ §Y$exotic_gases$§!"
 trait_libra_fungoid_1: "孢子发射"
 trait_libra_fungoid_1_desc: "既是繁殖手段也是自卫手段，这个物种释放出的特殊孢子可以对动物们造成巨大麻烦，毕竟呼吸系统感染可不是好受的。"
 trait_libra_fungoid_1_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.01§!£volatile_motes£ §Y$volatile_motes$§!\n$t$—殖民地存在其它物种时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!"
 trait_libra_fungoid_2: "嗜热"
 trait_libra_fungoid_2_desc: "环境的高温从来不是问题——只要你能像这个真菌物种一样吸收和利用它们。"
 trait_libra_fungoid_3: "厌氧"
 trait_libra_fungoid_3_desc: "可能不止是氧气，这个真菌物种对外界气体的最低需求少得异乎寻常，或者说，他们不需要这些。"
 trait_libra_fungoid_4: "荧光体"
 trait_libra_fungoid_4_desc: "这些菌子可以在特定环境下发出荧光，传递只有他们才能理解的信号。"
 trait_libra_fungoid_4_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.50§!£physics_research£ §Y$physics_research$§!"
 trait_libra_fungoid_5: "菌丝网络"
 trait_libra_fungoid_5_desc: "通过互相交叉的菌丝连接，这个真菌物种将在居住环境中逐步构建起一个庞大的信息网络，增强连接在其中的任何成员。"
 trait_libra_fungoid_5_tooltip: "殖民地每有一级§Y首府等级§!：\n$tt$—$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+5%§!"
 trait_libra_fungoid_6: "二型性优化"
 trait_libra_fungoid_6_desc: "这个真菌物种可以以更低的代价在菌丝和酵母两种形态间主动切换，他们曾经难以改变环境，但总是可以从变化中取得最大收益。"
 trait_libra_fungoid_6_tooltip: "殖民地存在£food£§Y$food$§!赤字时：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+6%§!\n$t$—殖民地存在£food£§Y$food$§!盈余时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+40%§!"
 trait_libra_fungoid_7: "神经寄生"
 trait_libra_fungoid_7_desc: "这个真菌物种最初的繁荣源于对其它有机体的驱役，细密的菌丝会渗透进宿主的每一个神经节，将其转化为缺失自我的傀儡。"
 trait_libra_fungoid_7_tooltip: "处于其它文明建立的殖民地时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$: §G+10%§!"
 trait_libra_fungoid_8: "致幻毒素"
 trait_libra_fungoid_8_desc: "这些真菌可以释放极为强力的神经毒素，给摄入者造成极其真实的幻觉。"
 trait_libra_fungoid_8_tooltip: "每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.10§!£society_research£ §Y$society_research$§!"
 trait_libra_fungoid_9: "续存分裂"
 trait_libra_fungoid_9_desc: "为了在各种各样的灾难中延续族群，这个真菌物种演化出了一种相对反常的信息素，这把他们在遭遇危险后的本能反应变成了释放孢子。"
 trait_libra_fungoid_9_tooltip: "处于战争期间时：\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$: §G+15%§!\n$t$—殖民地§Y破坏度§!高于§Y35§!时：\n$tt$—规模不小于§Y1000§!的£pop£§Y人口组§!获得§G+1§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"

 SPECIES_TRAIT_LIBRA_PLANT: "§E$libra_mod_name$§! ['concept_libra_plantoid_traits']"
 concept_libra_plantoid_traits: "植物物种特质"
 concept_libra_plantoid_traits_desc: "适用于§Y$PLANT$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_plantoid_0']\n$t$—['trait:trait_libra_plantoid_1']\n$t$—['trait:trait_libra_plantoid_2']\n$t$—['trait:trait_libra_plantoid_3']\n$t$—['trait:trait_libra_plantoid_4']\n$t$—['trait:trait_libra_plantoid_5']\n$t$—['trait:trait_libra_plantoid_6']\n$t$—['trait:trait_libra_plantoid_7']\n$t$—['trait:trait_libra_plantoid_8']\n$t$—['trait:trait_libra_plantoid_9']\n$t$—['trait:trait_libra_plantoid_10']\n$libra_mod_species_trait_tooltip$"
 trait_libra_plantoid_0: "无限生长"
 trait_libra_plantoid_0_desc: "得益于分生组织的存在，这些植物能在整个生命周期中持续产生新的器官，其成长上限更多地由环境而非基因决定。"
 trait_libra_plantoid_0_tooltip: "同时存在空余£amenities£§Y$PLANET_AMENITIES_TITLE$§!和£job£§Y岗位§!时：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!带来§G0.03§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_plantoid_1: "风滚草"
 trait_libra_plantoid_1_desc: "当种子成熟或环境变化之后，这些圆滚滚的植物便收起根茎随风旅行，直到他们抵达新的家园。"
 trait_libra_plantoid_1_tooltip: "同时存在空余£housing£§Y住房§!和£job£§Y岗位§!时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$: §G+20%§!"
 trait_libra_plantoid_2: "双受精"
 trait_libra_plantoid_2_desc: "这些被子植物拥有独特的受精现象：一个精子与卵细胞结合形成受精卵，而另一个精子与两个极核结合形成受精极核。"
 trait_libra_plantoid_3: "花芽盛放"
 trait_libra_plantoid_3_desc: "这些珍稀的植物对环境的要求非常苛刻，但在理想的环境中，这个物种的优势是无可比拟的。"
 trait_libra_plantoid_4: "捕食者"
 trait_libra_plantoid_4_desc: "这个植物物种在贫瘠的土地上进化，他们不再忠于生产者的位置，转而使用特化的叶片结构捕捉猎物以补充营养。"
 trait_libra_plantoid_4_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£food£ §Y$food$§!\n$t$—可以生成§Y$libra_plantoid_species_trait_army$§!防御部队"
 libra_plantoid_species_trait_army: "蝇笼猎手"
 libra_plantoid_species_trait_army_desc: "这些致命的捕手静静地潜伏在行星各处，等待着猎物们自投罗网。"
 trait_libra_plantoid_5: "次生生长"
 trait_libra_plantoid_5_desc: "这些木本植物的维管形成层活动产生了次生木质部和次生韧皮部，使茎、根不断增粗，提供强大支撑和长期物质运输通道。"
 trait_libra_plantoid_5_tooltip: "殖民地存在£trade£§Y$trade$§!盈余时：\n$tt$—$trader_jobs_bonus_workforce_mult$: §G+15%§!"
 trait_libra_plantoid_6: "根瘤共生"
 trait_libra_plantoid_6_desc: "这个植物物种的根部同根瘤菌共生形成根瘤，可以将空气中难以吸收的营养元素转化为能够利用的形式。"
 trait_libra_plantoid_6_tooltip: "$farmer_jobs_bonus_workforce_mult$: §G+10%§!\n$t$—每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$farmer_jobs_bonus_workforce_mult$: §G+5%§!（最大: §G+35%§!）"
 trait_libra_plantoid_7: "维管组织"
 trait_libra_plantoid_7_desc: "作为维管植物，这个物种的输导组织可以有效地运输养分，使其生长得更加高大。"
 trait_libra_plantoid_7_tooltip: "存在空余£housing£§Y住房§!时：\n$tt$—$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+15%§!\n$tt$—$specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+10%§!\n$tt$—$mod_pop_cat_ruler_bonus_workforce_mult$: §G+10%§!"
 trait_libra_plantoid_8: "世代交替"
 trait_libra_plantoid_8_desc: "这个物种的孢子体世代和配子体世代的特性差异都大得惊人，他们通过这种差异来在有限的环境中占据更多份额。"
 trait_libra_plantoid_8_tooltip: "于殖民地占据人口优势时：\n$tt$—$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+30%§!\n$t$—于殖民地没有人口优势时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+30%§!"
 trait_libra_plantoid_9: "蔷薇棘刺"
 trait_libra_plantoid_9_desc: "锋利的尖刺是这个植物物种从演化过程中得来的天然护甲，可以保障他们免受动物破坏。"
 trait_libra_plantoid_9_tooltip: "每$pop_group_unit$£pop£§Y工作$POP$§!每月生产§G0.20§!£unity£ §Y$unity$§!"
 trait_libra_plantoid_10: "曼德拉咆哮"
 trait_libra_plantoid_10_desc: "这个植物物种能够以及其惊人的音量发出尖叫，以尖锐刺耳的声音冲击并瘫痪周边生物。"
 trait_libra_plantoid_10_tooltip: "每$pop_group_unit$£pop_cat_specialist£§Y$pop_cat_specialist_plural$§!及£pop_cat_complex_drone£§Y$pop_cat_complex_drone_plural$§!£pop£§Y$POP$§!每月生产§G0.50§!£physics_research£ §G1§!£society_research£ §Y研究点数§!\n$t$—每$pop_group_unit$£pop_cat_worker£§Y$pop_cat_worker_plural$§!及£pop_cat_simple_drone£§Y$pop_cat_simple_drone_plural$§!£pop£§Y$POP$§!每月生产§G0.50§!£physics_research£ §G0.50§!£society_research£ §Y研究点数§!"

 SPECIES_TRAIT_LIBRA_LITHOID: "§E$libra_mod_name$§! ['concept_libra_lithoid_traits']"
 concept_libra_lithoid_traits: "石质物种特质"
 concept_libra_lithoid_traits_desc: "适用于§Y$LITHOID$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_lithoid_0']\n$t$—['trait:trait_libra_lithoid_1']\n$t$—['trait:trait_libra_lithoid_2']\n$t$—['trait:trait_libra_lithoid_3']\n$t$—['trait:trait_libra_lithoid_4']\n$t$—['trait:trait_libra_lithoid_5']\n$t$—['trait:trait_libra_lithoid_6']\n$t$—['trait:trait_libra_lithoid_7']\n$t$—['trait:trait_libra_lithoid_8']\n$t$—['trait:trait_libra_lithoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_lithoid_0: "放射性"
 trait_libra_lithoid_0_desc: "构成这个石质物种的核心矿物中包含大量放射性元素，这对周边环境产生了不小的影响。"
 trait_libra_lithoid_0_tooltip: "若具有['concept_libra_radiation_adaptability']：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!带来§G0.05§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!\n$t$—若没有['concept_libra_radiation_adaptability']：\n$tt$—提供§G+10%§!至§G+40%§!$MOD_LOGISTIC_GROWTH_MULT$，正比于殖民地人口总数"
 trait_libra_lithoid_1: "石墨"
 trait_libra_lithoid_1_desc: "形态特殊的碳构成了这个石质物种的主要结构，他们柔韧且稳定，能够适应对多数石质生物影响巨大的极端环境。"
 trait_libra_lithoid_1_tooltip: "$MOD_HABITABILITY_FLOOR$: §G+50%§!\n$t$—每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$mod_planet_pops_upkeep_mult$: §G-2%§!（最大: §G-20%§!）\n$tt$—$researcher_jobs_bonus_workforce_mult$: §G+3%§!（最大: §G+30%§!）"
 trait_libra_lithoid_2: "刚玉"
 trait_libra_lithoid_2_desc: "这个石质物种坚硬而不失美感，从优良的理化性质中，他们获益良多。"
 trait_libra_lithoid_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R0.50§!£minerals£ §Y$minerals$§!\n$t$—每$pop_group_unit$£pop_cat_civilian£§Y$pop_cat_civilian_plural$§!及£pop_cat_maintenance_drone£§Y$pop_cat_maintenance_drone_plural$§!£pop£§Y$POP$§!额外消耗§R0.50§!£energy£ §Y$energy$§!"
 trait_libra_lithoid_3: "萤石"
 trait_libra_lithoid_3_desc: "这个石质物种外表亮丽但质地脆软，幸运是的与他们共生的多种矿物弥补了这一缺陷。"
 trait_libra_lithoid_4: "滑石"
 trait_libra_lithoid_4_desc: "相较于其它同族，这个石质物种异常柔软和脆弱，他们的适应力较差但繁殖速度更快，生存环境更接近于大多数有机物种。"
 trait_libra_lithoid_5: "流星"
 trait_libra_lithoid_5_desc: "过去他们随着陨石羁旅四方，现在他们坐着飞船逐星越界。"
 trait_libra_lithoid_5_tooltip: "殖民完成时：\n$tt$—$d_buried_lithoids$: §Y+2§!"
 trait_libra_lithoid_6: "晶栅蔓生"
 trait_libra_lithoid_6_desc: "这个石质物种的晶格以一种异样的方式疯狂生长，穿破体表形成危险的尖刺。"
 trait_libra_lithoid_6_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.15§!£alloys£ §Y$alloys$§!"
 trait_libra_lithoid_7: "共振"
 trait_libra_lithoid_7_desc: "这个石质物种能够通过核心结构共振来被动调适族群数量平衡。"
 trait_libra_lithoid_7_tooltip: "$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+20%§!\n$t$—每个£pop£§Y人口组§!获得§G+0.10§!$MOD_BONUS_POP_GROWTH$\n$t$—提供§R-30%§!至§G+30%§!$MOD_LOGISTIC_GROWTH_MULT$，反比于殖民地人口总数\n$t$—提供§G+30%§!至§R-30%§!的$MOD_BONUS_POP_GROWTH_MULT$，反比于殖民地人口总数"
 trait_libra_lithoid_8: "同质多象"
 trait_libra_lithoid_8_desc: "虽然构成这一石质物种的主要成分基本相同，其晶体结构却不尽相同，这使得他们之间有不小的个体差异，所擅长的领域也是天南地北。"
 trait_libra_lithoid_8_tooltip: "处于§Y$climate_wet$§!环境时：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+8%§!\n$t$—处于§Y$climate_dry$§!环境时：\n$tt$—$MOD_POP_HOUSING_USAGE_MULT$: §G-40%§!\n$t$—处于§Y$climate_cold$§!环境时：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.35§!£physics_research£ §G0.35§!£society_research£ §G0.35§!£engineering_research£ §Y研究点数§!\n$t$—处于§Y其它§!环境时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!"
 trait_libra_lithoid_9: "晶体共生"
 trait_libra_lithoid_9_desc: "特殊的演化过程将多种不同的矿物成分混合，最终形成了这个特殊的石质物种。"
 trait_libra_lithoid_9_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.02§!£exotic_gases£ §G0.02§!£rare_crystals£ §G0.02§!£volatile_motes£ §Y稀有资源§!"

 SPECIES_TRAIT_LIBRA_NECROID: "§E$libra_mod_name$§! ['concept_libra_necroid_traits']"
 concept_libra_necroid_traits: "死灵物种特质"
 concept_libra_necroid_traits_desc: "适用于§Y$NECROID$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_necroid_0']\n$t$—['trait:trait_libra_necroid_1']\n$t$—['trait:trait_libra_necroid_2']\n$t$—['trait:trait_libra_necroid_3']\n$t$—['trait:trait_libra_necroid_4']\n$t$—['trait:trait_libra_necroid_5']\n$t$—['trait:trait_libra_necroid_6']\n$t$—['trait:trait_libra_necroid_7']\n$t$—['trait:trait_libra_necroid_8']\n$t$—['trait:trait_libra_necroid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_necroid_0: "巫妖领主"
 trait_libra_necroid_0_desc: "具备高度智慧的死灵生物是相当有力的存在，他们表现出相当的领导风范。"
 trait_libra_necroid_1: "裹尸布"
 trait_libra_necroid_1_desc: "这个死灵物种由层层叠叠且浸润香料的织物包裹，这隔绝了外部有害实体的侵入。"
 trait_libra_necroid_2: "血刻"
 trait_libra_necroid_2_desc: "这个死灵物种的全身遍布创伤一般的血痕印记，这是他们文化认同的象征。"
 trait_libra_necroid_3: "屠夫"
 trait_libra_necroid_3_desc: "这个死灵物种渴求杀戮，在战场上他们会是最危险的武士。"
 trait_libra_necroid_3_tooltip: "$libra_army_type$§Y$libra_necroid_species_trait_army$§!"
 libra_necroid_species_trait_army: "屠杀者"
 libra_necroid_species_trait_army_desc: "这支陆军完全由一个极度嗜血的物种构成。"
 trait_libra_necroid_4: "死神之镰"
 trait_libra_necroid_4_desc: "这个死灵物种能够从其他生命的凋亡中汲取力量。"
 trait_libra_necroid_4_tooltip: "每累计净化$pop_group_unit$£pop£§Y$POP$§!：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+0.03%§!（最大: §G+15%§!）"
 trait_libra_necroid_5: "被遗忘者"
 trait_libra_necroid_5_desc: "仿佛是被世界遗忘了，这个死灵物种毫无存在感可言。"
 trait_libra_necroid_6: "活死人"
 trait_libra_necroid_6_desc: "这个物种究竟是活着还是死了，即使是他们自己也说不清楚，但可以确定的是，他们力大无穷且百折不挠。"
 trait_libra_necroid_6_tooltip: "$MOD_ARMY_DAMAGE_MULT$: §G+50%§!\n$t$—每拥有一个§Y负面$TRAIT_TITLE$§!：\n$tt$—$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+7.5%§!"
 trait_libra_necroid_7: "缝合生物"
 trait_libra_necroid_7_desc: "这个完全不协调的死灵物种就像是用数个不同个体的身体组织拼装起来的一样——为什么会这样？谁也不知道。"
 trait_libra_necroid_7_tooltip: "每拥有一个§Y负面$TRAIT_TITLE$§!：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+3%§!"
 trait_libra_necroid_8: "彷徨行者"
 trait_libra_necroid_8_desc: "遗憾、恐怖、怨念、不安……在那些文明曾经兴盛过的地方，历史的创痕滋养着这些死灵再次生长。"
 trait_libra_necroid_8_tooltip: "处于§Y$pc_nuked$§!或§Y$pc_relic$§!时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+20%§!"
 trait_libra_necroid_9: "生命吸收"
 trait_libra_necroid_9_desc: "死亡对其它物种来说是终结，但，别人的凋亡预示着这些死灵的新生。"
 trait_libra_necroid_9_tooltip: "殖民地执行§Y净化§!时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+135%§!\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$: §G+45%§!"

 SPECIES_TRAIT_LIBRA_AQUATIC: "§E$libra_mod_name$§! ['concept_libra_aquatic_traits']"
 concept_libra_aquatic_traits: "水生物种特质"
 concept_libra_aquatic_traits_desc: "适用于§Y$AQUATIC$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_aquatic_0']\n$t$—['trait:trait_libra_aquatic_1']\n$t$—['trait:trait_libra_aquatic_2']\n$t$—['trait:trait_libra_aquatic_3']\n$t$—['trait:trait_libra_aquatic_4']\n$t$—['trait:trait_libra_aquatic_5']\n$t$—['trait:trait_libra_aquatic_6']\n$t$—['trait:trait_libra_aquatic_7']\n$t$—['trait:trait_libra_aquatic_8']\n$t$—['trait:trait_libra_aquatic_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_aquatic_0: "巨躯"
 trait_libra_aquatic_0_desc: "低重力负担使这个水生物种演化出了庞大的身躯，他们的每个个体都是一座小型生态群系。"
 trait_libra_aquatic_0_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.50§!£society_research£ §Y$society_research$§!"
 trait_libra_aquatic_1: "触角"
 trait_libra_aquatic_1_desc: "这个水生物种拥有许多触手，能够做到很多其他物种做不到的事情。"
 trait_libra_aquatic_1_tooltip: "§Y物种$GENDER$§!为§Y$female$§!时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+35%§!\n$t$—§Y物种$GENDER$§!为§Y$male$§!时：\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$: §G+20%§!\n$t$—§Y物种$GENDER$§!为§Y其他§!时：\n$tt$—$influential_jobs_bonus_workforce_mult$: §G+35%§!"
 trait_libra_aquatic_2: "寄居"
 trait_libra_aquatic_2_desc: "这个物种在进化出了对其他物种遗弃的生活场所的依赖，他们可能是很好的加工者，但作为生产者来说并不合适。"
 trait_libra_aquatic_3: "腔室"
 trait_libra_aquatic_3_desc: "这个水生物种在拥有坚固外结构的同时于体内存在多个腔室，这提升了它们在不同环境下稳定活动的能力。"
 trait_libra_aquatic_4: "群聚"
 trait_libra_aquatic_4_desc: "这个水生物种总是以大量个体形成聚落，利用团体的力量寻求生存。"
 trait_libra_aquatic_4_tooltip: "每拥有一个§Y负面$TRAIT_TITLE$§!：\n$tt$—$MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-5%§!\n$tt$—$MOD_POP_HOUSING_USAGE_ADD$: §G-5%§!"
 trait_libra_aquatic_5: "浮游"
 trait_libra_aquatic_5_desc: "这个水生物种演化的历史就是漂泊的历史，对随波逐流的他们来说，演化出文明是一个奇迹。"
 trait_libra_aquatic_5_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!带来§G0.01§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_aquatic_6: "多栖"
 trait_libra_aquatic_6_desc: "水域是这个水生物种的主场，但并不唯一：如果必要，他们也能在干燥环境下生存。"
 trait_libra_aquatic_6_tooltip: "处于§Y$climate_wet$§!环境时：\n$tt$—$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+12.5%§!\n$t$—未处于§Y$climate_wet$§!环境时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!"
 trait_libra_aquatic_7: "宽咽"
 trait_libra_aquatic_7_desc: "这个水生物种是大胃王，他们什么都能吃，也能将吃掉的东西进一步利用。"
 trait_libra_aquatic_7_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.25§!£minerals£ §Y$minerals$§!"
 trait_libra_aquatic_8: "饵钓"
 trait_libra_aquatic_8_desc: "这个水生物种精于释放诱饵捕捉猎物，他们将这一经验带到了太空之中。"
 trait_libra_aquatic_9: "育珠"
 trait_libra_aquatic_9_desc: "这个水生物种会分泌一些有价值的物质，久而久之凝聚成珍珠之类闪闪发光的宝藏。"
 trait_libra_aquatic_9_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1§!£trade£ §Y$trade$§!"

 SPECIES_TRAIT_LIBRA_REPTILIAN: "§E$libra_mod_name$§! ['concept_libra_reptilian_traits']"
 concept_libra_reptilian_traits: "爬行物种特质"
 concept_libra_reptilian_traits_desc: "适用于§Y$REP$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_reptilian_0']\n$t$—['trait:trait_libra_reptilian_1']\n$t$—['trait:trait_libra_reptilian_2']\n$t$—['trait:trait_libra_reptilian_3']\n$t$—['trait:trait_libra_reptilian_4']\n$t$—['trait:trait_libra_reptilian_5']\n$t$—['trait:trait_libra_reptilian_6']\n$t$—['trait:trait_libra_reptilian_7']\n$t$—['trait:trait_libra_reptilian_8']\n$t$—['trait:trait_libra_reptilian_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_reptilian_0: "攀爬大师"
 trait_libra_reptilian_0_desc: "这个爬行物种拥有很强的攀爬能力，在城市规划上他们能够充分利用三维空间。"
 trait_libra_reptilian_1: "羊膜卵"
 trait_libra_reptilian_1_desc: "这个爬行物种生产的卵具备极佳的密封性的坚固的外壳，能够隔绝微生物和真菌等的侵害，保障胚胎健康发育。"
 trait_libra_reptilian_1_tooltip: "每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+2%§!（最大: §G+20%§!）\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+4%§!（最大: §G+40%§!）"
 trait_libra_reptilian_2: "复合甲壳"
 trait_libra_reptilian_2_desc: "这个爬行物种的甲壳坚固到了即使用激光切割也要花上不少时间的程度，这使得他们在走向群星之前从未遇见任何天敌。"
 trait_libra_reptilian_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.15§!£alloys£ §Y$alloys$§!"
 trait_libra_reptilian_3: "变温"
 trait_libra_reptilian_3_desc: "这些爬行动物演化出了一种卓有成效的体温控制方式，极大减少了能量消耗。"
 trait_libra_reptilian_3_tooltip: "每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$mod_planet_pops_upkeep_mult$: §G-2.5%§!（最大: §G-20%§!）\n$tt$—$MOD_POP_AMENITIES_USAGE_MULT$: §G-5%§!（最大: §G-40%§!）"
 trait_libra_reptilian_4: "红外视"
 trait_libra_reptilian_4_desc: "在进化过程中，这个爬行物种借助他们感知红外线的能力来捕捉猎物，到了星际时代，他们转而利用自己的天赋操作工业机械。"
 trait_libra_reptilian_4_tooltip: "每拥有一个§Y$TRAIT_TITLE$§!：\n$tt$—$technician_jobs_bonus_workforce_mult$: §G+3.5%§!（最大: §G+35%§!）\n$tt$—$foundry_jobs_bonus_workforce_mult$: §G+3.5%§!（最大: §G+35%§!）"
 trait_libra_reptilian_5: "毒牙"
 trait_libra_reptilian_5_desc: "过去他们用于捕猎的致命毒素，如今已被证实为贵重的医学原料，虽然不再适合于战场上发挥作用，但这个爬行物种得以在实验室里大显身手。"
 trait_libra_reptilian_5_tooltip: "$MOD_ARMY_DAMAGE_MULT$: §G+15%§!\n$t$—$biologist_jobs_bonus_workforce_mult$: §G+15%§!\n$t$—每拥有一项稀有科技：\n$tt$—$researcher_jobs_bonus_workforce_mult$: §G+2%§!（最大: §G+30%§!）"
 trait_libra_reptilian_6: "多重眼睑"
 trait_libra_reptilian_6_desc: "这个爬行物种的高度发达的眼睛由多层组织严密保护，这确保了他们在复杂环境下的活动能力。"
 trait_libra_reptilian_6_tooltip: "处于§Y$climate_wet$§!或§Y$climate_dry$§!环境时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!\n$t$—处于§Y其它§!环境时：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+7.5%§!"
 trait_libra_reptilian_7: "有限循环"
 trait_libra_reptilian_7_desc: "为尽可能地提升活动效率，这个爬行物种在进化过程中重新整合了自己的循环系统，每一度体温代表的能量都会被他们利用到极致。"
 trait_libra_reptilian_8: "角质皮层"
 trait_libra_reptilian_8_desc: "这个爬行物种的表皮高度角质化并由鳞甲进一步保护，几乎不可能被寄生体侵入。"
 trait_libra_reptilian_9: "变态发育"
 trait_libra_reptilian_9_desc: "为了尽可能地扩大族群、拓宽生存空间并巩固优势，这个爬行物种生长的每一阶段都极大改变了自身的形态与生活方式。"
 trait_libra_reptilian_9_tooltip: "于殖民地占据人口优势时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+15%§!\n$t$—与帝国物种类型相同时：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!"

 SPECIES_TRAIT_LIBRA_AVI: "§E$libra_mod_name$§! ['concept_libra_avian_traits']"
 concept_libra_avian_traits: "鸟类物种特质"
 concept_libra_avian_traits_desc: "适用于§Y$AVI$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_avian_0']\n$t$—['trait:trait_libra_avian_1']\n$t$—['trait:trait_libra_avian_2']\n$t$—['trait:trait_libra_avian_3']\n$t$—['trait:trait_libra_avian_4']\n$t$—['trait:trait_libra_avian_5']\n$t$—['trait:trait_libra_avian_6']\n$t$—['trait:trait_libra_avian_7']\n$t$—['trait:trait_libra_avian_8']\n$t$—['trait:trait_libra_avian_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_avian_0: "锐爪"
 trait_libra_avian_0_desc: "这个鸟类物种拥有锋利的爪牙，他们是优秀的猎手，更是在长久的历史间支配天空的霸主。"
 trait_libra_avian_0_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.75§!£food£ §Y$food$§!"
 trait_libra_avian_1: "羽毛"
 trait_libra_avian_1_desc: "只有鸟类进化出了真正意义上的羽毛，而这一物种的羽毛在功能性和适应性上都尤为优异，从保温、伪装到求偶，一切皆有所益。"
 trait_libra_avian_1_tooltip: "每拥有一个§Y$TRAIT_TITLE$§!：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+2%§!（最大: §G+20%§!）"
 trait_libra_avian_2: "几丁质喙"
 trait_libra_avian_2_desc: "鸟类没有颌骨和牙齿，取而代之的是由角质鞘覆盖的喙，但这并不能满足这个物种的一般需求。在漫长的演化之后，他们获得了由高强度几丁质构成的特殊工具，其耐用性远超通常的喙，其危险程度比一般的爪更高。"
 trait_libra_avian_3: "双重呼吸"
 trait_libra_avian_3_desc: "飞行时耗氧需求极高，常规的呼吸系统力不能及，而独特的气囊结构则解决了这一问题：无论吸气还是呼气，都会有新的气体进入肺部，保证气体交换持续进行。"
 trait_libra_avian_3_tooltip: "$specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+5%§!\n$t$—每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+2.5%§!（最大: §G+20%§!）"
 trait_libra_avian_4: "鸣管"
 trait_libra_avian_4_desc: "这些鸟儿的发生位置不在喉部，而是气管与支气管交界处，通过气流震动鸣膜发声。他们的声音多变而美妙。"
 trait_libra_avian_4_tooltip: "殖民地每有一级§Y$planetary_ascension$§!：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+2%§!（最大: §G+20%§!）"
 trait_libra_avian_5: "鹰视"
 trait_libra_avian_5_desc: "这些鸟类具有多种不同类型的视锥细胞，能够识别更多的颜色乃至于紫外线和红外线，可以精确地导航飞行或定位猎物。"
 trait_libra_avian_5_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.50§!£physics_research£ §Y$physics_research$§!"
 trait_libra_avian_6: "信使"
 trait_libra_avian_6_desc: "这个鸟类物种有着极强的长距离迁徙能力，天体和地磁都是可靠的导向标，允许他们跨越漫长的距离往返于不同的家园。"
 trait_libra_avian_7: "极速代谢"
 trait_libra_avian_7_desc: "为了维持飞行所需的巨大消耗，这个鸟类物种以极快的速度消耗和转化能量，时刻保持着远高于同类的平均体温。"
 trait_libra_avian_7_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R1§!£energy£ §Y$energy$§!"
 trait_libra_avian_8: "高巢"
 trait_libra_avian_8_desc: "在理想的位置修建高高的巢穴是这个鸟类物种独特的习惯，在那里，生活环境和子嗣安全都能得到保障。"
 trait_libra_avian_8_tooltip: "殖民地符合§Y$PLANET_CLASS_PREFERENCE_TRAITS$§!时：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+15%§!"
 trait_libra_avian_9: "砂囊"
 trait_libra_avian_9_desc: "这个鸟类物种没有牙齿，取而代之的是借助胃部——通过吞食砂石，在肌胃强大的肌肉收缩下，利用砂石磨碎食物。"
 trait_libra_avian_9_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R0.20§!£minerals£ §Y$minerals$§!"

 SPECIES_TRAIT_LIBRA_INFERNAL: "§E$libra_mod_name$§! ['concept_libra_infernal_traits']"
 concept_libra_infernal_traits: "炼狱物种特质"
 concept_libra_infernal_traits_desc: "适用于§Y$INF$§!的表型物种特质，包括：\n$t$—['trait:trait_libra_infernal_0']\n$t$—['trait:trait_libra_infernal_1']\n$t$—['trait:trait_libra_infernal_2']\n$t$—['trait:trait_libra_infernal_3']\n$t$—['trait:trait_libra_infernal_4']\n$t$—['trait:trait_libra_infernal_5']\n$t$—['trait:trait_libra_infernal_6']\n$t$—['trait:trait_libra_infernal_7']\n$t$—['trait:trait_libra_infernal_8']\n$t$—['trait:trait_libra_infernal_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_infernal_0: "炽火雄心"
 trait_libra_infernal_0_desc: "这个燃烧着的物种渴望建立一个和他们一样壮烈而炽热、生生不息的宏伟帝国。"
 trait_libra_infernal_1: "激昂"
 trait_libra_infernal_1_desc: "高温高压的血液循环在体内，这个炼狱物种时刻意识到自己正存在于这个世界上。"
 trait_libra_infernal_1_tooltip: "£happiness£§Y$HAPPINESS$§!不低于§Y50%§!的£pop£§Y人口组§!获得§G+10%§!£mod_pop_bonus_workforce_mult£ §Y$MOD_POP_BONUS_WORKFORCE_MULT$§!"
 trait_libra_infernal_2: "天火"
 trait_libra_infernal_2_desc: "这个物种扩张家园的行动像小行星一样迅速且野蛮。"
 trait_libra_infernal_2_tooltip: "殖民完成时：\n$tt$—$PLANET_DEVASTATION$: §R+35§!"
 trait_libra_infernal_3: "熔炼之心"
 trait_libra_infernal_3_desc: "在以火山喷发为代表的地质活动面前，个体的力量是如此渺小，这个炼狱物种选择结成巨大的社群来应对种种危机。"
 trait_libra_infernal_3_tooltip: "规模不小于§Y1750§!的£pop£§Y人口组§!获得§G+0.50§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!和§G+15%§!£mod_pop_bonus_workforce_mult£ §Y$specialist_and_complex_drone_cat_bonus_workforce_mult$§!"
 trait_libra_infernal_4: "熔岩学者"
 trait_libra_infernal_4_desc: "这个炼狱物种的整个演化过程都伴随着火山与岩浆的洗礼，认知相关变化的天赋早已融入基因成为血脉的一部分。"
 trait_libra_infernal_4_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.75§!£engineering_research£ §Y$engineering_research$§!"
 trait_libra_infernal_5: "星辰应力"
 trait_libra_infernal_5_desc: "将手伸向月亮，就可以感知到家的温暖，也许那里没有熔岩的炙烤——尽管那温度代表着族群的生命。"
 trait_libra_infernal_5_tooltip: "处于§Y卫星§!或§Y拥有卫星§!的殖民地时：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+40%§!"
 trait_libra_infernal_6: "熔火潜行"
 trait_libra_infernal_6_desc: "这个炼狱物种能够在熔岩中行动自如，从中提取出有价值的资源。"
 trait_libra_infernal_7: "爆发"
 trait_libra_infernal_7_desc: "这个时刻燃烧着的物种的生理规律就像火山活动一样时强时弱，在漫长的沉静期之后，随之而来的将是惊人的爆发。"
 trait_libra_infernal_7_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R0.35§!£alloys£ §Y$alloys$§!"
 trait_libra_infernal_8: "炼狱行军"
 trait_libra_infernal_8_desc: "这个物种自最严酷的环境中演化，拥有惊人的纪律性和军事素养。"
 trait_libra_infernal_8_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!提供§G0.50§!£mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!"
 trait_libra_infernal_9: "火之振奋"
 trait_libra_infernal_9_desc: "熔岩的流动使这个物种容光焕发，但在缺乏温度的地方，他们的表现一言难尽。"
 trait_libra_infernal_9_tooltip: "处于§Y$pc_volcanic$§!时：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\n$t$—处于§Y$climate_dry$§!环境时：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!带来§G0.03§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"

