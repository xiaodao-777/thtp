 leader_trait_libra_commander_admiral_egalitarian: "联合天堑"
 leader_trait_libra_commander_admiral_egalitarian_desc: "这位指挥官是文明共识锻造的战争枢纽，其卓越的战术素养与组织智慧，能将分散的舰船统合为一面由协同意志铸就的叹息之壁，使舰队在广阔星疆中构筑起远超钢铁壁垒的集体防御韧性。\n$libraf_lt_banner_5$"

 leader_trait_libra_commander_admiral_spiritualist: "天界圣契"
 leader_trait_libra_commander_admiral_spiritualist_desc: "此统帅乃行走于星海间的受祝者，其灵魂即是凡世间不可言喻的圣约锚点。凡其统帅之舰船，皆沐浴于神圣灵光之中，创伤以超然之速弥合如初，火力随随信仰而撕裂虚空。其巡狩与惩戒的领域突破凡俗桎梏，直抵天界意志所及之边疆。\n$libraf_lt_banner_6$"
 leader_trait_libra_commander_admiral_spiritualist_tt: "$t$—每拥有一项§Y飞升天赋§!：\n$tt$—$MOD_SHIP_WEAPON_RANGE_MULT$: §G+5%§!（最大: §G+40%§!）\n$tt$—$MOD_SHIP_ENGAGEMENT_RANGE_MULT$: §G+10%§!（最大: §G+80%§!）"

 leader_trait_libra_commander_admiral_materialist: "战场解构者"
 leader_trait_libra_commander_admiral_materialist_desc: "战争于[Root.GetHeShe]只是冰冷的方程式：对宇宙法则的解析被完美纳入防御矩阵的算法，而现实颠覆性技术则成为了其攻击函数中威力无穷的混沌参数，每一次迭代都让毁灭效率指数级增长。情感是冗余代码，道德是未定义变量——唯有可量化的战斗效能是终极解。\n$libraf_lt_banner_7$"
 leader_trait_libra_commander_admiral_materialist_tt_1: "$t$—每拥有一项§R危险科技§!：\n$tt$—$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+3%§!（最大: §G+15%§!）\n$tt$—$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+3%§!（最大: §G+15%§!）"
 leader_trait_libra_commander_admiral_materialist_tt_2: "$t$—每拥有一项§M稀有科技§!：\n$tt$—$MOD_SHIP_ARMOR_HARDENING_ADD$: §G+1%§!（最大: §G+40%§!）\n$tt$—$MOD_SHIP_SHIELD_HARDENING_ADD$: §G+1%§!（最大: §G+40%§!）"

 leader_trait_libra_commander_admiral_xenophobe: "冥河摆渡人"
 leader_trait_libra_commander_admiral_xenophobe_desc: "冰冷的效率是其唯一信条。这位统帅将净化视为一种神圣的收割，每一次成功的灭绝行动都如同为舰队的武器注入了亡者的精华，使其在后续的收割中更加致命。他们不是征服者，而是送葬者，其舰队即是星海间移动的墓园。\n$libraf_lt_banner_8$"
 leader_trait_libra_commander_admiral_xenophobe_tt_1: "$t$—当前§Y[Owner.libra_pop_purged_count]§!，每累计净化$pop_group_unit$£pop£§Y$POP$§!：\n$tt$—$MOD_SHIP_WEAPON_DAMAGE$: §G+1%§!（最大: §G+125%§!）"
 leader_trait_libra_commander_admiral_xenophobe_tt_2: "当前§Y0§!，每累计净化$pop_group_unit$£pop£§Y$POP$§!：\n$tt$—$MOD_SHIP_WEAPON_DAMAGE$: §G+1%§!（最大: §G+125%§!）"

 leader_trait_libra_commander_admiral_xenophile: "同盟守望者"
 leader_trait_libra_commander_admiral_xenophile_desc: "对此统帅而言，外交协议并非一纸空文，而是构筑银河和平的真正壁垒。每一项条约都为其舰队提供了更广泛的行动授权、更深入的潜在盟友星域情报共享以及更坚定的作战信念——他们并非孤军奋战，而是在守护一个由众多文明共同维系的脆弱秩序。\n$libraf_lt_banner_9$"
 leader_trait_libra_commander_admiral_xenophile_tt_1: "$t$—每签订一份§Y互不侵犯条约§!：\n$tt$—$MOD_SHIP_WEAPON_DAMAGE$: §G+25%§!（最大: §G+100%§!）\n$tt$—$MOD_SHIP_FRIENDLY_TERRITORY_ACCURACY_MULT$: §G+5%§!（最大: §G+20%§!）"
 leader_trait_libra_commander_admiral_xenophile_tt_2: "$t$—每签订一份§Y共同防御条约§!：\n$tt$—$MOD_SHIP_FIRE_RATE_MULT$: §G+25%§!（最大: §G+100%§!）\n$tt$—$MOD_SHIP_FRIENDLY_TERRITORY_TRACKING_MULT$: §G+5%§!（最大: §G+20%§!）"

# 陆军将领

 leader_trait_libra_commander_general_destiny_a: "万岁冲锋"
 leader_trait_libra_commander_general_destiny_a_desc: "如果冲锋不能解决问题，那一定是发起突击的士兵缺乏勇气、信心和练度；若是以上问题都不存在，那便归咎于动员的数量不足。总之，这位指挥官是白刃接战的忠实信徒，只要环境允许，就没有[this.GetHeShe]斩不断的事物。\n$libraf_lt_banner_12$"

 leader_trait_libra_commander_general_destiny_b: "爆破达人"
 leader_trait_libra_commander_general_destiny_b_desc: "这位指挥官是名副其实的破坏者，毁灭的代名词。[this.GetHeShe]指挥的攻势不问后果、且不择手段，因为[this.GetHeShe]战斗的唯一信条即是尽可能地造成破坏。\n$libraf_lt_banner_12$"

 leader_trait_libra_commander_general_destiny_c: "镇域要辖"
 leader_trait_libra_commander_general_destiny_c_desc: "这位指挥官在专精于星际维和事务也会收集异域的奇异知识，[this.GetHeShe]带领的驻军老练且无畏。\n$libraf_lt_banner_12$"
 leader_trait_libra_commander_general_destiny_c_tt: "$t$—舰队于殖民地在轨时：\n$tt$—殖民地每有$pop_group_unit$£pop£§Y$POP$§!就消耗§R4§!£energy£ §Y$energy$§!产出§G1§!£physics_research£ §G1§!£society_research£ §G1§!£engineering_research£ §Y研究点数§!"

 leader_trait_libra_commander_general_destiny_d: "战地拾荒者"
 leader_trait_libra_commander_general_destiny_d_desc: "对这位指挥官而言，战场废墟是最高效的露天矿脉。当最后一名守军倒下，[this.GetHeShe]的工程兵团携带着专业仪器一拥而上，将遗留的残损金属熔铸为崭新的合金锭。所谓征服，不过是把敌人的遗产贴上己方标签的流水线作业。\n$libraf_lt_banner_12$"
 leader_trait_libra_commander_general_destiny_d_tt: "攻占殖民地时：\n$tt$—每§Y$MOD_LEADER_SKILL_ADD$§!带来 £alloys£§G275§! £influence£§G5§!"

 leader_trait_libra_commander_general_militarist: "殒金回旋镖"
 leader_trait_libra_commander_general_militarist_desc: "这位指挥官是战场上的精算师——每摧毁一支敌军编制，[this.GetHeShe]的账簿便同步完成两笔入账：第一笔是阵亡者装备熔炼成的能量币现金流，第二笔是飞溅的破片与冲击波在敌阵中随机签发的死亡红利。\n$libraf_lt_banner_2$"
 leader_trait_libra_commander_general_militarist_tt: "击杀驻军部队时：\n$tt$—获得 £energy£§G100§! £influence£§G0.5§!\n$tt$—对随机敌军造成§G360§!伤害"

 leader_trait_libra_commander_general_pacifist: "慈卫悖论"
 leader_trait_libra_commander_general_pacifist_desc: "真正的和平非无争，而是令侵略者自我瓦解。这位指挥官以精密的布局精确狙击来犯之敌的要害，使其无法发挥便黯然退场。\n$libraf_lt_banner_3$"
 leader_trait_libra_commander_general_pacifist_tt: "开始防御殖民地时：\n$tt$—§Y65%§!几率驱离进攻方$commander_with_icon$并使其在§Y180§!天内无法工作"

 leader_trait_libra_commander_general_authoritarian: "征地税赋官"
 leader_trait_libra_commander_general_authoritarian_desc: "征服对这位指挥官而言，是执行帝国税吏的终极职责。[this.GetHeShe]的军队如精密的征税仪器——刺刀是丈量忠诚的标尺，枪炮是催缴贡赋的印章。在[this.GetHeShe]的手段下，占领区鲜有废墟，唯有被精确榨取的繁荣：每一具躯壳皆被换算为能量币的脉动，每一次呼吸皆被折价为贸易额的涨潮。\n$libraf_lt_banner_4$"
 leader_trait_libra_commander_general_authoritarian_tt: "攻占殖民地时：\n$tt$—殖民地每有一个£pop£§Y$POP$§!就获得 £energy£§G3§! £trade£§G2§!"

 leader_trait_libra_commander_general_egalitarian: "均势破壁者"
 leader_trait_libra_commander_general_egalitarian_desc: "平等如野火，需借风势燎原。以战争的硝烟为饵，这位陆军将领的手足悄悄渗透进对方社会的深层，将源自于异国的理念播撒于民众的内心。当敌人意识到自己大势已去时，一切为时已晚。\n$libraf_lt_banner_5$"
 leader_trait_libra_commander_general_egalitarian_tt: "£time£§Y90§!天，侵入殖民地时对目标帝国施加§Y75§!天的效果：\n$tt$—$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §R-25%§!\n$tt$—$MOD_SHIP_FIRE_RATE_MULT$: §R-25%§!\n$tt$—$mod_planet_pops_upkeep_mult$: §R+25%§!"
 leader_trait_libra_commander_general_egalitarian_effect: "平权之火"
 leader_trait_libra_commander_general_egalitarian_effect_desc: "受到战争中输入的思潮影响，管理帝国暂时变得困难了。"

 leader_trait_libra_commander_general_spiritualist: "心魇裁决"
 leader_trait_libra_commander_general_spiritualist_desc: "对于异端，这位指挥官将是最为无情的审判官。当[this.GetHeShe]的军团踏入异星大地，靴底震起的尘埃皆成祷言：胜败在枪械抬起前，已由亵渎的回响裁定。\n$libraf_lt_banner_6$"
 leader_trait_libra_commander_general_spiritualist_tt: "£time£§Y90§!天，侵入殖民地时：\n$tt$—对驻守§Y防御部队§!造成§G240§!伤害\n$tt$—对驻守§Y进攻部队§!造成§G720§!伤害"

 leader_trait_libra_commander_general_materialist: "焚识之焰"
 leader_trait_libra_commander_general_materialist_desc: " [this.GetHeShe]的战争本质是递归算法：从攻破城墙、到收割科技，而后锻造更强兵器，最终攻破更坚固的城墙。在[this.GetHeShe]眼中，异族实验室与数据库是待拆解的机械羔羊，士兵的刺刀即是解剖刀，其每一次征服，都是文明智慧的暴力实践。\n$libraf_lt_banner_7$"
 leader_trait_libra_commander_general_materialist_tt: "攻占殖民地时：\n$tt$—获得 £minor_artifacts£§G100§!\n$tt$—获得§G6§!个月的 £physics£ £society£ £engineering£ §Y研究点数§!"

 leader_trait_libra_commander_general_xenophobe: "血色祭礼"
 leader_trait_libra_commander_general_xenophobe_desc: "在[this.GetHeShe]眼中，新征服的世界需要一场奠基典礼，而半数生灵的湮灭是帝国意志扎根的必要祭品。这场仪式的结果清晰可见：帝国的凝聚力因恐惧与臣服而集中，影响力因铁腕而扩张，而[this.GetHisHer]冷酷高效的执行过程本身，就是为同僚指挥官们提供的一份来自地狱的珍贵教材。\n$libraf_lt_banner_8$"
 leader_trait_libra_commander_general_xenophobe_tt: "攻占£pop£§Y$POP$§!达到§Y800§!的殖民地时：\n$tt$—殖民地每有一个£pop£§Y$POP$§!就使技能等级最低的$commander_with_icon$获得§G1§!经验\n$tt$—清除殖民地§R50%§!£pop£§Y$POP$§!，每个被清除的£pop£§Y$POP$§!带来 £unity£§G8§! £influence£§G0.03§!"

 leader_trait_libra_commander_general_xenophile: "非零和战术"
 leader_trait_libra_commander_general_xenophile_desc: "胜利不必以废墟为证，这位陆军将领的每一步战术皆以未来和平后的复兴为前提。不滥杀无辜之人，亦不放过当道之敌。\n$libraf_lt_banner_9$"

# 督管专员

 leader_trait_libra_commander_governor_destiny_a: "督导专员"
 leader_trait_libra_commander_governor_destiny_a_desc: "无论在什么地方，维持秩序都是重中之重，没有秩序的社会会陷入混乱并归于瘫痪。这位指挥官以提升殖民地的稳定度为最优先，对于[this.GetHeShe]来说稳定等同于繁荣。\n$libraf_lt_banner_13$"
 leader_trait_libra_commander_governor_destiny_a_tt_1: "$t$—每有1%£stability£§Y$PLANET_STABILITY_TITLE$§!：\n$tt$—$mod_planet_jobs_produces_mult$: §G+0.6%§!"
 leader_trait_libra_commander_governor_destiny_a_tt_2: "$t$—每有1%£stability£§Y$PLANET_STABILITY_TITLE$§!：\n$tt$—$mod_planet_jobs_produces_mult$: §G+0.3%§!"

 leader_trait_libra_commander_governor_destiny_b: "镜墙之握"
 leader_trait_libra_commander_governor_destiny_b_desc: "此处乃禁域，眼前即鸿沟。\n虽千军万马，无人得以踏过。\n$libraf_lt_banner_13$"

 leader_trait_libra_commander_governor_destiny_c: "网域核心"
 leader_trait_libra_commander_governor_destiny_c_desc: "管理行星并非易事，同时处理好星际事务更是难上加难。\n这位指挥官拥有独到的手段，可使太空作业如履平地。\n$libraf_lt_banner_13$"

 leader_trait_libra_commander_governor_destiny_d: "物流督办使"
 leader_trait_libra_commander_governor_destiny_d_desc: "这位专员将星区视作冰冷的循环系统，劳工仅是输送营养的红细胞。[this.GetHeShe]以精密齿轮的标准规训每个环节——传送带必须震颤如脉搏，仓库吞吐需媲美超新星爆发。当贸易值在钢铁律令下冲破计量表时，殖民地血管中再难容半粒犯罪的尘埃。\n$libraf_lt_banner_13$"

 leader_trait_libra_commander_governor_militarist: "要塞建筑师"
 leader_trait_libra_commander_governor_militarist_desc: "这位督管专员将行星锻造成刺向深空的铁砧——轨道轰炸的烈焰不过是淬火的熔汤，坠落的动能武器在[this.GetHeShe]督造的行星护盾上只能溅出苍白的星屑。只有在付出巨大代价之后，入侵者才会明白，撞上铁砧的从来都不是铁锤。\n$libraf_lt_banner_2$"
 leader_trait_libra_commander_governor_militarist_tt: "$t$—§Y$councilor_defense$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$—$mod_job_soldier_add$: §G+200§!（最大: §G+6000§!）"

 leader_trait_libra_commander_governor_pacifist: "丰饶壁垒"
 leader_trait_libra_commander_governor_pacifist_desc: "这位指挥官将和平岁月酿作文明的蜜浆——当星港起重机在麦浪倒影间升降时，[this.GetHeShe]调控的合成日光能使矿脉如作物般抽穗，而远方的电离设施正悄悄运作。可当危机来临时，安宁的景象便会在瞬间消散：志愿兵整齐划一地列队行进，警报无人机巡回监察着大气外的可疑动向，无数物资则被集中装载，准备发往前线热血的战场。\n$libraf_lt_banner_3$"
 leader_trait_libra_commander_governor_pacifist_tt_1: "$t$—$libra_peace_effect$\n$tt$—$mod_planet_buildings_produces_mult$: §G+25%§!\n$tt$—$mod_planet_jobs_productive_produces_mult$: §G+25%§!\n$t$—$libra_war_effect$\n$tt$—$MOD_PLANET_DEFENSE_ARMIES_ADD$: §G+32§!\n$tt$—$mod_planet_soldiers_alloys_produces_add$: §G+1.20§!\n$tt$—$mod_job_soldier_stability_add$: §G+4§!"
 leader_trait_libra_commander_governor_pacifist_tt_2: "$t$—$libra_peace_effect$\n$tt$—$mod_planet_buildings_produces_mult$: §G+12.5%§!\n$tt$—$mod_planet_jobs_productive_produces_mult$: §G+12.5%§!\n$t$—$libra_war_effect$\n$tt$—$MOD_PLANET_DEFENSE_ARMIES_ADD$: §G+16§!\n$tt$—$mod_planet_soldiers_alloys_produces_add$: §G+0.60§!\n$tt$—$mod_job_soldier_stability_add$: §G+2§!"

 leader_trait_libra_commander_governor_authoritarian: "帝国提刑官"
 leader_trait_libra_commander_governor_authoritarian_desc: "当[this.GetHeShe]的审判庭投影笼罩市政广场时，连孩童的啼哭都会凝结成冰晶。在这里，犯罪度是少数会被计量的指标，为此劳工们的每根神经都绷紧成绞索，因为只要稍有怠慢，接踵而来的便是无尽的苦役与刑责。\n$libraf_lt_banner_4$"
 leader_trait_libra_commander_governor_authoritarian_tt_1: "$t$—每有1%£crime£§Y[Owner.GetCrimeDeviancy]§!：\n$tt$—$mod_planet_jobs_worker_produces_mult$: §R-0.2%§!\n$tt$—$mod_planet_soldiers_unity_produces_add$: §G+0.02§!\n$tt$—$mod_planet_enforcers_unity_produces_add$: §G+0.02§!"
 leader_trait_libra_commander_governor_authoritarian_tt_2: "$t$—每有1%£crime£§Y[Owner.GetCrimeDeviancy]§!：\n$tt$—$mod_planet_jobs_worker_produces_mult$: §R-0.1%§!\n$tt$—$mod_planet_soldiers_unity_produces_add$: §G+0.01§!\n$tt$—$mod_planet_enforcers_unity_produces_add$: §G+0.01§!"

 leader_trait_libra_commander_governor_egalitarian: "工会委员长"
 leader_trait_libra_commander_governor_egalitarian_desc: "这位指挥官关心下属，时常身先士卒地参与到日常劳作之中。在[this.GetHeShe]辖下的每一个个体都会被细心地关照，医疗补贴和公共住房是最低保障，劳动津贴和节日贺礼也时有发放。\n$libraf_lt_banner_5$"

 leader_trait_libra_commander_governor_spiritualist: "天穹共鸣者"
 leader_trait_libra_commander_governor_spiritualist_desc: "锤尖锻星锚，熔炉吐圣谣。\n每逢晶尘坠地散，群星经络续新梢。\n光尘焊枪耀，晶簇盔中绕。\n适当流水越星环，吾魂共振即天标。\n$libraf_lt_banner_6$"

 leader_trait_libra_commander_governor_materialist: "提纯3000倍"
 leader_trait_libra_commander_governor_materialist_desc: "这位指挥官的规划里，没有废弃物的位置。任何矿渣或农余都会被送回处理车间里再次提炼，只有榨取出全部价值才是终点。\n$libraf_lt_banner_7$"

 leader_trait_libra_commander_governor_xenophobe: "异星美食家"
 leader_trait_libra_commander_governor_xenophobe_desc: "在处理及烹饪异种美味这一领域，这位指挥官堪称第一。每当异族哀嚎在离子滤网中雾化，[this.GetHeShe]的调味探针便从分子汤里打捞起琥珀色的生产力精华。从学校午餐添加神经兴奋剂，到矿井通风口飘出甲壳素炙烤的焦香，无一不沉醉于丰饶幻觉之中。\n死亡是风味的催化剂，消化它们将使文明更近一层。\n$libraf_lt_banner_8$"
 leader_trait_libra_commander_governor_xenophobe_tt_1: "$t$—每累计净化$pop_group_unit$£pop£§Y$POP$§!：\n$tt$—$mod_country_produces_mult$: §G+0.2%§!（最大: §G+25%§!）"
