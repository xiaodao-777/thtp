 leader_trait_libra_commander_admiral_destiny_a: "幽灵船长"
 leader_trait_libra_commander_admiral_destiny_a_desc: "来无影，去无踪，这位指挥官能够神不知鬼不觉地越过敌军防线，在最安全的地方给予敌人致命一击。\n$libraf_lt_banner_11$"
