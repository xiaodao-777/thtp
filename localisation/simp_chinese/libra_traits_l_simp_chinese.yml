 leader_trait_libra_commander_governor_xenophobe_tt_3: "$t$—$mod_pop_livestock_bonus_workforce_mult$: §G+50%§!"

 leader_trait_libra_commander_governor_xenophile: "寰宇同春"
 leader_trait_libra_commander_governor_xenophile_desc: "海纳四方客，远来皆友人。虚室存星槎，共耕寰宇丰。\n$libraf_lt_banner_9$"
 leader_trait_libra_commander_governor_xenophile_tt_1: "$t$—每有100£housing£§Y空余住房§!：\n$tt$—$technician_jobs_bonus_workforce_mult$: §G+1%§!（最大: §G+50%§!）\n$tt$—$miner_jobs_bonus_workforce_mult$: §G+1%§!（最大: §G+50%§!）\n$tt$—$farmer_jobs_bonus_workforce_mult$: §G+1%§!（最大: §G+50%§!）"
