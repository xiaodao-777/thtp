 leader_trait_libra_commander_admiral_destiny_b: "伪装大师"
 leader_trait_libra_commander_admiral_destiny_b_desc: "年久失修的设备，纪律涣散的人员，这是绝大多数人对这支舰队的第一印象。殊不知，平静的水面下暗藏玄机，这位指挥官早已布下天罗地网，静静地等待着猎物们如飞蛾扑火般自取灭亡。\n$libraf_lt_banner_11$"
 leader_trait_libra_commander_admiral_destiny_b_tt: "$t$—舰队未战斗时：\n$tt$—$MOD_SHIP_ACCURACY_MULT$: §R-25%§!\n$tt$—$MOD_SHIP_WEAPON_DAMAGE$: §R-50%§!\n$tt$—$MOD_SHIP_FIRE_RATE_MULT$: §R-50%§!"

 leader_trait_libra_commander_admiral_destiny_c: "虫群主宰"
 leader_trait_libra_commander_admiral_destiny_c_desc: "这位舰队司令的思维如同精密演算的战争节点，将浩瀚舰载机群编织为统一的毁灭风暴。其指挥下，每一架舰载机都是协同猎杀的利齿，使作战效能呈指数级跃升，令敌舰在遮天蔽日的饱和打击中化为宇宙尘埃。\n$libraf_lt_banner_11$"
 leader_trait_libra_commander_admiral_destiny_c_tt_1: "$t$—£navy_size£§Y$FLEET_SIZE_TITLE$§!达到§Y200§!时：\n$tt$—$MOD_STRIKE_CRAFT_ARMOR_MULT$: §G+100%§!\n$tt$—$MOD_STRIKE_CRAFT_SHIELD_MULT$: §G+100%§!"
 leader_trait_libra_commander_admiral_destiny_c_tt_2: "$t$—£navy_size£§Y$FLEET_SIZE_TITLE$§!达到§Y400§!时：\n$tt$—$mod_weapon_type_strike_craft_weapon_damage_mult$: §G+100%§!\n$tt$—$mod_weapon_type_strike_craft_weapon_fire_rate_mult$: §G+100%§!"

 leader_trait_libra_commander_admiral_destiny_d: "界域调谐者"
 leader_trait_libra_commander_admiral_destiny_d_desc: "这位战术大师指挥的舰队如活体金属般多变，从星云涡流到辐射风暴，无一不是[this.GetHeShe]作战规划中的巧妙棋子。\n$libraf_lt_banner_11$"
