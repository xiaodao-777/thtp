 leader_trait_libra_commander_admiral_authoritarian_desc: "这位舰队统帅就是帝国意志淬火的锋刃，以绝对威权统御钢铁洪流。其舰队疾行如帝国敕令划破深空，将至高统帅的战略意志化作碾碎叛逆的风暴席卷世界。\n$libraf_lt_banner_4$"
 leader_trait_libra_commander_admiral_authoritarian_tt: "$t$—§Y$councilor_defense$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$—$MOD_SHIP_FIRE_RATE_MULT$: §G+2%§!（最大: §G+60%§!）\n$tt$—$MOD_SHIP_WEAPON_DAMAGE$: §G+3%§!（最大: §G+90%§!）"
