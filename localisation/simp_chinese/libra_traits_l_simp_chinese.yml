 concept_libra_psionic_leader_traits: "灵媒领袖特质"
 concept_libra_psionic_leader_traits_desc: "来自§Y$trait_psionic$§!物种的领袖可以选择的特殊特质。"
#，较一般特质更为强大。其中老练特质需要由['tradition:tr_psionics_psionic_assimilation']传统解锁，一位领袖只能拥有一个。

# commander
 leader_trait_libra_psionic_aggressive: "连携打击"
 leader_trait_libra_psionic_aggressive_desc: "这位领袖可以运用灵能进行舰队间的即时通讯，从而有序地实施齐射打击。"
 leader_trait_libra_psionic_harding: "盾护增幅"
 leader_trait_libra_psionic_harding_desc: "借助灵能的力量，这位领袖指挥的舰队防护网被有效地强化了。"
 leader_trait_libra_psionic_engineer: "神佑"
 leader_trait_libra_psionic_engineer_desc: "这位领袖可以通过念力操纵进行一般船员做不到的修复工作。"
 leader_trait_libra_psionic_skirmisher: "闪瞬突袭"
 leader_trait_libra_psionic_skirmisher_desc: "投射灵能干扰探测信号，这位领袖总能发动神不知鬼不觉的奇袭。"
 leader_trait_libra_psionic_weakness_perception: "弱点感知"
 leader_trait_libra_psionic_weakness_perception_desc: "预判敌人的弱项兼具风险与收益，但对这位领袖来说并非难事。"
 leader_trait_libra_psionic_heavy_hitter: "边缘敲击"
 leader_trait_libra_psionic_heavy_hitter_desc: "这位领袖常常从敌方布阵的最弱处发起猛攻，一举突破敌军阵线。"
 leader_trait_libra_psionic_dreaded: "无畏"
 leader_trait_libra_psionic_dreaded_desc: "以灵能给予战士强韧的精神力量，使他们无惧于近接作战。"
 leader_trait_libra_psionic_hardy: "危机管控"
 leader_trait_libra_psionic_hardy_desc: "亚空间中微妙的灵能波动有时候也预示着现实的走向，捕捉这些信息可以避免不必要的风险。"
 leader_trait_libra_psionic_iron_fist: "督导"
 leader_trait_libra_psionic_iron_fist_desc: "这位领袖会用灵能监督劳工作业，确保他们没有任何懈怠之心。"
 leader_trait_libra_psionic_gale_speed: "神速"
 leader_trait_libra_psionic_gale_speed_desc: "契约的力量影响了这位领袖所在之处的每一个友方，使他们的行动异常迅捷。"
 leader_trait_libra_psionic_crew_trainer: "同调指挥"
 leader_trait_libra_psionic_crew_trainer_desc: "这位领袖精通指挥战略并将自己的知识通过心灵感应传达给了其他领袖。"
 leader_trait_libra_psionic_fortifier: "堡垒筑者"
 leader_trait_libra_psionic_fortifier_desc: "这位领袖能够建设强大的边境防御。"
 leader_trait_libra_psionic_armada_logistician: "军需统括"
 leader_trait_libra_psionic_armada_logistician_desc: "这位领袖能够实时调度物资，维持帝国舰队高效运转。"

 leader_trait_libra_psionic_energy_weapon_specialist: "能量集中"
 leader_trait_libra_psionic_energy_weapon_specialist_desc: "这位指挥官知道如何使舰队的炮击在短时间内连续命中不确定目标的特定位置，迅速过载其护甲并将之摧毁。"
 leader_trait_libra_psionic_kinetic_weapon_specialist: "迅猛直击"
 leader_trait_libra_psionic_kinetic_weapon_specialist_desc: "这位指挥官引导的射击精准且致命，总是能够在恰到好处的情况下撞击在敌舰防护网的某处。"
 leader_trait_libra_psionic_explosive_weapon_specialist: "精确制导"
 leader_trait_libra_psionic_explosive_weapon_specialist_desc: "在无声的太空战场上，没有什么能比遮天蔽日的导弹弹幕更加可怕，而更糟糕的是，这位指挥官发射的每一枚武器都直达要害。"
 leader_trait_libra_psionic_strike_craft_specialist: "蜂群战术"
