 libra_fairy.1650.name: "天命昭彰"
 libra_fairy.1650.desc: "星辰的排列悄然改变，银河的旋臂似乎也为此刻放缓了转动。在您登临星海帝位、执掌至高权柄的刹那，一种难以言喻的共鸣在帝国的每一个角落荡漾开来。\n\n星港的工程师们发现，往日繁复的维护流程忽然变得行云流水；行政世界的官僚们察觉，堆积如山的预算案竟能一目了然，冗余开支如阳光下的霜露般消弭；就连最偏远的矿站，其设备损耗也降至了前所未有的低点。\n\n天命已不再是一个概念，它已成为您帝国可观测、可感、可利用的客观事实。 星尘流转为您献上效率，能量奔涌为您节省毫厘。这不是节省，这是宇宙的贡奉；这不是统治，这是乾坤的归顺。"
 libra_fairy.1650.a: "登临我们的宝座。"
 r_libra_autarchy_seal: "天命帝玺"
 r_libra_autarchy_seal_desc: "以广疆为基，铸天宫之治；凡触星辰者，皆奉冠冕为尊。"
 libra_autarchy_seal_effect_tt: "§R这个遗珍对不符合条件的帝国没有任何效果§!"
 libra_autarchy_seal_active_effect: "每控制一个恒星系就获得£influence£§G2§! £trade£§G500§!"
 libra_autarchy_seal_modifier: "号令星海"
 libra_autarchy_seal_modifier_desc: "星域所及之处，皆为王土；权柄所映之物，皆化玉律。"

