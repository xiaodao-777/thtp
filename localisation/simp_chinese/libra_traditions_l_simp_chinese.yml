 tr_libra_magnificence_4_desc: "若拥有完全升级的§Y$tech_sentry_array$§!：\n$t$$MOD_SHIP_CLOAKING_DETECTION_ADD$: §G+1§!\n$t$$MOD_SPY_NETWORK_DAILY_VALUE_MULT$: §G+25%§!\n若拥有完全升级的§Y$tech_strategic_coordination$§!：\n$t$$MOD_COUNCILOR_SKILL_ADD$: §G+1§!\n$t$$MOD_SHIP_FIRE_RATE_MULT$: §G+25%§!\n若拥有完全升级的§Y$tech_mega_shipyard$§!：\n$t$$MOD_COUNTRY_SHIP_UPGRADE_COST_MULT$: §G-10%§!\n$t$$mod_shipclass_military_build_speed_mult$: §G+25%§!"
