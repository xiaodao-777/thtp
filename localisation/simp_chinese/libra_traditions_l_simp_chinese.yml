 tr_libra_vector_adopt: "扃钥传统"
 council_agenda_agenda_libra_vector_name: "超越光速"
 council_agenda_agenda_libra_vector_desc: "速度的上限只是前人留下的注释。而我们，将在这行注释上，覆写全新的定义。"
