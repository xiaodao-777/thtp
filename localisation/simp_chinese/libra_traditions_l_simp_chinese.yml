 edict_libra_vector_finish: "掌握空间"
 edict_libra_vector_finish_desc: "我们知晓星空的长度，并准备好随时加以利用。"
 tr_libra_vector_1: "路径优化协议"
 tr_libra_vector_1_delayed: "重新校定空间张力与发射坐标，将空间能量的每一次释放，都转化为可解析的航行数据流。"
