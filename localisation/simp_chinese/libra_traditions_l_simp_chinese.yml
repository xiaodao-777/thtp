 edict_libra_vector_1: "航道研究"
 edict_libra_vector_1_desc: "从中继器的能量逸散中捕捉时间与空间的影子，每一焦耳都点燃思想的火花。"
 tr_libra_vector_2: "规避协议解析"
 tr_libra_vector_2_delayed: "为所有航行载具预载风险矩阵，在概率的峭壁边缘，预先计算出最稳定的安全路径。"
