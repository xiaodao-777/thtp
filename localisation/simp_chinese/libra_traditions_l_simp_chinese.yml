 policy_libra_drudgery_tradition_d: "装卸职员"
 policy_libra_drudgery_tradition_d_desc: "无止境的重复劳动将会削减非自由民的意志。\n "
 policy_libra_drudgery_tradition_e: "异星玩物"
 policy_libra_drudgery_tradition_e_desc: "被剥夺尊严的家伙将会成为帝国公民的解压途径。\n "
 tr_libra_drudgery_4: "高压督管"
