 tradition_libra_autarchy: "霄宸"
 tradition_libra_autarchy_desc: "受命于天，既寿永昌。"
 tradition_libra_autarchy_adopt_desc: "$tradition_libra_autarchy_desc$$libraf_tr_banner_17$"
 tr_libra_autarchy_adopt: "霄宸传统"
 council_agenda_agenda_libra_autarchy_name: "天命攸归"
 council_agenda_agenda_libra_autarchy_desc: "天恩浩荡，泽被苍生，减其负累；帝业永昌，德润万物，省其耗费。"
 agenda_libra_autarchy_finish_modifier: "$council_agenda_agenda_libra_autarchy_name$议程"
 tr_libra_autarchy_finish: "霄宸传统已完成"
 tr_libra_autarchy_1: "观天鉴"
 tr_libra_autarchy_1_delayed: "高悬星垣之镜，遍照八荒灯塔，流光所及处，智慧自生。"
 tr_libra_autarchy_1_desc: "每点已使用的 £mod_country_starbase_capacity_add£ §Y$STARBASE_CAPACITY_TITLE$§!带来 £physics£§G45§! £society£§G45§! £engineering£§G45§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_1',$edict_libra_autarchy_1$]"
 tr_libra_autarchy_2: "镇寰宫"
 tr_libra_autarchy_2_delayed: "宫阙起于万疆之上，柱础深植兆民之土。\n疆理愈明，则殿堂愈辉，智术愈彰。"
 tr_libra_autarchy_2_desc: "每个 £district£ §Y区划§!带来 £physics£§G3§! £society£§G3§! £engineering£§G3§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_2',$edict_libra_autarchy_2$]"
 tr_libra_autarchy_3: "承天玺"
 tr_libra_autarchy_3_delayed: "执此玺者，掌星河命脉。\n星域流转，皆为贡赋；疆图所覆，膏腴自涌。"
 tr_libra_autarchy_3_desc: "每个控制下的 £system£ §Y恒星系§!带来 £energy£§G7§! £trade£§G5§! £alloys£§G3§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_3',$edict_libra_autarchy_3$]"
 tr_libra_autarchy_4: "定业鼎"
 tr_libra_autarchy_4_delayed: "九鼎定八方，列土献奇珍。\n凡王化所被之壤，幽矿秘藏，莫敢不献。"
 tr_libra_autarchy_4_desc: "每个拥有的 £planet£ §Y殖民地§!带来 £volatile_motes£§G5§! £exotic_gases£§G5§! £rare_crystals£§G5§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_4',$edict_libra_autarchy_4$]"
 tr_libra_autarchy_5: "人间主"
 tr_libra_autarchy_5_delayed: "苍生共主，以武卫道，以道启智。"
 tr_libra_autarchy_5_desc: "每点已使用的£mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!带来 £physics£§G0.50§! £society£§G0.50§! £engineering£§G0.50§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_5',$edict_libra_autarchy_5$]"
 edict_libra_autarchy_1: "天听广谕"
 edict_libra_autarchy_1_desc: "广布耳目于星海，聆听诸域之息。凡疆土未盈者，当使兆庶勤力，枢庭速断。"
 edict_libra_autarchy_2: "地仪敕令"
 edict_libra_autarchy_2_desc: "勘舆定籍，厘清疆理。凡版图初具者，当使才俊尽展，诸星政令通行。"
 edict_libra_autarchy_3: "寰宇图志"
 edict_libra_autarchy_3_desc: "总览周天星图，尽收寰宇奥秘。既为星海监护，或握半壁山河，当使格物之智，如泉奔涌。"
 edict_libra_autarchy_4: "四海报功"
 edict_libra_autarchy_4_desc: "威加四海，德被八荒。既摄监护之权，或掌半壁天枢，当使武备雄壮，百炼精金不绝。"
 edict_libra_autarchy_5: "天命所归"
 edict_libra_autarchy_5_desc: "履至尊，制六合。统御全宇之日，天命具象为形，大道玉玺，自此而现。"
 libra_autarchy_0_requires: "$TRIGGER_FAIL$控制至少§Y25§!个恒星系"
 libra_autarchy_1_requires: "$TRIGGER_FAIL$控制至少§Y50§!个恒星系"
