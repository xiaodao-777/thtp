 tradition_libra_bastion: "捍圉"
 tradition_libra_bastion_desc: "捐躯赴国难，视死忽如归！"
 tradition_libra_bastion_adopt_desc: "$tradition_libra_bastion_desc$$libraf_tr_banner_22$"
 tr_libra_bastion_adopt: "捍圉传统"
 council_agenda_agenda_libra_bastion_name: "天际之墙"
 council_agenda_agenda_libra_bastion_desc: "我们的边界，就是宇宙的尽头。"
 agenda_libra_bastion_finish_modifier: "$council_agenda_agenda_libra_bastion_name$议程"
 agenda_libra_bastion_finish_effect: "为拥有空余槽位的§Y$dsc_name$§!和§Y$orbital_ring_tier_1$§!创建至多§G3§!个§Y$military_station_small_plural$§!"
 tr_libra_bastion_finish: "捍圉传统已完成"
 tr_libra_bastion_1: "垒墙如山"
 tr_libra_bastion_1_delayed: "当危机来临，每一寸土地都将成为战场，每一座城市都将化为永不陷落的堡垒。"
 tr_libra_bastion_1_desc: "$libra_unlock_decisions_y$$decision_libra_bastion_1_a$"
 decision_libra_bastion_1_a: "应急防御"
 decision_libra_bastion_1_a_desc: "当警报响彻天际，大地必须学会长出獠牙。所有的土地都将被征召，成为抵抗的第一道防线。"
 decision_libra_bastion_1_b: "撤除临时工事"
 decision_libra_bastion_1_b_desc: "解除这个殖民地的危机应对工事。"
 d_libra_bastion_tradition: "壁垒防御工事"
 d_libra_bastion_tradition_desc: "这个殖民地的核心设施已被迁往防御网深处。"
 tr_libra_bastion_2: "故土之佑"
 tr_libra_bastion_2_delayed: "在故国的星光下，战舰承载着文明的重量；胜利之时，星辰亦会献上馈赠。"
 tr_libra_bastion_2_desc: "$libra_unlock_features_y$['concept_libra_warrior_reward']"
 concept_libra_warrior_reward: "勇士激励"
 concept_libra_warrior_reward_desc: "每隔§Y2§!年，赢得§Y本土太空战斗§!时获得§G3§!个月且不少于§Y1800§!的 £alloys£ §Y$alloys$§!和§G5§!个月且不少于§Y5000§!的 £trade£ §Y$trade$§!，并使§Y技能等级§!最低的$commander_with_icon$获得§G3600§!经验。"
 tr_libra_bastion_3: "铁铸边疆"
 tr_libra_bastion_3_delayed: "于虚空之中筑起不朽之门，每一座星堡皆是誓言的见证，令来犯者望而却步。"
 tr_libra_bastion_3_desc: "$libra_unlock_edicts_y$['edict:libra_bastion_1',$edict_libra_bastion_1$]"
 edict_libra_bastion_1: "寸土不让"
 edict_libra_bastion_1_desc: "我们在此庄严宣告：每一颗行星都将成为一座要塞。敌人若想染指我们的土地，就必须先为整片星空付出血的代价。"
 tr_libra_bastion_4: "灼尽余灰"
 tr_libra_bastion_4_delayed: "失去的土地仍在呼吸，它的每一次脉搏都在呼唤复仇。我们将用敌人的灭亡，为沦陷之日画上句号。"
 tr_libra_bastion_4_desc: "$libra_unlock_features_y$['concept_libra_reclaiming_homeland']\n$MOD_STARBASE_DEFENSIVE_WAR_SHIP_BUILD_SPEED_MULT$: §G+50%§!\n$mod_deep_space_citadel_limit_add$: §G+1§!"
 concept_libra_reclaiming_homeland: "国土夺还"
 concept_libra_reclaiming_homeland_desc: "£system£ §Y恒星系§!每次§Y陷落§!或§Y被夺§!后的§Y720§!天内获得§G+10%§! £mod_ship_weapon_damage£ §Y$MOD_SHIP_WEAPON_DAMAGE$§!和 £mod_ship_home_territory_fire_rate_mult£ §Y$MOD_SHIP_HOME_TERRITORY_FIRE_RATE_MULT$§!并降低§G-1%§!£mod_country_war_exhaustion_mult£ §Y$MOD_COUNTRY_WAR_EXHAUSTION_MULT$§!，独立计算$EMPIRE_EFFECTS_W_ICON$与£time£§Y持续时间§!，§Y360§!天内在同一 £system£ §Y恒星系§!只能触发一次。"
 tr_libra_bastion_5: "锚定永夜"
 tr_libra_bastion_5_delayed: "让防御平台如锚般沉入星海，让驻港的战舰成为永不落下的盾墙。边疆的安宁，始于我们的不懈。"

