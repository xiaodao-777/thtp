 decision_libra_cosmoplasty_3: "增建轨道设施"
 decision_libra_cosmoplasty_3_desc: "基于标准轨道建设协议，调集工程舰队于近地空间增筑拓展平台。"
 d_libra_liber_cosmoplasty_tradition: "轨道拓展坞"
 d_libra_liber_cosmoplasty_tradition_desc: "于人工星体外部署自适应拓展框架，其结构如活体组织般生长延伸。"
 tr_libra_cosmoplasty_4: "伟业丰碑"
 tr_libra_cosmoplasty_4_delayed: "功成之日，方为始章。"
 tr_libra_cosmoplasty_4_desc: "建成§Y$megastructures$§!后的§Y10§!年内：\n$t$每月 £alloys£ £consumer_goods£ £influence£ 产出: §G+15%§!\n$t$$MOD_STARBASE_BUILDING_BUILD_SPEED_MULT$: §G+75%§!"
