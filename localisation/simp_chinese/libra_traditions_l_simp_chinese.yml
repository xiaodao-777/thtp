 building_libra_cosmoplasty_complex: "轨道模块枢纽"
 building_libra_cosmoplasty_complex_desc: "轨道悬廊纵横交错，模块化舱室如蜂巢延伸。此枢纽将行星同步轨道转化为可无限扩展的建设平台，突破地表疆界之限。"
