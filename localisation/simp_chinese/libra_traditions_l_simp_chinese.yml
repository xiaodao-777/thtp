 tr_libra_havoc_adopt: "湮隳传统"
 council_agenda_agenda_libra_havoc_name: "终焉宣告"
 council_agenda_agenda_libra_havoc_desc: "战争从未改变，只是等待更完美的形式。\n当和平成为悼词，我们便是那唯一的动词。"
 agenda_libra_havoc_finish_modifier: "$council_agenda_agenda_libra_havoc_name$议程"
 agenda_libra_havoc_finish_effect: "议程生效期间启用§E$libra_mod_name$§!的所有§Y战争§!$EFFECTS_TXT$"
 tr_libra_havoc_finish: "湮隳传统已完成"
 tr_libra_havoc_finish_desc: "每个§Y净化§!或§Y轰炸§!的 £pop£ §Y$POP$§!带来£energy£§G2§! £trade£§G2§!"
 tr_libra_havoc_1: "蛰伏之形"
 tr_libra_havoc_1_delayed: "让大地忘记军队的重量，直到它需要记住鲜血的温度。"
 tr_libra_havoc_1_desc: "$libra_peace_effect$\n$t$$mod_armies_upkeep_mult$: §G-20%§!\n$libra_war_effect$\n$t$$MOD_ARMY_ATTACK_DAMAGE_MULT$: §G+50%§!\n$t$$MOD_ARMY_ATTACK_MORALE_MULT$: §G+50%§!\n$t$$MOD_ARMY_ATTACK_HEALTH_MULT$: §G+50%§!"
 tr_libra_havoc_2: "静默之海"
 tr_libra_havoc_2_delayed: "令星海习惯舰影的缺席，只为在它破碎时，能听见更清脆的声响。"
 tr_libra_havoc_2_desc: "$libra_peace_effect$\n$t$$mod_ships_upkeep_mult$: §G-20%§!\n$libra_war_effect$\n$t$$MOD_SHIP_ACCURACY_MULT$: §G+10%§!\n$t$$MOD_SHIP_TRACKING_MULT$: §G+10%§!\n$t$$MOD_SHIP_ORBITAL_BOMBARDMENT_MULT$: §G+50%§!"
 tr_libra_havoc_3: "锻炉之誓"
 tr_libra_havoc_3_delayed: "和平时期，我们的熔炉全速运转，将每一克金属都锻造成型；当战争来临，它们只为击碎护盾而轰鸣。"
 tr_libra_havoc_3_desc: "$libra_peace_effect$\n$t$$MOD_ARMY_BUILD_SPEED_MULT$: §G+50%§!\n$libra_war_effect$\n$t$$MOD_ARMY_BUILD_SPEED_MULT$: §G+25%§!\n$t$$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+10%§!"
 tr_libra_havoc_4: "铁血之约"
 tr_libra_havoc_4_delayed: "在虚空中筑起的每一座炮台，都是一个简单的承诺：你所倚仗的甲胄，将成为你最后的棺椁。"
 tr_libra_havoc_4_desc: "$libra_peace_effect$\n$t$$mod_shipclass_military_station_build_speed_mult$: §G+50%§!\n$libra_war_effect$\n$t$$mod_shipclass_military_station_build_speed_mult$: §G+25%§!\n$t$$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+10%§!"
 tr_libra_havoc_5: "终末之炉"
 tr_libra_havoc_5_delayed: "当最后一艘战舰离开船坞，建造本身便失去了意义。此后存在的唯一目的，是确保敌人的存在先于我们结束。"
 tr_libra_havoc_5_desc: "$libra_peace_effect$\n$t$$mod_shipclass_military_build_speed_mult$: §G+50%§!\n$libra_war_effect$\n$t$$mod_shipclass_military_build_speed_mult$: §G+25%§!\n$t$$MOD_SHIP_HULL_DAMAGE_MULT$: §G+15%§!"

