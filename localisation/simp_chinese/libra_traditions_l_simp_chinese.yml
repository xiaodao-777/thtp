 tradition_libra_suzerainty: "统驭"
 tradition_libra_suzerainty_desc: "百蛮奉遐赆，万国朝未央。"
 tradition_libra_suzerainty_adopt_desc: "$tradition_libra_suzerainty_desc$$libraf_tr_banner_23$"
 tr_libra_suzerainty_adopt: "统驭传统"
 council_agenda_agenda_libra_suzerainty_name: "天下共主"
 council_agenda_agenda_libra_suzerainty_desc: "九天阊阖开宫殿，万国衣冠拜冕旒。"
 agenda_libra_suzerainty_finish_modifier: "$council_agenda_agenda_libra_suzerainty_name$议程"
 agenda_libra_suzerainty_finish_effect: "£loyalty£ §Y$LOYALTY$§!达到§Y50§!的附庸获得§G12§!个月的 £energy£ £minerals£ £food£ £alloys£ £consumer_goods£ £trade£ 产出\n£loyalty£ §Y$LOYALTY$§!为§Y100§!的附庸则获得§G24§!个月的 £alloys£ £consumer_goods£ £trade£ £physics£ £society£ £engineering£ 产出"
 libra_fairy.1691.name: "宗主的赏赐"
 libra_fairy.1691.desc: "我们的宗主国，§Y[From.GetName]§!对我们的忠诚十分赞赏。他们派出的一支庞大的运输船队，其中满载允诺给我们的先进工业品和科技成果，已经在[Capital.GetName]登陆。"
 libra_fairy.1691.a: "感激地收下礼物。"
 libra_fairy.1691.b: "为宗主准备回礼。"
 libra_fairy.1692.name: "宗主的支援"
 libra_fairy.1692.desc: "我们的宗主国，§Y[From.GetName]§!赞扬了我们的忠诚。作为表彰，他们派出了一支运输船队，其中满载各色物资，以期促进我们的发展——和我们未来的效忠。"
 libra_fairy.1692.a: "接受馈赠。"
 libra_fairy.1692.b: "向宗主表示感谢。"
 libra_fairy.1693.name: "附庸的回礼"
 libra_fairy.1693.desc: "§Y[From.GetName]§!在收到我们的赏赐后非常感激，他们专门组建了一支使团来向我们表示感恩，并许诺在之后的时间里也会作为我们忠实的属下而服务。我们的使馆已经接待了他们，预计这一行动将在外交领域为我们带来正面影响。"
 libra_fairy.1693.a: "接纳忠诚。"
 tr_libra_suzerainty_finish: "统驭传统已完成"
 tr_libra_suzerainty_1: "归流"
 tr_libra_suzerainty_1_delayed: "收其地，纳其民，移其丁壮以实我仓廪。\n藩属之土，亦为王之蓄库。"
 tr_libra_suzerainty_1_desc: "$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_1$"
 tr_libra_suzerainty_2: "慑远"
 tr_libra_suzerainty_2_delayed: "使其舟船隶我旌旗，使其港戍为我前哨。\n外藩之甲，亦为王之爪牙。"
 tr_libra_suzerainty_2_desc: "$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_2$"
 tr_libra_suzerainty_3: "怀柔"
 tr_libra_suzerainty_3_delayed: "广厦之荫，不遗片瓦；王者之信，不弃远人。"
 tr_libra_suzerainty_4: "分策"
 tr_libra_suzerainty_4_delayed: "蕞尔小国，仰我鼻息；我以智术润其枯槁，彼以敬顺报我恩养。"
 tr_libra_suzerainty_4_desc: "每有一个§Y保护国§!：\n$t$$MOD_COUNCIL_AGENDA_FINISHING_EFFECT_DURATION_MULT$: §G+5%§!（最大: §G+25%§!）\n$t$$MOD_COUNTRY_EXTERNAL_LEADER_POOL_SIZE$: §G+1§!（最大: §G+5§!）\n$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_3$"
 tr_libra_suzerainty_5: "资贡"
 tr_libra_suzerainty_5_delayed: "万国来朝，货殖流通；我以膏腴泽其贫瘠，彼以诚悃奉我天国。"
 tr_libra_suzerainty_5_desc: "每有一个§Y附属国§!：\n$t$$MOD_EMPIRE_SIZE_ADD$: §Y-10§!（最大: §Y-100§!）\n$t$$mod_country_traditions_influence_produces_add$: §G+0.20§!（最大: §G+2§!）\n$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_4$"
 trade_action_libra_suzerainty_1: "征取劳力"
 trade_action_libra_suzerainty_1_desc: "发彼丁壮，以实我疆。藩属之民，亦王之赤子；移之役之，皆奉天命。"
 trade_action_libra_suzerainty_1_effect: "将 £pop£ §Y$POP$§!总数的§Y10%§!移交给§Y[From.GetName]§!"
 trade_action_libra_suzerainty_1_modifier: "$trade_action_libra_suzerainty_1$"
 trade_action_libra_suzerainty_1_modifier_desc: " "
 trade_action_libra_suzerainty_2: "租赁军港"
 trade_action_libra_suzerainty_2_desc: "借其港坞，驻我艨艟。藩属之地，亦王之戍垒；驻之守之，共卫山河。"
 trade_action_libra_suzerainty_2_effect: " "
 trade_action_libra_suzerainty_2_modifier: "$trade_action_libra_suzerainty_2$"
 trade_action_libra_suzerainty_2_modifier_desc: "我们将一部分军事基地的使用权转交给了宗主。"
 trade_action_libra_suzerainty_3: "科技支援"
 trade_action_libra_suzerainty_3_desc: "授以机巧，启其蒙昧。藩属之智，亦王之藏；教之化之，同登文明。"
 trade_action_libra_suzerainty_3_effect: " "
 trade_action_libra_suzerainty_3_modifier: "$trade_action_libra_suzerainty_3$"
 trade_action_libra_suzerainty_3_modifier_desc: "宗主国指派了专家团队来确保我们的科技进步。"
 trade_action_libra_suzerainty_4: "经济支援"
 trade_action_libra_suzerainty_4_desc: "输以粟帛，通其货殖。藩属之富，亦王之库；予之济之，共享太平。"
 trade_action_libra_suzerainty_4_effect: " "
 trade_action_libra_suzerainty_4_modifier: "$trade_action_libra_suzerainty_4$"
 trade_action_libra_suzerainty_4_modifier_desc: "宗主国为我们提供了他们的生产洞见。"