 libra_adventure_decision_modifier_desc: "探险的热潮结束了，但我们可以趁着这个机会安排很多事情。"
 tr_libra_adventure_1: "异星绘景"
 tr_libra_adventure_1_delayed: "在过去，先辈们无数次幻想着星河的彼岸。\n现在，昔日的幻影触手可及。"
 tr_libra_adventure_1_desc: "新殖民地完成时：\n$t$§Y$SECTOR_GOVERNOR_TITLE$§!获得§G120§!经验\n$t$§Y所有$official_with_icon$§!获得§G120§!经验"
 tr_libra_adventure_2: "星空云图"
 tr_libra_adventure_2_delayed: "看见夜空星罗棋布的光点了吗？\n那是我们即将到达的地方。"
 tr_libra_adventure_2_desc: "首次造访恒星系时：\n$t$§Y舰船§! £leader£ §Y领袖§!获得§G240§!经验\n$t$获得§G0.5§!个月的 £physics£ £society£ £engineering£ §Y研究点数§!"
 tr_libra_adventure_3: "藏宝库"
 tr_libra_adventure_3_delayed: "可知珍宝的价值？\n我们的战利品仓库已经准备好了。"
 tr_libra_adventure_4: "支援舰队"
 tr_libra_adventure_4_delayed: "我们的冒险行动离不开完备的后勤。"
 tr_libra_adventure_5: "激进实验"
 tr_libra_adventure_5_delayed: "有什么是不可以利用的吗？\n试试才知道。"
 libra_adventure_aesthetic_wonders_1: "镶钻工艺品"
 libra_adventure_aesthetic_wonders_1_desc_short: "古代钻石工艺品"
 libra_adventure_aesthetic_wonders_1_desc_details: "这枚珠宝的作用成谜，它可能是吊坠的一部分，也可能是戒指或项链上的一环。无论如何，这件物品将一种新颖的艺术形式带入了我们的帝国。"
 libra_adventure_aesthetic_wonders_2: "符文罗盘"
 libra_adventure_aesthetic_wonders_2_desc_short: "刻满符文的罗盘"
 libra_adventure_aesthetic_wonders_2_desc_details: "这个罗盘上刻满了异星文字，用途却不得而知。至少，它的外观看起来相当华丽。"
 libra_adventure_aesthetic_wonders_3: "装饰画框"
 libra_adventure_aesthetic_wonders_3_desc_short: "镶嵌红宝石的相框"
 libra_adventure_aesthetic_wonders_3_desc_details: "这个由低纯度合金构成的金属框上镶嵌了大量红宝石，颇具古典美感。"
 libra_adventure_aesthetic_wonders_4: "玻璃摆件"
 libra_adventure_aesthetic_wonders_4_desc_short: "琥珀一样的玻璃艺术品"
 libra_adventure_aesthetic_wonders_4_desc_details: "一个微缩的小型盆景被封在这个玻璃球中。"
 libra_adventure_aesthetic_wonders_5: "微缩水晶宫"
 libra_adventure_aesthetic_wonders_5_desc_short: "以微雕工艺制作的超小艺术品"
 libra_adventure_aesthetic_wonders_5_desc_details: "谁能相信，这座富丽堂皇的水晶宫殿居然是雕刻在一枚不足1厘米长的矿物结晶上的，肉眼很难看清它的全貌。"
 libra_adventure_aesthetic_wonders_6: "神秘徽章"
 libra_adventure_aesthetic_wonders_6_desc_short: "由黄金和蓝宝石制作的徽章"
 libra_adventure_aesthetic_wonders_6_desc_details: "华丽、价值不菲，它的仿制品足以在帝国中掀起一阵探宝热潮。"
 libra_adventure_aesthetic_wonders_7: "闪光之盾"
 libra_adventure_aesthetic_wonders_7_desc_short: "仪式性盾牌"
 libra_adventure_aesthetic_wonders_7_desc_details: "某个古代帝国用于皇家仪式的盾牌，代表了当时冶金技术的最高水平。"
 libra_adventure_aesthetic_wonders_8: "水晶王冠"
 libra_adventure_aesthetic_wonders_8_desc_short: "中空的水晶工艺品"
 libra_adventure_aesthetic_wonders_8_desc_details: "据传，掌握这顶王冠，也就掌握了终极的财富。"
 libra_adventure_aesthetic_wonders_9: "岩石花"
 libra_adventure_aesthetic_wonders_9_desc_short: "一整块天然岩石雕刻出的花朵"
 libra_adventure_aesthetic_wonders_9_desc_details: "没有经过任何切割和拼装，这朵华丽的花朵是由巧匠从岩石中取出来的。"
 libra_adventure_aesthetic_wonders_10: "米娅之心"
 libra_adventure_aesthetic_wonders_10_desc_short: "来自星界的珍宝"
 libra_adventure_aesthetic_wonders_10_desc_details: "属于“执行者米娅”的配饰，内部存在着高强度的能量团块。它神秘的能量影响并增强着我们整个帝国。"
 libra_adventure_historical_items_1: "古代量子处理器"
 libra_adventure_historical_items_1_desc_short: "用途未知的古代芯片组"
 libra_adventure_historical_items_1_desc_details: "某个古代机械帝国留下的处理终端，用途不明，有一定的研究价值。"
 libra_adventure_historical_items_2: "晶体悬浮灯"
 libra_adventure_historical_items_2_desc_short: "水晶构成的浮空路灯"
 libra_adventure_historical_items_2_desc_details: "在遥远的过去，利用了这种“浮空水晶灯”技术的路灯曾是某个帝国街头最常见的风景。"
 libra_adventure_historical_items_3: "远古提灯"
 libra_adventure_historical_items_3_desc_short: "中古时代手工业品"
 libra_adventure_historical_items_3_desc_details: "匠心独具的提灯，以纸张和竹签为主要材料的物品能保存到现在实属不易。"
 libra_adventure_historical_items_4: "华丽工艺品"
 libra_adventure_historical_items_4_desc_short: "大型中世纪艺术品"
 libra_adventure_historical_items_4_desc_details: "由黄金、钻石、玻璃、水晶等一系列奢华材料制成的豪华摆饰，制作它的匠师的审美水平时至今日也算是相当超前的。"
 libra_adventure_historical_items_5: "岩石机械"
 libra_adventure_historical_items_5_desc_short: "岩石结构的机械钟表"
 libra_adventure_historical_items_5_desc_details: "由萤石等多种多样的石材复合而成的机械时钟，似乎已经不间断运转了上万年，却丝毫没有磨损的痕迹。"
 libra_adventure_historical_items_6: "远古能量发射器"
 libra_adventure_historical_items_6_desc_short: "先史帝国生产的小型能量武器"
 libra_adventure_historical_items_6_desc_details: "由某个超古代帝国制造的先进单兵武器，它充能后全力一击的威力甚至超过了小型伽马激光炮台。"
 libra_adventure_historical_items_7: "远古冷兵器"
 libra_adventure_historical_items_7_desc_short: "不曾折断的利剑"
 libra_adventure_historical_items_7_desc_details: "各个文明的历史传说真真假假，很难考证。不过，这确实是一把削铁如泥的利剑。"
 libra_adventure_historical_items_8: "机械怀表"
 libra_adventure_historical_items_8_desc_short: "含有泽珞尘的机械表"
 libra_adventure_historical_items_8_desc_details: "并非加速了周围的时间，只要处在这个怀表附近的个体都会无意识地提升行动速度。很明显，这是灵能波扰动所致。"
 libra_adventure_historical_items_9: "晶尘战旗"
 libra_adventure_historical_items_9_desc_short: "幽蓝的旗帜"
 libra_adventure_historical_items_9_desc_details: "一面仿佛要将灵魂吸入其中的旗帜，我们无法预测，也不可能知道过去有多少实体倒在这深蓝的恐怖之下。"
 libra_adventure_historical_items_10: "金红宝藏"
 libra_adventure_historical_items_10_desc_short: "有名无实的宝藏"
 libra_adventure_historical_items_10_desc_details: "据传，异界曾有一个空前绝后的大帝国，而这个宝藏是它覆灭之际留下的唯一遗产，得到这份宝藏的人将能够取得无形的启示。在我们看来，它只是一个装饰过的空箱子而已。"
 libra_adventure_xeno_geology_1: "稀土晶簇"
 libra_adventure_xeno_geology_1_desc_short: "罕见的天然矿物结晶"
 libra_adventure_xeno_geology_1_desc_details: "这株奇异的晶簇由探险队员所发现，其中包含了几乎所有可以在元素周期表上可以找到的稀有金属。多种元素汇集于同一种矿物的奇异现象，长久以来都被认为是不可能的事情。"
 libra_adventure_xeno_geology_2: "结晶之树"
 libra_adventure_xeno_geology_2_desc_short: "汇集灵能的水晶树"
 libra_adventure_xeno_geology_2_desc_details: "这是一棵由硅质构成的水晶树苗，它与石质生物颇为相似。可能是原始生长环境富含灵素的原因，它的代谢过程中正不断地吸收汇聚周边环境中的泽珞粒子。"
 libra_adventure_xeno_geology_3: "彩虹花"
 libra_adventure_xeno_geology_3_desc_short: "五颜六色的不败之花"
 libra_adventure_xeno_geology_3_desc_details: "来自异星植株的花朵，由于其特殊的组织结构，在被摘下的瞬间就会迅速木质化，变成艳丽但易碎的艺术品。"
 libra_adventure_xeno_geology_4: "异星奇花"
 libra_adventure_xeno_geology_4_desc_short: "分泌特殊激素的花丛"
 libra_adventure_xeno_geology_4_desc_details: "这种异星植被的花束能够产生一种催情激素，使闻到它的生物进入精力过剩的状态。"
 libra_adventure_xeno_geology_5: "活体金属盆栽"
 libra_adventure_xeno_geology_5_desc_short: "由活体金属构成的植物"
 libra_adventure_xeno_geology_5_desc_details: "这些活体金属自发生长成了天然植被的样子，只要能量供应充足，其生长就不会停止。然而，它并不是任何意义上的生命，这种奇异现象也难以复刻。"
 libra_adventure_xeno_geology_6: "晶矿王冠"
 libra_adventure_xeno_geology_6_desc_short: "冠状天然矿石"
 libra_adventure_xeno_geology_6_desc_details: "凝聚成完美的皇冠形状的水晶矿石，即使将它与巧匠的作品拿来对比也毫不逊色。"
 libra_adventure_xeno_geology_7: "雪花合金"
 libra_adventure_xeno_geology_7_desc_short: "雪花形状的合金矿物"
 libra_adventure_xeno_geology_7_desc_details: "少见的合金矿物，虽然成因可以推断，但推导这一结论的思维过程着实有趣。"
 libra_adventure_xeno_geology_8: "异界花"
 libra_adventure_xeno_geology_8_desc_short: "不属于这个世界的花朵"
 libra_adventure_xeno_geology_8_desc_details: "这朵花完全不符合这个世界的法则，它不依附于任何事物，孤零零的漂浮在半空之中，捕捞它花费了好一番精力。可能的解释只有一种：它是自星界漂泊而来的异界生物。"
 libra_adventure_xeno_geology_9: "粘性意识体"
 libra_adventure_xeno_geology_9_desc_short: "奇幻生命体"
 libra_adventure_xeno_geology_9_desc_details: "如果说幻想世界里的生物来到现实会是什么样，这个奇妙的生物就是答案之一。它看起来与我们熟知的单细胞生物颇为相似，却不具备类似的结构，并具有相当程度的智力。"
 libra_adventure_xeno_geology_10: "天然灵质盾"
 libra_adventure_xeno_geology_10_desc_short: "自然形成的灵质盾牌"
 libra_adventure_xeno_geology_10_desc_details: "具有灵能的事物往往也附着着某种概念，而在这里，它的意思是“守护”。虚境的力量深不可测，从这里我们可以窥见其中微妙的一角。"

