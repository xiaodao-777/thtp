#

 civic_libra_machine_dark_consortium: "阴影模拟器"
 civic_libra_machine_dark_consortium_desc: "遵循着探求无尽能源的原始指令，这个机械智能踏上了寻找终极能量源的道路。而最终，他们的模拟结果指向了星际间似有却无的暗物质。\n$libra_gac_banner_7$"
 civic_tooltip_libra_machine_dark_consortium: "—$libra_edict$['edict:libra_machine_dark_consortium',$edict_libra_machine_dark_consortium$]\n—$libra_agenda$§Y$council_agenda_agenda_libra_machine_dark_consortium_name$§!\n—$libra_ruler_trait$['concept_leader_trait_libra_machine_dark_consortium']\n—$ADDITONAL_TECHNOLOGIES_STRING$ £physics£ ['technology:tech_mine_dark_matter']"
 edict_libra_machine_dark_consortium: "启动湮灭引擎"
 edict_libra_machine_dark_consortium_desc: "启动对称湮灭引擎，为整个机械智能带来无尽的能量。"
 council_agenda_agenda_libra_machine_dark_consortium_name: "$council_agenda_agenda_dark_matter_breakthrough_name$"
 council_agenda_agenda_libra_machine_dark_consortium_desc: "$council_agenda_agenda_dark_matter_breakthrough_desc$"
 leader_trait_libra_machine_dark_consortium: "帷幕主机"
 leader_trait_libra_machine_dark_consortium_desc: "监督机械智能提取暗物质的核心程序。"
 concept_leader_trait_libra_machine_dark_consortium: "$leader_trait_libra_machine_dark_consortium$"
 concept_leader_trait_libra_machine_dark_consortium_desc: "$libra_paragon_default_councilor_trait$\n\n$EMPIRE_EFFECTS_TXT$：\n$t$—$mod_planet_jobs_produces_mult$: §G+1%§!\n$t$—$mod_planet_buildings_produces_mult$: §G+2%§!\n$t$—£job_calculator£$job_calculator_plural$产出的£sr_dark_matter£$sr_dark_matter$: §G+0.03§!\n$leader_trait_libra_skill_effect_tt$\n\n§L$leader_trait_libra_machine_dark_consortium_desc$§!"

# Monster Hunter

 civic_libra_monster_hunter: "地城勇士"
 civic_libra_monster_hunter_desc: "这个文明一度深掘地下，试图寻找未知先驱遗留的宝藏，但最终一无所获，直到太空航行走进现实之后，他们才知道自己找错了方向。如今他们众志成城，齐心在天穹之上发掘最初的梦想。\n$libra_gac_banner_3$"
 civic_tooltip_libra_monster_hunter: "—$STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter']\n—$libra_decision$\n$t$—能够在拥有特定§Y行星特征§!的殖民地上实施§Y特殊决议§!\n$t$—§Y$decision_libra_monster_hunter$§!，使 £building£ ['building:building_libra_monster_hunter']提供额外的['concept_libra_adventurer_jobs']\n—$ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n—$libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]"
 councilor_libra_monster_hunter: "金牌探险家"
 councilor_libra_monster_hunter_female: "$councilor_libra_monster_hunter$"
 councilor_libra_monster_hunter_desc: "$TITLE$统领探险事务。"
 councilor_libra_monster_hunter_custom_modifier_desc: "—$job_libra_adventurer_with_icon$产出的£consumer_goods£$consumer_goods$: §G+0.40§!\n—$job_libra_gem_artisan_with_icon$产出的£unity£$unity$: §G+0.40§!\n—$job_libra_waste_recycler_with_icon$产出的£alloys£$alloys$: §G+0.20§!\n—$job_libra_guild_clerk_with_icon$产出的£energy£$energy$: §G+1.20§!"
 building_libra_monster_hunter: "冒险事务部"
 building_libra_monster_hunter_desc: "规划和管理帝国冒险事业的地方。"
 sm_libra_monster_hunter_hub: "探险营地"
 sm_libra_monster_hunter_hub_desc: "一处高度专业化的勤务营地，帝国最精锐的冒险者在这里休整，而新一代探索者也从这里开始实习。\n"

 civic_libra_corporate_monster_hunter: "探险公会"
 civic_libra_corporate_monster_hunter_desc: "当过去的狂想同现实的目标结合，冒险精神便成为了这个企业中最为显眼的文化，他们船坞中大大小小的无数舰船，均只为这至高的目标而建造。\n$libra_gac_banner_4$"
 civic_tooltip_libra_corporate_monster_hunter: "—$STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter']\n—$BRANCH_OFFICE_BUILDINGS$： £building£ ['building:building_libra_monster_hunter_office']\n—$libra_decision$\n$t$—能够在拥有特定§Y行星特征§!的殖民地上实施§Y特殊决议§!\n$t$—§Y$decision_libra_monster_hunter$§!，使 £building£ ['building:building_libra_monster_hunter']提供额外的['concept_libra_adventurer_jobs']\n—$ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n—$libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]"
 councilor_libra_corporate_monster_hunter: "首席公会长"
 councilor_libra_corporate_monster_hunter_female: "$councilor_libra_corporate_monster_hunter$"
 councilor_libra_corporate_monster_hunter_desc: "$TITLE$监督商业化探险活动的正常运作。"
 councilor_libra_corporate_monster_hunter_custom_modifier_desc: "—$job_libra_treasure_merchant_with_icon$产出的£trade_value£$TRADE_VALUE$: §G+1.20§!\n—$job_libra_adventurer_with_icon$产出的£trade_value£$TRADE_VALUE$: §G+0.60§!\n—$job_libra_gem_artisan_with_icon$产出的£energy£$energy$: §G+0.80§!\n—$job_libra_waste_recycler_with_icon$产出的£minerals£$minerals$: §G+0.60§!"
 building_libra_monster_hunter_office: "探险体验园"
 building_libra_monster_hunter_office_desc: "想知道无数光年外的冒险者们是怎么活动的吗？这座运用了最新虚拟现实技术的设施可以给你完美答案。"

 civic_libra_hive_monster_hunter: "怪物猎手"
 civic_libra_hive_monster_hunter_desc: "星空对这个蜂巢思维来说，预示着风险与未知，也是刺激突触的最好兴奋剂。\n$libra_gac_banner_5$"
 civic_tooltip_libra_hive_monster_hunter: "—$STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter_hive']\n—$libra_decision$\n$t$—能够在拥有特定§Y行星特征§!的殖民地上实施§Y特殊决议§!\n$t$—§Y$decision_libra_monster_hunter$§!，使 £building£ ['building:building_libra_monster_hunter_hive']提供额外的['concept_libra_adventurer_jobs']\n—$ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n—$libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]"
 building_libra_monster_hunter_hive: "猎手巢穴"
 building_libra_monster_hunter_hive_desc: "所有猎手都会在这座巢穴里进行休整，以便进行下一次狩猎。"

 civic_libra_machine_monster_hunter: "魔兽图鉴"
 civic_libra_machine_monster_hunter_desc: "一切的开端始于原创造者充实数据库的目标，在探求新世界的方面，这个机械智能不计代价，且不择手段，无论过去了多久，编目所有实体都是他们的核心进程之一。\n$libra_gac_banner_6$"
 civic_tooltip_libra_machine_monster_hunter: "—$STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter_machine']\n—$libra_decision$\n$t$—能够在拥有特定§Y行星特征§!的殖民地上实施§Y特殊决议§!\n$t$—§Y$decision_libra_monster_hunter$§!，使 £building£ ['building:building_libra_monster_hunter_machine']提供额外的['concept_libra_adventurer_jobs']\n—$ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n—$libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]\n—§Y$councilor_gestalt_cognitive$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!追加$EMPIRE_EFFECTS_W_ICON$：\n$t$—$job_libra_treasure_unit_with_icon$产出的 £physics£ £society£ £engineering£ 研究点数: §G+0.20§!\n—§Y$councilor_gestalt_legion$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!追加$EMPIRE_EFFECTS_W_ICON$：\n$t$—$job_libra_adventurer_unit_with_icon$产出的£alloys£$alloys$: §G+0.20§!\n—§Y$councilor_gestalt_growth$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!追加$EMPIRE_EFFECTS_W_ICON$：\n$t$—$job_libra_gem_unit_with_icon$产出的£unity£$unity$: §G+0.20§!"
 building_libra_monster_hunter_machine: "编目数据库"
 building_libra_monster_hunter_machine_desc: "机械智能将收集到的异星数据汇总于此。"

 decision_libra_monster_hunter: "开发探险资源"
 decision_libra_monster_hunter_desc: "寻宝时间到，我们将跨越一切障碍，在这个星球上发现独有的宝藏。"
 libra_gestalt_origin.5000.name: "探险报告"
 libra_gestalt_origin.5000.desc: "在§Y[From.GetName]§!的探险调查已经完成。\n\n"
 libra_gestalt_origin.5000.desc.a: "$libra_gestalt_origin.5000.desc$根据报告，这里拥有§Y标准§!程度的探险资源可以利用，我们应当如何安排职位？"
 libra_gestalt_origin.5000.desc.b: "$libra_gestalt_origin.5000.desc$根据报告，这里拥有§Y较多§!程度的探险资源可以利用。"
 libra_gestalt_origin.5000.desc.c: "$libra_gestalt_origin.5000.desc$根据报告，这里拥有§Y大量§!的探险资源可以利用，可以带来相当的直接收益。"
 libra_gestalt_origin.5000.a: "部署冒险人员。"
 libra_gestalt_origin.5000.a.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§!提供额外的§Y[GetLibraAdventurerWithIcon]§!岗位"
 libra_gestalt_origin.5000.b: "安排材料加工。"
 libra_gestalt_origin.5000.b.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§!提供额外的§Y[GetLibraGemArtisanWithIcon]§!岗位"
 libra_gestalt_origin.5000.c: "回收可用遗存。"
 libra_gestalt_origin.5000.c.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§!提供额外的§Y[GetLibraWasteRcyclerWithIcon]§!岗位"
 libra_gestalt_origin.5001.name: "探险报告：§Y[Root.GetName]§!"
 libra_gestalt_origin.5001.desc: "在攻占这个星球后，我们的分析单位找到了一些没有受到破坏的探险资源，要如何利用它们？"
 libra_gestalt_origin.5002.name: "探险报告：§Y[Root.GetName]§!"
 libra_gestalt_origin.5002.desc: "在发展这个星球殖民地的过程中，我们的分析单位发现了一些或许可以利用的探险资源，要如何分配它们？"
 libra_gestalt_origin.5002.a.tt: "£building£ §Y[Owner.GetLibraMonsterHunterBuilding]§!提供额外的§Y[Owner.GetLibraAdventurerWithIcon]§!岗位"
 libra_gestalt_origin.5002.b.tt: "£building£ §Y[Owner.GetLibraMonsterHunterBuilding]§!提供额外的§Y[Owner.GetLibraGemArtisanWithIcon]§!岗位"
 libra_gestalt_origin.5002.c.tt: "£building£ §Y[Owner.GetLibraMonsterHunterBuilding]§!提供额外的§Y[Owner.GetLibraWasteRcyclerWithIcon]§!岗位"
 libra_gestalt_origin.5003.name: "探险升级"
 libra_gestalt_origin.5003.desc: "随着探险事业的进行，[Root.GetName]已经累积了足够程度的经验，可以考虑着将我们的事业拓展向更大的领域。\n\n现在，是时候安排新的人手了。"
 libra_gestalt_origin.5003.a: "保护好我们的成果。"
 libra_gestalt_origin.5003.a.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§!提供额外的§Y[GetLibraTreasureKeeperWithIcon]§!岗位"
 libra_gestalt_origin.5003.b: "准备更好的后勤支持。"
 libra_gestalt_origin.5003.b.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§!提供额外的§Y[GetLibraGuildSupporterWithIcon]§!岗位"

 libra_monster_hunter_reward_unity_tooltip: "获得§G1§!个月的 £unity£ §Y$unity$§!"
 decision_libra_mhpf_0: "介入合唱"
 decision_libra_mhpf_0_desc: "干涉这个星球上的灵能合唱，看看会发生什么。"
 libra_planet_feature_modifier_0_a: "太虚交响乐"
 libra_planet_feature_modifier_0_a_desc: "虚境祝福了这个星球，所有人都获得了莫大的增益。"
 libra_planet_feature_modifier_0_b: "太虚变奏"
 libra_planet_feature_modifier_0_b_desc: "虚境于这个星球上存在的接口深不可测，只有真正的灵能者能够领悟。"
 libra_planet_feature_modifier_0_c: "太虚诅咒"
 libra_planet_feature_modifier_0_c_desc: "干涉合唱的行为惹恼了背后的灵体，这个星球被诅咒了。"
 decision_libra_mhpf_1: "模仿伴奏"
 decision_libra_mhpf_1_desc: "为这个星球上的合唱播放一曲伴奏，也许会使情况有所改变。"
 libra_planet_feature_modifier_1_a: "稳定之歌"
 libra_planet_feature_modifier_1_a_desc: "这是一颗回荡着沉稳乐曲的星球。"
 libra_planet_feature_modifier_1_b: "奋进之歌"
 libra_planet_feature_modifier_1_b_desc: "这个星球上回响者激人奋进的神秘乐曲。"
 libra_planet_feature_modifier_1_c: "高昂之歌"
 libra_planet_feature_modifier_1_c_desc: "灵能在这个星球上以一种高昂的方式汇集。"
 decision_libra_mhpf_2: "培育异星植被"
 decision_libra_mhpf_2_desc: "我们或许有办法让这个星球上的华丽植被长得更好。"
 libra_planet_feature_modifier_2_a: "绽放的花园世界"
 libra_planet_feature_modifier_2_a_desc: "$libra_planet_feature_modifier_2_desc$"
 libra_planet_feature_modifier_2_b: "拥挤的花园世界"
 libra_planet_feature_modifier_2_b_desc: "虽然更加华丽，但过度生长的顽强变异植被挤占了这个星球上的部分空间。"
 decision_libra_mhpf_3: "拓展定居点"
 decision_libra_mhpf_3_desc: "修饰这里的自然区域。"
 libra_planet_feature_modifier_3_a: "拓展的定居点"
 libra_planet_feature_modifier_3_a_desc: "这个星球上的天然定居点被人为拓宽了。"
 libra_planet_feature_modifier_3_b: "完美的定居点"
 libra_planet_feature_modifier_3_b_desc: "这是一片完美的居住区，由自然和人力共同打造。"
 decision_libra_mhpf_4: "深掘地域潜力"
 decision_libra_mhpf_4_desc: "我们应该能拓展这个行星上的自然地基。"
 libra_planet_feature_modifier_4_a: "良好基础设施"
 libra_planet_feature_modifier_4_a_desc: "这个星球拥有一流的基础设施。"
 libra_planet_feature_modifier_4_b: "区域生态冲击"
 libra_planet_feature_modifier_4_b_desc: "拓展建筑用地的代价是把这个星球变得不那么宜居了。"
 decision_libra_mhpf_5: "投放激素"
 decision_libra_mhpf_5_desc: "这个星球上的催情环境也许比我们想象的容易干涉。"
 libra_planet_feature_modifier_5_a: "神经兴奋剂"
 libra_planet_feature_modifier_5_a_desc: "投放的激素在这个星球上的环境中起到了意外的作用，有机物种的活动效率提升了十分之一。"
 libra_planet_feature_modifier_5_b: "繁育之所"
 libra_planet_feature_modifier_5_b_desc: "对这个星球上的居民来说，在环境激素的促使下进行露天交配行为是理所当然的，他们的人口由此迅猛增长。"
 decision_libra_mhpf_6: "探索折叠空间"
 decision_libra_mhpf_6_desc: "这个星球上折叠的空间也许不是那么稳定，我们或许可以做些什么。"
 libra_planet_feature_modifier_6_a: "次元细缝"
 libra_planet_feature_modifier_6_a_desc: "由于无谋的探险行动，这个星球的折叠空间塌陷了一部分，尽管如此，它还是比直接感知到的要大。"
 libra_planet_feature_modifier_6_b: "次元广场"
 libra_planet_feature_modifier_6_b_desc: "这个星球上的隐藏空间……非常地广阔。"
 decision_libra_mhpf_7: "介入军事动物"
 decision_libra_mhpf_7_desc: "调用人员对这个星球上的奇异动物进行压力测试，也许会发生有意思的事情。"
 libra_planet_feature_modifier_7_a: "狂暴之星"
 libra_planet_feature_modifier_7_a_desc: "这个星球上的军事性动物变得异常暴躁。"
 libra_planet_feature_modifier_7_b: "战争之星"
 libra_planet_feature_modifier_7_b_desc: "$libra_planet_feature_modifier_7_desc$"
 libra_planet_feature_modifier_7_c: "胜利之星"
 libra_planet_feature_modifier_7_c_desc: "这个星球上的军事性动物在外来干涉研究中表现出极佳的适应性。"
 decision_libra_mhpf_8: "超时空实验"
 decision_libra_mhpf_8_desc: "不稳定的时间流速为不寻常的实验带来了可能。"
 libra_planet_feature_modifier_8_a: "时间加速"
 libra_planet_feature_modifier_8_a_desc: "$libra_planet_feature_modifier_8_desc$"
 libra_planet_feature_modifier_8_b: "时间超加速"
 libra_planet_feature_modifier_8_b_desc: "这个星球上的时间流速比正常情况快上不少。"
 libra_planet_feature_modifier_8_c: "时间暴走"
 libra_planet_feature_modifier_8_c_desc: "这个星球的时间变化高达正常情况的一倍至多。"
 decision_libra_mhpf_9: "驯服高爆植被"
 decision_libra_mhpf_9_desc: "我们可以对这里的野蛮植物进行选择性育种，培养一种竞争性更强的稳定变种来取代这些危险的原生体。"
 libra_planet_feature_modifier_9_a: "爆炸的世界"
 libra_planet_feature_modifier_9_a_desc: "生长在这个星球上的高爆植物随时都有爆炸的风险，它们已经远远脱离了可控范围。"
 libra_planet_feature_modifier_9_b: "高能植被"
 libra_planet_feature_modifier_9_b_desc: "在这个星球上存在着一种自发积蓄易爆微粒的奇异植物。"
 libra_planet_feature_modifier_9_c: "爆裂果实"
 libra_planet_feature_modifier_9_c_desc: "通过杂交育种，一种长势旺盛的新型爆炸植物已经在这里稳定发育，只需要采摘它们的果实进行简单提纯即可获得可观的收入。"
 decision_libra_mhpf_10: "沼气星球探险"
 decision_libra_mhpf_10_desc: "寻找这个星球上无尽沼气的来源，也许会有所收获。"
 libra_planet_feature_modifier_10_a: "气体喷口"
 libra_planet_feature_modifier_10_a_desc: "一处深达地幔的喷口，时刻向周边环境中释放着天然气。"
 libra_planet_feature_modifier_10_b: "沼气大爆炸"
 libra_planet_feature_modifier_10_b_desc: "欠缺周到的探险行动引爆了这个星球底下的异星气体贮藏，造成了难以修复的大破坏。"
 libra_planet_feature_modifier_10_c: "地下沼气湖"
 libra_planet_feature_modifier_10_c_desc: "这个星球的地下有稳定的异星气体资源，我们可以通过特殊植物来富集它们。"
 decision_libra_mhpf_11: "电离冲击"
 decision_libra_mhpf_11_desc: "我们可以尝试着收集这个星球上的意外电力。"
