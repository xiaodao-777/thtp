 libra_alicis_desc: "来自不可思议世界的传说。"
 libra_alicis_catch_phrase: ""


 libra_hoshino_kotori_1: "凤小鸟"
 libra_hoshino_kotori_2: "星野小鸟"
 libra_hoshino_kotori_3: "阿兰卡·萨拉芙"
 libra_hoshino_kotori_desc: ""
 libra_hoshino_kotori_catch_phrase: ""
 leader_trait_libra_kotori_fan: "扭曲小鸟厨"
 leader_trait_libra_kotori_fan_desc: "这位领袖是某个“虚构”人物的狂热粉丝，并试图在帝国内推广这一偏好。"


 libra_story_site_system_2_mod: "迷失领域"
 NAME_Libra_Guardian_1: "迷失之龙"
 NAME_Libra_Guardian_01: "迷失之龙"
 libra_guardian_1_modifier: "$NAME_Libra_Guardian_1$"
 libra_lost_shrine: "遗落神社"
 libra_lost_shrine_desc: "这个星球上有一座看起来荒废已久，却光亮如新的神社建筑。"
 libra_main.3000.name: "静听神乐"
 libra_main.3000.desc: "这座神社似乎被灵能力量保护，才得以一尘不染。建筑周围回想着淡淡的乐曲声，却无法用设备加以捕捉。"
 libra_main.3000.a: "至少它使人心神平静。"
 libra_main.3001.name: "乐声"
 libra_main.3001.desc: "我们中一部分个体的意识突然遭到“吸引”，沉入了一个幻境般的空间里，在这里的感知异常清晰，只是有种难以衡量的虚假异物感，和某种仪式音乐的声音，这音乐同之前遇到的神社颇为相似。"
 libra_main.3001.a: "让我们看看深处有些什么。"
 libra_main.3001.b: "太诡异了，停下为好。"
 libra_main.3002.name: "市集"
 libra_main.3002.desc: "随着意识领域的深入，我们来到了……一个颇具异国情调的城镇，四处都是祭典的布置，仿佛刚才还有人在这里庆祝，当下却空无一人。\n\n城镇的一角，我们发现了与那座神社几乎一样的建筑，它更为华丽，音乐声正是由此传来。"
 libra_main.3002.a: "触碰城镇建筑。"
 libra_main.3002.a.response: "我们从建筑中穿了过去，没有碰到任何东西。"
 libra_main.3002.b: "看看市集里还有什么。"
 libra_main.3002.b.response: "再三搜寻之后，我们仍没找到活体生物的痕迹。然而，在一些本该有人的地方——比如摆满水果的小摊后，一些灰金色的粉尘徘徊旋转，勾勒出人型生物的造型，实在是非常诡异。"
 libra_main.3002.c: "造访神社。"
 libra_main.3003.name: "神乐"
 libra_main.3003.desc: "我们进入神社不久，身后的幻境就崩塌消散了。\n\n一位巫女在正殿前独自舞蹈，她没有注意到我们，继续着那仪式般的舞步。"
 libra_main.3003.a: "寻找音乐的来源。"
 libra_main.3003.a.response: "以频率分析，这段声乐应当是有多种乐器合奏的。但我们找遍了神社，也没有发现第二个人物或可以发出声音的机关。"
 libra_main.3003.b: "触碰神社建筑。"
 libra_main.3003.b.response: "神社里绝大多数设施都是虚无的，尝试触碰就会直接穿过去。只有正殿例外，我们可以碰到，却无法对其施加影响——无论是推门还是敲打都没有反应。"
 libra_main.3003.c: "尝试搭话。"
 libra_main.3003.c.response: "巫女注意到了我们，但没有作回应。"
 libra_main.3003.d: "等待舞蹈结束。"
 libra_main.3004.name: "曲毕"
 libra_main.3004.desc: "不久，舞蹈结束。巫女终于将视线转向了我们，看起来是在等我们发话。"
 libra_main.3004.a: "你是谁？这里怎么了？"
 libra_main.3004.a.response: "我是§H$libra_hoshino_kotori_2$§!，此地名家之女。\n\n她顿了顿\n\n这里——这个世界都结束了，诸君看到的是这个世界的最后残影。虽然不知道各位是怎么进入的这儿，但小鸟建议各位还是尽早离开为好。"
 libra_main.3004.b: "为什么一个人在这里？"
 libra_main.3004.b.response: "有些事情必须有人来做……比如，见证一个世界的最后时刻，和世界终结之后的工作。当然，这不在普通巫女的工作范围内，各位也不需要担心小鸟的安危——毕竟，这里的结局早已确定。"
 libra_main.3004.c: "尝试询问更多。"
 libra_main.3005.name: "消散"
 libra_main.3005.desc: "就在对话间，神社也和外面的幻境一样崩解了。从鸟居到正殿都在转瞬间灰飞烟灭，只有巫女手中的铃铛掉落在地，看起来无比真实。\n\n§Y“如果我们某日相遇，希望不会以悲伤作结。”§!"
 libra_main.3005.a: "拿起铃铛。"
 r_libra_kagura_suzu: "姬巫女的神乐铃"
 r_libra_kagura_suzu_desc: "巫女在终末后的世界中舞蹈，我们取得了她当时手中的法器。"
 libra_main.3006.name: "措辞激烈的通讯"
 libra_main.3006.desc: "喂喂喂，本女可是看着你们的科研船在这个星系里转悠了半天了~\n你们拿着如此贵重的研究设备，把这里的天体扫描了一遍又一遍，却注意不到那么大一个神社的残像吗？能找到这么个偏僻的地方，肯定是来寻宝的吧~真是可惜呢，动用了那么大的代价解决守卫，负责接下来任务的家伙却是个有眼不识泰山的杂鱼，哼呵呵哈啊啊啊啊（笑）。"
 libra_main.3006.a: "不能好好交流吗？"
 libra_main.3006.a.response: "才——不要~\n\n杂鱼的命运就是被羞辱，被这样那样地调教，最后乖乖地向命运低头。就以各位的这种水平，可没资格对本女说三道四。\n\n笨蛋~笨~蛋~~"
 libra_main.3006.b: "是是，说得对。"
 libra_main.3006.c: "这绝不可能是值得研究的现象！"

 libra_main.3050.name: "旧日神乐"
 libra_main.3050.desc: "神乐铃在摇动中碎裂，从中释放出一束特异的能量，它的轨迹难以预测，迅速地穿行在我们帝国之中。\n\n这个能量体似乎在观察我们、模仿我们，却又刻意地与我们保持距离。"
 libra_main.3050.a: "只有这样吗？"
 libra_main.3051.name: "三重身影"
 libra_main.3051.desc: "距离神乐铃释放能量已经有了数年，现在的能量体分裂成了三只，每一个都具有我们的一部分特征，但在更多的地方一点儿也不像我们。\n\n最近的交涉已经证实，它们的人格和记忆都不完整，与§Y$libra_hoshino_kotori_2$§!则存在着某种说不清的关联。如今它们希望暂居我们的帝国，静静等待某个时刻的到来。"
 libra_main.3051.a: "原来这样吗？"
 libra_hoshino_kotori_q1: "$libra_hoshino_kotori_2$-Q1"
 libra_hoshino_kotori_q2: "$libra_hoshino_kotori_2$-Q2"
 libra_hoshino_kotori_q3: "$libra_hoshino_kotori_2$-Q3"
 libra_hoshino_kotori_q_desc: "一件先史法器将名为“§Y$libra_hoshino_kotori_2$§!”的异界巫女投影到了我们的世界，它们拥有本体的一部分力量，却少了记忆和其它组成部分。"
 libra_hoshino_kotori_q1_catch_phrase: "起航！"
 libra_hoshino_kotori_q2_catch_phrase: "起飞！"
 libra_hoshino_kotori_q3_catch_phrase: "坠机！"
 leader_trait_libra_hoshino_kotori_miko_1: "破阵神乐"
 leader_trait_libra_hoshino_kotori_miko_1_desc: "来自某个早已灭亡的古老世界的奇特仪式，虽然久远且难以解读，却仍具有相当大的现实影响力。\n$libraf_lt_banner_0$"
 leader_trait_libra_hoshino_kotori_miko_2: "振耀神乐"
 leader_trait_libra_hoshino_kotori_miko_2_desc: "$leader_trait_libra_hoshino_kotori_miko_1_desc$"
 leader_trait_libra_hoshino_kotori_miko_3: "驱傩神乐"
 leader_trait_libra_hoshino_kotori_miko_3_desc: "$leader_trait_libra_hoshino_kotori_miko_1_desc$"