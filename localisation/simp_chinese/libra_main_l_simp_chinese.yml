 libra_main_trait: "£empire£§d天秤契约§!£empire£\n[This.GetClassTexticon][This.GetClass]类别"

 leader_trait_libra_crash_anniversary: "坠机纪念日"
 leader_trait_libra_crash_anniversary_desc: "今晚的航班无法起飞，这位领袖感到忧伤。"

