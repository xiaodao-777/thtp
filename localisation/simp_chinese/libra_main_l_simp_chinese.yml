l_simp_chinese:

 libra_main.0001.name: "童话代理人"
 libra_main.0001.desc: "初次见面，或是好久不见，我是Alicis的诸多使者之一，在此对初入星空的勇士致以真诚的问候。\n\n§H关于mod更新，请关注B站（爱丽茜丝Alicis）和爱发电（Alicis Runes）以了解更多§!"
 libra_main.0001.a: "结束通讯。"
 libra_main.0001.b: "查看更新（§G2026.03.24§!）"
 libra_main.0001.b.response: "§H更新预告及记录见§Y爱发电 - Alicis Runes§!，以下是近期更新的主要内容：§!\n\n$t$—2026.03.24—\n$tt$飞升：['ascension_perk:ap_libra_hurricane_eye']\n$tt$故事&彩蛋更新"
 libra_main.0001.c: "鸣谢列表（§Y2026.02.07§!）"
 libra_main.0001.c.response: "感谢以下人员对mod制作的支持~\n受游戏字体影响，部分文字可能无法正常显示。\n\n华.Neflibata$tt$i_c$tt$123物语$tt$爱发电用户_4mFR$tt$爱发电用户_82c16$tt$绝影玄天$tt$急支糖浆$tt$爱发电用户_QSX6$tt$Andrea -- 心境$tt$Homurism$tt$UltraVotingMachine$tt$爱发电用户_wNGt$tt$荜黎柌夏$tt$-23$tt$多萝西的狗$tt$斩鸽氏族黑手喵$tt$假面愚者$tt$爱发电用户_VaMX$tt$Ourovia$tt$nico$tt$爱发电用户_9ewS$tt$半杯未满吕吕吕吕吕蒙$tt$爱发电用户_yw5g$tt$早餐吃佳代子$tt$星逝$tt$旧号$tt$灵能基因机器人$tt$Alice$tt$光速小子1代$tt$爱发电用户_e0f1d$tt$kakadeso$tt$Oizys$tt$爱发电用户_48fcf$tt$Cynhard$tt$爱发电用户_VQ4P$tt$DCDAA$tt$繁星坠北"
 libra_main.0001.d: "Alicis去哪里了？"
 libra_main.0001.d.response: "早在无数个世界之前，Alicis就和顶点世界一起消失了，没有人知道Alicis去往何方。"
 libra_main.0001.e: "如何寻找相关痕迹？"
 libra_main.0001.e.response: "旧世界结束之后，无数的碎片四散开来，它们可能成了新世界的一部分，也可能被某些个体所用。"
 libra_main.0001.f: "我在寻找那些传说。"
 libra_main.0001.f.response: "遥远世界的故事未必都是美好的，若阁下定要探寻，就耐心等待吧。\n\n（相关更新己加入近期计划）"
 libra_main.0001.g: "邀请对方一同享用茶点。"
 libra_main.0001.g.response: "非常抱歉，阁下看到的这具身体只是虚像，是接收者融合自身经验构筑出的假想姿态，真正的我不在这个世界里，也不是这番模样。"

 libra_main.0011.name: "童话代理人"
 libra_main.0011.desc: "我们又见面了。\n我知道各位会来到这里，因此特来为帝国指明一些可能性。\n\n§Y那些祝福会永远存续，只要你们没有误入歧途。§!"
 libra_main.0011.a: "结束通讯。"
 libra_main.0011.a.tt: "获得当前飞升路线的['concept_libra_expand_technology']"
 libra_main.0011.b: "为什么要告诉我们这些？"
 libra_main.0011.b.response: "为了减少某种可能性——哪怕只有一丝一毫。"
 libra_main.0011.c: "下次见面会在什么时候？"
 libra_main.0011.c.response: "这应该是我们最后一次以非敌对的形式见面了——在我所预知的未来、多数的时间线里，你们都走上了§Y误入歧途§!的道路。\n\n如果你们踏上了康庄大道，我们的命运之间就没有更多的交汇点了。"

 libra_main.0020.name: "未知的虚影"
 libra_main.0021.desc: "阁下帝国的水准令人失望，无论是作为敌人还是盟友都不够格。遵从至高的使命，特来为各位指点迷津。"
 libra_main.0021.a: "你说的对。"
 libra_main.0021.b: "你是什么人？"
 libra_main.0021.b.response: "遵从谕旨降临的人。"
 libra_main.0021.c: "你直接过来会更有用。"
 libra_main.0021.c.response: "就算各位来这边也不会收留。"
 libra_main.0021.d: "结束通讯。"
 libra_main.0022.desc: "吾听闻远方世界有国家强大且繁荣，突破命运之枷锁、履创前人所不能为之辉煌。今日一见，大感失望。如此鼠辈竟是异世谣传的正身，实在费解。\n\n尔等世界不过一无端囚笼，拘束凡庸人等尚可，不想本应非凡者亦为所困。"
 libra_main.0022.a: "指点的是。"
 libra_main.0022.b: "你是什么人？"
 libra_main.0022.b.response: "§Y起居殿堂§!，洞察万象。隔镜观世，安看炎凉。"
 libra_main.0022.c: "有何高见？"
 libra_main.0022.c.response: "精进技艺，掌握命运。"
 libra_main.0022.d: "那是我们自己选择的道路。"
 libra_main.0023.desc: "不行啊不行啦~那么大一个帝国，半个世纪的成果只有这点儿程度吗~就像个笑话一样呢~就算把研究方向混在一起抽签，能得到的结果也比乱选好多了，是怎么才能做到选择的正确率比纯随机还低的？~\n\n屏幕对面的笨蛋，你最好找条地缝转进去吧~这样对你和受你摆布的帝国都比较有益。\n\n当然，要帮你们也不是不行，公开承认自己是最大的杂~鱼~，让宇宙间的所有人都认识到各位的废柴本质，本女就考虑考虑。"
 libra_main.0023.a: "承认羞辱。"
 libra_main.0023.b: "为什么突然出来羞辱我们？"
 libra_main.0023.b.response: "无聊啊无聊啦~本女看着天象运转，刚发现一个英杰辈出的国家，以为会有所创举。可是结果呢~做出靠化学燃料实现星际履行的先辈科学家们，绝对想不到自己的继任者们是这样一帮不可回收物吧？本女白等了五十年，却发现他们碌碌无为，实在是丢脸呀~"
 libra_main.0023.c: "你再骂！"
 libra_main.0023.c.response: "讨厌吗？讨厌就来咬本女呀~以这样的不入流水平，再过亿万年也摸不着本女的维度半点儿呢。老实说，屏幕对面的家伙还是先洗洗睡吧，梦里什么都有呢。"
 libra_main.0023.d: "屏蔽通讯。"

#

 NAME_libra_agent: "天秤代理人"

 libra_main.0101.name: "天秤交易所"
 libra_main.0101.desc: "欢迎来到代理人领域，请问有什么可以帮您的吗？"
 libra_main.0101.a: "暂时没有需要的了。"
 libra_main.0101.b: "我们需要一些交换。"
 libra_main_101_b_fail: "已经有一项正在生效的交易了"
 libra_main.0101.c: "那些奇怪的圆环遗迹是怎么回事？"
 libra_main.0101.c.tt: "§Y有些知识会带来不幸§!"
 libra_main.0101.d: "讲讲那个喜欢羞辱人的虚影。"
 libra_main.0101.d.response: "呃……\n\n那位不友好的来客实际上是一个高位存在，精通各种阴阳术，在下不能——或者说是无法透露过多的信息，但可以确定的是，如果阁下能引起对方的兴趣，她或许会愿意和阁下正常交流，甚至借出一些力量。\n\n另外，这位存在是绝对不能小瞧的对象，作为曾经见证了一棵世界树最后时刻的个体，她牵涉的事物超乎想象。"
 libra_main.0101.e: "讲讲星系里散布的水晶建筑群。"
 libra_main.0101.e.response: "在遥远过去曾经存在过的世界里，曾经有一个无与伦比的大帝国，而其间最为强盛的阶段，则被称为“§H水晶王朝§!”。正如它的名字一样，这个帝国的建筑以各式各样的水晶为主要材料，形成了极具辨识度的风格。\n\n在未知世界的灾难将其粉碎、破片四散漂流到其它世界之前，§H水晶王朝§!已经持续了两千多年，由于那浩劫到来的毫无征兆，居民们没有任何时间能采取反应来应对，阁下所发现的这些遗址建筑群，其状态非常接近于当时的样子。各位可能发现他们不同时代的建筑群——从古典时代到星际时代都是可能的，这也是它们主体风格相似，细节差异颇多的原因。"
 libra_main.0101.f: "我们想向天秤换取武力。"
 libra_main.0101.f.tt: "赋予指定§Y$commander_with_icon$§!以§d$leader_trait_libra_reciprocity_commander$§!特质\n§R这将使其在§Y10~12§!年内去世§!"
 libra_main.0101.f.fail.1: "已经有$commander_with_icon$获得了此特质"
 libra_main.0101.f.fail.2: "没有符合条件的$commander_with_icon$"
 libra_main.0101.f.opinion: "需要§Y$NAME_libra_agent$§!达到§R50§!£opinion£ §Y$OPINION$§!"
 libra_main.0101.g: "我们想向天秤换取繁荣。"
 libra_main.0101.g.tt: "获得一位带有§d$leader_trait_libra_reciprocity_commander$§!特质的§Y$official_with_icon$§!，§R在§Y10~12§!年内去世§!"
 libra_main.0101.g.fail: "已经雇佣了这样的一位$official_with_icon$"
 libra_main.0101.g.opinion: "需要§Y$NAME_libra_agent$§!达到§R75§!£opinion£ §Y$OPINION$§!"
 libra_main.0101.g.response: "交易成立，一位觉醒者已经出现在阁下的帝国中，请妥善运用这份力量，并准备好即将到来的诀别。"
 libra_main.0101.h: "教授我们天秤运作的原理。"
 libra_main.0101.h.opinion: "需要§Y$NAME_libra_agent$§!达到§R100§!£opinion£ §Y$OPINION$§!"
 libra_main.0101.h.response: "当然，但请注意，我们只能预见有限的未来，并不能知晓过多的干涉因素。"
 libra_agent_mod_100: "天秤之平衡"

 libra_main.0102.name: "天秤交换：付出"
 libra_main.0102.desc: "基于规则的力量，您可以在希望的领域取得增长，但也要再另一方面付出代价，尽管这些交易通常是不对等的。\n\n在选择必要的代价之后，您可以获得想要的增益。"
 libra_main.0102.a: "我们暂时不想交换。"
 libra_main.0102.b: "工作效率。"
 libra_main.0102.c: "资源生产。"
 libra_main.0102.d: "行政能力。"
 libra_main.0102.e: "军事战斗。"
 libra_main.0102.f: "科研速度。"
 libra_main.0103.name: "天秤交换：取得"
 libra_main.0103.desc: "代价已经选择，只要各位再选择一项增益，它们就会一并生效。"
 libra_main.0103.a: "我们需要重新考虑一下。"
 libra_main.0103.a.tt: "取消交易"
 libra_main.0103.b.response: "交易成立，祝各位度过愉快的十二年。"
 libra_main_103_fail: "我们已经将它作为代价付出"
 libra_main.0105.name: "天秤续期"
 libra_main.0105.desc: "尊敬的客人，您好。\n\n十二年前的交易已经到期，请问您是否需要新的交换？"
 libra_main.0105.a: "暂时不用了。"
 libra_main.0105.b: "是的，我们要。"
 libra_agent_mod_1: "天秤交易"
 libra_agent_mod_2: "$libra_agent_mod_1$"
 libra_agent_mod_3: "$libra_agent_mod_1$"
 libra_agent_mod_4: "$libra_agent_mod_1$"
 libra_agent_mod_5: "$libra_agent_mod_1$"

 libra_main.0106.name: "命运交换"
 libra_main.0106.desc: "在原则上，天秤不应该直接干涉各方势力的平衡，但促进变革的举动又是可以的。\n\n换取力量往往伴随着对等或者更重的代价，而这代价往往要通过燃尽存在来支付。选择富有经验的个体作为牺牲者并不明智，因此在下列出了阁下指挥官中经验较浅的几位，请从中选择。"
 libra_main.0106.a: "我们还是以后再考虑。"
 libra_main.0106.b: "[leader_1.GetName]"
 libra_main.0106.c: "[leader_2.GetName]"
 libra_main.0106.d: "[leader_3.GetName]"
 libra_main.0106.e: "[leader_4.GetName]"
 libra_main.0106.response: "交易成立，力量已经支取，代价也会随之而来，请阁下无比珍惜这位指挥官的牺牲。"

 leader_trait_libra_reciprocity_commander: "天秤互易"
 leader_trait_libra_reciprocity_commander_desc: "同天秤的任何交易都伴随着代价，极少有个体能够免于支付。这位领袖将自己的未来签出，以换取当下能力的极致发挥。"
 leader_trait_libra_reciprocity_official: "$leader_trait_libra_reciprocity_commander$"
 leader_trait_libra_reciprocity_official_desc: "$leader_trait_libra_reciprocity_commander_desc$"
 leader_trait_libra_reciprocity_tt: "$t$—将在§Y12§!年内§R去世§!"

 libra_main.0110.name: "天秤交易所"
 libra_main.0110.desc: "这是一系列复杂的事情。\n\n如果过于弱小的存在对强大者产生了认知，就像原始社会里生物对天灾的敬畏一样，而这个对象具有真实的主体、以及一个可能的世界规则，那么在这些原始信仰的汇聚之下，那个存在本身就有可能被转化为神一样的性质，就如同这个世界里的虚境实体。\n\n但，不是所有信仰都会导向好的结果，有一支激进的教派将终结视作救赎，而他们崇拜的对象确实具有掌管终结的力量，让他们毫无顾忌的发展壮大。最终，这个势力不再满足于自身的完美结束，也开始将终结强加于其他人——甚至是其它世界和平行世界里的自己。\n\n阁下看到的这些遗址，都是他们远征时留下的，而圆环印记，则是他们信仰的符号。"
 libra_main.0110.a: "知道了。"
 libra_main.0110.b: "为什么会出现在这个世界？他们也来过？"
 libra_main.0110.b.response: "这很难说。\n\n在直接活动之外，让一个世界中的事物显现在另一个世界的手段有很多种，可能是人为引爆、次元漂流、或者是主神陨落等等。不过，真实的“终结”不会骗人，这些遗址的历史大多是真实的，即是说，在某个时候，发生了那样的事情。"
 libra_main.0110.c: "他们的要义只有终结吗？"
 libra_main.0110.c.response: "当然不是，每个世界里都或多或少地存在过终末信仰者，并不是所有信仰都会完美指向同一位掌管终结的神，也可能是类似性质的其他存在。以这个世界为例的话，就是那位带来终结的虚境实体。"
 libra_main.0110.d: "我们也能从中获得力量吗？"
 libra_main.0110.d.response: "就结果而言，确实可以，不过其中会多少有一些曲折，但只要各位找到了契机，比如与“§H终界使徒§!”的相遇，之后的事情会简单得多。"
 libra_main.0110.e: "你对他们有什么看法吗？"
 libra_main.0110.e.response: "如阁下所见，天秤乐意于记录砝码质量的变化，作为能给世界带来变化的终末信仰者，他们并不是完全不可接纳的因素——尽管他们通常是极度危险的存在。"

 libra_main.0150.name: "奇怪的信号"
 libra_main.0150.desc: "我们在§H[From.GetName]§!收到了一串奇妙的信号，看起来是某个异星实体所为。"
 libra_main.0150.a: "破译看看。"
 libra_main.0151.name: "天秤代理人"
 libra_main.0151.desc: "初次见面，您好，在下是§H天秤代理人§!，为今天的相遇已经久候多时了。\n\n您可能已经见过§H童话代理人§!，与之不同，我能为您提供一些力量交换，或是一些不为人知的知识。"
 libra_main.0151.a: "结束通讯。"
 libra_main.0151.b: "你能提供什么交易？"
 libra_main.0151.b.response: "我们乐意于见到世界的变化，无论是好是坏。\n为此，我们可以提供基于天秤的力量交换，索取的一方需要付出的会更多一些。"
 libra_main.0151.c: "你知道是谁封印了我们吗？"
 libra_main.0151.c.response: "一位金发恶魔，可能有魅魔血统。\n\n理由是，“在世界终结之前保留尽可能多的火种”。"
 libra_main.0151.d: "讲讲旧世界的故事吧。"
 libra_main.0151.d.response: "各位是虚空龙族吧，在§H龙之城§!，虚空龙是最强大、最伟大的存在。\n\n虽然旧世界结束了，各位仍有其他同胞在别的世界里寻求未来，当年的皇女至今仍然健在。"
 libra_main.0151.e: "能解释我们代码的原理吗？"
 libra_main.0151.e.response: "那是结合以太、熵变和灵能的工程学奇迹。\n\n可以认为，各位的创造者绝对是天才。"
 libra_main.0151.f: "是谁给我们留下了这些遗产？"
 libra_main.0151.f.response: "我不确定，你们的技术中同时存在§H终界遗产§!和§H水晶王朝§!的痕迹，可能是其中一方，也可能两者都有。"
 libra_main.0151.g: "你能帮我们修建巴别塔吗？"
 libra_main.0151.g.response: "很抱歉，虽然天秤记录了相关的知识，但我不能这么做。\n\n阁下不是第一个修建巴别塔的文明——也不会是最后一个。"

