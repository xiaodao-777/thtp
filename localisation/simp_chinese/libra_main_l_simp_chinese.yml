 r_libra_mystic_grail: "神秘圣杯"
 r_libra_mystic_grail_desc: "未知文明留下的遗物，具有使人愿望成真的强大力量。"
 libra_mystic_grail_effect_tt: "§R其它帝国可以使用“§Y$casus_belli_cb_libra_mystic_grail$§!”宣战理由§!"
 libra_mystic_grail_modifier: "光佑"
 libra_mystic_grail_modifier_desc: "圣杯的光芒照耀着我们。"
 war_goal_wg_libra_mystic_grail: "圣杯战争"
 war_goal_wg_libra_mystic_grail_desc: "为了到达根源，这是必要的努力。"
 casus_belli_cb_libra_mystic_grail: "夺取圣杯"
 libra_main.1000.name: "失去§E$r_libra_mystic_grail$§!"
 libra_main.1000.desc: "我们无力抵挡[From.GetAdj]贪婪的进攻。作为失败的代价，圣杯成为了他们的战利品。"
 libra_main.1001.name: "夺取§E$r_libra_mystic_grail$§!"
 libra_main.1001.desc: "[From.From.GetName]在战争中落败，圣杯现在是我们的了。"
 libra_main.1002.name: "圣杯现世"
 libra_main.1002.desc: "或许只是远古流传的故事，却终有一天化作了现实。盛装以太之血的容器，如今已显现在因果的彼端——静静地陈列在我们的宝库之中。"
 libra_main.1004.name: "圣杯现世"
 libra_main.1004.desc: "据传，通过某种途径，§H[From.GetName]§!已经取得了圣杯的祝福——那是令人愿望成真的强大力量。"

#

 libra_main_story_site_1: "荒废中枢"
 libra_main_story_site_1_desc: "在这个非自然痕迹明显的星系里存在着一个巨大的遗弃殖民地，是何人建造了它们？它们又为何会荒芜至今？"
 libra_main.2000.name: "古代裂隙"
 libra_main.2000.desc: "经过初步的勘察，我们的研究人员能够认定，在个恒星系中有不少物质都是从其他维度漂泊而来的——这里的行星虽然由这个星系中常见的物质构成，结构却完全不同，其中的一部分上还有明显的维度漂移留下的痕迹。\n如今恒星系中极不稳定的星界细缝，在数个纪元前曾经是一处巨大且稳定的裂隙，也就是形成这个星系的物质来源。"
 libra_main.2000.a: "有趣。"
 libra_main.2001.name: "天体核心"
 libra_main.2001.desc: "在统计并分析这个星系里其他星球的调查数据，并对部分星球转经取样后，我们的研究者得到了一个更进一步的猜想：建造者将某些来自他们世界的物质团作为核心结构投入这个星系，然后通过某种方式释放力场，使这些核心结构向黑洞一样大量吸附物质，最终变成形成与我们看到的星球类似的高密度天体。\n\n这整个过程所用的时间，可能只有短短几个小时。"
 libra_main.2001.a: "令人惊叹的的技术。"
 libra_main.2002.name: "未完成的天体"
 libra_main.2002.desc: "虽然这个星系的建造者展现了惊人的技术，却没有——也可能是没能对形成的星球作太多处理，只有是排序成了现在的样子。即便如此，操纵不同行星在相同轨道的两端运动，且时至今日都保持着稳定的夹角与间距来看，他们显然非常擅长于控制天体轨迹。\n\n继续调查星系能获得的信息有限，接下来[Root.Leader.GetName]会指挥船员调查这个唯一有建设痕迹的星球本身。"
 libra_main.2002.a: "难以想象。"
 libra_main.2003.name: "不可能的建筑"
 libra_main.2003.desc: "虽然荒废，[From.Planet.GetName]上仍有一些维持形态的建筑，在准备妥当之前，[Root.Leader.GetName]派遣人员先收集和分析了行星建筑的特征。这些奇异的建筑完全没有地基或类似的结构，也没有反重力或相同作用的技术应用，只是孤零零地悬浮在空中。然而，无论测试者如何施力，这些建筑都一动不动，但如果猛烈撞击或使用武器射击，这些结构就轻易地破碎了。"
 libra_main.2003.a: "真是奇特的技巧。"
 libra_main.2003.b: "我们也能复现这种建筑吗？"
 libra_main.2004.name: "内部调查报告"
 libra_main.2004.desc: "由[Root.Leader.GetName]指派的勇士进入了部分建筑的内部进行调查，结果却是意外地一无所获。他们探查了建筑的每一个角落，却看不到任何内装、器械或是生活痕迹。取样分析表明，这些可能不是建筑的结构由单一材质组成，这些材质与先前钻井取样到的深部物质颇为相似——它们也不属于这个星系。"
 libra_main.2004.a: "真遗憾"
 libra_main.2005.name: "分析总结"
 libra_main.2005.desc: "在[From.Planet.GetName]上又徘徊了一段时间之后，[Root.Leader.GetName]的调查团队暂时撤离了地表，他们需要一些时间来重新归纳收获。可以确定的是，这个星系的建造者没有留下任何能使我们加以研究的痕迹，我们可能永远也不能知道他们是谁了。"
 libra_main.2005.a: "塑造星系的方法值得研究。"
 libra_main.2005.b: "我们需要这种奇异的建筑技巧。"
 libra_main.2006.name: "最终报告"
 libra_main.2006.desc: "在确认新的目标之后，[Root.Leader.GetName]指挥团队进行了最后的研究，这一过程也是不出意外的充满坎坷。无论用仪器扫描分析多少次，我们能得到的都只有猜想和假设。我们找不到那种以极低成本排布天体的技术洞见，也无法掌握这些建筑材料的全部特性。可能我们最初的研究方向就是错误的，也可能建造者具有这个世界上没有的某种力量，无论如何，我们不应该再在这里花时间了。"
 libra_main.2006.a: "也许我们会有其他利用它的方法。"

 libra_main_story_site_2: "疑‌冢"
 libra_main_story_site_2_desc: "这个星球上有一座疑似坟墓的大型水晶结构，其中可能有什么秘密。"
 libra_main.2010.name: "奇异材质"
 libra_main.2010.desc: "构筑这个坟墓的水晶材料单一却坚固，当我们的探索者试图取样时，敲下的部分凭空消失了——无论是应该存在的分子还是质量都在与结构分离的一瞬间归零了。"
 libra_main.2010.a: "有趣。"
 libra_main.2010.b: "我们好像在哪里见过？"
 libra_main.2011.name: "信号隔绝"
 libra_main.2011.desc: "在尝试扫描之后，[Root.Leader.GetName]意识到构成这座“坟墓”的材质会吸收并抵消多数长度的波，这一机制工作的原理完全无法解明。但，造成了什么影响确实肯定的——要么暴力发掘，要么慢慢探索，无论是哪一边，都面临着未知的风险。"
 libra_main.2011.a: "破坏这些碍事的墙壁。"
 libra_main.2011.b: "小心研究。"
 libra_main.2012.name: "探索报告"
 libra_main.2012.desc: "经过一番努力，研究团队来到的遗址的核心区域，这里的情况和外部看起来没什么差异——既没有雕刻，也没有陪葬，只有一个空空如也的石棺静静躺在大厅中央。"
 libra_main.2012.a: "令人遗憾。"
 libra_main.2013.name: "意外发现"
 libra_main.2013.desc: "离开中央厅室后，我们的研究人员沿着另一条迷宫一般的小道前往了外围。[Root.Leader.GetName]敏锐地注意到了存在于拐角里的几幅壁画，这些画作残缺不全，但其中包含的信息却不难理解——新任国王坐在水晶王座上接受加冕、工匠切削石材并将其制成匕首、巫师装束的尖耳人形生物为匕首施咒……以及刺客将匕首插入国王胸膛的场景。\n\n看起来这些壁画记录了一段历史，守护历史的人却不在这里。壁画没有说明刺杀的前因后果，我们也可能不会知道了。"
 libra_main.2013.a: "有趣的故事。"

 libra_main_story_site_3: "水晶小屋"
 libra_main_story_site_3_desc: "一块明显是人工雕刻的巨大水晶静静地飘在小行星带之间，水晶内部有明显的空隙和杂物。"
 libra_main.2020.name: "寻找入口"
 libra_main.2020.desc: "调查团队绕着水晶扫描了几周，反复确认后认定此结构的表面不存在开口。然而，光学传感器的数据表明水晶内部存在错综复杂的过道和房间，只是难以确定入口的方位。"
 libra_main.2020.a: "在找找看呢？"
 libra_main.2021.name: "隐秘通道"
 libra_main.2021.desc: "[Root.Leader.GetName]在最近的工作中失误将仪器脱手，砸中了水晶，幸运的是，被击中的位置轻易地破碎了，露出了通往内部的通道。但在之前的调查中，无论是光学扫描还是波动检测，这里都显示为实心结构。在复盘分析后，[Root.Leader.GetName]意识到这里利用了一种冷门但并不深奥的物理现象，使得团队难以找到入口。"
 libra_main.2021.a: "真是巧妙的伪装。"
 libra_main.2022.name: "水晶公馆"
 libra_main.2022.desc: "小屋内部的结构并不自然，不像是将整块水晶镂空雕刻成的样子。以当前姿态分析，这更像是将一座建筑物在瞬间转换成了水晶，从墙壁上的挂画到过道旁的水晶盆栽，一切都过于真实了。以我们目前所有的知识无法解释这种变化，它更像是超自然力量所为——比如灵能。"
 libra_main.2022.a: "真奇妙。"
 libra_main.2022.b: "这水晶的结构似曾相识。"
 libra_main.2023.name: "水晶中的信笺"
 libra_main.2023.desc: "在搜遍小屋后，[Root.Leader.GetName]找到了这里唯一不是水晶的物体，它被层层包裹在一颗正二十四面体水晶的中央。这个纸张一样的物体上面似乎有整齐的文字，但受水晶阻碍，我们的研究人员不能直接读取以解析文字。"
 libra_main.2023.a: "小心地破开它。"
 libra_main.2024.name: "“致米娅”"
 libra_main.2024.desc: "一番努力之后，调查团队成功取出纸张并破译了文本内容，由于其语法同我们的母语相近，在取得初步进展之后的工作一帆风顺，以下是译文：\n\n§H致尊敬的米娅女士：\n愿此信抵达您隐居之境时，您正沐浴于秋日宁静之中。\n近来寒雾渐深，我左手的结晶愈发如荆棘缠绕骨骼，晨起时已难握缰绳。宫廷医师的低语与药草皆如露水徒劳，唯念及昔日您曾轻叹此咒「如霜结于琉璃」，或尚存一线生机。\n北方林地的消息亦令人难安——尖耳族的踪迹悄然越过雪河，哨兵回报他们的银甲在月光下如鳞片闪烁，却无一支箭矢破空。沉默比狼嚎更令人警惕，或许您早已窥见星象中的暗涌。\n若您得闲于古籍或炉火间想起旧友，我将感激任何一丝指引。愿魔法庇护您的塔楼，一如往昔。\n\n您忠诚的\n德·维尔福\n于霜叶月第十七个黄昏§!"
 libra_main.2024.a: "这间屋子属于维尔福吗？"
 libra_main.2024.b: "看起来是诅咒把这里变成了水晶。"

 libra_main_story_site_4: "混沌团块"
 libra_main_story_site_4_desc: "一个诡异的团块立在这里，其构成物包含生物质、岩石和金属。"
 libra_story_specimen_1: "混沌神经组织"
 libra_story_specimen_1_desc_short: "古代生物标本"
 libra_story_specimen_1_desc_details: "一个远古生物的神经节，每11.37秒释放一次电磁脉冲。"
 libra_main.2030.name: "轮廓与回响"
 libra_main.2030.desc: "研究人员将探测阵列对准团块时，仪器读数陷入混乱。\n\n主动声呐的回波呈现出匪夷所思的延迟——仿佛信号在团块内部经历了漫长的跋涉才折返。多光谱扫描显示，其表面同时存在有机质的柔性褶皱、沉积岩的层理断裂、以及冷轧金属特有的定向划痕。这三种材质以非层压、非熔合的方式§H直接相邻§!，界面处无任何过渡痕迹。\n\n更令人不安的是被动探测：团块正在释放极其微弱的电磁脉冲，频率不稳，间隔约11.37秒一次——如同心跳。"
 libra_main.2030.a: "扩大扫描范围，确认地下有无延伸结构。"
 libra_main.2030.b: "它死了吗？"
 libra_main.2031.name: "三种血肉"
 libra_main.2031.desc: "激光切割器在团块表面开出一枚硬币大小的窗口，取样钻头带出的碎屑在培养皿中呈现惊人差异：岩石碎屑是普通硅酸盐，同位素比与此行星地壳一致；金属碎屑是某种钴铬钼合金，耐蚀性极强，表面有精密车削留下的微纹；而生物质样本——生物质样本的细胞结构尚未完全失活。\n\n在营养液中静置七小时后，部分细胞恢复了微弱的新陈代谢。基因测序显示，这些细胞来自三个完全不相关的门类：一种软体生物，一种节肢生物，以及一种我们尚未在自然演化树中锚定的§H第三类§!。\n\n它们以某种无法解析的方式，在同一具躯体里共存过。"
 libra_main.2031.a: "三种生命形态的拼接——谁做的？"
 libra_main.2032.name: "禁区实验"
 libra_main.2032.desc: "三种异源组织的共存，无法用自然嵌合解释——这极有可能是基因编辑失控后的遗留产物。研究团队基于现有证据提出初步假设是，团块是某类基因实验的失败品，研究者试图将不同门类的生物特征整合至单一躯体，以获得兼具软体再生力、节肢防御力与未知物种感知力的生物兵器。团块状态则预示着，整合后的免疫系统在某个临界点崩溃，个体在剧痛中将自己蜷成团状，最终死于排异休克。\n\n这一假设获得了多数研究者的赞同，但仍欠缺合理性。"
 libra_main.2032.a: "保留疑问，继续分析。"
 libra_main.2033.name: "不可名状"
 libra_main.2033.desc: "再次检查发现，三种组织的细胞边界不存在任何嵌合编辑痕迹，它们是§H原生§!的。这意味着个体并非被拼接而成，而是§H出生即如此§!。其次，金属样本表面的车削纹实则是磨损纹，其走向与生物质部分的肌肉附着点完全吻合。这只生物活着的时候，曾数百数千次地、用自己的躯体摩擦某物。\n\n在无法自圆其说的情况下，团队中出现了另一种声音：这是虚境的造物——只有超自然的维度扭曲，才能解释有机与无机的原生共生。"
 libra_main.2033.a: "这等于什么都没解释。"
 libra_main.2033.b: "真有喜欢诡异肉块的灵能实体吗？"
 libra_main.2034.name: "触手可及"
 libra_main.2034.desc: "最终报告由[Root.Leader.GetName]亲自执笔，关键突破来自生物质样本中一段被忽视的序列：某种§H神经接口蛋白§!。它的构型与已知义体改造技术中用于脑机信号转换的蛋白高度相似，但古老了约四千年。\n\n结合金属部分的磨损纹走向与生物质部分的肌肉附着点，团队重构了这只生物的部分姿态：它拥有多根覆盖钴铬钼合金外骨骼的长形附肢，附肢内侧的痕迹那是相邻附肢交错磨擦形成的：它活着的时候，常将自己的附肢交叠摩挲，以去除多余的金属增生，如同人类紧张时会绞扭手指，或啮齿类磨短自己的门牙。这不是实验失败的怪物，不是虚境投下的谜题。它只是一个接受了深度义体改造的、有感知力的生命。它来自某个我们尚未知晓的文明，拥有软体动物的祖先、节肢动物的远亲、以及一个不为我们所知的名姓。\n\n它死在四千年前，将自己的身躯蜷成抵御寒冷的姿势。然后在漫长的时间里，血肉分解再沉积，金属氧化再结晶，岩石碎屑随风填入缝隙——它与这颗星球的地质循环缓慢融合，成为一具不再是尸体的尸体，一块不会是化石的团块。\n\n电磁脉冲是残存的神经节偶尔发放的动作电位，11.37秒一次，如同心跳，四千年来从未停歇。"
 libra_main.2034.a: "切断神经，让它休息。"
 libra_main.2034.b: "科学研究的好材料。"

 libra_main_story_site_5: "天河神社"
 libra_main_story_site_5_desc: "一座古朴的荒废神社，其中有许多描绘星空的古画。"
 libra_story_specimen_2: "天河院妖异图鉴"
 libra_story_specimen_2_desc_short: "古代图册"
 libra_story_specimen_2_desc_details: "一位古代古代学者整理的民间妖怪传说，其中记录了二十七种妖物。"
 libra_main.2040.name: "星盘与蛛网"
 libra_main.2040.desc: "神社的主体结构保存尚可，但主殿屋顶已然坍陷，星光照入拜殿，落在褪色的贡品上。\n\n[Root.Leader.GetName]率队清理积尘时，在神龛后发现了藏匿于暗格中的数卷古画与一具锈蚀的星盘。星盘的设计原理原始，其刻度却精确得反常——以中世纪的技术水平，绘制它的人应当不具备如此精准的天文知识。\n\n古画则描绘着同一主题：漆黑的夜空，群星以金泥点染，某些星体被刻意放大，连缀成非自然的几何图案。其中一幅，银河倾泻如帘幕，帘幕之下，一个模糊的人影正向神社的方向走来。\n\n画师的落款处钤着一枚印章：§H天河§!。"
 libra_main.2040.a: "将这些文物小心打包。"
 libra_main.2041.name: "镰仓星图"
 libra_main.2041.desc: "经过初步释读，[Root.Leader.GetName]确认这些文物制作于约八百年前——对应这个文明的中世纪后期，列岛纷争频仍的时代。\n\n星盘背面的铭文记载，它曾属于一位名为§H天河院§!的阴阳师。此人供职于幕府，却因观测到不祥之星而被贬谪边地。铭文以古语写成，措辞隐晦：\n\n§H“文永五年，彗出紫宫。帝召院问吉凶，对曰：‘此非彗，乃神居之门户开阖。当有客自星海来，不言不语，不见其形，唯余丝落如雨。’帝怒，斥其妖言，流之东海。”§!\n\n与之同藏的一卷空白符纸，千年之后仍隐隐泛着微光，是由星界丝缕编织而成。"
 libra_main.2041.a: "客自星海来——他看见过什么？"
 libra_main.2041.b: "阴阳师的时代，工业文明的产物。"
 libra_main.2042.name: "无用的神宝"
 libra_main.2042.desc: "团队对全部画作与星盘进行了完整扫描。结论如下：\n\n这些文物蕴含的天文知识不超越肉眼观测极限，星盘虽刻度精准，却未应用任何超出时代的机械原理。它们更像某种灵能残余，而非可解析的科技产品，但文化价值无法估量。\n画作中反复出现的星图，其星体排列方式不存于自然夜空；某些被刻意描大的星辰，经模拟还原，被发现与八千光年外某球状星团的相对位置高度相似——而这一星团在八百年前的居民认知中，几乎不可能存在。\n\n天河院画的不是他看见的星空，他画的是§H梦见§!的星空。"
 libra_main.2042.a: "一位梦到群星彼岸的古人。"
 libra_main.2042.b: "这些星图值得存入档案。"
 libra_main.2043.name: "百鬼夜行抄"
 libra_main.2043.desc: "在主殿经卷架的暗屉中，调查员发现了一册手抄本。\n\n书题§H《天河院妖异图鉴》§!，墨迹沉着，页角卷磨损，显然是经年累月增补而成。图鉴以细笔勾勒了二十七种妖物的形貌，旁注其名、习性、出没之地，以及退治之法。\n\n此书的编撰逻辑与现代生物分类学存在相似性：天河院将妖物按分门别类，部分条目下，他甚至以朱笔批注了“未确认”“疑似”“待考”字样。\n\n这是一位八百年前的阴阳师，用他时代所能理解的语言，试图§H定义不可名状之物§!。\n\n——「络新妇」，昼伏夜出，结网于高树，网丝遇热即隐；\n——「垢尝」，潜居废宅，舔舐器物，其涎可锈金铁；\n——「飞缘魔」，貌若天女，曳光丝于身后，近之则言语失声，目之则形骸溃散，古书谓此妖出没无定，无有退治之例。\n\n图鉴末页，天河院以颤抖的笔迹写下最后一行：§H“此非妖也，吾不知其名。”§!"
 libra_main.2043.a: "看来是一位生错了时代的博物学者。"
 libra_main.2044.name: "天河"
 libra_main.2044.desc: "发掘工作临近尾声，[Root.Leader.GetName]得出了最终的结论：\n\n此神社主人「天河院」是一位被主流排斥的异端学者。他以梦境为窗，看见了一片不该存在的星海，并将其摹于绢帛之上。他亦预见了某种毁灭——以“丝”“光”“妖”为形态，将言语与形骸一并剥夺的终结。\n\n在他死后八百年，我们造访了这片土地。他梦中的星空，我们已在航图上标注。他恐惧的妖魔，我们尚未知其真名。\n\n但至少，这座荒废的神社终于等到了理解它的人。\n\n§H“客自星海来”§!——而我们，或许也是客中的一员。"
 libra_main.2044.a: "愿智者安息。"
 libra_main.2044.b: "妖怪与星图——我们遗落了什么？"

 libra_main_story_site_6: "寂寥桃源"
 libra_main_story_site_6_desc: "水草丰美之地里隐藏着文明存在的痕迹，荒芜的田垄、折断的墙壁，似乎已逾万年之久。"
 libra_story_specimen_3: "桃源密录"
 libra_story_specimen_3_desc_short: "古代传说"
 libra_story_specimen_3_desc_details: "刻录着高天原审判传说的金属片。"
 libra_main.2050.name: "无人的炊烟"
 libra_main.2050.desc: "[Root.Leader.GetName]率队登陆时，这颗星球的景象令所有人困惑——田垄尚未完全荒芜，蓄水池中仍有净水，几处屋舍的金属灶台边散落着未来得及烹饪的包装餐食。\n\n热成像显示，最近的炊事痕迹距今不超过三个标准周。然而，整片聚落找不到一具遗骸，也未见任何匆忙撤离的迹象。犬舍的锁链未解，畜栏的门闩插好，仿佛居民只是在某个寻常的午后，同时决定放下手中的一切，走进森林里去了。"
 libra_main.2050.a: "他们去了哪里？"
 libra_main.2051.name: "一万年的稻香"
 libra_main.2051.desc: "土壤中的有机残留、屋舍木料的纤维结构、甚至灶灰中的炭粒——所有样本都将时代指向距今约一万一千标准年前。然而这片田地的荒芜程度，若按自然演替计算，不应超过一个生长季。\n\n更令[Root.Leader.GetName]不安的是光谱分析：土壤颗粒表面附着着微量但均匀的奇异物质，其晶格排列方式与我们在§H将军石§!样本中检测到的武器构成物质存在§H高度相似性§!——但这一信息仅被归档于研究日志的附注中。\n\n这片土地本身，被某种东西§H停驻§!了。"
 libra_main.2051.a: "三十万年……和三天？"
 libra_main.2051.b: "将异常物质标记为优先研究对象。"
 libra_main.2052.name: "晨炊未冷"
 libra_main.2052.desc: "对居住区的系统性勘察揭示了一个完整社会横截面。\n\n灶膛存有最后一次烹煮的焦痕，织机横桁悬着半匹未裁的素绢，厩舍里甚至保留了某种偶蹄类生物的骨骼——其颈椎带有精密合金接口，表明机械改造的役畜。\n\n从炊具合金成分到通信终端的电路蚀刻精度，综合判定该文明已具备后工业时代水准。然而没有任何一具遗体，没有挣扎痕迹，没有疾病或战乱的遗存。他们仿佛只是在某个寻常的黄昏，放下碗筷，开门离去。"
 libra_main.2052.a: "就像集体蒸发的水滴。"
 libra_main.2053.name: "天守遗影"
 libra_main.2053.desc: "在聚落北侧丘岗上，调查队发现了此地唯一具备防御性质的建筑群。\n\n石垣累叠七层，橹门虽已倾颓，基座仍可辨认出贵族的徽印。主殿内部陈设狼藉，却不是劫掠所致——更像是主人仓促离席时碰翻了案几。"
 libra_main.2053.a: "这里的住民哪儿去了？"
 libra_main.2054.name: "未寄之信"
 libra_main.2054.desc: "纸质文件大多已脆化成絮，但[Root.Leader.GetName]从城主书房的夹层暗格中找到了一封装订完好的信函。其纸面纤薄如翼，墨迹犹新。\n\n译文如下：\n\n§H……三日前，快马自东境来。使者唇色青紫，下马即仆倒，怀中信函沾满霜露。\n\n信云：海岸诸村，半月之间人声绝迹。灶冷床温，门户不闭，市中鱼摊尚有未售尽之鲣。僧侣言曾见夜空中垂落银丝，细如发，亮如针，触地即隐。后数夜，村中婴孩先哑，后犬无声，再后成人相对而坐，渐失言语，至晓时俱成空壳。风吹过，躯壳如沙散。\n\n吾问使者：彼等可曾有痛楚？使者不能答——其舌已僵。§!\n\n信件在此中断，署名处仅余一滴干涸的墨痕。"
 libra_main.2054.a: "银丝……是某种轨道武器？"
 libra_main.2054.b: "看来作者没能写完这封信。"
 libra_main.2055.name: "高等存在的阴影"
 libra_main.2055.desc: "在城主居所更深处的密室中，研究团队发现了最后一份文献。\n\n这并非寻常文书，而是刻录于某种金属箔片上的长诗。经解译，其内容被确认为对§H高天原§!的古老祷词——此地在文本中被描绘为星辰之间的审判之所，众神议会裁决文明的生灭。\n\n其中一节写道：\n\n§H“彼等自星海垂丝，衡量吾等之罪。\n一曰僭越，以凡躯近神域；\n二曰久驻，延命脉违天道；\n三曰忘形，以铜铁代血肉。\n丝落处，言语断，形骸散，名姓归于虚无。”§!\n\n那个拥有奇异物质武器、能将时间停驻于土地上的星际文明——或许正是文献中提及的“高天原”诸神——以某种难以想象的技术，裁定了这个世界居民的“罪”。银丝垂落，言语被剥夺，名姓被抹去。一万一千年前，判决执行完毕。\n\n而这片桃源，甚至不曾意识到自己已被起诉。"
 libra_main.2055.a: "观测者放弃了它们的玩具。"
 libra_main.2055.b: "土著文明的悲惨命运。"

 libra_main_story_site_7: "将军石"
 libra_main_story_site_7_desc: "一块孤零零的巨岩，其下半部插着许多断刃，而上半部雕刻了陌生的文字，敲击岩石时可以听见清脆的回响。"
 libra_story_specimen_4: "紫阳切"
 libra_story_specimen_4_desc_short: "传说中的妖刀"
 libra_story_specimen_4_desc_details: "一位古代将军曾携带它征战四方，斩杀了无数生灵。"
 libra_main.2060.name: "扫描报告"
 libra_main.2060.desc: "岩石的主要充分异于周边环境，比起自然演化更可能是外来物。探测仪器显示岩石中央有小型空间，其下有封土，直通岩石底部。"
 libra_main.2060.a: "有趣。"
 libra_main.2061.name: "墓志铭"
 libra_main.2061.desc: "解译的刻字表明，这块岩石是一位古代将军的墓葬，原本安置在一片桃树林间，却不知为何移动至此。\n\n刻文记录了将军的生平：从青年壮志，到中年失意，最终在酒色间郁郁而终。岩石上的断刃来自与将军早年击败的对手，如今早已腐朽。刻文中不乏遗憾与批判之词，却对一位线香花火的女性褒溢有加，似乎正是这位值得尊敬的女子的逝去令这位将军一蹶不振。"
 libra_main.2061.a: "我们对陈腐之人没有敬意。"
 libra_main.2061.b: "没有更多的记述吗？"
 libra_main.2062.name: "内部调查"
 libra_main.2062.desc: "封土历经时间的消磨已经脆弱不堪，清理它们易如反掌。在岩石内部，我们找到了那位将军的遗骸——一个干枯的人形生物，旁边陪葬的是数片脱水的花瓣、一沓折叠的衣物、一双破烂的木鞋，还有一把闪亮的单刃长刀。"
 libra_main.2062.a: "生前富贵，死后凄凉。"
 libra_main.2062.b: "优先检查遗物。"
 libra_main.2063.name: "检测报告"
 libra_main.2063.desc: "取样调查的结果表明，无论是衣物、木鞋还是遗体，时间都指向大约400年前的时代，只有长刀的构成难以解析，是由强度近似零素装甲的某种物质构成，不是工业时代中会有的产物。\n\n此外，发掘者从衣物中发现了疑似信件的破碎纸张，正尝试将其还原。"
 libra_main.2063.a: "超越时代的组合？"
 libra_main.2064.name: "将军遗愿"
 libra_main.2064.desc: "这封信件是将军的遗言，他早就料到自己死后会有人来打扰。\n根据信件所述，陪葬的武士刀是他曾经最爱用的武器之一，另一把长矛“月見槍”则不知何处。就像刻文提到的那样，将军在信中缅怀了早已逝去的亡妻，而后警告读信者小心一位红头发的女性，那是人形的妖异，是万万不能取信之物。如果可能，他希望后来者能用这把妖刀为他复仇。"
 libra_main.2064.a: "收藏武器，安葬将军。"
 libra_main.2064.b: "不过笑料而已。"

 libra_main_story_site_8: "虚无残舰"
 libra_main_story_site_8_desc: "一处坠毁的巨型舰船残骸，其主体结构是半透明的金属物质。"
 libra_story_specimen_5: "玻璃金属硬件"
 libra_story_specimen_5_desc_short: "古代科技硬盘"
 libra_story_specimen_5_desc_details: "将玻璃金属作为主要材料的古代存储设备，即使经过了漫长岁月，其中储存的信息也完好无损。"
 libra_main.2070.name: "半透明之骸"
 libra_main.2070.desc: "巨型舰船斜插于冻土之中，其主体结构由某种半透明的银灰色金属构成——并非玻璃或晶体，而是致密的、具有晶体透光性的金属材质。光线射入表面后不再折返，仿佛被吞入浅水之底。\n\n残骸周围散落着大量碎块，最远的崩落至三公里外。清理队耗时六组工时，才将主舰体与坠毁冲击形成的陨石坑剥离。值得注意的是：半透明金属的断口呈现§H同时性断裂§!特征——似乎在某一瞬间，战舰被整个切断了。"
 libra_main.2070.a: "寻找舱门。"
 libra_main.2070.b: "这与我们的武器颇为相似。"
 libra_main.2071.name: "走廊尽头的霜"
 libra_main.2071.desc: "内部通道保存得出奇完好，半透明金属墙壁内部嵌有发光的脉络——某种已停止循环的能量传导系统，如今只剩微弱的余晖。通道横截面呈六边形，尺寸设计显然不服务于一般生物：其高度超出[Root.Leader.GetName]身长两倍有余，且地面无可见的阶梯或坡道。\n\n调查员在若干舱室中发现离散的物体：形似鞍座的固定装置、直径三米有余的环状屏幕、以及一尊坠落时翻倒的巨大容器，其内壁附着的干燥残留物经检测为§H烃类与氧化铁§!，这是饮水的痕迹。\n\n走廊尽头，一扇气密门半掩，门框内侧凝结着一层极薄的霜。"
 libra_main.2071.a: "继续深入。"
 libra_main.2072.name: "迟到的哨兵"
 libra_main.2072.desc: "越过第三条气密门后，调查队触发了某种装置，脉络中的光芒突然增加，走廊两侧的金属壁骤然升温至烫手的程度。一些调查设备瞬间就被熔融金属黏在原地，紧接着，从墙壁裂隙中探出细如发丝的金属纤维——它们在半空中搜索、转向，如同嗅到猎物的触须。\n\n[Root.Leader.GetName]下令紧急撤退，以定向EMP暂时瘫痪了这段走廊的能源供给。后续分析表明，这是舰船§H生物防护系统§!的残余功能：识别非认证活动物体，而后启动区域清除程序。然而该系统的布设逻辑令人费解，既不在外部舱门，也不保护弹药库，而是将最密集的火力集中于通往舰艏的走廊。\n\n这艘船的设计者，似乎更惧怕船员从内部接近舰艏，而非敌人从外部攻入。"
 libra_main.2072.a: "绕行，走另一条路。"
 libra_main.2073.name: "果壳中的刻度"
 libra_main.2073.desc: "绕道而行后，[Root.Leader.GetName]抵达舰船核心区。这是一个球形舱室，直径约三十米，半透明金属壁在此处达到近乎完全透明的纯度。站定其中时，能直接透过船壳看见外界的星空，仿佛被包裹在一颗凝固的水滴内部。\n\n舱室中央悬浮着一枚巨大的结晶柱，柱身刻满细密的符号。符号以圆周阵列分层排布，每层以不同间隔旋转。就像是某种坐标系统，指向三维空间之外的第四轴。\n\n研究小组记录下其中三组可解译的刻度指向，经定位，它们分别对应当地星图上的三个方向：一处是空旷的星际尘埃带；一处是被星界能量包围的黑洞；最后一处是这艘舰船§H坠毁的位置§!。\n\n结晶柱底部有一处残缺，如同被利刃削去。"
 libra_main.2073.a: "超越三维的坐标导航？"
 libra_main.2073.b: "残缺的部分去哪了？"
 libra_main.2074.name: "指令室"
 libra_main.2074.desc: "指令室位于球形舱室上层，通过一道狭窄的垂直通道连接。这里的设备损坏最为严重：控制台被某种高热能武器熔毁大半，座椅尽数翻倒，地面散布着细碎的、被烧灼过的颗粒，经检测为碳化有机物残留。\n\n所幸，存储终端的保护外壳仍在。[Root.Leader.GetName]带领语言研究者耗费多时才得以完成初步破译。舰船文件使用一种后缀型黏着语，语法结构古老，与本星系已知语言均无亲缘关系。但符号系统存在规律，部分字段得以还原：\n\n§H……第二十四次扫荡作战，目标星域已肃清。残余抵抗势力退守第四行星环带，判定为无威胁。\n帝国本部发来嘉奖令，大主祭对我们的效率表示满意。\n……七日内遭遇三次伏击，敌人使用的是我们淘汰的时空引擎残骸改装的自杀式撞击艇，他们学得很快。§!\n\n最后一则日志时间戳残缺，内容只有一行：§H“星系边缘上亮起上百盏灯火，他们又来了。”§!"
 libra_main.2074.a: "真是一场浩大的战争。"
 libra_main.2074.b: "具备如此科技优势的舰船居然被摧毁了。"
 libra_main.2075.name: "败绩"
 libra_main.2075.desc: "指令室最深层的存储单元被密码锁封存，破解后，调查队找到一份标注为“战术形式记录”的文件。时间戳显示，它生成于舰船结构崩溃前十七分钟。\n\n§H抵抗军第三、第七舰队突破外环防线。旗舰失联，代理指挥权限已移交本舰。§!\n\n敌人旗舰为捕获后改造的我方旧型护航舰，舷号尚未抹去，识别码仍沿用帝国标准格式。\n他们用我们的语言在通讯频道重复喊话。§!\n\n记录在此中断三秒，期间背景拾取到极低频的震动——炮击。\n\n§H……他们也呼叫着“奥米亚”§!\n\n文件就此结束，[Root.Leader.GetName]关闭了终端。\n\n证据勾勒出这样一幅图景：一个自称“帝国”的星际势力，在这片星域执行肃清作战；而“抵抗军”以缴获舰船、改装旧装备的方式，进行着迟滞但日益有力的反击。最终在某次决定性战役中，这艘帝国战舰被抵抗舰队击毁于此。\n\n「奥米亚」——他们以征服者的语言呼唤它，然后摧毁了征服者。\n\n残舰静默，霜华渐凝。星海曾见证过无数这样的故事：帝国来时如潮，去时如沙；唯有抵抗者的灯火，会在海面上一再亮起。"
 libra_main.2075.a: "颇具军事参考意义。"
 libra_main.2075.b: "为挑战巨人的古代勇士喝彩。"

 libra_main_story_site_9: "破碎星系"
 libra_main_story_site_9_desc: "一个黑洞，周围满是残骸。"
 libra_main.2080.name: "灰烬之年"
 libra_main.2080.desc: "探索者将探测阵列指向星系中心时，读数一度被误判为仪器故障。黑洞存在，这毋庸置疑——其引力透镜效应扭曲了后方所有星象，吸积盘以每秒数百公里的速度旋转。但异常在于：环绕黑洞的残骸带所含物质总量，远超形成此质量黑洞应有的前身天体。\n\n演算模型反复给出同一结论：这里原本应有一颗红巨星，质量约为14.8倍标准恒星。红巨星衰变为白矮星，再经由吸积或并合坍缩为黑洞——这才是常规路径。\n\n然而残骸带中的重元素丰度表明，红巨星死亡时，行星系内至少存在四个星际航文明的殖民地。稳定的红巨星不会直接杀死行星，它会温和地膨胀，逐渐将其外层包覆，让轨道上的世界在其大气层内部燃烧千年，如琥珀中的虫。\n\n这里发生的是另一回事，是一场有预谋的§H杀害§!。"
 libra_main.2080.a: "什么样的力量能引爆恒星？"
 libra_main.2081.name: "同时代的骨骸"
 libra_main.2081.desc: "残骸带的成分分析带来第二个悖论。\n\n碎片来源多样：舰船装甲、空间站结构、轨道环的巨型桁架、以及无法归类的事物——某种以球状石墨包裹核心的贮存容器，内部仍残留着高度压缩的大气样本，其氧氮比例恰好适配多数有机体呼吸。\n\n所有碎片表面的辐射损伤、微陨石撞击坑密度、以及氧化程度，均指向同一时间刻度。它们是§H同时死亡§!的，没有一艘战舰来得及跃迁逃离，也没有一座空间站来得及释放逃生舱。甚至那些贮存容器——或许是生物圈穹顶，或许是冷冻休眠舱——也未被发射出去。整个星系的一切造物，在某一瞬间同时失去动力，然后在接下来的数千年里缓慢漂泊，被死亡恒星的引力捕获，碾磨成带。"
 libra_main.2081.a: "我们将会解读。"
 libra_main.2082.name: "未完成的方尖碑"
 libra_main.2082.desc: "在残骸带外围，调查队发现了一块异质的碎片。它不是舰船，不是空间站，它来自一颗被改造过的§H小行星§!。其中一面被切削成近乎完美的平面，平面上矗立着七座未完成的方尖碑。碑体刻满浮雕，工艺细密，线条流畅。\n\n根据碑文判断，这是一座纪念碑，其主题是“告别流散的同胞”。浮雕描绘了船队离开母星系、在异星登陆，最终在陌生土地上建立居所的故事。最后一座方尖碑尚未雕刻完毕，只有一个人形生物仰望星空。\n\n碑文末端刻着一行小字，磨损严重，只能确认其中一词：“归来”。\n\n但是没有人归来。\n这里没有归来的船，没有归来的信，甚至没有归来的残骸。只有七座未完成的碑，讲述他们来时的故事。"
 libra_main.2082.a: "可他们的成果早已不复存在。"
 libra_main.2082.b: "像极了我们出发时的样子。"
 libra_main.2083.name: "帝国图书馆"
 libra_main.2083.desc: "一步的搜寻中，[Root.Leader.GetName]定位到一块异乎寻常的碎片，其保存近乎完好。\n\n这是一处舰载档案馆的核心存储单元，外壳铭刻着该文明已知的最高保密等级。破译文本花费了巨大精力，耗时极长——他们的文字体系以表意符为核心，语法高度依赖上下文。\n\n§H纪元4712年，危机应对委员会第一次会议纪要\n异度舰队已突破遥远的第五边疆区，其航行不依赖任何已知的方式，其作战模式无法解析，其语言与银河系任何语族均无亲缘关系。我方特使试图接触，竟遭到直接火力攻击。\n他们不接受投降，不进行谈判，不允许撤离请求。\n“我们不需要你们的一切。”\n这是我们从对方接获的唯一通讯§!"
 libra_main.2083.a: "可怕的入侵者。"
 libra_main.2084.name: "碑文与来者"
 libra_main.2084.desc: "调查工作逐渐进入尾声，能找到的资料已经少之又少。可以明确的是，在那次会议结束后的几天至几周内，中央的红巨星就以极快的速度变成了黑洞，将曾经繁荣的迹象撕扯粉粹，将这个来自星系某处的文明彻底抹灭。"
 libra_main.2084.a: "也许他们的母星尚且无恙。"
 libra_main.2084.b: "是何人为毁灭而侵略？"

 libra_main_story_site_10: "大神殿"
 libra_main_story_site_10_desc: "一处荒芜的古代星系帝国城市，防御设施、居住区和中央神殿都保存完好，有自动化机械在其中巡逻。"
 r_libra_main_story_1: "终末指南书"
 r_libra_main_story_1_desc: "当我们的考古人员离开神殿时，这本古书就已经出现在科研船的控制室中了。"
 libra_main.2090.name: "静默哨兵"
 libra_main.2090.desc: "[Root.Leader.GetName]的团队接近城市废墟时，最先迎接他们的是激光瞄准器的光点。\n\n三架悬浮无人机从建筑阴影中升起，机身呈完美的正三角锥形，表面无任何标识。它们未发出警告，未询问身份，直接开火，但被我们的护盾拦下。能量束的灼热感即使在宇航服内部也能隐约感知，表明这是相当强力的军用级武器。\n\n交火持续七分钟，无人机被击毁两架，一架撤退消失在建筑群中。调查队有一人轻伤，其装甲表面留下熔融的痕迹。\n\n残骸分析显示，这些无人机使用一种基于常温超导的等离子技术，能量密度极高。它们的制造时间约在三千年前，但磨损程度极，似乎刚服役不久。\n\n穿过被击毁的无人机残骸，遗址外围的大门敞开着。"
 libra_main.2090.a: "打包无人机残骸，带回研究。"
 libra_main.2090.b: "小心警戒之后的敌人。"
 libra_main.2091.name: "钢铁荆棘"
 libra_main.2091.desc: "进入外围防御带后，调查队得以一窥这座城市的防御哲学。\n\n这里没有寻常的炮塔阵列或护盾发生器，取而代之的是嵌入地面的六边形金属板、每隔百米一根的细长尖塔、以及铺设在建筑表面的暗色网状结构。经扫描确认，它们共同构成一套分布式点防御系统——任何来袭的物体，无论是导弹还是小型飞行器，都会在接近时被网状结构感应，由金属板投射出能量阻击，再由尖塔发射的高能激光汽化残余。\n\n这套系统的设计冗余极高，即使半数组件失效，剩余部分仍能覆盖整座城市。\n\n更令[Root.Leader.GetName]在意的是其§H能量来源§!，尖塔底部连接着深入地下数公里的导管——这座城市从行星深处直接抽取地热能，再以无线方式传输给所有防御节点。\n\n这意味着三千年里，城市的主人离开了，这套系统却§H从未停转§!，如果我们没有从正门进入，后果将不堪设想。"
 libra_main.2091.a: "难以想象的技术。"
 libra_main.2092.name: "巡逻路径"
 libra_main.2092.desc: "沿主要街道深入约两公里后，第二批无人机出现。这次是十二架，编队整齐，以网格模式执行扫描。在它们的传感器在探测到调查队后，队形骤然散开，从三面合围而来。\n\n交火在居住区入口处爆发，此次的无人机携带了更重的武器，使两名队员受伤。但凭借单兵护盾和精准射击，调查队最终将其全歼，代价则是三分之一的弹药储备，和两面便携式能量护盾报废。\n\n越过战场，居住区的轮廓在暮色中浮现。建筑整齐如棋盘，街道宽阔笔直，所有门窗的尺寸完全一致。\n\n但这里没有任何灯光，没有任何声音，没有任何移动的物体。只有风穿过空荡的窗格，发出低沉的呜咽。"
 libra_main.2092.a: "整理装备，再行探索。"
 libra_main.2093.name: "无菌之巢"
 libra_main.2093.desc: "居住区的内部景象令所有人困惑，建筑内部没有任何生活痕迹。家具、衣物、餐具、装饰……任何迹象通通没有。墙壁是光滑的合金板材，地面覆盖着极薄的抗菌涂层，空气中弥漫着臭氧和工业清洁剂的气味，一切光洁如新，不像是空置了三千年的样子。\n\n[Root.Leader.GetName]指挥研究者采集空气样本，分析结果显示，空气中含有微量的§H纳米机器人§!残留物，这些机器人负责分解一切有机碎屑、尘埃、甚至微生物，将其转化为基础元素，排出建筑外。三千年来，它们日复一日地擦拭着无人居住的房间，直到今天。\n\n但真正令人不安的是另一点：所有建筑的储物空间、壁柜、甚至地板下的隐藏夹层，都是§H空的§!。居住者离开时，带走了每一件物品，仿佛他们从未打算回来，也绝不允许任何人了解他们的生活。"
 libra_main.2093.a: "追踪纳米机器人的指令源，或许能定位控制中心。"
 libra_main.2094.name: "荆棘之隙"
 libra_main.2094.desc: "根据防御系统的能量传输图，我们找到了一条巡逻盲区。它位于两条地热能导管之间的缝隙中——传感器在这里被互感效应干扰，无法精确识别小型目标。\n\n调查队沿着这条狭窄的路径，缓慢向城市核心区的神殿移动。两侧是高耸的建筑，窗洞如空洞的眼眶注视着他们，偶尔有无人机编队在头顶掠过，但始终没有触发警报。\n\n穿过最后一道由废弃工程机械构成的屏障后，大神殿的全貌展现在眼前。它没有尖顶，没有神像，没有彩窗；是一座巨大的、半埋于地下的正二十面体，每个面由深色金属构成，表面密布着缓慢呼吸般明暗交替的光纤网络。神殿的入口位于正对调查队的一面，门楣上刻着唯一一组符号：一个圆环套着另一个圆环，圆心处是一个点。\n\n终末。回归。原点。\n\n语言学家尚未解读出它的含义，但所有人都感受到某种宗教般的肃穆。"
 libra_main.2094.a: "进入神殿。"
 libra_main.2094.b: "这个符号……似曾相识？"
 libra_main.2095.name: "神殿卫士"
 libra_main.2095.desc: "神殿地下的通道远比地面建筑宽广,调查队沿斜坡下行约两百米，抵达第一个大厅时，灯光骤然亮起。\n\n不是普通的无人机，而是四台重型战斗机器人，高度四米，装配多足底盘和六条武装臂，臂端分别搭载着等离子炮、速射电磁炮、以及某种§H从未见过的力场投射器§!。它们的装甲上覆盖着与门楣相同的符号，在没有警告或对峙的情况下同时开火。\n等离子束将大厅的金属柱熔成两截，电磁炮弹在护盾上炸出刺目的闪光。而那台力场机器人投射出无形的冲击波，将被击中的岩壁瞬间化为齑粉。\n\n调查队依托掩体还击，动用了所有重武器。最终有三名队员重伤，两台机器人被摧毁，剩余两台在受损后撤入更深处的走廊。\n\n当烟雾散尽，[Root.Leader.GetName]在力场机器人的残骸中找到了一块半熔融的数据核心。"
 libra_main.2095.a: "希望伤者平安。"
 libra_main.2095.b: "回收数据核心，这是重要情报。"
 libra_main.2096.name: "离去之日"
 libra_main.2096.desc: "绕过被摧毁的机器人，调查队进入神殿核心——资料库。\n\n这是一个半球形大厅，墙壁上布满晶体存储单元。中央控制台仍在运行，其界面以陌生的符号呈现，但可以通过全息投影交互。[Root.Leader.GetName]下令下载所有可访问的数据，然而，绝大多数存储单元已被§H物理销毁§!——晶体表面有被高温融化的痕迹，时间约在三千年前。唯一保留完整的是一个日志文件，记录着最后一批人员的撤离：\n\n§H归正历5231年，第37周期，第6日。所有人员已撤离至“净化之翼”。神殿自动化系统维持运行，清除程序执行完毕。愿终末接纳此地的奉献。§!\n\n就在此时，警报响起，传感器显示城市中所有剩余的无人机正在向神殿集结，[Root.Leader.GetName]当机立断，指挥所有成员撤离。调查队冲出神殿时，第一波无人机已进入视线。激光束在他们身后炸开墙壁，尘埃与碎石弥漫通道。但他们更快——越过那些空旷的街道，跑过那些无菌的居住区，穿过那些沉默的防御塔。\n\n当最后一辆运输车升空脱离大气层时，[Root.Leader.GetName]回头望去。城市依旧静默，灯光依旧明灭，无人机群盘旋在神殿上空，如同围绕圣骸的飞虫。三千年来它们守护着空无一人的神殿，在未来的几十年里，仍会继续下去。"
 libra_main.2096.a: "标记为高危遗迹，禁止民间探索。"
 libra_main.2096.b: "归正会，又是哪来的异端团体？"

 libra_main_story_site_11: "无边废土"
 libra_main_story_site_11_desc: "一个遍布废墟的剧毒星球，上边布满战争遗迹。"
 libra_story_specimen_6: "永无地"
 libra_story_specimen_6_desc_short: "一组拍摄于战争废土的照片"
 libra_story_specimen_6_desc_details: "光芒穿过毒云，将荒原染成暗红色……所有的所有，告解人们战争的残酷。"
 libra_main.2100.name: "蚀骨之风"
 libra_main.2100.desc: "[Root.Leader.GetName]的登陆艇穿透云层时，传感器读数开始尖叫，行星大气中的腐蚀性物质远超一般剧毒星球。第一批采样机器人出舱后七分钟，传动关节开始卡顿——酸雾侵蚀了润滑涂层。二十分钟内，四台机器人失联三台，最后一台的摄像头传回了荒原上遍布的残骸，某种大型结构物的轮廓，以及自己镜头上的腐蚀液痕的画面。\n\n[Root.Leader.GetName]下令全员撤回，更换为全密封勘探装备。新一批机器人涂覆了多层耐酸材料，传感器窗口以蓝宝石晶体替代玻璃。代价则是数天时间和大量预算，但无人抱怨。"
 libra_main.2100.a: "开始正式勘探。"
 libra_main.2101.name: "铁锈之林"
 libra_main.2101.desc: "废土之上，遗迹如森林般矗立。勘探队花了三天时间才初步划定遗址范围：从低轨道俯瞰，它覆盖了整片大陆的三分之一。曾经的军事设施层层叠叠——被击毁的舰船残骸、坍塌的机库、半埋的炮台基座、以及纵横交错的战壕与掩体。所有建筑都采用同一种设计语言：粗犷、厚重、优先考虑防护而非舒适。\n\n但最令人震撼的不是规模，而是§H密度§!。这片大陆的每一寸土地都被反复争夺过，弹坑套着弹坑，残骸压着残骸。某些区域的金属碎屑堆积如山，经检测来自至少四种不同的装甲合金。\n\n在战场的某一处，勘探队发现了一具巨大的战争机器残骸——或者说是它的下半部分。上半身被某种高能武器彻底汽化，熔融的金属向下流淌，凝固成钟乳石般的垂挂。残骸内部，一条尚未完全损毁的生产线仍在微弱的脉冲驱动下缓慢运转，试图修复永远等不到的援军。从放射性元素分析，它已经这样运转了六千五百年。"
 libra_main.2101.a: "这是一场怎样的战争……"
 libra_main.2101.b: "追踪生产线，或许能找到识别双方的线索。"
 libra_main.2102.name: "炮台的记忆"
 libra_main.2102.desc: "在一处相对完整的高地，勘探队找到了一处重型要塞炮。它指向北方，炮身仰角固定，弹仓早已清空。炮塔基座下方掩埋着一间指挥室，密封门被爆炸冲击波震裂，内部设备部分幸存。\n\n数据存储器被成功修复。日志时间跨度约三个月，记录了这个炮台在一场战役中的运作：\n\n§H第1日：北方空域舰队出现；数量：51；类型：大型混合编队；开火迎击。\n第8日：敌方登陆部队突破第二道防线，炮台转入对地模式，已确认击毁敌方重型单位：129。\n第22日：本阵地遭受第七次轨道轰炸，三号炮塔损毁，维修机器人已全部派出。」\n§第41日：弹药剩余3%，敌方攻势未减。指挥部命令：死守。\n第42日：……§!\n\n日志在此处有一段长达四十八小时的空白，恢复后的内容仅有一行：\n\n§H他们来了。炮口向下，愿终末接纳吾等献身。§!\n\n日志结束于六千五百年前。根据上下文，这座炮台属于北方舰队的敌人，而敌人的名字未被记录。\n\n此外勘探队扫描炮身铭文时，发现了一组蚀刻的符号：一个圆环，套着另一个圆环，圆心处是一个点。"
 libra_main.2102.a: "这个符号……似曾相识。"
 libra_main.2102.b: "终末…是什么？"
 libra_main.2103.name: "敌我同源"
 libra_main.2103.desc: "勘探队在北方舰队的迫降区域找到了答案。那是一艘巨型战舰的残骸——或者说是它的前半段。舰首斜插在腐蚀的金属地面上，驾驶舱碎裂，内部被六千五百年的酸雨侵蚀成蜂窝状。\n\n但舰体外壳上，有一组符号清晰可辨：一个圆环，套着另一个圆环，圆心处是一个点。\n\n完全一致。\n\n[Root.Leader.GetName]盯着扫描图像沉默良久，防御方用这个符号，进攻方也用这个符号。他们在同一颗星球上，以最惨烈的方式厮杀到最后一兵一卒，却佩戴着相同的徽记。\n\n进一步的调查带来更多悖论：残骸中的个人日志碎片——如果那些烧焦的、部分熔融的金属片可以称为“个人”，显示双方的日常用语是§H同一种语言§!的不同方言。语法结构完全一致，只是词汇选择和口音有异。\n\n他们来自同一个文明——他们曾是同胞。"
 libra_main.2103.a: "这是……内战？"
 libra_main.2104.name: "两种形态"
 libra_main.2104.desc: "在战场中部的低谷，勘探队发现了双方士兵的遗骸。\n\n防御方的遗体保存状况较差，但仍可辨识基本形态：人形，身高约两米，骨骼结构与类人生物相似，但肋骨数量是寻常的两倍，且颅骨后部有明显的植入物接口。部分遗骸的脊柱与金属椎骨融合，手臂骨骼内嵌有动力增强纤维。他们是生物与机械的§H融合体§!。生来如此，或改造至此，已无从考证。\n\n进攻方的遗骸则截然不同：纯机械结构，全金属骨架，关节处覆盖着柔性装甲，头颅是半球形的传感器阵列，胸腔内空无一物。他们是纯粹的§H机械体§!，但他们的残骸上同样刻着那个圆环套圆环的符号。\n\n两个形态迥异的族群，用同一种语言，戴同一个徽记，在这片废土上交战。\n\n[Root.Leader.GetName]认为，奥米亚——这个名称所指代的文明，曾因某种根本性分歧分裂为两个敌对的派系。一方选择生物与机械的融合，另一方走向完全的机械飞升。分歧演变为内战，内战升级为灭绝。这颗星球是无数战场之一。\n\n这是一个合理的推论。\n但它有一个问题。"
 libra_main.2104.a: "继续研究。"
 libra_main.2104.b: "会是什么问题？"
 libra_main.2105.name: "同源异路"
 libra_main.2105.desc: "勘探队对双方残骸中的武器装备进行了系统性比对，结果令人困惑：双方的能量武器均基于相同的原理——常温超导线圈加速等离子体；双方的动能武器使用相同的口径——虽然弹头设计略有差异。双方的装甲合金成分在光谱分析中呈现几乎§H一致§!的元素配比，只是冶炼工艺导致晶格结构不同。\n\n他们的技术年代完全一致，他们的技术路线同出一源，但他们的§H制式§!差异极大。\n\n防御方的武器采用模块化设计，零件可互换，维修便捷；进攻方的武器是一体化铸造，性能略优，但损坏即报废。防御方的能源接口是通用型，任何设备都可接入；进攻方的接口是专用型，彼此不兼容。防御方的通讯协议是开放的，可在残骸中截获到大量广播数据；进攻方的通讯是加密的，六千五百年后仍无法破解……\n\n这不像内战，内战中的双方总会拥有共同的技术遗产，只是应用方式不同。这更像是……\n\n两个族群，同源的技术，截然不同的设计哲学。他们或许从未属于同一个社会。他们或许只是碰巧用了相同的符号，说了相同的语言，却在一切根本问题上分道扬镳。\n\n但遗址不能提供更多信息了。六千五百年的酸雨侵蚀了太多痕迹。那些未解的疑问——他们来自哪里，为何而战，谁赢了，谁输了——将永远埋藏在这片无边废土之下，等待永远不会到来的回答。\n\n勘探队收拾设备，准备撤离。最后一缕光芒穿过毒云，将荒原染成暗红色。残骸的影子拉得很长，如同无数伸向天空的手。"
 libra_main.2105.a: "它们曾经是同胞。"
 libra_main.2105.b: "或者，从来不是。"

 libra_main_story_site_12: "远古星港"
 libra_main_story_site_12_desc: "一处废弃的古代星港绕着中央天体漂泊，经检测已有万年。"
 libra_story_specimen_7: "远古星港设计图"
 libra_story_specimen_7_desc_short: "古代星港的扫描记录"
 libra_story_specimen_7_desc_details: "一处设计新颖而前卫的星港，让人难以想象是18000年前的古迹。"
 libra_main.2110.name: "异星几何学"
 libra_main.2110.desc: "星港绕着一颗暗淡的白矮星缓缓旋转，主体结构呈不完整的双环嵌套——外环倾斜三十七度，内环垂直于舰船常用的人造重力方向。六个巨大的悬臂从双环交汇处延伸而出，末端连接着船坞、仓库、以及无法辨认功能的球形舱室。\n\n通道的横截面是正六边形，门框是拱形但拱顶位于侧面，舷窗的排列方式不遵循任何对称轴。这不是为人型生物设计的建筑——甚至不是为任何以直立行走为常态的生物设计的。\n\n然而它确实被建造出来了，且在太空中运转了漫长岁月。外环某些部分的装甲厚度达到二十米，足以抵御微陨石轰击数万年；内环表面覆盖着密集的散热鳍片，其总面积暗示着这里曾消耗过天文数字的能量。"
 libra_main.2110.a: "一万八千年前的前卫设计。"
 libra_main.2111.name: "锈蚀的奇迹"
 libra_main.2111.desc: "进入星港内部后，勘探队的第一印象是：宏伟。\n主通道高三十米，宽五十米，足以让小型战舰并排行进。墙壁上嵌着直径两米的管道，内部仍残留着微量惰性气体；天花板上每隔十米设有一组照明装置，尽管早已熄灭，其精密的光学透镜仍折射着勘探队员的头灯光芒。\n\n但随着勘察深入，第二印象浮现：§H过时§!。\n那些管道传输的是劣质液态冷却剂，而现代舰船的冷却系统，效率更高、维护更简单；照明装置使用廉价钨丝发光——工业时代的技术，如今连民用设施都很少采用。能量传输系统是铜制母线，而非超导传输；数据存储单元是磁性介质盘片，而非晶体全息矩阵；就连气密门的气压密封机制，也高度依赖机械锁扣。设施的设计理念超前于其时代，但如今已没有参考价值。\n\n一万八千年前，这座星港曾是某个文明的骄傲。他们在此集结舰队，规划航线，或许还向星空宣誓忠诚。如今，它只是飘浮在太空中的古董。"
 libra_main.2111.a: "继续勘察。"
 libra_main.2111.b: "历史价值不因技术落后而减损。"
 libra_main.2112.name: "未完成的航行"
 libra_main.2112.desc: "沿着六号悬臂前行，勘探队抵达星港的核心功能区——主船坞。这是一个直径八百米的球形空间，足以容纳整艘战舰。巨大的船坞框架如同金属肋骨，从球壁向内延伸，将一艘半毁的战舰固定在中央。\n\n战舰长约万米，设计与星港一致：非对称、非常规、非类人。其舰艏被某种武器击穿，熔融的金属向内翻卷，形成花瓣状的创口；舰身左侧三分之一被彻底切除，断口处暴露着密密麻麻的线缆和管道；舰尾引擎舱被炸开一个巨洞，从中可以看见四台推进器中仅剩的一台勉强保持完整。\n\n船坞框架上的维修机器人早已不再工作，凝固在六千年前的最后姿态中——有的悬停在半空，机械臂指向伤口；有的倒在战舰表面，光学镜头碎裂；有的挤在船坞入口处，似乎正要离开。\n\n一万八千年前，这艘战舰被拖入船坞，等待修复，但修复从未完成。\n\n某种力量让维修戛然而止，让机器人永远静止，让这艘战舰在船坞中停泊了比一般文明史还要漫长的时间。\n\n它永远不会启航了。"
 libra_main.2112.a: "归档记录。"
 libra_main.2113.name: "空荡的王座"
 libra_main.2113.desc: "央指挥室位于内环的最深处，被层层防护门包围，室内空间则呈椭圆形，墙壁上密布着早已熄灭的屏幕和控制台。指挥席位于椭圆的一个焦点上，形状如半张开的贝壳，内部衬垫被漫长岁月压成薄片。\n\n勘探队启动便携式扫描仪，试图从控制台中提取数据，但结果是彻底的失败，因为所有存储单元均被§H物理销毁§!。唯一幸存的是控制台表面的一块铭牌，以耐腐蚀合金制成，上面刻着两行文字：\n\n第一行：圆环套圆环，圆心一点。\n第二行：§H终末见证一切。此处无物可留。§!\n\n这句话的含义令人不安，他们离开时，带走了所有信息，只留下空荡的指挥室、废弃的星港、以及一艘半毁的、永远修不好的战舰。\n\n他们不想让任何人了解自己。\n或者，不想让§H某种东西§!了解自己。"
 libra_main.2113.a: "做得真彻底。"
 libra_main.2114.name: "遗留之物"
 libra_main.2114.desc: "发掘结束，撤离前的最后一日，[Root.Leader.GetName]独自回到船坞。\n\n那艘半毁的战舰仍在原处，被船坞框架托举着，如同献祭给星辰的祭品。它在这里停泊了一万八千年，比绝大多数文明的历史还要漫长。[Root.Leader.GetName]在助手的帮助下取下了一块装甲样本，其分析结果已事先知晓：合金成分与当代舰船完全不同，强度略低，耐热性略差，但含有今已很少使用的一种稀土元素。一万八千年前的冶金工艺，自有其时代的合理性。\n\n“过时”不等于“无用”，它只是不再被需要。\n\n科研船缓缓驶离，舷窗外，星港的双环结构在星光下缓缓旋转，倾斜的外环与垂直的内环构成某种永恒的几何……和一万八千年前一样。"
 libra_main.2114.a: "返航。"

 libra_main_story_site_13: "寂静之坟"
 libra_main_story_site_13_desc: "大量太空生物的尸体堆积在这个星系，却完全没有腐败的痕迹。"
 libra_story_specimen_8: "以太侵蚀组织"
 libra_story_specimen_8_desc_short: "以太浸染的太空生物切片"
 libra_story_specimen_8_desc_details: "岩居兽触须横截面样本，生物组织失去了原本的颜色而变得透明。"
 libra_main.2120.name: "星海墓场"
 libra_main.2120.desc: "数以千计的太空生物尸骸，静静地漂浮在半径七百万公里的球形空间内。它们保持着死亡的姿态——有的蜷缩，有的伸展，有的仿佛仍在游动。最小的不过小型穿梭船尺寸，最大的那一头太空鲸，其骨架足以容纳整艘战列舰。\n\n物种数量多得惊人，几乎涵盖了所有常见的大型太空生物。变形虫的柔软躯体已凝固成半透明的胶质，岩居兽的多足附肢交错如枯枝，太空鲸的脊骨在星光下泛着惨白，虚空虫的环节状身躯扭曲成不可思议的几何形状。它们来自不同的星域，不同的生态位，不同的演化分支——却在此处汇聚成一座星海墓场。\n\n更令人不安的是：所有尸骸都§H没有腐败痕迹§!。\n\n变形虫的胶质没有液化，岩居兽的外壳没有苔藓，太空鲸的腹腔没有塌陷，虚空虫的环节没有分离……它们死了——或许是数千年，或许是数百万年——但它们的躯体拒绝回归星尘。"
 libra_main.2120.a: "开始采样分析。"
 libra_main.2120.b: "什么人会在这里布置墓场？"
 libra_main.2121.name: "不速之客"
 libra_main.2121.desc: "分析数据显示：所有样本的组织间隙中都填充着微量但均匀的§H未知物质§!。其分子结构不属于任何已知有机或无机物，其存在方式介于「填充」与「渗透」之间——它占据了细胞本该腐败后腾出的空间，却未参与任何生化反应。\n\n更关键的是：它抑制了分解者。\n\n太空中本有成百上千种微生物、噬菌体、以及专门以尸体为食的寄生生物。它们会第一时间附着在死亡生物体上，启动分解循环。但在这片墓场中，没有任何分解者存在。它们靠近尸骸后便失去活性，如同被抽走灵魂。\n这种异度物质对生命本身无毒——却对§H分解生命的过程§!致命。"
 libra_main.2121.a: "继续分离样本，寻找来源。"
 libra_main.2122.name: "无痕的缰绳"
 libra_main.2122.desc: "对一具太空鲸遗骸的解剖工作持续了六组工时，当最后一层保护组织被剥离，解剖团队面对的是直径三米的神经节——太空鲸的“大脑”。在自然状态下，这个器官会在死亡后迅速降解，数年内只剩空腔。但眼前的神经节保持着近乎完好的形态，那神秘的异度物质将其每一个神经元固定成生前的模样。\n\n神经接口专家开始扫描，他原本预期会发现某种植入物——芯片、电极、纳米纤维——用于操控这头巨兽的行为，这是「操纵」的常识手段，但他什么都没找到。\n\n然而，神经元的连接方式……不正常。太空鲸的神经结构本应为适应自主生存而演化，但此处的连接模式呈现出高度有序的重复。某些神经元集群被反复激活过的痕迹，形成固定的神经回路——这不是自然演化的结果，而是§H训练§!或§H引导§!留下的印记。\n\n就像一匹马被反复骑乘后，肌肉记住的步态。"
 libra_main.2122.a: "这是怎么做到的？"
 libra_main.2123.name: "脆弱的存续"
 libra_main.2123.desc: "异度物质的深入研究带来新的困惑，物理实验员尝试将其从组织样本中分离——失败了。每当分离过程进行到某个时点，这种物质便§H瞬间消失§!，没有衰变产物，没有能量释放，只是从存在变成不存在。\n\n进一步的实验揭示其特性：这种物质§H不能脱离实体而继续存在§!，它需要依附于某种“宿主”结构——细胞、纤维、甚至细胞间的空隙——一旦被剥离，即归于虚无。\n\n但它并非生命，不繁殖，不代谢，不响应任何生物刺激。它只「存在」。如同冰保存尸体，它保存这些遗骸。只是冰会融化，而它不会——除非被强行剥离。\n\n这种物质的存在方式，像极了传说中的某种东西：\n\n以太。\n\n那个被某些通灵者挂在嘴边的、不可捉摸的、介于能量与物质之间的「第五元素」。\n\n但以太是流动的，是活跃的，是生命的另一种形式——而这东西静止、沉默、如棺材内壁的绒布。\n\n它是什么？"
 libra_main.2123.a: "继续寻找能量残留。"
 libra_main.2124.name: "余烬"
 libra_main.2124.desc: "索范围扩大至墓场外围。在一具靠近星系边缘的虚空虫遗骸上，调查队有了发现。\n\n这具尸骸与其他不同，它的外骨骼表面散布着微弱的§H灼烧痕迹§!——不是武器造成的伤痕，而是一种从内部向外溢出的能量灼痕。痕迹呈放射状，从某个中心点向四周扩散。光谱分析显示，灼烧区域残留着极高强度的能量残余，其波形与任何已知能量武器或动能冲击均不匹配。它更接近于灵能者在极端情绪下溢出的力量，但强度高出数个数量级。最关键的是：灼烧痕迹与异度物质存在§H相关性§!：灼烧越密集的区域，异度物质浓度越低。仿佛能量释放消耗了那种物质，将其从实体中驱离。\n\n调查队追溯能量残留的来源，它不是武器造成的，它来自虚空虫§H体内§!。这头虚空虫死前，体内曾涌出巨大的能量，那种能量留下了灼痕，也带走了异度物质。而那种能量，与异度物质§H性质相反，本源相同§!。\n\n一个流动，一个凝固，如同同一枚硬币的两面。"
 libra_main.2124.a: "异度物质是凝固的能量？"
 libra_main.2124.b: "记录能量波形。"
 libra_main.2125.name: "死灵书"
 libra_main.2125.desc: "如果将异度物质称为凝固以太，而把能量残留视为流动以太，那么这些神经系统的异常连接模式就可以认为是以太操控的印记。\n\n这些太空生物并非自然死亡，也非被武器屠戮。它们曾经是某支力量的工具——被以太能量驯化、驾驭、编组成军。而这片墓场，是这支军队的葬身之地。从虚空虫残骸的灼烧痕迹，我们可以推测：某种变故导致以太失控了，凝固的以太试图维持控制，流动的以太试图挣脱。二者冲突，撕裂了这些生物的躯体与灵魂。\n\n所有的尸骸都停住了，停在被撕裂的那一瞬间。\n\n是谁驯化了它们？是谁失去了它们？[Root.Leader.GetName]查阅档案，想起宇宙中那些罕见但确实存在的案例：死灵技术。以某种能量驱动亡者——或亡者的躯体——为己所用。通常需要复杂的仪式、精密的植入物或寄生体、还有持续的维护。但如果有一种能量，可以绕过所有中间步骤，直接作用于生命的神经与灵魂……如果那种能量，是流动的、可塑的、可以被“意愿”本身引导的…以太……那么，一支由完全自动的死灵舰队，并非不可能。\n\n§H寂静之坟，死者停留之地，生者勿近。§!"
 libra_main.2125.a: "也许我们需要以太的更多知识。"
 libra_main.2125.b: "看来我们无法让它们再复活一次。"

 libra_main_story_site_14: "砂之碑"
 libra_main_story_site_14_desc: "一座巨大的方尖碑，半埋在流沙之中，碑身刻有异形文字。"
 libra_story_specimen_9: "砂之碑摹版"
 libra_story_specimen_9_desc_short: "方尖碑刻文的电子扫描版"
 libra_story_specimen_9_desc_details: "讲述了一个文明的历史。"
 libra_main.2130.name: "沙海遗孤"
 libra_main.2130.desc: "科研船在行星轨道上便已捕捉到它的轮廓——一座黑色的方尖碑，半截没入橙红色的沙海，另半截在恒星残照下投出狭长的阴影。\n\n登陆队在沙暴间歇期抵达碑前，碑身高约四十米，材质为某种黑色火成岩，表面经精密打磨，即使用最敏感的触觉也难以察觉拼接缝隙。碳十四测定无法直接用于岩石，但周围沙层中包裹的微小陨石颗粒显示，这座碑在此处矗立的岁月至少以十万年计。\n\n碑顶，在风沙磨蚀最剧烈的位置，一组符号依然清晰可辨：一个圆环，套着另一个圆环，圆心处是一个点。\n\n语言学家注视着这枚印记，低声说出在某些遗址中反复出现的名字：“终末”。"
 libra_main.2130.a: "开始系统性扫描碑文。"
 libra_main.2131.name: "艾尔达之忆"
 libra_main.2131.desc: "碑文以密集的表意符号刻成，字体工整，排列如棋盘。语言学家耗费两周时间建立起初步的字符对应表——这种文字以单音节词根为基础，通过叠加符号构成复合概念，其语法结构简单但表意精准。\n\n破译的第一段文本揭开了碑文主人的身份：\n\n§H吾族名艾尔达，生于星辰垂爱之地。掌中自有焰光，心中自有雷霆。先祖称之为「魔力」，以之耕云播雨，以之驱山逐海。彼时天地未分，人神共居。§!\n\n配图浮雕描绘着人形生物以手掌释放光芒，令植物生长、令岩石开裂、令水流改道。他们身材修长，面容柔和，与现今银河系多数类人种族存在相似之处，却又带着难以言喻的异质感。\n\n这是他们文明的开端——拥有被称为「魔力」的异能，与自然和谐共存。但这段碑文就此结束，接着是另一段截然不同的叙述。"
 libra_main.2131.a: "继续翻译。"
 libra_main.2131.b: "魔力？"
 libra_main.2132.name: "天启之日"
 libra_main.2132.desc: "下一段碑文以更深的刻痕凿出，仿佛书写者想要强调其重要性：\n\n§H古时吾族敬奉丰饶之母，以初穗与初子献于祭坛。母神微笑，风雨顺时，五谷不绝。§!\n\n浮雕上，艾尔达人围绕一尊丰腴的女性神像起舞，神像手中持有麦穗与果实。但紧接着，画面骤然阴郁：\n\n§H一日，天裂。有光自裂隙中垂落，其色如死灰，其声如婴泣。光中现形，无面，无肢，无言。但吾族皆知其所宣示——奥米亚，终末之神。母神噤声，祭坛崩摧。自此，吾族知世有终始，命有尽时。§!\n\n碑文没有描述战争或强迫。那道光只是显现，便让整个文明改变了信仰。语言学家反复推敲那段文字，最终确认其措辞：艾尔达人视此为§H天启§!，他们接受了终末。"
 libra_main.2132.a: "无面的存在，是真神还是臆想？"
 libra_main.2132.b: "继续挖掘，下面的碑文应该更多。"
 libra_main.2133.name: "繁荣千年"
 libra_main.2133.desc: "沙层之下，碑身延伸。挖掘队向下清理出十五米，新的碑文显现：\n\n§H终末既知，吾族乃以魔力探幽索隐。昔日求丰饶，今日求尽处。魔力者，终末之先声也。魔力强者，近终末者，得大智慧。§!\n\n浮雕内容发生了明显变化：艾尔达人不再围绕丰饶女神，而是仰望星空，双手释放的光芒更加炽烈。画面中开始出现个体差异：有的光芒强烈，有的微弱，而光芒强烈者被其他人环绕，如同导师或君王。\n\n§H初时，魔力强者相争，山河崩裂，血染长河。然终末之眼注视，强者渐悟相争无益。乃立盟约，以魔力深浅定尊卑，以终末为念，教化万民。自此，吾族步入千年繁荣，宫阙连云，舟舰渡星，魔力所至，无所不能。§!\n\n碑文记载了一个在终末信仰下走向空前强盛的文明。魔力个体涌现，社会以魔力等级分层，却维持了长久的和平与进步。他们建造了跨越星海的舰船，开始探索宇宙。"
 libra_main.2133.a: "后来呢？"
 libra_main.2134.name: "远方的终末"
 libra_main.2134.desc: "挖掘到达碑身底部，最后一段碑文刻在最下方：\n\n§H千年繁荣，吾族足迹遍及群星。然终末始终在前，不曾稍近。若终末在远方，吾辈当往远方求之。选魔力最盛者，登巨舟，向星河深处去。余者留此，候其音信。§!\n\n浮雕描绘巨大的舰船升空，甲板上站满光芒炽烈的人形，向着黑暗的宇宙深处航行。他们身后，母星上的人们举手相送，神情平静——甚至带着期待。\n\n碑身下方再无刻字，只有未经雕琢的天然岩石。十万年过去了，那些向远方求终末的艾尔达人从未归来，也从未传来任何音信。留在此处的族人呢？他们等到了什么？\n\n碑文没有说明，风沙湮没了答案。只有这座碑，静静立在沙漠中，等待永远不会发生的重逢。"
 libra_main.2134.a: "他们去寻找终末，却消失在了星海里。"
 libra_main.2134.b: "那个“远方”……"

 libra_main_story_site_15: "遗忘之山"
 libra_main_story_site_15_desc: "某种近似灵能的力量制约着山谷，进入的人可以安全返回却几乎没有期间的记忆，似乎在掩藏着什么。"
 libra_story_specimen_10: "忘却之尘"
 libra_story_specimen_10_desc_short: "遗忘山谷中的器物在触碰之时就会粉碎，留下这些粉尘"
 libra_story_specimen_10_desc_details: "暗藏灵能力量，并且还在不断地吸附周围环境中的泽洛尘。"
 libra_main.2140.name: "雾中轮廓"
 libra_main.2140.desc: "探索船队在轨道上便已察觉异常：山谷区域上空所有频段的扫描信号均呈现不同程度的衰减，学成像模糊如透过毛玻璃，雷达回波被某种场域扭曲成无法解译的噪点。登陆队在山谷入口处建立前哨时，传感器在此处的有效探测距离不足百米，通讯延迟竟高达三秒——信号似乎在山谷内经历了漫长的折射才艰难逸出。\n\n但[Root.Leader.GetName]注意到一个细节：当设备中掺入微量§H泽洛§!晶体作为滤波介质时，信号清晰度显著提升。泽洛——这种已知能增强灵能感应的稀有物质——在此处起到了某种对抗干扰的作用。山谷在拒绝被窥探，但它对灵能敏感的介质，似乎网开一面。\n\n[Root.Leader.GetName]下令在探测设备中加装泽洛组件，准备首次试探性进入。"
 libra_main.2140.a: "准备进入。"
 libra_main.2141.name: "无痕之径"
 libra_main.2141.desc: "批进入的队员携带着强化通讯设备，其信号通过泽洛中继器以定向波束传回前哨。\n\n他们走了三小时，当第一批队员走出山谷时，[Root.Leader.GetName]迎上前去，却发现所有人眼中都带着空洞的茫然。他们记得进入山谷的决定，记得迈出第一步，然后……什么都没有了。三小时的记忆被完整切除，连梦境般的碎片都不曾留下。\n\n幸运的是，实时通讯展示了一切。在生成的录音文件中，队员们的声音起初清晰，描述着逐渐浓厚的雾气、脚下从未见过的植物、以及一种「被注视」的感觉。随着深入，信号开始断断续续，但关键片段被保留：\n……这里有一种能量……不是灵能，但类似……它在扫描我们……\n……前方有建筑轮廓……\n……等等，那是什么——\n录音在此处中断三十秒，恢复后只有低沉的呼吸声和一句：我们继续走。此后直到出口，再无有效记录。"
 libra_main.2141.a: "分析录音，寻找线索。"
 libra_main.2141.b: "准备第二次探索，携带更多设备。"
 libra_main.2142.name: "玛娜之痕"
 libra_main.2142.desc: "第二次探索由[Root.Leader.GetName]亲自带队，前哨实时接收信号，多角度摄像机、生物传感器、能量分析仪全数开启。\n\n队伍深入约两公里后，能量分析仪首先报警：检测到§H未知能量场§!的剧烈波动。紧接着，一道无形的冲击从雾气深处涌来——所有电子设备瞬间过载，三台侦察无人机冒烟坠毁，队员们的护盾发生器发出尖啸后失效。这种能量的频谱与灵能存在相似性，但其基态完全不同。它不基于生物意识，而是独立存在的、可被引导的原始能量，暂且称之为“玛娜”。\n\n山谷用它触发陷阱，用它屏蔽记忆，用它守卫着什么。"
 libra_main.2142.a: "继续尝试。"
 libra_main.2143.name: "紫环之下"
 libra_main.2143.desc: "第三次进入探索时，[Root.Leader.GetName]调整了策略：所有设备以被动模式运行，减少主动探测，避免触发更多陷阱。\n\n队伍缓慢而坚定地向山谷深处移动，雾气在某个临界点后骤然消散。眼前是山谷的底部——一片被高耸崖壁环绕的圆形平地。崖壁上，一幅巨大的壁画占据整个视野：一个紫色的圆环，套着另一个圆环，圆心处是一个点。一个巨大的印记，以从未见过的尺寸和色彩，静静地俯瞰着闯入者。\n\n壁画下方，是一组低矮的建筑群——祭坛、石台、甬道，布局规整，材质呈现奇异的哑光质感。而在崖壁的根部，数个洞口向内延伸，隐约可见其中堆放着卷轴与书册。"
 libra_main.2143.a: "检查祭祀设施。"
 libra_main.2143.b: "搜索崖洞中的藏书。"
 libra_main.2144.name: "尘封"
 libra_main.2144.desc: "[Root.Leader.GetName]带队走向最近的祭坛，它由某种类石材料筑成，表面雕刻着复杂的纹路——似乎是某种仪式流程图，描绘着能量从祭坛中央涌向四周的过程。中央凹陷处残留着暗色的痕迹，或许是血，或许是颜料。\n\n一位队员试图触摸那些纹路，刚触及表面，整座祭坛便突然崩塌，化作无数细碎的微粒，无声地散落一地，如同沙堆被风吹散。其他队员试图抢救，触碰另外的石台、甬道的护栏——同样的结果。所有建筑都在接触的瞬间瓦解，留下一地无法拼合的尘埃。\n\n分析显示，这些材料的分子结构在漫长的岁月中已被玛娜能量彻底浸透，失去了一切结构强度。它们的存在完全依赖于玛娜的维持；一旦有外来者打破这种微妙的平衡，它们便回归虚无。"
 libra_main.2144.a: "什么都留不下。"
 libra_main.2145.name: "化灰"
 libra_main.2145.desc: "崖洞中的藏书数量惊人。数百卷书册整齐地码放在石架上，封面统一为深色皮革，每一本都压印着那个紫色圆环印记。\n\n[Root.Leader.GetName]小心翼翼地伸手，试图拿起最外侧的一卷。指尖触及封面的瞬间，书册如同被火焰舔舐的纸，从接触点开始向内翻卷、褪色、崩解——两秒之内，整本书化作一捧灰烬，从指缝间流走。队员尝试用机械臂远程取书，用真空吸盘，用静电场，依旧是同样的结果。无论何种方式，只要与书册发生任何形式的接触，它们便化为灰尘。甚至连光学仪器的扫描，也可能触发其崩解。\n\n通过语言学分析，我们可以勉强辨认出封面上的标题：《终末启示录》《玛娜本源论》《夕阳学派编年史》《遗忘仪式详解》\n书名如幽灵般浮现，随即消失在灰尘中。\n\n它们存在过，它们记录了秘密，但它们拒绝被阅读。"
 libra_main.2145.a: "这分明是不想让后来者知道。"
 libra_main.2146.name: "终末的低语"
 libra_main.2146.desc: "调查队搜遍所有崖洞，最终只带回了数公斤灰尘和碎屑——那些曾经是祭坛、石台、书册的物质残余。玛娜能量场在山谷中缓缓流淌，如同时光的河流，带不走，留不住。\n\n[Root.Leader.GetName]下令撤离，队伍沿着来时的路径，穿过雾气，走出山谷。就在最后一名队员踏出山谷边界的瞬间，所有人同时停住了脚步。一个声音——或者说，一股意识——在他们脑海中浮现，清晰如耳语：§H“你已离开终末降临之地。”§!\n然后，一切归于空白。\n[Root.Leader.GetName]站在前哨中，困惑地看着周围的队员。他们记得自己进入了山谷，记得触发过陷阱，然后……什么都没有了。通讯设备的记录还在，灰尘样本还在，但那段经历本身，已被彻底抹除。\n\n那个声音没有留下任何痕迹，除了这句在意识边缘回响的、无凭无据的记忆。[Root.Leader.GetName]看着手中的样本瓶，瓶中的灰尘在星光下泛着微弱的紫光。这是他们从圣地唯一带走的东西，也是圣地允许他们带走的唯一东西。"
 libra_main.2146.a: "有些秘密，或许永远不该被记起。"
 libra_main.2146.b: "它在警告我们？还是仅仅陈述事实？"

