 # techs

#

 tech_libra_analytics: "天秤统计学"
 tech_libra_analytics_desc: "在这个星际时代揭开帷幕的纪元里，完形理论展现了全新的告解，并由此构筑一种全新的信息化行政艺术。\n$libraf_te_banner_10$"
