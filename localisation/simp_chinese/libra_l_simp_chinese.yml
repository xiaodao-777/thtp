 # concept

 concept_libra_qualified_ascension: "限定飞升"
 concept_libra_qualified_ascension_desc: "至多可从中选择§Y2§!个的飞升天赋，§Y与天灾飞升同时使用时效果弱化§!，包括：\n$t$—['ascension_perk:ap_libra_golden_rule']\n$t$—['ascension_perk:ap_libra_valiant_heroic']\n$t$—['ascension_perk:ap_libra_genetic_potential']\n$t$—['ascension_perk:ap_libra_warrant_of_return']\n$t$—['ascension_perk:ap_libra_synthetic_voice']\n$t$—['ascension_perk:ap_libra_intergalactic_junkie']\n$t$—['ascension_perk:ap_libra_astral_blade']\n$t$—['ascension_perk:ap_libra_ghost_mechanist']"

 concept_libra_executive_ascension: "行政飞升"
 concept_libra_executive_ascension_desc: "能够降低 £empire_sprawl£ §Y$EMPIRE_SIZE$§!或 £mod_empire_size_penalty_mult£ §Y$MOD_EMPIRE_SIZE_PENALTY_MULT$§!，只能在其中选择其一，包括：\n$t$—['ascension_perk:ap_libra_transcendent_covenant']\n$t$—['ascension_perk:ap_libra_galaxy_ambition']\n$t$—['ascension_perk:ap_libra_shift_in_focus']\n$t$—['ascension_perk:ap_libra_third_choice']\n$t$—['ascension_perk:ap_libra_ultimate_directive']\n$t$—['ascension_perk:ap_libra_gestalt_era']\n$t$—['ascension_perk:ap_libra_sages_notes']\n$t$—['ascension_perk:ap_libra_collective_unity']\n$t$—['ascension_perk:ap_libra_cardinal_cosmos']\n$t$—['ascension_perk:ap_libra_kings_game']"

 concept_libra_advanced_ascension: "进阶飞升"
 concept_libra_advanced_ascension_desc: "只能在其中选择其一，包括：\n$t$—['tradition_category:tradition_cloning']： ['ascension_perk:ap_libra_directive_76']\n$t$—['tradition_category:tradition_purity']： ['ascension_perk:ap_libra_ode_to_babel']\n$t$—['tradition_category:tradition_mutation']： ['ascension_perk:ap_libra_evolutionary_endpoint']$t$['ascension_perk:ap_libra_cutefied_world']\n$t$—['tradition_category:tradition_cybernetics']： ['ascension_perk:ap_libra_transcendental_cybernetics']\n$t$—['tradition_category:tradition_synthetics']： ['ascension_perk:ap_libra_cosmological_constant']\n$t$—['tradition_category:tradition_modularity']： ['ascension_perk:ap_libra_atomic_heart']\n$t$—['tradition_category:tradition_nanotech']： ['ascension_perk:ap_libra_nanocore']$t$['ascension_perk:ap_libra_hurricane_eye']\n$t$—['tradition_category:tradition_virtuality']： ['ascension_perk:ap_libra_yggdrasil']\n$t$—['tradition_category:tradition_psionics_shroud']： ['ascension_perk:ap_libra_heavenly_throne']$t$['ascension_perk:ap_libra_liber_genesis']\n\n启用§Y$concept_libra_advanced_ascension$§!后仍可以选择§Y天灾飞升§!，但这会解除§Y$concept_libra_advanced_ascension$§!。\n\n§Y游玩飞升拓展内容时请不要使用其他修改飞升路线的mod，可能引发冲突。§!"

 concept_libra_expand_technology: "拓展科技选项"
 concept_libra_expand_technology_desc: "基于飞升路线的拓展科技树，每条路线的首个科技为：\n$t$—['tradition_category:tradition_cloning']：£society£ ['technology:tech_libra_genetics_demystified'] £physics£ ['technology:tech_libra_cloning_method']\n$t$—['tradition_category:tradition_purity']：£society£ ['technology:tech_libra_genetics_demystified'] £engineering£ ['technology:tech_libra_purity_sanctuary']\n$t$—['tradition_category:tradition_mutation']：£society£ ['technology:tech_libra_genetics_demystified'] £society£ ['technology:tech_libra_mutation_encoding']\n$t$—['tradition_category:tradition_cybernetics']：£society£ ['technology:tech_libra_centralised_cybernetics'] £engineering£ ['technology:tech_libra_cybernetic_growth_1']\n$t$—['tradition_category:tradition_synthetics']：£physics£ ['technology:tech_libra_synthetic_commands'] £engineering£ ['technology:tech_libra_synthetic_leaders']\n$t$—['tradition_category:tradition_modularity']：£society£ ['technology:tech_libra_modular_society']\n$t$—['tradition_category:tradition_nanotech']：£engineering£ ['technology:tech_libra_nanite_shipyard'] £engineering£ ['technology:tech_libra_nanite_locusts']\n$t$—['tradition_category:tradition_virtuality']：£physics£ ['technology:tech_libra_reality_deconstruction']\n$t$—['tradition_category:tradition_psionics_shroud']：£society£ ['technology:tech_libra_psionic_apocalypse']\n\n注意：\n$t$—修建超过§Y24§!座 £building£ §Y$building_fe_clinic_1$§!或 £building£ §Y$building_fe_assembly_1$§!将使部分科技§R失效§!。\n$t$—§Y游玩飞升拓展内容时请不要使用其他修改飞升路线的mod，可能引发冲突。§!"

