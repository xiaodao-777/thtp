 policy_libra_gestalt_colony_maintenance_b: "信号传递"
 policy_libra_gestalt_colony_maintenance_b_desc: "一些简单的指令可由维护子个体代为传达，而不需占用行政资源。\n "
 policy_libra_gestalt_colony_maintenance_b_swap: "$policy_libra_gestalt_colony_maintenance_b$"
 policy_libra_gestalt_colony_maintenance_b_swap_desc: "$policy_libra_gestalt_colony_maintenance_b_desc$\n "
 policy_libra_gestalt_colony_maintenance_c: "后勤协力"
 policy_libra_gestalt_colony_maintenance_c_desc: "指派闲置个体参与后勤工作。\n "
 policy_libra_gestalt_colony_maintenance_c_swap: "$policy_libra_gestalt_colony_maintenance_c$"
 policy_libra_gestalt_colony_maintenance_c_swap_desc: "$policy_libra_gestalt_colony_maintenance_c_desc$\n "
 policy_libra_gestalt_colony_maintenance_d: "自我修整"
 policy_libra_gestalt_colony_maintenance_d_desc: "调整子个体为护标准并许可自我维护，以降低整体维护压力。\n "
 policy_libra_gestalt_colony_maintenance_e: "高速投递"
 policy_libra_gestalt_colony_maintenance_e_desc: "只有畅通的物流才能确保维护工作的顺利运行。\n "
 tech_libra_gestalt_maintenance_4: "跨星系投递"
 tech_libra_gestalt_maintenance_4_desc: "高度发展的管理体系允许格式塔帝国控制多个星系内的个体共同作业。\n$libraf_te_banner_11$"

 tech_libra_gestalt_research_1: "思维拓展"
 tech_libra_gestalt_research_1_desc: "格式塔帝国必须放眼更远距离的未来，而不只局限于脚下的星空。\n$libraf_te_banner_10$"
 tech_libra_gestalt_research_2: "脑力集中"
 tech_libra_gestalt_research_2_desc: "我们的研究单元可以发挥更高的效能——只要确保没有子个体脱离中枢的控制。\n$libraf_te_banner_10$"
 edict_libra_gestalt_research: "整合注意"
 edict_libra_gestalt_research_desc: "审视每一组回馈至中枢的研究成果，却保没有遗漏的可能性。"
 tech_libra_gestalt_research_3: "非常规算法"
 tech_libra_gestalt_research_3_desc: "不变的研究中蕴藏不一样的可能，而这是常规做法难以发现的，格式塔帝国需要在某些时候跳出常轨。\n$libraf_te_banner_10$"
 TECH_UNLOCK_LIBRA_GLPSR_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$-$logistics_policy_libra_gestalt_4$"
 TECH_UNLOCK_LIBRA_GLPSR_DESC: "§H$logistics_policy_libra_gestalt_4$§!\n可以将一部分 £trade£ §Y$trade$§!转化为 £physics£ £society£ £engineering£ §Y研究点数§!。"
 tech_libra_analyze_node_optimisation: "分析节点优化"
 tech_libra_analyze_node_optimisation_desc: "以意识节点为核心、以星系为单位，重新编制分析-统计网络。\n$libraf_te_banner_11$"
 edict_libra_gestalt_analyze_optimisation: "神经网络互联"
 edict_libra_gestalt_analyze_optimisation_desc: "将整个格式塔的分析单位链接在一起共同执行研究作业，可以极大减少重复演算等造成的资源浪费。"

 tech_libra_gestalt_trade_1: "高速分拣"
 tech_libra_gestalt_trade_1_desc: "优化的分拣流程可以减少时间浪费。\n$libraf_te_banner_12$"
 tech_libra_gestalt_trade_2: "集中分发"
 tech_libra_gestalt_trade_2_desc: "建立复合处理站点，将分散各处的后勤力量整合起来。\n$libraf_te_banner_12$"
 tech_libra_gestalt_trade_3: "站点式后勤"
 tech_libra_gestalt_trade_3_desc: "以逐级分配的节点为中心安排更大范围的星际后勤网络。\n$libraf_te_banner_12$"
 building_libra_gestalt_logistics_dome: "物流穹顶"
 building_libra_gestalt_logistics_dome_desc: "这座巨大的建筑可以容纳成千上万的子个体同时工作，将物资派发到帝国各处。"
 tech_libra_logistics_node_optimisation: "后勤节点优化"
 tech_libra_logistics_node_optimisation_desc: "格式塔意识将重新编制自己的支援网络，为子个体提供效率化的物资支持。\n$libraf_te_banner_11$"

 tech_libra_gestalt_power_hub: "统一能源"
 tech_libra_gestalt_power_hub_desc: "通过集中调配能源分配，集体意识能够将能量精确传输至每一个需要它的子个体，彻底消除能源浪费。\n$libraf_te_banner_10$"
 building_libra_gestalt_energy_nub: "奇点能源枢纽"
 building_libra_gestalt_energy_nub_desc: "这座设施通过微型奇点产生近乎无限的能源，并通过量子纠缠网络将能量瞬时分配至帝国的每一个角落。"
 TECH_UNLOCK_LIBRA_GLPSE_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$-$logistics_policy_libra_gestalt_1$"
 TECH_UNLOCK_LIBRA_GLPSE_DESC: "§H$logistics_policy_libra_gestalt_1$§!\n可以将一部分 £trade£ §Y$trade$§!转化为 £energy£ §Y$energy$§!。"
 tech_libra_gestalt_food_processing: "量产食物"
 tech_libra_gestalt_food_processing_desc: "通过分子重组技术，集体意识能够将任何有机质转化为营养膏，完美满足所有子个体的代谢需求。\n$libraf_te_banner_11$"
 building_libra_gestalt_food_nub: "营养复制中心"
 building_libra_gestalt_food_nub_desc: "利用物质复制技术，这些设施能够从基础原子中合成出完美的营养组合，确保所有子个体获得最佳营养补给。"
 TECH_UNLOCK_LIBRA_GLPSF_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$-$logistics_policy_libra_gestalt_2$"
 TECH_UNLOCK_LIBRA_GLPSF_DESC: "§H$logistics_policy_libra_gestalt_2$§!\n可以将一部分 £trade£ §Y$trade$§!转化为 £food£ §Y$food$§!。"
 tech_libra_gestalt_mineral_purification: "协调开采"
 tech_libra_gestalt_mineral_purification_desc: "数以万计的子个体如同一个整体般协同作业，以最高效率开采和精炼矿物资源，完全避免传统采矿中的损耗。\n$libraf_te_banner_12$"
 building_libra_gestalt_mineral_nub: "量子钻井核心"
 building_libra_gestalt_mineral_nub_desc: "通过量子隧穿效应，这些钻井能够直接从行星核心提取矿物，同时通过分子级精炼产出纯度空前的金属材料。"
 TECH_UNLOCK_LIBRA_GLPSM_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$-$logistics_policy_libra_gestalt_3$"
 TECH_UNLOCK_LIBRA_GLPSM_DESC: "§H$logistics_policy_libra_gestalt_3$§!\n可以将一部分 £trade£ §Y$trade$§!转化为 £minerals£ §Y$minerals$§!。"
 tech_libra_gestalt_combat_training: "军团指令"
 tech_libra_gestalt_combat_training_desc: "通过神经接口直接下载战斗数据，每个作战子个体都能瞬间掌握各种战斗技能，形成完美同步的作战军团。\n$libraf_te_banner_11$"
 building_libra_gestalt_army_nub: "作战指挥节点"
 building_libra_gestalt_army_nub_desc: "这些节点通过超光速通信实时连接所有作战单位，使集体意识能够以光速协调整个帝国的军事行动，实现无可比拟的战术协同。"

 logistics_policy_libra_gestalt_1: "发电支援"
 logistics_policy_libra_gestalt_1_desc: "操作发电设施是简单却危险的工作，指派后勤力量协助技工个体，可以有效减少相关损耗并将额外产出最大化。\n\n将 £trade£ §Y$trade$§!收入的§Y40%§!转化为§Y100%§!的 £energy£ §Y$energy$§!"
 logistics_policy_libra_gestalt_2: "农垦支援"
 logistics_policy_libra_gestalt_2_desc: "集体意识的农业产出不能完全依赖于在田野里培育作物或于车间中合成营养的子个体，将一部分后勤能力投入有机质生产，以期获得更多补给。\n\n将 £trade£ §Y$trade$§!收入的§Y40%§!转化为§Y100%§!的 £food£ §Y$food$§!"
 logistics_policy_libra_gestalt_3: "采掘支援"
 logistics_policy_libra_gestalt_3_desc: "我们的后勤单位会从任何可能的地方收集矿物资源，包括但不限于小行星碎屑、精炼残渣和废弃建材，所有收集到的资材会在处理后再次利用。\n\n将 £trade£ §Y$trade$§!收入的§Y40%§!转化为§Y80%§!的 £minerals£ §Y$minerals$§!"
 logistics_policy_libra_gestalt_4: "意识支援"
 logistics_policy_libra_gestalt_4_desc: "无形的意识体构筑成集体意识的重要部分，将一部分后勤网络同意识网络联通，可以让格式塔帝国看得更远。\n\n将 £trade£ §Y$trade$§!收入的§Y40%§!转化为§Y12%§!的 £physics£ £society£ £engineering£ §Y研究点数§!"
 logistics_policy_libra_gestalt_5: "管控支援"
 logistics_policy_libra_gestalt_5_desc: "。\n\n将 £trade£ §Y$trade$§!收入的§Y40%§!转化为§Y50%§!的 £unity£ §Y$unity$§!"
 logistics_policy_libra_gestalt_6: "护理支援"
 logistics_policy_libra_gestalt_6_desc: "。\n\n将 £trade£ §Y$trade$§!收入的§Y40%§!转化为§Y50%§!的 £consumer_goods£ §Y$consumer_goods$§!"

