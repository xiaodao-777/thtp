 d_libra_machine_core: "机械智能居住站枢纽"
 d_libra_machine_core_desc: "这个枢纽能够大幅降低机械智能网络对居住站的数据传输延迟。"

 decision_libra_servitor_core: "建造有机支援中心"
 decision_libra_servitor_core_desc: "建造一个支援中心以同我们的有机主人更好地进行协作。"
 d_libra_gestalt_core_s: "有机支援中心"
 d_libra_gestalt_core_s_desc: "在这里，生物助手与维护子个体通力合作，力求打造一个更好的家园。"

