 tech_libra_interstellar_logistics_planning: "星际物流规划"
 tech_libra_interstellar_logistics_planning_desc: "超空间航路构成密密麻麻的物流天网，其中每一个星系都是可能选择的节点，如何连接它们将直接影响帝国的运转效率。\n$libraf_te_banner_11$"

 tech_libra_overlord_directive: "宗主国指令"
