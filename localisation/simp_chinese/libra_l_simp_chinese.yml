 # planet modifier

 libra_planet_feature_modifier_0: "太虚合奏"
 libra_planet_feature_modifier_0_desc: "虚境于这个星球上存在某种接口，在这里，和谐是自然的。"
 libra_planet_feature_modifier_1: "回声合唱"
 libra_planet_feature_modifier_1_desc: "灵能在这个星球上以一种平稳的方式汇集，无论是生物还是机械，处于其中的个体都会莫名地镇定。"
 libra_planet_feature_modifier_2: "花园世界"
 libra_planet_feature_modifier_2_desc: "这个星球上生长着华丽的异星植被。"
 libra_planet_feature_modifier_3: "天然居所"
 libra_planet_feature_modifier_3_desc: "这个星球上的很多区域都是能随时随地拎包入住的天然定居点。"
 libra_planet_feature_modifier_4: "自然地基"
 libra_planet_feature_modifier_4_desc: "这个星球有一块非常稳定的地壳和恰巧位于其上的岩石板块，是良好的建筑用地。"
 libra_planet_feature_modifier_5: "生息之所"
 libra_planet_feature_modifier_5_desc: "这个星球异常的……适合增加族群数量。"
 libra_planet_feature_modifier_6: "次元夹缝"
 libra_planet_feature_modifier_6_desc: "这个星球上的空间奇妙地折叠在一起，这导致实际可用空间比我们感知到的要多。"
 libra_planet_feature_modifier_7: "战斗之星"
 libra_planet_feature_modifier_7_desc: "这个星球上的动植物表现出了相当的军事组织性，可以成为很好的军事理论研究材料。"
 libra_planet_feature_modifier_8: "时间变速"
 libra_planet_feature_modifier_8_desc: "这个星球上的时间流速略快于正常情况。"
 libra_planet_feature_modifier_9: "高爆植物"
 libra_planet_feature_modifier_9_desc: "生长在这个星球上的野蛮植被几乎不受任何限制，它们会从任何基质中吸取养分再结成易爆的果实或孢子，通过爆炸消灭竞争对手和敌对动物。"
 libra_planet_feature_modifier_10: "沼气星球"
 libra_planet_feature_modifier_10_desc: "这个星球的大气及土壤环境中富含碳氢化合物及硫化物，只要能忍受异味熏天的环境，借助农作物可以轻易将它们转化为可用的资源。"
 libra_planet_feature_modifier_11: "电离世界"
 libra_planet_feature_modifier_11_desc: "这个星球上带电粒子的含量非常之高，意外放电现象也着实令人困扰。"
 libra_planet_feature_modifier_12: "虚无之歌"
 libra_planet_feature_modifier_12_desc: "神秘的歌声在这颗行星上空回荡，但只有具备真正灵能的人才可能理解这些音节背后的涵义。"
 libra_planet_feature_modifier_13: "先史文物贮藏"
 libra_planet_feature_modifier_13_desc: "这个星球上存在着大量有价值的文物遗留，但为此一切建设行动都必须小心谨慎，以免破坏可能的地下遗迹。"
 libra_planet_feature_modifier_14: "古战场遗址"
 libra_planet_feature_modifier_14_desc: "这个星球曾经是某星际文明大规模地面战斗的主场，其中散落着不少古代武器遗留。"
 libra_planet_feature_modifier_15: "畸变生态系统"
 libra_planet_feature_modifier_15_desc: "这个行星的生态系统奇异且脆弱，却能够为我们的生物学研究提供相当充足的课题。"
 libra_planet_feature_modifier_16: "堡垒行星"
 libra_planet_feature_modifier_16_desc: "这个星球的大气外层存在浓厚的等离子体，常规的轨道轰炸手段在攻击行星时会受到严重干扰。"
 libra_planet_feature_modifier_17: "静谧之地"
 libra_planet_feature_modifier_17_desc: "在这个星球的某些区域，世界是宁静的，不会有纷乱打扰，而人们可以专注于自己的事务。"
 libra_planet_feature_modifier_18: "古代基建工程"
 libra_planet_feature_modifier_18_desc: "在这个星球上，先史文明修建的大型基础设施工程中有相当一部分保存到了今天。"
 libra_planet_feature_modifier_19: "远古工业区"
 libra_planet_feature_modifier_19_desc: "这个星球上留有一处古代星际文明建设的工业区，其中的不少设备在今天来看仍然具有相当的先进性。"
 libra_planet_feature_modifier_20: "晶体牧场"
 libra_planet_feature_modifier_20_desc: "在这个星球上的原生动植物都在以某种方式于体内凝结晶体，这可以提取为有益的原料。"

 # deposit

 d_libra_feature_1: "沼泽藤蔓"
 d_libra_feature_1_desc: "这片不小的沼泽地中生长着一些具有中空气根的低矮树木，其中具有相当高的异星气体含量。"
 d_libra_feature_2: "微粒沙漠"
 d_libra_feature_2_desc: "这篇沙漠里生长着大量富集易爆微粒的多肉植物。"
 d_libra_feature_3: "水晶树林"
 d_libra_feature_3_desc: "受环境影响，这些异星植物退化为了闪闪发光的晶簇，只要简单处理就可以从中提取出大量稀有水晶晶体。"
 d_libra_feature_4: "超能平原"
 d_libra_feature_4_desc: "这片一望无际的世界有大量的天然能源储备。"
 d_libra_feature_5: "泽珞尘贮藏"
 d_libra_feature_5_desc: "一处被灵能力量滋养的肥沃土地。"
 d_libra_feature_6: "泽珞山谷"
 d_libra_feature_6_desc: "这是一处强烈灵能活动留下的大撕裂地貌，无数泽珞尘埃飘散于此。"
 d_libra_feature_7: "纳米世界"
 d_libra_feature_7_desc: "这片区域由失落的纳米机器人塑造，其创造者已不知所踪。"
 d_libra_feature_8: "暗物质矿脉"
 d_libra_feature_8_desc: "极其罕见的、只要具备相关技术就能简单采取的天然暗物质，其本身就是一个不可能的奇迹。"
 d_libra_feature_9: "固态活体金属"
 d_libra_feature_9_desc: "这些活体金属一反常态地以固体出现在人们的视线中，它们坚定地维持着原本的姿态而难以采取，在对液态活体金属有更多了解之前，这里就只是一处普通的矿脉。"
 d_libra_feature_10: "伊甸之地"
 d_libra_feature_10_desc: "很少有星球能拥有如此肥沃的土地，在这里，只要随手撒下一把种子，几个月内就可以收获饱满的庄稼。"
 d_libra_feature_11: "远古实验枢纽"
 d_libra_feature_11_desc: "一个保留至今的大型研究中心。"
 d_libra_feature_12: "神秘工厂"
 d_libra_feature_12_desc: "使用未知技术建成的工厂。"
 d_libra_feature_13: "古代数据库"
 d_libra_feature_13_desc: "这个数据库里保存着旧时代文明地研究记录，至今仍有些许价值。"
 d_libra_feature_14: "远古文物遗迹"
 d_libra_feature_14_desc: "由某个史前文明留下的文物群。"
 d_libra_feature_15: "星界刻痕"
 d_libra_feature_15_desc: "星界空间活动留下的痕迹，散发着淡淡的星界能量。"
 d_libra_feature_16: "宝藏次元"
 d_libra_feature_16_desc: "一处微型次元裂隙，来自其他维度的珍贵资源由此满溢而出。"
 d_libra_feature_17: "祝福之地"
 d_libra_feature_17_desc: "或许是演化中难得一遇的偶然所赐，一片盖娅生物群系坐落于这片区域，带来丰饶的物产与良好的环境。"
 d_libra_feature_18: "失落都市"
 d_libra_feature_18_desc: "来自某个古代文明的都市建筑群，即使无情的时间已经将其造主自永恒中抹去，坚实的地基仍在守望着这片土地。"
 d_libra_feature_19: "电离风暴涡流"
 d_libra_feature_19_desc: "大气层中永续盘旋的带电粒子风暴，形成天然的能量漩涡。"
 d_libra_feature_20: "真空零点反应阱"
 d_libra_feature_20_desc: "地表裂缝中检测到量子真空涨落现象，稀有超导材料在裂缝边缘形成天然能量阱。"
 d_libra_feature_21: "露天矿脉"
 d_libra_feature_21_desc: "这里的矿物暴露于地表，只要开着推土机行驶一圈就能堆出一座由高品矿石构成的小山。"
 d_libra_feature_22: "结晶化矿脉带"
 d_libra_feature_22_desc: "这个行星的地壳中密布着高纯度金属结晶矿脉，这些自生长的晶体结构可通过声波共振技术高效开采。"
 d_libra_feature_23: "共生藻平原"
 d_libra_feature_23_desc: "覆盖大陆的荧光藻类与固氮菌群构成活体农场，只要播撒些许肥料就能获得大量产出，但需定期抑制其过度增殖。"
 d_libra_feature_24: "神经共生生态群系"
 d_libra_feature_24_desc: "在漫长的演化过程中罕见诞生的神经活性植物网络，其根须能主动优化土壤成分并共享养分。"

