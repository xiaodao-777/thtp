 tech_libra_gestalt_maintenance_1: "行星维护"
 tech_libra_gestalt_maintenance_1_desc: "以首府建筑为核心部署自助设施，使子个体内阁自行解决相关需求。\n$libraf_te_banner_11$"
 edict_libra_gestalt_maintenance: "加强维护"
 edict_libra_gestalt_maintenance_desc: "格式塔辖下的星球必须一尘不染，增加维护作业。"
 tech_libra_gestalt_maintenance_2: "前哨补给"
 tech_libra_gestalt_maintenance_2_desc: "拓展维护节点并增设补给站，提升殖民地整洁度。\n$libraf_te_banner_11$"
 tech_libra_gestalt_maintenance_3: "殖民地后勤"
 tech_libra_gestalt_maintenance_3_desc: "体系化的维护安排允许格式塔帝国以更小的维护子个体人口需求来维持更多子个体的日常活动。\n$libraf_te_banner_11$"
 policy_libra_gestalt_colony_maintenance: "维护政策"
 policy_libra_gestalt_colony_maintenance_desc: "决定集体意志如何利用维护工作。\n "
 policy_libra_gestalt_colony_maintenance_a: "研究助理"
 policy_libra_gestalt_colony_maintenance_a_desc: "从维护作业中收集到的数据会被用于科学研究，以促进帝国发展。\n "
 policy_libra_gestalt_colony_maintenance_a_swap: "$policy_libra_gestalt_colony_maintenance_a$"
