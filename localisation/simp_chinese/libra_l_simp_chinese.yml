 tech_libra_hive_production_methods: "强化生产组织"
 tech_libra_hive_production_methods_desc: "对生产流程做进一步优化，以提升蜂群资源生产效率。\n$libraf_te_banner_8$"
 decision_libra_hive_survival_competition: "生存竞争"
 decision_libra_hive_survival_competition_desc: "即使同为一个整体，所有子个体对蜂巢的价值也并非均等，而通过竞争，那些虚弱的个体会成为精壮的子个体的养料，使集体意识取得更好的发展。"
 decision_libra_hive_survival_competition_effect: "杀死§R20%§!£pop£ §Y$POP$§!\n每个死亡的 £pop£ §Y$POP$§!带来 £physics£§G2§! £society£§G2§! £engineering£§G2§! £unity£§G1§! £trade£§G3§!\n每失去$pop_group_unit$£pop£§Y$POP$§!就在接下来的§Y3600§!天内获得：\n$t$$MOD_PLANET_AMENITIES_NO_HAPPINESS_MULT$: §G+1%§!（最大: §G+25%§!）\n$t$$mod_planet_jobs_produces_mult$: §G+2%§!（最大: §G+50%§!）\n$t$$mod_planet_jobs_simple_drone_produces_mult$: §G+2%§!（最大: §G+50%§!）"
 libra_hive_survival_competition_modifier: "竞争余波"
 libra_hive_survival_competition_modifier_desc: "残酷的生存斗争促动这个殖民地的个体勉力向前。"
