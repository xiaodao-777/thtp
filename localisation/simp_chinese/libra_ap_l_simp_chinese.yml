 libra_fairy.2200.name: "钢铁纹章：§H[Root.GetName]§!"
 libra_fairy.2200.desc: "在恒星熔炉的淬炼下，银蓝色的巨舰正从船坞的钢铁子宫中苏醒，宛如沉睡的女王骑士等待最后的甲胄加身。纳米熔流为其浇筑出流线型板甲，暗涌的能量纹路在接缝处游走，恰似宣誓效忠的古老血盟。十二组反物质引擎悬浮在骑士腰际，幽蓝的引力拘束环如同嵌着星辉的宝石腰带，随时准备为荣耀点燃撕裂维度的战火。当临时供能环亮起的刹那，尚未完工的巨影在暗物质迷雾中单膝跪地，量子护盾发生器发出的低鸣，恰似骑士向虚空中不可见的女王献上第一声誓约。"
 libra_fairy.2200.a: "建造更多战舰。"
 libra_fairy.2200.b: "训练更多军官。"

 ap_libra_intergalactic_junkie: "星间垃圾佬"
