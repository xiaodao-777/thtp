 d_libra_starry_miner_3_desc: "$d_libra_starry_miner_1_desc$"
 d_libra_starry_miner_4: "$d_libra_starry_miner_1$"
 d_libra_starry_miner_4_desc: "$d_libra_starry_miner_1_desc$"

 ap_libra_star_ranch: "星空牧场"
 ap_libra_star_ranch_desc: "星光照耀的地方，都将成为我们的牧场。\n$libraf_ap_banner_2$\n"
 ap_libra_star_ranch_tooltip: "$mod_country_commander_cap_add$: §G+1§!\n$mod_pop_livestock_bonus_workforce_mult$: §G+25%§!\n$libra_unlock_planet_buildings$['building:building_libra_star_ranch']\n$t$§Y$building_libra_star_ranch$§! 可以建造在多数 £energy£ £food£ £minerals£ 类型的 £zone£ ['concept_district_specialization']中。"
 building_libra_star_ranch: "牧场小屋"
 building_libra_star_ranch_desc: "这座看似普通的小屋实际上运用了帝国的全部先进技术，旨在培育高质量、高产出的智慧型经济动物。"

 ap_libra_biomass_technician: "生物质技工"
 ap_libra_biomass_technician_desc: "凭借传统生物质发电技术，机械智能从有机个体身上榨取的能源是有限的。现在，我们有足够的方法，可以把它们转化成更好的电池。\n$libraf_ap_banner_3$\n"
 ap_libra_biomass_technician_tooltip: "$libra_unlock_policies$$policy_libra_biomass_technician$\n$t$§Y$policy_libra_biomass_technician$§! 提升£job_organic_battery£ §Y$job_organic_battery_plural$§!产出。"
 policy_libra_biomass_technician: "催化增幅"
 policy_libra_biomass_technician_desc: "通过向生物质反应炉中投入各种各样的试剂，再施以配套的改进，我们可以最大限度地利用有机生命。\n "
 policy_libra_biomass_technician_a: "过载发电"
 policy_libra_biomass_technician_a_name: "$policy_libra_biomass_technician_a$"
 policy_libra_biomass_technician_a_desc: "提取能量是第一要务。\n "
 policy_libra_biomass_technician_b: "波动监测"
 policy_libra_biomass_technician_b_name: "$policy_libra_biomass_technician_b$"
 policy_libra_biomass_technician_b_desc: "我们应当研究有机体发电直至凋亡过程中的情绪反应。\n "
 policy_libra_biomass_technician_c: "心电解析"
 policy_libra_biomass_technician_c_name: "$policy_libra_biomass_technician_c$"
 policy_libra_biomass_technician_c_desc: "生物质发电是一个奇妙的、值得进一步研究的过程。\n "
 policy_libra_biomass_technician_d: "干涉药剂"
 policy_libra_biomass_technician_d_name: "$policy_libra_biomass_technician_d$"
 policy_libra_biomass_technician_d_desc: "提升生产效率不如扩大生产规模，我们要做的就是往生化培养仓里投放催化试剂。\n "

 ap_libra_string_puppeteer: "提线人偶师"
 ap_libra_string_puppeteer_desc: "就像死灵法师操纵亡骸一样，使机械意志取代有机自我，以举手之劳消弭金属与血肉间永恒的冲突。\n$libraf_ap_banner_4$\n"
 ap_libra_string_puppeteer_tooltip: "能够复活击杀的有机体星神兽\n$reanimator_effect_desc$\n每个净化的 £pop£ §Y$POP$§!带来§G3§!£energy£ §Y$energy$§!和§G1§!£trade£ §Y$trade$§!\n$libra_unlock_agenda$$council_agenda_agenda_libra_string_puppeteer_name$\n$t$§Y$council_agenda_agenda_libra_string_puppeteer_name$§! 启动时同化§Y开智$BIOLOGICAL$§! £pop£ §Y$POP$§!。\n$libra_unlock_decisions$$decision_libra_string_puppeteer_a$ $decision_libra_string_puppeteer_b$\n$t$以上决议可将§Y殖民地§!排除或纳入同化目标。"
 council_agenda_agenda_libra_string_puppeteer_name: "傀儡化"
 council_agenda_agenda_libra_string_puppeteer_desc: "不用担心，你们会获得和我们的一样的机械躯体，只是意识是否相同就说不准了。"
 agenda_libra_string_puppeteer_tooltip: "§H所有非$decision_libra_string_puppeteer_modifier$殖民地：§!同化§Y开智$BIOLOGICAL$§! £pop£ §Y$POP$§!"
 decision_libra_string_puppeteer_a: "傀儡豁免"
 decision_libra_string_puppeteer_a_desc: "将这里设立为有机体的保留地。"
 decision_libra_string_puppeteer_b: "豁免削除"
 decision_libra_string_puppeteer_b_desc: "这里不再是保留地了。"
 decision_libra_string_puppeteer_modifier: "傀儡豁免"
 decision_libra_string_puppeteer_modifier_desc: "作为保留地，这里的生物人口无需同化。"

 ap_libra_shield_machine: "盾构框架"
 ap_libra_shield_machine_desc: "只要为坚韧的机器人安装上锋利的刀盘，所有挡路的障碍都会被碾碎至尘。\n$libraf_ap_banner_5$\n"
 ap_libra_shield_machine_tooltip: "$libra_unlock_decisions$$decision_libra_shield_machine$\n$t$§Y$decision_libra_shield_machine$§! 将£commander£§Y$libra_shield_machine_leader_name$§!部署至指定殖民地以促进基础建设和 £energy£ £minerals£ £food£ £trade£ 生产。"
 decision_libra_shield_machine: "部署开发节点"
 decision_libra_shield_machines_desc: "这位领袖集成了机械智能的开发协议，能使整个星域的子个体在同一标准下高效运转。"
 requires_leader_not_libra_shield_machine: "$TRIGGER_FAIL$§Y$libra_shield_machine_leader_name$§!正在督管此殖民地"
 decision_libra_shield_machine_effect_a: "将§Y$libra_shield_machine_leader_name$§!移动至此殖民地"
 decision_libra_shield_machine_effect_b: "创建§Y$libra_shield_machine_leader_name$§!并使其督管此殖民地"
 leader_trait_libra_shield_machine: "集成生产指令"
 leader_trait_libra_shield_machine_desc: "$libra_shield_machine_leader_desc$"
 libra_shield_machine_leader_name: "开发节点"
 libra_shield_machine_leader_desc: "开发节点是机械智能资源处理协议的主要监管单元。"

 ap_libra_storm_deviation: "风暴乖离"
 ap_libra_storm_deviation_desc: "以万亿意识编织捕网，约束星海狂怒为永恒薪火。众生畏怖，我们征服。\n$libraf_ap_banner_6$\n"
 ap_libra_storm_deviation_tooltip: "$libra_unlock_planet_buildings$['building:building_libra_gestalt_storm_summoning_1']\n$t$§Y$building_libra_gestalt_storm_summoning_1$§! 在风暴中产生额外$EFFECTS_TXT$；研究相关科技后，可升级为 £building£ ['building:building_libra_gestalt_storm_summoning_2']及 £building£ ['building:building_libra_gestalt_storm_summoning_3']。"
 building_libra_gestalt_storm_summoning_1: "唤风节点"
 building_libra_gestalt_storm_summoning_1_desc: "一个基于星际气象模型运作的建筑，能够捕获风暴而使格式塔获益。"
 building_libra_gestalt_storm_summoning_2: "风暴枢纽"
 building_libra_gestalt_storm_summoning_2_desc: "$building_libra_gestalt_storm_summoning_1$"
 building_libra_gestalt_storm_summoning_3: "风舞天台"
 building_libra_gestalt_storm_summoning_3_desc: "$building_libra_gestalt_storm_summoning_1$"

