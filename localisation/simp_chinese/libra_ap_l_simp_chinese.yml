 libra_fairy.0559.name: "不朽荣光：§H[Root.GetName]§!"
 libra_fairy.0559.desc: "伟大领袖是跨越千年的恒星，以思想之光校准文明的轨迹，用意志之火熔铸时代的精魂。他们的目光穿透历史长河的迷雾，将散落的文明碎片锻造成共同命运的图腾；他们的胸襟如大陆板块般撑起文明的根基，又以潮汐般的引力调和世界的共振。当战争阴云割裂天空，当技术狂潮颠覆秩序，他们以超越时空的哲思重构人类价值的坐标系，将族群的对立升华为文明的交响，让权力的博弈沉淀为精神的火种。这种力量不囿于山河疆界，不止于百年兴衰，而是以文明为经纬编织永恒，用超越性的存在证明：我们历史的每一次跃升，都是崇高意志在混沌中劈开的璀璨裂隙。"
 libra_fairy.0559.a: "技术人员的努力值得赞赏。"
 libra_fairy.0559.a.tt: "所有§Y$scientist_with_icon$§!获得§G3000§!经验"
 libra_fairy.0559.b: "不可忽视管理者的工作。"
 libra_fairy.0559.b.tt: "所有§Y$official_with_icon$§!获得§G3000§!经验"
 libra_fairy.0559.c: "战略家带来最终的胜利。"
 libra_fairy.0559.c.tt: "所有§Y$commander_with_icon$§!获得§G3000§!经验"

 ap_libra_sages_notes: "贤者手札"
 ap_libra_sages_notes_desc: "贤者的遗产从不以黄金的重量计量——半卷残章是星图的倒影，一盏未灭的灯火藏着混沌的密钥，沙漏底部的刻痕里，沉睡着让种子穿越凛冬的密语。\n我们追逐贤者的智慧，是捧起他们遗落的星火，在未知的迷雾中点燃自己的长夜——不是对灰烬的膜拜，而是借那永恒跳动的余温，熔铸出属于新黎明的钥匙。\n$libraf_ea_banner_7$\n"
 ap_libra_sages_notes_tooltip: "每项已研究的科技降低§G-1§!£empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§!\n每项已研究的§M稀有科技§!额外降低§G-4§!£empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§!\n$libra_start_situation$$situation_libra_sages_notes$\n$t$§Y$situation_libra_sages_notes$§! 可执行多次，阶段完成时产出 £physics£ £society£ £engineering£ §Y研究点数§!，局势完成时带来科技进度。\n$libra_unlock_edicts$['concept_libra_sages_notes_edicts']\n$t$§Y$concept_libra_sages_notes_edicts$§! 消耗 £energy£ §Y$energy$§!和 £exotic_gases£ £rare_crystals£ £volatile_motes£ £minor_artifacts£ £astral_threads£ §Y稀有资源§!以增加 £mod_produces_mult£ §Y$mod_country_produces_mult$§!。"
 ap_libra_sages_notes_modifier: "$ap_libra_sages_notes$"
 situation_libra_sages_notes: "智慧笔记"
 situation_libra_sages_notes_type: "$situation_libra_sages_notes$"
 situation_libra_sages_notes_monthly_change_tooltip: "局势进度固定，每§G18§!个月一轮。"
 situation_libra_sages_notes_desc: "智慧如大海，表面平静却深藏万象；似高山，沉默不语却洞察千里；若溪流，蜿蜒曲折却始终明澈。它不是在知识的荒漠中独行，而是在经验的土壤里扎根，用谦逊的枝叶触碰星空，以包容的年轮刻录时光——真正的智者，懂得在复杂中守护简单，于混沌里发现韵律，更能在平凡处看见星辰的轨迹。"
 situation_libra_sages_notes_effects: "获得§G1§!个月的 £physics£ £society£ £engineering£ §Y研究点数§!"
 situation_libra_sages_notes_tooltip: "取得当前领域随机§G3§!项科技的§G50%§!进度\n以当前解决方案启动下一轮§Y$situation_libra_sages_notes$§!局势"
