 ap_libra_starry_miner: "星穹矿工"
 ap_libra_starry_miner_desc: "我们已经进入太空，并且我们意识到星辰间存在着堆积如山的宝藏，只要调用足够的人力，那些财富就会为我们所有。\n$libraf_ap_banner_1$\n"
 ap_libra_starry_miner_tooltip: "$libra_unlock_starbase_modules$['starbase_module:libra_astromining_bay',$sm_libra_astromining_bay$]\n$libra_unlock_starbase_buildings$['starbase_building:libra_astromining_hub',$sm_libra_astromining_hub$]"
 sm_libra_astromining_bay: "$sm_astromining_bay$"
 sm_libra_astromining_bay_desc: "$sm_astromining_bay_desc$"
 sm_libra_astromining_hub: "$sm_astromining_hub$"
 sm_libra_astromining_hub_desc: "$sm_astromining_hub_desc$"
 sm_libra_astromining_hub_office_desc_modifier: "建筑工作时：\n$t$在每个星球上维持至多§Y3§!£minerals£ §Y2§!£trade£\n$sm_libra_astromining_bay$模块：\n$t$$mod_station_gatherers_produces_mult$: §G+10%§!"
 d_libra_starry_miner_1: "星穹宝藏"
 d_libra_starry_miner_1_desc: "星穹宝藏"
 d_libra_starry_miner_2: "$d_libra_starry_miner_1$"
 d_libra_starry_miner_2_desc: "$d_libra_starry_miner_1_desc$"
