 concept_libra_shift_in_focus_auth_effect_desc: "根据先前§Y$GOVERNMENT_AUTHORITY$§!获得效果，持续直至下一次§Y$REFORM$§!：\n$t$§Y$auth_democratic$§!：\n$tt$$concept_founder_species_growth_mult$: §G+25%§!\n$t$§Y$auth_oligarchic$§!：\n$tt$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+20%§!\n$t$§Y$auth_dictatorial$§!：\n$tt$$MOD_STARBASE_SHIPYARD_BUILD_COST_MULT$: §G-10%§!\n$t$§Y$auth_imperial$§!：\n$tt$$MOD_COUNCILOR_SKILL_ADD$: §G+2§!\n$t$§Y$auth_corporate$§!：\n$tt$$mod_specimens_produces_mult$: §G+20%§!\n$t$§Y其它§!：\n$tt$$mod_country_influence_produces_mult$: §G+20%§!"
 libra_fairy.0529.name: "深层意志：§H[Root.GetName]§!"
 libra_fairy.0529.desc: "无论人们愿意与否，不管民众知晓与或，我们都获得了更加高效的影子势力。我们把握着舆论的权柄，操纵或协调着社会以最理想的方式运作，不再有多余的纠纷，也不会产生无谓的徘徊。\n\n一个万众一心却又飘忽不定的新生帝国，如今已冉冉升起。"
 libra_fairy.0529.a: "我们期望的，终将实现。"
 libra_fairy.0529.b: "我们渴求的，总会降临。"

 ap_libra_third_choice: "第三选择"
 ap_libra_third_choice_desc: "在这茫茫宇宙间，众生孤立而无援，既不存在法则的制订者，也没有秩序的维护者。只有武力不一样，它明了且绝对，退可保护我们免遭侵扰，进能协助我们一统星海。\n$libraf_ea_banner_4$\n"
 ap_libra_third_choice_tooltip: "§Y$navy_coverage$§!等比例降低 £mod_empire_size_penalty_mult£ §Y$MOD_EMPIRE_SIZE_PENALTY_MULT$§!\n§Y赢得战争§!或§Y毁灭帝国§!时：\n$t$$MOD_POP_CITIZEN_HAPPINESS$: §G+3%§!（最大: §G+30%§!）\n$t$$mod_divided_patrongage_max_subjects$: §G+1§!（最大: §G+10§!）\n$t$提升来自友好国家的 £opinion£ §Y$OPINION$§!§G+20§!（最大: §G+300§!）\n在战争中§Y落败§!时：\n$t$失去通过胜利获得的以上$EMPIRE_EFFECTS_W_ICON$\n$t$§G+75%§!£mod_starbase_shipyard_build_speed_mult£ §Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§!持续§Y5§!年（ £time£ §Y时间§!可叠加）\n$libra_unlock_policies$$policy_libra_third_choice$\n$t$§Y$policy_libra_third_choice$§! 使§Y$country_power_projection$§!基于 £empire_sprawl£ §Y$EMPIRE_SIZE$§!产出 £physics£ £society£ £engineering£ §Y研究点数§!。"
