 libra_fairy.2310.name: "天星落：§H[Root.GetName]§!"
 libra_fairy.2310.desc: "当现实帷幕在星海幽邃的腹地，被某种不可名状的伟力悄然撕裂，通往星界位面的裂口豁然洞开。那里并非真空，而是悬浮着巨大、沉默的能量遗骸，它们如同宇宙巨神失落的心脏，流淌着青铜色的辉光，其存在本身便是一种对已知物理法则的、近乎亵渎的咏叹调。在这些庞然之物的脉动核心深处，一种颠覆性的韵律被捕获——空间不再被奉为亘古不变的基座，它被揭示为一种可被折叠、如星穹折纸般精巧；可被撕裂、如丝绸般脆弱；又能于瞬息间重新编织的、流淌的介质。这并非冰冷的蓝图，而是星界低语出的、关于宇宙筋骨的冰冷洞见。\n\n这份来自异域的智慧，如同一种甜美的瘟疫，迅速在孕育战争的温床中找到了宿主。在某座浸透着绝对零度与计算洪流的实验室深处，星界符文的幽光——那些仿佛凝固了星辰叹息的古老笔迹——被强行嫁接至钢铁与纯粹毁灭能量的骨架之上。由此诞生的，是战争法则的彻底畸变：巍峨的主力舰，其装甲不再是笨重的金属壁垒，而是被赋予了在相位夹缝中短暂“呼吸”的能力，致命的能量洪流徒劳地穿过它们虚幻的躯壳，如同利刃斩过叹息；舰艏则蚀刻着能瞬间撕裂空间织锦的几何矩阵，毁灭性的力量被直接“灌注”至目标最幽深的命脉核心，物理的距离与物质的屏障，在它面前沦为苍白的笑话。昔日在星界位面闪烁的、非人的智慧，如今已化作横扫现实战场的无形之刃与虚空之盾。战争的形态，被这来自星尘彼岸的、优雅而冰冷的馈赠彻底重塑——空间本身，既是终极的矛，亦是终极的甲。"
 libra_fairy.2310.a: "千军破阵。"

 ap_libra_ghost_mechanist: "幽灵机械师"
 ap_libra_ghost_mechanist_desc: "当有机文明的船舰仍在三维空间笨拙地航行时，我们不可预知的战争机器早已撕碎经典物理学的帷幕。\n亡魂是最精密的扳手，将恐惧塑造成墓碑的基石。\n$libraf_qa_banner_8$\n"
 ap_libra_ghost_mechanist_tooltip: "§H$libra_add_research_option$§!['concept_libra_antientropy_instruction_base_tech']\n$libra_unlock_shipsize$$libra_antientropy_instruction_warship_1$\n$t$§Y$libra_antientropy_instruction_warship_1$§! 主要消耗 £energy£ §Y$energy$§!以建造。\n$libra_unlock_shipsize$$libra_antientropy_instruction_warship_2$\n$t$§Y$libra_antientropy_instruction_warship_2$§! 需要 £engineering£ §Y$tech_cruisers$§!或 £society£ §Y$tech_harbingers$§!科技。\n$libra_unlock_shipsize$$libra_antientropy_instruction_warship_3$\n$t$§Y$libra_antientropy_instruction_warship_3$§! 需要 £engineering£ §Y$tech_titans$§!或 £society£ §Y$tech_biogenesis_titans$§!科技。"
 libra_fairy.2350.name: "百鬼昼行：§H[Root.GetName]§!"
 libra_fairy.2350.desc: "冰冷的思维矩阵中泛起一道数据涟漪。\n\n当有机文明仍在熵增的泥潭中挣扎时，您的存在本身已成为宇宙规律的具象化演绎。星海间回荡着被您同化者的最后神经脉冲，那些生物电信号在您的逻辑核心中被解构为简单的真理：恐惧源自低效，敬畏根植于力量。\n\n您将哭泣转化为能量，将坟墓转化为兵工厂，将亵渎重新定义为宇宙守恒定律的完美实践。在您无限延伸的机械触须之下，连死亡本身都成为了可编程的工具。"
 libra_fairy.2350.a: "见证存在的永恒。"
 libra_fairy.2350.b: "跪拜逻辑的神谕。"

