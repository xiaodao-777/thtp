 libra_fairy.2250.name: "寂静湮灭：§H[Root.GetName]§!"
 libra_fairy.2250.desc: "爆炸的余晖在深空中凝结成苍白的茧。敌方战舰断裂的瞬间，所有轰鸣都被真空吞没，只留下蛛网状的裂痕在船体表面疯狂生长。庞大的阴影开始崩塌，金属关节发出最后的痉挛，将内部尚未熄灭的能量流抛洒成环状光雾。\n\n这些碎片不再携带任何识别代码，所有文明特征都随着断裂的能源管线消逝。部分残骸仍在惯性驱使下翻滚，偶尔亮起的短路火花如同垂死的萤火虫，更多则彻底陷入冰冷的长眠，化作黑暗幕布上细微的凸起。它们将遵循宇宙最古老的法则持续滑行，直到某个遥远星系的引力场重新捕获这些战争残渣——那时所有烧灼的创口都该覆满星际尘埃，成为漂流在时光里的无名墓碑。\n\n但此刻，尚未冷却的金属断层深处，正传来规律如心跳的幽紫脉冲，顺着引力涟漪的褶皱，朝母舰残骸最密集的方向坍缩。"
 libra_fairy.2250.a: "物尽其用。"

