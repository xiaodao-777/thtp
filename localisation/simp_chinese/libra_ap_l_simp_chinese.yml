 libra_fairy.0549.name: "终极使命：§H[Root.GetName]§!"
 libra_fairy.0549.desc: "对格式塔意识而言，探索世界是一项史诗般的征程。我们必须协调所有子个体共同努力，才能在这未知的世界中稳定地占有一席之地。\n\n星海浩瀚，[Root.GetSpeciesName]正等待着新的指令。"
 libra_fairy.0549.a: "高效的§Y生长§!指令使我们走向繁荣。"
 libra_fairy.0549.b: "敏锐的§Y意识§!指令帮我们取得真知。"
 libra_fairy.0549.c: "强悍的§Y军团§!指令助我们战无不胜。"
 libra_fairy.0549.d: "严明的§Y管控§!指令令我们蓬勃发展。"
 libra_fairy.0549.e: "我们会在当前的目标中取得进展。"

 ap_libra_gestalt_era: "完形纪元"
 ap_libra_gestalt_era_desc: "在时代的风云变幻中，真正的领袖如同巍峨的群山，以远见卓识勾勒前行的蓝图，以坚毅信念凝聚万千人心。其力量不在于权杖之重，而在于以心唤心的感召，在于危难时刻挺身而出的脊梁，更在于将千万种声音熔铸成共同奋进的磅礴和声。\n$libraf_ea_banner_6$\n"
