 libra_fairy.2150.name: "生命绽放之处：§H[Root.GetName]§!"
 libra_fairy.2150.desc: "在星骸盘踞的无尽虚渊之上，在冰冷法则编织的永恒幕布之下，一种脉动顽强地穿透了死寂。它并非诞生于精密的星图或宏伟的巨构，而是源自混沌星尘深处的一次偶然低语。这脉动是宇宙间最古老的奇迹，是无形能量在有机形态中的短暂凝聚与燃烧。它无视真空的荒芜与辐射的鞭挞，以无目的性的纯粹存在，在冰冷的逻辑洪流中开辟出温暖与熵减的孤岛。每一个微小的细胞，都承载着超越星辰熔炉的奥秘，每一次无声的呼吸，都是对广袤虚无最优雅而坚韧的礼赞。宇宙的尘埃终将归于尘埃，但这短暂闪耀的、自我复制的星尘本身，才是时空乐章中最动人的颤音。"
 libra_fairy.2150.a: "更多地盛放吧！"
 libra_fairy.2150.a.tt: "首都获得§G900§!£pop£ §Y$POP$§!"
 libra_fairy.2150.b: "此方花会开。"

 ap_libra_warrant_of_return: "归来之证"
 ap_libra_warrant_of_return_desc: "我们的冒险已经证明了我们所拥有的勇气、力量和智慧，现在，我们将为自己矗立荣耀的巨碑。\n生命不息，进取不止。\n$libraf_qa_banner_4$\n"
