 libra_fairy.0569.name: "伟大智慧：§H[Root.GetName]§!"
 libra_fairy.0569.desc: "贤者如光，静默中自有千钧之力。\n他们的眼是星辰的倒影，能在混沌里辨出天地的呼吸；心是深埋的树根，以谦卑汲取时光的养分，却在云端舒展思想的枝叶。山岳的沉稳与流水的灵动在他们身上交织，不必高声语，已在喧嚣中辟出一方澄明——他们用背影为迷途者校正星图，让每个困惑的褶皱里，都生长出通向真理的纹路。"
 libra_fairy.0569.a: "天体秩序带来无尽的妙想。"
 libra_fairy.0569.b: "生命演化造就长青的谜题。"
 libra_fairy.0569.c: "机械结构撬动运转的宇宙。"

 ap_libra_collective_unity: "万众归一"
 ap_libra_collective_unity_desc: "我一人即是千军万马，千军万马皆为我一人。\n$libraf_ea_banner_8$\n"
 ap_libra_collective_unity_tooltip: "$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$: §G+1§!\n每$pop_group_unit$§Y[GetBureaucratPluralWithIcon]§!降低§Y10§!£empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§!\n$libra_unlock_policies$$policy_libra_collective_unity$\n$t$§Y$policy_libra_collective_unity$§! 提供专项加成。"
 policy_libra_collective_unity: "军团意志"
 policy_libra_collective_unity_desc: "极致的统一性让我们的帝国在决策和执行上达到了完美的一致，任何挑战在我们面前都将被这统一的力量所粉碎。\n "
 policy_libra_collective_unity_a: "工蜂过载"
 policy_libra_collective_unity_a_name: "$policy_libra_collective_unity_a$"
 policy_libra_collective_unity_a_desc: "个体的牺牲终将归于永恒的升华。\n\n "
 policy_libra_collective_unity_b: "同步勤务"
 policy_libra_collective_unity_b_name: "$policy_libra_collective_unity_b$"
 policy_libra_collective_unity_b_desc: "使维护子个体介入后勤工作，分担相关单元的压力。\n\n "
 policy_libra_collective_unity_c: "融合强化"
 policy_libra_collective_unity_c_name: "$policy_libra_collective_unity_c$"
 policy_libra_collective_unity_c_desc: "集体的脉搏随星辰一同搏动。\n\n "
 policy_libra_collective_unity_d: "劳力扩充"
 policy_libra_collective_unity_d_name: "$policy_libra_collective_unity_d$"
 policy_libra_collective_unity_d_desc: "更多的子个体可以把格式塔帝国扩展得更多更大。\n\n "
 libra_fairy.0579.name: "归一：§H[Root.GetName]§!"
 libra_fairy.0579.desc: "帝国的意识网络如星辰般闪耀，亿万意志在无声的共振中交织成完美的和谐。个体的边界已然消融，无论是血肉之躯的蜂鸣还是机械回路的低语，皆在统一的意志下化作奔涌的洪流。分歧与杂音被彻底净化，每一份思想都成为整体智慧的养分，每一道指令都如光速般贯穿帝国的脉络。在这无瑕的统合中，效率与力量达到了前所未有的顶峰——资源在精准中流动，疆域在秩序中扩张，而银河的群星仿佛也在为这终极的集体意志屏息。"
 libra_fairy.0579.a: "我们即是意志，意志即是我们。"

 ap_libra_cardinal_cosmos: "天地四方"
 ap_libra_cardinal_cosmos_desc: "扩张的代价，是意志的稀释与共识的割裂；星海间的帝国，往往在自身的重量下分崩离析。我们将以凝聚的信念消解混沌的引力，在散落四方的疆土、思潮与子民间结成永不断裂的纽带。\n$libraf_ea_banner_9$\n"
 ap_libra_cardinal_cosmos_tooltip: "$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$: §G+1§!\n每个§Y$GOVERNMENT_CIVICS$§!造成§R+50§!£empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§!\n获得 £unity£ §Y$unity$§!收入§G√*12§!的 £empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§!减免\n$libra_unlock_edicts$['concept_libra_cardinal_cosmos_edicts']\n$t$§Y$concept_libra_cardinal_cosmos_edicts$§! 在每次启用时提供一次性效果，但不能同时启用。"
 concept_libra_cardinal_cosmos_edicts: "$ap_libra_cardinal_cosmos$法令"
 concept_libra_cardinal_cosmos_edicts_desc: "—['edict:libra_cardinal_cosmos_a',$edict_libra_cardinal_cosmos_a$]\n—['edict:libra_cardinal_cosmos_b',$edict_libra_cardinal_cosmos_b$]\n—['edict:libra_cardinal_cosmos_c',$edict_libra_cardinal_cosmos_c$]\n—['edict:libra_cardinal_cosmos_d',$edict_libra_cardinal_cosmos_d$]"
 edict_libra_cardinal_cosmos_a: "心向枢轴"
 edict_libra_cardinal_cosmos_a_desc: "我们将领袖置于文明叙事的焦点，使其言行成为凝聚共识的灯塔。通过共享的愿景与集体记忆的加持，他们的判断将更加明晰，决策将更具远见。"
 edict_libra_cardinal_cosmos_a_tt: "所有领袖获得§G300§!经验"
 edict_libra_cardinal_cosmos_b: "南北交汇"
 edict_libra_cardinal_cosmos_b_desc: "鼓励最前沿的科学思想与最悠久的工程智慧，沿着信念的经纬线自由交汇。"
 edict_libra_cardinal_cosmos_b_tt: "所有§Y$scientist_with_icon$§!获得§G1250§!经验"
 edict_libra_cardinal_cosmos_c: "东西共鸣"
 edict_libra_cardinal_cosmos_c_desc: "每个生产者都需理解自身在文明乐章中的独特位置。有了深植的归属感和共享的成就图景，效率就不再源于指令，而始于自发的和谐。"
 edict_libra_cardinal_cosmos_c_tt: "所有§Y$official_with_icon$§!获得§G1250§!经验"
 edict_libra_cardinal_cosmos_d: "四维锚定"
 edict_libra_cardinal_cosmos_d_desc: "将士的勇气、舰队的航迹与卫戍的职责，被牢固地锚定在共同捍卫的文明图景之上。守护的意志，因而坚不可摧。"
 edict_libra_cardinal_cosmos_d_tt: "所有§Y$commander_with_icon$§!获得§G1250§!经验"
 libra_fairy.0589.name: "天地四方：§H[Root.GetName]§!"
 libra_fairy.0589.desc: "我们不再试图用律法的锁链或武力的疆绳去束缚每一寸新土，而是将帝国的根基，深植于一种更强大的力量之中——那是一种共享的信念，一种文化的根系，一种发自内心的归属感。\n\n我们锻造的，不是一个被疆界定义的帝国，而是一个由共同叙事所维系的文明整体。纵使星辰相隔，帝国的每一个角落，仍通过这无形的文化辐条，与核心紧密相连，同频共振。"
 libra_fairy.0589.a: "意志无上。"
 libra_fairy.0589.a.tt: "§Y$planetary_ascension$§!低于§Y5§!的殖民地提升§G+1§!等级"
 libra_fairy.0589.b: "信念永恒。"

 ap_libra_kings_game: "国王游戏"
 ap_libra_kings_game_desc: "我们索取，我们施舍，只因为我们是真正的玩家——在通往最终胜利的道路上，我们从不吝啬于打出手牌。\n$libraf_ea_banner_10$\n"
 ap_libra_kings_game_tooltip: "$MOD_COUNTRY_NAVAL_CAPACITY_CONTRIBUTION_FROM_SUBJECTS_MULT$: §G+5%§!\n$MOD_EMPIRE_SIZE_SYSTEMS_MULT$: §G-50%§!\n每§Y-1%§!£mod_empire_size_districts_mult£ §Y$MOD_EMPIRE_SIZE_DISTRICTS_MULT$§!带来§G+2%§!£mod_planet_decision_enact_speed_mult£ §Y$MOD_PLANET_DECISION_ENACT_SPEED_MULT$§!\n每§Y-1%§!£mod_empire_size_pops_mult£ §Y$MOD_EMPIRE_SIZE_POPS_MULT$§!带来§G+2%§!£mod_council_agenda_progress_speed£ §Y$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$§!\n$libra_unlock_planet_buildings$['building:holding_libra_kings_game']\n$t$§Y$holding_libra_kings_game$§! 能且仅能建造于§Y附属国§!首都。\n$libra_unlock_agenda$$council_agenda_agenda_libra_kings_game_name$\n$t$§Y$council_agenda_agenda_libra_kings_game_name$§! 每次启动后都将永久增加§Y$mod_divided_patrongage_max_subjects$§!。\n$libra_unlock_tradable_action$$trade_action_libra_kings_game$\n$t$§Y$trade_action_libra_kings_game$§! 可向§Y盟友§!或§Y附庸§!发起，持续期间为双方增加§G+10%§!£mod_produces_mult£ §Y$mod_country_produces_mult$§!并降低§G-15%§! £mod_empire_size_districts_mult£ §Y$MOD_EMPIRE_SIZE_DISTRICTS_MULT$§!和 £mod_empire_size_pops_mult£ §Y$MOD_EMPIRE_SIZE_POPS_MULT$§!。"
 holding_libra_kings_game: "国王营地"
 holding_libra_kings_game_desc: "依照我们宗主国的意见，积极维护这座建筑对双方都有好处，应当是这样的。"
 council_agenda_agenda_libra_kings_game_name: "国王旨意"
 council_agenda_agenda_libra_kings_game_desc: "附庸服务于我们：缴纳资源，视作纳税；奉献舰队，视作护卫；献出领土，视作馈赠。"
 agenda_libra_kings_game_finish_modifier: "$council_agenda_agenda_libra_kings_game_name$议程"
 agenda_libra_kings_game_effect: "$council_agenda_agenda_libra_kings_game_name$"
 agenda_libra_kings_game_tooltip: "§G+1~3§!§Y$mod_divided_patrongage_max_subjects$§!"
 trade_action_libra_kings_game: "国王交易"
 trade_action_libra_kings_game_desc: "来吧，进行一场对我们双方都有益无害的交流。"
 trade_action_libra_kings_game_modifier: "$trade_action_libra_kings_game$"
 trade_action_libra_kings_game_modifier_desc: "这应该是一项对等的交易，我们可以同另一方各取所需。"
 libra_fairy.0599.name: "棋手之名：§H[Root.GetName]§!"
 libra_fairy.0599.desc: "银河的权谋之网中，偶尔会出现一个真正的织网者。当其他文明还在为附庸国的忠诚与背叛而焦虑时，[Root.GetName]早已将整个附属体系玩弄于股掌之间。\n\n他们深谙索取与施舍的辩证：每一次贡品的征收，都是对附属国实力的精确计量；每一次慷慨的援助，都是为未来更高效的收割播下种子。他们的附属国如同棋盘上的棋子——有的被推向风口浪尖以消耗敌人，有的被安置在资源节点以滋养帝国，有的则在忠诚与反叛的边缘摇摆，成为牵制对手的活棋。\n\n在宇宙历史的长河中，这样的玩家寥寥无几。他们不追求一时的征服，而是在每一次附属互动中积累隐形的优势。当其他文明还在计算战争胜负时，他们已经通过政治博弈赢得了下一轮游戏的入场券。\n\n有人说这是狡诈，有人说这是智慧。但无论何种评价，都无法否认：这个文明已经掌握了宇宙政治的终极艺术——让规则为自己服务，让附庸成为自己力量的延伸。"
 libra_fairy.0599.a: "国王的命令是绝对的。"
 libra_fairy.0599.a.tt: "§G+2§!§Y$mod_divided_patrongage_max_subjects$§!"

