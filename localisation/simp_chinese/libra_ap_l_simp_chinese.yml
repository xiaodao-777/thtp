 ap_libra_transcendent_covenant: "超凡之约"
 ap_libra_transcendent_covenant_desc: "相同的目标将我们集结于此。\n坚定的信仰使我们与众不同。\n$libraf_ea_banner_1$\n"
 ap_libra_transcendent_covenant_tooltip: "每隔§Y240~360§!天：\n$t$当前内阁议程推进§G10%§!进度\n$t$随机殖民地以§Y80%§!几率提升§G+1§!§Y$planetary_ascension$§!\n启动§Y$COUNCIL_AGENDA$§!时：\n$t$首都获得§G100§!£pop£ §Y$POP$§!\n$t$所有殖民地以§Y50%§!几率提升§G+1§!§Y$planetary_ascension$§!\n$libra_unlock_agenda$$council_agenda_agenda_libra_transcendent_covenant_a_name$ $council_agenda_agenda_libra_transcendent_covenant_b_name$ $council_agenda_agenda_libra_transcendent_covenant_c_name$\n$t$以上议程冷却时间更短且启动花费更低，但无法同时启动。"
 LIBRA_TRANSCENDENT_COVENANT_EFFECT_TITLE: "超凡告解"
 LIBRA_TRANSCENDENT_COVENANT_EFFECT_1_DESC: "我们的目标使我们愈发团结。\n\n§H当前内阁议程推进§G10%§!进度§!"
 LIBRA_TRANSCENDENT_COVENANT_EFFECT_2_DESC: "我们的信仰使我们愈发强大。\n\n§H当前内阁议程推进§G10%§!进度\n$PLANET|Y$提升§G+1§!§Y$planetary_ascension$§!§!"
 council_agenda_agenda_libra_transcendent_covenant_a_name: "圣智之约"
 council_agenda_agenda_libra_transcendent_covenant_a_desc: "寻求更高的智慧。"
 agenda_libra_transcendent_covenant_a_finish_modifier: "$council_agenda_agenda_libra_transcendent_covenant_a_name$议程"
 council_agenda_agenda_libra_transcendent_covenant_b_name: "神武之约"
 council_agenda_agenda_libra_transcendent_covenant_b_desc: "探索更强的力量。"
 agenda_libra_transcendent_covenant_b_finish_modifier: "$council_agenda_agenda_libra_transcendent_covenant_b_name$议程"
 council_agenda_agenda_libra_transcendent_covenant_c_name: "丰饶之约"
 council_agenda_agenda_libra_transcendent_covenant_c_desc: "发现更大的宝藏。"
 agenda_libra_transcendent_covenant_c_finish_modifier: "$council_agenda_agenda_libra_transcendent_covenant_c_name$议程"
 libra_fairy.0509.name: "超凡之证：§H[Root.GetName]§!"
 libra_fairy.0509.desc: "我们以卓越的智慧开启了至高至圣的道路，而那尽头是千秋万载生生不息的无尽繁荣。\n\n我们刚刚踏出了第一步，未来离我们从不遥远。"
 libra_fairy.0509.a: "将历史铭刻于内心。"
 libra_fairy.0509.a.tt: "将§Y$planetary_ascension$§!提升至§G+8§!"
 libra_fairy.0509.b: "在纷乱中达到和谐。"
 libra_fairy.0509.c: "把平衡赋予以循环。"

 ap_libra_galaxy_ambition: "星河野望"
 ap_libra_galaxy_ambition_desc: "以往那繁复冗杂的管理体系已然成为了累赘，正越来越明显地拖累帝国的运转。我们需要打破常规：重构行政系统，以期能够将更加广大的宇域纳入支配之下。\n$libraf_ea_banner_2$\n"
 ap_libra_galaxy_ambition_tooltip: "$libra_unlock_planet_buildings$['building:building_libra_galaxy_bureaucratic_1']\n$t$§Y$building_libra_galaxy_bureaucratic_1$§! 需要 £society£ §Y$tech_capital_productivity_1$§!科技以解锁，提供 £job_politician£ §Y$job_politician$§!和 £job_enforcer£ §Y$job_enforcer$§!$JOBS_TITLE$、殖民地$EFFECTS_TXT$及$EMPIRE_EFFECTS_W_ICON$；研究相关科技后，可升级为 £building£ ['building:building_libra_galaxy_bureaucratic_2']及 £building£ ['building:building_libra_galaxy_bureaucratic_3']。\n$libra_unlock_planet_buildings$['building:building_libra_galaxy_bureaucratic_4']\n$t$§Y$building_libra_galaxy_bureaucratic_4$§! 只能建造§Y1§!座，根据 £job_enforcer£ §Y$job_enforcer_plural$§!总数降低 £empire_sprawl£ §Y$EMPIRE_SIZE$§!。"
 ap_libra_galaxy_ambition_policy_tooltip: "$libra_unlock_policies$$policy_libra_galaxy_ambition$\n$t$§Y$policy_libra_galaxy_ambition$§! 使 £pop_cat_ruler£ §Y$pop_cat_ruler$§!额外产出指定的 £trade£ £alloys£ £physics£ £society£ £engineering£ £unity£ 资源。"
 building_libra_galaxy_bureaucratic_1: "殖民办事处"
 building_libra_galaxy_bureaucratic_1_desc: "$building_bureaucratic_2_desc$"
 building_libra_galaxy_bureaucratic_2: "行星事务所"
 building_libra_galaxy_bureaucratic_2_desc: "$building_bureaucratic_3_desc$"
 building_libra_galaxy_bureaucratic_3: "星系管理局"
 building_libra_galaxy_bureaucratic_3_desc: "借助超光速通信技术，最杰出的管理者们在这里调度着整个行星的日常运作。"
 building_libra_galaxy_bureaucratic_4: "帝国宣政院"
 building_libra_galaxy_bureaucratic_4_desc: "这座硕大无朋的建筑矗立在我们的首府之上，其内部是一整个精密到极致的巨大官僚中枢。利用这套完备的行政体系，我们的帝国将能更加高效地运转。"
