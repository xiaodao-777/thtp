 libra_fairy.2140.name: "探险传说：§H[Root.GetName]§!"
 libra_fairy.2140.desc: "当他们决然挣脱母星的温柔怀抱，驾驶着承载希望的方舟驶入无垠的深空，便已将自身化作了连接已知与未知的桥梁。\n\n这些孤独的航行者，在星辰的荒漠中漂泊，唯有闪烁的群星与船舷外呼啸的宇宙之风相伴。时光在他们漫长的旅途中被拉得无比纤长，支撑他们的，唯有心中那簇不灭的火焰——那是对真理的纯粹渴望，是决心为所有智慧生命揭开宇宙奥秘的坚定信念。即使前方是吞噬一切的虚无，他们仍在冰冷的仪器读数中搜寻新世界的踪迹，在绝对的寂静里捕捉可能存在的最微弱回响。\n\n终于，当陌生的尘埃第一次留下造访者的印记，当亘古的黑暗被新生的光芒刺破，那壮丽的时刻便降临了——他们以航迹丈量宇宙的尺度，用灯火点燃了文明疆域无限延展的可能。他们的身影或许最终凝固在星海深处，却成为所有后来者仰望的永恒路标。这路标无声诉说着：是向死而生的勇气，在绝对的虚无中播下了文明的种子；这渺小的种子，终将在无尽时空里萌发出参天的未来。正因有了这些先驱者的牺牲与探索，那曾冰冷而遥不可及的广袤宇宙，才得以向所有智慧生命敞开怀抱，成为我们共同精神家园的辽阔延伸。"
 libra_fairy.2140.a: "星图里潜藏的是什么？"
 r_libra_warrant_of_return: "残损球体"
 r_libra_warrant_of_return_desc: "似乎是某个高阶文明留下的遗物，它强大的能量肉眼可见，但我们只能够引出其中微不足道的一小部分。"
 relic_libra_warrant_of_return_tt: "$TRIGGER_FAIL$我们不具备运用这件未知遗物的技术"

