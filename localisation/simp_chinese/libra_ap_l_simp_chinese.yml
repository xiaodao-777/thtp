 libra_fairy.2060.name: "无名赞诗：§H[Root.GetName]§!"
 libra_fairy.2060.desc: "当石矛劈开兽齿的寒光\n他的脊梁在洞穴里站成界碑\n当洪峰啃噬大地的骨肉\n他用双手从漩涡中捧出沃野\n\n在齿轮咬合的灼热牢笼\n他锻打钢铁的筋骨支撑穹苍\n当数据毒雾侵蚀星轨\n他以光为刃刺穿虚无的网\n\n深空张开混沌的巨口\n他立在舷窗前校准群星坐标\n没有名姓刻进青铜\n每个挺身瞬间都是火种——\n从燧石到星穹\n光焰在我们掌心跳动"
 libra_fairy.2060.a: "提携后进。"
