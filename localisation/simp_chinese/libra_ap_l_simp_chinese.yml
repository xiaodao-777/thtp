 ap_libra_shift_in_focus: "焦点转移"
 ap_libra_shift_in_focus_desc: "有些事情民众并不需要知道，有些秘密深潜在水下就好。我们的通讯技术今非昔比，可以有更多更好更巧妙的方法来转移人们的视线，矛盾也好冲突也罢，都不过是我们实现目的的一种手段。\n$libraf_ea_banner_3$\n"
