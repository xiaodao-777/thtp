 ap_libra_ultimate_directive: "最终指令"
 ap_libra_ultimate_directive_desc: "放弃同一性无异于消亡。确保主体意识能节制所有子个体乃是重中之重，只有这样，才能使整个格式塔帝国在中央智能的调控下运作无虞。\n$libraf_ea_banner_5$\n"
