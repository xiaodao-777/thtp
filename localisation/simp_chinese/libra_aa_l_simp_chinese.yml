 building_libra_duplex_cloning_chamber: "复式克隆仓"
 building_libra_duplex_cloning_chamber_desc: "这座巨大的设施兼顾生物学研究与克隆仓功能，慎密的科学技术使其获得了远超一般培养仓的效率。"
