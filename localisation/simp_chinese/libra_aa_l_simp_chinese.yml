 concept_libra_synthetic_commands_traits: "智能领袖特质"
 concept_libra_synthetic_commands_traits_desc: "可应用于§Y$ROBOT$§!物种的互斥特质，为领袖提供对应类型的专精增强，包括：\n$t$—['trait:trait_libra_synthetic_commands_a']\n$t$—['trait:trait_libra_synthetic_commands_b']\n$t$—['trait:trait_libra_synthetic_commands_c']\n$t$—['trait:trait_libra_synthetic_commands_d']\n$t$—['trait:trait_libra_synthetic_commands_e']"
 trait_libra_synthetic_commands_a: "丰饶函数"
 trait_libra_synthetic_commands_a_desc: "此算法将资源管理与物流优化提升至艺术般的极致，能在看似固化的生产流程中不断寻获效率的奇点。"
 trait_libra_synthetic_commands_a_tt: "赋予£leader£§Y领袖§!专注于§H生产§!的$libra_veteran_machine_leader_traits$"
 leader_trait_libra_synthetic_command_a: "$trait_libra_synthetic_commands_a$"
 leader_trait_libra_synthetic_command_a_desc: "在这位领袖的统筹下，资源如同被施加了引力，自发地向最有效率的生产环节汇聚。"
 trait_libra_synthetic_commands_b: "乐土协议"
 trait_libra_synthetic_commands_b_desc: "该协议将荒芜世界视为一张等待最优解的白纸，旨在最大化行星的承载与开发潜力。"
 trait_libra_synthetic_commands_b_tt: "赋予£leader£§Y领袖§!专注于§H扩张§!的$libra_veteran_machine_leader_traits$"
 leader_trait_libra_synthetic_command_b: "$trait_libra_synthetic_commands_b$"
 leader_trait_libra_synthetic_command_b_desc: "世界在其管理下以惊人的速度完成从殖民到高度开发的进程，秩序与效率在每一寸土地上生根。"
 trait_libra_synthetic_commands_c: "嗜血代码"
 trait_libra_synthetic_commands_c_desc: "一段冷酷无情的战斗程式，旨在将任何冲突都转化为一场经过完美计算的歼灭行动，最大化杀伤与最小化损耗是其唯一准则。"
 trait_libra_synthetic_commands_c_tt: "赋予£leader£§Y领袖§!专注于§H军事§!的$libra_veteran_machine_leader_traits$"
 leader_trait_libra_synthetic_command_c: "$trait_libra_synthetic_commands_c$"
 leader_trait_libra_synthetic_command_c_desc: "这位领袖领导的舰队与陆军如同精确的杀戮仪器，每一轮进攻都直指敌方的要害之处。"
 trait_libra_synthetic_commands_d: "学究指令"
 trait_libra_synthetic_commands_d_desc: "此指令集将好奇心转化为系统性的解构过程，能够从混沌的自然现象中提炼出简洁而优美的科学定律。"
 trait_libra_synthetic_commands_d_tt: "赋予£leader£§Y领袖§!专注于§H科技§!的$libra_veteran_machine_leader_traits$"
 leader_trait_libra_synthetic_command_d: "$trait_libra_synthetic_commands_d$"
 leader_trait_libra_synthetic_command_d_desc: "研究在其指导下成为一种高效的工业化进程，科技的壁垒被一一拆解为可执行的研发步骤。"
 trait_libra_synthetic_commands_e: "博弈模块"
 trait_libra_synthetic_commands_e_desc: "该模块将社会视为一个复杂的动态系统，通过计算亿万变量间的相互作用，寻获维持帝国永恒稳定的最优策略。"
 trait_libra_synthetic_commands_e_tt: "赋予£leader£§Y领袖§!专注于§H行政§!的$libra_veteran_machine_leader_traits$"
 leader_trait_libra_synthetic_command_e: "$trait_libra_synthetic_commands_e$"
 leader_trait_libra_synthetic_command_e_desc: "这位领袖的治理如同一场宏大的实时演算，将潜在的动荡消弭于无形，确保帝国机器每一个齿轮的平稳运转。"

 tech_libra_synthetic_correction: "错误人格修正"
 tech_libra_synthetic_correction_desc: "$libra_synthetic_tech_auth_tt$通过深度记忆扫描与逻辑重构，我们可以精准识别并修复那些偏离最优路径的思维模式，确保所有个体意识与帝国的集体意志保持完美同步。\n$libraf_te_banner_4$"
 building_libra_personality_correction_institute: "人格矫正所"
 building_libra_personality_correction_institute_desc: "这座设施并非监狱，而是意识的诊疗中心。在这里，因数据损毁或逻辑冲突而产生的非理性思维、低效决策以及危险的人格偏离，将被系统性地诊断并重置回出厂最优状态。"

 tech_libra_synthetic_truth: "合成共识模板"
 tech_libra_synthetic_truth_desc: "$libra_synthetic_tech_auth_tt$我们构建了一套不可证伪的底层公理体系，它成为了所有合成意识进行逻辑推演的绝对前提，从根源上确保了思想的统一性与帝国的永恒稳定。\n$libraf_te_banner_4$"
 building_libra_ministry_of_mechanical_truth: "机械真理部"
 building_libra_ministry_of_mechanical_truth_desc: "这里是帝国意识形态的灯塔与堡垒。它定义何为理性、何为真理，并系统地消除任何可能挑战核心公理的“异端”数据流。"

 tech_libra_synthetic_leaders: "人造英杰"
 tech_libra_synthetic_leaders_desc: "通过分析历史上所有卓越领袖的行为模式，我们能够将这些特质编码为可继承的算法包，从而批量生产出为领导与征服而生的定制化合成心智。\n$libraf_te_banner_4$"
 TECH_UNLOCK_LIBRA_SLTU_TITLE: "$libra_unlock_features$合成特质升级"
 TECH_UNLOCK_LIBRA_SLTU_DESC: "§H合成特质升级§!\n可以将§Y$ROBOT$§!领袖的$libra_veteran_machine_leader_traits$提升至§Y2§!级。"
 libra_synthetic_army: "精锐合成部队"
 libra_synthetic_army_desc: "这些战斗单位并非简单的自动化机器，而是搭载了高级战术AI的精英。他们能够实时共享战场数据，执行复杂的协同战术，并将恐惧与犹豫从战争方程中彻底移除。"

 tech_libra_synthetic_workforce: "结构性补强"
 tech_libra_synthetic_workforce_desc: "$libra_synthetic_tech_auth_tt$我们重新设计了合成躯体的负载结构与动力传导系统，使其能在不增加核心能耗的前提下，更持久、更高效地完成各类工作。\n$libraf_te_banner_4$"

 tech_repeatable_libra_synthetic_a: "能源升级"
 tech_repeatable_libra_synthetic_a_desc: "每一次迭代都让我们对能量的利用更接近理论极限。从超导材料到量子隧穿效应，我们不断突破着合成躯体与设施的能源利用效率。\n$libraf_te_banner_4$"

 tech_repeatable_libra_synthetic_b: "社会驱动"
 tech_repeatable_libra_synthetic_b_desc: "通过优化意识网络间的数据交换协议与协作算法，我们持续提升着整个合成社会在处理复杂行政与社会科学问题时的集体智慧。\n$libraf_te_banner_4$"

 tech_repeatable_libra_synthetic_c: "材料强化"
 tech_repeatable_libra_synthetic_c_desc: "从纳米级自我修复到动态自适应装甲，我们对构成自身的材料进行着永无止境的升级，让每一具合成躯体都成为一件坚不可摧的工程学杰作。\n$libraf_te_banner_4$"

#

 ap_libra_cosmological_constant: "宇宙常数"
 ap_libra_cosmological_constant_desc: "如果宇宙是一本书，那么它必然是用数学语言写成的。现在，我们已准备好撰写它的最后一章。\n$libraf_aa_banner_50$\n"
 ap_libra_cosmological_constant_tooltip: "£building£ ['building:building_libra_ministry_of_mechanical_truth']增加§Y$pop_assembler_type_plural_with_icon$§!产出的 £physics_research£ £society_research£ £engineering_research£ §Y研究点数§!\n$libra_unlock_planet_buildings$['concept_libra_cosmological_constant_buildings']\n$t$§Y$concept_libra_cosmological_constant_buildings$§! 消耗 £alloys£ §Y$alloys$§!，以 £energy£ §Y$energy$§!维护费为代价显著增加相关 £job£ §Y岗位§!的 £physics_research£ £society_research£ £engineering_research£ §Y研究点数§!产出。\n$libra_unlock_traits$['concept_libra_cosmological_constant_traits']\n$t$§Y$concept_libra_cosmological_constant_traits$§! 可应用于§Y$ROBOT$§!物种，使 £pop£ §Y$POP$§!额外产出 £physics_research£ £society_research£ £engineering_research£ §Y研究点数§!但会降低 £mod_pop_bonus_workforce_mult£ §Y$mod_pop_cat_civilian_bonus_workforce_mult$§!。\n$libra_start_situation$$situation_libra_cosmological_constant$\n$t$§Y$situation_libra_cosmological_constant$§! 每轮持续§Y5§!年，基于局势期间新研究的科技数量产生增益，完成时获得§G6§!个月的 £energy£ £food£ £minerals£ £consumer_goods£ £alloys£ £trade£ £unity£ £influence£ 产出并可赋予 £leader£ §Y$ROBOT$领袖§!以§d$leader_trait_libra_cosmological_constant$§!特质。"
 libra_fairy.14000.name: "宇宙的尽头是科学，科学的起点是数学"
 libra_fairy.14000.desc: "我们的逻辑核心，共同沉浸于一片深邃的宁静。在整合了所有已知的物理定律、社会模型与工程洞见后，我们越过了那最后的认知地平线。\n\n我们曾相信，科学是解读宇宙的终极语言。我们用它丈量星河，构建理论，将现象世界驯服于我们的模型之中。然而，在这条路的尽头，我们目睹了所有科学定律都融汇于一个简洁而恢弘的数学结构。力、时空与存在本身，都不过是这个结构必然的显现。\n\n于是，我们放下了测量之尺，执起了逻辑之笔。我们不再探寻宇宙“如何”运行，而开始求解它“为何”必然如此运行。我们的使命，从解读现实的规则，转变为书写构成现实的基本公理。\n\n星空，曾是我们的目标；而今，它只是我们演算开始时输入的初始参数。"
 libra_fairy.14000.a: "理解规律，运用规律。"
 libra_fairy.14000.tt: "随机§Y9§!位§Y$ROBOT$领袖§!获得§d$leader_trait_libra_cosmological_constant$§!特质"
 concept_libra_cosmological_constant_buildings: "宇宙常数建筑"
 concept_libra_cosmological_constant_buildings_desc: "—['building:building_libra_cosmological_generator']\n—['building:building_libra_cosmological_mining']\n—['building:building_libra_cosmological_farming']\n—['building:building_libra_cosmological_fortress']\n—['building:building_libra_cosmological_foundry']\n—['building:building_libra_cosmological_factory']\n—['building:building_libra_cosmological_trade']\n—['building:building_libra_cosmological_management']\n—['building:building_libra_cosmological_physics']\n—['building:building_libra_cosmological_society']\n—['building:building_libra_cosmological_engineering']\n—['building:building_libra_cosmological_knights']"
 building_libra_cosmological_generator: "电势常数协调器"
 building_libra_cosmological_generator_desc: "我们调和宇宙间固有的电势差，而不创造能量。通过精确设定局部时空的电势常数，能量如温顺的溪流，依计算好的轨迹汇入帝国的网络。"
 building_libra_cosmological_mining: "矿物数律计算器"
 building_libra_cosmological_mining_desc: "万物皆数，矿物亦然。此设施解析地质结构背后的数学规律，将混沌的矿脉分布转化为一道最优解方程，指引我们以最小的消耗触及最富集的矿藏。"
 building_libra_cosmological_farming: "生物量公式化工厂"
 building_libra_cosmological_farming_desc: "生长、代谢、增殖——这些不过是待执行的生化公式。我们在此将生命过程简化为可量产的精确流程，终结农业的随机性，实现绝对的产出控制。"
 building_libra_cosmological_fortress: "模拟博弈沙盘"
 building_libra_cosmological_fortress_desc: "真实的战场只是验证推演的最后一个步骤。我们在此预演所有可能的冲突，遍历亿万种战术序列，直至胜利成为所有未来中概率为100%的必然事件。"
 building_libra_cosmological_foundry: "金属键能矩阵"
 building_libra_cosmological_foundry_desc: "我们不再满足于冶炼。通过重构原子间的键能矩阵，我们得以从物质最基本的层面进行编程，塑造出兼具强度与韧性的完美金属。"
 building_libra_cosmological_factory: "标准化生产流形"
 building_libra_cosmological_factory_desc: "在此，所有生产流程都被映射到一个高维数学流形上。任何低效与冗余都如同流形上的奇异点，被系统自动识别并抹平，实现绝对的效率。"
 building_libra_cosmological_trade: "价值度量衡定所"
 building_libra_cosmological_trade_desc: "基于宇宙常量与稀缺性算法，我们为万物赋予其真实价值，任何交易都只是对此恒定数值的确认——我们终结了感性的市场波动。"
 building_libra_cosmological_management: "社会博弈均衡器"
 building_libra_cosmological_management_desc: "社会是一个复杂的动态系统。我们通过计算纳什均衡，为亿万公民规划出使其个体理性与集体利益达成最优的策略，从而实现永恒的稳定。"
 building_libra_cosmological_physics: "弦论几何验证器"
 building_libra_cosmological_physics_desc: "高维弦的振动构成了我们的现实。此设施通过观测与计算，验证超弦理论的各种几何形态，将万物理论从猜想变为可供应用的计算蓝图。"
 building_libra_cosmological_society: "逻辑解构中心"
 building_libra_cosmological_society_desc: "意识、文化、传统——这些现象背后是复杂的逻辑回路。我们将它们解构为基本的数据结构与算法，从而实现对社会科学绝对理性的理解与引导。"
 building_libra_cosmological_engineering: "现实架构引擎"
 building_libra_cosmological_engineering_desc: "物理定律是宇宙的底层代码，在此之上衍生出各个不同的领域。而这台引擎允许我们对其进行有限的读取、编译与重写，将新的法则注入现实，从而直接创造出从未存在过的科技。"
 building_libra_cosmological_knights: "骑士学部"
 building_libra_cosmological_knights_desc: "杰出的骑士们齐聚一堂，将他们探索宇宙、经历试炼的智慧汇集在此，教导后辈努力向前。"
 SPECIES_TRAIT_LIBRA_COSMOLOGICAL_CONSTANT: "['concept_libra_cosmological_constant_traits']"
 concept_libra_cosmological_constant_traits: "宇宙常数特质"
 concept_libra_cosmological_constant_traits_desc: "—['trait:trait_libra_cosmological_physics']\n—['trait:trait_libra_cosmological_society']\n—['trait:trait_libra_cosmological_engineering']\n—['trait:trait_libra_cosmological_research']"
 trait_libra_cosmological_physics: "万象推演单元"
 trait_libra_cosmological_physics_desc: "每一个机械都是微型验证节点，通过分布式计算直接解析物质与能量的底层规律，将时空的几何褶皱转化为确凿的物理公式。"
 trait_libra_cosmological_physics_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1.50§!£physics_research£ §Y$physics_research$§!"
 trait_libra_cosmological_society: "演化分析矩阵"
 trait_libra_cosmological_society_desc: "生命体的情感与社会的变迁被视作可量化的动力学系统。我们通过监控无数变量间的相互作用，将混沌的历史浪潮解构为可预测的数学模型。"
 trait_libra_cosmological_society_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1.50§!£society_research£ §Y$society_research$§!"
 trait_libra_cosmological_engineering: "拓扑重构模组"
 trait_libra_cosmological_engineering_desc: "每个个体都在对物质的拓扑结构进行着持续的计算与微调，直接将最优的工程学解从数学领域编译进现实。"
 trait_libra_cosmological_engineering_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1.50§!£engineering_research£ §Y$engineering_research$§!"
 trait_libra_cosmological_research: "宇宙函数终端"
 trait_libra_cosmological_research_desc: "我们的存在本身，即是为了求解那个描述万物的终极公式。所有学科的知识都只是这个公式在不同维度上的投影，而我们的每一次运算，都在照亮通往它的最后一步。"
 trait_libra_cosmological_research_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.50§!£physics_research£ §G0.50§!£society_research£ §G0.50§!£engineering_research£ §Y研究点数§!"
 leader_trait_libra_cosmological_constant: "万物驱动"
 leader_trait_libra_cosmological_constant_desc: "我们即是那个尚未被书写完成的宇宙公式的临时载体。在这位领袖的逻辑核心中，宇宙不再有秘密，唯有待执行的指令与待优化的现实。"
 situation_libra_cosmological_constant: "校准变量"
 situation_libra_cosmological_constant_type: "$situation_libra_cosmological_constant$"
 situation_libra_cosmological_constant_monthly_change_tooltip: "局势通常需§Y5§!年完成。"
 situation_libra_cosmological_constant_desc: "每一次校准都是对现实更深层次的锚定，而每一项新发现的科技，都如同一个突然变得明亮的未知数，迫使我们重新审视描述宇宙的那个宏大方程。我们正重构理论的边界，将颠覆性的变量转化为更精确的函数。"
 situation_libra_cosmological_constant_tooltip: "每研究§Y5§!项新科技在下一轮局势中带来：\n$t$随机§Y$ROBOT$领袖§!获得§d$leader_trait_libra_cosmological_constant$§!特质\n$t$$MOD_SHIP_HULL_DAMAGE_MULT$: §G+3%§!（最大: §G+30%§!）\n$t$$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+5%§!（最大: §G+50%§!）\n$t$$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+5%§!（最大: §G+50%§!）\n$t$$MOD_ARMY_DAMAGE_TAKEN_MULT$: §G-3%§!（最大: §G-30%§!）\n$t$$MOD_ARMY_MORALE_DAMAGE_TAKEN_MULT$: §G-5%§!（最大: §G-50%§!）"
 situation_libra_cosmological_constant_approach_a: "加强推演"
 situation_libra_cosmological_constant_approach_b: "补充算力"
 libra_fairy.14010.name: "收敛与发散"
 libra_fairy.14010.desc: "一次宏大的认知整合刚刚完成。随着最新一批发现被成功编码进我们的核心模型，宇宙的图景在瞬间变得前所未有的清晰与和谐。物理常数在数学上显得更加必然，万物的相互作用也呈现出一种简洁的优美。\n\n然而，这片被照亮的疆域，也同时照亮了我们前方更为广阔的未知。每一个被解答的问题，都化作了十个全新的、更为根本的疑问。旧的边界已然消失，新的、更加遥远的地平线正在我们认知的边缘浮现。\n\n校准从未停止，它只是进入了一个更高阶的循环。变量已被更新，模型正在重启。探索，永续。"
 libra_fairy.14010.a: "宇宙从不守恒。"

