# Cybernetic
# ####################

 tech_libra_centralised_cybernetics: "集中控制论"
 tech_libra_centralised_cybernetics_desc: "作为一种早在机械时代就已经构想的理论，控制论在如今的义体时代将会得到全新的阐释，使我们更快、更稳定的达成目标。\n$libraf_te_banner_3$"

 tech_libra_cybernetic_adaptive_standards: "自适应标准"
 tech_libra_cybernetic_adaptive_standards_desc: "即使在同一个星球上，同一组义体的使用环境也有不小的差异，我们应当为所有的插件编制一套更加灵活的执行程序，尽可能地为使用者提供方便。\n$libraf_te_banner_3$"
 building_libra_augment_dispatch_centre: "强化调度中心"
 building_libra_augment_dispatch_centre_desc: "这座建筑集成了所有$building_augmentation_center$的数据，间接调度着帝国范围内所有半机械植入体的生产、运输和安装。"
 building_libra_augment_dispatch_centre_effect_desc: "帝国每有一座 £building£ §Y$building_augmentation_center$§!就增加§G+4%§!$libra_empire$ £mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!、§Y+1%§!$libra_empire$§Y$mod_planet_jobs_produces_mult$§!和§Y$mod_planet_jobs_upkeep_mult$§!，最多§G+100%§!£mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!、§Y+25%§!§Y$mod_planet_jobs_produces_mult$§!和§Y$mod_planet_jobs_upkeep_mult$§!。"
 building_libra_augment_dispatch_centre_hive: "强化调度枢纽"
 building_libra_augment_dispatch_centre_hive_desc: "$building_libra_augment_dispatch_centre_desc$"
 building_libra_augment_dispatch_centre_assimilator: "强化调度节点"
 building_libra_augment_dispatch_centre_assimilator_desc: "$building_libra_augment_dispatch_centre_desc$"
 building_libra_augment_dispatch_centre_assimilator_effect_desc: "帝国每有$pop_group_unit$£job_augmentor_drone£ §Y$job_augmentor_drone_plural$§!就增加§G+1%§!$libra_empire$ £mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!、§Y+0.25%§!$libra_empire$§Y$mod_planet_jobs_produces_mult$§!和§Y$mod_planet_jobs_upkeep_mult$§!，最多§G+100%§!£mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!、§Y+25%§!§Y$mod_planet_jobs_produces_mult$§!和§Y$mod_planet_jobs_upkeep_mult$§!。"

 tech_libra_universal_prosthesis: "泛用强化体"
 tech_libra_universal_prosthesis_desc: "我们需要一种通用、强力且易于普及的组件，以便对我们所有的个体都实施以一视同仁的强化。\n$libraf_te_banner_3$"
 TECH_UNLOCK_LIBRA_UCT_TITLE: "$libra_unlock_features$泛用义体改造"
 TECH_UNLOCK_LIBRA_UCT_DESC: "§H泛用义体改造§!\n$concept_libra_universal_prosthesis_traits_desc$"
 SPECIES_TRAIT_LIBRA_UNIVERSAL_CYBORG: "['concept_libra_universal_prosthesis_traits']"
 concept_libra_universal_prosthesis_traits: "泛用义体特质"
 concept_libra_universal_prosthesis_traits_desc: "可应用于§Y$trait_cybernetic$§!及§Y$ROBOT$§!物种的义体特质，无法装配于§Y$trait_psionic$§!或§Y$trait_robot_digital_1$§!物种，包括：\n$t$—['trait:trait_libra_universal_prosthesis_energy']\n$t$—['trait:trait_libra_universal_prosthesis_minerals']\n$t$—['trait:trait_libra_universal_prosthesis_food']\n$t$—['trait:trait_libra_universal_prosthesis_trade']\n$t$—['trait:trait_libra_universal_prosthesis_consumer_goods']\n$t$—['trait:trait_libra_universal_prosthesis_alloys']\n$t$—['trait:trait_libra_universal_prosthesis_unity']\n$t$—['trait:trait_libra_universal_prosthesis_research']\n$t$—['trait:trait_libra_universal_prosthesis_crime']"
 libra_prosthesis_energy_upkeep_1_tt: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R0.50§!£energy£ §Y$energy$§!"
 libra_prosthesis_energy_upkeep_2_tt: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R1§!£energy£ §Y$energy$§!"
 trait_libra_universal_prosthesis_energy: "技工配件包"
 trait_libra_universal_prosthesis_energy_desc: "专用于操作、调整和修理电力设施的义体套组。"
 trait_libra_universal_prosthesis_minerals: "采掘方程式"
 trait_libra_universal_prosthesis_minerals_desc: "此强化插件允许使用者同时操作数十台工作机械执行开采作业。"
 trait_libra_universal_prosthesis_food: "营养合成槽"
 trait_libra_universal_prosthesis_food_desc: "用于直接合成淀粉等营养物质的特殊容器，在接入义体网络后能够进行更大规模的生产组织。"
 trait_libra_universal_prosthesis_trade: "快速市场协议"
 trait_libra_universal_prosthesis_trade_desc: "用于实现快速交易的插件。"
 trait_libra_universal_prosthesis_consumer_goods: "精工模板"
 trait_libra_universal_prosthesis_consumer_goods_desc: "能够按预设自行加工艺术品或其它消耗品的高精度机械臂。"
 trait_libra_universal_prosthesis_alloys: "熔炉增压器"
 trait_libra_universal_prosthesis_alloys_desc: "这种重型组件能够直接介入纳米熔炉工作，增加并维持熔炉运作功率。"
 trait_libra_universal_prosthesis_unity: "内宣扩音器"
 trait_libra_universal_prosthesis_unity_desc: "此插件能是佩戴者实施接收和了解各种政令，也能强制纠正佩戴者的违章行为。"
 trait_libra_universal_prosthesis_research: "逻辑增强回路"
 trait_libra_universal_prosthesis_research_desc: "这些芯片能够在有限的范围内大大增强个体的逻辑思维能力。"
 trait_libra_universal_prosthesis_crime: "镇暴模块"
 trait_libra_universal_prosthesis_crime_desc: "义体化显著增加了个体能力，同时也增加了不稳定因素，这些模块在某些领域拥有更高级的权限，可以轻易地压制犯罪活动。"

 tech_libra_multiprosthesis_integration: "多模块集成"
 tech_libra_multiprosthesis_integration_desc: "整合多种不同类型但关联性强的植入体，我们可以制造出强大的魔偶组件，将我们的存在提升至全新的层次。\n$libraf_te_banner_3$"
 TECH_UNLOCK_LIBRA_MCT_TITLE: "$libra_unlock_features$集成义体改造"
 TECH_UNLOCK_LIBRA_MCT_DESC: "§H集成义体改造§!\n$concept_libra_multi_prosthesis_traits_desc$"
 SPECIES_TRAIT_LIBRA_MUTI_CYBORG: "['concept_libra_multi_prosthesis_traits']"
 concept_libra_multi_prosthesis_traits: "集成义体特质"
 concept_libra_multi_prosthesis_traits_desc: "可应用于§Y$trait_cybernetic$§!及§Y$MACHINE$§!物种的义体特质，为领袖提供对应类型的增强，无法同时装配，包括：\n$t$—['trait:trait_libra_multi_prosthesis_a']\n$t$—['trait:trait_libra_multi_prosthesis_b']\n$t$—['trait:trait_libra_multi_prosthesis_c']\n$t$—['trait:trait_libra_multi_prosthesis_d']\n$t$—['trait:trait_libra_multi_prosthesis_e']\n$t$—['trait:trait_libra_multi_prosthesis_f']"
 trait_libra_multi_prosthesis_a: "魔偶：心灵动力"
 trait_libra_multi_prosthesis_a_desc: "此魔偶能够释放使用者意识深处的力量，在战场上无比坚韧。"
 trait_libra_multi_prosthesis_a_tt: "赋予£leader£§Y领袖§!提升 £energy£ £trade£ 产出的$libra_veteran_cyborg_leader_traits$"
 leader_trait_libra_multi_prosthesis_a: "心灵动力"
 leader_trait_libra_multi_prosthesis_a_desc: "这位领袖配置了用于解除躯体神经限制的组件。"
 trait_libra_multi_prosthesis_b: "魔偶：源能奔涌"
 trait_libra_multi_prosthesis_b_desc: "没什么事情是靠气势解决不了的，这组魔偶的使用者总是魄力满满。"
 trait_libra_multi_prosthesis_b_tt: "赋予£leader£§Y领袖§!提升 £energy£ £food£ £minerals£ 产出的$libra_veteran_cyborg_leader_traits$"
 leader_trait_libra_multi_prosthesis_b: "源能奔涌"
 leader_trait_libra_multi_prosthesis_b_desc: "这位领袖装配了能够提振精神的特殊组件，一定程度上增加了活动能力。"
 trait_libra_multi_prosthesis_c: "魔偶：回声协议"
 trait_libra_multi_prosthesis_c_desc: "用于进行监听和管理人口的特殊魔偶。"
 trait_libra_multi_prosthesis_c_tt: "赋予£leader£§Y领袖§!提升 £unity£ £trade£ 产出的$libra_veteran_cyborg_leader_traits$"
 leader_trait_libra_multi_prosthesis_c: "回声协议"
 leader_trait_libra_multi_prosthesis_c_desc: "这位领袖的植入体接入了监视协议的终端，能够随时获取隐秘的情报。"
 trait_libra_multi_prosthesis_d: "魔偶：边城匠师"
 trait_libra_multi_prosthesis_d_desc: "装配了这个魔偶的人群能够共享部分技巧，有偿地互相支援。"
 trait_libra_multi_prosthesis_d_tt: "赋予£leader£§Y领袖§!提升 £alloys£ £consumer_goods£ 产出的$libra_veteran_cyborg_leader_traits$"
 leader_trait_libra_multi_prosthesis_d: "边城匠师"
 leader_trait_libra_multi_prosthesis_d_desc: "如何精炼，如何制造，这位领袖再清楚不过了，因为答案就在那里。"
 trait_libra_multi_prosthesis_e: "魔偶：愚者智慧"
 trait_libra_multi_prosthesis_e_desc: "频繁至极端的经验总结是这个魔偶的最大特征，他们在试错中发现未来。"
 trait_libra_multi_prosthesis_e_tt: "赋予£leader£§Y领袖§!提升 £physics£ £society£ £engineering£ 产出的$libra_veteran_cyborg_leader_traits$"
 leader_trait_libra_multi_prosthesis_e: "愚者智慧"
 leader_trait_libra_multi_prosthesis_e_desc: "这位领袖拥有先进的助理AI，能够从过去的所有案例中迅速找到最合适的参考。"
 trait_libra_multi_prosthesis_f: "魔偶：傀儡游戏"
 trait_libra_multi_prosthesis_f_desc: "这套魔偶能够剪除装配者不必要的烦恼，使其心情愉快。"
 trait_libra_multi_prosthesis_f_tt: "赋予£leader£§Y领袖§!提升 £energy£ £unity£ 产出的$libra_veteran_cyborg_leader_traits$"
 leader_trait_libra_multi_prosthesis_f: "傀儡游戏"
 leader_trait_libra_multi_prosthesis_f_desc: "傀儡的目标在于极致的价值利用，这位领袖熟知义体的潜在价值。"

 tech_libra_cybernetic_exoskeleton_1: "塑钢强化件"
 tech_libra_cybernetic_exoskeleton_1_desc: "使用塑钢材料改良我们的机械躯体，也许它在各个方面还不完美，也难以频繁更新，相比于传统合金却是母庸质疑的提升。\n$libraf_te_banner_3$"
 building_libra_augment_site_1: "强化服务站点"
 building_libra_augment_site_1_desc: "这座建筑里安置着维护和更新植入体配件的先进设备，为殖民地提供有效支援。"
 building_libra_augment_site_effect_desc: "每有$pop_group_unit$§Y$libra_cybernetics_worker_type_plural_with_icon$§!就增加§G+2.5%§!£mod_produces_mult£ §Y$mod_cyborg_pop_bonus_workforce_mult$§!。"

 tech_libra_cybernetic_exoskeleton_2: "耐钢植入体"
 tech_libra_cybernetic_exoskeleton_2_desc: "先进的耐钢材料不仅坚固，也不容易引起排异反应，更能以流水线快速生产。\n$libraf_te_banner_3$"
 building_libra_augment_site_2: "强化服务中心"
 building_libra_augment_site_2_desc: "不仅仅提供支援业务，这个服务中心也能因地制宜地生产一些高度客制化的配件。"

 tech_libra_cybernetic_exoskeleton_3: "零素外骨骼"
 tech_libra_cybernetic_exoskeleton_3_desc: "零素装甲标志着材料学领域的最高水平，而随之结合的我们将同样坚不可摧，将无法触及的事情变成现实。\n$libraf_te_banner_3$"
 building_libra_augment_site_3: "强化服务枢纽"
 building_libra_augment_site_3_desc: "这个建筑群以惊人的速度产出多种义体配件，并有大量的专业人员在整个殖民地范围内实施投放、维护和回收工作。"

 tech_libra_cybernetic_growth_1: "产业规模化"
 tech_libra_cybernetic_growth_1_desc: "以全新的控制理论为指导，我们能够组织起独属于义体社会的巨大植入体产线，确保劳力永远不会匮乏。\n$libraf_te_banner_3$"
 edict_libra_cybernetic_growth_1: "整合调度"
 edict_libra_cybernetic_growth_1_desc: "借助优化的植入体宣告政令，上传下达，无所迟滞。"

 tech_libra_cybernetic_growth_2: "近未来调律"
 tech_libra_cybernetic_growth_2_desc: "如何组建和稳固面向植入体时代的社会秩序是一个不小的挑战，在延续旧策略的同时，我们需要找到新的出路。\n$libraf_te_banner_3$"
 policy_libra_cybernetic_growth_2: "演化迭代"
 policy_libra_cybernetic_growth_2_desc: "我们可以做出更激进的选择：抛弃部分不能适应机械植入体的孱弱个体，开展一场星际时代的生存竞争。\n "
 policy_libra_cybernetic_growth_2_a: "保守策略"
 policy_libra_cybernetic_growth_2_a_name: "$policy_libra_cybernetic_growth_2_a$"
 libra_cybernetic_growth_2_a_name: "$policy_libra_cybernetic_growth_2_a$"
 policy_libra_cybernetic_growth_2_a_desc: "我们不会真正实施策略，所谓竞争只不过是一种警示。\n "
 policy_libra_cybernetic_growth_2_b: "标准计划"
 policy_libra_cybernetic_growth_2_b_name: "$policy_libra_cybernetic_growth_2_b$"
 libra_cybernetic_growth_2_b_name: "$policy_libra_cybernetic_growth_2_b$"
 policy_libra_cybernetic_growth_2_b_desc: "适当的实施迭代计划，仅淘汰掉不适应社会的个体：将他们从生产力规划中剥离，而将位置留给合适的其他人。\n "
 policy_libra_cybernetic_growth_2_c: "全面推广"
 policy_libra_cybernetic_growth_2_c_name: "$policy_libra_cybernetic_growth_2_c$"
 libra_cybernetic_growth_2_c_name: "$policy_libra_cybernetic_growth_2_c$"
 policy_libra_cybernetic_growth_2_c_desc: "只有足够优秀的机械化个体才是我们社会合格的一员，至于那些老弱病残，我们能带给他们的就是了无痛苦的终结。\n "

 tech_libra_cybernetic_growth_3: "算法再改良"
 tech_libra_cybernetic_growth_3_desc: "再度优化的的高性能植入体算法能够显著提升我们在各个领域的执行效率。\n$libraf_te_banner_3$"
 edict_libra_cybernetic_growth_3: "逻辑适应"
 edict_libra_cybernetic_growth_3_desc: "集合生物的感性与机械的理性于一身，我们可以在一些情况下有更好的选择。"

 tech_libra_cybernetic_growth_4: "融合适应力"
 tech_libra_cybernetic_growth_4_desc: "义体适应我们，和我们适应义体，这些过程是相互的。我们需要尽可能地控制以避免排异反应等异常，确保机械植入体总是能同我们的血肉一样活动无虞。\n$libraf_te_banner_3$"
 policy_libra_cybernetic_growth_4: "增长潜力"
 policy_libra_cybernetic_growth_4_desc: "适当地投入资源，以期进一步拓宽劳动力来源。\n "
 policy_libra_cybernetic_growth_4_a: "义体补贴"
 policy_libra_cybernetic_growth_4_a_name: "$policy_libra_cybernetic_growth_4_a$"
 libra_cybernetic_growth_4_a_name: "$policy_libra_cybernetic_growth_4_a$"
 policy_libra_cybernetic_growth_4_a_desc: "为义体人口发放小额补助，增加其增长活力。\n "
 policy_libra_cybernetic_growth_4_b: "强化维护"
 policy_libra_cybernetic_growth_4_b_name: "$policy_libra_cybernetic_growth_4_b$"
 libra_cybernetic_growth_4_b_name: "$policy_libra_cybernetic_growth_4_b$"
 policy_libra_cybernetic_growth_4_b_desc: "我们的强化师会着力收集和分析每一组故障数据，我们的医务单位会全力解决每一起义体伤害事故，确保所有人都可以拥有最好的卫生环境。\n "
 policy_libra_cybernetic_growth_4_c: "最大支援"
 policy_libra_cybernetic_growth_4_c_name: "$policy_libra_cybernetic_growth_4_c$"
 libra_cybernetic_growth_4_c_name: "$policy_libra_cybernetic_growth_4_c$"
 policy_libra_cybernetic_growth_4_c_desc: "包括但不限于预置公共工程、点对点维护投放等，我们会实施一切行动来促使人口增长。\n "

 planet_libra_augmentors: "义体服务岗位"
 libra_cybernetics_worker_type_plural_with_icon: "[GetLibraCyberneticsWorkerSwapPluralWithIcon]"
 job_libra_cybernetics_worker: "植入体服务员"
 job_libra_cybernetics_worker_plural: "植入体服务员"
 job_libra_cybernetics_worker_with_icon: "£job_libra_cybernetics_worker£$job_libra_cybernetics_worker_plural$"
 job_libra_cybernetics_worker_desc: "服务义体化人口的工作者，协助处理相关问题。\n§Y需要非义体或$trait_hive_mind$劳动力。§!"
 mod_job_libra_cybernetics_worker_add: "[libra_cybernetics_worker.GetName]岗位"
