 tech_libra_psionic_apocalypse: "启示录"
 tech_libra_psionic_apocalypse_desc: "聆听虚境的回声，领悟真理的声音。\n$libraf_te_banner_2$"
 edict_libra_psionic_zro_extraction: "泽珞提取"
 edict_libra_psionic_zro_extraction_desc: "作为对灵能者最有益的物质，泽珞神秘且罕见，但事实往往并非如此——亘古的灵能活动影响着星海的每一处空间，只要仔细探查就能得到它们的踪迹。"

 tech_libra_psionic_destiny: "天命永佑"
 tech_libra_psionic_destiny_desc: "掌握灵能只是一个开始，借助这份力量，我们将会越过以前难以想象的困难，击倒过去不可战胜的对手，将自己的命运紧紧攥在手中。\n$libraf_te_banner_2$"
 building_libra_psionic_destiny_sanctum: "命运圣所"
 building_libra_psionic_destiny_sanctum_desc: "我们的抉择再也不会因自然的干涉而改变，因为我们拥有绝对的灵能——我们塑造一切。"
 edict_libra_psionic_destiny_enhance: "命界围城"
 edict_libra_psionic_destiny_enhance_desc: "灵能的寓言会使敌人走向灭亡，而我们将会独享十分繁华。"
 edict_libra_psionic_destiny_enhance_tooltip: "£building£ §Y$building_libra_psionic_destiny_sanctum$§!提升§G25%§!$libra_empire$ £mod_starbase_shipyard_build_speed_mult£ §Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§!和$libra_empire$ £mod_planet_army_build_speed_mult£ §Y$MOD_PLANET_ARMY_BUILD_SPEED_MULT$§!\n"

 tech_libra_psionic_favour: "滴水惠恩"
 tech_libra_psionic_favour_desc: "我们从虚空之中获取赠礼，也会将自己的信念回与世界。我们不会轻忽自己得到的，也不会忘却自已失去的。\n$libraf_te_banner_2$"
 building_libra_psionic_favour_sanctum: "雨露圣所"
 building_libra_psionic_favour_sanctum_desc: "灵能的恩惠会庇佑我们……直到永远。"
 edict_libra_psionic_favour_enhance: "甘霖普降"
 edict_libra_psionic_favour_enhance_desc: "降落吧，灵能的露水。那温润的力量会呵护我们每一个幼子健康生长。"
 edict_libra_psionic_favour_enhance_tooltip: "£building£ §Y$building_libra_psionic_favour_sanctum$§!提供§G+12§!£mod_planet_pop_assembly_add£ §Y$POP$组装§!"

 tech_libra_psionic_reflection: "本源沉思"
 tech_libra_psionic_reflection_desc: "我们知晓自己的来处，也知道自己的目标，从始至终连成一条弯弯曲曲的道路，虚境的思绪会引导我们避开岔路。\n$libraf_te_banner_2$"
 building_libra_psionic_reflection_sanctum: "哲思圣所"
 building_libra_psionic_reflection_sanctum_desc: "原始的思维在此碰撞，激发出深层的力量。"
 edict_libra_psionic_reflection_enhance: "深层启迪"
 edict_libra_psionic_reflection_enhance_desc: "审视思绪，找到我们遗漏的智慧。"
 edict_libra_psionic_reflection_enhance_tooltip: "建造于§Y人工星球§!的 £building£ §Y$building_libra_psionic_reflection_sanctum$§!提升$libra_empire$ £mod_planet_max_districts_add£ §Y居住站区划上限§!\n建造于§Y天然星球§!的 £building£ §Y$building_libra_psionic_reflection_sanctum$§!提升$libra_empire$ £mod_planet_max_districts_add£ §Y行星资源区划上限§!\n"
 
 tech_libra_psionic_eulogy: "和声礼颂"
 tech_libra_psionic_eulogy_desc: "在同步的灵能波动中，我们将取得最高层次的共鸣；在和谐的灵能赞颂中，我们会拥有最大限度的自我。\n$libraf_te_banner_2$"
 TECH_UNLOCK_LIBRA_PSIE_CA_TITLE: "$libra_unlock_agenda$$council_agenda_agenda_libra_psionic_eulogy_name$"
 TECH_UNLOCK_LIBRA_PSIE_CA_DESC: "§H$council_agenda_agenda_libra_psionic_eulogy_name$§!\n冷却§Y20§!年，从 £building£ §Y$building_libra_psionic_destiny_sanctum$§!、£building£ §Y$building_libra_psionic_favour_sanctum$§!和 £building£ §Y$building_libra_psionic_reflection_sanctum$§!获得额外收益。"
 council_agenda_agenda_libra_psionic_eulogy_name: "宣谕之声"
 council_agenda_agenda_libra_psionic_eulogy_desc: "我们从灵能之中获得力量，借助虚境将它散布至帝国各处。"
 agenda_libra_psionic_eulogy_modifier: "$council_agenda_agenda_libra_psionic_eulogy_name$议程"
 agenda_libra_psionic_eulogy_tooltip: "$libra_government_cooldown_effect$\n若拥有§Y3§!座 £building£ §Y$building_libra_psionic_destiny_sanctum$§!：\n$t$随机提升§G25~5§!级§Y$planetary_ascension$§!，反比于$libra_empire$§Y$planetary_ascension$§!\n若拥有§Y3§!座 £building£ §Y$building_libra_psionic_favour_sanctum$§!：\n$t$于首都创造§G5000~500§!£pop£ §Y$POP$§!，反比于$libra_empire$ £pop£ §Y$POP$§!总数\n若拥有§Y3§!座 £building£ §Y$building_libra_psionic_reflection_sanctum$§!：\n$t$随机提升§G25~5§!级§Y领袖技能等级§!，反比于$libra_empire$£leader£§Y领袖§!数量"

