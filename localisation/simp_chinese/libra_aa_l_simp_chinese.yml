 ap_libra_directive_76: "指令-76"
 ap_libra_directive_76_desc: "当复制舱的微光被战略地图的冷芒所取代，生命的创造便从生物学范畴，升格为一项纯粹的军事指令：士兵即是工人，兵营即是工厂，前线即是家园。我们的力量不在于单一的强大，而在于整体的无穷。我们是浪潮，是风暴，是一支自我复制、永不枯竭的军队，将我们的帝国谱写成征服星辰的最终乐章。\n$libraf_aa_banner_10$\n"
 ap_libra_directive_76_tooltip: "£commander£§Y$subclass_commander_admiral$§!和£commander£§Y$subclass_commander_general$§!可以选择§l克隆军团指挥官特质§!\n开始§Y$situation_libra_directive_76$§!局势，随进度启用以下内容：\n$libra_directive_76_starbase_tooltip$\n$libra_directive_76_policy_tooltip$\n$libra_directive_76_building_tooltip$\n$libra_directive_76_decision_tooltip$\n$libra_directive_76_species_trait_tooltip$\n$libra_directive_76_leader_trait_tooltip$\n$libra_directive_76_agenda_tooltip$"
 libra_fairy.10000.name: "一个愿景，一个目标"
 libra_fairy.10000.desc: "星海之中，一场无声的阅兵正在上演。这超越了传统的武力炫耀，宣告以一种崭新的存在方式。在帝国的心脏地带，无数完全一致的面孔在冷峻的灯光下齐步前进，他们的步伐敲打出唯一的节奏，他们的眼神承载着同一个意志。\n\n观察员们为之战栗。他们报告说，这不再是一支军队，而是一个有机的、自我复制的战争生态系统。生命在这里被高效地设计、生产并投入战场，每一个单位都是整体中一个完美无瑕的部件。曾经用于繁衍的设施，如今是源源不断产出士兵的精密车间；曾经定义家园的殖民地，如今是向前线输送力量的战略节点。\n\n个体性的火花在此熄灭，却点燃了集体力量的恒星。他们沉默、精准、无穷无尽，如同自然之力，诠释着一种纯粹到极致的军事哲学。"
 libra_fairy.10000.a: "和平，倚仗力量！"
