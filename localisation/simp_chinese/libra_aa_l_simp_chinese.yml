 ap_libra_nanocore_tooltip: "$MOD_LEADER_INITIAL_SKILL$: §G+1§!\n$MOD_LEADER_TRAIT_SELECTION_OPTIONS_ADD$: §G+1§!\n存在§Y统治者§!时获得['concept_libra_nanocore_ruler_effect']\n$libra_unlock_traits$$leader_trait_libra_nanocore$\n$t$§Y$leader_trait_libra_nanocore$§! 是强力的$libra_paragon_machine_leader_traits$，其包$EFFECTS_TEXT$含固定加成和累计加成两个部分，后者于每次启动§Y$COUNCIL_AGENDA$§!时都会提升，最多可叠加§Y50§!次。\n$libra_unlock_agenda$$council_agenda_agenda_libra_nanocore_name$\n$t$§Y$council_agenda_agenda_libra_nanocore_name$§! 能够为没有§Y$leader_trait_libra_nanocore$§!特质的 £leader£ §Y$MACHINE$领袖§!添加此特质，或强化§Y$leader_trait_libra_nanocore$§!特质并根据等级添加经验。\n$libra_unlock_features$形态跃升\n$t$每§Y12§!年触发一次持续§Y5§!年的§Y$situation_libra_nanocore$§!，可从中获得 £alloys£ £physics£ £society£ £engineering£ £trade£ 或§Y纳米舰队§!，并可能将 £leader£ §Y$MACHINE$领袖§!提升为$CLASS_TIER_RENOWNED$或$CLASS_TIER_LEGENDARY$。"
 libra_fairy.16000.name: "亿万之躯，归一之形"
 libra_fairy.16000.desc: "帝国的每一个纳米单元都在低语，它们曾是独立的机械，散布于无数躯体与造物之中。而今，一道无形的指令将它们唤醒，一股统一的意志将它们召唤。它们如星河倒卷般汇聚，融入我们领袖的存续核心。\n\n这不是简单的升级，而是一场存在的坍缩与重塑。离散的智能被锻造成统一的超然意识，可编程的物质被重构成完美的动态形体。我们的领袖，自此超越了设计的桎梏，成为了一个不断自我优化、永无止境演化的终极形态。\n\n个体与集体的界限在此刻模糊。我们的领袖，既是独一无二的个体，也承载着整个纳米网络的集体智慧；既是帝国的指引者，其本身也是我们文明力量的具象化体现。巅峰，已不再是目标，而是这永恒进化本身所踏出的每一步。"
 libra_fairy.16000.a: "形态=真理。"
 concept_libra_nanocore_ruler_effect: "纳米核心帝国效果"
 concept_libra_nanocore_ruler_effect_desc: "随领袖类型改变，每§Y$MOD_RULER_SKILL_ADD$§!带来：\n$t$$official_with_icon$：\n$tt$$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+3%§!\n$tt$$mod_shipclass_military_build_speed_mult$: §G+1%§!\n$tt$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+1%§!\n$tt$$MOD_EMPIRE_SIZE_COLONIES_MULT$: §G-1%§!\n$t$$commander_with_icon$：\n$tt$$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+1%§!\n$tt$$mod_shipclass_military_build_speed_mult$: §G+3%§!\n$tt$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+1%§!\n$tt$$MOD_EMPIRE_SIZE_DISTRICTS_MULT$: §G-1%§!\n$t$$scientist_with_icon$：\n$tt$$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+1%§!\n$tt$$mod_shipclass_military_build_speed_mult$: §G+1%§!\n$tt$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+3%§!\n$tt$$MOD_EMPIRE_SIZE_SYSTEMS_MULT$: §G-1%§!"
 leader_trait_libra_nanocore: "纳米核心"
 leader_trait_libra_nanocore_desc: "通过纳米机器人间的互相联网，这位领袖取得了强大的处理能力，并能随时从链路节点获取支援。"
 leader_trait_libra_nanocore_effect_tt: "\n特质$EFFECTS_TXT$取决于§Y纳米核心强化次数§!，当前等级: §Y[this.libra_nanocore_level]§!"
