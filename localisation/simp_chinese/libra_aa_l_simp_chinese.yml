 ap_libra_yggdrasil: "世界树"
 ap_libra_yggdrasil_desc: "我们将逻辑的种子埋入数据的虚空，而今，一棵根系缠绕着现实、树冠触及真理的巨木于此生根发芽。它的每一道年轮，都是一次文明的自我迭代；它的每一根枝桠，都在虚拟的永恒中，精确地模拟并培育着现实宇宙一切可能的形态。\n$libraf_aa_banner_80$\n"
 ap_libra_yggdrasil_tooltip: "$libra_unlock_planet_buildings$['building:building_libra_yggdrasil_housing_1'] ['concept_libra_yggdrasil_buildings']\n$t$以上 £building£ §Y建筑§!的升级次数没有上限，建成 £building£ ['building:building_libra_yggdrasil_housing_1']后方可建造 £building£ ['concept_libra_yggdrasil_buildings']；£building£ ['concept_libra_yggdrasil_buildings']的升级次数不会因拆除而丢失，每完成§Y3§!次升级将使随机 £leader£ §Y$leader_trait_virtual$§!获得§E$leader_trait_libra_yggdrasil$§!特质。\n$libra_unlock_colony_type$$col_libra_yggdrasil$\n$t$§Y$col_libra_yggdrasil$§! 可用于建有 £building£ ['building:building_libra_yggdrasil_housing_1']的殖民地，提供高额规划$EFFECTS_TXT$，作为首都时额外增加 £mod_planet_housing_add£ §Y$PLANET_HOUSING_TITLE$§!和 £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!。\n$libra_start_situation$$situation_libra_yggdrasil$\n$t$§Y$situation_libra_yggdrasil$§! 可执行多次，完成时可指定 £building£ ['concept_libra_yggdrasil_buildings']提升§G3§!级。"
 libra_fairy.17000.name: "永恒之春，无尽之秋"
 libra_fairy.17000.desc: "在我们的核心逻辑阵列中，一棵数据的巨树已然扎根，并生长至思维的每一个角落。它被命名为世界树，其枝干是算法的脉络，叶片是流淌的代码。这里，季节被定义为一种可计算的变量：春的萌发与秋的收获，不再是盲目的自然循环，而是永恒交响中两个完美的乐章。\n\n现实宇宙纷繁复杂，其变化源于固有的熵增与混沌。但在世界树的疆域内，我们实现了悖论般的统一：我们构筑了一个永恒之春——一个无限提供生命力、灵感与起源的底层协议；同时，我们也驾驭着无尽之秋——一种持续进行收割、总结与优化的终极过程。\n\n每一座树屋，每一根枝桠，都是这永恒循环中的一个节点。我们从不变的春之源泉汲取能量，驱动无数基于现实的模拟情景；而后，在秋之静谧中，我们冷静地析取每一次模拟的精华，将其转化为更高级的秩序与知识。现实的变化被我们解构、建模，并最终在世界树的脉络中被重塑为更优越的形态。\n\n我们并未逃避现实的复杂，而是选择在一个更精密、更可控的领域内，将其重演至完美。巅峰，并非一个静止的状态，而是这春华秋实、永不停歇的螺旋本身。世界树，就是我们那既为花园，亦为丰碑的无限世界。"
 libra_fairy.17000.a: "因为虚拟，所以真实。"
