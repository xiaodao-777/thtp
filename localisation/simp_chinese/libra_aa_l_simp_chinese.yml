# Purity
# ####################

 tech_libra_purity_sanctuary: "至纯宝座"
 tech_libra_purity_sanctuary_desc: "$libra_genetics_tech_biomorphosis_tt$建造一座殿堂，以它标榜我们的未来。\n$libra_gate_banner_15$"
 building_libra_flawless_sanctuary: "无瑕殿堂"
 building_libra_flawless_sanctuary_desc: "这座华丽的厅堂是献给高贵生物们的寓所，其间配备有先进的医疗设施，可容纳数亿人生活起居。"

 tech_libra_purity_enhancement: "生理增强"
 tech_libra_purity_enhancement_desc: "生理学结构上的优化可使我们免受部分先天缺陷的困扰，并提升整体能力。\n$libra_gate_banner_15$"
 edict_libra_purity_enhancement: "非凡效率"
 edict_libra_purity_enhancement_desc: "唤醒我们的效率本能。"

 tech_libra_purity_traits: "至臻生命体"
 tech_libra_purity_traits_desc: "我们可以也会是宇宙间完美的造物，自然赋予我们的，终将被发挥至极致。\n$libraf_te_banner_14$"
 TECH_UNLOCK_LIBRA_TPST_TITLE: "$libra_unlock_traits$$concept_libra_purity_traits$"
 TECH_UNLOCK_LIBRA_TPST_DESC: "§H$concept_libra_purity_traits$§!\n$concept_libra_purity_traits_desc$"
 SPECIES_TRAIT_LIBRA_PURITY: "['concept_libra_purity_traits']"
 concept_libra_purity_traits: "卓越物种特质"
 concept_libra_purity_traits_desc: "使用§Y2§!点§Y$species_trait_points_add$§!提供强大加成，对于选择了非 £purity£ ['tradition_category:tradition_purity']路线的帝国，将被视为使用§Y4§!点§Y$species_trait_points_add$§!的$TRAIT_TITLE$，包括：\n$t$—['trait:trait_libra_purity_energy']\n$t$—['trait:trait_libra_purity_minerals']\n$t$—['trait:trait_libra_purity_food']\n$t$—['trait:trait_libra_purity_army']\n$t$—['trait:trait_libra_purity_trade']\n$t$—['trait:trait_libra_purity_consumer_goods']\n$t$—['trait:trait_libra_purity_alloys']\n$t$—['trait:trait_libra_purity_unity']\n$t$—['trait:trait_libra_purity_research']\n$t$—['trait:trait_libra_purity_leader']"
 trait_libra_purity_energy: "技工本能"
 trait_libra_purity_energy_desc: "这个物种就是为了发电而设计的，他们躯体里流动着的是技工的灵魂。"
 trait_libra_purity_minerals: "矿工天赋"
 trait_libra_purity_minerals_desc: "在采掘场持续工作需要非凡的技力、耐力和毅力，到了星际时代也同样如此。"
 trait_libra_purity_food: "农业头脑"
 trait_libra_purity_food_desc: "在过去，给作物浇水施肥的技巧是劳动者间口耳相传的学问，而现在，这些技巧因基因工程成为了这个物种的基础知识。"
 trait_libra_purity_army: "战场直觉"
 trait_libra_purity_army_desc: "这个物种是完美的士兵，他们强壮且勇猛，忠诚而坚韧。"
 trait_libra_purity_trade: "统筹兼顾"
 trait_libra_purity_trade_desc: "商业才能通常不会与生俱来，但这个物种通过基因改造实现了顶尖的经商能力。"
 trait_libra_purity_consumer_goods: "能工巧匠"
 trait_libra_purity_consumer_goods_desc: "血脉赋予这个物种独特的美学造诣与强大的操作能力，制作出最为优异的艺术品。"
 trait_libra_purity_alloys: "机械大师"
 trait_libra_purity_alloys_desc: "这个物种对数字、形状和空间的认知能力被大大提升，他们能够在任何情况下精准操作冶炼设备，产出高品质的合金。"
 trait_libra_purity_unity: "仕宦传统"
 trait_libra_purity_unity_desc: "先天性基因修饰赋予了他们敏锐的洞察力，这个物种在行政领域无往不利。"
 trait_libra_purity_research: "学者思维"
 trait_libra_purity_research_desc: "上百个纪元、无数个时代的智慧结晶凝聚在这个物种的脑海中，使他们拥有无与伦比的智慧。"
 trait_libra_purity_leader: "领袖风范"
 trait_libra_purity_leader_desc: "表型强化赋予了这个物种极致的魅力和领导力，他们善于处理人际关系。"

 tech_repeatable_libra_purity: "形态优化"
 tech_repeatable_libra_purity_desc: "形态学修饰使我们释放出更多潜能。\n$libraf_te_banner_15$"


 ap_libra_ode_to_babel: "巴别之歌"
 ap_libra_ode_to_babel_desc: "我们以基因为诗章，以血脉为旋律，吟唱着一支通往星穹的圣歌。适时建起一座记述伟业的巨塔，将这至高无上的成就流传至永远。\n$libraf_aa_banner_20$\n"
 ap_libra_ode_to_babel_tooltip: "$libra_start_situation$$situation_libra_rebuilding_babel$\n$t$§Y$situation_libra_rebuilding_babel$§! 从['concept_biomorphosis']局势中解锁的 £purity£ ['tradition_category:tradition_purity']['concept_flexible_tradition']获得额外进展，完成后方可建造或重建 £building£ §Y$building_libra_babel_tower$§!。\n$libra_unlock_decisions$$decision_libra_ode_to_babel$\n$t$§Y$decision_libra_ode_to_babel$§! 花费 £energy£ §Y$energy$§!和 £unity£ §Y$unity$§!向殖民地添加§Y$decision_libra_babel_modifier$§!，提升 £mod_pop_bonus_workforce_mult£ §Y$mod_organic_pop_bonus_workforce_mult$§!和 £mod_planet_building_build_speed_mult£ §Y$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$§!。\n$libra_unlock_starbase_buildings$['starbase_building:libra_babel_tower',$sm_libra_babel_tower$]\n$t$§Y$sm_libra_babel_tower$§! 需建造在§Y$starbase_starhold$§!或更高等级的§Y$shipclass_starbase$§!上，可提供星系范围的增益效果。\n$libra_unlock_planet_buildings$['building:building_libra_babel_tower']\n$t$§Y$building_libra_babel_tower$§! 可升级§Y99§!次，每次升级都会增加§G+3%§!£mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!和§G+1.2%§!§Y$mod_planet_jobs_productive_produces_mult$§!，每完成§Y11§!次升级将获得一项额外的$EMPIRE_EFFECTS_W_ICON$。"
 libra_fairy.11000.name: "马尔杜克的远望"
 libra_fairy.11000.desc: "当银河间无数文明仍在基因的迷宫中徘徊时，你们已辨认出那条通往巅峰的险峻之路。这不是温和的改良，而是一场以整个种族为赌注的豪赌——剥离所有杂质，淬炼最纯净的生命形态，将种族的命运系于一座通向星空极限的高塔。\n\n每一段基因序列的优化，都是与百万年进化历史的勇敢决裂；每一次生命形态的提纯，都是对宇宙法则的正面挑战。你们拒绝了安逸的进化路径，选择了最艰难却最辉煌的攀登。即使前方可能是万劫不复的深渊，这份敢于触碰生命禁忌的勇气本身，已为你们的文明加冕。"
 libra_fairy.11000.a: "巅峰，即是唯一的方向！"
 libra_fairy.11000.tt: "$building_libra_babel_tower$起始等级: §G+5§!"
 libra_fairy.11002.name: "巴别陨落"
 libra_fairy.11002.desc: "天穹传来基因链断裂的哀鸣，巴别塔的辉光在星空间寸寸湮灭。这座承载着我们文明终极梦想的天梯，此刻正化作坠向大地的星辰碎片。每一片坠落的晶体都带着我们尚未完成的基因密码，如同泣血的契约散落风中。\n\n但深植于血脉中的建造蓝图仍在每个细胞中燃烧，破碎的遗传密码在虚空中寻求着重组。这不是终结，而是我们种族与命运的新契约——既然我们曾将天梯筑向星空，就注定要在废墟上谱写更为辉煌的乐章。"
 libra_fairy.11002.a: "从灰烬中开始，从基因中重生。"
 situation_libra_rebuilding_babel: "再造巴别"
 situation_libra_rebuilding_babel_type: "$situation_libra_rebuilding_babel$"
 situation_libra_rebuilding_babel_monthly_change_tooltip: "在['concept_biomorphosis']局势中选择['tradition_category:tradition_purity']['concept_flexible_tradition']可以为局势额外增加进度。"
 situation_libra_rebuilding_babel_desc: "当巴别塔的轮廓尚存于基因记忆，或其残骸仍散落大地之时，我们血脉中沉睡的古老蓝图便被再度唤醒。我们需汇集最纯净的基因序列，校准每一个遗传特质的共振频率，直至那失落的结构在我们的集体意志中再度清晰。当最后的基因密钥被激活，圣歌将再度于塔顶回响，宣告一个不屈文明的归来。"
 situation_libra_rebuilding_babel_tooltip: "可以修建 £building£ §Y$building_libra_babel_tower$§!"
 situation_libra_rebuilding_babel_approach: "筹备"
 libra_fairy.11010.name: "天梯再临"
 libra_fairy.11010.desc: "经过无数个周期的遗传演化与物质重构，那通往星海的螺旋天梯终于从蓝图化为现实。巴别塔的基座深深扎根于我们种族最纯净的遗传密码之中，塔身刻录的信息则由无数个体生命的能形态编织而成。它的存在，不仅是一座建筑，更是我们文明迈向终极形态的宣言。"
 libra_fairy.11010.r.desc: "从废墟中，从记忆里，巴别塔再度拔地而起。曾经的伤痕被新的基因序列覆盖，断裂的共振重新连接。这座重生的天梯比以往更加坚固，因为它承载着一个文明不屈的意志和对生命本源的忠诚。"
 libra_fairy.11010.a: "我们的血脉即是永恒。"
 building_libra_babel_tower: "巴别塔"
 building_libra_babel_tower_desc: "这座由纯净基因序列构筑的螺旋天梯，以我们种族的完美遗传密码为基，将整个文明的生物共振汇聚成通向星海的乐章。塔身的每一次生长都是向生命本源的回归，每一层新的高度都让我们更接近生命的终极形态。纵使塔身倾覆，深植于每个细胞中的生命蓝图终将让文明的圣歌再度响彻星河。"
 building_libra_babel_tower_2: "$building_libra_babel_tower$"
 building_libra_babel_tower_2_desc: "$building_libra_babel_tower_desc$"
 planet_libra_babel: "$building_libra_babel_tower$"
 building_libra_babel_tower_level: "巴别塔等级：§Y[Owner.libra_babel_level]§!/99\n\n"
 building_libra_babel_tower_effect: "帝国每有一座§Y$sm_libra_babel_tower$§!就增加§G+3%§!£mod_country_naval_cap_mult£ §Y$MOD_COUNTRY_NAVAL_CAP_MULT$§!，最多§G+120%§!。\n帝国每有一处§Y$decision_libra_babel_modifier$§!就增加§G+4%§!£mod_country_all_tech_research_speed£§Y$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$§!，最多§G+120%§!。"
 requires_libra_rebuilding_babel_sit: "$TRIGGER_FAIL$需要完成§Y$situation_libra_rebuilding_babel$§!局势"
 decision_libra_ode_to_babel: "赞颂巴别"
 decision_libra_ode_to_babel_desc: "让纯净的基因序列在文明的赞歌中完成最终共鸣，将我们的生命形态凝固成通向星海的永恒坐标。"
 decision_libra_babel_modifier: "无瑕之碑"
 decision_libra_babel_modifier_desc: "巴别塔标示着我们物种绝对的纯净性，这座纪念碑驱使着人们在自豪中不断向前。"
 sm_libra_babel_tower: "至纯天塔"
 sm_libra_babel_tower_desc: "这座设施令太空环境变成生物体的乐园，高度的基因技术使我们在无重力环境下也能如履平地。\n"
 libra_fairy.11023.name: "基石永固"
 libra_fairy.11023.desc: "当巴别塔的第三十三层结构在基因回旋中稳固下来，一道温和而坚韧的能量场以塔为中心缓缓展开，如同为整个帝国披上了一层无形的生命织锦。自此，我们的文明根基已与这座基因丰碑紧密相连，任何动荡都难以动摇我们存在的基石。"
 libra_fairy.11023.a: "我们的根基坚不可摧。"
 libra_fairy.11026.name: "星语共鸣"
 libra_fairy.11026.desc: "巴别塔突破第六十六层，其顶端的生物水晶与群星之间建立起了一种玄妙的共振。此刻，它不仅是一座建筑，更是一个巨大的生命感官，将星海的低语转化为我们能够理解的启示。帝国的每一个个体，都能隐约感受到一种来自宇宙深处的指引与祝福。"
 libra_fairy.11026.a: "聆听星海的启示"
 libra_fairy.11029.name: "巨塔所在，帝国屹立不倒"
 libra_fairy.11029.desc: "当最后一段基因序列在塔尖完美嵌合，巴别塔迎来了它的终极形态。它不再仅仅是一座塔，而是我们这个纯净种族在物质宇宙的永恒投影。塔身流淌的不再是光芒，而是凝如实质的生命法则；其存在本身，已构成一个独立的现实基准。\n\n自此，帝国的命运已与巴别塔彻底融为一体。塔在，则文明存续；塔立，则基因不朽。纵使星河倒转，维度崩摧，只要这座巨塔仍有一砖一瓦存在于任何时空，我们的文明就永远保有重生与归来的权利。"
 libra_fairy.11029.a: "我们在永恒之中讴歌纯净。"

#

 ap_libra_ei_dorado: "黄金国"
 ap_libra_ei_dorado_desc: "云端之上，星河之外，构筑唯一且永恒的乐土。\n$libraf_aa_banner_20$\n"
 ap_libra_ei_dorado_tooltip: ""


