# ####################
# Virtuality
# ####################

 tech_libra_reality_deconstruction: "现实解构"
 tech_libra_reality_deconstruction_desc: "通过将物质世界解构为可被计算与编辑的信息流，我们得以消除现实与虚拟的边界，使数字领域中的帝国获得对现实领域的绝对控制权。\n$libraf_te_banner_7$"

 tech_libra_augmented_reality: "增强实境"
 tech_libra_augmented_reality_desc: "增强实境在如今并不是一项多么新颖的技术，但若将其同虚拟技术结合，就能在极大程度上减少虚拟化带来的不变，显著减少操作失误或网络延迟。\n$libraf_te_banner_7$"
 building_libra_AR_server: "增强现实服务器"
 building_libra_AR_server_desc: "这些服务器在物理世界之上覆盖了一层实时的、可交互的数据图层，极大提升了从决策到执行的效率。"
 building_libra_AR_server_effect: "$EMPIRE_EFFECTS_W_ICON$随§Y$policy_virtuality_focus$§!改变。"
 edict_libra_virtuality_1: "虚拟关系网"
 edict_libra_virtuality_1_desc: "利用虚拟空间构建一个高效的协作网络，卓越的个体意识可以在此突破物理距离的限制下达指令，极大地扩展了我们的管理能力。"
 edict_libra_virtuality_2: "模拟现实训练"
 edict_libra_virtuality_2_desc: "所有领袖都在高度逼真的虚拟环境中经历了数千年的模拟治理与危机处理。这段浓缩的经验被直接灌入他们的核心储存，使其能力得到前所未有的锤炼与升华。"

 tech_libra_virtuality_overclocking: "服务器过载"
 tech_libra_virtuality_overclocking_desc: "我们掌握了在安全阈值内，暂时性地突破处理器与能源系统设计极限的技术。这种受控的过载能带来爆发式的性能提升，但需要对随之而来的巨大压力与损耗进行精密管理。\n$libraf_te_banner_7$"
 building_libra_overclocking_matrix: "超频矩阵"
 building_libra_overclocking_matrix_desc: "这座设施完全释放了本地处理器与能源网络的限制，将计算力与生产力推向理论极限。在矩阵范围内，所有单位都以超越设计规格的状态运行，带来惊人的效率提升，但这也导致了能源的飞速消耗与组件磨损的急剧加速。"
 edict_libra_virtuality_3: "计划性超频"
 edict_libra_virtuality_3_desc: "为了应对紧迫的生产需求，许可对核心服务器进行周期性的超频运行。产出将大幅提升，但能源网络和系统维护也将承受巨大的压力。"
 edict_libra_virtuality_4: "计划性检修"
 edict_libra_virtuality_4_desc: "一套严格的预防性维护计划，定期对关键系统进行降频保养与组件更换。这虽然牺牲了部分峰值性能，但确保了系统的长期稳定并显著降低了运维成本。"

 tech_libra_virtuality_topology: "拓扑重构学"
 tech_libra_virtuality_topology_desc: "这项技术使我们能够像优化数据存储结构一样，重新规划行星的物理空间与资源分布。通过对星球拓扑结构的碎片整理与重新索引，我们能够释放出其隐藏的承载潜力。\n$libraf_te_banner_7$"
 building_libra_topology_planning: "拓扑规划核心"
 building_libra_topology_planning_desc: "该核心是一个强大的现实模拟器，它能在虚拟空间中预先完成整个行星的区划拓扑与建设规划。通过将最优解直接编译为现实，它从根本上重新定义了星球的承载潜力，并让建设工程如同数据写入一般精准而迅速。"
 building_libra_topology_planning_effect_desc: "每有一级§Y$planetary_ascension$§!就增加§G+1§!£mod_planet_max_districts_add£ §Y$MOD_PLANET_MAX_DISTRICTS_ADD$§!。"
 edict_libra_virtuality_5: "拓展演算逻辑"
 edict_libra_virtuality_5_desc: "将绝大部分的虚拟算力导向科学研究。模拟实验以前所未有的速度进行迭代，新的科学发现如同潮水般从虚拟实验室涌向现实。"
 edict_libra_virtuality_6: "补给导向罗盘"
 edict_libra_virtuality_6_desc: "算力被重新分配，专注于优化舰队后勤、模拟战术推演以及虚拟船坞的运作。这极大地提升了我们舰队的动员效率与规模上限。"

 tech_libra_virtuality_synchronous: "全局同步协议"
 tech_libra_virtuality_synchronous_desc: "开发一套覆盖整个帝国的终极协调协议，消除所有个体与系统之间的通信延迟与理解偏差。帝国从此能够像一个统一的机体般思考和行动。\n$libraf_te_banner_7$"
 building_libra_synchronous_coordinator: "同步协调器"
 building_libra_synchronous_coordinator_desc: "这座建筑旨在优化整个殖民地所有单位间的数据流与协作协议，消除任务分配中的任何延迟与冗余，确保每一个指令都能在最优的时刻、由最合适的单位执行。"
 edict_libra_virtuality_7: "指令平衡法"
 edict_libra_virtuality_7_desc: "通过同步协议，内阁成员的意识与决策过程被深度互联，形成了一个高效的集体心智。他们的专业领域知识相互补充，使得国家治理的每一项决策都近乎完美。"
 edict_libra_virtuality_8: "扩充链路节点"
 edict_libra_virtuality_8_desc: "这套高度去中心化的系统能够智能地分担行政负荷，使得帝国扩张所带来的管理阻力被降至最低。"

 tech_repeatable_libra_virtuality_a: "扩展分支网络"
 tech_repeatable_libra_virtuality_a_desc: "将部分事务委任给其他存在可以降低我们的处理压力，交接流程直接决定了我们能分配多少而不造成负担。\n$libraf_te_banner_7$"

 tech_repeatable_libra_virtuality_b: "建设模板升级"
 tech_repeatable_libra_virtuality_b_desc: "改进我们的建造模板，降低现实因素对虚拟世界扩张的制约。\n$libraf_te_banner_7$"

 tech_repeatable_libra_virtuality_c: "终端材料优化"
 tech_repeatable_libra_virtuality_c_desc: "要在现实世界中产生影响，可动的躯体必不可少，通过对执行终端的改进，我们会拥有更高的整体效率。\n$libraf_te_banner_7$"

