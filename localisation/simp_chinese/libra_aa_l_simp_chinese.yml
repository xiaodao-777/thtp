 trait_libra_atomic_heart_energy: "原子发电核心"
 trait_libra_atomic_heart_energy_desc: "在精心设计、仔细调整后终于得以问世的机械心脏，它在集成了任何必要的优点的同时回避了相关的缺陷，装配了这些科技结晶的机械体在各自的工作领域里总是出类拔萃。"
