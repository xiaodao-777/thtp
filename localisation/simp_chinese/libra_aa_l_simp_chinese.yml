 trait_libra_psychic_0: "精武为一"
 trait_libra_psychic_0_desc: "灵能给这个物种带来的最大力量在于精神而非躯壳，他们的战术能力非同一般。"
 trait_libra_psychic_0_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£society_research£ §Y$society_research$§!"
 trait_libra_psychic_1: "不破金钟"
 trait_libra_psychic_1_desc: "想要击破这个物种构筑的防线？那几乎是不可能的事情——对于装配在地面部队的中小型武器来说，打破灵能护盾过于困难了。"
 trait_libra_psychic_1_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£physics_research£ §G2§!£engineering_research£ §Y研究点数§!"
 trait_libra_psychic_2: "无形幻影"
 trait_libra_psychic_2_desc: "在这里、不在这里，灵能赋予这个物种不可言说的面纱。"
 trait_libra_psychic_2_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.5§!£physics_research£ §Y$physics_research$§!和§G0.5§!£unity£ §Y$unity$§!"
 trait_libra_psychic_3: "久战金甲"
 trait_libra_psychic_3_desc: "闪闪发光的是这个物种由灵能构成的实体甲壳，这种超维多面体的奥秘深不可测。"
 trait_libra_psychic_3_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£engineering_research£ §Y$engineering_research$§!"
 trait_libra_psychic_4: "福音之翼"
 trait_libra_psychic_4_desc: "祝福的羽翼庇护着这个物种畅游虚空，殖民船抵达的地方，就是灵能绽放的地方。"
 trait_libra_psychic_4_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.5§!£engineering_research£ §Y$engineering_research$§!和§G1§!£trade£ §Y$trade$§!\n$t$—新殖民完成时：\n$tt$—$d_libra_feature_6$: §G+1§!"
 trait_libra_psychic_5: "螭祝铁腕"
 trait_libra_psychic_5_desc: "在某些情况下，灵能甲壳比单纯的护盾或装甲更加难以应付。"
 trait_libra_psychic_5_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£physics_research£ §G2§!£society_research£ §Y研究点数§!"
 trait_libra_psychic_6: "卫法业障"
 trait_libra_psychic_6_desc: "有多少人可以经受住金钱的诱惑呢？也许这些灵能生物做不到最好，但他们把货币的价值利用到了极致。"
 trait_libra_psychic_6_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£trade£ §Y$trade$§!"
 trait_libra_psychic_7: "天佑神盾"
 trait_libra_psychic_7_desc: "这个物种无惧于恶劣生产环境对一般生物的伤害，因为灵能庇护着他们。"
 trait_libra_psychic_7_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1§!£physics_research£ §Y$physics_research$§!"
 trait_libra_psychic_8: "双钺锐芒"
 trait_libra_psychic_8_desc: "强健的肢体、天赋的力量，这个灵能能够以虚境的利刃破开夜幕。"
 trait_libra_psychic_8_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.15§!£astral_threads£ §Y$astral_threads$§!"
 trait_libra_psychic_9: "符文重剑"
 trait_libra_psychic_9_desc: "这个灵能物种吸纳了虚境中沉重而坚实的力量。"
 trait_libra_psychic_9_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.15§!£minor_artifacts£ §Y$minor_artifacts$§!"
 trait_libra_psychic_10: "百面聚合"
 trait_libra_psychic_10_desc: "无数个时代的职业，跨越时间集中于这个物种的心灵，他们即是生活本身。"
 trait_libra_psychic_10_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£engineering_research£ §Y$engineering_research$§!"
 trait_libra_psychic_11: "蓬下诡影"
 trait_libra_psychic_11_desc: "舞蓬下潜藏的是什么？在揭幕之前，谁也不知道。"
 trait_libra_psychic_11_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1.5§!£physics_research£ §Y$physics_research$§!和§G0.04§!£sr_dark_matter£ §Y$sr_dark_matter$§!"
 trait_libra_psychic_12: "袍中术师"
 trait_libra_psychic_12_desc: "尊贵的技力是少数物种可以从虚境获得的赠礼，而这个物种就是其中之一。"
 trait_libra_psychic_12_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.75§!£trade£ §Y$trade$§!"
 trait_libra_psychic_13: "天南先知"
 trait_libra_psychic_13_desc: "一些难以描述的默契流转于这个物种之间，但任谁都不会猜到那是何种智慧。"
 trait_libra_psychic_13_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.5§!£energy£ §Y$energy$§!和§G0.5§!£trade£ §Y$trade$§!"
 trait_libra_psychic_14: "界西行者"
 trait_libra_psychic_14_desc: "终结更能使人意识到生命的可贵，虚境中迷离的虚像坚定了这个物种求生的意志。"
 trait_libra_psychic_14_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.5§!£society_research£ §Y$society_research$§!和§G0.5§!£unity£ §Y$unity$§!"
 trait_libra_psychic_15: "幕间贵胄"
 trait_libra_psychic_15_desc: "只有昂贵且奢华的制品才能展现这一物种从虚境获得的无上启迪。"
 trait_libra_psychic_15_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.5§!£physics_research£ §G1.5§!£society_research£ §G0.5§!£engineering_research£ §Y研究点数§!"
 trait_libra_psychic_16: "比邻异人"
 trait_libra_psychic_16_desc: "很快，他们来了，带着力量与冲击。"
 trait_libra_psychic_16_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1.5§!£society_research£ §Y$society_research$§!"
 trait_libra_psychic_17: "骑上雄兵"
 trait_libra_psychic_17_desc: "真正的勇士从不畏惧于敌人的威势，前进即胜利。"
 trait_libra_psychic_17_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G1§!£unity£ §Y$unity$§!"
 trait_libra_psychic_18: "檐侧来客"
 trait_libra_psychic_18_desc: "在意想不到的地方，这个灵能物种收集着一切他们可以回收的存在。也许有一天，这些东西会作为有形或无形的锋刃射向敌人。"
 trait_libra_psychic_18_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.25§!£alloys£ §Y$alloys$§!"
 trait_libra_psychic_19: "盾后武士"
 trait_libra_psychic_19_desc: "这个灵能物种对故土有说不清的情怀，他们誓死守卫家园。"
 trait_libra_psychic_19_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.05§!£sr_zro£ §Y$sr_zro$§!"
 trait_libra_psychic_20: "集念归一"
 trait_libra_psychic_20_desc: "无数个世界的知识，跨越虚境集中于这个物种的脑海，他们即是智慧本身。"
 trait_libra_psychic_20_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£physics_research£ §Y$physics_research$§!"
 trait_libra_psychic_21: "异空之眼"
 trait_libra_psychic_21_desc: "在交错不清的视界间，这些灵能者一眼就能识别出事实的事实，真理的真理。"
