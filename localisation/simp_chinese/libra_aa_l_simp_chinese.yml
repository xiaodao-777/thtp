 libra_synthetic_tech_auth_tt: "§Y这一科技的效果随高级政体改变。§!\n\n"

 tech_libra_synthetic_commands: "高级指令表"
 tech_libra_synthetic_commands_desc: "我们解锁了意识底层架构的访问权限，允许为个体处理核心上传经过优化的决策算法包，从而在特定领域展现出超凡的专精能力。\n$libraf_te_banner_4$"
