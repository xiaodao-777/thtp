 libra_fairy.13023.name: "完全改造"
 libra_fairy.13023.desc: "意识迁移项目的志愿者正准备接受最终阶段的手术——将大脑以外的所有有机组织替换为机械。这将是告别血肉之躯的最终一步。支持者视其为进化的巅峰，而批评者则哀叹，这将创造出一个困在颅骨中的幽灵，一个永远与生物体验割裂的存在。"
 libra_fairy.13023.a: "拥抱机械。"
 libra_fairy.13023.b: "我们不能忘记来时的路。"
 libra_fairy.13023.c: "背弃血肉等同于背叛蜂巢。"
 libra_transcendental_cybernetic_mod_13_1: "机械之躯"
 libra_fairy.13024.name: "幕后巨头"
 libra_fairy.13024.desc: "数家巨型义体制造商通过专利和数据垄断，已悄然构建起一个足以影响帝国经济命脉的隐形帝国。他们通过游说和定制服务，使政策向自身倾斜。帝国的真正权力，似乎正从议会大厅，流向这些鲜为人知的董事会会议室。"
 libra_fairy.13024.g.desc: "在帝国庞大的处理网络中，数个负责协调义体生产与分配的自理节点展现出异常的发展。通过自我优化和资源调用，它们已积累了远超其设计权限的处理能力与物质资源，形成了一个个高效的、近乎独立的子网络。这些节点正以其卓越的效率证明其价值，但它们日益复杂的内部逻辑与决策也开始偏离整体的最优解，倾向于其自身子网络的维持与扩张，悄然扭曲着帝国资源的流动方向。"
 libra_fairy.13024.a: "利用他们的效率。"
 libra_fairy.13024.b: "将其国有化。"
 libra_fairy.13024.c: "堂下何人状告本官？"
 libra_transcendental_cybernetic_mod_14_1: "垄断效率"
 libra_transcendental_cybernetic_mod_14_2: "国家垄断"
 libra_fairy.13025.name: "理想化改造"
 libra_fairy.13025.desc: "生物研究单元提出了一项理想主义改造计划，旨在通过微调神经中枢，潜移默化地减少个体的攻击性、偏见与懒惰，从而在根源上构建一个更加和谐、高效的社会。这听起来像是乌托邦的蓝图，但其优化人性的本质，也引起了关于自由意志的深深恐惧。"
 libra_fairy.13025.a: "为了更美好的社会。"
 libra_fairy.13025.b: "我们不能扮演上帝。"
 libra_fairy.13025.c: "区区自由意志，有什么可担心的。"
 libra_transcendental_cybernetic_mod_15_1: "理想主义强化体"
 libra_transcendental_cybernetic_mod_15_2: "尊重自我"
 libra_transcendental_cybernetic_mod_15_3: "唯一意志"
 libra_fairy.13026.name: "情感抑制模块"
 libra_fairy.13026.desc: "一种可自主启用的情感抑制插件在高压职业群体中流行开来。它能有效屏蔽焦虑、恐惧和悲伤，让使用者在极端环境下保持绝对理性。然而，报告显示，长期使用者的共情能力显著下降，个体关系变得如同齿轮般刻板，也许有一天，这会使我们的社会失去活力。"
 libra_fairy.13026.a: "理性的代价是值得的。"
 libra_fairy.13026.b: "情感使我们完整。"
 libra_fairy.13026.c: "一二三，木头人！"
 libra_transcendental_cybernetic_mod_16_1: "绝对理性"
 libra_transcendental_cybernetic_mod_16_2: "情感学习程序"
 libra_transcendental_cybernetic_mod_16_3: "木头人"
 building_libra_cybernetics_factory: "神经机械工厂"
 building_libra_cybernetics_factory_desc: "在这座工厂里，老练的义体技师协调着大量自动化机械，源源不断地生产高水准的植入体。得益于他们的不懈努力，高端植入体的受众显著增加，工作人口的数量也显著提升。"
 building_libra_cybernetics_factory_hive_desc: "集体意识需要强大的义体化子个体，而这个繁育枢纽可以进一步提升结合水准，有效地减少植入体造成的子个体排异反应及过敏性功能失调。"
 building_libra_cybernetics_factory_assimilator_desc: "排除纠纷的必要手段之一是对所有个体一视同仁的泛用型强化，而先进的神经机械学成果可以最大幅度地加速同化过程，避免多余的冲突。"
 concept_libra_transcendental_cybernetic_policy: "改良义体政策"
 concept_libra_transcendental_cybernetic_policy_desc: "$t$§Y$policy_libra_transcendental_cybernetics_1$§!，需要 £engineering£ ['technology:tech_libra_cybernetic_growth_1']，取代['edict:libra_cybernetic_growth_1',$edict_libra_cybernetic_growth_1$]法令，增加§Y$pop_assembler_type_plural_with_icon$§!产出并降低相关 £mod_upkeep_mult£ §Y$mod_planet_jobs_upkeep_mult$§!。\n$t$§Y$policy_libra_transcendental_cybernetics_2$§!，需要 £society£ ['technology:tech_libra_cybernetic_growth_2']，取代§Y$policy_libra_cybernetic_growth_2$§!政策，为 £building£ §Y$building_libra_augment_site_1$§!附加 £mod_produces_mult£ §Y$mod_planet_jobs_produces_mult$§!加成。\n$t$§Y$policy_libra_transcendental_cybernetics_3$§!，需要 £physics£ ['technology:tech_libra_cybernetic_growth_3']，取代['edict:libra_cybernetic_growth_3',$edict_libra_cybernetic_growth_3$]法令，提供帝国性军事加成。\n$t$§Y$policy_libra_transcendental_cybernetics_4$§!，需要 £society£ ['technology:tech_libra_cybernetic_growth_4']，取代§Y$policy_libra_cybernetic_growth_4$§!政策，使 £building£ §Y$building_libra_cybernetics_factory$§!提供 £pop£ §Y$POP$§!相关加成。"
