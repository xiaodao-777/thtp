 tech_repeatable_libra_cybernetic_labor: "劳力统括"
 tech_repeatable_libra_cybernetic_labor_desc: "提前部署的机械化劳动力能够在很大程度上方便我们的活动，当然，这需要我们的义体接口为此进行专门的适配。\n$libraf_te_banner_3$"

 tech_repeatable_libra_cybernetic_experience_sharing: "经验共享"
 tech_repeatable_libra_cybernetic_experience_sharing_desc: "植入体网络使我们的个体可以随时随地的共享自己的情况，从他处获得参考，也为别人增加阅历。\n$libraf_te_banner_3$"

 tech_repeatable_libra_cybernetic_growth: "增长优化"
 tech_repeatable_libra_cybernetic_growth_desc: "以更优成本、产线和规划部署生物相容性材料、脑神经植入体、半自动控制终端等一系列核心组件的量产流程。\n$libraf_te_banner_3$"

#

 ap_libra_transcendental_cybernetics: "卓越控制论"
 ap_libra_transcendental_cybernetics_desc: "我们选择了血肉和机械的至高融合，但现实距理想依旧遥远。\n为了构筑完美且充满生机的义体世界，我们需要更多的义体接纳者和更容易维护的优秀植入体。\n$libraf_aa_banner_40$\n"
 ap_libra_transcendental_cybernetics_tooltip: "为§Y集成义体领袖特质§!添加额外$EFFECTS_TXT$\n每$pop_group_unit$§Y$libra_cybernetics_worker_type_plural_with_icon$§!提供§G+0.5§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!\n$libra_unlock_features$控制论洞见\n$t$每§Y3~5§!年触发义体社会事件，可选择并获得获得时效性加成。\n$libra_unlock_planet_buildings$['building:building_libra_cybernetics_factory']\n$t$§Y$building_libra_cybernetics_factory$§! 将 £alloys£ §Y$alloys$§!转化为 £mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!。\n$libra_unlock_policies$['concept_libra_transcendental_cybernetic_policy']\n$t$§Y$concept_libra_transcendental_cybernetic_policy$§! 将替换['concept_libra_expand_technology',义体拓展科技]的部分法令和政策，提供更自由和有力的$EMPIRE_EFFECTS_W_ICON$。"
 libra_fairy.13000.name: "血肉之心，钢铁之躯"
 libra_fairy.13000.desc: "血肉与机械的千年分野在此刻终结。帝国的进化之路跨越自然选择的漫长等待，步入自主设计的辉煌殿堂。自由意志的复杂火花与集体思维的统一脉动，在精密义体的承载下达成前所未有的和谐。\n\n这是一次彻底的升华。生物的适应性与机械的可靠性融为一体，成为同一枚勋章的光辉两面。神经接口中流淌着经过优化的思维本身；合金骨骼支撑起经久不衰的生命形式。\n\n个体因强化获得新生，集体因互联抵达圆满。帝国中的每个存在都成为更伟大整体的高度自治节点。我们在保留着原本的自我的同时，成为了更高效、更坚韧、更智慧的存在形态。"
 libra_fairy.13000.a: "提升，永无止境。"
 libra_transcendental_cybernetics_chain_title: "$ap_libra_transcendental_cybernetics$"
 libra_transcendental_cybernetics_chain_desc: "当第一例神经接口成功植入，变革的种子便已埋下。它最初只是修复残障的工具，而后成为追求卓越的阶梯，最终，演变为一场席卷整个社会结构的滔天巨浪。\n\n这不再是单纯的个体增强，而是一场文明的全面迭代。旧有的社会分工在高效义体面前被重新洗牌，体力与智力的界限因机械增强而模糊，寿命的延长彻底改变了职业与人生的定义。一个全新的、基于增强程度与适配性的社会架构正在浮现，传统的组织结构受到了前所未有的冲击。\n\n我们目睹了文化的分裂与重生：拥抱改造者视其为进化的必然，保守者则坚守着纯粹的定义。但无论如何，共识正在达成——我们文明的未来，已与这条不断向上延伸的融合飞升之路紧密相连，不可分割。"
 libra_transcendental_cybernetics_insight: "控制论洞见"
 libra_fairy.13011.name: "高级改造"
 libra_fairy.13011.desc: "我们的科研团队在神经接口与高强度合金的融合技术上取得了关键突破。新一代的改造模板不仅显著提升了使用者的生理机能与信息处理速度，其与生物组织的兼容性也达到了前所未有的高度，几乎消除了排异反应的风险。一套更强大、更安全的增强方案正等待部署。"
 libra_fairy.13011.a: "应用升级。"
 libra_fairy.13012.name: "仿生自我"
 libra_fairy.13012.desc: "一种被称为“镜像投影”的社交辅助插件正在流行。它通过分析用户的生物信号与行为数据，能在社交场合中生成一个高度逼真、符合他人期望的最佳形象。使用者报告称其在公共关系中无往不利，但私下里，一些人开始担忧这层数字面具是否会逐渐模糊真实的自我。"
 libra_fairy.13012.a: "工具而已，无伤大雅。"
 libra_fairy.13012.b: "这会导致认知偏差。"
 libra_transcendental_cybernetic_mod_2_1: "社交优化面具"
 libra_transcendental_cybernetic_mod_2_2: "修正自我认知"
 libra_fairy.13013.name: "机械保镖"
 libra_fairy.13013.desc: "一种集成威胁评估与非致命压制功能的自律性保卫单元已开发完成。这些安静的守护者能无缝融入任何环境，在危机发生前瞬间做出反应。从重要人物的个人护卫到关键基础设施的安保，它们提供了绝对可靠的保护，尽管其过于高效的清除程序有时会引发规则上的争议。"
 libra_fairy.13013.a: "安全是第一要务。"
 libra_fairy.13013.b: "着力保护重要个体。"
 libra_transcendental_cybernetic_mod_3_1: "绝对防御协议"
 libra_transcendental_cybernetic_mod_3_2: "资产守护者"
 libra_fairy.13014.name: "卓越指导者"
 libra_fairy.13014.desc: "一个专为知识传递设计的交互式指导系统已上线。它能够根据学习者的认知水平实时调整教学策略，并将复杂技能以神经信号的形式进行灌输。其培养出的专家在各自领域表现出色，但也有人质疑，这种缺乏失败与摸索的过程，是否会扼杀真正的创造力。"
 libra_fairy.13014.a: "效率至上。"
 libra_fairy.13014.b: "保留试错的空间。"
 libra_transcendental_cybernetic_mod_4_1: "知识传输"
 libra_transcendental_cybernetic_mod_4_2: "引导式学习"
 libra_fairy.13015.name: "智能体助理"
 libra_fairy.13015.desc: "基于先进算法的人格化AI助理现已普及。它们不仅能高效处理行政事务、管理日程，还能通过分析用户偏好来提供情感支持与决策建议。许多使用者已将其视为不可或缺的伙伴，这引发了关于数据隐私与情感依赖的广泛讨论。"
 libra_fairy.13015.a: "贴心数字助理。"
 libra_fairy.13015.b: "保持距离，仅限公务。"
 libra_fairy.13015.c: "把它投入研究作业。"
 libra_transcendental_cybernetic_mod_5_1: "数字助理"
 libra_transcendental_cybernetic_mod_5_2: "高效公务AI"
 libra_fairy.13016.name: "拓展功能"
 libra_fairy.13016.desc: "一个开放的义体功能扩展平台受到了工程师和爱好者的欢迎。用户可以根据自身需求，从官方或第三方下载并安装各种功能模组，从感官增强到专业工具植入。这极大地激发了个性化改造的浪潮，但平台的安全性审核也承受着巨大压力。"
 libra_fairy.13016.a: "鼓励创新与定制。"
 libra_fairy.13016.b: "必须保证系统安全。"
 libra_fairy.13016.c: "动用国家力量主持开发。"
 libra_transcendental_cybernetic_mod_6_1: "开放扩展平台"
 libra_transcendental_cybernetic_mod_6_2: "受监管的扩展"
 libra_transcendental_cybernetic_mod_6_3: "官方拓展包"
 libra_fairy.13017.name: "隐秘插件"
 libra_fairy.13017.desc: "出于特殊需求，帝国中的一些个体开发了一种可以产生特定神经刺激的植入体，其使用者在相当多的领域取得了优异的成果，唯一可能的缺点则是较强的繁殖欲望。在一定时间的传播和自发改良后，这些组件表现出优异的性价比和稳定性，有越来越多的的生物个体乐于接受它的使用——毕竟，有百利而无一害的改造可不多见。"
 libra_fairy.13017.a: "有趣。"
 libra_fairy.13017.b: "好东西，加以推广。"
 libra_transcendental_cybernetic_mod_7_1: "私密插件"
 libra_transcendental_cybernetic_mod_7_2: "推广刺激性植入体"
 libra_fairy.13018.name: "脑过载组件"
 libra_fairy.13018.desc: "一项颇具争议的神经激励技术流入了社会。它能在短时间内大幅提升使用者的专注力与思维速度，带来前所未有的工作效率和创作灵感。然而，持续使用会导致精神疲惫、情绪不稳等副作用，并有极强的成瘾性。它在带来巨大收益的同时，也带来了巨大的风险。"
 libra_fairy.13018.a: "风险可控，收益巨大。"
 libra_fairy.13018.b: "立即禁止这种危险品。"
 libra_transcendental_cybernetic_mod_8_1: "最强大脑"
 libra_transcendental_cybernetic_mod_8_2: "清醒的头脑"
 libra_fairy.13019.name: "终极武力"
 libra_fairy.13019.desc: "军工部门完成了一份关于战略级单兵作战单元的蓝图。这已远超单兵装备的范畴，而是一个高度集成、具备独立摧毁小型舰船能力的活体要塞。它代表着个体武力的极致，但也引发了一个严峻的问题：我们是否应该将如此可怕的毁灭性力量，交由一个可能存在情绪波动的个体来掌控？"
 libra_fairy.13019.a: "力量，需要被掌控。"
 libra_fairy.13019.b: "风险过高，予以封存。"
 libra_fairy.13019.c: "我们的士兵渴望鲜血。"
 libra_transcendental_cybernetic_mod_9_1: "强化义体士兵"
 libra_transcendental_cybernetic_mod_9_3: "嗜血协议"
 libra_fairy.13020.name: "仿生体傀儡"
 libra_fairy.13020.desc: "一种通过远程神经链接操控的仿生躯体已投入量产。它们能代替真人执行高危任务，从放射性环境作业到敌后渗透，理论上实现了零伤亡。但这些与使用者感官同步的空壳，也模糊了谋杀与执行的界限，并在社会层面引发了关于“不在场犯罪”的激烈辩论。"
 libra_fairy.13020.a: "只是工具而已。"
 libra_fairy.13020.b: "这违背了伦理。"
 libra_transcendental_cybernetic_mod_10_1: "遥控仿生人"
 libra_fairy.13021.name: "实用或美观"
 libra_fairy.13021.desc: "一次公开的义体设计展览引发了文化界的巨大分歧。一方主张义体应完全遵循功能主义，去除所有不必要的装饰；另一方则认为，符合美学标准的植入体更能被社会接纳，是“人性”的延伸。这场争论已从设计理念，上升至对文明价值观的探讨。"
 libra_fairy.13021.a: "形式追随功能。"
 libra_fairy.13021.b: "美感不可或缺。"
 libra_fairy.13021.c: "寻找平衡点。"
 libra_transcendental_cybernetic_mod_11_1: "功能优先"
 libra_transcendental_cybernetic_mod_11_2: "外观优先"
 libra_transcendental_cybernetic_mod_11_3: "保持平衡"
 libra_fairy.13022.name: "精简升级"
 libra_fairy.13022.desc: "面对早期植入体使用者，强化专家提出了简化升级的方案：强制移除旧型号，换装更高效、更廉价的新模块。此举虽能提升整体效率，却意味着对过往技术投入的否定，并使部分接受者感到背叛而不满。"
 libra_fairy.13022.a: "效率优先，推行升级。"
 libra_fairy.13022.b: "尊重先驱，维持兼容。"
 libra_fairy.13022.c: "帝国的意志是绝对的。"
 libra_transcendental_cybernetic_mod_12_1: "义体迭代"
 libra_transcendental_cybernetic_mod_12_2: "折中方案"
