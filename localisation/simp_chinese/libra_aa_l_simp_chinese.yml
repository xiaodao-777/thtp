 LIBRA_CUTE_MONITOR: "可爱监视器"
 LIBRA_CUTE_MONITOR_DESC: "这个组件可以通过生物传感信号发现不那么可爱的敌人的弱点，虽然这种高强度的检测是有害的。"
 LIBRACUTE: "萌化体"
 LIBRACUTE_DESC: "仅限于动漫的幻想走进了现实，变成了这个物种的样子。"
 trait_libra_cutefied: "萌化体"
 trait_libra_cutefied_desc: "这个物种代表着帝国基因技术的最高杰作，“可爱而强大”是对她们的最好形容。"
 trait_libra_cutefied_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R1§!£energy£ §Y$energy$§!和§R1§!£food£ §Y$food$§!\n$t$—§R无效化§!除['trait:trait_auto_hab_preference']之外的所有['concept_automodding_trait',$concept_automodding_traits$]"
 leader_trait_libra_cutefied: "萌化修饰"
 leader_trait_libra_cutefied_desc: "全面的改造使这位领袖至臻可爱。"
