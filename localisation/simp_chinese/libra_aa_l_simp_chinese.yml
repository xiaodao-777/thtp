 mod_job_libra_cybernetics_worker_max_workforce_mult: "[libra_cybernetics_worker.GetName]的最大劳动力"
 job_libra_cybernetics_worker_swap_plural_with_icon: "[libra_cybernetics_worker.GetIcon][libra_cybernetics_worker.GetName]"
 job_libra_cybernetics_drone: "控制论子个体"
 job_libra_cybernetics_drone_plural: "控制论子个体"
 job_libra_cybernetics_drone_with_icon: "£job_libra_cybernetics_drone£$job_libra_cybernetics_drone_plural$"
 job_libra_cybernetics_drone_desc: "这些个体工作在义体化之外的一线，协助处理相关问题。\n§Y需要非义体或$trait_hive_mind$劳动力。§!"
 mod_job_libra_cybernetics_drone_add: "[libra_cybernetics_drone.GetName]岗位"
