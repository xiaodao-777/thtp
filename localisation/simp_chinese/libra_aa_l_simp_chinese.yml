 leader_trait_libra_atomic_heart_commander: "原子熔炉"
 leader_trait_libra_atomic_heart_commander_desc: "机械的模块化优势使这位领袖变得无所不能，只要定期维护配件，就可以稳定地集成难以想象的强大功能，这是普通合成人躯体所无法触及的终极熔炉。"
