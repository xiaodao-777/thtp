 tech_libra_modular_society: "模块化社会"
 tech_libra_modular_society_desc: "将社会像我们的机械躯体一样精细分工，从而提升整体效率。\n$libraf_te_banner_5$"
 edict_libra_modularity_campaign_1: "原子化社会指令"
 edict_libra_modularity_campaign_1_desc: "我们的帝国就像一个拼图，重点在于把拼片放到该有的地方去。"

 tech_libra_modular_living_metal_separation: "活体金属分离"
 tech_libra_modular_living_metal_separation_desc: "先进的提取技术允许我们在生产过程中提取更多液体金属。\n$libraf_te_banner_5$"
 edict_libra_modularity_campaign_2: "择优选材"
 edict_libra_modularity_campaign_2_desc: "仔细挑选用于高端产业的原材料，节省开支也降低污染。"

 tech_libra_modular_trait_points_1: "工作流协议"
 tech_libra_modular_trait_points_1_desc: "额外的生产协议使得我们的每一个个体都可以成为独立的一座工厂。\n$libraf_te_banner_5$"
 TECH_UNLOCK_LIBRA_AMMT_TITLE: "$libra_unlock_traits$$concept_libra_modularity_traits$"
 TECH_UNLOCK_LIBRA_AMMT_DESC: "§H$concept_libra_modularity_traits$§!\n$concept_libra_modularity_traits_desc$"
 SPECIES_TRAIT_LIBRA_MODULARITY: "['concept_libra_modularity_traits']"
 concept_libra_modularity_traits: "复合机械协议特质"
 concept_libra_modularity_traits_desc: "高度特化的§Y$MACHINE$§!特质，以$pop_group_unit$£pop£ §Y$POP$§!为单位额外生产资源，包括：\n$t$—['trait:trait_libra_modularity_energy']\n$t$—['trait:trait_libra_modularity_minerals']\n$t$—['trait:trait_libra_modularity_food']\n$t$—['trait:trait_libra_modularity_trade']\n$t$—['trait:trait_libra_modularity_consumer_goods']\n$t$—['trait:trait_libra_modularity_alloys']\n$t$—['trait:trait_libra_modularity_unity']\n$t$—['trait:trait_libra_modularity_research']\n$t$—['trait:trait_libra_modularity_war']"
 trait_libra_modularity_energy: "复合能源协议"
 trait_libra_modularity_energy_desc: "独立配置的微型发电机组不仅能确保机械单位本身的能量来源，还可以用多余的能量供给周围的设备。"
 trait_libra_modularity_energy_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G3§!£energy£ §Y$energy$§!"
 trait_libra_modularity_minerals: "复合采掘协议"
 trait_libra_modularity_minerals_desc: "开采协议从环境中一切允许的地点收集资源碎屑，将它们整合处理为粗制矿物。"
 trait_libra_modularity_minerals_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£minerals£ §Y$minerals$§!"
 trait_libra_modularity_food: "复合农垦协议"
 trait_libra_modularity_food_desc: "除了用于作物培养的传统农具外，这些机械还有额外的水培营养槽和淀粉合成器，他们走到那里就生产到哪里。"
 trait_libra_modularity_food_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G2§!£food£ §Y$food$§!"
 trait_libra_modularity_trade: "复合商贸协议"
 trait_libra_modularity_trade_desc: "这些机械体装配有先进的动力组件，可以以单一个体运输大量物资，而代价仅是维护组建的少许能量。"
 trait_libra_modularity_trade_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R1§!£energy£ §Y$energy$§!生产§G2§!£trade£ §Y$trade$§!"
 trait_libra_modularity_consumer_goods: "复合工匠协议"
 trait_libra_modularity_consumer_goods_desc: "这些机械单位结合自带的工件和偶尔灵光乍现的程序火花，将常见的生物质加工为意想不到的工艺品。"
 trait_libra_modularity_consumer_goods_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£food£ §Y$food$§!生产§G2§!£consumer_goods£ §Y$consumer_goods$§!"
 trait_libra_modularity_alloys: "复合铸造协议"
 trait_libra_modularity_alloys_desc: "如果为每个机械单位都装配一台小型电弧熔炉并同原本的设计间保持协调，就会得到这个神奇的机械体——他们在丝毫不影响其他作业的同时，还能源源不断地产出小型合金锭。"
 trait_libra_modularity_alloys_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£minerals£ §Y$minerals$§!生产§G1§!£alloys£ §Y$alloys$§!"
 trait_libra_modularity_unity: "复合同步协议"
 trait_libra_modularity_unity_desc: "这些机械单位装载了模块化的行政任务单元，可以处理授权范围内的数据请求，也能充当链路中继节点发挥作用。"
 trait_libra_modularity_unity_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月消耗§R2§!£energy£ §Y$energy$§!生产§G2§!£unity£ §Y$unity$§!"
 trait_libra_modularity_research: "复合研究协议"
 trait_libra_modularity_research_desc: "此机械指令组从一切活动中收集数据，经过简单整体后上传至研究部门，为科技活动提供一手资料。"
