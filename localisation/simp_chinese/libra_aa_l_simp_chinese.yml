 policy_libra_transcendental_cybernetics_4_a: "自由增长倡议"
 policy_libra_transcendental_cybernetics_4_a_name: "$policy_libra_transcendental_cybernetics_4_a$"
 libra_transcendental_cybernetics_4_a_name: "$policy_libra_transcendental_cybernetics_4_a$"
 policy_libra_transcendental_cybernetics_4_a_desc: "我们的义体人口会获得更多鼓励，以期不受限制地增长。\n "
 policy_libra_transcendental_cybernetics_4_b: "劳力事务部"
 policy_libra_transcendental_cybernetics_4_b_name: "$policy_libra_transcendental_cybernetics_4_b$"
 libra_transcendental_cybernetics_4_b_name: "$policy_libra_transcendental_cybernetics_4_b$"
