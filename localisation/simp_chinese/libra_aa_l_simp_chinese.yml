 ap_libra_hurricane_eye: "飓风眼"
 ap_libra_hurricane_eye_desc: "须知，九层之塔起于垒土，千里之堤溃于蚁穴。\n纵使起于毫末，纳米虫群亦可淹没大千星海。\n$libraf_aa_banner_71$\n"
 ap_libra_hurricane_eye_tooltip: "$libra_unlock_edicts$['edict:libra_recycling_nanite_swarmer',$edict_libra_recycling_nanite_swarmer$]\n$t$§Y$edict_libra_recycling_nanite_swarmer$§! 将多余的§Y$nanite_swarmer$§!和§Y$nanite_interdictor$§!转换回 £nanites£ §Y$nanites$§!。\n$libra_start_situation$$situation_libra_hurricane_eye$\n$t$§Y$situation_libra_hurricane_eye$§! 将循环执行，完成时在指定位置释放指定类型的§Y纳米风暴§!，部分情况下需要消耗 £influence£ §Y$influence$§!并可能降低 £opinion£ §Y$OPINION$§!。\n$libra_start_situation$$situation_libra_hurricane_eye_2$\n$t$§Y$situation_libra_hurricane_eye_2$§! 将循环执行，基于每次启动时已使用的 £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!产出 £physics_research£ £society_research£ £engineering_research£ §Y研究点数§!，完成时生成§Y纳米舰队§!。\n$libra_unlock_policies$$policy_libra_hurricane_eye_1$$t$$policy_libra_hurricane_eye_2$\n$t$§Y$policy_libra_hurricane_eye_1$§! 控制§Y纳米风暴§!的生成模式。\n$t$§Y$policy_libra_hurricane_eye_2$§! 控制§Y纳米舰队§!的生成构成。\n$libra_unlock_decisions$$decision_libra_hurricane_eye$\n$t$§Y$decision_libra_hurricane_eye$§! 将指定的§Y$pc_nanotech$§!设定为§Y纳米舰队§!的生成位置，未指定时将在§Y首都§!生成§Y纳米舰队§!。"
 libra_fairy.16100.name: "暴风起源"
 libra_fairy.16100.desc: "在[Root.GetName]之前，纳米机械是工具，是武器，是洪流中的一滴水。但在他们手中，微小之物已不再是被动的存在，而是集体意志主动的延伸。他们参透了那个终极秘密：当每一个微观单元都承载着帝国的意志，所谓的“量变引起质变”便不再适用——因为从第一组纳米虫被赋予智能的那一刻起，质变就已经发生。\n\n如今，这个文明站在了风暴的中心。不是因为它驯服了风暴，而是因为它本身成为了风暴的源头。星海间的物质与能量，在纳米网络的编织下，开始回应帝国的呼唤。荒芜星球的地壳深处，重构的指令正在执行；敌舰的防护之外，崩解的脉冲已经就绪。\n\n这是一个转折点，宏观与微观的界限被抹消，毁灭与创造的藩篱被拆除。从这一刻起，他们不再是宇宙规律的遵循者，而是宇宙规律的编辑者。\n\n浩瀚星海见证了这一时刻：一个文明，以纳米为起点，以星海为终点，将“不可能”改写为“尚未完成”。"
 libra_fairy.16100.a: "风暴的中心，由我们定义。"
 libra_fairy.16100.tt: "在首都释放§Y$libra_hurricane_eye_storm_2$§!"
