 policy_libra_transcendental_cybernetics_3: "战争支援算法"
 policy_libra_transcendental_cybernetics_3_desc: "将义体科技应用于战场，演奏出血肉与金属的交响乐。\n "
 policy_libra_transcendental_cybernetics_3_a: "沙场索敌协议"
