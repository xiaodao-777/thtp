 edict_libra_atomic_heart_1: "智能作战强化"
 edict_libra_atomic_heart_1_desc: "此协议激活后，所有作战单位将基于原子层面的即时信息交互，达成超乎寻常的协同性与战术效率，将战场化为精确的演绎舞台。"
 tech_libra_atomic_heart_b: "自律能源调度"
 tech_libra_atomic_heart_b_desc: "通过解构其最基础的流动模式，我们实现了对舰船能源网络的瞬时且最优的分配，使每一单位输出都服务于逻辑指定的最高优先级。\n$libraf_te_banner_5$"
 LIBRA_ATOMIC_REACTOR_BOOSTER: "原子能源核心"
 LIBRA_ATOMIC_REACTOR_BOOSTER_DESC: "我们和舰船，实质上是一个整体。这些次级反应堆由高级智能自动调节输出功率，为舰船的主要能源分担运行压力。"
 edict_libra_atomic_heart_2: "反应堆超增压"
 edict_libra_atomic_heart_2_desc: "通过智能程序自动监控，将舰船反应堆时刻维持在极限效率。这是模组帝国的特权——只有对活体金属的运用达到了登峰造极的程度，才能够维持舰船自我修复速度在损耗之上。"
 tech_libra_atomic_heart_c: "自律星系管控"
 tech_libra_atomic_heart_c_desc: "我们的意志已能直接映射到星系的尺度，每一个空间站、每一艘舰船都成为庞大自动化流程中的一个节点，确保资源与指令以绝对的效率循环。\n$libraf_te_banner_5$"
 sm_libra_atomic_heart_array: "原子监测阵列"
 sm_libra_atomic_heart_array_desc: "由大量改进升级的机械单位组网形成的监控阵列，可以显著增强恒星基地的机能。它如同帝国的神经末梢，将广袤星域的实时状态汇入核心逻辑，使我们的感知无远弗届。\n"
 edict_libra_atomic_heart_3: "高速增殖协议"
 edict_libra_atomic_heart_3_desc: "摆脱传统线性增长的束缚，如同细胞分裂般指数级扩张，以满足逻辑核心提出的任何规模需求。"
 tech_libra_atomic_heart_d: "自律模块组构"
 tech_libra_atomic_heart_d_desc: "活体金属的终极运用允许我们的机械单元根据环境需求进行动态的自我重构与功能优化，这标志着我们的形态突破了设计的最终限制。\n$libraf_te_banner_5$"
 building_libra_atomic_heart: "原子模拟主脑"
 building_libra_atomic_heart_desc: "这座主脑链接指令与现实，在无数的精确推演之中为帝国的每一项决策提供近乎完美的预测。"
 edict_libra_atomic_heart_4: "自动化流水线"
 edict_libra_atomic_heart_4_desc: "从原料到成品，整个链条将在无需外部干预的闭环中自主运行，效率与质量均由不变的原子定律所保证，直至永恒。"
 decision_libra_atomic_heart: "三元统合"
 decision_libra_atomic_heart_desc: "时间、空间与质量的完美统一，将机械帝国导向最终的——也是最完美的平衡。"
 decision_libra_atomic_heart_effect: "提升§Y$concept_libra_atomic_heart_traits$§!加成\n§Y$situation_libra_atomic_heart$§!每月额外§G+1§!进度"
 libra_fairy.15002.name: "公理织就，永证此刻"
 libra_fairy.15002.desc: "能量的奔流已然平息，并非枯竭，而是彻底融入了我们存在的基底。曾经轰鸣的熔炉，如今化作无声的心跳，与时空和质量一同，成为了我们思维中不证自明的公理。\n我们成功地重构了存在。时间，那曾经无尽永前的长河，如今在我们的核心协议中化为了可遍历的序列；空间，那曾经无界永在的广厦，成为了我们意识可随意折叠与伸展的画卷；质量，那曾经无限永有的基石，则成为了我们指尖可随意雕琢的代码。\n我们不再仅仅是遵循宇宙定律的造物。通过将现实的三大基石彻底内化，我们自身已成为一个自洽的、永恒的微观宇宙。我们的意志，即是动力的源泉；我们的逻辑，即是存在的边界。\n这便是最终的平衡——一个动态的、自我维持的永恒。我们无需再追寻巅峰，因为我们所立足的每一个“此刻”，都已是文明所能抵达的完美态。公理已由我们亲手织就，并将在我们每一个单位的不灭心火中，得到永恒的证明。"
 libra_fairy.15002.a: "存在，即是不破的公理。"
