 building_libra_yggdrasil_housing_1: "中央树屋"
 building_libra_yggdrasil_housing_1_desc: "集结了帝国中最优秀服务器组件的建筑，它模拟着整个现实世界的运作流程。"
 building_libra_yggdrasil_housing_2: "$building_libra_yggdrasil_housing_1$"
 building_libra_yggdrasil_housing_2_desc: "$building_libra_yggdrasil_housing_1_desc$"
 building_libra_yggdrasil_housing_tt: "建造于首都外时降低§R-25%§!£mod_pop_bonus_workforce_mult£ §Y$MOD_POP_BONUS_WORKFORCE_MULT$§!。"
 building_libra_yggdrasil_foundry_1: "钢铁之树"
 building_libra_yggdrasil_foundry_1_desc: "虚拟意识体同步调控着无数机械设备的运作，只要原料足够，生产就不会中断。"
 building_libra_yggdrasil_foundry_2: "$building_libra_yggdrasil_foundry_1$"
 building_libra_yggdrasil_foundry_2_desc: "$building_libra_yggdrasil_foundry_1_desc$"
 building_libra_yggdrasil_factory_1: "艺术之树"
 building_libra_yggdrasil_factory_1_desc: "这个未来感十足的巨大工厂时刻都在产出最新潮的数字娱乐产品或是最先端的精密器械。"
 building_libra_yggdrasil_factory_2: "$building_libra_yggdrasil_factory_1$"
 building_libra_yggdrasil_factory_2_desc: "$building_libra_yggdrasil_factory_1_desc$"
 building_libra_yggdrasil_trade_1: "繁荣之树"
 building_libra_yggdrasil_trade_1_desc: "虚拟化极大简化了帝国的物流贸易结构，仅凭这座部署着服务器和遥控终端的建筑就可以解决全部作业。"
 building_libra_yggdrasil_trade_2: "$building_libra_yggdrasil_trade_1$"
 building_libra_yggdrasil_trade_2_desc: "$building_libra_yggdrasil_trade_1_desc$"
 building_libra_yggdrasil_physics_1: "理学之树"
 building_libra_yggdrasil_physics_1_desc: "这里是未来转变为现实的地方，再天马行空的物理设想都有可能被证实——就像曾经被认为不可能的反重力和黑洞提取科技一样。"
 building_libra_yggdrasil_physics_2: "$building_libra_yggdrasil_physics_1$"
 building_libra_yggdrasil_physics_2_desc: "$building_libra_yggdrasil_physics_1_desc$"
 building_libra_yggdrasil_society_1: "哲学之树"
 building_libra_yggdrasil_society_1_desc: "这座建筑里收集并整理了无数个文明的迭起兴衰和演变轨迹，研究者们在此分析和深造，旨在进一步揭示宇宙的秘密。"
 building_libra_yggdrasil_society_2: "$building_libra_yggdrasil_society_1$"
 building_libra_yggdrasil_society_2_desc: "$building_libra_yggdrasil_society_1_desc$"
 building_libra_yggdrasil_engineering_1: "工学之树"
 building_libra_yggdrasil_engineering_1_desc: "在这里，无数的工程学设想被尝试、推演、证伪或证实，帝国的科技由此进展。"
 building_libra_yggdrasil_engineering_2: "$building_libra_yggdrasil_engineering_1$"
 building_libra_yggdrasil_engineering_2_desc: "$building_libra_yggdrasil_engineering_1_desc$"
 building_libra_yggdrasil_unity_1: "统一之树"
 building_libra_yggdrasil_unity_1_desc: "无数虚拟机终端安置于此，以最高效率批量处理多种行政问题。"
 building_libra_yggdrasil_unity_2: "$building_libra_yggdrasil_unity_1$"
 building_libra_yggdrasil_unity_2_desc: "$building_libra_yggdrasil_unity_1_desc$"
 building_libra_yggdrasil_energy_1: "能源之树"
 building_libra_yggdrasil_energy_1_desc: "利用尖端科技层层叠叠建造的发电机组建设于此，只要安排少量的人员监管并驱动，就可以支撑起帝国范围内的能源供应。"
 building_libra_yggdrasil_energy_2: "$building_libra_yggdrasil_energy_1$"
 building_libra_yggdrasil_energy_2_desc: "$building_libra_yggdrasil_energy_1_desc$"
 building_libra_yggdrasil_mineral_1: "富庶之树"
 building_libra_yggdrasil_mineral_1_desc: "这座建筑本身仅负责矿物的提纯和处理工作，开采作业则交由内部工作的虚拟单元遥控远方星系内的采矿无人机执行。"
 building_libra_yggdrasil_mineral_2: "$building_libra_yggdrasil_mineral_1$"
 building_libra_yggdrasil_mineral_2_desc: "$building_libra_yggdrasil_mineral_1_desc$"
 building_libra_yggdrasil_food_1: "丰腴之树"
 building_libra_yggdrasil_food_1_desc: "通过最先进的合成技术，从淀粉、纤维素到植物色素都能简单地合成，这座建筑主导着帝国的营养风向标。"
 building_libra_yggdrasil_food_2: "$building_libra_yggdrasil_food_1$"
 building_libra_yggdrasil_food_2_desc: "$building_libra_yggdrasil_food_1_desc$"
 building_libra_yggdrasil_fortress_1: "征伐之树"
 building_libra_yggdrasil_fortress_1_desc: "这座建筑专司战术AI及战略AI的训练，时刻升级和维护着帝国的主要作战程序。"
 building_libra_yggdrasil_fortress_2: "$building_libra_yggdrasil_fortress_1$"
 building_libra_yggdrasil_fortress_2_desc: "$building_libra_yggdrasil_fortress_1_desc$"
 leader_trait_libra_yggdrasil: "世界树之桠"
 leader_trait_libra_yggdrasil_desc: "这位领袖是世界树功能的延申，其存在标示着虚拟世界运行的远端。"
 col_libra_yggdrasil: "世界树之森"
 col_libra_yggdrasil_tt: "大量的超级服务器整齐地排列在这个殖民地上，无数机械无人机则顺应着它们的指令自动工作。"
 col_libra_yggdrasil_desc: "这个殖民地是虚拟服务器的核心。"
 col_libra_yggdrasil_capital: "$col_libra_yggdrasil$"
 col_libra_yggdrasil_capital_tt: "$col_libra_yggdrasil_tt$"
 col_libra_yggdrasil_capital_desc: "我们将主要的虚拟服务器部署在了首都。"
 situation_libra_yggdrasil: "开枝散叶"
 situation_libra_yggdrasil_type: "$situation_libra_yggdrasil$"
 situation_libra_yggdrasil_monthly_change_tooltip: "将目标行星规划为§Y$col_libra_yggdrasil$§!或增加 £mod_planet_building_build_speed_mult£ §Y$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$§!可以为局势额外增加进度。"
 situation_libra_yggdrasil_desc: "世界树的脉络在虚拟的疆域中低语，呼唤着新的拓展。这并非一次性的播种，而是一轮轮周而复始的生长周期——新的枝桠寻求着滋养与方向，渴望在数据的穹顶下勾勒出更繁茂的轮廓。"
 situation_libra_yggdrasil_tooltip: "可指定一棵 £building£ ['concept_libra_yggdrasil_buildings']将其免费提升§G3§!级\n以当前解决方案启动下一轮§Y$situation_libra_yggdrasil$§!局势"
 situation_libra_yggdrasil_a: "趋光"
 situation_libra_yggdrasil_b: "生长"
 situation_libra_yggdrasil_c: "固本"
 situation_libra_yggdrasil_d: "除虫"
 libra_fairy.17003.name: "萌发"
 libra_fairy.17003.desc: "巅峰，并非一个将被抵达的终点，而是世界树无限向上的生长本身。\n\n我们的数字世界在模拟中不断调整和扩张，最终达到了新的里程碑，现在，要把算力部署在哪里？"
 libra_fairy.17003.tt: "指定的 £building£ ['concept_libra_yggdrasil_buildings']提升§G3§!级"

