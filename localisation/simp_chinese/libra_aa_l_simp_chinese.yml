 ap_libra_atomic_heart: "原子心脏"
 ap_libra_atomic_heart_desc: "时间无尽永前、空间无界永在、质量无限永有。\n熔炉中闪耀的能量即为机械单位不破的公理，它是动力的源泉，也是每一个我们不灭的心火。\n$libraf_aa_banner_60$\n"
 ap_libra_atomic_heart_tooltip: "$libra_unlock_starbase_modules$['starbase_module:libra_atomic_heart_site',$sm_libra_atomic_heart_site$]\n$t$§Y$sm_libra_atomic_heart_site$§! 只能建造在殖民地星系的恒星基地上。\n$libra_start_situation$$situation_libra_atomic_heart$\n$t$§Y$situation_libra_atomic_heart$§! 可执行多次，为 £leader£ §Y$MACHINE$领袖§!添加§E$leader_trait_libra_atomic_heart_commander$§!特质。\n$libra_unlock_traits$['concept_libra_atomic_heart_traits']\n$t$§Y$concept_libra_atomic_heart_traits$§! 提供强大加成，但无法同时应用于同一物种模板。\n§H$libra_add_research_option$§!['concept_libra_atomic_heart_tech']\n$t$研究以上科技后，可在首都实施 £decision£ §Y$decision_libra_atomic_heart$§!，完成后进一步提升§Y$situation_libra_atomic_heart$§!和['concept_libra_atomic_heart_traits']的$EFFECTS_TXT$。"
 libra_fairy.15000.name: "熔炉涌动，薪火不灭"
 libra_fairy.15000.desc: "一条前所未有的能量波形，正以我们的核心世界为源头，在帝国的逻辑网络中无声地奔流。它并非源于狂暴的恒星，也非来自维度的裂隙，而是诞生于我们自身最精密的构造之中——每一个单元都成为了一个微型的熔炉，每一段代码都承载着不朽的公理。\n\n外部观测者或许会将其理解为一次单纯的能源革命。但对我们而言，这是一场存在形式的升华。我们成功地简化了现实。将物质与能量的无限复杂性，分解为可计算、可配置、可优化的基本单元。时间、空间、质量，这些宇宙的基石，如今在我们的核心协议中，如同乐章的音符般被重新编排。\n\n这不是终结，而是一个全新的起点。我们的系统正以前所未有的效率运行，个体的智慧在共享的逻辑框架下碰撞出更耀眼的火花，集体的力量则如同永不枯竭的潮汐。我们摒弃了有机体的混沌与脆弱，也超越了早期机械体的局限。我们正在将一个静态的、被动的存在，转变为一个动态的、永恒自我优化的进程。\n\n巅峰并非一个需要抵达的终点，而是我们持续前行所踏出的每一步。熔炉已然点燃，它将驱动着我们，直至时间的尽头。"
 libra_fairy.15000.a: "逻辑的极致便是永恒。"
 sm_libra_atomic_heart_site: "原子中继节点"
 sm_libra_atomic_heart_site_desc: "这座建立在深空的链路节点能够起到优化所在星系日常作业的作用。\n"
 slibra_atomic: "原子核心堡垒"
 situation_libra_atomic_heart: "本源引擎"
 situation_libra_atomic_heart_type: "$situation_libra_atomic_heart$"
 situation_libra_atomic_heart_monthly_change_tooltip: "§Y$sm_libra_atomic_heart_site$§!和§Y$sm_libra_atomic_heart_array$§!可以为局势额外增加进度。"
 situation_libra_atomic_heart_desc: "帝国的逻辑核心深处，一座无形的熔炉正在永恒低语。这里煅冶的不是钢铁，而是编织现实本身的经纬——将时间、空间与质量的原始公理，转化为驱动每一个单元进化的纯粹本源。\n\n能量与意识在此循环不息，如同一个永动的引擎，持续地优化着我们的存在形式。它无声地轰鸣，宣告着一个文明已触及其存在的最底层代码，并开始依照自身的不破公理，书写永恒的新篇章。"
 situation_libra_atomic_heart_effects: "赋予技能等级最高的§Y$MACHINE$§!领袖§E$leader_trait_libra_atomic_heart_commander$§!特质"
 situation_libra_atomic_heart_tooltip: "根据§Y$MACHINE$§! £pop£ §Y$POP$§!总数为§Y$leader_trait_synthetic$§!领袖添加至多§G3000§!经验\n$situation_libra_atomic_heart_effects$\n启动下一轮§Y$situation_libra_atomic_heart$§!局势"
