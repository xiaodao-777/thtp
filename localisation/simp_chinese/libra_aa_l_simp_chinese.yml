 tech_repeatable_libra_psionic_foreordination: "宿命归元"
 tech_repeatable_libra_psionic_foreordination_desc: "我们掌握着自己的命运，并且它终会流向适当的地方，那一刻不会提前一分，也不会推迟一秒。\n$libraf_te_banner_2$"

 tech_repeatable_libra_psionic_balmy_breeze: "煦风化雨"
 tech_repeatable_libra_psionic_balmy_breeze_desc: "柔风吹过我们的居所，带来兴盛与繁荣。从中，我们感知到无限的未来。\n$libraf_te_banner_2$"

 tech_repeatable_libra_psionic_dod: "圣魔歧途"
 tech_repeatable_libra_psionic_dod_desc: "我们将会用自己的心神明辨事物，去查知、去领悟，通晓世间的万般姿态。\n$libraf_te_banner_2$"

