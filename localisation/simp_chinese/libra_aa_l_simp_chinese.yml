 concept_libra_cutefied_traits_desc: "分化特质包括：\n$t$['trait:trait_libra_cutefied_0']$t$['trait:trait_libra_cutefied_1']$t$['trait:trait_libra_cutefied_2']$t$['trait:trait_libra_cutefied_3']$t$['trait:trait_libra_cutefied_4']$t$['trait:trait_libra_cutefied_5']$t$['trait:trait_libra_cutefied_6']$t$['trait:trait_libra_cutefied_7']$t$['trait:trait_libra_cutefied_8']$t$['trait:trait_libra_cutefied_9']$t$['trait:trait_libra_cutefied_10']\n\n负面特质包括：\n$t$['trait:trait_libra_cutefied_n1']$t$['trait:trait_libra_cutefied_n2']$t$['trait:trait_libra_cutefied_n3']$t$['trait:trait_libra_cutefied_n4']$t$['trait:trait_libra_cutefied_n5']$t$['trait:trait_libra_cutefied_n6']$t$['trait:trait_libra_cutefied_n7']$t$['trait:trait_libra_cutefied_n8']$t$['trait:trait_libra_cutefied_m1']$t$['trait:trait_libra_cutefied_m2']$t$['trait:trait_libra_cutefied_m3']$t$['trait:trait_libra_cutefied_m4']$t$['trait:trait_libra_cutefied_m5']$t$['trait:trait_libra_cutefied_m6']$t$['trait:trait_libra_cutefied_m7']"
 trait_libra_cutefied_0: "兽娘"
 trait_libra_cutefied_0_desc: "基因修饰赋予这个物种野兽的特性——她们获得了优秀的体能和……稳定的发情期。"
 trait_libra_cutefied_0_tooltip: "每拥有一个§Y负面$TRAIT_TITLE$§!：\n$tt$—$MOD_LOGISTIC_GROWTH_MULT$: §G+15%§!"
 trait_libra_cutefied_1: "龙娘"
 trait_libra_cutefied_1_desc: "通过改造，这个物种获得了古龙的血脉，高贵而强大；但也继承了龙的习性，难以抗拒亮晶晶的珍宝。"
 trait_libra_cutefied_1_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R0.50§!£energy£ §Y$energy$§!"
 trait_libra_cutefied_2: "天使"
 trait_libra_cutefied_2_desc: "这个可爱的物种拥有鸟类的基因和人类的智力。"
 trait_libra_cutefied_2_tooltip: "$MOD_LEADER_SPECIES_EXP_GAIN$: §G+10%§!\n$t$—每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+2%§!"
 trait_libra_cutefied_3: "女仆"
 trait_libra_cutefied_3_desc: "保持整洁是仆从的职责，这些兢兢业业的个体会仔细打理居住环境，确保舒适宜居。"
 trait_libra_cutefied_3_tooltip: "每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+5%§!"
 trait_libra_cutefied_4: "粘液娘"
 trait_libra_cutefied_4_desc: "这个物种被改造为特殊的拟态生物，她们可以在多数环境下增殖。"
 trait_libra_cutefied_4_tooltip: "殖民地每有10%§Y$HABITABILITY$§!：\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$: §G+1%§!"
 trait_libra_cutefied_5: "触手娘"
 trait_libra_cutefied_5_desc: "这些可爱的触手可以做到一般肢体难以实现的高难度动作。"
 trait_libra_cutefied_5_tooltip: "每拥有一个§Y$TRAIT_TITLE$§!：\n$tt$—$specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+2%§!"
 trait_libra_cutefied_6: "精灵"
 trait_libra_cutefied_6_desc: "这个物种长生、高贵且渊博，不过，她们只喜欢最适合自己的环境。"
 trait_libra_cutefied_6_tooltip: "殖民地每有10%§Y$HABITABILITY$§!：\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+1%§!"
 trait_libra_cutefied_7: "偶像"
 trait_libra_cutefied_7_desc: "闪光点可以被无限放大，而缺点则需要尽可能地掩盖，只要不做出格的事情，再糟糕的问题也可以被一笔带过吧。"
 trait_libra_cutefied_7_tooltip: "每拥有一个§Y正面$TRAIT_TITLE$§!：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.20§!£society_research£ §Y$society_research$§!和§G0.20§!£unity£ §Y$unity$§!"
 trait_libra_cutefied_8: "幽魂"
 trait_libra_cutefied_8_desc: "对具有些微灵能的死灵物种来说，进行基因改造是相对困难的挑战，而如果成功，就可以像她们一样将怨念输出为强大的能量。"
 trait_libra_cutefied_8_tooltip: "每拥有一个§Y负面$TRAIT_TITLE$§!：\n$tt$—$mod_planet_pops_upkeep_mult$: §G-5%§!"
 trait_libra_cutefied_9: "人鱼"
 trait_libra_cutefied_9_desc: "人类的半身使这些鱼儿无需再担忧干旱造成的不便，她们能够在任何地方高唱魅惑之歌。"
 trait_libra_cutefied_9_tooltip: "殖民地每有10%§Y$HABITABILITY$§!：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.05§!£physics_research£ §Y$physics_research$§!和§G0.025§!£society_research£ §Y$society_research$§!"
 trait_libra_cutefied_10: "巫女"
 trait_libra_cutefied_10_desc: "这个物种可以感知稍远一些世界里发生的事情。"
 trait_libra_cutefied_10_tooltip: "每拥有一个§Y$TRAIT_TITLE$§!：\n$tt$—每$pop_group_unit$£pop£§Y$POP$§!每月生产§G0.05§!£physics_research£ §G0.05§!£society_research£ §G0.05§!£engineering_research£ §Y研究点数§!"
 trait_libra_cutefied_n1: "闪耀的装饰"
 trait_libra_cutefied_n1_desc: "这个物种过度喜欢合金饰品了，这种需求几乎上升到必需品的等级。"
 trait_libra_cutefied_n1_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R0.1§!£alloys£ §Y$alloys$§!"
 trait_libra_cutefied_n2: "桌角的专家"
 trait_libra_cutefied_n2_desc: "这个物种在自我满足上花费了较多精力，以至于实际操作的时候兴致贫乏。"
 trait_libra_cutefied_n3: "糟糕的台词"
 trait_libra_cutefied_n3_desc: "她们只是想正常地说话，却没有意识到自己的语句在听者而言会产生微妙的歧义。"
 trait_libra_cutefied_n4: "危险的发型"
 trait_libra_cutefied_n4_desc: "这个物种的流行发型过于一致地经典，看起来插满了会遭遇某种不幸的旗标。"
 trait_libra_cutefied_n5: "魔镜依存症"
 trait_libra_cutefied_n5_desc: "这个物种的成员往往逢人便问：“谁最美？”"
 trait_libra_cutefied_n6: "牙刷爱好者"
 trait_libra_cutefied_n6_desc: "这个物种喜欢带小型电机的小物件，比如电动牙刷。"
 trait_libra_cutefied_n7: "诡计多端的X"
 trait_libra_cutefied_n7_desc: "这个物种喜欢被动的处境——或者说，她们总是设下圈套来诱导对方主动出击。"
 trait_libra_cutefied_n8: "主人的任务"
 trait_libra_cutefied_n8_desc: "这个物种沉迷于角色扮演，而贻误了日常工作。"
 trait_libra_cutefied_m1: "优选秀场"
 trait_libra_cutefied_m1_desc: "只有这个物种选定的环境才能体现出她们的美好，其他地方都普普通通的。"
 trait_libra_cutefied_m2: "离群趋向"
 trait_libra_cutefied_m2_desc: "这个物种喜欢独自欣赏自己美丽的外表，减少与他人的交流。"
 trait_libra_cutefied_m3: "变态再生"
 trait_libra_cutefied_m3_desc: "这个物种的再生能力伴随着特殊激素的分泌，更加容易做出激进行为，简单来说，她们都是心理变态。"
 trait_libra_cutefied_m4: "社会钉子户"
 trait_libra_cutefied_m4_desc: "一旦决定了自己的位置，她们就不愿再作任何改变，即使留在原地将面临奇奇怪怪的不幸。"
 trait_libra_cutefied_m5: "喵喵拳"
 trait_libra_cutefied_m5_desc: "她们的肢体力量相当低下，如果用来攻击，比起造成伤害更可能令对手陷入亢奋。"
 trait_libra_cutefied_m6: "床的宿敌"
 trait_libra_cutefied_m6_desc: "这个物种非常喜欢睡懒觉，她们经常延误一些重要时刻，比如移民航班出发的时候。"
 trait_libra_cutefied_m7: "母乳体质"
 trait_libra_cutefied_m7_desc: "特殊的基因表达影响了这个物种的激素分泌，即使没有生育，她们仍会在受到刺激时大量泌乳，这带来了相当程度的营养负担。"
 trait_libra_cutefied_m7_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!额外消耗§R1§!£food£ §Y$food$§!"

