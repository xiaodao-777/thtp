 council_agenda_agenda_libra_directive_76_e_desc: "量变造就质变，克隆大军将会淹没世界。"
 agenda_libra_directive_76_e_tooltip: "每支 £army_ship£ §Y$perfected_clone_army$§!在之后的§Y20§!年内带来§G+1%§!£mod_planet_colony_development_speed_mult£ §Y$MOD_PLANET_COLONY_DEVELOPMENT_SPEED_MULT$§!和§Y+1%§!£mod_planet_building_build_speed_mult£ §Y$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$§!，最多§G+100%§!"
 situation_libra_directive_76: "军团塑造"
 situation_libra_directive_76_type: "$situation_libra_directive_76$"
 situation_libra_directive_76_monthly_change_tooltip: "£building£ §Y$building_clone_vats$§!可以为局势额外增加进度。"
 situation_libra_directive_76_desc: "帝国的战争机器并非生而完美，它需要被持续地锻造与校准。此进程无关外界的纷争，而关乎我们自身形态的纯粹——将杂乱的个体意志熔铸为统一的战争直觉，将脆弱的生物组织替换为更高效的杀戮模组。\n\n这是一场向内的征伐，其唯一目标是剔除我们军事体系中最后一丝低效与不确定性。每一步的完成，都意味着我们的军团向终极形态又逼近了一步。当塑造完成之日，我们的安宁将不再是一种期望，而是由我们绝对力量所定义的、不容置疑的现实。"
 situation_libra_directive_76_effects: "解锁§Y$ap_libra_directive_76$§!的一项能力"
 situation_libra_directive_76_tooltip: "解锁§Y$ap_libra_directive_76$§!的全部能力"
 situation_libra_directive_76_approach_a: "整合"
 situation_libra_directive_76_approach_b: "加速"
 libra_fairy.10021.name: "奠基：架构蓝图"
 libra_fairy.10021.desc: "塑造的克隆军团宏伟工程已然启动。目前，我们拥有的仅是一块空白的画布与无限的潜力。基础框架亟待确立，这将决定整个军团未来的发展方向与特质。\n\n我们必须审慎地选择第一个强化领域——是淬炼其进攻的锋芒，亦或是锻造其不朽的防御？每一项选择都将让军团初具雏形，并为我们揭示下一块需要拼合的版图。"
 libra_fairy.10021.a: "构造星际要塞。"
 libra_fairy.10021.b: "建立军团总部。"
 libra_fairy.10021.c: "遗传物质剪裁。"
 libra_fairy.10022.name: "塑形：初显锋芒"
 libra_fairy.10022.desc: "第一阶段的强化已成功整合进军团的基础协议中，其效果正如模拟推演般精准呈现。然而，成功的初步测试也暴露了系统中存在的全新可优化节点。\n\n随着基础架构的稳固，我们面前展开了更为复杂的升级路径。是深化初始优势，还是弥补新发现的短板？帝国的战争艺术品，正等待下一笔决定性的雕琢。"
 libra_fairy.10022.a: "星际工事。"
 libra_fairy.10022.b: "总部建设。"
 libra_fairy.10022.c: "基因研究。"
 libra_fairy.10022.d: "军事训练。"
 libra_fairy.10022.e: "个体复制。"
 libra_fairy.10022.f: "领袖增强。"
 libra_fairy.10023.name: "整合：基因融合"
 libra_fairy.10023.desc: "军团的子系统正以前所未有的效率协同运作。我们已经超越了单一组织的优化阶段，进入了更宏观的系统整合层面。\n\n新的交叉应用领域正在涌现。是时候将已有的强化模块编织成一个更具韧性与适应性的有机整体了。选择下一个集成方向，将决定军团能获得无坚不摧的利矛，还是固若金汤的坚盾。"
 libra_fairy.10023.a: "以要塞阻挡敌人。"
 libra_fairy.10023.b: "以战术统御军团。"
 libra_fairy.10023.c: "以基因创造优势。"
 libra_fairy.10023.d: "以纪律打破枷锁。"
 libra_fairy.10023.e: "以精英领导万物。"
 libra_fairy.10023.f: "以顾问支援领袖。"
 libra_fairy.10024.name: "精炼：臻于至善"
 libra_fairy.10024.desc: "军团已展现出令人生畏的潜力，但其力量的边界远未触及。我们正站在从“优秀”迈向“完美”的门槛上。\n\n精密的内部诊断揭示了更深层次的微调可能性。这些优化看似细微，却可能在未来战场的天平上投下决定性的砝码。选择何处注入这份匠心，将是通往终极形态的关键一步。"
 libra_fairy.10024.a: "恒星基地。"
 libra_fairy.10024.b: "行星建设。"
 libra_fairy.10024.c: "物种特性。"
 libra_fairy.10024.d: "军队效益。"
 libra_fairy.10024.e: "领袖克隆。"
 libra_fairy.10024.f: "领袖增强。"
 libra_fairy.10025.name: "蜕变：突破阈限"
 libra_fairy.10025.desc: "军团的力量已逼近原有设计框架的理论极限。然而，我们并未止步——最新的生物学模拟数据指出了数条通往更高层次的、近乎颠覆性的进化路径。\n\n这不再是简单的优化，而是一场彻底的蜕变。我们将重新定义克隆军团的潜力边界。选择哪一条道路，将塑造出足以改写星系战争史的终极兵器。"
 libra_fairy.10025.a: "升级星际工程。"
 libra_fairy.10025.b: "组织军团核心。"
 libra_fairy.10025.c: "改良染色体序列。"
 libra_fairy.10025.d: "增强军事支持。"
 libra_fairy.10025.e: "构筑镜像帝国。"
 libra_fairy.10025.f: "制造超级克隆人。"
 libra_fairy.10026.name: "圆满：终极雕琢"
 libra_fairy.10026.desc: "终极军团的轮廓已在眼前，其威能超乎我们最乐观的预期。此刻，仅剩最后几个关键片段有待最终校准，以实现所有子系统间的完美共振。\n\n这是最后的工作：完成它，军团将不再是一件武器，而将成为一件完美的、活着的战争艺术品，成为帝国和平最毋庸置疑的保障。"
 libra_fairy.10026.a: "强化军队训练。"
 libra_fairy.10026.b: "克隆精英领袖。"
 libra_fairy.10026.c: "改良复制体。"
 libra_fairy.10027.name: "完美形态"
 libra_fairy.10027.desc: "当最后的编码被写入基因，当最终的神经校准至完美共振，伟大的寂静降临了。这并非空虚，而是一种终极秩序带来的、令人敬畏的宁静。\n\n宏伟的帝国蓝图，终于在此刻化为触手可及的现实。在我们眼前屹立的，不再是简单的军队，而是一件活着的、呼吸的、会思考的战争艺术品。他们是同一基因序列的无穷变奏，是冰冷逻辑与炽热毁灭欲的完美结合体。每一个单位都是整体不可或缺的部件，亿万个体共鸣着同一个意志。\n\n帝国的疆域或许尚有边界，但由这支终极军团所定义的力量，已无远弗届。他们本身，就是移动的国境线，是文明的最终边界。从此，和平将不再是我们祈求的目标，而是我们为银河系设定的、不容置疑的状态。"
 libra_fairy.10027.a: "军团，即是真理。"
 libra_fairy.10031.name: "太空驻营地"
 libra_fairy.10031.desc: "虚空中森严的堡垒构成天罗地网，它标示着克隆人的领域——敌人的禁地，也是军团温暖的港湾。"
 libra_fairy.10032.name: "中央指挥部"
 libra_fairy.10032.desc: "经由工程设计团队的努力工作，以及生物研究部门和军方的配合，克隆人总部的蓝图已经完成。这座宏伟的建筑兼顾研究实验与军事指挥的功能，只差选择一个合适的位置建造就大功告成了。"
 libra_fairy.10033.name: "克隆适应性"
 libra_fairy.10033.desc: "在充分测试，收集临床数据调整之后，科研部门开发了三套不同的克隆人基因模板，在保证军事能力的同时特化部分优势，我们需要注重什么？"
 libra_fairy.10033.a: "质量是第一要务。"
 libra_fairy.10033.b: "数量可以盖过问题。"
 libra_fairy.10033.c: "领导决定成败。"
 libra_fairy.10034.name: "军士的号角"
 libra_fairy.10034.desc: "克隆人终究是生物，可以快速形成战斗力，但传统的军事训练有益无害。通过实验论证，军队开发了一种新的活动纲领，可以在执行日常活动时兼顾其它目标。"
 libra_fairy.10035.name: "另一个我们"
 libra_fairy.10035.desc: "在专门的优化研究之后，我们的实验团队已经制造了更进一步的特殊克隆仓，专用于精英领袖的复制作业，可以完全重现他们的能力。由于这是一套非常复杂且难以维护的设施，将它安置在总部是最好的选择。需要的领袖可以自行前往设施以接受克隆工作。"
 libra_fairy.10036.name: "克隆人顾问"
 libra_fairy.10036.desc: "我们升级了原有的领袖克隆体，以更高的标准和更精密的途径完成，可以发挥出近似本体的能力。这些改良的复制体继承了我们尚武的特性，在军事领域表现出惊人的潜力。"

