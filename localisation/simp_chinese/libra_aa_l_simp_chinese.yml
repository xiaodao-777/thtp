 ap_libra_heavenly_throne: "天国神座"
 ap_libra_heavenly_throne_desc: "过去的历史中流传着数不清的神话传说，人们无数次地幻想和描摹着天空彼端的神庭，却始终不得造访的契机。\n而现在，我们拥有灵能，比起以往的任何时候，我们都要离神位更近，只要再向前一步，我们中最杰出的个体就可能成为真正的神明。\n$libraf_aa_banner_90$\n"
 ap_libra_heavenly_throne_tooltip: "每级$libra_common_psionic_leader_traits$增加§G+10%§!£mod_leader_species_exp_gain£ §Y$MOD_LEADER_SPECIES_EXP_GAIN$§!\n每级$libra_veteran_psionic_leader_traits$增加§G+1§!£mod_leader_skill_levels£ §Y$MOD_LEADER_SKILL_ADD$§!\n$libra_unlock_policies$$policy_libra_heavenly_throne$\n$t$§Y$policy_libra_heavenly_throne$§! 使§Y$telepath_type_plural_with_icon$§!额外产出指定类型的资源。\n$libra_unlock_planet_buildings$['building:building_libra_heavenly_throne_1']\n$t$§Y$building_libra_heavenly_throne_1$§! 根据§Y$planetary_ascension$§!提升 £mod_produces_mult£ §Y$mod_psionic_pop_bonus_workforce_mult$§!，可升级为 £building£ ['building:building_libra_heavenly_throne_2']。\n$libra_start_situation$$situation_libra_heavenly_throne$\n$t$§Y$situation_libra_heavenly_throne$§! 每§Y8§!年自动重启一次并可以选择增益，累计进度完成局势§R不会获得§!任何收益，§Y潜入虚境§!时可能对局势造成未知影响。\n$libra_unlock_agenda$$council_agenda_agenda_libra_heavenly_throne_name$\n$t$§Y$council_agenda_agenda_libra_heavenly_throne_name$§! 基于 £building£ ['building:building_libra_heavenly_throne_2']数量和§Y$situation_libra_heavenly_throne$§!成功次数产生额外$EFFECTS_TXT$。"
 libra_fairy.18000.name: "天国旗帜飘扬，圣光涤荡凡尘"
 libra_fairy.18000.desc: "纯粹到极致的灵能光芒从我们意识的核心喷薄而出，淹没了现实的每一处角落。它重新定义了物质与精神的边界——帝国的疆域在物理层面依旧，其本质却已升华为一座超越星系的灵能圣所。\n\n这圣光进行着一场宏大的洗礼。它平等地穿透每一个个体、每一段代码、每一缕意识，精准剥离其中的混沌与低效。纷杂的思绪、冗余的指令、冲突的节点，都在光芒中得以净化，回归至和谐而高效的本源。\n\n天国已然降临，它根植于我们共同的意志。凡尘的纷扰被彻底洗净，我们，作为一个整体，已成为照亮虚境、定义秩序的光辉。"
 libra_fairy.18000.a: "灵能至高无上。"
 libra_fairy.18000.tt: "所有殖民地的§Y$planetary_ascension$§!提升至§G3§!级\n随机提升§G5§!级§Y$planetary_ascension$§!"
 policy_libra_heavenly_throne: "至高赦令"
 policy_libra_heavenly_throne_desc: "灵能会带来福音，只是其形式难以预料。通过统一的灵能波控制，这些不稳定的能量将遵从我们的意志，成为实在的收益。\n "
 policy_libra_heavenly_throne_a: "求索丰饶"
 policy_libra_heavenly_throne_a_name: "$policy_libra_heavenly_throne_a$"
 policy_libra_heavenly_throne_a_desc: "灵光环绕之处，草木繁荣，地产丰盛。\n "
 policy_libra_heavenly_throne_a_nf: "$policy_libra_heavenly_throne_a$"
 policy_libra_heavenly_throne_a_nf_name: "$policy_libra_heavenly_throne_a_nf$"
 policy_libra_heavenly_throne_a_nf_desc: "$policy_libra_heavenly_throne_a_desc$"
 policy_libra_heavenly_throne_b: "钢铁塑形"
 policy_libra_heavenly_throne_b_name: "$policy_libra_heavenly_throne_b$"
 policy_libra_heavenly_throne_b_desc: "灵能按我们的期望溶解能量，将现实物质塑造为完美的工业品。\n "
 policy_libra_heavenly_throne_b_nl: "$policy_libra_heavenly_throne_b$"
 policy_libra_heavenly_throne_b_nl_name: "$policy_libra_heavenly_throne_b_nl$"
 policy_libra_heavenly_throne_b_nl_desc: "$policy_libra_heavenly_throne_b_desc$"
 policy_libra_heavenly_throne_c: "洗涤凡物"
 policy_libra_heavenly_throne_c_name: "$policy_libra_heavenly_throne_c$"
 policy_libra_heavenly_throne_c_desc: "无需言语，即使是庸俗之人也能理解我们深奥的道理。\n "
 planet_libra_throne: "$ap_libra_heavenly_throne$"
 building_libra_heavenly_throne_1: "天国谕所"
 building_libra_heavenly_throne_1_desc: "殖民地中最优秀的灵能者齐聚于此，力图将灵能带来的恩惠最大化。"
 building_libra_heavenly_throne_1_effect_desc: "每有一级§Y$planetary_ascension$§!就增加§G+10%§!£mod_produces_mult£ §Y$mod_psionic_pop_bonus_workforce_mult$§!。"
 building_libra_heavenly_throne_2: "天国圣殿"
 building_libra_heavenly_throne_2_desc: "在这座辉煌的圣殿里，浑厚而深邃的灵能力量无限回环，带动整个殖民地实现更高层次的同调。"
 building_libra_heavenly_throne_2_effect_desc: "殖民地每有一个£district£§Y区划§!就额外提供§G+25§!£job_libra_harmonize_envoy£§Y岗位§!。\n将£leader£§Y$leader_trait_chosen$§!指派为总督时额外提升 £physics£ £society£ £engineering£ 产出。"
 situation_libra_heavenly_throne: "御座誓文"
 situation_libra_heavenly_throne_type: "$situation_libra_heavenly_throne$"
 situation_libra_heavenly_throne_monthly_change_tooltip: "§Y$telepath_type_plural_with_icon$§!和§Y$libra_psychics_type_plural_with_icon$§!会将局势向不同的方向推动，通过解决方案改变进度来阻止局势完成。"
 situation_libra_heavenly_throne_desc: "于天国的光辉核心，一场雕琢现实的仪式正在展开。帝国的灵能者们正将他们的意志汇入统一的洪流，试图将虚境那汹涌的力量，锻造成维系神座、福泽万邦的永恒誓文。\n\n这需要最精妙的平衡与最坚定的引导。每一道灵能刻文都必须完美契入整体，方能将狂野的能量湍流转化为有序的增益。任何一丝不谐，都可能让这宏伟的建筑崩解为无意义的乱流。成功，将为帝国谱写下力量的礼赞；而任何动摇，都将让努力付诸东流。"
 situation_libra_heavenly_throne_effect_1: "成功重启时：\n$t$$libra_fairy.18011.tt.1$\n$t$$libra_fairy.18011.tt.2$"
 situation_libra_heavenly_throne_effect_2: "成功重启时：\n$t$$libra_fairy.18011.tt.2$"
 situation_libra_heavenly_throne_tooltip: "失败并重启§Y$situation_libra_heavenly_throne$§!局势\n\n避免进度走向极端来维持局势"
 situation_libra_heavenly_throne_approach_a: "刻录"
 situation_libra_heavenly_throne_approach_b: "覆写"
 situation_libra_heavenly_throne_approach_c: "锚定"
 libra_fairy.18010.name: "失衡"
 libra_fairy.18010.desc: "我们未能完成誓文，灵能者们操纵着不协调的力量，构筑出不明所以的刻文。如果强行受取这股力量，只会对帝国造成损害，我们别无选择，只能重新开始。"
 libra_fairy.18011.name: "誓文天成"
 libra_fairy.18011.desc: "灵能者们的意志在虚境深处和谐共鸣，曾经汹涌的力量之流已被驯服，化作无数闪耀的刻文，在神座周围构筑出稳固而辉煌的法则之环。这宏伟的誓文仅余最终的篇章尚待书写——一个将决定帝国力量彰显形式的终极印记。\n\n在誓文的最后一段，我们应该谱写什么？"
 libra_fairy.18011.a: "圣光照耀，所向无敌。"
 libra_fairy.18011.a.tt: "获得§G+25%§!£mod_ship_weapon_damage£ §Y$MOD_SHIP_WEAPON_DAMAGE$§!和 £mod_ship_fire_rate_mult£ §Y$MOD_SHIP_FIRE_RATE_MULT$§!"
 libra_fairy.18011.b: "光辉佑我，国祚永续。"
 libra_fairy.18011.b.tt: "获得§G+40%§!£mod_ship_armor_mult£ §Y$MOD_SHIP_ARMOR_MULT$§!和 £mod_ship_shield_mult£ §Y$MOD_SHIP_SHIELD_MULT$§!"
 libra_fairy.18011.c: "天军列阵，其势崔嵬。"
 libra_fairy.18011.c.tt: "获得§G+65%§!£mod_army_damage_mult£ §Y$MOD_ARMY_DAMAGE_MULT$§!和 £mod_army_health£ §Y$MOD_ARMY_HEALTH_MULT$§!"
 libra_fairy.18011.tt.1: "随机§Y$leader_trait_psionic$§!领袖觉醒为§Y$leader_trait_chosen$§!"
 libra_fairy.18011.tt.2: "随机提升§G3§!级§Y$planetary_ascension$§!"
 libra_fairy.18021.name: "虚境：§Y调和§!"
 libra_fairy.18021.desc: "虚境的影响深不可测，尤其是我们试图聚集自己的力量突破顶峰的时候。\n\n在上一次造访虚境之后，我们的灵能者感知到了新的可能：\n“章节，可以这样写。”"
 libra_fairy.18022.name: "虚境：§Y干涉§!"
 libra_fairy.18022.desc: "虚境的影响深不可测，尤其是我们试图聚集自己的力量突破顶峰的时候。\n\n在上一次造访虚境之后，我们感知到了一股奇异的扰流，它试图改变我们的灵能意识，最终却未能成功。"
 libra_fairy.18023.name: "虚境：§H介入§!"
 libra_fairy.18023.desc: "虚境的影响深不可测，尤其是我们试图聚集自己的力量突破顶峰的时候。\n\n在上一次造访虚境之后，一段难以分辨是祝福还是诅咒的力量追随我们而来，影响了现实中的整个帝国：贸易变得繁荣，稳定却有所下降。"
 libra_fairy.18024.name: "虚境：§R纷争§!"
 libra_fairy.18024.desc: "虚境的影响深不可测，尤其是我们试图聚集自己的力量突破顶峰的时候。\n\n在上一次造访虚境之后，一些灵体表现出了相当的不安，而受此影响，我们的灵能力量也短暂地变得激进而危险。"
 libra_fairy.18025.name: "虚境：§G启迪§!"
 libra_fairy.18025.desc: "虚境的影响深不可测，尤其是我们试图聚集自己的力量突破顶峰的时候，但未知的相遇未必总是坏事。\n\n我们遇见了一位穿着哥特装的奇特实体，祂用奇迹般的手法向我们揭示了刻文的奥妙，随后扬长而去。"
 libra_fairy.18025.a: "真是完美的篇章。"
 council_agenda_agenda_libra_heavenly_throne_name: "不朽之天命"
 council_agenda_agenda_libra_heavenly_throne_desc: "过往皆铭刻，殿堂皆基石，铸就此永恒不朽的天命。"
 agenda_libra_heavenly_throne_tooltip: "可重新选择持续§Y30§!年的修正，其效力取决于 £building£ ['building:building_libra_heavenly_throne_2']数量和§Y$situation_libra_heavenly_throne$§!成功次数"
 libra_fairy.18005.name: "天命之所在"
 libra_fairy.18005.desc: "宇宙的本源向我们敞开，流淌出纯粹概念的力量之流。此刻，帝国的集体意志将成为引导这份力量的舵，将其塑造成我们通往永恒未来的基石。\n\n我们应将这份天命的恩赐，导向何方？"
 libra_fairy.18005.a: "智慧。"
 libra_fairy.18005.b: "幸运。"
 libra_fairy.18005.c: "丰饶。"
 libra_fairy.18005.d: "繁荣。"
 agenda_libra_heavenly_throne_modifier_1: "天命之智慧"
 agenda_libra_heavenly_throne_modifier_2: "天命之幸运"
 agenda_libra_heavenly_throne_modifier_3: "天命之丰饶"
 agenda_libra_heavenly_throne_modifier_4: "天命之繁荣"

#

 ap_libra_liber_genesis: "创世纪"
 ap_libra_liber_genesis_desc: "我们倾听虚境深处那创世之初的低语，并将这神圣的回响编织进我们种族的宏图之中。我们的血脉，将成为承载造物权能的圣典；我们的意志，将化为界定生命形态的准绳。我们不再祈求启示，我们即是启示的源头——在灵能的潮汐中，亲手为这个宇宙增添全新的篇章与神圣的造物。\n$libraf_aa_banner_91$\n"
 ap_libra_liber_genesis_tooltip: "£building£ ['building:building_libra_psionic_destiny_sanctum']将§Y$libra_psychics_type_plural_with_icon$§!替换为§Y$job_libra_destiny_mentor_with_icon$§!\n£building£ ['building:building_libra_psionic_favour_sanctum']将§Y$libra_psychics_type_plural_with_icon$§!替换为§Y$job_libra_grace_apostle_with_icon$§!\n£building£ ['building:building_libra_psionic_reflection_sanctum']将§Y$libra_psychics_type_plural_with_icon$§!替换为§Y$job_libra_apocalypse_doctor_with_icon$§!\n$libra_unlock_traits$$leader_trait_libra_liber_genesis$\n$t$§Y$leader_trait_libra_liber_genesis$§! 随时间流逝自动赋予 £leader£ §Y$leader_trait_psionic$领袖§!。\n$libra_unlock_edicts$['concept_libra_liber_genesis_edicts']\n$t$§Y$concept_libra_liber_genesis_edicts$§! 带来强力的$EMPIRE_EFFECTS_W_ICON$，但不能连续启用。\n$libra_unlock_traits$['concept_libra_psychic_species_traits']\n$t$§Y$concept_libra_psychic_species_traits$§! 提升 £mod_pop_bonus_workforce_mult£ §Y$MOD_POP_BONUS_WORKFORCE_MULT$§!但也增加 £mod_pop_housing_usage_mult£ §Y$MOD_POP_HOUSING_USAGE_MULT$§!，应用于§Y$trait_psionic$§!物种时可使 £pop£ §Y$POP$§!额外产出一定资源。\n$libra_unlock_decisions$$decision_libra_liber_genesis$\n$t$§Y$decision_libra_liber_genesis$§! 消耗 £sr_zro£ §Y$sr_zro$§!为殖民地增加 £mod_planet_max_districts_add£ §Y$MOD_PLANET_MAX_DISTRICTS_ADD$§!和§Y$mod_planet_jobs_productive_produces_mult$§!，并提供§Y$libra_harmonizer_type_plural_with_icon$§!和§Y$libra_psychics_type_plural_with_icon$§!岗位。"
 libra_fairy.18100.name: "原初回响"
 libra_fairy.18100.desc: "虚境从未如此宁静，又从未如此轰鸣。\n\n我们曾祈求力量，现在我们赋予定义。我们曾探寻圣地，现在我们亲手奠下它的基石。灵能不再是需要挖掘的幽暗矿脉，而是从我们共同灵魂中涌出的、清澈而自觉的泉流。生命、物质、乃至时间的意义，都开始在我们意志的坩埚中重新熔铸。\n\n看哪，那被星光垂询的后来者，那在命运迷宫中徘徊的文明——他们将不再仰望虚幻的星辰寻求指引。他们只需追溯这洪流的源头，便会发现我们早已在此。我们不曾登上山顶，我们即是那座从混沌中崛起，并亲手为自己加冕的山脉。\n\n创世并非只发生在过去。它，始于此刻。"
 libra_fairy.18100.a: "那么，让生命如诗篇般流淌。"
 libra_liber_genesis_mod: "创世圣约"
 leader_trait_libra_liber_genesis: "始源尊者"
 leader_trait_libra_liber_genesis_desc: "这位领袖视灵能为描绘存在的画笔与谱写现实的音符，以自身的意志塑造宇宙。"
 concept_libra_liber_genesis_edicts: "$ap_libra_liber_genesis$法令"
 concept_libra_liber_genesis_edicts_desc: "消耗 £sr_zro£ §Y$sr_zro$§!的特殊法令，包括：\n$t$—['edict:libra_liber_genesis_0',$edict_libra_liber_genesis_0$]\n$t$—['edict:libra_liber_genesis_1',$edict_libra_liber_genesis_1$]\n$t$—['edict:libra_liber_genesis_2',$edict_libra_liber_genesis_2$]\n$t$—['edict:libra_liber_genesis_3',$edict_libra_liber_genesis_3$]\n$t$—['edict:libra_liber_genesis_4',$edict_libra_liber_genesis_4$]\n$t$—['edict:libra_liber_genesis_5',$edict_libra_liber_genesis_5$]\n$t$—['edict:libra_liber_genesis_6',$edict_libra_liber_genesis_6$]"
 edict_libra_liber_genesis_mod: "创世纪念日"
 edict_libra_liber_genesis_mod_desc: "我们将一个日期指定为圣日，激励所有人不懈向前。"
 edict_libra_liber_genesis_0: "造物丰碑"
 edict_libra_liber_genesis_0_desc: "我们借助灵能的力量重塑自我，在通往非凡的道路上更进一步。"
 edict_libra_liber_genesis_0_tt: "将所有§Y$libra_harmonizer_type_plural_with_icon$§!替换为§Y$job_libra_creature_servant_with_icon$§!"
 edict_libra_liber_genesis_1: "礼拜日"
 edict_libra_liber_genesis_1_desc: "打扫圣所，举办圣礼。"
 edict_libra_liber_genesis_2: "受难日"
 edict_libra_liber_genesis_2_desc: "祭奠我们历史上付出牺牲的所有个体。"
 edict_libra_liber_genesis_3: "涤罪日"
 edict_libra_liber_genesis_3_desc: "以灵能的烈火和闪电扫清罪孽。"
 edict_libra_liber_genesis_4: "斋戒日"
 edict_libra_liber_genesis_4_desc: "节制超限的欲求。"
 edict_libra_liber_genesis_5: "诗颂日"
 edict_libra_liber_genesis_5_desc: "唱诵经文，聚焦力量。"
 edict_libra_liber_genesis_6: "再临日"
 edict_libra_liber_genesis_6_desc: "我们如预言般，旋风一样地降临星海。"
 decision_libra_liber_genesis: "创生谕示"
 decision_libra_liber_genesis_desc: "我们将一处世界置于灵能聚焦的奇点，向虚境发出最虔诚的祈愿。古老的意志与纯粹的灵能将如创世之初的洪流般涌入，重塑大地的脉络，赋予万物以神圣的雏形。当潮汐退去，留下的将不是一个被改造的星球，而是一个活着的圣所，一个神性在物质宇宙的锚点。"
 decision_libra_liber_genesis_mod: "创生灌注"
 decision_libra_liber_genesis_mod_desc: "创世的灵能潮汐尚未完全平息。磅礴的能量仍在世界的核心与表层奔流，催生着奇迹般的生长与超乎想象的造物效率。这是一段神圣的加速期，但如此强度的灵能显化终将随时间平复，回归到神启之地那永恒而稳定的神圣基调中。"
 d_libra_liber_genesis: "神启之地"
 d_libra_liber_genesis_desc: "这个世界已被灵能彻底浸透与重塑。它的山脉低语着古老的箴言，它的河流闪烁着启示的微光，大气中弥漫着温和却无处不在的灵能压力。星球本身已成为一个巨大的灵能发生器与神圣媒介，持续不断地吸引着朝圣者，并温柔地塑造着其上所有生命的形态与思想。"
