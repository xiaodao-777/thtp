 situation_libra_hurricane_eye_desc: "当纳米洪流不再被动，它们将化作恣意的狂岚席卷星系。\n在核心指令下，纳米风暴可以对敌舰刻下致命的裂伤，也能为荒芜之地降下重构的甘霖。\n\n§Y纳米风暴§!半径受§Y星系大小§!影响"
