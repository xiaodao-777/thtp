 mod_job_libra_cybernetics_drone_per_pop_short: "\n每$VALUE$£pop£§G+1§! £mod_job_libra_cybernetics_drone_add£"
 mod_job_libra_cybernetics_drone_max_workforce_mult: "[libra_cybernetics_drone.GetName]的最大劳动力"
