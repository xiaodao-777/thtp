 libra_transcendental_cybernetics_2_b_name: "$policy_libra_transcendental_cybernetics_2_b$"
 policy_libra_transcendental_cybernetics_2_b_desc: "由我们精密的管理体系逐级分配义体更新，最大化资源利用。\n\n每级 £building£ §Y$building_libra_augment_site_1$§!提升§G+10%§!£mod_produces_mult£ §Y$mod_planet_jobs_productive_produces_mult$§!"
