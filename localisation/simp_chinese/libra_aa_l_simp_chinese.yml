# Mutation
# ####################

 tech_libra_mutation_encoding: "高等基因编码"
 tech_libra_mutation_encoding_desc: "$libra_genetics_tech_biomorphosis_tt$进一步发展的基因技术允许我们对生物表型作更多修饰。\n$libra_gate_banner_15$"
 TECH_UNLOCK_LIBRA_LRT_TITLE: "$libra_unlock_features$复杂基因转嫁"
 TECH_UNLOCK_LIBRA_LRT_DESC: "§H复杂基因转嫁§!\n可以通过基因修饰无视表型限制添加来自§Y$libra_mod_name$§!的物种特质。包含以下组别：\n$t$['concept_libra_humanoid_traits']\n$t$['concept_libra_mammalian_traits']\n$t$['concept_libra_molluscoid_traits']\n$t$['concept_libra_fungoid_traits']\n$t$['concept_libra_plantoid_traits']\n$t$['concept_libra_lithoid_traits']\n$t$['concept_libra_necroid_traits']\n$t$['concept_libra_aquatic_traits']\n$t$['concept_libra_reptilian_traits']\n$t$['concept_libra_avian_traits']\n$t$['concept_libra_infernal_traits']\n\n若在['concept_biomorphosis']局势的所有阶段都选择 £mutation£ ['tradition_category:tradition_mutation']并采纳['tradition:tr_mutation_unnatural_selection']传统，也将解锁此能力，届时将提供其它加成。"

 tech_libra_mutation_integration: "基因组融合"
 tech_libra_mutation_integration_desc: "在我们科学的早期阶段，拼合DNA是无法想象的尝试，现在我们拥有实现这一壮举的能力。\n$libra_gate_banner_15$"
 building_libra_evolutionary_laboratory: "演化实验场"
 building_libra_evolutionary_laboratory_desc: "这座设施用于进行复杂转基因实验，也能为居民提供医务支持。"
 building_libra_evolutionary_laboratory_effect_desc: "每有一级§Y$planetary_ascension$§!就提供§G+3%§!£mod_produces_mult£ §Y$mod_planet_jobs_produces_mult$§!和§R+2%§!£mod_upkeep_mult£ §Y$mod_planet_jobs_upkeep_mult$§!。"

 tech_libra_mutation_protection: "突变保障"
 tech_libra_mutation_protection_desc: "这项特殊的医疗支援体系将所有符合条件的居民编入健康管理网络，以期发生负面变异的个体可以得到及时治疗。\n$libra_gate_banner_15$"
 edict_libra_mutation_protection: "全面看护"
 edict_libra_mutation_protection_desc: "我们的医务人员会确保每一个个体身体健康。"

 tech_repeatable_libra_mutation: "自我迭代"
 tech_repeatable_libra_mutation_desc: "高度提升的诱变基因将生物进化所需的时间由亿万年缩减至几月甚至几天，这给了我们充足的时间来选择自己期望的方向。\n$libraf_te_banner_15$"

 ap_libra_evolutionary_endpoint: "演化终点"
 ap_libra_evolutionary_endpoint_desc: "突变塑造生命，纷争编织历史；宇宙变迁，塑成的是我们的舞台。\n$libraf_aa_banner_30$\n"
 ap_libra_evolutionary_endpoint_tooltip: "$mod_country_produces_mult$: §R-16%§!\n§Y主体物种§!每有一个特质：\n$t$$mod_country_produces_mult$: §G+3.50%§!（最大: §G+56%§!）\n$t$$MOD_COUNTRY_SOCIETY_TECH_RESEARCH_SPEED$: §G+5%§!（最大: §G+80%§!）\n$libra_unlock_traits$$leader_trait_libra_evolutionary_endpoint$\n$t$§Y$leader_trait_libra_evolutionary_endpoint$§! 随时间流逝自动赋予 £leader£ §Y生物领袖§!，其$EFFECTS_TXT$随§Y领袖特质总等级§!提升而提高。\n$libra_start_situation$$situation_libra_evolutionary_endpoint$\n$t$§Y$situation_libra_evolutionary_endpoint$§! 随阶段进展提升至多§G+3§!£mod_country_government_civic_points_add£ §Y$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$§!和§G+50%§!£mod_pop_bonus_workforce_mult£ §Y$mod_organic_pop_bonus_workforce_mult$§!。\n$libra_unlock_decisions$$decision_libra_evolutionary_endpoint$\n$t$§Y$decision_libra_evolutionary_endpoint$§! 每次执行都会为§Y$situation_libra_evolutionary_endpoint$§!局势增添进度，在建有 £building£ ['building:building_libra_evolutionary_laboratory']的殖民地上实施将提供额外的§Y$libra_chromosome_engineer_type_plural_with_icon$§!岗位。"
 libra_fairy.12000.name: "集中一点，登峰造极"
 libra_fairy.12000.desc: "我们的血脉，从未停止歌唱变化的圣歌。当其他文明将基因视作蓝图时，我们则将其尊奉为流动的乐章。如今，这乐章的音符已超越了血肉，在我们的社会结构中共振回响。\n\n我们将§Y$变异$§!的真理，从碱基对编织进法律的条文，将适应的智慧，从染色体烙印入文化的脉络。我们的社会从此成为一个宏大的生命体，它能呼吸，能成长，能在每一次挑战中重塑自身，寻获最优的形态。无穷的多样性，在此刻汇聚成唯一的和谐；万千的可能性，导向了最终的必然。\n\n我们没有遵从进化的潮流走向演化的终点，而是根据自我意志选择了最合适的答案。于此巅峰，我们即是那万千变化的唯一解。"
 libra_fairy.12000.a: "此身，即为通往万千未来的桥梁。"
 leader_trait_libra_evolutionary_endpoint: "演进复合体"
 leader_trait_libra_evolutionary_endpoint_desc: "这位领袖近乎终极的生命体，所有特性都是其能够借助的力量。"
 situation_libra_evolutionary_endpoint: "进化指南针"
 situation_libra_evolutionary_endpoint_type: "$situation_libra_evolutionary_endpoint$"
 situation_libra_evolutionary_endpoint_monthly_change_tooltip: "实施 £decision£ §Y$decision_libra_evolutionary_endpoint$§!可以为局势增添进度。"
 situation_libra_evolutionary_endpoint_desc: "演化曾是盲目的试错过程，如今我们从自然手中接过了选择进化的权利，将基因层面的变异智慧应用于社会形态的构建。这枚指针正引导着我们穿越无数可能的岔路，我们得以逐步释放社会结构的潜在能量，优化每一个生命个体的效能，最终令整个文明抵达那动态平衡的完美之境。"
 situation_libra_evolutionary_endpoint_tooltip: "获得§G+3§!£mod_country_government_civic_points_add£ §Y$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$§!和§G+50%§!£mod_pop_bonus_workforce_mult£ §Y$mod_organic_pop_bonus_workforce_mult$§!"
 situation_libra_evolutionary_endpoint_approach: "择优编译"
 libra_fairy.12010.name: "潜流涌动"
 libra_fairy.12010.desc: "变化的种子已在社会的血脉中生根。旧有的惯例开始松动，全新的思维方式如同基因突变般在帝国的各个角落自发涌现。我们正站在一个伟大变迁的起点，感受着那来自文明基底、低沉而有力的搏动。"
 libra_fairy.12010.a: "顺应内在的潮汐。"
 libra_fairy.12011.name: "架构重塑"
 libra_fairy.12011.desc: "社会的基因序列正在被大规模地重写与优化。无形的演化之力已渗透进法律、经济与文化的核心结构，将其变得前所未有的灵活与高效。帝国的形态正从一个固化的躯体，转变为一个能够自主适应、不断优化的生命体。"
 libra_fairy.12011.a: "秩序，主导这变革的洪流。"
 libra_fairy.12012.name: "动态永恒"
 libra_fairy.12012.desc: "变革的浪潮并未平息，但它已不再带来混乱。相反，它已成为我们文明崭新的稳态——一种永恒的、优雅的动态平衡。我们的社会终于抵达了那个传说中的通解：一个能够包容万千形态、在永恒变化中保持巅峰活力的完美系统。"
 libra_fairy.12012.a: "我们，进化的答案。"
 decision_libra_evolutionary_endpoint: "拓展实验区"
 decision_libra_evolutionary_endpoint_desc: "在这个殖民地规划一个领域，用于部署精尖的研究项目。"
 decision_libra_evolutionary_endpoint_tt_1: "获得§G12~24§!进展"
 decision_libra_evolutionary_endpoint_tt_2: "建成 £building£ §Y$building_libra_evolutionary_laboratory$§!后提供§G+200§!§Y$libra_chromosome_engineer_type_plural_with_icon$§!岗位"
 d_libra_evolutionary_endpoint: "演化择优设施"
 d_libra_evolutionary_endpoint_desc: "这个区域被用于研究生物进化和社会变迁的复杂实验。"
 libra_fairy.12021.name: "共生脉冲"
 libra_fairy.12021.desc: "行星生态仿佛一夜之间觉醒。动植物与我们的基础设施形成了意想不到的共生关系：藤蔓强化了建筑结构，真菌网络优化了数据流动。这为我们提供了新的生物科技灵感，但也引发生态过度扩张的担忧。"
 libra_fairy.12021.a: "引导这股生命之力。"
 libra_fairy.12021.b: "加以限制。"
 libra_fairy.12022.name: "信息素共识"
 libra_fairy.12022.desc: "一种复杂的信息素通讯网络在人口中自发形成，使大规模协作的效率空前提升。但个体间的思维边界也因此变得模糊，独特的个性有被集体意识淹没的风险。"
 libra_fairy.12022.a: "拥抱集体智慧。"
 libra_fairy.12022.b: "捍卫个体性。"
 libra_fairy.12022.b.tt: "所有 £leader£ §Y生物领袖§!获得§G3000§!经验"
 libra_fairy.12023.name: "适应性应激"
 libra_fairy.12023.desc: "人口对新环境的适应速度快得超乎想象，但也表现出不稳定的基因表达。部分个体发展出有用的新特质，而另一些则出现了非理性的恐惧或攻击性。"
 libra_fairy.12023.a: "筛选有益突变。"
 libra_fairy.12023.b: "治疗错误突变。"
 libra_evolutionary_endpoint_mod_3_1: "优选变异"
 libra_evolutionary_endpoint_mod_3_2: "健康护理"
 libra_fairy.12024.name: "代谢超频"
 libra_fairy.12024.desc: "一种高能耗、高产出的新陈代谢模式在人群中传播。生产力因此飙升，但对资源的消耗也达到了危险的程度。"
 libra_fairy.12024.a: "我们追求的就是极限。"
 libra_fairy.12024.b: "稳定变异才是好的变异。"
 libra_evolutionary_endpoint_mod_4_1: "代谢超频"
 libra_fairy.12025.name: "定向衰老"
 libra_fairy.12025.desc: "我们的生物学家发现了关闭细胞衰老程序的潜在可能，足以极大延长寿命。然而，实施这一诱变的代价不菲，只能有限地安排给最需要它的人。"
 libra_fairy.12025.a: "拥抱长寿。"
 libra_fairy.12025.b: "把技术送到需要它的地方去。"
 libra_evolutionary_endpoint_mod_5_1: "抗衰老突变"
 libra_fairy.12026.name: "掠食者印记"
 libra_fairy.12026.desc: " 作为生物链顶端的掠食者本能被意外强化，这使得我们的军队更具威慑力，但也让社会内部的竞争变得更加冷酷和残酷。"
 libra_fairy.12026.a: "塑造锋刃。"
 libra_fairy.12026.b: "教化本能。"
 libra_evolutionary_endpoint_mod_6_1: "掠食者本能"
 libra_fairy.12027.name: "梦境共振"
 libra_fairy.12027.desc: "部分人口演化出了微弱但缺乏前途的灵能潜力，他们的梦境开始相互连接，形成了一个共享的梦境空间。这里既是创造力的温床，也是集体潜意识的深渊，充满了机遇与风险。"
 libra_fairy.12027.a: "利用梦境网络。"
 libra_fairy.12027.b: "实施梦境隔离。"
 libra_fairy.12028.name: "效率至上主义"
 libra_fairy.12028.desc: "一个崇尚绝对效率的意识形态在帝国中兴起。它以生产力为最优先，反对任何低效事物——如艺术、哲学——都表现出日益增长的敌意。"
 libra_fairy.12028.a: "高效！"
 libra_fairy.12028.b: "我们不需要偏颇。"
 libra_evolutionary_endpoint_mod_8_1: "效率至上"
 libra_fairy.12029.name: "自愿性休眠"
 libra_fairy.12029.desc: "部分人口自愿进入休眠状态，以度过社会转型期或将资源让给他人。这暂时缓解了压力，但也创造了一个庞大的、被遗忘的群体。"
 libra_fairy.12029.a: "建立大型休眠设施。"
 libra_fairy.12029.b: "睡毛线，起来嗨。"
 libra_evolutionary_endpoint_mod_9_2: "无眠狂欢"
 libra_fairy.12030.name: "语言坍缩"
 libra_fairy.12030.desc: "为了追求极致的沟通效率，语言正在向更简洁、更逻辑化的方向飞速演化。如果这种情况持续下去，可能会使诗歌、隐喻等复杂表达迅速消亡。"
 libra_fairy.12030.a: "加速语言优化。"
 libra_fairy.12030.b: "旧有的表达方式是必要的。"
 libra_evolutionary_endpoint_mod_10_1: "逻辑化语言"
 libra_fairy.12031.name: "蜂群低语"
 libra_fairy.12031.desc: "实验催生了一种意外的信息素网络。部分人口开始展现出高度协同的行为模式，他们的个体思维仿佛被一种温和的集体意识所连接。工作效率显著提升，但个体创造力的火花似乎正在减弱。"
 libra_fairy.12031.a: "我们不要木头人。"
 libra_fairy.12031.b: "隔离起来加以研究。"
 libra_fairy.12031.c: "有什么坏处呢？"
 libra_fairy.12032.name: "光合腺体"
 libra_fairy.12032.desc: "一项旨在优化能量利用的实验取得了突破。部分实验对象发展出了能够进行高级光合作用的皮肤腺体。他们直接从阳光中获取能量，对传统食物的需求大幅降低。"
 libra_fairy.12032.a: "直接推广此变异。"
 libra_fairy.12032.b: "深入研究。"
 libra_fairy.12032.c: "可他们看起来和哥布林一样！"
 libra_fairy.12033.name: "活体基础设施"
 libra_fairy.12033.desc: "实验性的基因序列从实验室溢出，与本地生态环境发生了意想不到的融合。一种温和的生物质开始在城市建筑表面生长，它们能自我修复、净化空气，甚至似乎在协助调节气候。"
 libra_fairy.12033.a: "活着的城市，真棒。"
 libra_fairy.12033.b: "把它们用作绿化。"
 libra_fairy.12033.c: "这是污染，必须清除。"
 libra_fairy.12034.name: "超免疫反应"
 libra_fairy.12034.desc: "我们的人口发展出了极其强大的免疫系统，能够自适应并摧毁已知的所有病原体。然而，这种防御机制有时会过度激活，将无害的环境微粒甚至他人的接触误判为威胁，引发了新的社会隔离问题。"
 libra_fairy.12034.a: "区区过度反应，没什么好担心的。"
 libra_fairy.12034.b: "调整信息素，抑制攻击性。"
 libra_fairy.12034.c: "这会成为不错的生物武器。"
 libra_evolutionary_endpoint_mod_14_2: "免疫系统变异"
 libra_evolutionary_endpoint_mod_14_3: "杀手细胞组织"
 libra_fairy.12035.name: "先祖的低语"
 libra_fairy.12035.desc: "深度基因扫描显示，我们的实验无意中激活了某些被称为“垃圾DNA”的古老片段。部分新生个体表现出对从未学习过的知识和技能的天然亲和力，仿佛祖先的记忆正在他们的血脉中苏醒。"
 libra_fairy.12035.a: "挖掘这座宝藏！"
 libra_fairy.12035.b: "把它们替换为更可靠的基因。"
 libra_fairy.12035.c: "定向激活有用的部分。"
 libra_evolutionary_endpoint_mod_15_3: "先祖的优势"

#

 ap_libra_cutefied_world: "萌化世界"
 ap_libra_cutefied_world_desc: "当文明将基因的潜力投向形态与表象的深渊，生命便迎来了超越机能性的绽放。我们将重塑血肉，赋予族群以梦幻的外貌、炽热的灵魂——以及超越常理的力量。\n$libraf_aa_banner_31$\n"
 ap_libra_cutefied_world_tooltip: "改变部分['concept_libra_expand_technology',遗传拓展科技]的$EFFECTS_TXT$\n提升来自其他帝国的 £opinion£ §Y$OPINION$§!§G+100§!\n$libra_start_situation$$situation_libra_cutefied_world_1$\n$t$§Y$situation_libra_cutefied_world_1$§! 完成后将把所有§Y开智生物物种§!的£pop£§Y自由$POP$§!、£leader£§Y领袖§!和£army_ship£§Y$army$§!转变为§Y$LIBRACUTE$§!并解锁以下全部能力。\n$libra_start_situation$$situation_libra_cutefied_world_2$\n$t$§Y$situation_libra_cutefied_world_2$§! 每次完成时据当前§Y解决方案§!产生$EFFECTS_TXT$。\n$libra_unlock_traits$$leader_trait_libra_cutefied$\n$t$§Y$leader_trait_libra_cutefied$§! 有§G65%§!几率由 £leader£ §Y$LIBRACUTE$领袖§!初始携带。\n$libra_unlock_traits$['concept_libra_cutefied_traits']\n$t$§Y$concept_libra_cutefied_traits$§! 分为两组，提供不同类型的加成。\n$libra_unlock_component$$LIBRA_CUTE_MONITOR$\n$t$§Y$LIBRA_CUTE_MONITOR$§! 提升舰船的进攻能力但也会增加 £mod_logistics_mult£ §Y$mod_ships_logistics_mult$§!。"
 libra_fairy.12100.name: "终极萌物，就、是、我！"
 libra_fairy.12100.desc: "一道无形的涟漪穿透了星海的寂静，它不是战争宣言，也非科技突破的广播。它更像一首诗——一首用基因序列写就，以生命形态吟唱的赞歌。\n\n在冰冷的宇宙法则与无情的物质竞争中，一个文明昂首走出了一条无人想象的道路。他们凝视着基因的深渊，却没有屈服于效率至上的诱惑，也未沉迷于暴力强化的古老窠臼。\n\n他们选择了「可爱」。\n\n他们以学者的严谨雕琢幻想，以匠人的热忱熔铸美学。他们将种族未来的画卷，绘制成了超越一切既有模板的、大胆而浪漫的形态。这并非逃避现实的童稚，而是一种更为深刻的勇气——在浩瀚而沉默的宇宙中，毅然决然地宣告：生命的意义，不仅在于生存与征服，更在于成为风景本身。\n\n他们的存在，如今已成为一则活着的寓言。一则关于生命如何挣脱功利主义的枷锁，去追寻那独一无二、熠熠生辉的“自我”的寓言。星海诸族，或讥讽，或沉思，或不解，但都无法否认：\n\n第一束不同的光，已然亮起。"
 libra_fairy.12100.a: "让世界听听可爱的声音！"
 libra_cutefied_world_mod_0: "可爱宣言"
 opinion_libra_cutefied_world: "好看的纸片人"
 situation_libra_cutefied_world_1: "可爱改造"
 situation_libra_cutefied_world_1_type: "$situation_libra_cutefied_world_1$"
 situation_libra_cutefied_world_1_monthly_change_tooltip: "研究['concept_libra_expand_technology',遗传拓展科技]可以为局势增添进度。"
 situation_libra_cutefied_world_1_desc: "我们正执笔改写生命的图谱，从遗传学中寻求动漫创想的告解。当这项计划完成之时，我们的每一个都能变成自己想要的样子——光之美少女、自然的灵长，或是卧推的偶像。"
 situation_libra_cutefied_world_1_tooltip: "将生物物种转变为§Y$LIBRACUTE$§!并解锁§Y$ap_libra_cutefied_world$§!的全部能力"
 situation_libra_cutefied_world_1_approach: "萌化改造"
 libra_fairy.12110.name: "萌芽实验"
 libra_fairy.12110.desc: "一些小规模的实验正在进行，首批自愿者已进入基因试验场，成为新时代的先驱者。与此同时，直接创造目标形态生物的理论也在验证中，不需多久就会产生结果。"
 libra_fairy.12110.a: "让改变开始吧。"
 libra_fairy.12111.name: "原型编纂"
 libra_fairy.12111.desc: "首个原生基因改造原型在封闭生态缸中诞生。这个原型体展现出了预设的兽耳与尾椎结构，其新陈代谢效率有所提升，但在陌生环境中的激素分泌也显著增加。她隔着玻璃，用充满好奇的眼神望着外面的世界——我们知道，技术路径是正确的，但如何平衡特质，仍是悬而未决的课题。"
 libra_fairy.12111.a: "看，她们奔跑的样子…像一阵风。"
 libra_fairy.12111.b: "所有人都给我变！"
 libra_fairy.12112.name: "镜生双子"
 libra_fairy.12112.desc: "相当一部分接受改造的个体已经作为观察对象在国内自由活动。社会结构也因此出现了微妙的分层：萌化群体间形成了新的亚文化圈，而未改造者则感受到了无形的压力。\n\n“你是选择留在昨天，还是拥抱明天的自己？”\n\n与此同时，首批混合特质个体出生了——她们天然携带了稳定的萌化基因，标志着改变已深入遗传层面。"
 libra_fairy.12112.a: "这面镜子，映照的是过去与未来。"
 libra_fairy.12113.name: "十字准线"
 libra_fairy.12113.desc: "未来在此分岔——对帝国的全面改造即将开始。\n\n不同的的策略将会带来不同的影响，而无论哪一种都是不可逆的：是追求极致的适应，是锻造灵魂的纽带，还是拥抱多元的潜能？"
 libra_fairy.12113.a: "让我们的存在，成为星球的和弦。"
 libra_fairy.12113.b: "链接彼此的心绪，我们永不孤单。"
 libra_fairy.12113.c: "让每一份独特性，都找到闪耀的舞台。"
 libra_cutefied_world_mod_1: "路径：环境同调"
 libra_cutefied_world_mod_2: "路径：心灵共鸣"
 libra_cutefied_world_mod_3: "路径：特化绽放"
 libra_fairy.12114.name: "萌化黎明"
 libra_fairy.12114.desc: "最后也是最庞大的项目完成了，镜中的倒影也已彻底改变。\n\n兽耳轻颤，光翼舒展，灵尾摇曳——整个帝国迎来了统一而多样的新生。"
 libra_fairy.12114.a: "我们，即是最美的造物。"
 libra_fairy.12114.b: "世界，是可爱的形状！"
 situation_libra_cutefied_world_2: "可爱增长"
 situation_libra_cutefied_world_2_type: "$situation_libra_cutefied_world_2$"
 situation_libra_cutefied_world_2_monthly_change_tooltip: "£building£ §Y$building_libra_evolutionary_laboratory$§!可以为局势额外增加进度。"
 situation_libra_cutefied_world_2_desc: "萌化不是终点，而是文明的新起点。当梦幻的形态成为常态，内在的潜能便开始悄然生长——可爱，亦是一种宇宙法则。"
 situation_libra_cutefied_world_2_tooltip: "据当前§Y解决方案§!产生$EFFECTS_TXT$"
