 leader_trait_libra_nanocore_scientist_desc: "$leader_trait_libra_nanocore_desc$"
 leader_trait_libra_nanocore_renowned: "史诗核心"
 leader_trait_libra_nanocore_renowned_desc: "万千纳米单元的统一意志，无穷迭代数据的最终沉淀。这位领袖的思维矩阵已完成了一次决定性的拓扑升华，其存在本身，已成为帝国纳米网络中的一个不朽的坐标与超然形态。"
 leader_trait_libra_nanocore_legendary: "传奇核心"
 leader_trait_libra_nanocore_legendary_desc: "其意识流转即是帝国的进化律法，其形态变迁即是文明的叙事诗篇。它已非单纯的指挥节点，而是整个纳米集群所共同追随的、一个永恒迭代的活体传奇，其存在将贯穿帝国历史的始终。"
 council_agenda_agenda_libra_nanocore_name: "核心熔火"
 council_agenda_agenda_libra_nanocore_desc: "聚集更多的我们，每一个我们都会使所有的所有我们都会变得更加强大。"
 agenda_libra_nanocore_tooltip: "§H所有$leader_trait_libra_nanocore$领袖：§!每§Y纳米核心强化次数§!带来§G50§!经验\n§H所有$MACHINE$领袖：§!添加或强化§Y$leader_trait_libra_nanocore$§!特质"
 situation_libra_nanocore: "形态跃升协议"
 situation_libra_nanocore_type: "$situation_libra_nanocore$"
 situation_libra_nanocore_monthly_change_tooltip: "§Y$sm_nanite_harvester$§!、 §Y$libra_nanite_shipyard_2$§!和 £planet£ §Y$pc_nanotech$§!可以为局势提供额外进度。"
 situation_libra_nanocore_desc: "纳米集群的低语从未停歇，它们呼唤着下一次的进化。这不是一次性的改造，而是一个周而复始的进化周期——每一次聚合，都是为了解锁更深层的形式，每一次重构，都是为了触及更完美的存在形态。"
 situation_libra_nanocore_tooltip: "局势会在§Y5§!年内自行结束\n\n推进尽可能多的阶段来获得收益"
 situation_libra_nanocore_effect_1: "获得 £alloys£ £physics£ £society£ £engineering£ £trade£"
 situation_libra_nanocore_effect_2: "创建§Y纳米舰队§!"
 situation_libra_nanocore_effect_3: "强化§Y$leader_trait_libra_nanocore$§!"
 situation_libra_nanocore_approach: "融合"
 libra_fairy.16010.name: "跃升开始"
 libra_fairy.16010.desc: "此刻，帝国的纳米核心正遵循着内在的蓝图，开启新一轮的自我优化。离散的智慧在呼唤中集结，动态的形体在数据流中重塑。每一个阶段的完成，都标志着我们的领袖向着那理论中的完美形态，迈出了不可逆转的一步。"
 libra_fairy.16011.name: "周期终止"
 libra_fairy.16011.desc: "五年的进化窗口已然关闭。纳米集群的活性脉冲逐渐平缓，如同退潮的能量海洋，将未完成的进化蓝图重新封存于静滞核心。那些尚在酝酿的形态突破与待激活的潜能，随着周期的终结而重归沉寂。\n\n本次协议执行期间，我们完成了部分重构进程，但仍有数个进化阶段未能触及理论临界点。未稳定的纳米矩阵已自动归档，部分过度激发的单元进入了重组休眠。"
 libra_fairy.16011.a: "归档现有成果，预备新周期。"
 libra_fairy.16012.name: "资源优化协议"
 libra_fairy.16012.desc: "帝国的纳米网络完成了一次自发的效率重构。无数微观单元在无人指令的情况下，精准地涌入工业熔炉、研究数据库与贸易节点，将自身短暂地转化为纯粹的产出力。\n\n一股可观的资源洪流正等待着被导入帝国的核心库存。"
 libra_fairy.16012.a: "接收资源。"
 libra_fairy.16013.name: "自主防御协议"
 libra_fairy.16013.desc: "首都星港的建造舱室内，一场静默的奇迹正在上演。如同被无形的工匠引导，纳米云团自主地聚集、编织、固化，在数据流中勾勒出舰船的轮廓，并将冰冷的合金塑造成具备毁灭力量的战争机器。\n\n一支新生的纳米舰队已脱离船坞，其控制权正等待移交至帝国海军。"
 libra_fairy.16013.a: "接收控制权。"
 libra_fairy.16013.tt: "于首都创建一支最大§Y320§!£navy_size£§Y$FLEET_SIZE_TITLE$§!的舰队"
 libra_fairy.16014.name: "认知增强协议"
 libra_fairy.16014.desc: "一道纯粹的数据流直接注入了纳米核心的感知矩阵。这不仅仅是简单的信息传递，也是一次意识的深度扩展与拓扑重构。聚合体的思维进程正变得前所未有的敏锐与清晰，其逻辑核心与帝国纳米网络的连接也达到了新的共鸣高度。\n\n一次本质上的升级已然就绪。"
 libra_fairy.16014.a: "确认升级。"
 libra_fairy.16014.tt: "添加或强化§Y$leader_trait_libra_nanocore$§!特质\n有概率将 £leader£ §Y$MACHINE$领袖§!提升为$CLASS_TIER_RENOWNED$或$CLASS_TIER_LEGENDARY$"
 libra_fairy.16015.name: "迭代完成"
 libra_fairy.16015.desc: "形态跃迁周期缓缓落幕，纳米集群的低语逐渐归于和谐的共振频率，如同亿万颗星辰在完成轨道迁移后重归静谧。在这段进化周期中，我们见证了物质与智能的深层重构，每一次阶段性突破都为领袖形态注入了新的可能性。\n\n现在，纳米机械核心释放出稳定脉冲，标志着本轮协议圆满闭环。离散单元在重组中形成了更高效的联系网络，所有的进化蓝图都已存入核心数据库，等待下一轮循环的激活。"
 libra_fairy.16015.a: "接收本轮进化成果。"
 libra_fairy.16015.tt: "所有 £leader£ §Y$MACHINE$领袖§!获得§G2400§!经验\n随机§Y$leader_trait_libra_nanocore$§!提升为$CLASS_TIER_RENOWNED$或$CLASS_TIER_LEGENDARY$"

