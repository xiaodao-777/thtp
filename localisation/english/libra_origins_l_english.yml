 libra_origin.0519.name: "The Vampyre"
 libra_origin.0519.desc: "We put a dark curtain over the endless day\nWe bring eternal peace to the restless mind.\n\nRed pupils, pointed ears, sharp teeth, sharp claws, spell marks ...... We carry all our merits and rewards and sins and punishments, crossing the river of time from myth and legend to the present day.\n\nWhat we chase will eventually be hard to get rid of us; what we covet can no longer be denied to us; and what we delight in will never turn away from us.\n\nNow,\n\n we can enjoy the sunrise in the sunshine after a long time."
 libra_origin.0519.a: "Silence without words."
 libra_origin.0519.b: "Raise a glass and celebrate."
