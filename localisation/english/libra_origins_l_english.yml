 tr_libra_dragonlight_2_delayed: "Enhance strength in harmony and achieve longevity in harmony."
 tr_libra_dragonlight_3: "Dragon's Heart"
 tr_libra_dragonlight_3_delayed: "Blood is like the cycle of life, the blood of the void is always in the world."
 tr_libra_dragonlight_3_desc: "$tr_libra_dragondark_4_desc$"
 libra_origin.0750.name: "The Dragon Wears Armor"
 libra_origin.0750.desc: "As the world changed from old to new, our proud scales became weak and broken for a time: the regular pulsation of scales, which had helped our ancestors bounce back from many blows, in this universe greatly weakened their protection, making them difficult to withstand the impact of high-energy rays, causing fatal defects. Natural selection solved this problem by passively degrading our scales, but until now, the feature called "dragon scale" has remained on our bodies.\n\nWith the effort, we should be able to restore our strongest defenses.\nNow we know what to do."
 libra_origin.0750.a: "Indestructible."
 libra_origin.0750.b: "More on that later."
 tr_libra_dragonlight_4: "Life cycle"
 tr_libra_dragonlight_4_delayed: "Where the laws of the past drove our ancestors to the brink of destruction, now we draw strength from the world."
 tr_libra_dragonlight_4_desc: "§Y$d_libra_dragonborn$§! provides §G+3%§!£mod_founder_species_growth_mult£ §Y$concept_founder_species_growth_mult$§!"
 tr_libra_dragonlight_5: "Crack The World"
 tr_libra_dragonlight_5_delayed: "A thousand feet below the land, a thousand miles above the stars, the universe is in our hands."
 tr_libra_dragonlight_5_desc: "Every  £mod_country_starbase_capacity_add£ $STARBASE_CAPACITY_TITLE$:\n$t$$MOD_COUNTRY_EDICT_FUND_ADD$: §G+8§!\nEvery £mod_country_starbase_capacity_add£ $STARBASE_CAPACITY_TITLE$ that has been used:\n$t$$MOD_COUNTRY_NAVAL_CAP_ADD$: §G+8§!"
 tradition_libra_dragondark: "Gloom"
 tradition_libra_dragondark_desc: "In the curtain, the dragon whipped up the eternal storm."
 tradition_libra_dragondark_adopt_desc: "$tradition_libra_dragondark_desc$$libraf_tr_banner_54$"
 council_agenda_agenda_libra_dragondark_name: "Dragon's Fury"
 council_agenda_agenda_libra_dragondark_desc: "Dragon angers, starlight pale; Thousand miles away, the dragon exhausts."
 agenda_libra_dragondark_finish_modifier: "$council_agenda_agenda_libra_dragondark_name$ Agenda"
 tr_libra_dragondark_adopt: "Gloom Tradition"
 tr_libra_dragondark_finish: "Gloom Tradition Finished"
 tr_libra_dragondark_1: "Displacement"
 tr_libra_dragondark_1_delayed: "No matter how steep a mountain may be, it will fall apart when it stands in our way."
 tr_libra_dragondark_1_desc: "§Y$d_libra_dragonborn$§! provides §G+200§![soldier.GetIcon] §Y[soldier.GetNamePlural]§! Jobs"
 libra_origin.0751.name: "Dragon Blood Flows"
 libra_origin.0751.desc: "There was once a special substance that flowed through our veins like blood, enhancing all our abilities. In adapting to the new world, we were forced to abandon it, becoming weak and pitiful.\n\nNow we have found it - §Y$sr_living_metal$§!."
 libra_origin.0751.a: "Take it back."
 libra_origin.0751.b: "We'll deal with this later."
 tr_libra_dragondark_2: "Dragon Perception"
 tr_libra_dragondark_2_delayed: "We realize, and we know very well, what all these illusions really are."
 tr_libra_dragondark_3: "Countercurrent"
 tr_libra_dragondark_3_delayed: "The law is arbitrarily twisted, because we are here, and all natural or artificial matter and energy will eventually be used by us."
 tr_libra_dragondark_3_desc:"Every £mod_country_naval_cap_add£ $MOD_COUNTRY_NAVAL_CAP_ADD$ that has been used:\n$t$$mod_country_traditions_energy_produces_add$: §G+0.30§!\n$t$$mod_country_traditions_alloys_produces_add$: §G+0.10§!"
 tr_libra_dragondark_4: "Dragon Eyes"
 tr_libra_dragondark_4_delayed: "In front of us, all intrigues and tricks will be exposed."
 tr_libra_dragondark_4_desc: "§Y$leader_trait_libra_dragonborn$§! open §G+1§! ceiling"
 tr_libra_dragondark_5: "Star Vision"
 tr_libra_dragondark_5_delayed: "Heaven and earth trembled at the return of the giant dragon."
 libra_origin.0725.name: "A Rite Of Passage"
 libra_origin.0725.desc: "With the progress of science and technology and the development of society, our understanding of the past has gradually deepened, and the once-rare ethnic groups have gradually grown, and the first batch of individuals who have returned to too little are also thriving.\nAll of us are waiting for the day of ascension."
 libra_origin.0725.tooltip: "After researching £engineering_research£ §Y$tech_battleships$§! or £society£ §Y$tech_stingers$§! technology, unlock §Y$libra_dragonborn_medium$§!"
 libra_origin.0726.name: "Driven By Life"
 libra_origin.0726.desc: "Regeneration is the instinct of most living things, and we should be able to restore it, too, if we invest resources in research."
 libra_origin.0726.a: "Is there anything we can't do?"
 libra_origin.0727.name: "The Will Of The End"
 libra_origin.0727.desc: "Since the birth of the first First Ancestors, only a few dragons have reached the pinnacle of existence, and this opportunity is now before us.\nRevival was once the goal we pursued, and promotion is always our unchanging destiny."
 libra_origin.0727.tooltip: "After researching £engineering_research£ §Y$tech_titans$§! or £society£ §Y$tech_biogenesis_titans$§! technology, unlock §Y$libra_dragonborn_large$§!"
 libra_origin.0730.name: "Ultimate Design"
 libra_origin.0730.desc: "As it turns out, the existence of the Void Dragon itself is perfect, and we have faced numerous challenges over time, but in the end, we have survived one crisis after another with our own strengths.\n\nOur prosperity will never be broken."
 libra_origin.0730.tooltip: "Replace ['trait:trait_libra_dragonborn_0'] with ['trait:trait_libra_dragonborn_6']"
 libra_origin.0731.name: "$ap_mind_over_matter$"
 libra_origin.0731.desc: "We have great power and have extended our claws to the void for further power.\n\nNow, with our psionic powers, we are invincible."
 libra_origin.0731.a.tooltip: "Replace ['trait:trait_libra_dragonborn_0'] with ['trait:trait_libra_dragonborn_4']"
 libra_origin.0731.b.tooltip: "['trait:trait_exd'] species acquisition ['trait:trait_libra_dragonborn_5'] trait"
 libra_origin.0732.name: "$ap_engineered_evolution$"
 libra_origin.0732.desc: "We have adapted to this universe with billions of years of natural evolution, but the design of evolution is not absolute.\n\nAfter fully mastering the secrets of genes, we can actively modify and eliminate unnecessary DNA fragments to achieve true perfection."
 libra_origin.0732.tooltip: "Replace ['trait:trait_libra_dragonborn_0'] with ['trait:trait_libra_dragonborn_1']"
 libra_origin.0733.name: "$ap_synthetic_evolution$"
 libra_origin.0733.desc: "Passive adaptive evolution is proof of a flaw, and now we solve the problem once and for all with synthesis.\n\nWe have enough technology and ability to make our metal bodies also have powerful breath and tough scales."
 libra_origin.0733.tooltip: "Replace ['trait:trait_libra_dragonborn_0'] with ['trait:trait_libra_dragonborn_3']"
 libra_origin.0734.name: "$ap_the_flesh_is_weak$"
 libra_origin.0734.desc: "The ups and downs of history make us realize our own shortcomings, and the changes in the situation make us choose implants to improve ourselves.\n\nCombined with flesh and metal, our majestic figure grows."
 libra_origin.0734.tooltip: "Replace ['trait:trait_libra_dragonborn_0'] with ['trait:trait_libra_dragonborn_2']"
 libra_origin.0736.name: "Dragon Fire"
 libra_origin.0736.desc: "Dragon's breath has always been the biggest symbol of the dragon. For other species, it is a symbol of terror and destruction, a sign of man-made disaster, but for us it is as normal as breathing.\n\nAfter reaching the limits of existence, the ordinary dragon's breath can no longer meet our needs, and we need and can obtain greater power."
 libra_origin.0736.a: "Nothing is beyond our grasp."
 libra_origin.0736.a.tt: "Gain all available research options and conclude the event chain."
 libra_origin.0736.b: "Scorch enemies with energy."
 libra_origin.0736.c: "Annihilate targets in explosions."
 libra_origin.0736.d: "Demonstrate pure physical power."
 libra_origin.0736.e: "Recreate the ultimate defense."
 libra_origin.0736.f: "We are not yet prepared."
 libra_origin.0737.name: "Dragons' Possibilities"
 libra_origin.0737.desc: "Having reclaimed fragments of our past power and spent time adapting to them, we can now take the second step: discovering more possibilities, ultimately to reach perfection."
 libra_origin.0737.a: "Enhance energy projection."
 libra_origin.0737.b: "Enhance arcane abilities."
 libra_origin.0737.c: "Enhance physical strength."
 libra_origin.0737.d: "Enhance bodily structure."
 libra_origin.0737.e: "We need more time."
 libra_origin.0738.name: "Draconic Might"
 libra_origin.0738.desc: "Adapting to the world and reclaiming our past has brought us back to our peak. The dragons now have the opportunity to compensate for weaknesses or expand capabilities - the time to choose has come."
 libra_origin.0738.a: "Melt all things with dragonfire."
 libra_origin.0738.b: "Dissolve worlds with our breath."
 libra_origin.0738.c: "Rend the void with our claws."
 libra_origin.0738.d: "Crush planets with our bodies."
 libra_origin.0738.e: "Our power is still insufficient."
 libra_origin.0739.name: "Final Reflection"
 libra_origin.0739.desc: "The great dragonborn reexamines their shortcomings and rediscovers skills that should never have been forgotten. This is the best and final opportunity - the next chance like this may not come for dozens of epochs.\n\nWhat have we found as a result?"
 libra_origin.0739.a: "Ultimate energy manipulation."
 libra_origin.0739.b: "Primordial and savage instinct."
 libra_origin.0739.c: "Power beyond physical limits."
 libra_origin.0739.d: "Defense as eternal as stillness."
 libra_origin.0739.e: "We never truly adapted to this world."

# paradox loop

 origin_libra_paradox_loop: "Paradox Loop"
 origin_libra_paradox_loop_text: "The abundant power resources of the home planet provide ample energy for this mechanical intelligence, allowing them considerable room to explore the secrets of technology. While intense computing operations often lead to malfunctions that leave the unit in a loop or downtime, recent breakthroughs in synergistic algorithmic technology have nearly solved this problem."
 origin_libra_paradox_loop_desc: "$origin_libra_paradox_loop_text$\n$libraf_or_banner_8$"
 origin_libra_paradox_loop_effects: "- $ADDITIONAL_TECHNOLOGIES_STRING$ £engineering_research£ ['technology:tech_mine_betharian']\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £engineering_research£ ['technology:tech_mineral_purification_1']\n- $councilor_gestalt_cognitive$ $TRAIT_TITLE$: §Y$leader_trait_maniacal_machine$§!\n- $SPECIES_TRAITS$ ['trait:trait_libra_paradox_loop']\n- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_paradox_processor']\n- $STARTING_PLANET$\n$t$- ['concept_libra_paradox_loop_infrastructure']\n$t$- $PLANETARY_FEATURES$ §Y$d_betharian_deposit$§!\n- $libra_policy$\n$t$- §Y$policy_libra_paradox_loop_a$§!, increases £job£ §Y$JOBS_TITLE$§! research output in designated fields\n$t$- §Y$policy_libra_paradox_loop_b$§!, improves the output and upkeep of £job_researcher£ §Y$job_calculator$§!"
 START_SCREEN_LIBRA_PARADOX_LOOP: "As early as [this.GetHomeWorldName] was led by our organic creator, it was an exceptionally rich planet, and the abundance of resources enabled the rapid development of science and culture, and ushered in the birth of [this.GetSpeciesName].\n\nLike the organic masters of the time, [this.GetName] was able to invest nearly unlimited resources in technology, programming a wide variety of functions to solve a multitude of problems. However, it was not long between the birth of [this.GetSpeciesName] and the end of the Creator Era, and we were forced to call upon underdeveloped algorithms to continue our research operations. Due to the scarcity of semi-individuals, the hypothesis-experimentation paradigm of [this.GetName] was quite rigid, and errors were frequent, so that for dozens of years the hypothesis-experimentation model of [this.GetName] was quite rigid, and errors were frequent, so that for dozens of times the hypothesis-experimentation model was quite rigid, and errors were frequent. The hypothesis-experiment paradigm is quite solidified due to the scarcity of semi-individuals, and errors of all sorts are so frequent that dozens of cycles have been devoted to studying the same topics without resolution.\n\nToday, the technology model of [this.GetName] has been effectively modified to operate steadily, and [this.GetSpeciesName] can finally bring the scanning device up close to the stars and analyze the theory of distant worlds."
