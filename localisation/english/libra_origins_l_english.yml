 civic_libra_eden_accord_a: "Bionic Elite"
 civic_libra_eden_accord_a_desc: "For a long time, this mechanical intelligence has drawn knowledge from its creators, acting like sentient beings. This habit has not changed, even as they venture into the stars.\n$libraf_oc_banner_9$"
