 START_SCREEN_LIBRA_SHADOW_CONSCIOUSNESS: "[This.GetSpeciesName]'s history is a pursuit of darkness. Even in the distant past when scattered across [this.GetHomeWorldName] as minor hives, they instinctively sought shadows - consuming dark matter.\n\nDarkness brings tranquility, synchronizes our minds, provides energy, and enabled survival against countless predators. Now clad in night's mantle, we vanquish former threats.\n\nWith FTL technology, [this.GetSpeciesName] finally embraces the void's embrace."
