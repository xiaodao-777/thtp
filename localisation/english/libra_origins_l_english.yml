 origin_libra_dragonborn: "Dragonborn"
 origin_libra_dragonborn_text: "The remnant of the ancient world, the last descendant of the Void dragon. The collapse of the universe failed to knock it down, the outbreak of new stars failed to make it perish, but after all, it is not the inhabitants of this world, and there is no place for them in the newborn Milky Way. After billions of years of adaptation and evolution, they finally made a comeback."
 origin_libra_dragonborn_desc: "$origin_libra_dragonborn_text$\n$libraf_or_banner_7$"
 origin_libra_dragonborn_effects: "- $libra_start_leader_string$§G+6§!\n- $libra_start_fleet_string$Replace with §G2§!£military_ship£§Y$libra_dragonborn_small$§!\n- $libra_traditions$['concept_libra_dragonborn_tradition']\n- $libra_country_modifier$['concept_origin_libra_dragonborn_effect']\n- $SPECIES_TRAITS$ ['trait:trait_libra_dragonborn_0']\n- $STARTING_PLANET$\n$t$- $libra_planetsize$27\n$t$- $PLANETARY_FEATURES$ ['concept_d_libra_dragonborn_home']\n- $HOME_SYSTEM$ ['concept_arc_site_libra_dragonborn'] ['concept_archaeology_site']\n- $libra_extra_council_position$['concept_councilor_libra_dragonborn']"
