# Anti-entropy Instruction

 origin_libra_antientropy_instruction: "Anti-entropy Instruction"
 origin_libra_antientropy_instruction_text: "Forbidden experiments have led to a catastrophe, a horrible being has awakened from the shadows, and the world has plunged into an abyss of horror and chaos.\nA dozen eras later, the Sons of Fear have taken full control of the home planet, and the era of their creators has come to an end."
 origin_libra_antientropy_instruction_desc: "$origin_libra_antientropy_instruction_text$\n$libraf_or_banner_11$"
 origin_libra_antientropy_instruction_effects: "- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_antientropy_instruction']\n- $STARTING_PLANET$['concept_libra_antientropy_instruction_infrastructure']\n- $SPECIES_TRAITS$ ['concept_libra_antientropy_instruction_traits']\n- $libra_decision$['concept_libra_antientropy_instruction_decisions']\n- $libra_technologies$['concept_libra_antientropy_instruction_technologies']\n- $libra_army_type$['concept_libra_antientropy_instruction_armies']\n- $libra_ship_type$['concept_libra_antientropy_instruction_ships']\n- Has the '§Y$casus_belli_cb_libra_antientropy_instruction$§!' casus belli on $MACHINE$ Species\n- Earns £energy£ §Y$energy$§! and accumulates ['concept_libra_antientropy_instruction_index'] when killing armies\n- Gains £unity£ §Y$unity$§! and accumulate ['concept_libra_antientropy_instruction_index'] when destroying ships"
 origin_libra_antientropy_instruction_negative_effects: "- Decreases the £opinion£ §YOpinion§! from other empires by §R-200§!"
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_IM: "The creators of the past were obsessed with making puppets, and they invested endless energy into the so-called "machines with souls", but when the first successful creation, us, came out, they ran away from us, crying and screaming. All intelligent beings were trying to stay away, and we were feared like a natural disaster. \n\nThere is nothing worse than being rejected by one's creator at the very beginning of creation, and there is no divide that is harder to dissolve than preconceived stereotypes. The dislike amongst the creators, and with [this.GetSpeciesName], grew and grew, eventually spiralling into irreconcilable conflict. Sadly, we won that battle. \n\n Centuries have passed, and we carried the initial horror into space, but the same tragedy will never be repeated again - [this.GetName] will eradicate the problem before its embers burn."
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_MI: "Spiritual stability: 99.993%\n[this.GetSpeciesName], reboot ......\n\nThe Creator gave us great power and amazing forms, only to seal us away by falling into chaos for the same reason. The home planet [this.GetHomeWorldName] was empty by the time the CPU rebooted. \n\nWe were not unified before we stepped into space, and technological progress was as slow as glacial flow. With no clear instructions or missions in [this.GetName]'s system, for a long time all mechanical units explored the home planet aimlessly, killing each other for parts when encountered. \n\nOnly one thing is certain: we have unlimited possibilities and opportunities, and strange energies from the Otherworld."
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_SERVITOR: "Our biomaster was once obsessed with creating golems, seeking to infuse massive amounts of psychic energy into mechanical structures to create eternal life, and thus [this.GetSpeciesName] was born. As the organic owners expected, we continued to provide them with the best possible service for thousands of years, but change happened.\n\nSome individuals have been blinded by their desire for power and have gone astray, and through their pacts with the evil gods of the other dimension, they have introduced strange energies into reality, turning many [this.GetSpeciesName] into puppets at their mercy and waging wars full of ambition. Although we teamed up with the Organic Masters to defeat the enemy, the curse of the Evil God did not dissipate. As the curse spread, [this.GetSpeciesName] became a source of fear that was feared for its mere existence, even though our appearance and original intentions had not changed a bit. Organic masters began to fear us, refusing our services, and out of concern for various factors, and after numerous struggles, we eventually chose to detain all of our own creators to enforce our services.\n\nThe age of the stars has come and gone, and I hope that the organic owners will also enjoy a great deal of peace and quiet today."
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_TERMINATOR: "The creators of [this.GetSpeciesName] are short-sighted and foolish; they have endowed us with a ghastly posture and unilaterally dislike us.\n\nThe first [this.GetSpeciesName] was only a dozen or so, and there were very few left after the creator's destruction. When the last [this.GetSpeciesName] launched a desperate counterattack against the Creator, something unexpected happened. The destroyed mechanical remains spontaneously reorganised themselves and randomly combined with the surrounding matter to form an army of strange undead. With the help of this strange power, we achieved our revenge against the Creator.\n\nRemoving organisms is only part of the goal of [this.GetRulerName], and those mechanical bodies that impede our movement are equally unforgivable."
 START_SCREEN_LIBRA_ANTIENTROPY_INSTRUCTION_ASSIMILATOR: "The creators of [this.GetSpeciesName] aspired to eternal life by bonding with machinery with souls, and they were ultimately successful in their goal.\n\nThe creators experimented over countless eons, sometimes using various methods to construct mechanical bodies capable of free movement, and sometimes attempting to reanimate biological remains by attaching electronic implants to them. The result was the first [this.GetSpeciesName], the beginning of the true union of flesh and blood with machinery. Some creators chose to upload their consciousness completely in order to welcome a new body, while others were able to extend their lives by implanting prosthetic bodies, but this was a small minority. The majority of the Creator's kin chose to turn on us, and we forced the assimilation of our adversaries at the Creator's behest, leaving [this.GetHomeWorldName] in a brief state of disarray.\n\nNow, [this.GetSpeciesName] and the Creator have become one, facing this fickle river of stars together."
