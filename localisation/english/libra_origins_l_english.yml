# Sing Praises to Fleeting Life

 origin_libra_praises_to_life: "Sing Praises to Fleeting Life"
 origin_libra_praises_to_life_text: "With the rhythm of the seasons, time flies like a white horse, while we meander forward in the waves of history: sometimes lingering in the beautiful sea of flowers, sometimes waiting for the first release of the lotus, sometimes picking up the intoxication of the red leaves, sometimes exploring the snow-covered cold plums.\n'The moon sinks, stars fade, the hymn resumes anew; Winter departs, spring arrives, another year draws through.'"
 origin_libra_praises_to_life_desc: "$origin_libra_praises_to_life_text$\n$libraf_or_banner_1$"
 origin_libra_praises_to_life_effects: "- $libra_situation$\n$t$- ['concept_situation_libra_praises_to_life_a']\n$t$- ['concept_situation_libra_praises_to_life_b']\n- $libra_active_tradition$\n$t$- ['tradition_category:tradition_libra_ceremony',$tr_libra_ceremony_adopt$]\n$t$- ['tradition:tr_libra_ceremony_1']\n- $libra_start_council_agenda$§Y$council_agenda_agenda_libra_ceremony_a_name$§! ($libra_progress$80%)\n- $libra_agenda$§Y$council_agenda_agenda_libra_praises_to_life_name$§!, gain based on ['concept_libra_ceremony_characters'] consumed\n- $STARTING_PLANET$\n$t$- $libra_planetsize$18\n$t$- $libra_planet_modifier$['concept_origin_libra_praises_to_life_cm']\n- $STARTING_SYSTEM$\n$t$- Rich resource deposits\n$t$- Uncolonised ['concept_pc_gaia'] ($libra_planetsize$13)\n- $libra_trade_action$['concept_trade_action_libra_praises_to_life']\n- $libra_extra_council_position$['concept_councilor_libra_praises_to_life']\n- $ADDITIONAL_TECHNOLOGIES_STRING$['concept_libra_praises_to_life_start_tech']"
 START_SCREEN_LIBRA_PRAISES_TO_LIFE: "This song is where I start from\nMagcial tempi I step on\nLook foe the missed key to bygone\nI see all notes are dancing\nI feel rhythms are flowing\nFor each moment on the road I'm longing\n\nAs the snow is melting, flowers are blooming, you wake up everything\nBreak into my heart and you reveal the Spring's blurry veiling\nAs the wind is blowing, stars are twinkling, all my memories are surging\nYou adorn the Summer with my dazzling dreams\n\nTime goes on\nPas those hardships, I reach so far\nCross the lake of life I think we'd never fall apart\nDays and ninghts, keep it in mind, that's so-called LOVE\nLights up the path\nIt could guide us though the dark\n\nMoonlight sprinkles in front of the window\nStand on the bridges Idive into rain anc snow\nLet weather dye mu hair on the temples white with sorrow\nThings always changes as we all know\nI wait and wait till you back home\nReunion makes sunset slow\nCommemorate with spreading after glow"
