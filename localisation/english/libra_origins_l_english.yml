 libra_origin.0520.name: "Red Moon Rise"
 libra_origin.0520.desc: "Yes, we saw it again - the blood-red moon high in the sky that day.\n\nThe destroyed past and the many possibilities of the future intermingle and merge here, and it's time to decide where we're going."
 libra_origin.0520.a: "It's a new age night."
 libra_origin.0520.b: "Raise a glass and celebrate."
 libra_origin.0521.name: "Return"
 libra_origin.0521.desc: "Under the full moon, our power returns to where it should have been, and although the future remains uncertain, we are now able to choose the path of the present."
 libra_origin.0521.a: "We will be handing out olive branches."
 libra_origin.0521.a.tooltip: "Unlocking the §YPeace§! route effect of ['tradition_category:tradition_libra_crimson_vampire']\n$situation_libra_journey_to_the_end_stage_tooltip$"
 libra_origin.0521.b: "We will take up our swords and shields."
 libra_origin.0521.b.tooltip: "Unlocking the §YWar§! route effect of ['tradition_category:tradition_libra_crimson_vampire']\n$situation_libra_journey_to_the_end_stage_tooltip$"
 libra_crimson_nights_war_effect: "Swords and shields"
 libra_crimson_nights_peace_effect: "Olive branches"
 libra_origin.0525.name: "The Narrows Crossroads"
 libra_origin.0525.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nIf we had to turn a group of people into our servants, we would:"
 libra_origin.0525.a: "Infuse it with blood of the Blood."
 libra_origin.0525.b: "Nibbling on their necks."
 libra_origin.0525.c: "It is not unseemly to confuse."
 libra_origin.0526.name: "$libra_origin..0525.name$"
 libra_origin.0526.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nIf there was a cup of virgin blood in front of us, we would:"
 libra_origin.0526.a: "Carefully treasured."
 libra_origin.0526.b: "Take a drink."
 libra_origin.0526.c: "Made into the highest grade of jewellery."
 libra_origin.0527.name: "$libra_origin..0525.name$"
 libra_origin.0527.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nAt the time of the party, we will choose:"
 libra_origin.0527.a: "Black and red dress."
 libra_origin.0527.b: "Neatly groomed civilian clothes."
 libra_origin.0527.c: "Dress for the occasion."
 libra_origin.0528.name: "$libra_origin..0525.name$"
 libra_origin.0528.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nWhen in danger, we should:"
 libra_origin.0528.a: "Manipulate magic to resolve threats."
 libra_origin.0528.b: "Turn into an aerosol and get out quickly."
 libra_origin.0528.c: "Respond prudently in the name of nobility."
 libra_origin.0529.name: "$libra_origin..0525.name$"
 libra_origin.0529.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nAt rest, we will choose:"
 libra_origin.0529.a: "Coffins covered with cemetery soil."
 libra_origin.0529.b: "Coffins covered with home soil."
 libra_origin.0529.c: "A casket that fits the identity decorations."
 libra_origin.0530.name: "$libra_origin..0525.name$"
 libra_origin.0530.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nWhen visiting the residence through the closed front door, we will:"
 libra_origin.0530.a: "Look for the location of the doorbell."
 libra_origin.0530.b: "Go straight to the door."
 libra_origin.0530.c: "Let the servant do it for us."
 libra_origin.0531.name: "$libra_origin..0525.name$"
 libra_origin.0531.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nWhen encountering forbidden items, our choices are:"
 libra_origin.0531.a: "Ignore it."
 libra_origin.0531.b: "Direct destruction."
 libra_origin.0531.c: "Properly handled."
 libra_origin.0532.name: "$libra_origin..0525.name$"
 libra_origin.0532.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nThe sun was burning when we were out and our choice was:"
 libra_origin.0532.a: "Change of schedule to travel later."
 libra_origin.0532.b: "Nothing can stop us from moving forward."
 libra_origin.0532.c: "We have minions and carriers."
 libra_origin.0533.name: "$libra_origin..0525.name$"
 libra_origin.0533.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nIf there were two canonical books to read, we'd pick them up:"
 libra_origin.0533.a: "Spiritual Grimoire."
 libra_origin.0533.b: "Cursed Grimoire."
 libra_origin.0533.c: "No need to worry about basic literacy."
 libra_origin.0534.name: "$libra_origin..0525.name$"
 libra_origin.0534.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nOur actions when encountering other nightwalkers:"
 libra_origin.0534.a: "A polite hello."
 libra_origin.0534.b: "Fuck them over."
 libra_origin.0534.c: "Let the butler deal with it."
 libra_origin.0535.name: "$libra_origin..0525.name$"
 libra_origin.0535.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nIn the face of departed companions, we will:"
 libra_origin.0535.a: "Erect simple headstones."
 libra_origin.0535.b: "Hold a mourning service."
 libra_origin.0535.c: "Organise a nobleman's funeral."
 libra_origin.0536.name: "$libra_origin..0525.name$"
 libra_origin.0536.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nWhat we think about when we hunt our prey:"
 libra_origin.0536.a: "It's good to be full again."
 libra_origin.0536.b: "Thanks for the gifts of nature."
 libra_origin.0536.c: "An elegant hunt."
 libra_origin.0537.name: "$libra_origin..0525.name$"
 libra_origin.0537.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nAt the end of life, we will:"
 libra_origin.0537.a: "Curse our enemies."
 libra_origin.0537.b: "Try to make arrangements for the aftermath."
 libra_origin.0537.c: "Waiting for the end to come."
 libra_origin.0538.name: "$libra_origin..0525.name$"
 libra_origin.0538.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nIf we have to tidy up our grooming, we will:"
 libra_origin.0538.a: "Handle it by feel."
 libra_origin.0538.b: "Mirroring ourselves with electronic devices."
 libra_origin.0538.c: "Look in the mirror and let the servant take care of it."
 libra_origin.0539.name: "$libra_origin..0525.name$"
 libra_origin.0539.desc: "On the road back to authenticity, there are a number of issues that we need to address urgently.\n\nThe ideal way to go when it comes to enjoying blood:"
 libra_origin.0539.a: "Suck it straight up."
 libra_origin.0539.b: "Spread on bread."
 libra_origin.0539.c: "Served in a gorgeous wine glass."
