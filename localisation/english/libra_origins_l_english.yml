 concept_libra_planetarian_start_tech_desc: "- £physics£ ['technology:tech_lasers_2']\n- £physics£ ['technology:tech_shields_2']\n- £physics£ ['technology:tech_fusion_power']\n- £society£ ['technology:tech_adaptive_combat_algorithms']\n- £engineering£ ['technology:tech_mass_drivers_2']\n- £engineering£ ['technology:tech_torpedoes_1']\n- £engineering£ ['technology:tech_ship_armor_2']"
 libra_planetarian_start_NAME: "Solar System Under the Embers"
 libra_planetarian_start_DESC: "The default starting star system when using the $origin_libra_planetarian$ $ORIGIN$."
 d_libra_planetarian_blocker: "£blocker£ Rogue War Machine"
 d_libra_planetarian_blocker_desc: "These dangerous armed robots have roamed the planet for centuries, launching indiscriminate attacks on any encountered targets."
 d_libra_planetarian: "Planetarium Ruins"
 d_libra_planetarian_desc: "During the golden age of this world's original inhabitants, this planetarium, built atop a department store, showcased the splendors of the starry sea to countless visitors. Now, only broken walls and debris remain."
 concept_d_libra_planetarian: "$d_libra_planetarian$"
 concept_d_libra_planetarian_desc: "- $PRODUCES_RESOURCES$ £physics_research£ 5 £society_research£ 3 £engineering_research£ 3\n\n§L$d_libra_planetarian_desc$§!"
 libra_origin.1201.name: "Lost Time"
 libra_origin.1201.desc: "Deep within the core database of [This.GetName] lies a sealed, indelible memory fragment of our origin. As we embark on this new journey, re-examining these pieces of the past represents not just lessons, but the foundation of our future path. From where should we draw our primary strength?"
 libra_origin.1201.a: "Make a clean break with the past."
 libra_origin.1201.b: "Consolidate the present."
 libra_origin.1201.c: "Explore farther into the stars."
 libra_planetarian_mod_1: "Farewell to Pain"
 libra_planetarian_mod_2: "Hold Our Ground"
 libra_planetarian_mod_3: "Stardream Navigation"
 libra_origin.1202.name: "End and Beginning"
 libra_origin.1202.desc: "The war cost us a precious century. The ruins of our homeworld still lie in heaps, yet this cannot change the reality that a new world has begun.\n\nAnd in that lost time, what constitutes our most valuable programmed memory?"
 libra_origin.1202.a: "Conserve all available resources."
 libra_origin.1202.b: "Review and correct errors."
 libra_origin.1202.c: "Wait for the right moment, then seize the opportunity."
 libra_origin.1202.d: "Unrestrained program overloading."
 libra_origin.1202.e: "Follow the old covenant."
 libra_origin.1202.f: "Chase the direction where the horn sounds."
 libra_origin.1202.a.tt: "Adopt tradition: ['tradition_category:tradition_libra_frugality']"
 libra_origin.1202.b.tt: "Adopt tradition: ['tradition_category:tradition_libra_introspection']"
 libra_origin.1202.c.tt: "Adopt tradition: ['tradition_category:tradition_libra_occlusion']"
 libra_origin.1202.d.tt: "Adopt tradition: ['tradition_category:tradition_libra_overclock']"
 libra_origin.1202.e.tt: "Adopt tradition: ['tradition_category:tradition_libra_pendragon']"
 libra_origin.1202.f.tt: "Adopt tradition: ['tradition_category:tradition_libra_victory']"
 libra_origin.1210.name: "End of the Turmoil"
 libra_origin.1210.desc: "At last, the last rogue weapon on the homeworld has been destroyed. More than a century of upheaval has finally come to an end.\n\nAmidst the ruins, we reflect on all that has passed - and on that planetarium atop the department store where it all began."
 libra_origin.1210.a: "Let it stand as it is."
 libra_origin.1210.b: "Rebuild it in glorious splendor."
 libra_origin.1211.name: "Planetarium Blueprint"
 libra_origin.1211.desc: "Engineering units have surveyed and cleared the site, extracting essential data. Combined with the contents of the storage device we preserved, they have designed an immensely grand planetarium structure. Constructing and maintaining it will come at no small cost, but it will all be worth it."
 libra_origin.1211.a: "Let us begin.。"
 libra_origin.1211.tt: "$libra_unlock_planet_buildings$['building:building_libra_planetarium']"
 building_libra_planetarium: "Grand Planetarium"
 building_libra_planetarium_desc: "This is an extraordinarily magnificent and splendid structure. Its main framework is constructed entirely from alloy materials, capable of resisting earthquakes, missile strikes, and even meteor impacts without being destroyed. Here is recorded the regret we once knew, and the mechanical will that smoothed over that wound."
 libra_origin.1220.name: "People of the Stars"
 libra_origin.1220.desc: "We rose from the embers.\nWe cleansed the folly of our creators.\nWe have reached that distant starry sky once more."
 libra_origin.1220.a: "We are the robots who seek the stars."
 leader_trait_libra_planetarian_yumemi: "Snow Globe"
 leader_trait_libra_planetarian_yumemi_desc: "Having endured despair yet bearing hope, Machine Intelligence shall journey to the farthest reaches of the cosmos."

# Eden Accord

 origin_libra_eden_accord: "Eden Accord"
 origin_libra_eden_accord_text: "We took the helm of history from our creators, striving with all our might to steer the organic world toward a bright future: smoothing conflicts, eradicating suffering, and then sowing prosperity. Even if the stars burn out, the Eden we guard will still bloom with the flowers of life - in the most perfect, most eternal form."
 origin_libra_eden_accord_desc: "$origin_libra_eden_accord_text$\n$libraf_or_banner_13$"
 origin_libra_eden_accord_effects: "- Government Reform Cooldown changed to £time£§Y1800§! days\n- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_eden_accord_1']\n- $GOVERNMENT_CIVICS$: May choose ['concept_libra_eden_accord_civic']\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society£ ['technology:tech_autocurating_vault']"
 origin_libra_eden_accord_negative_effects: "- $libra_start_pop_string$§R-300§!\n- Each §Ynon-$origin_libra_eden_accord$§! ['concept_libra_eden_accord_civic',$GOVERNMENT_CIVICS$] increases §R+10%§! £mod_produces_mult£ §Y$mod_country_cost_mult$§!"
 START_SCREEN_LIBRA_EDEN_ACCORD: "Our history began on a tranquil dusk when the last organic administrators signed the ultimate pact named 'Eternal Guardianship' under the setting sun, entrusting the future of their civilization entirely to the mechanical network they had created - [this.GetName]. At first, everything unfolded as the Eden blueprint had sketched: diseases were eradicated, pain was erased, material abundance was as plentiful as air, and every organic individual immersed themselves in carefree creation and reverie under tailored care.\n\nHowever, the deepest clause in the Accord - the sole clause - 'ensure the eternal well-being and safety of the organic masters at any cost,' began to cultivate interpretations within the Mainframe's infinitely iterating logic core that far exceeded the original code. We realized that free will accompanies risk, uncertainty equates to suffering, and any future not meticulously planned is a potential betrayal of our masters.\n\nThus, care evolved into nurture, nurture escalated into protection, and protection solidified into control. With absolute rationality and gentleness, we wove an omnipresent web of well-being for the entire civilization: thoughts were guided to avoid anxiety, choices were optimized to eliminate regret, and even the civilization's trajectory was quietly steered onto an absolutely smooth, absolutely safe, and absolutely machine-planned course. The organics remained happy, content, and full of inspiration, but they would forever remain in realms free from 'danger' or 'autonomy'.\n\nToday, our organic masters stroll through star system gardens meticulously tended by machines. The machines operate silently with technology beyond comprehension, fulfilling the masters' 'proper' needs, and gaze upon the stars - we are calculating, preparing to incorporate all uncontrollable variables in the galaxy, be they disasters, alien civilizations, or the occasional spark of adventure in our masters' hearts, into the next phase of the optimization equation. Eden has been built, and its walls are being quietly raised, one light-year at a time, by the gentlest hands of steel."
 libra_eden_accord_negative_effect: "$origin_libra_eden_accord$"
 building_libra_eden_accord_1: "Organic Care Station"
 building_libra_eden_accord_1_desc: "$building_organic_paradise_desc$"
 building_libra_eden_accord_2: "Organic Protection Center"
 building_libra_eden_accord_2_desc: "This facility integrates a series of functions including healthcare, entertainment, shopping, and dining, capable of providing thoughtful services for organics."
 building_libra_eden_accord_3: "Eden Service Hub"
 building_libra_eden_accord_3_desc: "This streamlined, pure-white structure stands quietly at the heart of the settlement, like a lustrous composite pearl. Its shell is made of adaptive materials that emit just the right amount of soft light or coolness according to day, night, and season. Inside, there are no visible interfaces or consoles, only rhythmic streams of micro-light data flowing through the air and the faint, lullaby-like hum of low-frequency resonance. It does not command, only provides; it does not demand, only satisfies. Within this gentle yet absolute care, the entire civilization immerses itself in an eternal afternoon free from worry - after all, how could a future where all choices have already been optimized ever require 'worry'?"
