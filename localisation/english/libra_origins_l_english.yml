# psalm of waves

 origin_libra_psalm_of_waves: "Psalm of Waves"
 origin_libra_psalm_of_waves_text: "This species was born in the sea and returned to the sea: they evolved in the water, then ascended to the coast to reproduce, and then returned to the sea for the rest of their lives. After countless waves, they formed their own civilization - an ocean civilization that followed the rhythm of the tides."
 origin_libra_psalm_of_waves_desc: "$origin_libra_psalm_of_waves_text$\n$libraf_or_banner_2$"
 origin_libra_psalm_of_waves_effects: "- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_temple_of_waves']\n- $SPECIES_TRAITS$ Access to ['concept_libra_psalm_of_waves_traits']\n- $libra_start_leader_string$\n$t$- $libra_commander_trait$§Y$leader_trait_libra_psalm_of_waves_commander$§!\n$t$- $libra_official_trait$§Y$leader_trait_libra_psalm_of_waves_official$§!\n$t$- $libra_scientist_trait$§Y$leader_trait_libra_psalm_of_waves_scientist$§!\n- $libra_agenda$\n$t$- §Y$council_agenda_agenda_libra_psalm_of_waves_a_name$§!, reinforce $commander_with_icon$\n$t$- §Y$council_agenda_agenda_libra_psalm_of_waves_b_name$§!, reinforce $official_with_icon$\n$t$- §Y$council_agenda_agenda_libra_psalm_of_waves_c_name$§!, reinforce $scientist_with_icon$\n- $libra_extra_council_position$['concept_councilor_libra_psalm_of_waves']\n- $HOMEWORLD$ ['concept_pc_ocean'] ($libra_planetsize$23)\n- $STARTING_SYSTEM$ §G+1§! §Y$frozen_terraforming_candidate$§!"
 START_SCREEN_LIBRA_PSALM_OF_WAVES: "Like the waves lapping at the reef, [this.GetSpeciesName] has come to the land many times during its long evolution to recuperate and return to the sea to feed the newborn. The [this.GetName] seeks the meaning of life in this long cycle, spending millennia spreading its presence throughout the [this.GetHomeWorldName].\n\nIn the first beginnings, the ancestors were just tender and ego-deficient plankton, with powerful predators a constant threat to their safety, but the enemy was not all-powerful. Our ancestors evolved through death, using everything around them to survive, finally allowing [this.GetSpeciesName] to be born. They stood at the top of the food chain, controlling all of their home planet's seas and looking out over the small, pointless land - the last realm of what they had failed to control. Over time, all sorts of changes occurred between [this.GetSpeciesName], and those of us who stayed behind were among the best of the best, diving into the depths or ascending to the surface without a care in the world, and our history unfolded.\n\nFollowing in the footsteps of the wave, [this.GetSpeciesName] has evolved extraordinarily rapidly, and with the realisation of the technology of interstellar voyages, we are ready to travel far and wide among the stars."
 libra_psalm_of_waves_start_NAME: "Aquamarine"
 libra_psalm_of_waves_start_DESC: "Default starting star system when using $origin_libra_psalm_of_waves$ $ORIGIN$."
 d_libra_psalm_of_waves: "Ice Treasures"
 d_libra_psalm_of_waves_desc: "The resources buried beneath the ice are of considerable value."
 building_libra_temple_of_waves: "Oceanic Atoll"
 building_libra_temple_of_waves_desc: "For thousands of years, we have observed the ebb and flow of the tides in this circular reef, singing the praises of the ocean."
 building_libra_temple_of_waves_effect: "Consumes £trade£§R1§! to produce £physics_research£§G0.5§! £society_research£§G0.5§! £engineering_research£§G0.5§! for every $pop_group_unit$ £pop£ §Y$POP$§! in the colony."
