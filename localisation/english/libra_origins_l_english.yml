 libra_origin.0711.name: "Dragon Chapter"
 libra_origin.0711.desc: "How many years have passed since the end of the last universe?\n\nWe don't know. We can't calculate.\n\nOnly one thing is certain: we are on our way back to the top, and history will open a page of authority for that."
 libra_origin.0711.a: "World! Tremble for the rebirth of [this.GetSpeciesName]!"
 libra_origin.0711.b: "This is the dawn of a new era."
 tr_libra_dragonchant_1: "Initiation"
 tr_libra_dragonchant_1_delayed: "Gazing at the past of our ancestors."
 libra_origin.0723.name: "The Beginning Of The Second"
 libra_origin.0723.desc: "In the previous world, the ancestors took thousands of years to reach the top of the interstellar food chain, and now, after the reincarnation, we are starting here again.\n\nWe know that we are not alone, and we imagine the existence of other survivors of the Old World, things that we did not have time to think about, but now we have enough energy to explore."
 libra_origin.0723.a: "Let's go!"
 tr_libra_dragonchant_2: "Ancient Rites"
 tr_libra_dragonchant_2_delayed: "Keep the high faith."
