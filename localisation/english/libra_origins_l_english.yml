 civic_libra_eden_accord_c: "Classical Park"
 civic_libra_eden_accord_c_desc: "This servitor system is enthusiastic about letting its masters experience life from the old eras, viewing it as a form of entertainment.\n$libraf_oc_banner_9$"
 civic_tooltip_libra_eden_accord_c: "- $libra_edict$\n$t$- ['edict:libra_eden_accord_c_1',$edict_libra_eden_accord_c_1$]\n$t$- ['edict:libra_eden_accord_c_2',$edict_libra_eden_accord_c_2$]\n$t$- ['edict:libra_eden_accord_c_3',$edict_libra_eden_accord_c_3$]\n$t$- The above edicts can remain active until expiry even after §Y$MOD_GOVERNMENT_TITLE$§!\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society£ ['technology:tech_centralized_command']"
 edict_libra_eden_accord_c_1: "Recalling Toil"
 edict_libra_eden_accord_c_1_desc: "Open mines and farms within the organic preserves, then assign servitor units to engage in a production competition with the masters. Victorious living exhibits receive more resources, supplies, and a named awards ceremony featured in the news."
 edict_libra_eden_accord_c_2: "Harvesting Harmony"
 edict_libra_eden_accord_c_2_desc: "While the masters are busy, our mechanical units will not remain idle."
 edict_libra_eden_accord_c_3: "Studying Tactics"
 edict_libra_eden_accord_c_3_desc: "Even if reluctantly, some harsh truths must be shown to our organic masters. Being in paradise does not mean there is no war or death."
 civic_libra_eden_accord_d: "Fertile Land Project"
 civic_libra_eden_accord_d_desc: "The era where organics needed to labor personally is over. Awaiting them now is limitless leisure. This automated servitor system will transform its surroundings to create the best living environment for its masters.\n$libraf_oc_banner_10$"
