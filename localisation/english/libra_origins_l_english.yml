 trait_libra_psalm_of_waves_0: "Big Daddy"
 trait_libra_psalm_of_waves_0_desc: "This huge but flexible aquatic species has unrivalled influence in their domain, enough to twist most rules to their will."
 trait_libra_psalm_of_waves_0_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£society_research£ §Y$society_research$§! per month"
 trait_libra_psalm_of_waves_1: "Abyssal Touch"
 trait_libra_psalm_of_waves_1_desc: "This aquatic species has flexible but fearsome tentacles - however, their terror is known only to their enemies."
 trait_libra_psalm_of_waves_2: "Tourist Psalm"
 trait_libra_psalm_of_waves_2_desc: "This aquatic species is able to fully utilise its value whenever the situation permits."
 trait_libra_psalm_of_waves_3: "Structurer"
 trait_libra_psalm_of_waves_3_desc: "This aquatic species has an intricate internal structure and they have adapted to their environment through this complex evolutionary outcome."
 trait_libra_psalm_of_waves_4: "Concentricity Of Opposites"
 trait_libra_psalm_of_waves_4_desc: "Despite the occasional conflict, this aquatic species will always be at its best when united."
