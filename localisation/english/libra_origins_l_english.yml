 libra_origin.0704.name: "Bone of Dragon"
 libra_origin.0704.desc: "No dragon would want to disturb the ancestral resting place, but we have no choice but to restore the glory of the past.\n\nAccording to records, the planet was the site of the old World Heritage site, which is now covered with layer upon layer of remains. And it's not just here, it's all over the home system, dead Voiddragons are everywhere.\n\nIn order to adapt to this dimension, we temporarily gave up the ability to move freely in space, only a few individuals can fly, and now we can finally build graves for the dead."
 libra_origin.0704.a: "May they rest in peace."
 libra_origin.0705.name: "Road To Decay"
 libra_origin.0705.desc: "The crisis caused by 'not adapting to the laws of physics' is extremely frightening, like the denial of their own existence, the relatively weak individual will quickly collapse, the strong individual will also die after a long period of torture, with a small exception - we survive.\n\nDue to asteroid impacts and other factors, most of the remains on the surface of the planet are fragmented, and our scientific research units can only obtain extremely limited information from them, and they can reproduce the face of the ancestors bit by bit."
 libra_origin.0705.a: "We... Dig a little deeper."
 libra_origin.0706.name: "Dragon's Body"
 libra_origin.0706.desc: "In deeper areas, the remains appear relatively intact, but remain immeasurable. The scales of our ancestors, impenetrable in the other world, are fragile here. Layers of backlog of remains are mostly deformed and destroyed, and our archaeological units have collected a large number of samples, but still can not come up with a complete body of a similar age."
 libra_origin.0706.a: "The world died to me, and I lived to die."
 libra_origin.0706.b: "Handle with care to avoid mistakes."
 libra_origin.0707.name: "Molten Ember"
 libra_origin.0707.desc: "By maintaining the rate of drilling, we have reached the original surface of the planet, where there are large remains, traces of dragon's breath, and material clearly from the Old World.\n\nOur research unit is analyzing these samples, but it will take some time to reach the results."
 libra_origin.0707.a: "Then hold on tight."
 libra_origin.0707.b: "Experiment as much as possible."
 libra_origin.0708.name: "Dragon's Heart"
 libra_origin.0708.desc: "The analysis of the samples went well, and as far as the results were concerned, we did not lose the ability to emit dragon's breath, but it took some time for most individuals to get used to the method of focusing and emitting breath. But other abilities, such as the ability to use a wing-fork to curl lightning in self-defense, were lost forever as the price of our adaptive evolution.\n\nArchaeological units are collecting remains from across the galaxy, both to provide samples for scientific research and to build graves for ancestors who died tragically."
 libra_origin.0708.a: "At least we can rest easy."
 libra_origin.0709.name: "Reignite The Fire Of The Void"
 libra_origin.0709.desc: "It's done. We've retrieved the symbol of dragon pride, the blazing flame that heralds the beginning of our race's revival. Meanwhile, somewhere on our "home planet" in this world, we have built a peaceful cemetery to house our dead ancestors."
 libra_origin.0709.a: "It's time to come back."
