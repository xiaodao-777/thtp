 libra_origin.0101.name: "New Year"
 libra_origin.0101.desc: "Another cycle of spring, summer, autumn and winter has come to an end, our time never stops like the engines of a ship under sail, but there is always a moment of anchoring in a starport to rest and recuperate.\nEvery one of us, no matter where we are now, has such a common moment of relaxation from stressful affairs while commemorating this past year."
 libra_origin.0101.a: "Celebration time!"
 libra_origin.0101.b: "Let's have a specialist supervise the celebration."
 libra_origin.0101.b.tt: "Automatic loop §Y$situation_libra_praises_to_life_a$§! Situation"
 libra_origin.0102.name: "Circle of Reincarnation"
 libra_origin.0102.desc: "In the blink of an eye another 12 years have passed, how much has space shifted and how far have we found ourselves?\nRepairing facilities, reorganising planning, a new cycle begins."
 libra_origin.0102.a: "The journey continues."
 libra_origin.0102.b: "The future is brighter."
 libra_origin.0102.tooltip: "Gain §G8§! sheets of ['concept_libra_ceremony_characters']"
