 libra_origin.0540.name: "Come"
 libra_origin.0540.desc.a: "It was never a matter of time before we returned to the top, and now we have taken the final step.\n\nBut, can we still be considered Bloods if we are transformed into machines and abandon our Blood traditions?"
 libra_origin.0540.desc.b: "We have experienced the suffering above the Shoah.\nWe have followed the call of predestination in the underworld.\nWe foresee the revival under the night.\n\nAnd now, with the red moon full, it's a good time for a big feast."
 libra_origin.0540.tooltip: "['trait:trait_libra_crimson_nights_vampire'] species acquisition ['trait:trait_libra_crimson_nights_ancestor'] trait"
 libra_origin.0540.a: "Mechanical Bloods are also vampires!"
 libra_origin.0540.b: "Motor oil is also good for blood."
 libra_origin.0540.c: "I am, therefore I am."
 libra_origin.0540.d: "Let's get this party started."
 libra_origin.0540.e: "Glory to the Blood."
