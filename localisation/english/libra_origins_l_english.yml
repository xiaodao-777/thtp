 leader_trait_libra_paradise_lose_2_ruler_tt: "$t$- Each level of §Y$leader_trait_libra_paradise_lose$§! brings:\n$tt$- $mod_pop_politician_bonus_workforce_mult$: §G+0.2%§! (Max: §G+30%§!)\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+0.3%§! (Max: §G+45%§!)"
