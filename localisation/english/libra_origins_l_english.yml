 leader_trait_libra_psalm_of_waves_commander: "Helmsman"
 leader_trait_libra_psalm_of_waves_commander_desc: "Thanks to the sailing experience of his ancestors, the leader was able to sail smoothly through most conditions of the interstellar age."
 leader_trait_libra_psalm_of_waves_official: "Precentor"
 leader_trait_libra_psalm_of_waves_official_desc: "This leader was a bearer of the ancient carols, and like other minstrels, honored the custom of recording the changing tides and singing aloud at night."
 leader_trait_libra_psalm_of_waves_scientist: "Lyricist"
 leader_trait_libra_psalm_of_waves_scientist_desc: "In pursuit of the wisdom of the sea, this leader has composed the harmonious sounds of the waves into an eternal melody."
