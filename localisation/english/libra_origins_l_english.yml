 START_SCREEN_LIBRA_DRAGONBORN: "If you talk about the length of history, no species in the world has lived longer than [this.GetSpeciesName]; If we're talking about the ups and downs of history, no civilisation in the universe has ever experienced the stifling of [this.GetSpeciesName].\n\nIn the old world, we are the only supreme, neither by the power of science, nor by the increase of arcane, only by natural evolution to reach the end of the biological form, our position was as unshakable as the existence of the world itself, 'dragon' is the only worthy of our name.\n\nBut then came the destruction: the universe that had given birth to our species faded, collapsing at an ever-increasing rate and eventually destroying itself in an explosion, leaving [this.GetSpeciesName] all alone. Finally, we are here, but the disaster is only just beginning. The physical laws of the universe in the past were different from those here, and this small difference brought a great burden, the nerves became dull, the scales became weak... Countless people of the same descent died in hardship, and [this.GetSpeciesName] was no longer the hegemon it used to be.\n\nFortunately, there is no way out, and in this corner of a hostile world, we have found a place of our own. We give up the original pride of wandering the stars, and descend to the surface to stagger and crawl, consciously adjusting blood lines in the evolution of generation after generation, adapting to this dimension bit by bit.\n\nThe sun and the moon fly by, and it's been billions of years, and we - we're back."
