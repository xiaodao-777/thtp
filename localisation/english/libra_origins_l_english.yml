 trait_libra_psalm_of_waves_6: "Habitat Discoverer"
 trait_libra_psalm_of_waves_6_desc: "This aquatic species is adept at finding the right place in an uncertain future and skilfully arranging its habitat."
 trait_libra_psalm_of_waves_6_tooltip: "When in an §Y$climate_wet$§! environment:\n$tt$- $mod_planet_jobs_worker_only_produces_mult$: §G+7.5%§!\n$t$- Not in §Y$climate_wet$§! environment:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!"
 trait_libra_psalm_of_waves_7: "Swallow"
 trait_libra_psalm_of_waves_7_desc: "This aquatic species has an incredible bite with huge feeding vessels, which makes them the most dangerous beings in the deep sea."
 trait_libra_psalm_of_waves_7_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.1§!£minerals£ §Y$minerals$§! per month"
 trait_libra_psalm_of_waves_8: "Master Angler"
 trait_libra_psalm_of_waves_8_desc: "These species of aquatic origin are sophisticated and cunning hunters, and their enemies can never imagine the means by which they have been eliminated."
 trait_libra_psalm_of_waves_9: "King's Treasure"
 trait_libra_psalm_of_waves_9_desc: "You can never imagine what amazing treasures this aquatic species has hidden in its sac - probably they themselves can't estimate how much that is worth."
 trait_libra_psalm_of_waves_9_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£trade£ §Y$trade$§! per month"


# ultimate market

 origin_libra_ultimate_market: "Ultimate Market"
 origin_libra_ultimate_market_text: "The implant boom has brought social prosperity, the labyrinthine market has created endless possibilities, and instability lurks beneath the waves.\nEndless business opportunities are fleeting, endless risks pass by, in this ever-changing market, who will become the best investor?"
 origin_libra_ultimate_market_desc: "$origin_libra_ultimate_market_text$\n$libraf_or_banner_3$"
 origin_libra_ultimate_market_effects: "- $libra_agenda$§Y$council_agenda_agenda_libra_ultimate_market_name$§!, able to remove policy cooldowns\n- $libra_policy$['concept_libra_ultimate_market_policies']\n- $SPECIES_TRAITS$ ['concept_libra_ultimate_market_traits']\n- $ADDITIONAL_TECHNOLOGIES_STRING$ £engineering_research£ ['concept_powered_exoskeletons',$tech_powered_exoskeletons$]\n- $GUARANTEED_RESEARCH_OPTION_STRING$\n$t$- £engineering_research£ ['concept_robotic_workers',$tech_robotic_workers$]\n$t$- £engineering_research£ ['concept_integrated_cybernetics',$tech_integrated_cybernetics$]"
 START_SCREEN_LIBRA_ULTIMATE_MARKET: "At [this.GetHomeWorldName], it didn't take long from the completion of the initial prosthetic development to the large-scale application of experimental prosthetics. Almost overnight, [this.GetSpeciesName] gained inhuman strength and high endurance that was unimaginable in the past.\n\nThe increased capacity also amplified [this.GetSpeciesAdj] desires, and a variety of anti-social actions sprang up, and the then-government, which failed to respond in time, eventually collapsed. In this way, chaos and epidemics dominated [this.GetHomeWorldName], and anarchy persisted for hundreds of years - until the establishment of [this.GetName].\n\nThe unsophisticated prosthetic technology and poor hygiene of our competitors, which had decimated the population of [this.GetSpeciesName], was the perfect aid to [this.GetName]'s domination of the home world. With the support of our loyal customers, we quickly took over the entire market, and the entire [this.GetHomeWorldName]of [this.GetSpeciesName] is using advanced implants produced by [this.GetName]. In the end, we unified the home planet by virtue of the overwhelming implant performance gap and achieved a great renaissance of [this.GetSpeciesName] civilisation.\n\nTimes are moving on, markets are expanding, and the road to developing prosthetics is far from over."
 council_agenda_agenda_libra_ultimate_market_name: "Investment Shift"
 council_agenda_agenda_libra_ultimate_market_desc: "New markets beckon, and it's time to plot a new blueprint."
 agenda_libra_ultimate_market_modifier: "$council_agenda_agenda_libra_ultimate_market_name$ Agenda"
 concept_libra_ultimate_market_policies: "$origin_libra_ultimate_market$ Policies"
 concept_libra_ultimate_market_policies_desc: "Policies used to unlock the potential of cybernetic businesses, including:\n$t$- §Y$policy_libra_ultimate_market_1$§!\n$t$- §Y$policy_libra_ultimate_market_2$§!\n$t$- §Y$policy_libra_ultimate_market_3$§!\n$t$- §Y$policy_libra_ultimate_market_4$§!\n$t$- §Y$policy_libra_ultimate_market_5$§!\n$t$- §Y$policy_libra_ultimate_market_6$§!\n$t$- §Y$policy_libra_ultimate_market_7$§!"
 policy_libra_ultimate_market_1: "Local Market Targets"
 policy_libra_ultimate_market_1_desc: "There are business opportunities to be had even within the business, and reaping those benefits requires only minor adjustments.\n"
 policy_libra_ultimate_market_1_a: "Social Consumption"
 policy_libra_ultimate_market_1_a_name: "$policy_libra_ultimate_market_1_a$"
 policy_libra_ultimate_market_1_a_desc: "All residents voluntarily pay an equal amount of tax, with the aim of ensuring that the best prosthetic services are available to all.\n "
 policy_libra_ultimate_market_1_b: "Upper Class"
 policy_libra_ultimate_market_1_b_name: "$policy_libra_ultimate_market_1_b$"
 policy_libra_ultimate_market_1_b_desc: "The upper middle class in society tends to have a large surplus of money, and as long as they use these assets to purchase and upgrade prosthetics, those who desire power will be able to gain more power, and those who seek equality will be more equal than others.\n "
 policy_libra_ultimate_market_1_c: "Infrastructure"
 policy_libra_ultimate_market_1_c_name: "$policy_libra_ultimate_market_1_c$"
 policy_libra_ultimate_market_1_c_desc: "This prosthetic body helps to get up and live, that commodity facilitates efficiency ...... and after buying them all, the labourers' accounts are long empty.\n "
 policy_libra_ultimate_market_1_d: "Scheduling Adequately"
 policy_libra_ultimate_market_1_d_name: "$policy_libra_ultimate_market_1_d$"
 policy_libra_ultimate_market_1_d_desc: "The circulation of prosthetics is an integral part of our economy and we can be the best we can be in every aspect, but it takes a concerted effort by all.\n "
 policy_libra_ultimate_market_2: "Subsidiary Company Directive"
 policy_libra_ultimate_market_2_desc: "Proper utilisation of the branch can lead to a more prosperous business.\n"
 policy_libra_ultimate_market_2_a: "Industry Expertise"
 policy_libra_ultimate_market_2_a_name: "$policy_libra_ultimate_market_2_a$"
 policy_libra_ultimate_market_2_a_desc: "It takes a lot of time and effort to specialise in one business, and we should provide some guidance to our branches to reduce the waste of resources in this process.\n "
 policy_libra_ultimate_market_2_b: "Expanding Business"
 policy_libra_ultimate_market_2_b_name: "$policy_libra_ultimate_market_2_b$"
 policy_libra_ultimate_market_2_b_desc: "Capturing a wider market requires more manpower, and for this reason a soft touch strategy is needed for our branches.\n "
 policy_libra_ultimate_market_2_c: "Logistics"
 policy_libra_ultimate_market_2_c_name: "$policy_libra_ultimate_market_2_c$"
 policy_libra_ultimate_market_2_c_desc: "In order to ensure that corporate interests are not jeopardised, subsidiaries should provide full support to the parent company in terms of diligence.\n "
 policy_libra_ultimate_market_2_d: "Accounts Assistant"
 policy_libra_ultimate_market_2_d_name: "$policy_libra_ultimate_market_2_d$"
 policy_libra_ultimate_market_2_d_desc: "The primary task of the subsidiaries is to co-operate with the parent company's various and complex operations.\n "
 policy_libra_ultimate_market_3: "Expanding Strategic Controls"
 policy_libra_ultimate_market_3_desc: "Doing business with the outside world is an important part of corporate activity, and Righteous Body now brings more options to this activity.\n"
 policy_libra_ultimate_market_3_a: "Optimisation Management"
 policy_libra_ultimate_market_3_a_name: "$policy_libra_ultimate_market_3_a$"
 policy_libra_ultimate_market_3_a_desc: "The implantable prosthesis enables business managers to send and receive information quickly, which can effectively save administrative resources.\n "
 policy_libra_ultimate_market_3_b: "Commodity Dumping"
 policy_libra_ultimate_market_3_b_name: "$policy_libra_ultimate_market_3_b$"
 policy_libra_ultimate_market_3_b_desc: "Sales are one of the keys to profit taking in a business, and we have many means to promote our products, such as in-built adverts for prosthetic parts on the limits of the legal domain.\n "
 policy_libra_ultimate_market_3_c: "Expand Business"
 policy_libra_ultimate_market_3_c_name: "$policy_libra_ultimate_market_3_c$"
 policy_libra_ultimate_market_3_c_desc: "Our quest for potential markets never ends.\n "
 policy_libra_ultimate_market_3_d: "Criminal Grooming"
 policy_libra_ultimate_market_3_d_name: "$policy_libra_ultimate_market_4_c$"
 policy_libra_ultimate_market_3_d_desc: "With just a little bit of finesse, we can squarely sell many goods that are in the grey area or further afield, such as brain implants that can deliver a massive jolt of neural signals to the user, but of course, these prosthetics won't be sold locally.\n "
 policy_libra_ultimate_market_4: "Commodity Production Plan"
 policy_libra_ultimate_market_4_desc: "What's sales without production, and refreshing implants always bring in the largest customer base.\n"
 policy_libra_ultimate_market_4_a: "Cutting-edge Technology Development"
 policy_libra_ultimate_market_4_a_name: "$policy_libra_ultimate_market_4_a$"
 policy_libra_ultimate_market_4_a_desc: "A high-speed iteration of prosthetics not only accelerates market expansion, but also allows some customers to pay more for better performance.\n "
 policy_libra_ultimate_market_4_b: "Military Outsourcing Services"
 policy_libra_ultimate_market_4_b_name: "$policy_libra_ultimate_market_4_b$"
 policy_libra_ultimate_market_4_b_desc: "Our own armament is of course fitted with the finest military-grade prosthetics so that we can offer our guests security-rich and irresistible protection.\n "
 policy_libra_ultimate_market_4_c: "Advanced Process Technology"
 policy_libra_ultimate_market_4_c_name: "$policy_libra_ultimate_market_4_c$"
 policy_libra_ultimate_market_4_c_desc: "Strong, durable and inexpensive, high quality alloy ingots would knock on the door of most alien civilisations' markets, while shiny and exotic premiums would be a steal that no civilisation could resist.\n "
 policy_libra_ultimate_market_4_d: "Star Logistics Contracting"
 policy_libra_ultimate_market_4_d_name: "$policy_libra_ultimate_market_4_d$"
 policy_libra_ultimate_market_4_d_desc: "Our well-developed trade network can be used not only to deliver your own goods, but also to deliver your customers' mail on their behalf - as long as the price is reasonable.\n "
 policy_libra_ultimate_market_5: "Harmonisation of Cabinet Affairs"
 policy_libra_ultimate_market_5_desc: "Setting a reasonable short-term goal for the organisation facilitates growth, while attractive long-term goals promote solidarity among employees.\n"
 policy_libra_ultimate_market_5_a: "Training Skills"
 policy_libra_ultimate_market_5_a_name: "$policy_libra_ultimate_market_5_a$"
 policy_libra_ultimate_market_5_a_desc: "It has been proven that board members who are always up-to-date with the latest knowledge are better able to guide the organisation itself, and for this reason it is necessary to ease the burden by installing an enhanced learning suite for them.\n "
 policy_libra_ultimate_market_5_b: "Refinement of Duties"
 policy_libra_ultimate_market_5_b_name: "$policy_libra_ultimate_market_5_b$"
 policy_libra_ultimate_market_5_b_desc: "Aggregated statements will be sent directly to the brain implants of the council members after initial processing and urge them to make decisions, so there are usually no instances of leaders slacking off.\n "
 policy_libra_ultimate_market_5_c: "Reinforcement of the Decree"
 policy_libra_ultimate_market_5_c_name: "$policy_libra_ultimate_market_5_c$"
 policy_libra_ultimate_market_5_c_desc: "Electronic implants greatly reduce the difficulty of human intervention in information processing, maximise the value of the data collected and make it easier to pursue agendas.\n "
 policy_libra_ultimate_market_5_d: "Leadership Development"
 policy_libra_ultimate_market_5_d_name: "$policy_libra_ultimate_market_5_d$"
 policy_libra_ultimate_market_5_d_desc: "In ancient times, the talent of an heir would greatly shape the rise and fall of a kingdom, and the same is true in the space age, where only a class of savvy, competent and raw leaders can keep a business going.\n "
 policy_libra_ultimate_market_6: "Prosthetic Enhancement Criteria"
 policy_libra_ultimate_market_6_desc: "The multiple mating of prosthetic parts brings with it a myriad of options, and companies need to apply the best parts to the most appropriate places.\n"
 policy_libra_ultimate_market_6_a: "Focus on Manufacturing"
 policy_libra_ultimate_market_6_a_name: "$policy_libra_ultimate_market_6_a$"
 policy_libra_ultimate_market_6_a_desc: "It would be difficult to run a business without the numerous specialists who work in the technical field, and high-quality reinforcement equipment should be supplied to these specialists first and foremost.\n "
 policy_libra_ultimate_market_6_b: "Focus on Production"
 policy_libra_ultimate_market_6_b_name: "$policy_libra_ultimate_market_6_b$"
 policy_libra_ultimate_market_6_b_desc: "The bricks and mortar of the enterprise cannot be separated from the hard-working workers, and supporting them is our primary goal.\n "
 policy_libra_ultimate_market_6_c: "Equalisation"
 policy_libra_ultimate_market_6_c_name: "$policy_libra_ultimate_market_6_c$"
 policy_libra_ultimate_market_6_c_desc: "The fact that everyone receives equal and free support services is a testament to the advanced nature of our corporate culture.\n "
 policy_libra_ultimate_market_6_d: "Skill is Preferred"
 policy_libra_ultimate_market_6_d_name: "$policy_libra_ultimate_market_6_d$"
 policy_libra_ultimate_market_6_d_desc: "In all walks of life, we have produced a large number of highly skilled individuals, and implant broadcasting can carry their skills forward.\n "
 policy_libra_ultimate_market_6_e: "Building the Future"
 policy_libra_ultimate_market_6_e_name: "$policy_libra_ultimate_market_6_e$"
 policy_libra_ultimate_market_6_e_desc: "There is no difficulty that cannot be overcome by collective strength, and we will work together to build our country.\n "
 policy_libra_ultimate_market_7: "Implant Focus Point"
 policy_libra_ultimate_market_7_desc: "Neurochips, Mechanical Exoskeletons ...... The latest generation of cybernetic research has enabled companies to make more profit in these areas.\n"
 policy_libra_ultimate_market_7_a: "Mechanical Design"
 policy_libra_ultimate_market_7_a_name: "$policy_libra_ultimate_market_7_a$"
 policy_libra_ultimate_market_7_a_desc: "Traditional mechanical designs are not perfect, and by improving materials and structures, we will produce better robots.\n "
 policy_libra_ultimate_market_7_b: "Prosthesis"
 policy_libra_ultimate_market_7_b_name: "$policy_libra_ultimate_market_7_b$"
 policy_libra_ultimate_market_7_b_desc: "With the development of the machinery now over, we should turn our attention to our own implants.\n "
 concept_libra_ultimate_market_traits: "$origin_libra_ultimate_market$ $TRAIT_TITLE$"
 concept_libra_ultimate_market_traits_desc: "Fixed Carry ['trait:trait_libra_ultimate_market_cyborg'] $TRAIT_TITLE$, and can choose between one of the following initial traits:\n$t$- ['trait:trait_libra_ultimate_market_cyborg_1']\n$t$- ['trait:trait_libra_ultimate_market_cyborg_2']\n$t$- ['trait:trait_libra_ultimate_market_cyborg_3']\n$t$- ['trait:trait_libra_ultimate_market_cyborg_4']\n$t$- ['trait:trait_libra_ultimate_market_cyborg_5']\n$t$- ['trait:trait_libra_ultimate_market_cyborg_6']\nIf no trait is selected, add ['trait:trait_libra_ultimate_market_cyborg_6'] $TRAIT_TITLE$"
 trait_libra_ultimate_market_cyborg: "Reinforced Implants"
 trait_libra_ultimate_market_cyborg_desc: "After years of secret experiments and practical testing, the biochemical implants used by this species have been perfected."
 trait_libra_ultimate_market_cyborg_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1§!£trade£ §Y$trade$§! per month"
 trait_libra_ultimate_market_cyborg_1: "Military Grade Prosthetics"
 trait_libra_ultimate_market_cyborg_1_desc: "Every individual of this species has been implanted with lethal military prosthetics."
 trait_libra_ultimate_market_cyborg_2: "Brain Enhancement Kit"
 trait_libra_ultimate_market_cyborg_2_desc: "This species has neural implants capable of dramatically improving thinking skills."
 trait_libra_ultimate_market_cyborg_3: "Craftsmen Guide"
 trait_libra_ultimate_market_cyborg_3_desc: "How should one act in this endeavour to minimise wastage? Simply by accessing this network of services you can get full guidance from experienced people."
 trait_libra_ultimate_market_cyborg_4: "Homodyne Broadcasting"
 trait_libra_ultimate_market_cyborg_4_desc: "Throughout the history of the species, it has become traditional for those in power to broadcast their decrees directly to the inhabitants through a prosthetic body."
 trait_libra_ultimate_market_cyborg_5: "The Law of Smiles"
 trait_libra_ultimate_market_cyborg_5_desc: "The implants of this species will automatically control their facial expressions when meeting others, making a natural, standard and pleasing smile."
 trait_libra_ultimate_market_cyborg_6: "Signal Enhancement"
 trait_libra_ultimate_market_cyborg_6_desc: "This species is fitted with plug-ins with excellent signal transmission performance, which eliminates the need for them to worry about network interruptions due to poor communication."

# Enlightenment Wisdom

 origin_libra_enlightenment_wisdom: "Enlightenment Wisdom"
 origin_libra_enlightenment_wisdom_text: "When unknown whispers echoed from the planet's core, radiance took residence in the prophet's eyes. Commanders tore through the long night, philosophers reshaped mountains and rivers - legends became eternal upon the stelae, yet none knew the truth hidden beneath the glory: immortal beings are not eternal, ancient legends ultimately fade to silence."
 origin_libra_enlightenment_wisdom_desc: "$origin_libra_enlightenment_wisdom_text$\n$libraf_or_banner_4$"
 origin_libra_enlightenment_wisdom_effects: "- $libra_start_pop_string$§G+600§!\n- $libra_start_leader_string$\n$t$- Ensures §Y3§! £official£ £commander£ £scientist£ leaders\n$t$- §YSkill Level§! §Y5~10§! with §d$origin_libra_enlightenment_wisdom$ Trait§!\n- $STARTING_PLANET$\n$t$- $PLANETARY_FEATURES$ ['concept_d_libra_enlightenment_wisdom']\n$t$- $libra_planetary_building$['building:building_libra_enlightenment_wisdom']\n- $GUARANTEED_RESEARCH_OPTION_STRING$ ['concept_libra_enlightenment_wisdom_tech_option']\n- $libra_start_council_agenda$§Y$council_agenda_agenda_unlock_slot_name$§! ($libra_progress$5000)"
 origin_libra_enlightenment_wisdom_negative_effects: "- §RDisables§! Leader Pool\n- Most initial £leader£ §Y$LEADER$§! will §Rdie§! within §Y35§! years\n- $STARTING_PLANET$ §Rcannot§! §Y$TERRAFORM_TITLE$§! or §Y$decision_arcology_project$§!"
 START_SCREEN_LIBRA_ENLIGHTENMENT_WISDOM: "The catalyst for awakening lies hidden within the planet's pulsing core. Not mundane ore, but an ancient resonance flowing through rock fissures - an energy whispering to life's essence. It permeated the roots of civilization, sparking a philosophical revolution addressing existence itself. Profound contemplation replaced blind groping; logical frameworks wove new cognitive maps. Then emerged the bearers of this awakened spark - their wisdom tempered by planetary resonance. Their existence seemed to momentarily slip time's usual flow, entering a millennium of crystallized time. They were pathfinders piercing the mist, shaping realms with pure reason, carving reality with unadulterated thought. Their deeds shone like newly forged stars, laying civilization's cornerstone.\n\nYet the gift from the core is profoundly enigmatic. The life-resonance granting longevity promised no true eternity. Beneath the pledge of immortality lay unspoken costs and destinations. The cradle-world stands upon this pulsing source. Its obelisks are beacons of extraordinary insight, reflecting the shifting sands beneath. Now the stellar tapestry unfurls, the pathfinders' dawn persists. The future hangs in the gloaming: before fate's tide fully turns, this philosophical fire and insight born of stone must be passed on. Amongst the vast stars, a new foundation must be found for this unique wisdom - lest its embers fade. For even crystallized time must one day return to stardust."
 libra_enlightenment_wisdom_start_NAME: "Philosopher's Stone"
 libra_enlightenment_wisdom_start_DESC: "Default starting star system when using $origin_libra_enlightenment_wisdom$ $ORIGIN$."
 libra_enlightenment_wisdom_sol_start_NAME: "Solar System of Myths"
 libra_enlightenment_wisdom_sol_start_DESC: "Optional starting star system when using $origin_libra_enlightenment_wisdom$ $ORIGIN$."
 libra_enlightenment_wisdom_start_modifier: "$origin_libra_enlightenment_wisdom$"
 d_libra_enlightenment_wisdom: "Silent Abyss"
 d_libra_enlightenment_wisdom_desc: "A vast, immeasurably deep fissure with an eerie glow at its heart, reaching into the planet's depths."
 concept_d_libra_enlightenment_wisdom: "$d_libra_enlightenment_wisdom$"
 concept_d_libra_enlightenment_wisdom_desc: "- $PRODUCES_RESOURCES$ £unity£ 5\n\n- $MOD_PLANET_MAX_DISTRICTS_ADD$: §G+2§!\n\n§L$d_libra_enlightenment_wisdom_desc$§!"
 building_libra_enlightenment_wisdom: "Enlightenment Obelisk"
 building_libra_enlightenment_wisdom_desc: "Perhaps this monolith cannot record all our wisdom, but it surely holds the most essential lessons learned from history."
 libra_enlightenment_wisdom_unlock_building: "Can construct §G1§! additional £building£ §Y$building_libra_enlightenment_wisdom$§!"
 concept_libra_enlightenment_wisdom_tech_option: "$origin_libra_enlightenment_wisdom$ Tech Option"
 concept_libra_enlightenment_wisdom_tech_option_desc: "-  £physics_research£ ['concept_administrative_ai',$tech_administrative_ai$]\n-  £physics_research£ ['technology:tech_automated_exploration']\n-  £engineering_research£ ['concept_powered_exoskeletons',$tech_powered_exoskeletons$]\n-  £engineering_research£ ['technology:tech_assembly_pattern']"
 leader_trait_libra_enlightenment_wisdom_official: "Enlightened Herald"
 leader_trait_libra_enlightenment_wisdom_official_desc: "Mysterious energy froze this leader at [this.GetHisHer] peak, allowing [this.GetHimHer] to endure unimaginable epochs, shining through countless eras. Yet this unknown boon is not eternal. When the energy fades, how much of the former self will remain within the once-perfect vessel?"
 leader_trait_libra_enlightenment_wisdom_commander: "Enlightened Overseer"
 leader_trait_libra_enlightenment_wisdom_commander_desc: "$leader_trait_libra_enlightenment_wisdom_official_desc$"
 leader_trait_libra_enlightenment_wisdom_scientist: "Enlightened Pathfinder"
 leader_trait_libra_enlightenment_wisdom_scientist_desc: "$leader_trait_libra_enlightenment_wisdom_official_desc$"
 leader_trait_libra_enlightenment_heritage_official: "Radiant Successor"
 leader_trait_libra_enlightenment_heritage_official_desc: "Eternal life - a blessing, a curse, and an inescapable cycle for this civilization. This leader treads the path of countless predecessors. Barring the unforeseen, [this.GetHeShe] will guide the world for millennia, only to fade millennia later."
 leader_trait_libra_enlightenment_heritage_commander: "Radiant Guardian"
 leader_trait_libra_enlightenment_heritage_commander_desc: "$leader_trait_libra_enlightenment_heritage_official_desc$"
 leader_trait_libra_enlightenment_heritage_scientist: "Radiant Inheritor"
 leader_trait_libra_enlightenment_heritage_scientist_desc: "$leader_trait_libra_enlightenment_heritage_official_desc$"
 leader_trait_libra_enlightenment_heritage_tt: "$leader_trait_libra_councilor_position_effect_tt$$leader_trait_libra_total_skill_effect_tt$\nThis trait's §ERuler Effect§! improves with §YLeader Tenure§!"
 libra_origin.0401.name: "The Flickering Morning Star"
 libra_origin.0401.a.desc: "The Enlightened guided [Root.GetName] through millennia of glory. The golden age, blessed by subterranean energy, began unbroken. But as some within the civilization sensed, the homeworld's subterranean activity wanes. Worthy successors have not emerged for centuries.\n\nOur heir, §Y[Root.GetHeirName]§!, and capable aides have keenly perceived this anomaly."
 libra_origin.0401.b.desc: "The Enlightened guided [Root.GetName] through millennia of glory. The golden age, blessed by subterranean energy, began unbroken. But as some within the civilization sensed, the homeworld's subterranean activity wanes. Worthy successors have not emerged for centuries.\n\nAmong the new generation's strongest candidates, §Y[libra_enlightenment_wisdom_leader.GetName]§! and others seek change."
 libra_origin.0401.a: "What can we do?"
 libra_origin.0401.a.tt: "New leaders join the Empire"
 libra_origin.0402.name: "The Onset of Decline"
 libra_origin.0402.desc: "The energy from the homeworld fades; the power that sheltered us for millennia dissipates. Yet the Enlightened remain formidable."
 libra_origin.0402.a: "The prophecy unfolds."
 libra_origin.0402.a.tt: "Our leaders deteriorate"
 libra_origin.0403.name: "Decline"
 libra_origin.0403.desc: "The waning continues.\n\nForeseeing the future, the Enlightened preserve their wisdom: mentoring disciples, authoring treatises."
 libra_origin.0403.a: "What truly happens beneath the homeworld?"
 libra_origin.0403.b: "May their efforts succeed."
 libra_origin.0403.tt: "$libra_origin.0402.a.tt$\n$libra_enlightenment_wisdom_unlock_building$"
 libra_origin.0404.name: "Extinguishment"
 libra_origin.0404.desc: "After over a decade of decline, the homeworld's energy vanishes. This force once protected our most exceptional, now gone - the Enlightened's time wanes.\n\nYet fortunately, the first qualified successors stand ready.\nThough their abilities fall far short."
 libra_origin.0404.a: "Who shall bear our legacy?"
 libra_origin.0404.a.tt: "$libra_origin.0402.a.tt$\n§GEnables§! Leader Pool"
 libra_origin.0411.name: "Fading Radiance"
 libra_origin.0411.desc: "The stagnant radiance sustaining [Root.GetName]'s long millennia flickered like a candle in the wind, dimmed, then vanished utterly. Without pain or warning, this philosopher who wove our early civilization with logic, seemed to exhaust the planet's last gift, peacefully merging into [Owner.GetHomeWorldName]'s eternal shadow."
 libra_origin.0411.a: "Hold a grand funeral."
 libra_origin.0411.b: "Erect a monument."
 libra_origin.0411.c: "May [Root.GetHeShe] rest in peace."
 libra_origin.0412.name: "Resonance Overload"
 libra_origin.0412.desc: "[Owner.GetHomeWorldName]'s resonance network detected a violent, targeted energy backlash against [Root.GetName]'s consciousness. This philosopher who reshaped early society with reason endured core-whispers exceeding tolerance in an instant. [Root.GetHisHer] existence flared like a supernova, then vanished, leaving only shrill harmonic alarms and a thought-echo within the planet's pulse."
 libra_origin.0412.a: "Establish a Monument of Silence."
 libra_origin.0412.b: "Archive the data."
 libra_origin.0413.name: "The Setting"
 libra_origin.0413.desc: "[Root.GetName] sensed life's approach to its end, arranging affairs beforehand. As a final wish, [Root.GetHeShe] returned to [Owner.GetHomeWorldName]'s homeland to watch the sunset one last time."
 libra_origin.0413.a: "We will remember [Root.GetName]."
 libra_origin.0414.name: "Collapsed Philosophy"
 libra_origin.0414.desc: "Philosopher [Root.GetName] sat silently beneath the obelisk's base, [Root.GetHisHer] form dissolving into sapphire dust. [Root.GetHisHer] mind once flowed like planetary veins, now collapsed into nothingness.\n\nNewly glowing words appeared on the monolith: 'Cognition is the shackle.'"
 libra_origin.0414.a: "May [Root.GetHeShe] grasp truth in another world."
 libra_origin.0415.name: "Ripples"
 libra_origin.0415.desc: "Witnesses described [Root.GetName] at [Owner.GetHomeWorldName]'s abyss observatory- [Root.GetHisHer] form grew translucent, resonating irreversibly with the whispers. Finally, [Root.GetHeShe] fused into the bedrock below, leaving only an anomalous, faint ripple in the planet's energy."
 libra_origin.0415.a: "Erect a monument at the site."
 libra_origin.0415.b: "Build a memorial hall."
 libra_origin.0416.name: "Cocoon of Contemplation"
 libra_origin.0416.desc: "Alarms blared from [Root.GetName]'s stasis field. Scans revealed [Root.GetHisHer] consciousness experienced exponential information entropy increase, exceeding [Root.GetHisHer] immortal framework. Our great commander, seeking to comprehend transdimensional structures, dissolved into an indecipherable chaos of light."
 libra_origin.0416.a: "Can we truly escape the cage?"
 libra_origin.0417.name: "Warp"
 libra_origin.0417.desc: "A brief but intense spacetime distortion engulfed [Root.GetName]'s vicinity. When it subsided, the commander and the surrounding coordinates vanished. Deep scans detected only a faint echo bearing [Root.GetHisHer] cognitive signature - seemingly from the distant future - before fading into absolute void. The planet's whisper seemed to pause."
 libra_origin.0417.a: "Record this echo."
 libra_origin.0417.b: "Construct a landmark there."
 libra_origin.0418.name: "Silent Passing"
 libra_origin.0418.desc: "Like a program reaching its end, [Root.GetName]'s life-sign ceased without warning during routine maintenance. Diagnostics showed [Root.GetHisHer] immortal core intact, but the 'spark' sustaining [Root.GetHimHer] for millennia had quietly extinguished. The pathfinder who reshaped our cognitive landscape had reached the end of crystallized time."
 libra_origin.0418.a: "Arrange the funeral rites."
 libra_origin.0418.b: "Build a memorial hall for remembrance."
 libra_origin.0419.name: "The Final Insight"
 libra_origin.0419.desc: "The scientist cheered within the obelisk lab: 'I've touched the world's core!' Instantaneous light consumed the pinnacle. The next day, only [Root.GetHisHer] crystallized right hand pointing skyward was found, an unfinished energy topology equation scorched into the floor tiles beneath."
 libra_origin.0419.a: "Secure the crystalline remains."
 libra_origin.0440.name: "Abyss of Wisdom"
 libra_origin.0440.desc: "Some voices suggest the changes beneath our homeworld are linked to our current situation. Organizing an investigation seems prudent, but first we must explore the rift to safely access the depths."
 libra_origin.0440.a: "Prepare the operation."
 libra_origin.0441.name: "Survey Plan"
 libra_origin.0441.desc: "After over a decade of meticulous geological surveys, we've charted a viable path into the abyss - where our civilization's first philosophers originated. Our research team stands ready, requiring only an experienced scientist to lead."
 libra_origin.0441.a: "Authorization granted."
 LIBRA_ENLIGHTENMENT_WISDOM_PROJECT: "Exploring the Silent Abyss"
 LIBRA_ENLIGHTENMENT_WISDOM_PROJECT_DESC: "Seek the source of mysterious energy, uncovering why it sheltered us yet now fades."
 libra_origin.0442.name: "Sphere of Divinity"
 libra_origin.0442.desc: "A decade was once a fleeting moment for us, now it feels eternal. Our research team advanced through volatile strata, reaching the planetary core after immense hardship.\n\nBefore them lies a cavern of unknown crystals, radiating an illusory violet-red hue yet impervious to all tools - sampling is impossible. At its center floats a palm-sized sphere, radiating intense presence yet rejecting proximity, as if merely... a projection.\n\nThe space swirls with ephemeral thoughts carried by psionic-like forces: condensed echoes of our millennia-long history. The earliest fragments reveal forgotten truths - a §Ymillennia-spanning cycle§! of heroes. They emerge, guide civilization, then depart, making way for successors. The boon is unpredictable, yet persists through our perseverance."
 libra_origin.0442.a: "An epic cycle."
 libra_origin.0442.tt: "$libra_enlightenment_wisdom_unlock_building$\nLeaders gain experience over time and may awaken §dRadiant Traits§! while §Y[FromFrom.GetName]§! remains under our control"
 libra_origin.0450.name: "Even the Wisest May Err"
 libra_origin.0450.desc: "Time flows on quietly, and [Root.GetName] has passed another thirty-six years under the guidance of the beacon. Calamities, natural or man-made, cannot interrupt the progress of our civilization. The Radiance of Philosophy shall endure forever."
 libra_origin.0450.a: "Pay Our Reverence."
 libra_enlightenment_wisdom_mod_1: "Reverence for the Wise"

# crimson nights

 origin_libra_crimson_nights: "Crimson Nights"
 origin_libra_crimson_nights_text: "The history is washed away by cold holy water, the past is buried by merciless flames, the body is imprisoned by heavy coffins, and the mind is shaken under heavy seals ...... Until time dilutes the curse and corrupts the holy seal, and finally, we break the bonds.\nNow that the red moon has reappeared - be careful, don't fall asleep."
 origin_libra_crimson_nights_desc: "$origin_libra_crimson_nights_text$\n$libraf_or_banner_5$"
 origin_libra_crimson_nights_effects: "- $SPECIES_TRAITS$ ['concept_libra_crimson_nights_traits']\n- $libra_traditions$['concept_libra_crimson_nights_tradition']\n- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_crimson_nights']\n- $STARTING_PLANET$ ['concept_libra_crimson_nights_infrastructure']\n- $libra_extra_council_position$['concept_councilor_libra_crimson_nights']"
 origin_libra_crimson_nights_negative_effects: "- Decreases the £opinion£ §YOpinion§! from other empires by §R-200§!\n- Planets colonised or captured: ['concept_libra_crimson_nights_planet_sideeffect'] Planetary Modifier"
 START_SCREEN_LIBRA_CRIMSON_NIGHTS: "The past may be glory to others and nothingness to [this.GetSpeciesName].\n\\nWithout reason, everything we have in the twinkling of an eye goes up in smoke, and by the time we revive again, [this.GetHomeWorldName]has long since been emptied of people, and only some ruins and wilderness remain. However, the Bloods are powerful, and each mature individual of [this.GetSpeciesName] is capable of doing the work of several other species, and even if only a small fraction of us woke up, it would be more than enough to complete the revival.\n\nAt the beginning of the recovery [this.GetSpeciesName] we suffered from a paucity of food, but this could not defeat us: in the midst of hunger we learnt to endure and to wait, and to know how to be able to restrain instincts that we used to be unable to resist. Nevertheless, patience is not a permanent solution, and in order to solve this problem, we turn our eyes to the sky above us.\n\nNow that the means of interstellar navigation are complete, we awaken our still-sleeping companions to pursue a simple and straightforward goal: to set foot in the Urantia region and regain what was lost."
 libra_origin.0511.name: "Primordial Memory"
 libra_origin.0511.desc: "In the past, we longed for ......"
 libra_origin.0511.a: "Endless blood."
 libra_origin.0511.b: "Infinite power."
 libra_origin.0511.c: "Endless servants."
 libra_origin.0511.d: "Infinite glory."
 libra_origin.0512.name: "Recent Flashbacks"
 libra_origin.0512.desc: "Then we achieved ......"
 libra_origin.0512.a: "Gorgeous ruins."
 libra_origin.0512.b: "Finite prosperity."
 libra_origin.0512.c: "Divided world."
 libra_origin.0512.d: "Empty academics."
 libra_origin.0513.name: "The Present"
 libra_origin.0513.desc: "A look at our past, that's ......"
 libra_origin.0513.a: "Ridiculous farce."
 libra_origin.0513.b: "Magnificent epic."
 libra_origin.0513.c: "Sentimental tragedy."
 libra_origin.0513.d: "Supreme Legend."
 libra_origin.0514.name: "Future Prospects"
 libra_origin.0514.desc: "Regardless of past successes and failures.\n\nRegardless of historical twists and turns.\n\nThe return of us that are going to be:"
 libra_origin.0514.a: "Forge a whole new level of greatness."
 libra_origin.0514.b: "Liquidate all sins."
 libra_origin.0514.c: "Fulfilment of unfinished business."
 libra_origin.0514.d: "Explore a whole new universe."
 libra_origin.0514.e: "Continuing the tradition of honour."
 libra_origin.0543.name: "Results Of The Revival"
 libra_origin.0543.desc: "In recent years, we have done ......"
 libra_origin.0543.a: "Maximum efficiency."
 libra_origin.0543.b: "Stable logistics."
 libra_origin.0543.c: "Long-lasting satiety."
 libra_origin.0543.d: "Common secrets."
 libra_origin.0544.name: "Impressions Again"
 libra_origin.0544.desc: "Then we are called ......"
 libra_origin.0544.a: "Phantom of the Void."
 libra_origin.0544.b: "Lord of the Abyss."
 libra_origin.0544.c: "Smith of the Battlefield."
 libra_origin.0544.d: "Judge of the Rhythm."
 libra_origin.0545.name: "Promises of the Hereafter"
 libra_origin.0545.desc: "Ultimately, we are committed to ......"
 libra_origin.0545.a: "Wise choice."
 libra_origin.0545.b: "Good collaboration."
 libra_origin.0545.c: "Sharpened execution."
 libra_origin.0545.d: "Forge ahead."
