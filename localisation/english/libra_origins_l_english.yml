 libra_origin.0542.name: "Reign Over"
 libra_origin.0542.desc: "Longing on crimson, demonic in the midnight, instantaneous shadow under the toothy moon, sharp, sharp fangs, blood-red evil eyes, enjoying the sweet liquid in the goblet ......\n\nWe, the kings of the night, the supreme privilege."
 libra_origin.0542.a: "Heh, vampires."
 libra_origin.0542.b: "Elegance and mystery, a whole new chapter."
 libra_origin.0542.c: "Cheers."
