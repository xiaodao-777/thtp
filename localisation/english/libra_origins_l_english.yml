# centurion

 origin_libra_centurion: "Centurion"
 origin_libra_centurion_text: "Courage, forged into the blade of the broken army; discipline, the creation of eternal barriers; forward, in order to win the glory.\nWe were born for the battle, if we can't make it into history, we must kill ourselves to become benevolent, never run away from the battle, never hope to survive."
 origin_libra_centurion_desc: "$origin_libra_centurion_text$\n$libraf_or_banner_18$"
 origin_libra_centurion_effects: "- $libra_army_type$['concept_libra_centurion_army']\n- $STARTING_PLANET$£building£ ['building:building_libra_centurion_mirror']\n- $libra_extra_council_position$['concept_councilor_libra_primus_pilus'], ['concept_councilor_libra_praetorian_commander']\n- $libra_decision$\n$t$- §Y$decision_libra_centurion_a$§!, increases §YCouncil Agenda Progress§!\n$t$- §Y$decision_libra_centurion_b$§!, increases §Y$planetary_ascension$§!\n$t$- §Y$decision_libra_centurion_c$§!, gain £alloys£ £consumer_goods£ £trade£ output\n$t$- §Y$decision_libra_centurion_d$§!, provides experience to £leader£ §YLeaders§!\n- Gains decision uses from the following sources:\n$t$- Conquer a planet: §G+1§! each time\n$t$- Destroy a civilization: §G+2§! each time\n$t$- Wage war: §G+3§! every §Y13§! years\n$t$- Passage of time: §G+1§! every §Y8-10§! years\n- Unlocking ['concept_libra_military_traditions'] requires no §Yprerequisite technology§!, and triggers §Yadditional events§! upon completion."
 START_SCREEN_LIBRA_CENTURION: "Have you ever heard the sound of guns firing? That is the music that the weak fear and the strong aspire to.\n\nIn this world of the weak and the strong, one's own safety can only be ensured by one's own strength, otherwise any vision is just like the yellow flowers of tomorrow; in this isolated and unsupported universe, the only strong is the foundation of self-reliance, otherwise everything is just like a floating cloud that comes and goes.\n\nWar, is the best way to realize the value of every [this.GetSpeciesName] life: it gives us an enduring entertainment, a goal of professionalism, so that we are always united as one. For thousands of years, the soldier has always been the hottest profession, the general has never been the noblest dream, and the battlefield, the most honorable vocation - or graveyard.\n\nThe dome of the sky long view peaks smoke over, purple zeus report to visit the blood and iron exist."
