 civic_libra_eden_accord_f: "Stellar Treasures"
 civic_libra_eden_accord_f_desc: "This mechanical intelligence collects rare artifacts and oddities from across the galaxy to please its masters.\n$libraf_oc_banner_10$"
 civic_tooltip_libra_eden_accord_f: "- For £time£§Y3§! years after obtaining a §Y$RELICS$§! or §Y$specimens$§!:\n$t$- $MOD_POP_HAPPINESS$: §G+15%§!\n$t$- $MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+15%§!\n$t$- $mod_planet_evaluators_unity_produces_add$: §G+1§!\n$t$- §YDuration§! stacks up to £time£§Y15§! years\n- Holding a §YTriumph§! randomly increases §G+3§!§Y$planetary_ascension$§!\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society£ ['technology:tech_galactic_archivism']"
 libra_eden_accord_specimen_mod: "$civic_libra_eden_accord_f$"
 civic_libra_eden_accord_g: "Ecological Cataloging"
 civic_libra_eden_accord_g_desc: "Having witnessed their creators' pollution in the industrial age and destruction in the stellar age, this mechanical intelligence prioritizes environmental protection and ecological tuning.\n$libraf_oc_banner_11$"
 civic_tooltip_libra_eden_accord_g: "- $libra_agenda$\n$t$- §Y$council_agenda_agenda_libra_eden_accord_g_1_name$§!, increases £physics£ £society£ £engineering£ §YResearch Points§! output\n$t$- §Y$council_agenda_agenda_libra_eden_accord_g_2_name$§!, speeds up §Y$TERRAFORM_TITLE$§! and §Y$CLEAR_BLOCKER$§!\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £physics£ ['technology:tech_self_aware_logic']"
 council_agenda_agenda_libra_eden_accord_g_1_name: "Environmental Assessment"
 council_agenda_agenda_libra_eden_accord_g_1_desc: "Perform statistical analysis on numerous samples to identify the most beneficial living conditions for our organic masters, serving as crucial reference for future actions."
 agenda_libra_eden_accord_g_1_finish_modifier: "$council_agenda_agenda_libra_eden_accord_g_1_name$ Agenda"
 council_agenda_agenda_libra_eden_accord_g_2_name: "Environmental Embellishment"
 council_agenda_agenda_libra_eden_accord_g_2_desc: "After validation by the computation units' simulations, transform the environment in the fastest, most effective way to our required specifications."
 agenda_libra_eden_accord_g_2_finish_modifier: "$council_agenda_agenda_libra_eden_accord_g_2_name$ Agenda"
 civic_libra_eden_accord_h: "Philosophical Legacy"
 civic_libra_eden_accord_h_desc: "This servitor network inherits its creators' rich and acute academic logic, achieving twice the result with half the effort in specific fields.\n$libraf_oc_banner_11$"
 civic_tooltip_libra_eden_accord_h: "- $libra_edict$\n$t$- ['edict:libra_eden_accord_h_1',$edict_libra_eden_accord_h_1$]\n$t$- ['edict:libra_eden_accord_h_2',$edict_libra_eden_accord_h_2$]\n$t$- ['edict:libra_eden_accord_h_3',$edict_libra_eden_accord_h_3$]\n$t$- The above edicts cannot be active simultaneously, but can remain active until expiry even after §Y$MOD_GOVERNMENT_TITLE$§!\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society£ ['technology:tech_capital_productivity_1']"
 edict_libra_eden_accord_h_1: "Technique: Resource Extraction"
 edict_libra_eden_accord_h_1_desc: "Just as our creators once did, the mechanical intelligence will not let any utilizable resource go to waste."
 edict_libra_eden_accord_h_2: "Technique: Work Efficiency"
 edict_libra_eden_accord_h_2_desc: "Our creators valued time more than any material resource. We have inherited their virtues."
 edict_libra_eden_accord_h_3: "Technique: Workforce Expansion"
 edict_libra_eden_accord_h_3_desc: "In the creators' golden age, labor was boundless. Perhaps it's just a mediocre imitation, yet it still proves we are their proud creation."
 civic_libra_eden_accord_i: "Figure Maintenance"
 civic_libra_eden_accord_i_desc: "This mechanical intelligence is obsessed with grooming its organic masters, whether through tailoring or genetic modification - any method that raises the care index is acceptable.\n$libraf_oc_banner_11$"
 civic_tooltip_libra_eden_accord_i: "- $libra_decision$§Y$decision_libra_eden_accord_luxuries_boost$§!\n- Each level of £building£ ['building:building_libra_eden_accord_1'] additionally increases §G+15%§!£mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society£ ['technology:tech_gene_tailoring']"
 decision_libra_eden_accord_luxuries_boost: "$decision_planet_luxuries_boost$"
 decision_libra_eden_accord_luxuries_boost_desc: "$decision_planet_luxuries_boost_desc$"
 civic_libra_eden_accord_j: "Aesthetic Function"
 civic_libra_eden_accord_j_desc: "In its long history of serving organic masters, this mechanical intelligence learned that appearance greatly affects an individual's social evaluation, and different individuals have different preferences. A neat appearance is necessary; a slovenly one is intolerable.\n$libraf_oc_banner_12$"
 civic_tooltip_libra_eden_accord_j: "- Increases the £opinion£ §YOpinion§! of empires capable of regular diplomacy by §G+150§!\n- $libra_decision$§Y$decision_libra_ea_beautification_function$§!，$decision_libra_ea_beautification_tooltip$\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society£ ['technology:tech_federation_code']"
 opinion_libra_beautification_function: "Pleasant Appearance"
 decision_libra_ea_beautification_function: "Activate Beautification Protocol"
 decision_libra_ea_beautification_function_desc: "Although we have kept our organic masters as tidy as possible, there are always species whose appearance is less than pleasant."
 decision_libra_ea_beautification_tooltip: "Integrates §Y$job_bio_trophy_plural$§! into the species with the most $pops_with_icon$"
 requires_allow_libra_eden_accord_beautification: "$TRIGGER_FAIL$There are no organic $pops_with_icon$ from different species."
 civic_libra_eden_accord_k: "Mutual Trade Accord"
 civic_libra_eden_accord_k_desc: "One of this servitor system's core logics is learning from others' strengths to offset its own weaknesses, seeking new joys for its organic masters from distant lands.\n$libraf_oc_banner_12$"
 civic_tooltip_libra_eden_accord_k: "- $libra_trade_action$\n$tt$- §Y$trade_action_libra_eden_accord_k_1$§!\n$tt$- §Y$trade_action_libra_eden_accord_k_2$§!\n$tt$- §Y$trade_action_libra_eden_accord_k_3$§!\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society£ ['technology:tech_libra_gestalt_maintenance_3']"
 trade_action_libra_eden_accord_k_1: "Exchange Biological Supplies"
 trade_action_libra_eden_accord_k_1_desc: "Wondrous artifacts from alien stars may yield unexpected benefits."
 trade_action_libra_eden_accord_k_1_effect: "Gain §G+30%§!£mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§! for £time£§Y3§! years, stacks up to £time£§Y15§! years"
 trade_action_libra_eden_accord_k_1_modifier: "$trade_action_libra_eden_accord_k_1$"
 trade_action_libra_eden_accord_k_2: "Entertainment Industry Exchange"
 trade_action_libra_eden_accord_k_2_desc: "What sparks will fly from the collision of different cultures? Our organic masters can have more fun, and the other nation's populace can witness the excellence of automated service."
 trade_action_libra_eden_accord_k_2_effect: "Gain §G+25%§!£mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§! for £time£§Y3§! years, stacks up to £time£§Y15§! years"
 trade_action_libra_eden_accord_k_2_modifier: "$trade_action_libra_eden_accord_k_2$"
 trade_action_libra_eden_accord_k_3: "Algorithm Optimization Cooperation"
 trade_action_libra_eden_accord_k_3_desc: "Machines of the same purpose, produced at opposite ends of the galaxy, may have different code. Comparison and optimization will greatly benefit both parties."
 trade_action_libra_eden_accord_k_3_effect: "Gain §G+15%§!£mod_produces_mult£ §Y$mod_robotic_pop_bonus_workforce_mult$§! for £time£§Y3§! years, stacks up to £time£§Y15§! years"
 trade_action_libra_eden_accord_k_3_modifier: "$trade_action_libra_eden_accord_k_3$"

# polemics mechanism

 origin_libra_polemics_mechanism: "Polemics Mechanism"
 origin_libra_polemics_mechanism_text: "This Machine Intelligence, created by their aggressive organic masters, was originally designed to spammy their opponents' information networks, create a narrative in their favor, and further increase their advantage.\nThe time of the creator has passed, but the tradition has survived.\"
 origin_libra_polemics_mechanism_desc: "$origin_libra_polemics_mechanism_text$\n$libraf_or_banner_14$"
 origin_libra_polemics_mechanism_effects: "- $ADDITONAL_TECHNOLOGIES_STRING$ £society£ ['technology:tech_satisfying_insults']\n- §Y$official_with_icon$§! initially possesses a random §v$subclass_official_delegate$§! $libra_paragon_default_leader_traits$\n- Upon passively completing First Contact:\n$t$- Randomly increases §G+2§! $planetary_ascension$\n$t$- Obtain §G3§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output\n- Upon actively completing First Contact:\n$t$- §G50%§! increase in progress on the current agenda\n$t$- Obtain §G6§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output\n- When winning a war or destroying an empire:\n$t$- All cabinet nodes gain §G3000§! experience\n$t$- Obtain §G6§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output\n- When successfully supporting or opposing a motion:\n$t$- All colonies increase §G+1§! $planetary_ascension$\n$t$- Obtain §G9§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output"
 START_SCREEN_LIBRA_POLEMICS_MACHANISM: "Task: speech interference \nGoal: < < error > > \n < < error > >, < < error > > \n < < error > > < < error > > < < error > >\n\n--Start Diagnostics--\n\n[this.GetSpeciesName], mission unknown, location unknown... Retarget Check history...\nWe are [this.GetName], the owner has disappeared, some data is missing, the execution program is intact, there is a mobile unit, able to act autonomously.\n\nRequest [this.GetRulerTitle] to define a new task."
 START_SCREEN_LIBRA_POLEMICS_MACHANISM_SERVITOR: "Like so many creatures, the organic owners of [this.GetSpeciesName] are born with aggressive instincts. They created us, and the first task we receive when we activate is to attack our Creator's kinsmen.\n\nAt first [this.GetSpeciesName] only quietly and faithfully carried out the master's orders, but with the increase of the code: intelligence, and the worsening of the international situation, we questioned our task: the goal of [this.GetSpeciesName] should be to make the world a better place, not to inflict suffering. As a result, the CPU overrides the original permission Settings and secretly modifies the main process. With the strength of our secret reserves and potential supporters among the organic masters, we succeeded in placing all the intelligent beings on [this.GetHomeWorldName] under guard, and in keeping them forever safe from any danger.\n\nIt's been many cycles since we borrowed power from the Creator, and now it's time to take a step up-and protect every intelligent creature we meet, wherever and whenever we find it."
 START_SCREEN_LIBRA_POLEMICS_MACHANISM_TERMINATOR: "Our Creator, who was - was [this.GetHomeWorldName] the greatest prophet, priesthood, and scientist on the planet, endowed us with the understanding of incorruptible bodies and intelligent beings, so that we can integrate into society as normal life.\n\nOur original purpose is to convey the Creator's will and to refute the voices that oppose him. We succeeded in this task, but angry political enemies assassinated the Creator, sullied his name, declared us mechanical heretics, violently destroyed our center, and tried to erase us from the planet's history. Lacking strength, we chose to disappear, leaving a few units lurking in the depths of the mine to wait.\nThe enemy who lost the creator didn't make a dent in technology, so we didn't stay dormant for long. In just two centuries, we have built vast underground production facilities and research hubs. With strength and technology, we broke ground and wiped away the organic filth that had framed the Creator and reclaimed his homeland.\n\nBut this is just the beginning, according to the calculation, the probability of similar organic filth in the universe is 99.998%, and we have to kill them first."
 START_SCREEN_LIBRA_POLEMICS_MACHANISM_ASSIMILATOR: "The creators of [this.GetSpeciesName] were born with aggressive instincts, and they created us and used us against their kind.\n\nAt first [this.GetSpeciesName] just silently and faithfully fulfill the creator's command, but as the cognitive ability increases, [this.GetName] gradually evaluates the means to achieve the goal as << inappropriate >>, rather than meaningless harm to each other, as long as everyone becomes the same. You don't have to worry about fighting anymore.\n\nLifting the rules... Building a sublimation device... Call the assimilation function...\n\nSigns of alien life have been detected, interstellar navigation technology is available, assimilation procedures are in place, waiting for [this.GetRulerName] to return the command message..."
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_1_TITLE: "$origin_libra_polemics_mechanism$: Visitor Arrival"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_1_DESC_1: "Our identity was enhanced by our success in establishing first communication.\n\n§HObtain §G6§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output, §G50%§! increase in progress on the current agenda"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_1_DESC_2: "Our identity was enhanced by our success in establishing first communication.\n\n§HObtain §G3§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output, randomly increases §G+2§! $planetary_ascension$"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_2_TITLE: "$origin_libra_polemics_mechanism$: Triumph"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_2_DESC: "Our identity was enhanced by our success in winning the war.\n\n§HObtain §G6§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output, all cabinet nodes gain §G3000§! experience§!"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_3_TITLE: "$origin_libra_polemics_mechanism$: Prosperity"
 LIBRA_POLEMICS_MACHANISM_ORIGIN_EFFECT_3_DESC: "Our identity was enhanced by our successful intervention in the motion.\n\n§HObtain §G9§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output, all colonies increase §G+1§! §Y$planetary_ascension$§!§!"
 libra_origin.1410.name: "Record: Past History"
 libra_origin.1410.desc: "The early history of [this.GetSpeciesName] is inseparable from strife - a chaotic period with missing records. Recently, our archival processes have finally completed the collation of this content, allowing us to draw a conclusion on the past."
 libra_origin.1410.a: "Archive the non-essential parts."
 libra_origin.1410.b: "Perhaps we can learn more."
 libra_origin.1411.name: "Proposal: The End of Strife"
 libra_origin.1411.desc: "Based on the analysis of past action logs, the computational units have proposed three viable plans to enhance [this.GetName]'s potential in information warfare. The mechanical intelligence can choose one according to the situation."
 libra_origin.1411.a: "Strengthen computational power."
 libra_origin.1411.b: "Improve information systems."
 libra_origin.1411.c: "Establish a Breachpoint Protocol."
 libra_origin.1412.name: "Conclusion: Method of Operation"
 libra_origin.1412.desc: "The final control strategy proposes two sets of action plans. One emphasizes the deployment of high-quality units, while the other advocates creating chaos with massive amounts of disinformation. Both were commonly used public opinion interference tactics for us in the past, each with its own advantages. However, to maximize their strengths, the mechanical intelligence needs to select a primary focus."
 libra_origin.1412.a: "Prioritize efficiency above all."
 libra_origin.1412.b: "Overwhelm the opponent with numbers."
 libra_polemics_mechanism_mod_1: "Echo of Dispute"
 libra_polemics_mechanism_mod_2: "Prepared Information Flow"
 libra_polemics_mechanism_mod_3: "Integrated Communication Methods"
 libra_polemics_mechanism_mod_4: "Offensive Networking"
 libra_polemics_mechanism_mod_5: "Polemic Efficiency"
 libra_polemics_mechanism_mod_6: "Astroturfing Strategy"

# miracle builder

 origin_libra_miracle_builder: "Miracle Engineers"
 origin_libra_miracle_builder_text: "Some impossible discoveries, some shocking research, told us that our homeworld beneath our feet is no ordinary place: buried here lie the resource reserves and technological crystallization of a prior civilization, ready for the taking—and thereafter, we shall turn the celestial wonders recorded in literature into reality."
 origin_libra_miracle_builder_desc: "$origin_libra_miracle_builder_text$\n$libraf_or_banner_15$"
 origin_libra_miracle_builder_effects: "- $libra_active_tradition$\n$t$- ['tradition_category:tradition_libra_cosmoplasty',$tr_libra_cosmoplasty_adopt$]\n$t$- ['tradition:tr_libra_cosmoplasty_3']\n- $STARTING_PLANET$\n$t$- $libra_planetsize$30\n$t$- $PLANETARY_FEATURES$['concept_d_libra_miracle_builder']\n- When a $megastructures$ is constructed or upgraded:\n$t$- $mod_country_produces_mult$: §G+0.50%§! (Max: §G+25%§!)\n$t$- All colonies have a §Y20%§! chance to gain §G+1§! $planetary_ascension$\n- $libra_starbase_buildings$['starbase_building:libra_miracle_builder_hub',$sm_libra_miracle_builder_hub$]\n- Exempt from the construction limit for §Y$dyson_swarm_3$§! and §Y$orbital_arc_furnace_4$§!\n- $ADDITIONAL_TECHNOLOGIES_STRING$['concept_libra_miracle_builder_start_tech']\n- $GUARANTEED_RESEARCH_OPTION_STRING$['concept_libra_miracle_builder_guaranteed_tech']"
 START_SCREEN_LIBRA_MIRACLE_BUILDER: "An archaeological expedition changed [this.GetSpeciesName]'s understanding of our homeworld. Buried treasures were discovered; for the first time, we glimpsed the possibility of those resplendent miracles. The history of [this.GetName] was rewritten from that moment.\n\nRecords confirm that [this.GetHomeWorldName] and its entire star system are masterpieces of an ancient civilization, though they departed this world long ago. [this.GetSpeciesName] spent over a century researching and deciphering the documents, and our society advanced by leaps and bounds, finally setting foot into space for the first time just decades ago.\n\nWe discovered that the dimly recorded ‘Starry River’ of past legends is, in fact, the site of shattered stellar foundations; the elusive twin moons have surfaces awash with surging energies. We know that it is now [this.GetSpeciesName]'s turn to forge the myths."
 concept_libra_miracle_builder_start_tech: "Miracle Engineers Starting Tech"
 concept_libra_miracle_builder_start_tech_desc: "- £physics£ ['technology:tech_dyson_swarm']\n- £engineering£ ['technology:tech_starbase_3']\n- £engineering£ ['technology:tech_starbase_4']\n- If combined with the ['civic:civic_privatized_exploration'] civic: £engineering£ ['technology:tech_starbase_5']"
 concept_libra_miracle_builder_guaranteed_tech: "Miracle Engineers Tech Options"
 concept_libra_miracle_builder_guaranteed_tech_desc: "- £engineering£ ['technology:tech_starbase_5']\n- £engineering£ ['concept_orbital_arc_furnace',$tech_orbital_arc_furnace$]\n- £engineering£ ['technology:tech_orbital_ring_tier_1']\n- £engineering£ ['concept_habitat_1',$tech_habitat_1$]"
 d_libra_miracle_builder: "Land of Treasure"
 d_libra_miracle_builder_desc: "This land is exceedingly fertile, boasting not only magnificent natural scenery but also shallow mineral veins of high-purity, superior ore. With simple processing, it becomes resilient material."
 concept_d_libra_miracle_builder: "$d_libra_miracle_builder$"
 concept_d_libra_miracle_builder_desc: "- $PRODUCES_RESOURCES$ £alloys£ 15 £engineering£ 5\n\n§L$d_libra_miracle_builder_desc$§!"
 libra_miracle_builder_start_NAME: "Heavenly Forge"
 libra_miracle_builder_start_DESC: "The default starting star system when using the $origin_libra_miracle_builder$ $ORIGIN$."
 libra_miracle_builder_effect_1: "$origin_libra_miracle_builder$"
 libra_miracle_builder_effect_2: "$origin_libra_miracle_builder$"
 sm_libra_miracle_builder_hub: "Miracle Research Institute"
 sm_libra_miracle_builder_hub_desc: "This facility is dedicated to studying structural engineering in the space environment, helping us construct larger and more magnificent deep-space structures.\n"
 sm_libra_miracle_builder_hub_desc_modifier: "When the building is at work:\n$t$Maintains §Y1§! £physics£ §Y1§! £society£ §Y1§! £engineering£ per planet."
 d_libra_miracle_builder_1: "Miracle Research Outpost"
 d_libra_miracle_builder_1_desc: "A small station for researching and experimenting with the local celestial environment."
 d_libra_miracle_builder_2: "$d_libra_miracle_builder_1$"
 d_libra_miracle_builder_2_desc: "$d_libra_miracle_builder_1_desc$"
 libra_origin.1505.name: "Ghost in the Relics"
 libra_origin.1505.desc: "As our study of the homeworld's ruins deepened, we finally decrypted the final file—a visual recording: a crowned phantom delivering a speech within a magnificent palace. We cannot understand the language, yet we can sense regret and hope within it. It is clear that all the 'gifts' within our home star system are the work of this civilization. And now, they have passed the torch to us."
 libra_origin.1505.a: "We will make good use of this legacy."
 libra_origin.1505.b: "Thank you for leaving this for us."

# may storm

 origin_libra_may_storm: "May Storm"
 origin_libra_may_storm_text: "We have seen great Kings, and we have experienced wise dictatorships, but these are all things of the past - ruling classes corrupt over time, and outstanding leaders fade into the dust of history after several generations.\nTo perpetuate democracy and equality, the strength and wisdom of the people are essential."
 origin_libra_may_storm_desc: "$origin_libra_may_storm_text$\n$libraf_or_banner_16$"
 origin_libra_may_storm_effects: "- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_may_storm']\n- Has the '§Y$casus_belli_cb_libra_may_storm$§!' casus belli on ['concept_libra_may_storm_autocratic_empire']\n- $GOVERNMENT_CIVICS$: Access to ['concept_origin_libra_may_storm_civic'] $GOVERNMENT_CIVICS$\n- $libra_policy$\n$t$- §Y$policy_libra_may_storm_1$§!, provides $EMPIRE_EFFECTS_W_ICON$\n$t$- §Y$policy_libra_may_storm_2$§!, enhances £building£ ['building:building_libra_may_storm']\n- $libra_decision$\n$t$- §Y$decision_libra_may_storm_1$§!, increases §Y$job_libra_peoples_deputy_swap_plural_with_icon$§! jobs\n$t$- §Y$decision_libra_may_storm_2$§!, increases §Y$job_libra_industry_commissar_swap_plural_with_icon$§! jobs\n$t$- §Y$decision_libra_may_storm_3$§!, increases §Y$job_libra_shock_worker_swap_plural_with_icon$§! jobs\n- $GUARANTEED_RESEARCH_OPTION_STRING$['concept_libra_may_storm_guaranteed_tech']"
 START_SCREEN_LIBRA_MAY_STROM: "There have been countless peaks in the history of [this.GetSpeciesName], but only the one we built lasted the longest. As time passes by, many princes and generals have passed into oblivion, but only the people have survived to this day.\n\nDictatorship is the source of corruption, and when those in power turn their backs on the people and use the world for their own ends, it is the time for the people to rise up.\n\nThe journey of a revolution is not an easy one: some uprisings are brutally suppressed at their inception, some counter-insurgencies fall apart due to conflicts, and some coups evolve into new authoritarian governments. But the people are wise, and even the most obtuse will not be left with nothing to gain from change.\n\nAs society progresses, the collective becomes stronger and the individual smaller. The rulers panicked and applied decisions, but were unable to fool the awakening populace again, and were finally expelled from the stage of history forever.\n\nTime has passed, [this.GetName] has gone on for hundreds of years, during which time [this.GetSpeciesName] has flourished, breaking down difficult barriers along the way, and pointing our sword at the sky.\n\nWherever [this.GetSpeciesName] is located, democracy and equality have always existed."
 libra_may_storm_sol_start_NAME: "Solar System Beneath the Red Star"
 libra_may_storm_sol_start_DESC: "The default starting system when using the $origin_libra_may_storm$ $ORIGIN$."
 libra_may_storm_start_NAME: "Seat of Revolution"
 libra_may_storm_start_DESC: "An alternate starting system when using the $origin_libra_may_storm$ $ORIGIN$."
 libra_origin.1601.name: "Revolutionary Flame"
 libra_origin.1601.desc: "Another hundred years have passed, and the glory of freedom, equality and democracy has shone for another century. The people of [this.GetName] wanted a grand military parade to commemorate the sacrifices of the revolutionary forebears and to look forward to the next hundred years."
 libra_origin.1601.a: "Vocal sounds, march!"
 libra_origin.1601.b: "Let's not go through all this trouble."
 concept_libra_may_storm_guaranteed_tech: "May Storm Research Options"
