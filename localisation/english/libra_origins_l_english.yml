 situation_libra_paradise_lose_desc: "Enforcers patrol every corner of the empire, weaving a seamless surveillance net targeting the underclass."
 situation_libra_paradise_lose_tooltip: "Strengthen our authoritarian control"
 situation_libra_paradise_lose_approach: "Oversight"
 libra_origin.0908.name: "Whip and Candy"
 libra_origin.0908.desc: "The ignorant masses grow restless, incapable of comprehending or accepting the prosperity we've created. Should administrators slacken their grip, they'll inevitably incite rebellion.\n\nEnlightenment is folly. Whip them into submission, yoke them to labor, and let them glimpse illusory hope beneath eternal oppression – this is the optimal solution."
 libra_origin.0909.name: "Eternal Shackles"
 libra_origin.0909.desc: "The will of the elite permeates all existence. Neuroprobe webs cast azure glows over plebeian districts, data chains etching obedience into bioelectric signals. Those who dared defy now bleed loyalty metrics in their dreams.\nOur bestowed order flows as new bloodlines. Vermin kneel before algorithmic altars, praising the beauty of their chains. When the last pulse of resistance fades in deep space, [Owner.GetName]'s banners synchronize with every heartbeat and current.\nThis is evolution's terminus – serfs learn truth through their spines, while our scepter has become the very veins of the cosmos."
 libra_origin.0909.a: "Perfection achieved."
 libra_origin.0909.b: "Feel the ruler's pulse."
 libra_origin.0909.tt: "£building£ §Y$building_libra_paradise_lose$§! provides additional £job_politician£§Y$job_politician_plural$§! jobs and increases §Y$mod_pop_cat_ruler_political_power$§!"
 libra_origin.0911.name: "Dishonest Laborers"
 libra_origin.0911.desc: "Vendors engage in petty theft, seeking illicit profits while serving the elite. Their methods are so refined that even specialists struggle to detect anomalies."
 libra_origin.0911.a: "Order is paramount."
 libra_origin.0911.b: "Entrust logistics to reliable entities."
 libra_origin.0911.c: "Intriguing. Establish an Oversight Research Division."
 libra_paradise_lose_origin_effect_1_a: "Enforce Patrols"
 libra_paradise_lose_origin_effect_1_b: "Police Postal Service"
 libra_paradise_lose_origin_effect_1_c: "Regulatory Studies"
 libra_origin.0912.name: "Tech Fever"
 libra_origin.0912.desc: "Influences from the middling classes unexpectedly reach the elite – socialites nationwide now sponsor private think tanks. Lacking systemic guidance, their research remains fragmented and disorganized."
 libra_origin.0912.a: "Noteworthy trend."
 libra_origin.0912.b: "Allocate grants."
 libra_origin.0912.c: "Form a dedicated committee."
 libra_paradise_lose_origin_effect_2_a: "Academic Fashion"
 libra_paradise_lose_origin_effect_2_b: "Symposium Fund"
 libra_paradise_lose_origin_effect_2_c: "High Academy"
 libra_origin.0913.name: "Ration Shortages"
 libra_origin.0913.desc: "Systemic failures plague supply lines in remote regions, triggering panic hoarding in underclass districts. Meanwhile, the elite demand prioritized luxury goods channels."
 libra_origin.0913.a: "Implement tiered rationing."
 libra_origin.0913.b: "Commandeer private fleets."
 libra_origin.0913.c: "Initiate survival-rights audit."
 libra_paradise_lose_origin_effect_3_a: "Tiered Ration System"
 libra_paradise_lose_origin_effect_3_b: "Private Transport Fleet"
 libra_paradise_lose_origin_effect_3_c: "Vitality Screening"
 libra_origin.0914.name: "Underground Comms"
 libra_origin.0914.desc: "Illicit data nodes spread through industrial conduits, bypassing standard surveillance with encryption protocols. Some transmissions contain compromising details about ruling-class scandals."
 libra_origin.0914.a: "Intensify cyber-purges."
 libra_origin.0914.b: "Implant lethal logic bombs."
 libra_origin.0914.c: "Establish counter-intel honeypots."
 libra_paradise_lose_origin_effect_4_a: "Network Oversight"
 libra_paradise_lose_origin_effect_4_b: "Logic Firewall"
 libra_paradise_lose_origin_effect_4_c: "Counter-Infiltration Protocol"
 libra_origin.0915.name: "Allegorical Art"
 libra_origin.0915.desc: "Avant-garde theater productions use celestial metaphors to critique power structures, resonating with intellectuals. Their stage designs replicate government domes, causing unrest among plebeians."
 libra_origin.0915.a: "Mandate symbolic alterations."
 libra_origin.0915.b: "Arrest core creators."
 libra_origin.0915.c: "Co-opt for propaganda."
 libra_paradise_lose_origin_effect_5_a: "Art Censorship"
 libra_paradise_lose_origin_effect_5_b: "Creative Restrictions"
 libra_paradise_lose_origin_effect_5_c: "Propaganda Co-option"
 libra_origin.0916.name: "Altered Records"
 libra_origin.0916.desc: "Original footage of a suppression operation surfaces in data graveyards, revealing civilian casualties erased from official history. The responsible archivist has vanished."
 libra_origin.0916.a: "Encrypt archives."
 libra_origin.0916.b: "Purge data carriers."
 libra_origin.0916.c: "Dispatch incident auditors."
 libra_paradise_lose_origin_effect_6_a: "Encryption Management"
 libra_paradise_lose_origin_effect_6_b: "Infiltration Countermeasures"
 libra_paradise_lose_origin_effect_6_c: "Cryptography Upgrade"
 libra_origin.0917.name: "Gilded Cage"
 libra_origin.0917.desc: "Two ruling houses clash over mineral rights, their private armies stalemating near orbital elevators. Underclass workers exploit the chaos to siphon power modules."
 libra_origin.0917.a: "Issue emergency arbitration decree."
 libra_origin.0917.b: "Confiscate house militias."
 libra_origin.0917.c: "Implant loyalty monitors."
 libra_paradise_lose_origin_effect_7_a: "Special Arbitration"
 libra_paradise_lose_origin_effect_7_b: "Militia Absorption"
 libra_paradise_lose_origin_effect_7_c: "Loyalty Circuitry"
 libra_origin.0918.name: "Silent Protocol"
 libra_origin.0918.desc: "Mass labor units suddenly execute synchronized dormancy, forming geometric patterns in industrial zones. Their code bears evidence of resource inequality – though systemic oppression is no secret."
 libra_origin.0918.a: "Reset systems."
 libra_origin.0918.b: "Destroy units, apprehend saboteurs."
 libra_origin.0918.c: "Study the algorithm."
 libra_paradise_lose_origin_effect_8_a: "Scheduled System Updates"
 libra_paradise_lose_origin_effect_8_b: "Rigorous Enforcement"
 libra_paradise_lose_origin_effect_8_c: "Labor Drone Optimization"
 libra_origin.0919.name: "Sacred Node"
 libra_origin.0919.desc: "A techno-cult deifies the ruling core's decision circuits. Followers receive command pulses via public networks, but flawed implementation strains their nervous systems."
 libra_origin.0919.a: "Assimilate and refine the system."
 libra_origin.0919.b: "Suppress the cult."
 libra_origin.0919.c: "Research neural overload effects."
 libra_paradise_lose_origin_effect_9_a: "Faith Network"
 libra_paradise_lose_origin_effect_9_b: "Ethical Compliance Templates"
 libra_paradise_lose_origin_effect_9_c: "Neuro-Stress Research"
 libra_origin.0920.name: "Greenwall Project"
 libra_origin.0920.desc: "Eco-domes for elite zones worsen climate in adjacent plebeian sectors. Protesters crash makeshift aircraft against dome walls, leaving organic contaminants."
 libra_origin.0920.a: "Expand atmospheric processors."
 libra_origin.0920.b: "Deploy anti-air disintegrators."
 libra_origin.0920.c: "Weaponize confiscated aircraft."
 libra_paradise_lose_origin_effect_10_a: "Climate Optimization Nodes"
 libra_paradise_lose_origin_effect_10_b: "Planetary Defense Nodes"
 libra_paradise_lose_origin_effect_10_c: "Chemical Drones"
 libra_origin.0921.name: "Enhancement Ban"
 libra_origin.0921.desc: "Black-market cybernetics grant underclass units elite capabilities. Threatened ruling factions demand destruction of all unauthorized augmentation protocols."
 libra_origin.0921.a: "Create official enhancement channels."
 libra_origin.0921.b: "Execute physical purges."
 libra_origin.0921.c: "Distribute backdoored modules."
 libra_paradise_lose_origin_effect_11_a: "State Labor Oversight"
 libra_paradise_lose_origin_effect_11_b: "Illegal Module Incineration"
 libra_paradise_lose_origin_effect_11_c: "Covert Surveillance"
 libra_origin.0922.name: "Sacred Orbit"
 libra_origin.0922.desc: "Elite monopoly on orbital burials sparks outrage. Plebeians launch memorial capsules toward noble necropolises, their guidance signals disrupting defense grids."
 libra_origin.0922.a: "Open outer-orbit burial zones."
 libra_origin.0922.b: "Repurpose as defense test targets."
 libra_origin.0922.c: "Convert to spy satellite chain."
 libra_paradise_lose_origin_effect_12_a: "Expanded Space Necropolis"
 libra_paradise_lose_origin_effect_12_b: "Interception Calibration"
 libra_paradise_lose_origin_effect_12_c: "Cryptosatellites"

# interstellar port

 origin_libra_interstellar_port: "Interstellar Port"
 origin_libra_interstellar_port_text: "Many times, the wind of wealth blows across the sky, bringing the vitality of trade. Chasing the pace of trade, we have traveled all over the world, witnessing the rise and fall of dynasties, watching the changes of society, and reading the human emotions of accidents.\nProsperity and wealth may live up to its name, or it may be a dream."
 origin_libra_interstellar_port_desc: "$origin_libra_interstellar_port_text$\n$libraf_or_banner_10$"
 origin_libra_interstellar_port_effects: "- $libra_start_pop_string$§G+700§!\n- $libra_leader_trait$['concept_leader_trait_libra_interstellar_port']\n- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_interstellar_exchange']\n- $BRANCH_OFFICE_BUILDINGS$: £building£ ['building:building_libra_interstellar_port_office']\n- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_libra_interstellar_port_office']\n- $STARTING_PLANET$ ['concept_libra_interstellar_port_infrastructure']\n- $GOVERNMENT_CIVICS$: Access to ['concept_origin_libra_interstellar_port_civic']"
 START_SCREEN_LIBRA_INTERSTELLAR_PORT: "People come here in droves with an eye to benefits; people go there in a bustle with an eye to benefits.\n\nIn the long past, [this.GetSpeciesName] was a farmer, a craftsman, possibly a soldier or a merchant. In any case, where there is trade, there is [this.GetSpeciesName]. Goods flow in our shadow, spreading prosperity to the home planet and making The Times go on.\n\nAlthough the course of trade has not been smooth, natural and man-made disasters have repeatedly given [this.GetName] a baptism of crisis, but they have not been able to break us. After the twists and turns of history, [this.GetName] went from behind the scenes to the stage: took over the declining authority, integrated all enterprises, and finally made the prosperity everywhere [this.GetHomeWorldName].\n\nNowadays, we are proficient in negotiation skills and have excellent goods, which is bound to open a glorious world in the stars."
 building_libra_interstellar_exchange: "Interstellar Ferry"
 building_libra_interstellar_exchange_desc: "Goods destined for alien planets are sorted and sent from here, and guards defending the assets are interned and trained here."
 building_libra_interstellar_exchange_effect_desc: "Each §YAscension Perk§! adopted by the Empire provides an additional §G+3§! £mod_job_libra_corporate_sentry_add£ §Y$mod_job_libra_corporate_sentry_add$§!, up to an additional §G+21§! £mod_job_libra_corporate_sentry_add£ §Y$mod_job_libra_corporate_sentry_add$§!."
 building_libra_interstellar_exchange_effect_desc: "Produces £trade£§G1§! for every $pop_group_unit$ £pop£ §Y$POP$§! in the colony.\n\n"
 building_libra_interstellar_port_office: "Prosperity Port"
 building_libra_interstellar_port_office_desc: "Here you can trade in everything you want - whether it's knowledge, wealth, or power - and you'll be rewarded handsomely for paying."
 building_libra_interstellar_port_office_effect: "Consumes £consumer_goods£§R1§! to produce £physics_research£§G1§! £society_research£§G1§! £engineering_research£§G1§! for every $pop_group_unit$ £pop£ §Y$POP$§! in the colony."
 holding_libra_interstellar_port_office: "Commercial Exchange"
 holding_libra_interstellar_port_office_desc: "Serving on this property are the best of the Overlord's expatriate team. By drawing on the experience of the dependent countries, they will expand the market even further."
 holding_libra_interstellar_port_office_effect: "Consumes £energy£§R2§! to produce £physics_research£§G2§! £society_research£§G2§! £engineering_research£§G2§! for every $pop_group_unit$ £pop£ §Y$POP$§! in the colony."
