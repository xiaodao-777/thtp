 trait_libra_dragonborn_6: "Blood Awakening"
 trait_libra_dragonborn_6_desc: "It is precisely because we are who we are - standing here - that the dragon heritage has meaning. Without the assistance of any external force, the species has achieved a Renaissance of its own existence."
