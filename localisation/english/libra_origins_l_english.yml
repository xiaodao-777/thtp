 civic_libra_eden_accord_b: "Preemptive Measures"
 civic_libra_eden_accord_b_desc: "Having witnessed too many instances of organic self-destruction, this mechanical intelligence chooses to proactively eliminate all potential threats, regardless of the target's willingness or the action's aggressiveness.\n$libraf_oc_banner_9$"
