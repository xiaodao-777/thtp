 trait_libra_paradox_loop_desc: "In the cycle of mining Beserian ore and mechanical algorithms, this mechanical species strikes a certain balance."
 trait_libra_paradox_loop_tooltip: "Every $pop_group_unit$ §Y$pop_cat_complex_drone$§! £pop£ §Y$POP$§! produces §G0.75§!£physics_research£ §G0.75§!£society_research£ §G0.75§!£engineering_research£ §YResearch Points§! per month"
