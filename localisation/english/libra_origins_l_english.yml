 decision_libra_centurion_a: "Consolidate Mandate"
 decision_libra_centurion_a_desc: "A nation united in purpose can maximize its advantage in unpredictable situations. We can start with localized efforts to strengthen the empire's cohesion."
 decision_libra_centurion_a_effect: "Gain §G4~100§! £influence£ §Y$influence$§! based on total §Y$origin_libra_centurion$ Decisions§! taken"
 decision_libra_centurion_a_fail: "$TRIGGER_FAIL$Colony Governor is a Council Member"
 decision_libra_centurion_b: "Preach Loyalty"
 decision_libra_centurion_b_desc: "Our history of warfare is filled with praise for heroes and champions, especially those who sacrificed themselves for the nation. Wherever they are, patriotic education will ignite the fervor of our citizens."
 decision_libra_centurion_b_effect: "Increase §Y$planetary_ascension$§! by up to §G+3§! (max §Y9§!)\nGain §G0.25~6§! months' £unity£ §Y$unity$§! based on total §Y$origin_libra_centurion$ Decisions§! taken"
 decision_libra_centurion_c: "Integrate Reserves"
 decision_libra_centurion_c_desc: "Many things cannot be accomplished quickly under normal circumstances, but as an empire with a long military tradition, we face few restrictions in these areas. Mobilizing all forces can always free up the necessary resources."
 decision_libra_centurion_c_effect: "Gain §G8§! months' £alloys£ £consumer_goods£ output\nGain §G600~15000§! £trade£ §Y$trade$§! based on total §Y$origin_libra_centurion$ Decisions§! taken"
 decision_libra_centurion_d: "Refine Strategy"
 decision_libra_centurion_d_desc: "Those precious tactical texts have been passed down and refined through countless generations within our civilization. Their value for reference and education has never diminished."
 decision_libra_centurion_d_effect: "Share §G5000§! experience among all £leader£ §YLeaders§!\nGrant an additional §G40~1000§! experience to §Y$ethic_militarist$§! Leaders based on total §Y$origin_libra_centurion$ Decisions§! taken"
 libra_centurion_event_tt: "§G+3§! §Y$origin_libra_centurion$ Decision§! charges"
 libra_origin.1830.name: "Iron Bastion"
 libra_origin.1830.desc: "Defense is not merely passive waiting. We use our territory as a millstone, grinding invaders into dust and annihilating them utterly. Every fortress, every shield, is a pledge to our homeworld. Our enemies will eventually learn that attempting to breach our lines is like crashing against the eternal rock. We guard not just territory, but conviction itself.\n\nBeneath this starry sky, there is no nobler mission than guardianship. Even if the heavens are stained red with gunpowder and blood, our defenses stand unwavering, like a will forged from steel - immovable. Our enemies can count our numbers, but they cannot measure the resolve with which we protect our home."
 libra_origin.1830.a: "Here, no one shall cross this line."
 libra_origin.1831.name: "Dormancy and Thunder"
 libra_origin.1831.desc: "In the intervals of peace, we sheathe our claws, like a slumbering behemoth, appearing full of openings yet ready to awaken at any moment. The art of strategy lies in choosing when to hide and when to reveal. When the clouds of war gather once more, the strength we have accumulated will erupt with the force of thunder, catching our enemies off guard.\n\nThe truly strong know how to wait in silence and sharpen their fangs in the dark. Peace is not an end, but a deep breath before the next charge. We never indulge in comfort, for every moment of tranquility stores energy for the coming storm."
 libra_origin.1831.a: "Let our enemies fear us in our slumber, and tremble at our awakening."
 libra_origin.1832.name: "Tempered Myriad Times"
 libra_origin.1832.desc: "The clang of metal in the training grounds has long become the heartbeat of the empire. Before every recruit sets foot on the battlefield, they must endure countless trials - from individual combat to legion coordination, from planetary landings to void warfare. The scars of trial become medals of honor; the accumulation of readiness becomes an invisible deterrent. We know that oaths are not just words, but the fundamental creed of a warrior.\n\nThe refining fire has never been extinguished; it burns in the chest of every soldier. Those who survive the limits carry an indelible mark and become the benchmark for those who follow. And we, as their commanders, witness this eternal cycle - each trial drives the legion's foundations a inch deeper, tipping the scales of victory ever so slightly further."
 libra_origin.1832.a: "Let this oath be the proof of our existence."
 libra_origin.1833.name: "Blade of Triumph"
 libra_origin.1833.desc: "The last enemy ship turns to dust among the stars; the horns of victory resound across the galaxy. Yet, amidst the clamor of celebration lies the silence of the graves. We never ask the cost of victory, for the cost itself is part of victory. Each triumph brings us closer to that ultimate goal - proving the meaning of our existence.\n\nGlory lies not only in the blood of enemies, but also in surpassing our own limits. Those who fell paved the path to victory with their lives; those who live shall carry their will forward. War is cruel, but we shall answer its call in the most noble way."
 libra_origin.1833.a: "Victors write history; the vanquished become history."