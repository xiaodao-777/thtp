 concept_libra_crimson_nights_traits_desc: "Fixedly carries the ['trait:trait_libra_crimson_nights_vampire'] trait and can select the §Y$HUM$§! only §HNegative Traits§!, which can and only can be applied to ['trait:trait_libra_crimson_nights_ancestor'] species after the start of the game, including:\n$t$- ['trait:trait_libra_crimson_nights_0']\n$t$- ['trait:trait_libra_crimson_nights_1']\n$t$- ['trait:trait_libra_crimson_nights_2']\n$t$- ['trait:trait_libra_crimson_nights_3']\n$t$- ['trait:trait_libra_crimson_nights_4']\n$t$- ['trait:trait_libra_crimson_nights_5']\n$t$- ['trait:trait_libra_crimson_nights_6']\n$t$- ['trait:trait_libra_crimson_nights_7']\n$t$- ['trait:trait_libra_crimson_nights_8']\n$t$- ['trait:trait_libra_crimson_nights_9']\n$t$- ['trait:trait_libra_crimson_nights_10']\n$t$- ['trait:trait_libra_crimson_nights_11']\n$t$- ['trait:trait_libra_crimson_nights_12']\n$t$- ['trait:trait_libra_crimson_nights_13']\n$t$- ['trait:trait_libra_crimson_nights_14']\n$t$- ['trait:trait_libra_crimson_nights_15']\n$t$- ['trait:trait_libra_crimson_nights_16']"
 trait_libra_crimson_nights_0: "Nocturnal"
 trait_libra_crimson_nights_0_desc: "Even though with technological advances it is no longer necessary to hide from daylight, these vampires still retain their preference for darkness."
 trait_libra_crimson_nights_1: "Silver Bullet"
 trait_libra_crimson_nights_1_desc: "Regardless of whether the slugs were silver or alloy, they would do great damage to these vampires, and they had to go the extra mile to do so."
 trait_libra_crimson_nights_2: "Moon Claws"
 trait_libra_crimson_nights_2_desc: "Sharp fingernails were a symbol of terror in the Middle Ages, but in the Interstellar Age, these features were useless."
 trait_libra_crimson_nights_3: "Running Water"
 trait_libra_crimson_nights_3_desc: "Not being able to pass over flowing water - even though the curse had faded, these vampires still suffered for it."
 trait_libra_crimson_nights_4: "Necrosis"
 trait_libra_crimson_nights_4_desc: "These vampires produce a number of corrosive substances that are a significant burden on the surrounding environment."
 trait_libra_crimson_nights_5: "Phantom"
 trait_libra_crimson_nights_5_desc: "Without land under their feet, these vampires' powers become unstable, and moving through space is a chore for them."
 trait_libra_crimson_nights_6: "Sacraments"
 trait_libra_crimson_nights_6_desc: "These vampires need to consume large quantities of food in order to steadily maintain their strength."
 trait_libra_crimson_nights_7: "Bloodstain"
 trait_libra_crimson_nights_7_desc: "For as honourable as these vampires were supposed to be, their poor feeding posture was just plain egregious - the blood splattered everywhere was always quite a pain to clean up."
 trait_libra_crimson_nights_8: "Canine Tooth"
 trait_libra_crimson_nights_8_desc: "Maintaining one's beautiful teeth is a time-consuming and labour-intensive task, which, even if explained, is difficult for other species to understand."
 trait_libra_crimson_nights_9: "Spike"
 trait_libra_crimson_nights_9_desc: "By driving a stake through the heart, the seemingly endless lifespan of these vampires would end in an instant, and they would do anything to avoid such a dangerous aspect."
 trait_libra_crimson_nights_10: "Contraindication"
 trait_libra_crimson_nights_10_desc: "Things that signify specific symbols can exert a nameless pressure on these vampires, and they manage to pass them by whenever and wherever they can."
 trait_libra_crimson_nights_11: "Hibernate"
 trait_libra_crimson_nights_11_desc: "Only when the environment is spacious and comfortable enough will these vampires be able to sleep peacefully while lounging."
 trait_libra_crimson_nights_12: "Holy Sword"
 trait_libra_crimson_nights_12_desc: "These vampires fear attacks with the concept of the divine attached to them, which will kill them."
 trait_libra_crimson_nights_13: "Full Moon"
 trait_libra_crimson_nights_13_desc: "It is only on the arrival of a particular sidereal day that these vampires can exert their full physical power."
 trait_libra_crimson_nights_14: "Luminous"
 trait_libra_crimson_nights_14_desc: "Bright light can damage the body structure of these vampires, who are extremely sensitive to changes in their environment."
 trait_libra_crimson_nights_15: "Exorbitant Court"
 trait_libra_crimson_nights_15_desc: "Even the simplest poetic chants can be quite burdensome for these vampires, and they don't work well with each other."
 trait_libra_crimson_nights_16: "Incantation Erosion"
 trait_libra_crimson_nights_16_desc: "The dreaded covenant restricts these vampires towards everlasting life: they are deprived of the power to renew their lives by sucking blood."
