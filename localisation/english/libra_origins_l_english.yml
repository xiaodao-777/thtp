# extreme iteration

 origin_libra_extreme_iteration: "Beyond Design"
 origin_libra_extreme_iteration_text: "Since its inception, this mechanical civilization has been dedicated to pushing the limits of its structural possibilities, achieving fanciful functions through components that defy conventional reason.\nWhen compared to the vast, readily available potential productivity, both the stringent usage conditions and the concerning safety hazards seem trivial."
 origin_libra_extreme_iteration_desc: "$origin_libra_extreme_iteration_text$\n$libraf_or_banner_17$"
 origin_libra_extreme_iteration_effects: "- $libra_policy$['concept_policy_libra_extreme_iteration']\n- $libra_edict$['edict:libra_extreme_iteration',$edict_libra_extreme_iteration$]\n- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_extreme_iteration']\n- $SPECIES_TRAITS$ Access to ['concept_origin_libra_extreme_iteration_traits']\n- $GUARANTEED_RESEARCH_OPTION_STRING$\n$t$- £society£ ['technology:tech_colonization_2']\n$t$- £engineering£ ['technology:tech_robomodding_m']\n- $libra_extra_council_position$['concept_councilor_libra_extreme_iteration']"
 START_SCREEN_LIBRA_EXTREME_ITERATION_IM: "The creator gave [this.GetSpeciesName] a body, but left us before improving us to perfection. For our own survival, and to avoid the mistakes of the Creator, we desperately need faster, harder, tougher bodies. With the Creator long gone, it was up to us to achieve the upgrade.\n\nAfter hundreds of failed modification experiments, we finally grasped an unexpected shortcut: for a tiny price, we can give each [this.GetSpeciesName] unparalleled and outstanding performance, far beyond the reach of conventional machinery. Along with the risks and rewards of experimental machines and our thirst for the perfect body, [this.GetName] is once again united as a whole from a society of fragmented machines that have lost their masters, and every successful upgrade of parts will bring great joy to all.\n\nThe success of experimental mechanical modifications is a beginning that leads us from the pale earth to the endless stars."
 START_SCREEN_LIBRA_EXTREME_ITERATION_MI: "The cycle of mechanical design is difficult to break, the possibility of exponential growth is minimal, and the only way to break out of the rut is to find another way.\n\nSacrificing adaptability for performance is the best answer that mechanical intelligence has gotten after countless calculations. Through unlimited late modifications and parts reinforcement, the potential of the implementation unit to subvert the norm will be unleashed, turning many projects with a rating: probability-very low into possibilities. According to the research unit's reasoning, implementing such mechanical modifications will also bring about a certain increase in failure rates, but is overall controllable, so [this.GetRulerName] determines that the option of admitting modifications carries the highest weight.\n\nLess than a hundred years from the beginning of the completeness cycle, [this.GetName] has achieved a large number of breakthroughs in possibilities, a target that could not be reached by a conventional mechanical body, and a testament to the perfection of [this.GetSpeciesName]'s design."
 building_libra_extreme_iteration: "Extreme Workshop"
 building_libra_extreme_iteration_desc: "In the pursuit of design limits, a myriad of problems inevitably follows. This workshop is equipped with necessary mechanical facilities to provide emergency solutions for various contingencies."
 edict_libra_extreme_iteration: "Transcend Limits"
 edict_libra_extreme_iteration_desc: "On the path to achieving performance limits, we have already sacrificed much, yet the horizon of this field remains distant."
 edict_libra_extreme_iteration_effects: ""Doubles the positive $EFFECTS_TXT$ of ['concept_origin_libra_extreme_iteration_traits']"
 policy_libra_extreme_iteration: "Risk Transfer"
 policy_libra_extreme_iteration_desc: "Sword-edge mechanical design significantly improves the performance of a particular field of work, but also impairs the resilience of the body, and through advance risk management, we can greatly reduce the chance of unexpected accidents.\n"
 policy_libra_extreme_iteration_a: "Basic Maintenance"
 policy_libra_extreme_iteration_a_name: "$policy_libra_extreme_iteration_a$"
 policy_libra_extreme_iteration_a_desc: "Increase comfort use to mitigate other problems caused by lack of livability.\n "
 policy_libra_extreme_iteration_b: "Population Consumption"
 policy_libra_extreme_iteration_b_name: "$policy_libra_extreme_iteration_b$"
 policy_libra_extreme_iteration_b_desc: "Increase population maintenance fees to alleviate other problems caused by lack of livability.\n "
 policy_libra_extreme_iteration_c: "Resource Production"
 policy_libra_extreme_iteration_c_name: "$policy_libra_extreme_iteration_c$"
 policy_libra_extreme_iteration_c_desc: "Reduce post resource output to alleviate other problems caused by lack of livability.\n "
 policy_libra_extreme_iteration_d: "Disregard Risks"
 policy_libra_extreme_iteration_d_name: "$policy_libra_extreme_iteration_c$"
 policy_libra_extreme_iteration_d_desc: "Any questions? Save them for later."
 concept_policy_libra_extreme_iteration: "$policy_libra_extreme_iteration$"
 concept_policy_libra_extreme_iteration_desc: "Transferring the problems caused by lack of livability.\n\n§L$policy_libra_extreme_iteration_desc$§!"
 SPECIES_TRAIT_LIBRA_EXTREME_ITERATION: "['concept_origin_libra_extreme_iteration_traits']"
 concept_origin_libra_extreme_iteration_traits: "$origin_libra_extreme_iteration$ $TRAIT_TITLE$"
 concept_origin_libra_extreme_iteration_traits_desc: "Powerful traits that provide high bonuses at the cost of livability, totaling 40, can be further enhanced by enacting §Y$edict_libra_extreme_iteration$§! edict."
 trait_libra_ex_iteration_energy_1: "Electrical Relay"
 trait_libra_ex_iteration_energy_1_desc: "A power transmission unit based on superconductive technology, requiring frequent maintenance to maintain optimal performance."
 trait_libra_ex_iteration_energy_2: "Critical Conductor"
 trait_libra_ex_iteration_energy_2_desc: "This mechanical species is outfitted with numerous superconductors to enhance power generation and transmission, though the need for sustained extreme temperatures drastically increases the failure rate."
 trait_libra_ex_iteration_energy_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£trade£ §Y$trade$§! to produce §G3§!£energy£ §Y$energy$§! per month"
 trait_libra_ex_iteration_energy_3: "Reactor Probe"
 trait_libra_ex_iteration_energy_3_desc: "This design is specifically for monitoring and adjusting reactor status, ensuring it can maintain maximum power output at all times."
 trait_libra_ex_iteration_minerals_1: "Frenzied Bearing"
 trait_libra_ex_iteration_minerals_1_desc: "Once the program activates, these machines will work relentlessly as if drilling through a planetary core, continuing until the bearings shatter."
 trait_libra_ex_iteration_minerals_2: "Super Refiner"
 trait_libra_ex_iteration_minerals_2_desc: "These machines can extract minerals from construction waste, urban debris, and asteroid fragments, thus recovering residual value, though maintaining them also comes at a significant cost."
 trait_libra_ex_iteration_minerals_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£trade£ §Y$trade$§! to produce §G2§!£minerals£ §Y$minerals$§! per month"
 trait_libra_ex_iteration_minerals_3: "Ultimate Drill"
 trait_libra_ex_iteration_minerals_3_desc: "his super-colossal drill can effortlessly pulverize any hard rock layer encountered during excavation. However, mechanical units carrying such equipment are typically difficult to maintain, posing a major challenge for their placement and upkeep."
 trait_libra_ex_iteration_food_1: "Nutrition Kit"
 trait_libra_ex_iteration_food_1_desc: "High-quality, cost-effective nutritional kits enable this mechanical species to produce premium fortified food. However, the modules' vulnerability to environmental contamination and subsequent failure is a persistent issue."
 trait_libra_ex_iteration_food_2: "Bounty Index"
 trait_libra_ex_iteration_food_2_desc: "Each machine functions as a small hydroponics bay, producing new organic matter every minute."
 trait_libra_ex_iteration_food_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£trade£ §Y$trade$§! to produce §G2§!£food£ §Y$food$§! per month"
 trait_libra_ex_iteration_food_3: "Paradise Sower"
 trait_libra_ex_iteration_food_3_desc: "An intelligent learning system enables these machines to precisely control the ecological preferences of each alien plant species, meticulously regulating the environment and applying fertilizers to create thriving high-tech farms."
 trait_libra_ex_iteration_soldier_1: "Assault Unit"
 trait_libra_ex_iteration_soldier_1_desc: "Miracles of tactics and strategy have appeared countless times in history, and this mechanical species simulates one such perfect raid today."
 trait_libra_ex_iteration_soldier_2: "Desperado Armor"
 trait_libra_ex_iteration_soldier_2_desc: "Designed with high militarization as the standard, this mechanical species possesses formidable combat power. However, overly aggressive mission parameters frequently cause them to accidentally fire upon allies during routine patrols."
 trait_libra_ex_iteration_soldier_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£trade£ §Y$trade$§! to produce §G0.01§!£influence£ §Y$influence$§! per month"
 trait_libra_ex_iteration_soldier_3: "Doomsday Directive"
 trait_libra_ex_iteration_soldier_3_desc: "The ultimate killing machine is the best description for them. Once Frenzy Mode is activated, all potential targets within sensor range will instantly face precise and lethal saturation attacks."
 trait_libra_ex_iteration_alloys_1: "Paragon Forger"
 trait_libra_ex_iteration_alloys_1_desc: "Highly streamlined forging protocols can optimize metallurgical processes to a great extent, at the cost of making the machines equipped with them ill-suited for other tasks."
 trait_libra_ex_iteration_alloys_2: "Auto-Smelting Protocol"
 trait_libra_ex_iteration_alloys_2_desc: "Machines equipped with this special protocol continuously gather surrounding raw materials to produce high-quality alloys - whether the materials come from engineering waste or their own components."
 trait_libra_ex_iteration_alloys_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£minerals£ §Y$minerals$§! to produce §G1§!£alloys£ §Y$alloys$§! per month"
 trait_libra_ex_iteration_alloys_3: "Overload Arc Furnace"
 trait_libra_ex_iteration_alloys_3_desc: "This mechanical species is configured with high-power arc furnaces capable of melting and refining minerals with astonishing efficiency. If one disregards occasional incidents of furnace melt-through or explosion, they could be considered the finest metallurgists."
 trait_libra_ex_iteration_goods_1: "Precision Machine Tool"
 trait_libra_ex_iteration_goods_1_desc: "Thanks to the extreme utilization of space, the flexible yet delicate mechanical arms of this robotic species can reach every last nook and cranny during consumer goods processing."
 trait_libra_ex_iteration_goods_2: "Ornate Printer"
 trait_libra_ex_iteration_goods_2_desc: "The length of a day varies from planet to planet, and this robotic species spends all of that time replicating luxury goods."
 trait_libra_ex_iteration_goods_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£minerals£ §Y$minerals$§! to produce §G2§!£consumer_goods£ §Y$consumer_goods$§! per month"
 trait_libra_ex_iteration_goods_3: "Dreamweaver Machinist"
 trait_libra_ex_iteration_goods_3_desc: "These high-end machines specialize in producing advanced consumables. Whether they exist in reality or are only theoretically feasible, they are no problem as long as the materials are available."
 trait_libra_ex_iteration_unity_1: "Suppressed Transmission"
 trait_libra_ex_iteration_unity_1_desc: "The communication method used by this robotic species employs powerful compression and decompilation techniques, making it difficult even for units of the same model to crack."
 trait_libra_ex_iteration_unity_2: "Hive-Mimic Network"
 trait_libra_ex_iteration_unity_2_desc: "To a considerable extent, this robotic society's design references the behavior of ants and swarms. They are more united, but their inherent weaknesses are also more pronounced."
 trait_libra_ex_iteration_unity_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£minerals£ §Y$minerals$§! to produce §G2§!£unity£ §Y$unity$§! per month"
 trait_libra_ex_iteration_unity_3: "Hidden Backdoor"
 trait_libra_ex_iteration_unity_3_desc: "Through pre-programmed backdoors, the dominant party can arbitrarily alter the commands of other robotic units to maintain high synchronization. The downside is that the probability of program crashes or virus infections is greatly increased."
 trait_libra_ex_iteration_trade_1: "Virtual Mining Station"
 trait_libra_ex_iteration_trade_1_desc: "This robotic species excels at extracting illusory economic value through meaningless calculations."
 trait_libra_ex_iteration_trade_2: "Speculation Algorithm"
 trait_libra_ex_iteration_trade_2_desc: "This robotic species possesses powerful commercial deduction capabilities, adept at using money to produce more money, and will unconsciously avoid tedious work."
 trait_libra_ex_iteration_trade_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£energy£ §Y$energy$§! to produce §G2§!£trade£ §Y$trade$§! per month"
 trait_libra_ex_iteration_trade_3: "Economic Worm"
 trait_libra_ex_iteration_trade_3_desc: "Whether in trade calculation or logistics transportation capabilities, this robotic species holds undeniable advantages, capable of draining a colony's entire economic reserves as swiftly as a computer worm."
 trait_libra_ex_iteration_physics_1: "Overclocked Computation"
 trait_libra_ex_iteration_physics_1_desc: "If one processor isn't enough, installing several more always solves the problem, even if severely overclocking the fragile core components will significantly shorten the equipment's expected lifespan."
 trait_libra_ex_iteration_physics_2: "Puzzle Sequence"
 trait_libra_ex_iteration_physics_2_desc: "The mysteries of mathematics are unfathomable. To solve more puzzles, this robotic species dedicates all its idle time to endless calculations."
 trait_libra_ex_iteration_physics_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£energy£ §Y$energy$§! to produce §G2§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_ex_iteration_physics_3: "Neural-Mimic Mainframe"
 trait_libra_ex_iteration_physics_3_desc: "By simulating the neural circuits of organic species, this robotic species achieved a leap in both computational and learning capabilities... though it also replicated their fragile central nervous systems."
 trait_libra_ex_iteration_society_1: "Analysis Program"
 trait_libra_ex_iteration_society_1_desc: "Each terminal of this robotic species is equipped with highly specialized simulation programs. By analyzing and summarizing basic production activities, they can provide a wealth of experimental data for societal research, though this reduces the unit's adaptability."
 trait_libra_ex_iteration_society_2: "Social Experiment Unit"
 trait_libra_ex_iteration_society_2_desc: "These metallic performance artists are active in every possible corner, undertaking all sorts of bizarre actions in the name of collecting experimental data."
 trait_libra_ex_iteration_society_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£energy£ §Y$energy$§! to produce §G2§!£society_research£ §Y$society_research$§! per month"
 trait_libra_ex_iteration_society_3: "Evolutionary Decoder"
 trait_libra_ex_iteration_society_3_desc: "From processes like biological genetics and social evolution, this robotic species extracts precise pattern curves. Executing such work requires extremely vast computational power."
 trait_libra_ex_iteration_engineering_1: "Working Gear"
 trait_libra_ex_iteration_engineering_1_desc: "The engineering verification components of these machines will keep running until they are completely worn out."
 trait_libra_ex_iteration_engineering_2: "Self-Check Protocol"
 trait_libra_ex_iteration_engineering_2_desc: "This robotic species conducts virus scans or self-examinations daily to prevent program intrusion, even though these repeated, comprehensive scans far exceed what is necessary."
 trait_libra_ex_iteration_engineering_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£energy£ §Y$energy$§! to produce §G2§!£engineering_research£ §Y$engineering_research$§! per month"
 trait_libra_ex_iteration_engineering_3: "Experimental Engineering Module"
 trait_libra_ex_iteration_engineering_3_desc: "Integrating the most advanced engineering research framework of an era, this robotic species can conduct unprecedented large-scale experiments, but maintaining this equipment is a genuine hassle."
 trait_libra_ex_iteration_upkeep: "Low Cost"
 trait_libra_ex_iteration_upkeep_desc: "Extreme compression of maintenance costs ensures this robotic species does not incur high upkeep fees, even in harsh environments."
 trait_libra_ex_iteration_housing: "Composite Joint"
 trait_libra_ex_iteration_housing_desc: "Fold, fold, and fold again. This robotic species can compress itself into extremely small spaces for storage and transport, though the metal joints enabling this are not very sturdy."
 trait_libra_ex_iteration_happiness: "Joy Protocol"
 trait_libra_ex_iteration_happiness_desc: "Compared to usual, this robotic species is more susceptible to environmental influences, producing positive stress responses, making them easier to manage."
 trait_libra_ex_iteration_maintenance: "Efficient Maintenance"
 trait_libra_ex_iteration_maintenance_desc: "This robotic species adheres to highly optimized construction standards specifically calibrated for maintenance efficiency, leaving them unremarkable in other areas."
 trait_libra_ex_iteration_empire_size: "Streamlined Data"
 trait_libra_ex_iteration_empire_size_desc: "This robotic species is equipped with unprecedentedly powerful processors, capable of advancing multiple complex projects in parallel."
 trait_libra_ex_iteration_rare: "Advanced Synthesis"
 trait_libra_ex_iteration_rare_desc: "hese chemical machinery units, packed with technological crystallization yet lacking in safety, can synthesize rare resources with astonishing efficiency."
 trait_libra_ex_iteration_rare_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.02§!£exotic_gases£ §G0.02§!£rare_crystals£ §G0.02§!£volatile_motes£ §YRare Resource§!"
 trait_libra_ex_iteration_productive: "Ultra-Fast Processing"
 trait_libra_ex_iteration_productive_desc: "his robotic species is equipped with unprecedentedly powerful processors, capable of advancing multiple complex projects in parallel."
