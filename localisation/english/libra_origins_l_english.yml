# paradise lose

 origin_libra_paradise_lose: "Paradise Lose"
 origin_libra_paradise_lose_text: "The golden words of the ruler are the supreme rule, all things in the world are his humble servants, and the form of the poor can only find a moment's peace after death.\nHere, the will to resist can never create a wave of revolution, because the spark of freedom is ruthlessly extinguished the moment it is lit."
 origin_libra_paradise_lose_desc: "$origin_libra_paradise_lose_text$\n$libraf_or_banner_9$"
 origin_libra_paradise_lose_effects: "- $libra_start_pop_string$§G+800§!\n- $libra_leader_trait$['concept_leader_trait_libra_paradise_lose']\n- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_paradise_lose']\n- $STARTING_PLANET$\n$t$- £district£ ['concept_city_district']: §G+1§!\n$t$- Replace £building£ ['building:building_precinct_house'] with £building£ ['building:building_libra_paradise_lose']\n- $libra_extra_council_position$§Y$councilor_dystopian_society$§!\n- $ADDITIONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_penal_colonies']\n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society_research£ ['technology:tech_neural_implants']"
 START_SCREEN_LIBRA_PARADISE_LOSE: "Life is full of possibilities and opportunities, but these are the prerogative of those at the top. For the untouchables at the bottom, kneeling down is the only action they need.\n\nIt is because of the efforts of us, the elite of the elite, that [this. GetSpeciesName] has a long history. We have created one supreme legend after another, and all the world needs to do is to follow us, and it doesn't take much to move in the right direction and share the fruits of our ploughing.\n\nEven with our generosity, there will always be fools who will reject our honourable leadership and turn on us, who have been taught and forgiven countless times, but who will never change their minds. Since they will not change, we will have to make them pay accordingly. As we expected, without a wise leader, all is nothing but a rabble that can be crushed at the touch of a button. Since then, all of [this. GetSpeciesName] has been united under the sole banner of [this.GetName].\n\nRuling is destiny, obedience is virtue."
 building_libra_paradise_lose: "Supervisory Authority"
 building_libra_paradise_lose_desc: "The guards were set up to ensure absolute obedience of the people, and the inspectors are always on the lookout to prevent the inferior citizens from getting any ideas."
 building_libra_paradise_lose_2: "Planetary Picket Department"
 building_libra_paradise_lose_2_desc: "Any dangerous thought or speech will be corrected the moment it is created, and the miscreant who tries to resist will eventually repent under torture."
 leader_trait_libra_paradise_lose: "Imperial Antecedent"
 leader_trait_libra_paradise_lose_desc: "This leader, if not the most outstanding of the ruling class of the empire, is a hero recruited from elsewhere."
