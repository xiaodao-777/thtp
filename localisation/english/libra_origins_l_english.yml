 libra_origin.0715.name: "The Roar Of A Baby"
 libra_origin.0715.desc: "In order to survive, we gave up the ability to fly through the void, crawling across the surface like ants. Now that we've adapted to the world, it's only a matter of time before we get our old powers back."
 libra_origin.0715.a: "Glory to the dragons."
 libra_origin.0715.b: "We thrive forever."
