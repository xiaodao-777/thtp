 origin_libra_shadow_consciousness: "Shadow Consciousness"
 origin_libra_shadow_consciousness_text: "Darkness holds unparalleled allure for this hive mind. Its entire evolution and void-faring purpose converge on embracing shadows. Driven by this obsession, they mastered dark matter before their first interstellar voyage, using it to maintain synaptic synchrony."
