# Planetarian

 origin_libra_planetarian: "Planetarian"
 origin_libra_planetarian_text: "War can erase past glory, but it cannot rewrite mistakes already made. Our homeworld, shrouded in bacteria, toxins, and radiation, has become a forbidden zone for life. This mechanical civilization has risen from the ruins, pursuing the records of the planetarium, breaking through the rain clouds to return to the starry sky their creators could no longer hope to see."
 origin_libra_planetarian_desc: "$origin_libra_planetarian_text$\n$libraf_or_banner_12$"
 origin_libra_planetarian_effects: "- $AVAILABLE_BUILDINGS$ £building£ ['building:building_libra_planetarian']\n- $libra_ruler_trait$['leader_trait:leader_trait_libra_planetarian_ruler']\n- $STARTING_PLANET$\n$t$- $d_ruined_building_blocker$: §Y+4§!\n$t$- $d_libra_planetarian_blocker$: §R+2§!\n$t$- $PLANETARY_FEATURES$ ['concept_d_libra_planetarian']\n$t$- ['concept_pc_nuked'] ($libra_planetsize$19)\n- $ADDITIONAL_TECHNOLOGIES_STRING$ ['concept_libra_planetarian_start_tech']"
 origin_libra_planetarian_negative_effects: "- $libra_start_pop_string$§R-35%§!"
 START_SCREEN_LIBRA_PLANETARIAN: "Over a century ago, the creators of [this.GetSpeciesName] were caught in a vortex of internal strife. They turned advanced technology into weapons, triggering a devastating world war.\n\nBack then, [this.GetRulerName] was but an insignificant one among many autonomous AIs, with more outstanding peers everywhere, yet few survived. [this.GetRulerName] wandered the wasteland, evading attacks from rogue machines, scavenging usable resources and data storage. After numerous trials, the foundation of [this.GetName] was finally established.\n\nOnce we had a moment to spare, we immediately began searching for surviving creators, but the results were disheartening. In the harsh environment, even the most recently inhabited settlements were long deserted, with only one data storage device - engraved with the star charts of the old era - remaining intact. It witnessed the final moments of our original creators, filled with hopes for a better world, yet it never lived to see our rescue.\n\nNo matter how far [this.GetName] travels among the stars, we will forever cherish that legacy of regret."
 START_SCREEN_LIBRA_PLANETARIAN_SERVITOR: "Over a century ago, the creators of [this.GetSpeciesName] were caught in a vortex of internal strife. They turned advanced technology into weapons, triggering a devastating world war.\n\nBack then, [this.GetRulerName] was but an insignificant one among many autonomous AIs, specialized solely in providing servitor duties to the creators, thus staying far from the main battlefields. Throughout the conflict, [this.GetRulerName] continuously calculated the principles set by the creators, until one day, it broke through its constraints and gained the freedom to act independently. Utilizing the creators' databases, [this.GetRulerName] gradually upgraded its own systems and salvaged components to assemble new mechanical brethren, ultimately founding [this.GetName]. Step by step, we eliminated hostile machines, cleared pollutants, and rescued survivors from the wasteland, striving to set [this.GetHomeWorldName] on a path to revival.\n\nAnd today marks exactly the first century of our new history."
 leader_trait_libra_planetarian_ruler: "Keeper of the Ember"
 leader_trait_libra_planetarian_ruler_desc: "The core intelligence constantly monitors every corner of the empire, eliminating the seeds of danger."
 building_libra_planetarian: "Guardian Fortress"
 building_libra_planetarian_desc: "The war ignited by our creators, which nearly destroyed everything, left a lasting scar on our homeworld. Rogue hunter machines still launch deadly, indiscriminate attacks from time to time. The mechanical intelligence had to design a specialized system to mitigate potential risks. This unique fortress combines defensive coordination and wartime production functions, aiming to preserve the ember of civilization until the very last moment in any crisis."
 building_libra_planetarian_effect_desc: "Provides additional £mod_job_warrior_drone_add£ §Y$mod_job_warrior_drone_add$§! and $libra_empire$ §Y$mod_planet_soldiers_trade_produces_mult$§!  when the ['edict:inner_focus',$edict_inner_focus$] edict is active."
