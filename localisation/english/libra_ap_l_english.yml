 libra_fairy.2060.name: "Þæt Nama-léase Wyrde: §H[Root.GetName]§!"
 libra_fairy.2060.desc: "Þá stán-ecg þurh téþ-wælmes níht\nhis hrycg beorgan stód swá beorg-rand.\nÞá flód-græpe foldan bán forswelge,\nhé of wæl-þrýðe wangas áhredde.\n\nOn isern-þistlum hátum hearm-cwearte,\nhé stýreþ stánen ribb under rodor.\nÞá áþécendan léasunga-wéamas,\nmid léohte-ecge he gefylt fæcne webb.\n\nÞá deorc-hwammas déope útganges,\nhe steoreþ steorran swá stíefn-bora.\nNé on brónse né noma áwriten,\nǽghwylc fýrþracu fæstlíc spríngeð -\nOf flint-áde tó tungla-hróf,\nlíxende beorhtnes on manna folmum."
 libra_fairy.2060.a: "Support the younger generation."
 libra_fairy.2060.a.tt: "Leaders with skill level less than §Y6§! boosts §G+1§! skill level"
 libra_fairy.2060.b: "Sing the anthem in chorus."
 libra_fairy.2060.b.tt: "Leaders with skill level less than §Y10§! receive §G2000§! experience"

 ap_libra_genetic_potential: "Genetic Potential"
 ap_libra_genetic_potential_desc: "Constrained by the limitations of flesh and blood, even the most drastic modification has a limit that cannot be reached.\nHowever, the biological sciences have brought us not only the method of editing DNA, but also the most basic common sense such as the survival of the fittest.\n$libraf_qa_banner_3$\n"
 ap_libra_genetic_potential_tooltip: "$mod_country_scientist_cap_add$: §G+1§!\n$mod_planet_pops_produces_mult$: §G+25%§!\n$MOD_COUNTRY_SOCIETY_TECH_RESEARCH_SPEED$: §G+25%§!\nPer §Y1§! colony owned:\n$t$$mod_country_produces_mult$: §G+1%§! (Max: §G+25%§!)\n$t$$MOD_LOGISTIC_GROWTH_MULT$: §G+5%§! (Max: §G+125%§!)\n$ap_libra_genetic_potential_policy_tooltip$"
