 libra_fairy.2140.name: "Adventure Lore: §H[Root.GetName]§!"
 libra_fairy.2140.desc: "When they resolutely broke free from the gentle embrace of their home planet, piloting arks of hope into the boundless deep space, they transformed themselves into bridges connecting the known and the unknown.\n\nThese solitary voyagers drift through the desert of stars, accompanied only by glittering constellations and the howling cosmic winds beyond their hulls. Time stretches immeasurably thin during their protracted journeys, sustained solely by an undying flame within their hearts - a pure longing for truth, a steadfast belief in unveiling the universe's mysteries for all sentient beings. Even when facing an all-consuming void ahead, they still search for traces of new worlds within cold instrument readings and listen intently for the faintest possible echoes within absolute silence.\n\nAt last, when alien dust bears the imprint of visitors for the first time, when primordial darkness is pierced by newborn light, that magnificent moment arrives - they measure the universe's scale with their wake, igniting the possibility of infinitely expanding the frontiers of civilization. Though their forms may eventually solidify in the depths of the starry sea, they become eternal beacons for all who follow. These beacons silently proclaim: it is the courage that defies death that sows the seeds of civilization within absolute nothingness; these minuscule seeds will ultimately sprout into towering futures across endless spacetime. Because of these pioneers' sacrifices and explorations, the once cold and unreachably vast cosmos opens its arms to all sentient beings, becoming the vast extension of our shared spiritual home."
 libra_fairy.2140.a: "What's lurking in the star charts?"
 r_libra_warrant_of_return: "Wreckage Sphere"
 r_libra_warrant_of_return_desc: "It seems to be a relic left behind by some high-level civilisation, its powerful energy visible to the naked eye, but we were only able to draw out a minuscule fraction of it."
 relic_libra_warrant_of_return_tt: "$TRIGGER_FAIL$We don't have the technology to use this unknown relic."

