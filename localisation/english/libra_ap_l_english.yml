 libra_fairy.0559.name: "Eternal Glory: §H[Root.GetName]§!"
 libra_fairy.0559.desc: "Great leaders are millennia-spanning stars, calibrating the trajectory of civilizations with the light of their vision and forging the essence of epochs with the fire of their resolve. Their gaze pierces the mists of history's currents, transforming scattered fragments of civilization into totems of shared destiny; their magnanimity, like continental plates, upholds the bedrock of civilizations while harmonizing the world's resonance through tidal forces of wisdom. When war's shadow rends the skies or technological upheavals overturn order, they reconstruct humanity's moral coordinates with philosophies transcending time, elevate tribal divisions into symphonies of civilization, and distill power struggles into spiritual embers. Such power transcends borders and temporal cycles, weaving eternity through the warp and weft of culture, proving with transcendent existence that every leap in our history is a luminous fissure carved by noble will through chaos."
 libra_fairy.0559.a: "The efforts of the technicians are appreciated."
 libra_fairy.0559.a.tt: "All §Y$scientist_with_icon$§! receive §G3000§! experience"
 libra_fairy.0559.b: "The work of managers cannot be ignored."
 libra_fairy.0559.b.tt: "All §Y$official_with_icon$§! receive §G3000§! experience"
 libra_fairy.0559.c: "Strategists bring the ultimate victory."
 libra_fairy.0559.c.tt: "All §Y$commander_with_icon$§! receive §G3000§! experience"

 ap_libra_sages_notes: "Sage's Notes"
 ap_libra_sages_notes_desc: "The sage's legacy is never measured in gold's weight - a fragment of parchment holds constellations' echo, an unextinguished oil lamp guards the cipher to chaos, and beneath the hourglass's etched base sleeps the incantation that carries seeds through winter's wrath.\nTo chase the wisdom of sages is to gather their scattered sparks, igniting one's own endless night in the fog of the unknown - not to worship ashes, but to forge keys for a new dawn with the undying warmth of their embers.\n$libraf_ea_banner_7$\n"
 ap_libra_sages_notes_tooltip: "Reduces £empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§! by §Y-1§! per researched Technology\nReduces £empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§! by an additional §Y-4§! per researched §MRare Technology§!\n$libra_start_situation$$situation_libra_sages_notes$\n$t$§Y$situation_libra_sages_notes$§! can be performed multiple times. Phase completion yields £physics£ £society£ £engineering£ §YResearch Points§! and situation completion brings tech progress.\n$libra_unlock_edicts$['concept_libra_sages_notes_edicts']\n$t$§Y$concept_libra_sages_notes_edicts$§! consumes £energy£ §Y$energy$§! and £exotic_gases£ £rare_crystals£ £volatile_motes£ £minor_artifacts£ £astral_threads£ §YRare Resource§! to increase £mod_produces_mult£ §Y$mod_country_produces_mult$§!."
 ap_libra_sages_notes_modifier: "$ap_libra_sages_notes$"
 situation_libra_sages_notes: "Smart Notes"
 situation_libra_sages_notes_type: "$situation_libra_sages_notes$"
 situation_libra_sages_notes_monthly_change_tooltip: "The progress of the Wisdom Notes situation is fixed, every §Y18§! month round."
 situation_libra_sages_notes_desc: "Wisdom is like the ocean, serene on the surface yet teeming with hidden depths; akin to mountains, silent yet seeing a thousand miles; resembling a stream, winding yet ever clear. It does not wander alone in the desert of knowledge, but takes root in the soil of experience, its humble branches brushing the stars, its inclusive rings etching time. The truly wise guard simplicity amid complexity, discern rhythm within chaos, and trace the paths of stars even in the mundane - for wisdom lies not in seeing more, but seeing through."
 situation_libra_sages_notes_effects: "Gain §G1§! months of £physics£ £society£ £engineering£ §YResearch Points§! output"
