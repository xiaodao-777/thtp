 ap_libra_golden_rule: "Golden Rule"
 ap_libra_golden_rule_desc: "Laws are the cosmic cipher hidden between heaven and earth. The wise wield reason as their key to decipher its code: transforming natural principles into productive energy, elevating social patterns into organizational efficacy, ultimately making cold equations radiate with warm value in reality. Herein lies our species' singular gift that distinguishes us from all creation: weaving the tapestry of civilization by choreographing with cosmic rhythms.\n$libraf_qa_banner_1$\n"
 ap_libra_golden_rule_tooltip: "$libra_unlock_edicts$['concept_libra_golden_rule_edicts']\n$t$§Y$concept_libra_golden_rule_edicts$§! increases in £trade£ §Y$trade$§! maintenance fees for £job£ §YJobs§! to enhance £alloys£ £consumer_goods£ £physics£ £society£ £engineering£ £unity£ output.\n$libra_unlock_policies$$policy_libra_golden_rule$\n$t$§Y$policy_libra_golden_rule$§! generates additional £energy£ §Y$energy$§! total income to produce specified types of £alloys£ £consumer_goods£ £physics£ £society£ £engineering£ £unity£ resources."
 policy_libra_golden_rule: "Golden Compass"
 policy_libra_golden_rule_desc: "The compass turns and guides us on the path of abundance.\n "
 policy_libra_golden_rule_a: "Industrial Development"
