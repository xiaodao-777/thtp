 libra_fairy.0549.e: "We will make progress in our current goals."

 ap_libra_gestalt_era: "Gestalt Era"
 ap_libra_gestalt_era_desc: "Amidst the ever-shifting tides of time, genuine leaders stand as towering mountains. With visionary foresight, they chart the course ahead; through unwavering resolve, they unite countless hearts. Their strength lies not in the weight of the scepter, but in the power to resonate soul to soul. They manifest as the backbone that stands firm in times of crisis, and the force that forges a multitude of voices into a resounding chorus of collective endeavor.\n$libraf_ea_banner_6$\n"
 libra_gestalt_era_tooltip: "£leader£ §YLeaders§! gain §Y$leader_trait_libra_gestalt_era$§! trait and ['concept_libra_gestalt_era_leader_effect']\n$libra_start_situation$$situation_libra_gestalt_era_scientist$ $situation_libra_gestalt_era_official$ $situation_libra_gestalt_era_commander$\n$t$The above situations are driven by the corresponding type of £official£ £scientist£ £commander£ §YLeaders§! and can be completed multiple times."
