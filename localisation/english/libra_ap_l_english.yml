 libra_fairy.0539.name: "Molten Fire Horns: §H[Root.GetName]§!"
 libra_fairy.0539.desc: "An empire within an empire, the world is waiting for us to conquer! Spread warships all over the dome of the sky, ignite this starry land with blood and iron!\n\nThe stars are dim between the smoke and mirrors, only we, are the true gold that shines between the nebulae."
 libra_fairy.0539.a: "Existence is struggle."
 libra_fairy.0539.a.tt: "Remove all armistice agreements"
 libra_fairy.0539.b: "Art is war."

 ap_libra_ultimate_directive: "Ultimate Directive"
 ap_libra_ultimate_directive_desc: "Giving up sameness is tantamount to extinction.\nEnsuring that the Subject Consciousness is able to control all sub-individuals is the most important thing, and only in this way can the entire Gestalt Empire function under the control of the Central Intelligence.\n$libraf_ea_banner_5$\n"
 libra_ultimate_directive_tooltip: "§YRuler§! gains §Y$leader_trait_libra_ultimate_directive_ruler$§! trait\n§YCouncil Node§! gain §Y$leader_trait_libra_ultimate_directive$§! trait\nWhen Y$COUNCIL_AGENDA$§! is finished:\n$t$Add §d$leader_trait_libra_ultimate_directive$§! trait to §YNode§! which is missing it\n$t$Gain §Y3§! months of £physics£ £society£ £engineering£ §YResearch Points§! and £influence£ §Y$influence$§! output\n$libra_unlock_agenda$$council_agenda_agenda_ap_libra_ultimate_directive_growth_name$ $council_agenda_agenda_ap_libra_ultimate_directive_cognitive_name$ $council_agenda_agenda_ap_libra_ultimate_directive_legion_name$ $council_agenda_agenda_ap_libra_ultimate_directive_regulatory_name$\n$t$The above agendas have shorter cooldowns, cost less to activate, and can be used a total of §Y7§! times, with each activation increasing §G+1§!£mod_councilor_skill_add£ §Y$MOD_COUNCILOR_SKILL_ADD$§! and reduce §Y-105§!£empire_sprawl£ §Y$EMPIRE_SIZE$§!."
