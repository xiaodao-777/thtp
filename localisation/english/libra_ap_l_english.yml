 libra_golden_rule_e_name: "$policy_libra_golden_rule_e$"
 policy_libra_golden_rule_e_desc: "As custodian, we will be able to trade more smoothly and devote more resources to interstellar affairs.\n\nEach point of £energy£ §Y$energy$§! income generates additional £alloys£§G0.06§! £physics£§G0.03§! £society£§G0.03§! £engineering£§G0.03§!"
