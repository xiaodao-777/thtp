 libra_fairy.2150.name: "Where Life Blooms: §H[Root.GetName]§!"
 libra_fairy.2150.desc: "Above the star-strewn abyss, beneath the eternal curtain woven by frigid laws, a pulse tenaciously breaches the stillness. It springs not from precise astral charts nor monumental constructs, but from a chance whisper deep within chaotic stardust. This pulse is the universe's most ancient marvel - the ephemeral coalescence and burning of formless energy within organic vessels. Defying the void's desolation and radiation's scourge, it exists with purposeless purity, carving islands of warmth and negentropy within torrents of icy logic. Each minute cell cradles mysteries surpassing stellar furnaces; each silent breath is an act of elegant resilience, a profound homage to the vast void. While cosmic dust must ultimately return to dust, it is this transient, self-replicating stardust - burning bright for but a moment - that resonates as the most poignant tremolo within the symphony of spacetime."
 libra_fairy.2150.a: "Bloom more!"
 libra_fairy.2150.a.tt: "Capital receives §G900§! £pop£ §Y$POP$§!"
 libra_fairy.2150.b: "Flowers will bloom here."

 ap_libra_warrant_of_return: "Warrant Of Return"
 ap_libra_warrant_of_return_desc: "Our adventures have proved the courage, strength, and wisdom we possess, and now we shall stand for ourselves monuments of glory.\nWhere there is life, there is progress.\n$libraf_qa_banner_4$\n"
 ap_libra_warrant_of_return_tooltip: "For every piece of §Y$RELICS$§!:\n$t$$mod_country_produces_mult$: §G+5%§! (Max: §G+40%§!)\nFor each cumulative §YTriumph§!:\n$t$$MOD_COUNTRY_NAVAL_CAP_MULT$: §G+5%§! (Max: §G+50%§!)\nFor each §Y$EXHIBITION_XENO_GEOLOGY$§! $specimens$ of §M$SPECIMEN_EPIC$§! or §H$SPECIMEN_EXCEPTIONAL$§! exhibited:\n$t$$MOD_COUNTRY_PHYSICS_TECH_RESEARCH_SPEED$: §G+10%§! (Max: §G+60%§!)\nFor each §Y$EXHIBITION_GALACTIC_HISTORY$§! $specimens$ of §M$SPECIMEN_EPIC$§! or §H$SPECIMEN_EXCEPTIONAL$§! exhibited:\n$t$$MOD_COUNTRY_SOCIETY_TECH_RESEARCH_SPEED$: §G+10%§! (Max: §G+60%§!)\nFor each §Y$EXHIBITION_AESTHETIC_WONDERS$§! $specimens$ of §M$SPECIMEN_EPIC$§! or §H$SPECIMEN_EXCEPTIONAL$§! exhibited:\n$t$$MOD_COUNTRY_ENGINEERING_TECH_RESEARCH_SPEED$: §G+10%§! (Max: §G+60%§!)"
