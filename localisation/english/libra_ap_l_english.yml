 libra_fairy.2200.name: "Iron Heraldry: §H[Root.GetName]§!"
 libra_fairy.2200.desc: "Beneath the smelting gaze of stellar furnaces, the silver-blue leviathan stirs within the steel womb of the spacedock, like a slumbering queen's knight awaiting the final plates of his armor. Nano-forged currents cascade over its hydrodynamic carapace, energy veins pulsing beneath alloy seams like an ancient blood oath of fealty. Twelve antimatter engines hover at its flank, girdled by gravitational constraint rings shimmering with captured starlight - a celestial belt ready to ignite dimension-rending conflagrations for glory. When temporary power coils flare, the unfinished colossus kneels in dark matter mist, its silhouette a chivalric vow half-formed, as quantum shield generators hum their first vow to the unseen sovereign reigning in the void."
 libra_fairy.2200.a: "Build more warships."
 libra_fairy.2200.b: "Train more commanders."

 ap_libra_intergalactic_junkie: "Intergalactic Junkie"
 ap_libra_intergalactic_junkie_desc: "Building a ship is never difficult, it's just that some unintelligent guys complicate simple things.\nThrough the brilliant use of basic materials, we can have cheap but powerful warships.\n$libraf_qa_banner_6$\n"
