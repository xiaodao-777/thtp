 libra_fairy.2250.name: "Silent Annihilation: §H[Root.GetName]§!"
 libra_fairy.2250.desc: "The afterglow of the explosion congealed into a pale cocoon in the depths of space. The moment the enemy warship fractured, all roars were swallowed by the vacuum, leaving only cobweb-like cracks crawling wildly across its hull. The colossal shadow began to crumble, its metallic joints convulsing one final time, hurling unextinguished energy streams into a halo of luminous mist.\n\nThese fragments no longer bore any identifiers, every trace of civilization vanishing with the severed power conduits. Some debris continued tumbling under inertia's tyranny, sporadic short-circuit sparks flickering like dying fireflies, while most succumbed to a cold slumber, becoming faint protrusions on the dark canvas. They would glide eternally under the universe's oldest laws, until some distant galaxy's gravitational field reclaimed the war-scorched remnants - by then, every searing wound would be cloaked in stardust, transformed into nameless tombstones drifting through time.\n\nYet now, deep within the still-warm metal fissures, a violet pulse throbbed with heartbeat regularity, collapsing along the ripples of gravitational waves toward the densest cluster of the mothership's ruins."
 libra_fairy.2250.a: "Make the best use of them."

