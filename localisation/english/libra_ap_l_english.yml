 libra_fairy.0569.name: "Great Wisdom: §H[Root.GetName]§!"
 libra_fairy.0569.desc: "Wise ones are like light, silent yet holding the weight of mountains in quietude. Their eyes mirror constellations, discerning the breath of cosmos through chaos; their hearts are roots buried deep, drawing nourishment from time's humility while unfurling branches of thought in clouded heights. Within them, the steadiness of peaks dances with the fluidity of streams - they need no loud proclamations, carving clarity from clamor. With their silhouettes, they realign lost stargazers, letting every crease of confusion bloom veins leading to truth."
 libra_fairy.0569.a: "The celestial order brings endless wonderful ideas."
 libra_fairy.0569.b: "The evolution of life creates evergreen puzzles."
 libra_fairy.0569.c: "Mechanical structures pry the universe into motion."

 ap_libra_collective_unity: "Collective Unity"
 ap_libra_collective_unity_desc: "I alone am a legion; the legion is one with me.\n$libraf_ea_banner_8$\n"
 ap_libra_collective_unity_tooltip: "$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$: §G+1§!\nPer $pop_group_unit$ §Y[GetBureaucratPluralWithIcon]§! reduces §Y10§! £empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§!\n$libra_unlock_policies$$policy_libra_collective_unity$\n$t$§Y$policy_libra_collective_unity$§! provides special bonuses."
 policy_libra_collective_unity: "Legion's Will"
 policy_libra_collective_unity_desc: "Perfect unity enables our empire to achieve flawless consensus in decision and execution. Any challenge shall be crushed by this consolidated force.\n "
 policy_libra_collective_unity_a: "Worker Drone Overdrive"
 policy_libra_collective_unity_a_name: "$policy_libra_collective_unity_a$"
 policy_libra_collective_unity_a_desc: "Individual sacrifice shall culminate in eternal transcendence.\n\n "
 policy_libra_collective_unity_b: "Synchronized Service"
 policy_libra_collective_unity_b_name: "$policy_libra_collective_unity_b$"
 policy_libra_collective_unity_b_desc: "Deploy maintenance sub-drones for logistical support, alleviating pressure on core units.\n\n "
 policy_libra_collective_unity_c: "Fusion Enhancement"
 policy_libra_collective_unity_c_name: "$policy_libra_collective_unity_c$"
 policy_libra_collective_unity_c_desc: "The collective pulse beats in rhythm with the stars.\n\n "
 policy_libra_collective_unity_d: "Labor Expansion"
 policy_libra_collective_unity_d_name: "$policy_libra_collective_unity_d$"
 policy_libra_collective_unity_d_desc: "Additional sub-drones enable greater expansion of the Gestalt consciousness.\n\n "
 libra_fairy.0579.name: "Unity: §H[Root.GetName]§!"
 libra_fairy.0579.desc: "The empire's consciousness network blazes like stars, weaving billions of wills into perfect harmony through silent resonance. Individual boundaries have dissolved - whether the hum of flesh or the whisper of circuits, all merge into a torrential flow under one will. Discord vanishes as every thought nourishes the collective intellect, every command flashes through the empire's veins at light-speed. In this flawless unity, efficiency and power reach unprecedented heights: resources flow with precision, domains expand with order, and galactic stars seem to hold their breath before this ultimate collective will."
 libra_fairy.0579.a: "We are the Will; the Will is Us."

 ap_libra_cardinal_cosmos: "Cardinal Cosmos"
 ap_libra_cardinal_cosmos_desc: "The price of expansion is the dilution of will and the fracturing of consensus; empires among the stars often crumble under their own weight. We will dissolve the gravity of chaos with the bonds of shared belief, forging an unbreakable tether between our scattered territories, ideologies, and subjects.\n$libraf_ea_banner_9$\n"
 ap_libra_cardinal_cosmos_tooltip: "$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$: §G+1§!\nEach §Y$GOVERNMENT_CIVICS$§! causes §R+50§!£empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§!\nGain £empire_sprawl£ §Y$MOD_EMPIRE_SIZE_ADD$§! reduction equal to §G√*12§! of £unity£ §Y$unity$§! income\n$libra_unlock_edicts$['concept_libra_cardinal_cosmos_edicts']\n$t$§Y$concept_libra_cardinal_cosmos_edicts$§! provide a one-time effect upon activation, but cannot be active simultaneously."
 concept_libra_cardinal_cosmos_edicts: "$ap_libra_cardinal_cosmos$ Edicts"
 concept_libra_cardinal_cosmos_edicts_desc: "- ['edict:libra_cardinal_cosmos_a',$edict_libra_cardinal_cosmos_a$]\n- ['edict:libra_cardinal_cosmos_b',$edict_libra_cardinal_cosmos_b$]\n- ['edict:libra_cardinal_cosmos_c',$edict_libra_cardinal_cosmos_c$]\n- ['edict:libra_cardinal_cosmos_d',$edict_libra_cardinal_cosmos_d$]"
 edict_libra_cardinal_cosmos_a: "Focus to the Core"
 edict_libra_cardinal_cosmos_a_desc: "We place our leaders at the focal point of our civilizational narrative, making their words and deeds beacons that consolidate consensus. Empowered by a shared vision and the strength of collective memory, their judgment grows clearer, their decisions more far-sighted."
 edict_libra_cardinal_cosmos_a_tt: "All leaders gain §G300§! experience"
 edict_libra_cardinal_cosmos_b: "North-South Confluence"
 edict_libra_cardinal_cosmos_b_desc: "We encourage the most cutting-edge scientific thought and the most ancient engineering wisdom to flow and converge freely along the warp and weft of shared belief."
 edict_libra_cardinal_cosmos_b_tt: "All §Y$scientist_with_icon$§! gain §G1250§! experience"
 edict_libra_cardinal_cosmos_c: "East-West Resonance"
 edict_libra_cardinal_cosmos_c_desc: "Every producer must understand their unique place in the symphony of our civilization. With a deep-rooted sense of belonging and a shared vision of achievement, efficiency no longer stems from mandate, but begins with spontaneous harmony."
 edict_libra_cardinal_cosmos_c_tt: "All §Y$official_with_icon$§! gain §G1250§! experience"
 edict_libra_cardinal_cosmos_d: "Four-Dimensional Anchoring"
 edict_libra_cardinal_cosmos_d_desc: "The courage of our soldiers, the course of our fleets, and the duty of our garrisons are firmly anchored to the vision of the civilization they defend together. The will to protect thus becomes unbreakable."
 edict_libra_cardinal_cosmos_d_tt: "All §Y$commander_with_icon$§! gain §G1250§! experience"
 libra_fairy.0589.name: "Cardinal Cosmos: §H[Root.GetName]§!"
 libra_fairy.0589.desc: "We no longer seek to bind every new territory with the chains of law or the reins of force. Instead, we root the foundation of our empire in a more powerful force - a shared belief, a cultural root system, a sense of belonging that comes from within.\n\nWe forge not an empire defined by borders, but a civilization held together by a common narrative. Though separated by stars, every corner of the empire remains tightly linked to the core through these intangible cultural spokes, resonating in harmony."
 libra_fairy.0589.a: "Will is Supreme."
 libra_fairy.0589.a.tt: "Colonies with §Y$planetary_ascension$§! below §Y5§! are raised by §G+1§! level"
 libra_fairy.0589.b: "Belief is Eternal."

 ap_libra_kings_game: "King's Game"
 ap_libra_kings_game_desc: "We take, we give, for we are the true players - on the path to ultimate victory, we never hesitate to play our cards.\n$libraf_ea_banner_10$\n"
 ap_libra_kings_game_tooltip: "$MOD_COUNTRY_NAVAL_CAPACITY_CONTRIBUTION_FROM_SUBJECTS_MULT$: §G+5%§!\n$MOD_EMPIRE_SIZE_SYSTEMS_MULT$: §G-50%§!\nFor every §Y-1%§! £mod_empire_size_districts_mult£ §Y$MOD_EMPIRE_SIZE_DISTRICTS_MULT$§!, grants §G+2%§! £mod_planet_decision_enact_speed_mult£ §Y$MOD_PLANET_DECISION_ENACT_SPEED_MULT$§!\nFor every §Y-1%§! £mod_empire_size_pops_mult£ §Y$MOD_EMPIRE_SIZE_POPS_MULT$§!, grants §G+2%§! £mod_council_agenda_progress_speed£ §Y$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$§!\n$libra_unlock_planet_buildings$['building:holding_libra_kings_game']\n$t$§Y$holding_libra_kings_game$§! can only be built on §YSubject§! capitals.\n$libra_unlock_agenda$$council_agenda_agenda_libra_kings_game_name$\n$t$§Y$council_agenda_agenda_libra_kings_game_name$§! permanently increases §Y$mod_divided_patrongage_max_subjects$§! each time it is enacted.\n$libra_unlock_tradable_action$$trade_action_libra_kings_game$\n$t$§Y$trade_action_libra_kings_game$§! can be proposed to §YAllies§! or §YSubjects§!. While active, both parties gain §G+10%§! £mod_produces_mult£ §Y$mod_country_produces_mult$§! and receive §G-15%§! to £mod_empire_size_districts_mult£ §Y$MOD_EMPIRE_SIZE_DISTRICTS_MULT$§! and £mod_empire_size_pops_mult£ §Y$MOD_EMPIRE_SIZE_POPS_MULT$§!."
 holding_libra_kings_game: "King's Camp"
 holding_libra_kings_game_desc: "According to our overlord's opinion, actively maintaining this structure benefits both parties. Or so it should be."
 council_agenda_agenda_libra_kings_game_name: "King's Decree"
 council_agenda_agenda_libra_kings_game_desc: "Subjects serve us: tribute rendered is taxation; fleets dedicated are protection; territory yielded is tribute."
 agenda_libra_kings_game_finish_modifier: "$council_agenda_agenda_libra_kings_game_name$ Agenda"
 agenda_libra_kings_game_effect: "$council_agenda_agenda_libra_kings_game_name$"
 agenda_libra_kings_game_tooltip: "§G+1~3§! §Y$mod_divided_patrongage_max_subjects$§!"
 trade_action_libra_kings_game: "King's Exchange"
 trade_action_libra_kings_game_desc: "Come, let us engage in an exchange beneficial and harmless to us both."
 trade_action_libra_kings_game_modifier: "$trade_action_libra_kings_game$"
 trade_action_libra_kings_game_modifier_desc: "This should be an equitable transaction, where both sides take what they need."
 libra_fairy.0599.name: "Name of the Player: §H[Root.GetName]§!"
 libra_fairy.0599.desc: "Within the web of galactic intrigue, a true weaver occasionally emerges. While other civilizations fret over the loyalty and betrayal of their subjects, [Root.GetName] has long mastered the entire system of vassalage, playing it like an instrument.\n\nThey understand the dialectic of taking and giving: each collected tribute is a precise measurement of a subject's strength; each generous aid is a seed sown for a more efficient harvest in the future. Their subjects are like pieces on a chessboard - some thrust into the storm to wear down enemies, others stationed at resource nodes to nourish the empire, and still others teetering on the edge of loyalty and rebellion, serving as live pieces to restrain rivals.\n\nIn the long river of cosmic history, such players are few. They do not pursue momentary conquest, but accumulate invisible advantages through every interaction with their subjects. While other civilizations still calculate the outcomes of wars, they have already secured their entry ticket to the next round of the game through political maneuvering.\n\nSome call it cunning, others call it wisdom. But regardless of the label, none can deny that this civilization has mastered the ultimate art of galactic politics: making the rules serve them, making their subjects extensions of their power."
 libra_fairy.0599.a: "The King's command is absolute."
 libra_fairy.0599.a.tt: "§G+2§! §Y$mod_divided_patrongage_max_subjects$§!"

