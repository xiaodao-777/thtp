 libra_fairy.0529.name: "Deep Will: §H[Root.GetName]§!"
 libra_fairy.0529.desc: "Whether people want it or not, whether the public knows about it or not, we have gained a more efficient shadow power. We hold the power of public opinion and manipulate or co-ordinate society to function in the best possible way, with no more unnecessary disputes and no needless wandering.\n\nA fledgling empire, where all are united but floundering, now rises."
 libra_fairy.0529.a: "What we expect will eventually be realised."
 libra_fairy.0529.b: "What we thirst for will always come."

 ap_libra_third_choice: "Third Choice"
 ap_libra_third_choice_desc: "In this vast universe, where all beings are isolated and helpless, there is neither a lawgiver nor an orderkeeper. Only force is different, it is clear and absolute, retreat will protect us from intrusion, advance will help us to unify the stars.\n$libraf_ea_banner_4$\n"
 ap_libra_third_choice_tooltip: "§Y$navy_coverage$§! decreases £mod_empire_size_penalty_mult£ §Y$MOD_EMPIRE_SIZE_PENALTY_MULT$§! equally\nWhen §Ywinning wars§! or §Ydestroying empires§!:\n$t$$MOD_POP_CITIZEN_HAPPINESS$: §G+3%§! (Max: §G+30%§!)\n$t$$mod_divided_patrongage_max_subjects$: §G+1§! (Max: §G+10§!)\n$t$Increase in £opinion£ §Y$OPINION$§! from friendly countries by §G+20§! (Max: §G+300§!)\nWhen §Ydefeated§! in war\n$t$Loss of above $EMPIRE_EFFECTS_W_ICON$ gained through victory\n$t$§G+75%§!£mod_starbase_shipyard_build_speed_mult£ §Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§! for §Y5§! years ( £time£ §YTime§! Stackable)\n$libra_unlock_policies$$policy_libra_third_choice$\n$t$§Y$policy_libra_third_choice$§! enables §Y$country_power_projection$§! to produce £physics£ £society£ £engineering£ §YResearch Points§! based on £empire_sprawl£ §Y$EMPIRE_SIZE$§!."
