 libra_fairy.0549.name: "The Ultimate Mission: §H[Root.GetName]§!"
 libra_fairy.0549.desc: "Exploring the world is an epic journey for Gestalt consciousness. We must coordinate all sub-individuals to work together in order to stabilise our place in this unknown world.\n\nThe sea of stars is vast and [Root.GetSpeciesName] is waiting for new instructions."
 libra_fairy.0549.a: "Efficient §YGrowth§! Directive leads us to prosperity."
