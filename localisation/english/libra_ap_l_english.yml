# ####################

 ap_libra_transcendent_covenant: "Transcendent Covenant"
 ap_libra_transcendent_covenant_desc: "We're all here for the same reason.\nWhat makes us special is our strong faith.\n$libraf_ea_banner_1$\n"
 ap_libra_transcendent_covenant_tooltip: "Every §Y240~360§! days:\n$t$Current agenda advances §G10%§! progress\n$t$Random colony have a §Y80%§! chance to increase §G+1§! §Y$planetary_ascension$§!\nWhen Y$COUNCIL_AGENDA$§! is finished:\n$t$Capital gains §G100§!£pop£ §Y$POP$§!\n$t$All colonies have a §Y50%§! chance to increase §G+1§! §Y$planetary_ascension$§!\n$libra_unlock_agenda$$council_agenda_agenda_libra_transcendent_covenant_a_name$ $council_agenda_agenda_libra_transcendent_covenant_b_name$ $council_agenda_agenda_libra_transcendent_covenant_c_name$\n$t$The above agenda has a shorter cooldown and lower start-up costs, but cannot be started simultaneously."
 LIBRA_TRANSCENDENT_COVENANT_EFFECT_TITLE: "Extraordinary Confession"
 LIBRA_TRANSCENDENT_COVENANT_EFFECT_1_DESC: "Our goals unite us more and more.\n\n§HCurrent agenda advances §G10%§! progress§!"
 LIBRA_TRANSCENDENT_COVENANT_EFFECT_2_DESC: "Our faith makes us stronger and stronger.\n\n§HCurrent agenda advances §G10%§! progress\n$PLANET|Y$ increases §G+1§! §Y$planetary_ascension$§!§!"
 council_agenda_agenda_libra_transcendent_covenant_a_name: "Pact of the Spirit"
 council_agenda_agenda_libra_transcendent_covenant_a_desc: "Seek higher wisdom."
 agenda_libra_transcendent_covenant_a_finish_modifier: "$council_agenda_agenda_libra_transcendent_covenant_a_name$ Agenda"
 council_agenda_agenda_libra_transcendent_covenant_b_name: "Pact of the Force"
 council_agenda_agenda_libra_transcendent_covenant_b_desc: "Explore greater power."
 agenda_libra_transcendent_covenant_b_finish_modifier: "$council_agenda_agenda_libra_transcendent_covenant_b_name$ Agenda"
 council_agenda_agenda_libra_transcendent_covenant_c_name: "Pact of the Fertile"
 council_agenda_agenda_libra_transcendent_covenant_c_desc: "Discover greater treasures."
 agenda_libra_transcendent_covenant_c_finish_modifier: "$council_agenda_agenda_libra_transcendent_covenant_c_name$ Agenda"
 libra_fairy.0509.name: "Evidence of Transcendence: §H[Root.GetName]§!"
 libra_fairy.0509.desc: "We have opened the way to the highest and holiest with our superior wisdom, and at the end of that is the endless prosperity of a thousand births. \n\nWe have just taken the first step, and the future is never far away."
 libra_fairy.0509.a: "Engrave history within."
 libra_fairy.0509.a.tt: "Improve §Y$planetary_ascension$§! to §G+8§!"
 libra_fairy.0509.b: "Harmony in the midst of strife."
 libra_fairy.0509.c: "Assigning balance to the cycle."

 ap_libra_galaxy_ambition: "Galaxy Ambition"
 ap_libra_galaxy_ambition_desc: "The cumbersome management system of the past has become a burden, and it is becoming more and more obvious that the operation of the empire. We need to break out of the box: restructure the administrative system in order to bring a larger universe under control.\n$libraf_ea_banner_2$\n"
 ap_libra_galaxy_ambition_tooltip: "$libra_unlock_planet_buildings$['building:building_libra_galaxy_bureaucratic_1']\n$t$ £building£ §Y$building_libra_galaxy_bureaucratic_1$§! requires £society£ §Y$tech_capital_productivity_1$§! technology, provides £job_politician£ §Y$job_politician$§! and £job_enforcer£ §Y$job_enforcer$§! $JOBS_TITLE$, colonial $EFFECTS_TXT$ and$EMPIRE_EFFECTS_W_ICON$. It can be upgraded to £building£ ['building:building_libra_galaxy_bureaucratic_2'] and £building£ ['building:building_libra_galaxy_bureaucratic_3'] after studying advance technology.\n$libra_unlock_planet_buildings$['building:building_libra_galaxy_bureaucratic_4']\n$t$§Y$building_libra_galaxy_bureaucratic_4$§! has a build cap of §Y1§!, reduced by £empire_sprawl£ §Y$EMPIRE_SIZE$§! based on the total number of £job_enforcer£ §Y$job_enforcer_plural$§!."
 ap_libra_galaxy_ambition_policy_tooltip: "$libra_unlock_policies$$policy_libra_galaxy_ambition$\n$t$§Y$policy_libra_galaxy_ambition$§! enables £pop_cat_ruler£ §Y$pop_cat_ruler$§! to produce additional £trade£ £alloys£ £physics£ £society£ £engineering£ £unity£ resources as specified."
 building_libra_galaxy_bureaucratic_1: "Colonial Office"
 building_libra_galaxy_bureaucratic_1_desc: "$building_bureaucratic_2_desc$"
 building_libra_galaxy_bureaucratic_2: "Planetary Agency"
 building_libra_galaxy_bureaucratic_2_desc: "$building_bureaucratic_3_desc$"
 building_libra_galaxy_bureaucratic_3: "Galaxy Authority"
 building_libra_galaxy_bureaucratic_3_desc: "Using FTL communications technology, the most brilliant managers are here to direct the daily operations of the entire star system."
 building_libra_galaxy_bureaucratic_4: "Imperial Proclamation Council"
 building_libra_galaxy_bureaucratic_4_desc: "This enormous structure stands above our capital city, and inside it is a vast bureaucratic hub of extreme precision. With this complete administrative system, our empire will be able to function more efficiently."
 building_libra_galaxy_bureaucratic_effect_desc: "For each £job_enforcer£ §Y$job_enforcer$§! in the empire, reduce the £empire_sprawl£ §Y$EMPIRE_SIZE$§! by §Y-0.1§!.\nFor each £job_enforcer£ §Y$job_enforcer$§! in this colony, reduce the £empire_sprawl£ §Y$EMPIRE_SIZE$§! by an additional §Y-0.1§!."
 policy_libra_galaxy_ambition: "Elite Benefits"
 policy_libra_galaxy_ambition_desc: "Those who can do more will do more, tapping into the influence of the very top of our society to consolidate our vast empire.\n "
 policy_libra_galaxy_ambition_a: "Material Flow"
 policy_libra_galaxy_ambition_a_name: "$policy_libra_galaxy_ambition_a$"
 policy_libra_galaxy_ambition_a_desc: "Supervise the interstellar transport business.\n "
 policy_libra_galaxy_ambition_b: "Advanced Casting"
 policy_libra_galaxy_ambition_b_name: "$policy_libra_galaxy_ambition_b$"
 policy_libra_galaxy_ambition_b_desc: "To channel human resources for heavy industry.\n "
 policy_libra_galaxy_ambition_c: "Physical Theory"
 policy_libra_galaxy_ambition_c_name: "$policy_libra_galaxy_ambition_c$"
 policy_libra_galaxy_ambition_c_desc: "Study of frontier physical systems.\n "
 policy_libra_galaxy_ambition_d: "Social Research"
 policy_libra_galaxy_ambition_d_name: "$policy_libra_galaxy_ambition_d$"
 policy_libra_galaxy_ambition_d_desc: "Discover new inspiration in the community.\n "
 policy_libra_galaxy_ambition_e: "Engineering Design"
 policy_libra_galaxy_ambition_e_name: "$policy_libra_galaxy_ambition_e$"
 policy_libra_galaxy_ambition_e_desc: "Advancing engineering research.\n\n "
 policy_libra_galaxy_ambition_f: "Imperial Unification"
 policy_libra_galaxy_ambition_f_name: "$policy_libra_galaxy_ambition_f$"
 policy_libra_galaxy_ambition_f_desc: "Solidify our administrative system.\n\n "
 libra_fairy.0519.name: "The Empire Looks Away: §H[Root.GetName]§!"
 libra_fairy.0519.desc: "Rules, power and will, the building blocks of a new interstellar order. We, on the other hand, are the original forerunners of this age. \n\n We have the opportunity to bend the world to our will."
 libra_fairy.0519.a: "The law, solidifying our order."
 libra_fairy.0519.b: "The Elite, guiding our future."

 ap_libra_shift_in_focus: "Shift In Focus"
 ap_libra_shift_in_focus_desc: "There are some things the public doesn't need to know, and some secrets are better kept deep underwater. Our communications technology is not what it used to be, and there are much better and more subtle ways to divert people's attention. Contradictions and conflicts are just a means to an end.\n$libraf_ea_banner_3$\n"
 ap_libra_shift_in_focus_tooltip: "Obtain ['concept_libra_shift_in_focus_auth_effect'] after §Y$MOD_GOVERNMENT_TITLE$§!\nEach has §Y1§! free civic slot:\n$t$$mod_country_produces_mult$: §G+10%§! (Max: §G+20%§!)\n$t$$MOD_COUNTRY_NAVAL_CAP_MULT$: §G+10%§! (Max: §G+20%§!)\n$t$$MOD_EMPIRE_SIZE_MULT$: §Y-10%§! (Max: §Y-20%§!)\nEach has §Y1§! extra civic slot:\n$t$$mod_country_produces_mult$: §G+5%§! (Max: §G+20%§!)\n$t$$MOD_COUNTRY_EDICT_FUND_MULT$: §G+10%§! (Max: §G+40%§!)\n$t$$MOD_EMPIRE_SIZE_MULT$: §Y-15%§! (Max: §Y-60%§!)"
