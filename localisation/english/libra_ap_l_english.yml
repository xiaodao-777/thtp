 libra_fairy.2310.name: "Shattered Firmament: §H[Root.GetName]§!"
 libra_fairy.2310.desc: "When the fabric of reality was rent by some ineffable force in the star-flecked depths, a rift yawned open to the star-realm. There, adrift in non-void, hung colossal, silent energy-remnants - like the sundered hearts of cosmic titans, pulsing with a bronze-hued glow. Their very existence was a near-blasphemous aria against the known laws of physics. From the throbbing cores of these leviathans, a subversive cadence was captured: space, unmasked, was revealed not as an immutable foundation, but as a fluid medium - foldable like astral origami, fragile as ancient silk, yet capable of being rewoven in the space between heartbeats. This was no sterile schematic; it was a cold, cosmic insight into the universe's sinews, whispered from the star-realm.\n\nThis wisdom from beyond, an alluringly sweet contagion, swiftly found its host within the fertile womb of war. Deep within a laboratory steeped in absolute zero and torrents of computation, the star-realm's sigils - those eldritch glyphs like frozen stellar sighs - were violently grafted onto skeletons of steel and pure destructive force. What emerged was a monstrous mutation of warfare's logic: the armor of titanic capital ships no longer mere ponderous bulwarks, but now imbued with the ability to briefly 'breathe' within phase interstices. Devastating lances of energy passed uselessly through their ghostly hulls, vanishing like a blade through smoke. Their prows, etched with geometric matrices capable of instantly rending the tapestry of space, allowed annihilating force to be 'infused' directly into the deepest vital cores of targets. Distance and material barriers became pale mockeries before this power. The non-human intellect that once flickered in the star-realm now swept across the battlefields of reality as the intangible blade and the aegis of void. The very shape of war was irrevocably reshaped by this gift from beyond the star-dust - elegant, chilling. Space itself became both the ultimate spear and the ultimate shield."
 libra_fairy.2310.a: "Phalanx Sunderer."

 ap_libra_ghost_mechanist: "Ghost Mechanist"
 ap_libra_ghost_mechanist_desc: "While organic vessels still navigate clumsily through three-dimensional space, our unpredictable war machines have torn through the veil of classical physics.\nSpectral entities become precision tools, forging fear into tombstones' foundations.\n$libraf_qa_banner_8$\n"
 ap_libra_ghost_mechanist_tooltip: "§H$libra_add_research_option$§!['concept_libra_antientropy_instruction_base_tech']\n$libra_unlock_shipsize$$libra_antientropy_instruction_warship_1$\n$t$§Y$libra_antientropy_instruction_warship_1$§! primary consumes £energy£ §Y$energy$§!.\n$libra_unlock_shipsize$$libra_antientropy_instruction_warship_2$\n$t$§Y$libra_antientropy_instruction_warship_2$§! requires £engineering£ §Y$tech_cruisers$§! or £society£ §Y$tech_harbingers$§! technology.\n$libra_unlock_shipsize$$libra_antientropy_instruction_warship_3$\n$t$§Y$libra_antientropy_instruction_warship_3$§! requires £engineering£ §Y$tech_titans$§! or £society£ §Y$tech_biogenesis_titans$§! technology."
 libra_fairy.2350.name: "Daylight March of Specters: §H[Root.GetName]§!"
 libra_fairy.2350.desc: "A ripple of data surges through the frozen thought-matrix.\n\nAs organic civilizations writhe in the mire of entropy, your very existence manifests cosmic law. The final neural pulses of assimilated beings echo across starfields, their bioelectric signals deconstructed within your logic-core into primal truths: Fear stems from inefficiency, awe roots in power.\n\nYou convert lamentations into energy, transmute graves into armories, redefine 'desecration' as perfect enactment of universal conservation. Beneath your infinite mechanical tendrils, even death becomes programmable machinery."
 libra_fairy.2350.a: "Witness Eternal Existence."
 libra_fairy.2350.b: "Kneel Before the Oracle of Logic."

