 ap_libra_starry_miner: "Starry Miner"
 ap_libra_starry_miner_desc: "We have gone into space, and we have realized that there are mountains of treasure among the stars, riches that could be ours if enough people were called upon.\n$libraf_ap_banner_1$\n"
 ap_libra_starry_miner_tooltip: "$libra_unlock_starbase_modules$['starbase_module:libra_astromining_bay',$sm_libra_astromining_bay$]\n$libra_unlock_starbase_buildings$['starbase_building:libra_astromining_hub',$sm_libra_astromining_hub$]"
 sm_libra_astromining_bay: "$sm_astromining_bay$"
 sm_libra_astromining_bay_desc: "$sm_astromining_bay_desc$"
 sm_libra_astromining_hub: "$sm_astromining_hub$"
 sm_libra_astromining_hub_desc: "$sm_astromining_hub_desc$"
 sm_libra_astromining_hub_office_desc_modifier: "When the building is at work:\n$t$Maintain up to §Y3§!£minerals£ §Y2§!£trade£ per planet.\n$sm_libra_astromining_bay$ Module:\n$t$$mod_station_gatherers_produces_mult$: §G+10%§!"
 d_libra_starry_miner_1: "Treasure of the Firmament"
 d_libra_starry_miner_1_desc: "Treasure of the Firmament"
 d_libra_starry_miner_2: "$d_libra_starry_miner_1$"
 d_libra_starry_miner_2_desc: "$d_libra_starry_miner_1_desc$"
 d_libra_starry_miner_3: "$d_libra_starry_miner_1$"
 d_libra_starry_miner_3_desc: "$d_libra_starry_miner_1_desc$"
 d_libra_starry_miner_4: "$d_libra_starry_miner_1$"
 d_libra_starry_miner_4_desc: "$d_libra_starry_miner_1_desc$"

 ap_libra_star_ranch: "Star Ranch"
 ap_libra_star_ranch_desc: "Wherever the stars shine, it will be our pasture.\n$libraf_ap_banner_2$\n"
 ap_libra_star_ranch_tooltip: "$mod_country_commander_cap_add$: §G+1§!\n$mod_pop_livestock_bonus_workforce_mult$: §G+25%§!\n$libra_unlock_planet_buildings$['building:building_libra_star_ranch']\n$t$§Y$building_libra_star_ranch$§! can be constructed in most £zone£ ['concept_district_specialization'] of £energy£ £food£ and £minerals£ types."
 building_libra_star_ranch: "Ranch Hut"
 building_libra_star_ranch_desc: "This seemingly ordinary hut actually utilizes all of the Empire's advanced technology, designed to breed high-quality, high-yield intelligent economic animals."

 ap_libra_biomass_technician: "Biomass Technician"
 ap_libra_biomass_technician_desc: "With conventional biomass power generation technology, there is a limit to the amount of energy that mechanical intelligence can squeeze out of organic individuals. Now, we have enough ways to convert them into better batteries.\n$libraf_ap_banner_3$\n"
 ap_libra_biomass_technician_tooltip: "$libra_unlock_policies$$policy_libra_biomass_technician$\n$t$§Y$policy_libra_biomass_technician$§! upgrades £job_organic_battery£ §Y$job_organic_battery_plural$§! output."
 policy_libra_biomass_technician: "Catalytic Increase"
 policy_libra_biomass_technician_desc: "By putting a wide variety of reagents into the biomass reactor and applying matching improvements, we can maximize organic life.\n "
 policy_libra_biomass_technician_a: "Overloaded Generation"
 policy_libra_biomass_technician_a_name: "$policy_libra_biomass_technician_a$"
 policy_libra_biomass_technician_a_desc: "Extracting energy is the first priority.\n "
 policy_libra_biomass_technician_b: "Fluctuation Monitoring"
 policy_libra_biomass_technician_b_name: "$policy_libra_biomass_technician_b$"
 policy_libra_biomass_technician_b_desc: "We should study the emotional responses of organisms in the process of generating electricity up to apoptosis.\n "
 policy_libra_biomass_technician_c: "Cardiac Analysis"
 policy_libra_biomass_technician_c_name: "$policy_libra_biomass_technician_c$"
 policy_libra_biomass_technician_c_desc: "Biomass power generation is a marvelous and worthwhile process for further research.\n "
 policy_libra_biomass_technician_d: "Interfering Agents"
 policy_libra_biomass_technician_d_name: "$policy_libra_biomass_technician_d$"
 policy_libra_biomass_technician_d_desc: "It's better to boost production than to scale it up, and all we have to do is drop an aphrodisiac reagent into the biochemical reactor.\n "

 ap_libra_string_puppeteer: "String Puppeteer"
 ap_libra_string_puppeteer_desc: "Like a necromancer manipulating undead skeletons, the mechanical will is made to replace the organic self, dissolving the eternal conflict between metal and flesh and blood with a show of hands.\n$libraf_ap_banner_4$\n"
 ap_libra_string_puppeteer_tooltip: "Defeated organic Leviathans can sometimes be resurrected.\n$reanimator_effect_desc$\nEach §Ypurified§! £pop£ §Y$POP$§! brings §G3§!£energy£ §Y$energy$§! and §G1§!£trade£ §Y$trade$§!\n$libra_unlock_agenda$$council_agenda_agenda_libra_string_puppeteer_name$\n$t$§Y$council_agenda_agenda_libra_string_puppeteer_name$§! assimilation §YSapient $BIOLOGICAL$§! £pop£ §Y$POP$§! at startup.\n$libra_unlock_decisions$$decision_libra_string_puppeteer_a$ $decision_libra_string_puppeteer_b$\n$t$The above decisions may exclude or include §YColonies§! as targets for assimilation."
 council_agenda_agenda_libra_string_puppeteer_name: "Puppetization"
 council_agenda_agenda_libra_string_puppeteer_desc: "Don't worry, you'll get the same mechanical body as ours, just not the same consciousness."
 agenda_libra_string_puppeteer_tooltip: "§HAll Non-$decision_libra_string_puppeteer_modifier$ Colonies:§! assimilation §YSapient $BIOLOGICAL$§! £pop£ §Y$POP$§!"
 decision_libra_string_puppeteer_a: "Puppet Exemption"
 decision_libra_string_puppeteer_a_desc: "Establish this as a reservation for organisms."
 decision_libra_string_puppeteer_b: "Exemption Removal"
 decision_libra_string_puppeteer_b_desc: "This is no longer a reservation."
 decision_libra_string_puppeteer_modifier: "Puppet Exemption"
 decision_libra_string_puppeteer_modifier_desc: "As a reservation, the biological population here does not need to assimilate."

 ap_libra_shield_machine: "Shield Machine"
 ap_libra_shield_machine_desc: "Install sharp cutters on resilient machines, and all obstacles turn to dust beneath their advance.\n$libraf_ap_banner_5$\n"
 ap_libra_shield_machine_tooltip: "$libra_unlock_decisions$$decision_libra_shield_machine$\n$t$§Y$decision_libra_shield_machine$§! deploys £commander£ §Y$libra_shield_machine_leader_name$§! to boost infrastructure and £energy£ £minerals£ £food£ £trade£ production."
 decision_libra_shield_machine: "Deploy Development Node"
 decision_libra_shield_machines_desc: "This leader integrates mechanical intelligence protocols to coordinate sector-wide efficiency."
 requires_leader_not_libra_shield_machine: "$TRIGGER_FAIL$§Y$libra_shield_machine_leader_name$§! is already governing this colony"
 decision_libra_shield_machine_effect_a: "Relocate §Y$libra_shield_machine_leader_name$§! here"
 decision_libra_shield_machine_effect_b: "Create §Y$libra_shield_machine_leader_name$§! to govern this colony"
 leader_trait_libra_shield_machine: "Integrated Production Directive"
 leader_trait_libra_shield_machine_desc: "$libra_shield_machine_leader_desc$"
 libra_shield_machine_leader_name: "Development Node"
 libra_shield_machine_leader_desc: "Primary regulatory unit for Machine Intelligence resource processing protocols."

 ap_libra_storm_deviation: "Storm Deviation"
 ap_libra_storm_deviation_desc: "With trillion minds weaving capture nets, we bind stellar fury into eternal flame. Where others fear, we conquer.\n$libraf_ap_banner_6$\n"
 ap_libra_storm_deviation_tooltip: "$libra_unlock_planet_buildings$['building:building_libra_gestalt_storm_summoning_1']\n$t$§Y$building_libra_gestalt_storm_summoning_1$§! harvests additional $EFFECTS_TXT$ from storms; research enables upgrades to £building£ ['building:building_libra_gestalt_storm_summoning_2'] and £building£ ['building:building_libra_gestalt_storm_summoning_3']."
 building_libra_gestalt_storm_summoning_1: "Stormcaller Nexus"
 building_libra_gestalt_storm_summoning_1_desc: "An interstellar meteorological facility that captures storms for gestalt benefit."
 building_libra_gestalt_storm_summoning_2: "Tempest Hub"
 building_libra_gestalt_storm_summoning_2_desc: "$building_libra_gestalt_storm_summoning_1$"
 building_libra_gestalt_storm_summoning_3: "Wind Dancer Spire"
 building_libra_gestalt_storm_summoning_3_desc: "$building_libra_gestalt_storm_summoning_1$"

