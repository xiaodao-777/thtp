 trait_libra_modularity_consumer_goods_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R2§!£food£ §Y$food$§! to produce §G2§!£consumer_goods£ §Y$consumer_goods$§! per month"
 trait_libra_modularity_alloys: "Composite Foundry Protocol"
