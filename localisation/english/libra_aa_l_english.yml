 tech_libra_cloning_overload: "Chromosomal Overload"
 tech_libra_cloning_overload_desc: "Through cloning technology, we can selectively increase the secretion of specific hormones, enhancing population efficiency in designated tasks.\n$libra_gate_banner_13$"
 edict_libra_cloning_overload: "Genetic Vitality"
 edict_libra_cloning_overload_desc: "Replicate hormones to stimulate the latent potential of organisms."

 tech_repeatable_libra_cloning: "Cell Division"
 tech_repeatable_libra_cloning_desc: "Empire development resembles life propagation - continuous and unending.\n$libraf_te_banner_13$"

 ap_libra_directive_76: "Directive-76"
 ap_libra_directive_76_desc: "When the faint glow of cloning vats is replaced by the cold light of strategic displays, the creation of life transcends biology, becoming a pure military imperative: soldiers are workers, barracks are factories, and the frontline is home. Our strength lies not in individual power, but in the inexhaustibility of the collective. We are the tide, the storm - a self-replicating, endless army, composing our empire's final symphony of stellar conquest.\n$libraf_aa_banner_10$\n"
 ap_libra_directive_76_tooltip: "£commander£ §Y$subclass_commander_admiral$§! and £commander£ §Y$subclass_commander_general$§! may select §lClone Legion Commander Traits§!\nInitiates the §Y$situation_libra_directive_76$§! situation, unlocking the following content as it progresses:\n$libra_directive_76_starbase_tooltip$\n$libra_directive_76_policy_tooltip$\n$libra_directive_76_building_tooltip$\n$libra_directive_76_decision_tooltip$\n$libra_directive_76_species_trait_tooltip$\n$libra_directive_76_leader_trait_tooltip$\n$libra_directive_76_agenda_tooltip$"
 libra_fairy.10000.name: "One vision, one purpose"
 libra_fairy.10000.desc: "A silent parade unfolds among the stars. This transcends traditional displays of force, heralding a new mode of existence. In the empire's heartland, countless identical faces march in unison under stark lighting, their footsteps beating a singular rhythm, their eyes bearing one will.\n\nObservers tremble. They report this is no longer an army, but an organic, self-replicating war ecosystem. Life is efficiently designed, produced, and deployed here - each unit a flawless component of the whole. Facilities once meant for propagation are now precision workshops endlessly outputting soldiers; colonies once defined as homes are now strategic nodes fueling the frontlines.\n\nThe spark of individuality is extinguished here, only to ignite a sun of collective power. Silent, precise, and endless as a force of nature, they embody a military philosophy refined to its purest form."
 libra_fairy.10000.a: "Peace, through power!"
