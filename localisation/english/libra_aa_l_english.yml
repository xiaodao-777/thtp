 LIBRA_CUTE_MONITOR: "Moe Monitor"
 LIBRA_CUTE_MONITOR_DESC: "This component can detect the weaknesses of less-than-cute enemies via biosensory signals, though such high-intensity detection is taxing."
 LIBRACUTE: "Moe-fied"
 LIBRACUTE_DESC: "Confined to anime fantasies, now stepped into reality as the form of this species."
 trait_libra_cutefied: "Moe-fied"
 trait_libra_cutefied_desc: "This species represents the pinnacle achievement of imperial genetic technology. 'Cute yet powerful' is the best description for them."
 trait_libra_cutefied_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£energy£ §Y$energy$§! and §R1§!£food£ §Y$food$§! per month\n$t$- §RNullifies§! all ['concept_automodding_trait',$concept_automodding_traits$] except ['trait:trait_auto_hab_preference']"
