 ap_libra_nanocore: "Nanocore"
 ap_libra_nanocore_desc: "We, transformed by nanotechnology, are no longer mere machines. The boundary between individual and collective has dissolved; each of us, focusing the swarm's power, shall become omnipotent.\n$libraf_aa_banner_70$\n"
 ap_libra_nanocore_tooltip: "$MOD_LEADER_INITIAL_SKILL$: §G+1§!\n$MOD_LEADER_TRAIT_SELECTION_OPTIONS_ADD$: §G+1§!\nGains ['concept_libra_nanocore_ruler_effect'] when §YRuler§! is present\n$libra_unlock_traits$$leader_trait_libra_nanocore$\n$t$§Y$leader_trait_libra_nanocore$§! is a powerful $libra_paragon_machine_leader_traits$ whose $EFFECTS_TEXT$ includes both fixed and cumulative bonuses. The latter increases with each §Y$COUNCIL_AGENDA$§! activation, stacking up to §Y50§! times.\n$libra_unlock_agenda$$council_agenda_agenda_libra_nanocore_name$\n$t$§Y$council_agenda_agenda_libra_nanocore_name$§! can grant the §Y$leader_trait_libra_nanocore$§! trait to £leader£ §Y$MACHINE$ Leaders§! lacking it, or enhance existing §Y$leader_trait_libra_nanocore$§! traits while granting experience based on level.\n$libra_unlock_features$Morphological Ascent\n$t$Triggers §Y$situation_libra_nanocore$§! every §Y12§! years, lasting §Y5§! years. Grants £alloys£ £physics£ £society£ £engineering£ £trade£ or §YNanite Fleets§!, and may upgrade £leader£ §Y$MACHINE$ Leaders§! to $CLASS_TIER_RENOWNED$ or $CLASS_TIER_LEGENDARY$."
 libra_fairy.16000.name: "Billions as One, Singular Form"
 libra_fairy.16000.desc: "Every nanite unit in the empire whispers. Once independent machines scattered across countless bodies and creations, they now answer a silent command, summoned by a unified will. They converge like reversing galaxies, merging into the core of our leaders' existence.\n\nThis is no mere upgrade, but a collapse and remolding of being. Dispersed intelligences are forged into a transcendent consciousness; programmable matter is reconfigured into perfect dynamic forms. Our leaders have transcended design constraints, becoming ultimate forms in perpetual self-optimization and endless evolution.\n\nThe boundary between individual and collective blurs. Our leaders are both unique individuals and vessels for the swarm's collective wisdom; they guide the empire while embodying the manifestation of our civilization's power. The pinnacle is no longer a destination, but every step taken in this eternal evolution."
 libra_fairy.16000.a: "Form = Truth."
 concept_libra_nanocore_ruler_effect: "Nanocore Empire Effect"
 concept_libra_nanocore_ruler_effect_desc: "Varies by leader class. Per §Y$MOD_RULER_SKILL_ADD$§!:\n$t$$official_with_icon$:\n$tt$$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+3%§!\n$tt$$mod_shipclass_military_build_speed_mult$: §G+1%§!\n$tt$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+1%§!\n$tt$$MOD_EMPIRE_SIZE_COLONIES_MULT$: §G-1%§!\n$t$$commander_with_icon$:\n$tt$$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+1%§!\n$tt$$mod_shipclass_military_build_speed_mult$: §G+3%§!\n$tt$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+1%§!\n$tt$$MOD_EMPIRE_SIZE_DISTRICTS_MULT$: §G-1%§!\n$t$$scientist_with_icon$:\n$tt$$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+1%§!\n$tt$$mod_shipclass_military_build_speed_mult$: §G+1%§!\n$tt$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+3%§!\n$tt$$MOD_EMPIRE_SIZE_SYSTEMS_MULT$: §G-1%§!"
 leader_trait_libra_nanocore: "Nanocore"
 leader_trait_libra_nanocore_desc: "Through interconnected nanite networks, this leader attains immense processing power and constant support from nodal links."
 leader_trait_libra_nanocore_effect_tt: "\nTrait $EFFECTS_TXT$ scales with §YNanocore Enhancement Count§!. Current level: §Y[this.libra_nanocore_level]§!"
 leader_trait_libra_nanocore_official: "$leader_trait_libra_nanocore$"
 leader_trait_libra_nanocore_official_desc: "$leader_trait_libra_nanocore_desc$"
 leader_trait_libra_nanocore_commander: "$leader_trait_libra_nanocore$"
 leader_trait_libra_nanocore_commander_desc: "$leader_trait_libra_nanocore_desc$"
 leader_trait_libra_nanocore_scientist: "$leader_trait_libra_nanocore$"
 leader_trait_libra_nanocore_scientist_desc: "$leader_trait_libra_nanocore_desc$"
 leader_trait_libra_nanocore_renowned: "Epic Core"
 leader_trait_libra_nanocore_renowned_desc: "The unified will of countless nanites, the final sediment of infinite iterative data. This leader's cognitive matrix has undergone decisive topological transcendence, becoming an immortal coordinate and transcendent form within the empire's nanite network."
 leader_trait_libra_nanocore_legendary: "Legendary Core"
 leader_trait_libra_nanocore_legendary_desc: "Its consciousness flow is the empire's law of evolution; its form shifts are civilization's epic poem. No longer a mere command node, it is a perpetually iterating living legend followed by the entire nanite swarm - an existence spanning the empire's entire history."
 council_agenda_agenda_libra_nanocore_name: "Core Fusion"
 council_agenda_agenda_libra_nanocore_desc: "Gather more of us. Each of us makes all of us stronger."
agenda_libra_nanocore_tooltip: "§HAll $leader_trait_libra_nanocore$ Leaders:§! Gain §G50§! experience per §YNanocore Enhancement§!\n§HAll $MACHINE$ Leaders:§! Add or enhance §Y$leader_trait_libra_nanocore$§! trait"
 situation_libra_nanocore: "Morphological Ascent Protocol"
 situation_libra_nanocore_type: "$situation_libra_nanocore$"
 situation_libra_nanocore_monthly_change_tooltip: "§Y$sm_nanite_harvester$§!, §Y$libra_nanite_shipyard_2$§!, and £planet£ §Y$pc_nanotech$§! provide additional progress."
 situation_libra_nanocore_desc: "The nanite swarm's whispers never cease, calling for the next evolution. This is not a one-time alteration, but a cyclical process of renewal - each convergence unlocks deeper forms, each reconfiguration approaches more perfect states of being."
 situation_libra_nanocore_tooltip: "Situation ends automatically after §Y5§! years\n\nAdvance through as many stages as possible to reap benefits"
 situation_libra_nanocore_effect_1: "Gain £alloys£ £physics£ £society£ £engineering£ £trade£"
 situation_libra_nanocore_effect_2: "Create §YNanite Fleet§!"
 situation_libra_nanocore_effect_3: "Enhance §Y$leader_trait_libra_nanocore$§!"
 situation_libra_nanocore_approach: "Converge"
 libra_fairy.16010.name: "Ascent Initiated"
 libra_fairy.16010.desc: "Now, the empire's Nanocore follows its intrinsic blueprint, initiating a new cycle of self-optimization. Dispersed intellect gathers at the call; dynamic forms reshape within data streams. Each completed stage marks another irreversible step our leaders take toward the theoretical perfect form."
 libra_fairy.16011.name: "Cycle Terminated"
 libra_fairy.16011.desc: "The five-year evolution window has closed. The nanite swarm's activity pulses gradually calm, like an ebbing energy ocean, sealing unfinished evolution blueprints within stagnant cores. Potential breakthroughs and dormant potentials return to silence with the cycle's end.\n\nDuring this protocol execution, we completed partial reconstruction processes, though several evolutionary stages failed to reach theoretical thresholds. Unstable nanite matrices have been archived; over-stimulated units entered reorganization dormancy."
 libra_fairy.16011.a: "Archive current gains, prepare for new cycle."
 libra_fairy.16012.name: "Resource Optimization Protocol"
 libra_fairy.16012.desc: "The empire's nanite network has completed spontaneous efficiency restructuring. Countless microscopic units, without command, precisely flood industrial forges, research databases, and trade nodes, temporarily transforming into pure productive force.\n\nA considerable resource stream awaits transfer to the empire's core reserves."
 libra_fairy.16012.a: "Receive resources."
 libra_fairy.16013.name: "Autonomous Defense Protocol"
 libra_fairy.16013.desc: "A silent miracle unfolds within the capital's shipyard bays. Guided as if by invisible artisans, nanite clouds autonomously gather, weave, and solidify, tracing ship contours in data streams and shaping cold alloy into destructive war machines.\n\nA newly formed Nanite Fleet has departed the docks, its command awaiting transfer to the Imperial Navy."
 libra_fairy.16013.a: "Assume command."
 libra_fairy.16013.tt: "Creates a fleet at capital with maximum §Y320§! £navy_size£ §Y$FLEET_SIZE_TITLE$§!"
 libra_fairy.16014.name: "Cognitive Enhancement Protocol"
 libra_fairy.16014.desc: "A pure data stream directly injects into the Nanocore's perception matrix. This is not mere information transfer, but a profound expansion of consciousness and topological restructuring. The collective's thought processes grow unprecedentedly acute and clear; its logical core achieves new resonance with the empire's nanite network.\n\nAn essential upgrade stands ready."
 libra_fairy.16014.a: "Confirm upgrade."
 libra_fairy.16014.tt: "Add or enhance §Y$leader_trait_libra_nanocore$§! trait\nChance to upgrade £leader£ §Y$MACHINE$ Leaders§! to $CLASS_TIER_RENOWNED$ or $CLASS_TIER_LEGENDARY$"
 libra_fairy.16015.name: "Iteration Complete"
 libra_fairy.16015.desc: "The morphological ascent cycle concludes. The nanite swarm's whispers settle into harmonious resonant frequencies, like billions of stars returning to tranquility after orbital migration. During this evolutionary period, we witnessed profound restructuring of matter and intellect - each staged breakthrough infused leader forms with new potential.\n\nNow, the Nanocore emits stable pulses, marking this protocol's successful closure. Dispersed units formed more efficient networks in reorganization; all evolutionary blueprints are stored in core databases, awaiting the next cycle's activation."
 libra_fairy.16015.a: "Receive this cycle's evolutionary gains."
 libra_fairy.16015.tt: "All £leader£ §Y$MACHINE$ Leaders§! gain §G2400§! experience\nRandom §Y$leader_trait_libra_nanocore$§! upgrades to $CLASS_TIER_RENOWNED$ or $CLASS_TIER_LEGENDARY$"

