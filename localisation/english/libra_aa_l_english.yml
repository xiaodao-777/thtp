 situation_libra_cutefied_world_2_desc: "Moe-fication is not the end, but a new beginning for civilization. When dreamlike forms become the norm, inner potential begins to grow quietly - for Moe, too, is a cosmic law."
 situation_libra_cutefied_world_2_tooltip: "Generates $EFFECTS_TXT$ based on the current §YSolution§!"
