 edict_libra_liber_genesis_5: "Day of Psalms"
 edict_libra_liber_genesis_5_desc: "Chant the scriptures, focusing power."
 edict_libra_liber_genesis_6: "Day of Return"
 edict_libra_liber_genesis_6_desc: "We descend upon the sea of stars like a whirlwind, as prophesied."
 decision_libra_liber_genesis: "Creation Oracle"
 decision_libra_liber_genesis_desc: "We place a world at the singularity of psionic focus, sending our most devout supplication into the Shroud. Ancient will and pure Psionic energy will flood forth like the deluge of creation's dawn, reshaping the planet's veins and imbuing all things with a sacred blueprint. When the tide recedes, what remains is not a terraformed world, but a living sanctuary - an anchor for the divine within the material universe."
 decision_libra_liber_genesis_mod: "Creation Infusion"
 decision_libra_liber_genesis_mod_desc: "The psionic tide of creation has not yet fully subsided. Titanic energies still surge through the world's core and across its surface, catalyzing miraculous growth and unimaginable creative efficiency. This is a sacred period of 'acceleration' but a psionic manifestation of such intensity will inevitably stabilize over time, settling back into the eternal, steady sacred key of the 'Revealed Land'."
 d_libra_liber_genesis: "Revealed Land"
 d_libra_liber_genesis_desc: "This world has been utterly saturated and remade by the Psionics. Its mountains whisper ancient adages, its rivers shimmer with the glimmer of revelation, and its atmosphere hums with a gentle yet omnipresent psionic pressure. The planet itself has become a colossal psionic generator and a sacred medium, perpetually attracting pilgrims and gently shaping the form and thought of all life upon it."
