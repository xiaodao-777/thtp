 tech_libra_psionic_apocalypse: "The Apocalypse"
 tech_libra_psionic_apocalypse_desc: "Listen to the echoes of the Shroud and realise the voice of truth.\n$libraf_te_banner_2$"
 edict_libra_psionic_zro_extraction: "Zro Extraction"
 edict_libra_psionic_zro_extraction_desc: "As the substance most beneficial to psychics, Zro remains shrouded in mystery and rarity. Yet the truth is seldom so straightforward - the primordial activities of psychic energies permeate every corner of the starry seas. With careful investigation, their traces can be uncovered."

 tech_libra_psionic_destiny: "Eternal Destiny"
 tech_libra_psionic_destiny_desc: "The mastery of psychic energy is just the beginning. With this power, we will overcome previously unimaginable difficulties, defeat previously invincible opponents, and hold our destiny in our hands.\n$libraf_te_banner_2$"
 building_libra_psionic_destiny_sanctum: "Destiny Sanctum"
 building_libra_psionic_destiny_sanctum_desc: "Our choices will never again be altered by the interference of nature, because we have absolute spiritual power - we shape everything."
 edict_libra_psionic_destiny_enhance: "Siege Of Destiny"
 edict_libra_psionic_destiny_enhance_desc: "The allegory of spiritual energy will lead the enemy to destruction, and we will enjoy great prosperity alone."
 edict_libra_psionic_destiny_enhance_tooltip: "£building£ §Y$building_libra_psionic_destiny_sanctum$§! increases §G25%§! $libra_empire$ £mod_starbase_shipyard_build_speed_mult£ §Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§! and $libra_empire$ £mod_planet_army_build_speed_mult£ §Y$MOD_PLANET_ARMY_BUILD_SPEED_MULT$§!"

 tech_libra_psionic_favour: "Psionic Favour"
 tech_libra_psionic_favour_desc: "We take gifts from the void, and we give our faith back to the world. We do not neglect what we have gained, nor do we forget what we have lost.\n$libraf_te_banner_2$"
 building_libra_psionic_favour_sanctum: "Favour Sanctum"
 building_libra_psionic_favour_sanctum_desc: "Spiritual favor will bless us ...... forever."
 edict_libra_psionic_favour_enhance: "Universal Rainfall"
 edict_libra_psionic_favour_enhance_desc: "Descend, dew of psionic. That warm power will nurture each of our young children to healthy growth."
 edict_libra_psionic_favour_enhance_tooltip: "£building£ §Y$building_libra_psionic_favour_sanctum$§! provides §G+12§!£mod_planet_pop_assembly_add£ §Y$POP$ Assembly§!"

 tech_libra_psionic_reflection: "Primal Contemplation"
 tech_libra_psionic_reflection_desc: "We know our origin and our destination - a winding path connecting beginning to end. The Shroud's whispers shall guide us past its forks.\n$libraf_te_banner_2$"
 building_libra_psionic_reflection_sanctum: "Reflection Sanctum"
 building_libra_psionic_reflection_sanctum_desc: "Here, primordial thoughts collide, awakening power from the depths."
 edict_libra_psionic_reflection_enhance: "Profound Enlightenment"
 edict_libra_psionic_reflection_enhance_desc: "Scrutinize the flow of thought to recover wisdom we have overlooked."
 edict_libra_psionic_reflection_enhance_tooltip: "£building£ §Y$building_libra_psionic_reflection_sanctum$§! on §YArtificial Planets§! increase $libra_empire$ £mod_planet_max_districts_add£ §YHabitat District Build Cap§!.\n£building£ §Y$building_libra_psionic_reflection_sanctum$§! on §YNatural Planets§! increase $libra_empire$ £mod_planet_max_districts_add£ §YResource District Build Cap§!\n"

 tech_libra_psionic_eulogy: "Harmony Ritual"
 tech_libra_psionic_eulogy_desc: "In synchronized psychic ebb and flow, we will achieve the highest level of resonance; in harmonious psychic praise, we will have the maximum of ourselves.\n$libraf_te_banner_2$"
 TECH_UNLOCK_LIBRA_PSIE_CA_TITLE: "$libra_unlock_agenda$$council_agenda_agenda_libra_psionic_eulogy_name$"
 TECH_UNLOCK_LIBRA_PSIE_CA_DESC: "§H$council_agenda_agenda_libra_psionic_eulogy_name$§!\nCooldown §Y20§! years, gain additional benefits from £building£ §Y$building_libra_psionic_destiny_sanctum$§!, £building£ §Y$building_libra_psionic_favour_sanctum$§!, and £building£ §Y$building_libra_psionic_reflection_sanctum$§!."
 council_agenda_agenda_libra_psionic_eulogy_name: "Herald's Proclamation"
 council_agenda_agenda_libra_psionic_eulogy_desc: "We draw power from the psionic realm, and through it, spread our influence across the empire."
 agenda_libra_psionic_eulogy_modifier: "$council_agenda_agenda_libra_psionic_eulogy_name$ Agenda"
 agenda_libra_psionic_eulogy_tooltip: "$libra_government_cooldown_effect$\nIf §Y3§! £building£ §Y$building_libra_psionic_destiny_sanctum$§! are present:\n$t$Randomly increases §Y$planetary_ascension$§! by §G25~5§! tiers, inversely scaled by $libra_empire$ §Y$planetary_ascension$§! levels\nIf §Y3§! £building£ §Y$building_libra_psionic_favour_sanctum$§! are present:\n$t$Creates §G5000~500§! £pop£ §Y$POP$§! on capital, inversely scaled by $libra_empire$ total £pop£ §Y$POP$§!\nIf §Y3§! £building£ §Y$building_libra_psionic_reflection_sanctum$§! are present:\n$t$Randomly increases §YLeader Skill Level§! by §G25~5§! levels, inversely scaled by $libra_empire$ £leader£ §YLeaders§! count"

