 concept_libra_synthetic_commands_traits_desc: "Mutually exclusive traits applicable to §Y$ROBOT$§! species, providing leaders with specialized enhancements in corresponding areas, including:\n$t$- ['trait:trait_libra_synthetic_commands_a']\n$t$- ['trait:trait_libra_synthetic_commands_b']\n$t$- ['trait:trait_libra_synthetic_commands_c']\n$t$- ['trait:trait_libra_synthetic_commands_d']\n$t$- ['trait:trait_libra_synthetic_commands_e']"
 trait_libra_synthetic_commands_a: "Abundance Function"
 trait_libra_synthetic_commands_a_desc: "This algorithm elevates resource management and logistics optimization to an art form, capable of continuously discovering singularities of efficiency within seemingly rigid production processes."
 trait_libra_synthetic_commands_a_tt: "Grants £leader£ §YLeaders§! $libra_veteran_machine_leader_traits$ focused on §HProduction§!"
 leader_trait_libra_synthetic_command_a: "$trait_libra_synthetic_commands_a$"
 leader_trait_libra_synthetic_command_a_desc: "Under this leader's coordination, resources converge spontaneously towards the most efficient production nodes, as if drawn by gravity."
 trait_libra_synthetic_commands_b: "Paradise Protocol"
 trait_libra_synthetic_commands_b_desc: "This protocol treats barren worlds as blank slates awaiting optimal solutions, aiming to maximize planetary carrying capacity and development potential."
 trait_libra_synthetic_commands_b_tt: "Grants £leader£ §YLeaders§! $libra_veteran_machine_leader_traits$ focused on §HExpansion§!"
 leader_trait_libra_synthetic_command_b: "$trait_libra_synthetic_commands_b$"
 leader_trait_libra_synthetic_command_b_desc: "Worlds under their management progress from colonization to high-level development at an astonishing rate, with order and efficiency taking root in every inch of soil."
 trait_libra_synthetic_commands_c: "Bloodthirsty Code"
 trait_libra_synthetic_commands_c_desc: "A ruthless combat program designed to transform any conflict into a perfectly calculated annihilation operation, where maximizing lethality and minimizing losses are its sole directives."
 trait_libra_synthetic_commands_c_tt: "Grants £leader£ §YLeaders§! $libra_veteran_machine_leader_traits$ focused on §HMilitary§!"
 leader_trait_libra_synthetic_command_c: "$trait_libra_synthetic_commands_c$"
 leader_trait_libra_synthetic_command_c_desc: "Fleets and armies under this leader's command function as precise instruments of destruction, with each offensive strike targeting the critical systems of the foe."
 trait_libra_synthetic_commands_d: "Pedant Directive"
 trait_libra_synthetic_commands_d_desc: "This instruction set transforms curiosity into a systematic deconstruction process, capable of distilling elegant scientific laws from chaotic natural phenomena."
 trait_libra_synthetic_commands_d_tt: "Grants £leader£ §YLeaders§! $libra_veteran_machine_leader_traits$ focused on §HTechnology§!"
 leader_trait_libra_synthetic_command_d: "$trait_libra_synthetic_commands_d$"
 leader_trait_libra_synthetic_command_d_desc: "Research under their guidance becomes an efficient, industrialized process, with technological barriers dismantled into executable development steps."
 trait_libra_synthetic_commands_e: "Game Theory Module"
 trait_libra_synthetic_commands_e_desc: "This module treats society as a complex dynamic system, calculating the interactions between billions of variables to find the optimal strategy for maintaining the empire's eternal stability."
 trait_libra_synthetic_commands_e_tt: "Grants £leader£ §YLeaders§! $libra_veteran_machine_leader_traits$ focused on §HAdministration§!"
 leader_trait_libra_synthetic_command_e: "$trait_libra_synthetic_commands_e$"
 leader_trait_libra_synthetic_command_e_desc: "Their governance resembles a grand, real-time calculation, neutralizing potential upheavals before they manifest and ensuring the smooth operation of every cog in the imperial machine."

 tech_libra_synthetic_correction: "Faulty Personality Correction"
 tech_libra_synthetic_correction_desc: "$libra_synthetic_tech_auth_tt$Through deep memory scans and logical restructuring, we can accurately identify and repair thought patterns deviating from the optimal path, ensuring all individual consciousness remains perfectly synchronized with the empire's collective will.\n$libraf_te_banner_4$"
 building_libra_personality_correction_institute: "Personality Correction Institute"
 building_libra_personality_correction_institute_desc: "This facility is not a prison, but a diagnostics center for consciousness. Here, irrational thoughts, inefficient decision-making, and dangerous personality deviations arising from data corruption or logical conflicts are systematically diagnosed and reset to their optimal factory state."

 tech_libra_synthetic_truth: "Synthetic Consensus Template"
 tech_libra_synthetic_truth_desc: "$libra_synthetic_tech_auth_tt$We have constructed a set of unfalsifiable foundational axioms that serve as the absolute premise for all logical deductions made by synthetic consciousness, ensuring ideological unity and the empire's eternal stability at its very root.\n$libraf_te_banner_4$"
 building_libra_ministry_of_mechanical_truth: "Ministry of Mechanical Truth"
 building_libra_ministry_of_mechanical_truth_desc: "This is the lighthouse and bastion of the empire's ideology. It defines what constitutes rationality and truth, and systematically eliminates any 'heretical' data streams that might challenge the core axioms."

 tech_libra_synthetic_leaders: "Artificial Paragons"
 tech_libra_synthetic_leaders_desc: "By analyzing the behavioral patterns of all exceptional leaders in history, we can encode these qualities into inheritable algorithm packages, enabling the mass production of customized synthetic minds born for leadership and conquest.\n$libraf_te_banner_4$"
 TECH_UNLOCK_LIBRA_SLTU_TITLE: "$libra_unlock_features$Synthetic Trait Upgrade"
 TECH_UNLOCK_LIBRA_SLTU_DESC: "§HSynthetic Trait Upgrade§!\nCan upgrade §Y$ROBOT$§! leaders' $libra_veteran_machine_leader_traits$ to level §Y2§!."
 libra_synthetic_army: "Elite Synthetic Corps"
 libra_synthetic_army_desc: "These combat units are not mere automated machines, but elites equipped with advanced tactical AIs. They can share battlefield data in real-time, execute complex coordinated tactics, and completely remove fear and hesitation from the equation of war."

 tech_libra_synthetic_workforce: "Structural Reinforcement"
 tech_libra_synthetic_workforce_desc: "$libra_synthetic_tech_auth_tt$We have redesigned the load-bearing structures and power transmission systems of synthetic bodies, enabling them to perform various tasks more enduring and efficiently without increasing core energy consumption.\n$libraf_te_banner_4$"

 tech_repeatable_libra_synthetic_a: "Energy Upgrade"
 tech_repeatable_libra_synthetic_a_desc: "Each iteration brings our energy utilization closer to the theoretical limit. From superconducting materials to quantum tunneling effects, we continuously push the boundaries of energy efficiency for synthetic bodies and facilities.\n$libraf_te_banner_4$"

 tech_repeatable_libra_synthetic_b: "Social Drive"
 tech_repeatable_libra_synthetic_b_desc: "By optimizing data exchange protocols and collaboration algorithms between consciousness networks, we continuously enhance the collective intelligence of the entire synthetic society when dealing with complex administrative and social science problems.\n$libraf_te_banner_4$"

 tech_repeatable_libra_synthetic_c: "Material Enhancement"
 tech_repeatable_libra_synthetic_c_desc: "From nano-level self-repair to dynamic adaptive armor, we engage in endless upgrades of the materials that constitute our beings, making every synthetic body an indestructible masterpiece of engineering.\n$libraf_te_banner_4$"

