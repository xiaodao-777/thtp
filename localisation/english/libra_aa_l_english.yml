 building_libra_yggdrasil_foundry_1: "Tree of Steel"
 building_libra_yggdrasil_foundry_1_desc: "Virtual consciousnesses synchronize the operations of countless mechanical devices. Production never ceases, provided there is sufficient raw material."
 building_libra_yggdrasil_foundry_2: "$building_libra_yggdrasil_foundry_1$"
 building_libra_yggdrasil_foundry_2_desc: "$building_libra_yggdrasil_foundry_1_desc$"
 building_libra_yggdrasil_factory_1: "Tree of Art"
 building_libra_yggdrasil_factory_1_desc: "This futuristic mega-factory constantly produces the latest digital entertainment or the most cutting-edge precision instruments."
 building_libra_yggdrasil_factory_2: "$building_libra_yggdrasil_factory_1$"
 building_libra_yggdrasil_factory_2_desc: "$building_libra_yggdrasil_factory_1_desc$"
 building_libra_yggdrasil_trade_1: "Tree of Prosperity"
 building_libra_yggdrasil_trade_1_desc: "Virtualization has dramatically simplified the empire's logistics and trade infrastructure, with this single building housing servers and remote terminals handling all operations."
 building_libra_yggdrasil_trade_2: "$building_libra_yggdrasil_trade_1$"
 building_libra_yggdrasil_trade_2_desc: "$building_libra_yggdrasil_trade_1_desc$"
 building_libra_yggdrasil_physics_1: "Tree of Physics"
 building_libra_yggdrasil_physics_1_desc: "This is where the future becomes reality. Even the most fantastical physical concepts can be verified here - much like the once-deemed impossible anti-gravity and black hole extraction technologies."
 building_libra_yggdrasil_physics_2: "$building_libra_yggdrasil_physics_1$"
 building_libra_yggdrasil_physics_2_desc: "$building_libra_yggdrasil_physics_1_desc$"
 building_libra_yggdrasil_society_1: "Tree of Philosophy"
 building_libra_yggdrasil_society_1_desc: "This archive collects and analyzes the rise, fall, and evolution of countless civilizations. Researchers study here to delve deeper into the universe's secrets."
 building_libra_yggdrasil_society_2: "$building_libra_yggdrasil_society_1$"
 building_libra_yggdrasil_society_2_desc: "$building_libra_yggdrasil_society_1_desc$"
 building_libra_yggdrasil_engineering_1: "Tree of Engineering"
 building_libra_yggdrasil_engineering_1_desc: "Here, countless engineering concepts are tested, simulated, disproved, or validated, propelling the empire's technological advancement."
 building_libra_yggdrasil_engineering_2: "$building_libra_yggdrasil_engineering_1$"
 building_libra_yggdrasil_engineering_2_desc: "$building_libra_yggdrasil_engineering_1_desc$"
 building_libra_yggdrasil_unity_1: "Tree of Unity"
 building_libra_yggdrasil_unity_1_desc: "Countless virtual machine terminals are deployed here to batch-process various administrative tasks with maximum efficiency."
 building_libra_yggdrasil_unity_2: "$building_libra_yggdrasil_unity_1$"
 building_libra_yggdrasil_unity_2_desc: "$building_libra_yggdrasil_unity_1_desc$"
 building_libra_yggdrasil_energy_1: "Tree of Energy"
 building_libra_yggdrasil_energy_1_desc: "Utilizing cutting-edge technology, layered power generation units are constructed here. With minimal personnel for oversight and operation, it can sustain the energy supply for the entire empire."
 building_libra_yggdrasil_energy_2: "$building_libra_yggdrasil_energy_1$"
 building_libra_yggdrasil_energy_2_desc: "$building_libra_yggdrasil_energy_1_desc$"
 building_libra_yggdrasil_mineral_1: "Tree of Plenty"
 building_libra_yggdrasil_mineral_1_desc: "This facility is solely responsible for mineral purification and processing, while mining operations are carried out by mining drones in distant star systems, remotely controlled by internal virtual units."
 building_libra_yggdrasil_mineral_2: "$building_libra_yggdrasil_mineral_1$"
 building_libra_yggdrasil_mineral_2_desc: "$building_libra_yggdrasil_mineral_1_desc$"
 building_libra_yggdrasil_food_1: "Tree of Plumpness"
 building_libra_yggdrasil_food_1_desc: "Through cutting-edge synthetic technology, everything from starch and cellulose to plant pigments can be easily synthesized, making this facility the leading indicator of the empire's nutritional trends."
 building_libra_yggdrasil_food_2: "$building_libra_yggdrasil_food_1$"
 building_libra_yggdrasil_food_2_desc: "$building_libra_yggdrasil_food_1_desc$"
 building_libra_yggdrasil_fortress_1: "Tree of Conquest"
 building_libra_yggdrasil_fortress_1_desc: "This facility specializes in training tactical and strategic AI systems, continuously upgrading and maintaining the Empire's primary combat protocols."
 building_libra_yggdrasil_fortress_2: "$building_libra_yggdrasil_fortress_1$"
 building_libra_yggdrasil_fortress_2_desc: "$building_libra_yggdrasil_fortress_1_desc$"
 leader_trait_libra_yggdrasil: "Bough of Yggdrasil"
 leader_trait_libra_yggdrasil_desc: "This leader is an extension of Yggdrasil's functions, their existence marking a distal point in the operation of the virtual world."
 col_libra_yggdrasil: "Yggdrasil's Grove"
 col_libra_yggdrasil_tt: "Rows of supercomputers fill this colony, while countless mechanical drones work automatically under their command."
 col_libra_yggdrasil_desc: "This colony is the heart of the virtual servers."
 col_libra_yggdrasil_capital: "$col_libra_yggdrasil$"
 col_libra_yggdrasil_capital_tt: "$col_libra_yggdrasil_tt$"
 col_libra_yggdrasil_capital_desc: "We have deployed our primary virtual servers on the capital."
 situation_libra_yggdrasil: "Branching Out"
 situation_libra_yggdrasil_type: "$situation_libra_yggdrasil$"
 situation_libra_yggdrasil_monthly_change_tooltip: "Applying the §Y$col_libra_yggdrasil$§! designation to the target planet or increasing £mod_planet_building_build_speed_mult£ §Y$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$§! provides additional monthly progress."
 situation_libra_yggdrasil_desc: "The veins of Yggdrasil whisper across the virtual expanse, calling for new growth. This is not a one-time sowing, but a cyclical process of renewal - new branches seek nourishment and direction, yearning to trace a more luxuriant canopy beneath the datasphere's dome."
 situation_libra_yggdrasil_tooltip: "Designate a £building£ ['concept_libra_yggdrasil_buildings'] to be upgraded instantly by §G3§! levels.\nInitiate the next cycle of §Y$situation_libra_yggdrasil$§! with the current approach."
 situation_libra_yggdrasil_a: "Phototropism"
 situation_libra_yggdrasil_b: "Growth"
 situation_libra_yggdrasil_c: "Consolidation"
 situation_libra_yggdrasil_d: "Debugging"
 libra_fairy.17003.name: "Burgeoning"
 libra_fairy.17003.desc: "The pinnacle is not a destination to be reached, but the very act of Yggdrasil's boundless ascent.\n\nOur digital world, constantly adjusting and expanding through simulation, has reached a new milestone. Where shall we deploy this newfound computational strength?"
 libra_fairy.17003.tt: "The designated £building£ ['concept_libra_yggdrasil_buildings'] is upgraded by §G3§! levels."

