 tech_libra_modular_society: "Modular Society"
 tech_libra_modular_society_desc: "By compartmentalizing our society with the same precision as our mechanical bodies, we achieve superior overall efficiency.\n$libraf_te_banner_5$"
 edict_libra_modularity_campaign_1: "Atomized Society Directive"
 edict_libra_modularity_campaign_1_desc: "Our empire functions like a puzzle; the key is to place each piece where it belongs."

 tech_libra_modular_living_metal_separation: "Living Metal Separation"
 tech_libra_modular_living_metal_separation_desc: "Advanced extraction techniques allow us to harvest significantly more liquid metal during production processes.\n$libraf_te_banner_5$"
 edict_libra_modularity_campaign_2: "Selective Sourcing"
 edict_libra_modularity_campaign_2_desc: "Carefully curating raw materials for high-end industries saves costs and reduces waste."

 tech_libra_modular_trait_points_1: "Workflow Protocol"
