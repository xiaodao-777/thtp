 council_agenda_agenda_libra_directive_76_d_desc: "Countless creations for a single purpose: the enemy's eradication."
 agenda_libra_directive_76_d_tooltip: "Each §Y$leader_trait_libra_directive_76$§! §Y$commander_with_icon$§! provides §G+4%§! £mod_starbase_shipyard_build_speed_mult£ §Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§! and §G+4%§! £mod_planet_army_build_speed_mult£ §Y$MOD_PLANET_ARMY_BUILD_SPEED_MULT$§! for the next §Y20§! years, up to §G+100%§! each."
 council_agenda_agenda_libra_directive_76_e_name: "Directive: Proliferation"
