 ap_libra_heavenly_throne: "Heavenly Throne"
 ap_libra_heavenly_throne_desc: "Throughout history, countless myths and legends have been passed down - endless tales of celestial courts beyond the sky, envisioned yet forever out of reach.\nNow, we possess psionics. We stand closer to godhood than ever before. One more step, and the most exceptional among us may ascend as true divinities.\n$libraf_aa_banner_90$\n"
 ap_libra_heavenly_throne_tooltip: "Each level of $libra_common_psionic_leader_traits$ grants §G+10%§! £mod_leader_species_exp_gain£ §Y$MOD_LEADER_SPECIES_EXP_GAIN$§!\nEach level of $libra_veteran_psionic_leader_traits$ grants §G+1§! £mod_leader_skill_levels£ §Y$MOD_LEADER_SKILL_ADD$§!\n$libra_unlock_policies$$policy_libra_heavenly_throne$\n$t$§Y$policy_libra_heavenly_throne$§! enables §Y$telepath_type_plural_with_icon$§! to generate additional resources of the specified type.\n$libra_unlock_planet_buildings$['building:building_libra_heavenly_throne_1']\n$t$§Y$building_libra_heavenly_throne_1$§! increases £mod_produces_mult£ §Y$mod_psionic_pop_bonus_workforce_mult$§! based on §Y$planetary_ascension$§! tier, and can be upgraded to £building£ ['building:building_libra_heavenly_throne_2'].\n$libra_start_situation$$situation_libra_heavenly_throne$\n$t$§Y$situation_libra_heavenly_throne$§! automatically restarts every §Y8§! years with selectable bonuses. Cumulative progress completion §Rgrants no benefits§!. §YDelve into the Shroud§! may cause unpredictable effects on the situation.\n$libra_unlock_agenda$$council_agenda_agenda_libra_heavenly_throne_name$\n$t$§Y$council_agenda_agenda_libra_heavenly_throne_name$§! gains additional $EFFECTS_TXT$ scaling with the number of £building£ ['building:building_libra_heavenly_throne_2'] and successful completions of §Y$situation_libra_heavenly_throne$§!."
 libra_fairy.18000.name: "Celestial Banners Fly, Sacred Light Cleanses the Mundane"
 libra_fairy.18000.desc: "Psionic light of utmost purity erupts from the core of our consciousness, flooding every corner of reality. It redefines the boundary between matter and spirit - the empire's physical territory remains, yet its essence has ascended into a psionic sanctuary transcending star systems.\n\nThis sacred light conducts a grand purification. It pierces equally through every individual, every line of code, every strand of consciousness, precisely stripping away chaos and inefficiency. Clashing thoughts, redundant commands, conflicting nodes - all are cleansed within the radiance, returning to a harmonious and efficient origin.\n\nThe celestial realm has descended, rooted in our collective will. Mundane turmoil is utterly washed away. We, as a whole, have become the brilliance that illuminates the Shroud and defines cosmic order."
 libra_fairy.18000.a: "Psionics Supreme."
 libra_fairy.18000.tt: "Raises §Y$planetary_ascension$§! on all colonies to §G3§!\nRandomly increases §Y$planetary_ascension$§! by §G5§! tiers"
 policy_libra_heavenly_throne: "Edict of Supremacy"
 policy_libra_heavenly_throne_desc: "Psionics bring blessings, though their forms are unpredictable. Through unified psionic waveform control, these volatile energies obey our will, becoming tangible gains.\n "
 policy_libra_heavenly_throne_a: "Seek Abundance"
 policy_libra_heavenly_throne_a_name: "$policy_libra_heavenly_throne_a$"
 policy_libra_heavenly_throne_a_desc: "Where psionic light encircles, flora thrives and harvests abound.\n "
 policy_libra_heavenly_throne_a_nf: "$policy_libra_heavenly_throne_a$"
 policy_libra_heavenly_throne_a_nf_name: "$policy_libra_heavenly_throne_a_nf$"
 policy_libra_heavenly_throne_a_nf_desc: "$policy_libra_heavenly_throne_a_desc$"
 policy_libra_heavenly_throne_b: "Forge Steel"
 policy_libra_heavenly_throne_b_name: "$policy_libra_heavenly_throne_b$"
 policy_libra_heavenly_throne_b_desc: "Psionics dissolve energy as we will, shaping base matter into perfect industrial goods.\n "
 policy_libra_heavenly_throne_b_nl: "$policy_libra_heavenly_throne_b$"
 policy_libra_heavenly_throne_b_nl_name: "$policy_libra_heavenly_throne_b_nl$"
 policy_libra_heavenly_throne_b_nl_desc: "$policy_libra_heavenly_throne_b_desc$"
 policy_libra_heavenly_throne_c: "Cleanse the Mundane"
 policy_libra_heavenly_throne_c_name: "$policy_libra_heavenly_throne_c$"
 policy_libra_heavenly_throne_c_desc: "No words are needed; even the common mind comprehends our profound truths.\n "
 planet_libra_throne: "$ap_libra_heavenly_throne$"
 building_libra_heavenly_throne_1: "Celestial Oracle"
 building_libra_heavenly_throne_1_desc: "The finest psionics of the colony gather here, striving to maximize the blessings bestowed by their power."
 building_libra_heavenly_throne_1_effect_desc: "Increases §G+10%§! £mod_produces_mult£ §Y$mod_psionic_pop_bonus_workforce_mult$§! per §Y$planetary_ascension$§! tier."
 building_libra_heavenly_throne_2: "Celestial Sanctum"
 building_libra_heavenly_throne_2_desc: "Within this resplendent sanctum, profound psionic energies cycle infinitely, guiding the entire colony toward higher synchronization."
 building_libra_heavenly_throne_2_effect_desc: "Provides §G+25§! £job_libra_harmonize_envoy£ §YJobs§! per £district£ §YDistrict§! on the colony.\nWhen appointing £leader£ Y$leader_trait_chosen$§! as governor, additionally increases the £physics£ £society£ £engineering£ output."
 situation_libra_heavenly_throne: "Throne Oath"
 situation_libra_heavenly_throne_type: "$situation_libra_heavenly_throne$"
 situation_libra_heavenly_throne_monthly_change_tooltip: "§Y$telepath_type_plural_with_icon$§! and §Y$libra_psychics_type_plural_with_icon$§! push the situation in different directions. Use approaches to alter progress and prevent completion."
 situation_libra_heavenly_throne_desc: "At the luminous heart of the celestial realm, a ritual to sculpt reality unfolds. The empire's psionics channel their wills into a unified stream, attempting to forge the Shroud's turbulent energies into an eternal oath that sustains the Throne and blesses all.\n\nThis demands perfect balance and unwavering guidance. Each psionic rune must align flawlessly with the whole to transform wild energy currents into ordered blessings. The slightest discord could collapse this grand construct into meaningless chaos. Success will inscribe a hymn of power for the empire; any faltering will undo all efforts."
 situation_libra_heavenly_throne_effect_1: "Upon successful restart:\n$t$$libra_fairy.18011.tt.1$\n$t$$libra_fairy.18011.tt.2$"
 situation_libra_heavenly_throne_effect_2: "Upon successful restart:\n$t$$libra_fairy.18011.tt.2$"
 situation_libra_heavenly_throne_tooltip: "Fails and restarts the §Y$situation_libra_heavenly_throne$§! situation\n\nMaintain the situation by preventing progress from reaching extremes"
 situation_libra_heavenly_throne_approach_a: "Inscribe"
 situation_libra_heavenly_throne_approach_b: "Overwrite"
 situation_libra_heavenly_throne_approach_c: "Anchor"
 libra_fairy.18010.name: "Imbalance"
 libra_fairy.18010.desc: "We failed to complete the Oath. The psionics wielded discordant forces, producing incomprehensible runes. To forcibly accept this power would only harm the empire. We have no choice but to begin anew."
 libra_fairy.18011.name: "Oath Perfected"
 libra_fairy.18011.desc: "The wills of our psionics resonate in harmony within the Shroud's depths. Once turbulent power flows have been tamed, crystallizing into countless shimmering runes that form a glorious, stable ring of law around the Throne. Only the final chapter of this grand Oath remains - the ultimate sigil that will define how the empire's power manifests.\n\nWhat shall we inscribe in this last passage?"
 libra_fairy.18011.a: "Sacred Light Guides, Unopposed in Battle."
 libra_fairy.18011.a.tt: "Gain §G+25%§! £mod_ship_weapon_damage£ §Y$MOD_SHIP_WEAPON_DAMAGE$§! and £mod_ship_fire_rate_mult£ §Y$MOD_SHIP_FIRE_RATE_MULT$§!"
 libra_fairy.18011.b: "Divine Radiance Protects, Our Legacy Endures."
 libra_fairy.18011.b.tt: "Gain §G+40%§! £mod_ship_armor_mult£ §Y$MOD_SHIP_ARMOR_MULT$§! and £mod_ship_shield_mult£ §Y$MOD_SHIP_SHIELD_MULT$§!"
 libra_fairy.18011.c: "Celestial Hosts Arrayed, Their Might Awe-Inspiring."
 libra_fairy.18011.c.tt: "Gain §G+65%§! £mod_army_damage_mult£ §Y$MOD_ARMY_DAMAGE_MULT$§! and £mod_army_health£ §Y$MOD_ARMY_HEALTH_MULT$§!"
 libra_fairy.18011.tt.1: "Random §Y$leader_trait_psionic$§! leader awakens as §Y$leader_trait_chosen$§!"
 libra_fairy.18011.tt.2: "Randomly increases §Y$planetary_ascension$§! by §G3§! tiers"
 libra_fairy.18021.name: "The Shroud: §YHarmony§!"
 libra_fairy.18021.desc: "The Shroud's influence is unfathomable, especially when we gather our strength to breach new heights.\n\nAfter our last venture, our psionics sensed new possibilities:\n'The chapter... could be written thus.'"
 libra_fairy.18022.name: "The Shroud: §YInterference§!"
 libra_fairy.18022.desc: "The Shroud's influence is unfathomable, especially when we gather our strength to breach new heights.\n\nAfter our last venture, we detected an anomalous disturbance attempting to alter our psionic awareness - though it ultimately failed."
 libra_fairy.18023.name: "The Shroud: §HIntervention§!"
 libra_fairy.18023.desc: "The Shroud's influence is unfathomable, especially when we gather our strength to breach new heights.\n\nAfter our last venture, a power - indistinguishable between blessing and curse - followed us back, affecting the entire empire: trade flourished, yet stability wavered."
 libra_fairy.18024.name: "The Shroud: §RStrife§!"
 libra_fairy.18024.desc: "The Shroud's influence is unfathomable, especially when we gather our strength to breach new heights.\n\nAfter our last venture, some entities showed significant unrest. Influenced by this, our psionic powers briefly turned volatile and dangerous."
 libra_fairy.18025.name: "The Shroud: §GInspiration§!"
 libra_fairy.18025.desc: "The Shroud's influence is unfathomable, especially when we gather our strength to breach new heights - yet unknown encounters aren't always dire.\n\nWe met a peculiar entity in gothic attire, who miraculously revealed the secrets of the runes to us before departing."
 libra_fairy.18025.a: "A perfect chapter indeed."
 council_agenda_agenda_libra_heavenly_throne_name: "Immortal Destiny"
 council_agenda_agenda_libra_heavenly_throne_desc: "All past deeds inscribed, every sanctum a foundation, forging this eternal, immortal destiny."
 agenda_libra_heavenly_throne_tooltip: "Allows reselecting a modifier lasting §Y30§! years. Its strength depends on £building£ ['building:building_libra_heavenly_throne_2'] count and §Y$situation_libra_heavenly_throne$§! success tally."
 libra_fairy.18005.name: "Where Destiny Leads"
 libra_fairy.18005.desc: "The universe's origin beckons, flowing with streams of pure conceptual power. Now, the empire's collective will shall steer this force, shaping it into the cornerstone of our eternal future.\n\nTo which domain shall we direct this boon of destiny?"
 libra_fairy.18005.a: "Wisdom."
 libra_fairy.18005.b: "Fortune."
 libra_fairy.18005.c: "Abundance."
 libra_fairy.18005.d: "Prosperity."
 agenda_libra_heavenly_throne_modifier_1: "Destiny's Wisdom"
 agenda_libra_heavenly_throne_modifier_2: "Destiny's Fortune"
 agenda_libra_heavenly_throne_modifier_3: "Destiny's Abundance"
 agenda_libra_heavenly_throne_modifier_4: "Destiny's Prosperity"

