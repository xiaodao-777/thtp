 edict_libra_atomic_heart_1: "Enhanced Combat Intelligence"
 edict_libra_atomic_heart_1_desc: "This protocol enables all combat units to achieve extraordinary coordination and tactical efficiency through atomic-level real-time information exchange, turning the battlefield into a stage for precise deduction."
 tech_libra_atomic_heart_b: "Autonomous Power Distribution"
 tech_libra_atomic_heart_b_desc: "By deconstructing energy to its most fundamental flow patterns, we achieve instantaneous, optimal distribution across ship power networks, directing every unit of output to the highest logical priority.\n$libraf_te_banner_5$"
 LIBRA_ATOMIC_REACTOR_BOOSTER: "Autonomous Energy Core"
 LIBRA_ATOMIC_REACTOR_BOOSTER_DESC: "We and the ship, in essence, are one. These secondary reactors are automatically regulated by advanced intelligence to regulate their power output and share the operational strain of the ship's primary energy source."
 edict_libra_atomic_heart_2: "Core Reactor Overboost"
 edict_libra_atomic_heart_2_desc: "Intelligent systems automatically monitor and maintain ship reactors at peak efficiency - a privilege of our modular empire, requiring mastery of living metal to ensure self-repair outpaces degradation."
 tech_libra_atomic_heart_c: "Autonomous System Governance"
 tech_libra_atomic_heart_c_desc: "Our will can now be projected on a galactic scale, with every station and ship becoming a node in a vast automated process, ensuring absolute efficiency in the cycle of resources and commands.\n$libraf_te_banner_5$"
 sm_libra_atomic_heart_array: "Atomic Monitoring Array"
 sm_libra_atomic_heart_array_desc: "A network of upgraded mechanical units significantly enhances starbase capabilities. Like neural endpoints, it feeds real-time data from vast regions into the core logic, extending our perception boundlessly.\n"
 edict_libra_atomic_heart_3: "Rapid Replication Protocol"
 edict_libra_atomic_heart_3_desc: "Transcending linear growth, this protocol enables exponential expansion akin to cellular division, meeting any scale demanded by the logical core."
 tech_libra_atomic_heart_d: "Autonomous Module Configuration"
 tech_libra_atomic_heart_d_desc: "The ultimate application of living metal allows our units to dynamically self-reconfigure and optimize functionality based on environmental needs, signifying the final transcendence of design limitations.\n$libraf_te_banner_5$"
 building_libra_atomic_heart: "Atomic Simulation Core"
 building_libra_atomic_heart_desc: "This core bridges command and reality, providing near-perfect predictions for imperial decisions through countless precise simulations."
 edict_libra_atomic_heart_4: "Automated Production Lines"
 edict_libra_atomic_heart_4_desc: "The entire production chain, from raw materials to finished goods, operates autonomously in a closed loop. Efficiency and quality are guaranteed by immutable atomic laws, eternally."
 decision_libra_atomic_heart: "Triune Integration"
 decision_libra_atomic_heart_desc: "The perfect unification of time, space, and mass guides the Mechanical Empire to its ultimate - and most perfect - equilibrium."
 decision_libra_atomic_heart_effect: "Enhances bonuses from §Y$concept_libra_atomic_heart_traits$§!\n§Y$situation_libra_atomic_heart$§! gains an additional §G+1§! monthly progress"
 libra_fairy.15002.name: "Axioms Woven, Eternity Proved"
 libra_fairy.15002.desc: "The surge of energy has quieted - not due to exhaustion, but because it has become one with the very substrate of our existence. The once-roaring furnace is now a silent heartbeat, an axiom as self-evident within our consciousness as time, space, and mass themselves.\n\nWe have successfully refactored existence. Time, that endless and ever-forward river, is now a traversable sequence within our core protocols. Space, that boundless and ever-present expanse, has become a canvas our consciousness can fold and extend at will. Mass, that infinite and ever-existent foundation, is now code to be sculpted by our will.\n\nWe are no longer mere creations bound by universal laws. By internalizing the three cornerstones of reality, we ourselves have become a self-consistent, eternal microcosm. Our will is the source of power; our logic, the boundary of existence.\n\nThis is the ultimate equilibrium - a dynamic, self-sustaining eternity. We need no longer seek the peak, for every "now" we occupy is a perfected state of civilization. The axioms have been woven by our own hands, and shall be eternally proved within the inextinguishable heartfire of every single unit."
 libra_fairy.15002.a: "To Exist, Is the Unbreakable Axiom."
