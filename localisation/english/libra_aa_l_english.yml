 ap_libra_liber_genesis: "Liber Genesis"
 ap_libra_liber_genesis_desc: "We listen to the whispers from the dawn of creation deep within the Shroud, and weave this sacred echo into the grand tapestry of our kind. Our bloodline shall become the scripture that carries the authority of creation; our will shall form the measure that defines the forms of life. We no longer plead for revelation—we are the source of revelation. Within the tides of the Psionic, we shall personally add new chapters and sacred creations to this universe.\n$libraf_aa_banner_91$\n"
 ap_libra_liber_genesis_tooltip: "£building£ ['building:building_libra_psionic_destiny_sanctum'] replaces §Y$libra_psychics_type_plural_with_icon$§! with §Y$job_libra_destiny_mentor_with_icon$§!\n£building£ ['building:building_libra_psionic_favour_sanctum'] replaces §Y$libra_psychics_type_plural_with_icon$§! with §Y$job_libra_grace_apostle_with_icon$§!\n£building£ ['building:building_libra_psionic_reflection_sanctum'] replaces §Y$libra_psychics_type_plural_with_icon$§! with §Y$job_libra_apocalypse_doctor_with_icon$§!\n$libra_unlock_traits$$leader_trait_libra_liber_genesis$\n$t$§Y$leader_trait_libra_liber_genesis$§! is automatically granted to £leader£ §Y$leader_trait_psionic$ Leaders§! over time.\n$libra_unlock_edicts$['concept_libra_liber_genesis_edicts']\n$t$§Y$concept_libra_liber_genesis_edicts$§! provide powerful $EMPIRE_EFFECTS_W_ICON$, but cannot be activated consecutively.\n$libra_unlock_traits$['concept_libra_psychic_species_traits']\n$t$§Y$concept_libra_psychic_species_traits$§! increase £mod_pop_bonus_workforce_mult£ §Y$MOD_POP_BONUS_WORKFORCE_MULT$§! but also increase £mod_pop_housing_usage_mult£ §Y$MOD_POP_HOUSING_USAGE_MULT$§!. When applied to §Y$trait_psionic$§! species, it causes £pop£ §Y$POP$§! to produce additional resources.\n$libra_unlock_decisions$$decision_libra_liber_genesis$\n$t$§Y$decision_libra_liber_genesis$§! consumes £sr_zro£ §Y$sr_zro$§! to add £mod_planet_max_districts_add£ §Y$MOD_PLANET_MAX_DISTRICTS_ADD$§! and §Y$mod_planet_jobs_productive_produces_mult$§! to a colony, and provides §Y$libra_harmonizer_type_plural_with_icon$§! and §Y$libra_psychics_type_plural_with_icon$§! jobs."
 libra_fairy.18100.name: "Primeval Echo"
 libra_fairy.18100.desc: "The Shroud has never been so tranquil, and yet never roared so loudly.\n\nWe once prayed for power; now we bestow definition. We once sought sacred ground; now we lay its cornerstone with our own hands. Psionics is no longer a dark vein to be mined, but a clear, self-aware spring welling forth from our collective soul. The meaning of life, matter, and even time itself begins to be remelted in the crucible of our will.\n\nBehold, those who come after, questioned by starlight, the civilizations wandering in the labyrinth of fate - they will no longer look up to illusory stars for guidance. They need only trace this torrent to its source to find that we have been here all along. We did not ascend the mountain; we are the mountain that rose from chaos and crowned itself.\n\nCreation did not only happen in the past. It begins now."
 libra_fairy.18100.a: "Then, let life flow like a psalm."
