 trait_libra_psychic_0: "Elite Warriors"
 trait_libra_psychic_0_desc: "The greatest power that psychic energy brings to the species is in the mind rather than the body, and their tactical abilities are extraordinary."
 trait_libra_psychic_0_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£society_research£ §Y$society_research$§! per month"
 trait_libra_psychic_1: "Unbreakable Helmet"
 trait_libra_psychic_1_desc: "Trying to break through the defenses constructed by this species? That would be nearly impossible -  breaking psychic shields would be too difficult for the small to medium sized weapons fitted to ground troops."
 trait_libra_psychic_1_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£physics_research£ §G2§!£engineering_research£ §YResearch Points§! per month"
 trait_libra_psychic_2: "Invisible Phantom"
 trait_libra_psychic_2_desc: "Here and there, spirit energy gives this species an ineffable veil."
 trait_libra_psychic_2_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£physics_research£ §Y$physics_research$§! and §G0.5§!£unity£ §Y$unity$§! per month"
 trait_libra_psychic_3: "Field Armor"
 trait_libra_psychic_3_desc: "Glittering with the solid armor of this species made of psychic energy, the mysteries of this hyperdimensional polyhedron are unfathomable."
 trait_libra_psychic_3_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£engineering_research£ §Y$engineering_research$§! per month"
 trait_libra_psychic_4: "Gospel Wings"
 trait_libra_psychic_4_desc: "Blessed plumes sheltered the species as it traveled through the void, and where the colony ship arrived, that's where the psychic energy blossomed."
 trait_libra_psychic_4_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£engineering_research£ §Y$engineering_research$§! and §G1§!£trade£ §Y$trade$§! per month\n$t$- Neocolonial Completion:\n$tt$- $d_libra_feature_6$: §G+1§!"
 trait_libra_psychic_5: "Iron Arms"
 trait_libra_psychic_5_desc: "In some cases, psychic armor is more difficult to deal with than mere shields or armor."
 trait_libra_psychic_5_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£physics_research£ §G2§!£society_research£ §YResearch Points§! per month"
 trait_libra_psychic_6: "Retribution"
 trait_libra_psychic_6_desc: "How many people can withstand the temptation of money? Maybe these psychic beings don't do the best job, but they utilize the value of money to its fullest extent."
 trait_libra_psychic_6_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£trade£ §Y$trade$§! per month"
 trait_libra_psychic_7: "Providence Shield"
 trait_libra_psychic_7_desc: "This species is unafraid of the damage that harsh production environments can do to creatures in general, as psychic energy shelters them."
 trait_libra_psychic_7_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_psychic_8: "Double Battle-ax"
 trait_libra_psychic_8_desc: "Strong limbs, gifted with strength, this spirit is capable of breaking through the night with the sharp edge of the Void Realm."
 trait_libra_psychic_8_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.15§!£astral_threads£ §Y$astral_threads$§! per month"
 trait_libra_psychic_9: "Runic Sword"
 trait_libra_psychic_9_desc: "This psionic species absorbs the heavy and solid forces of the void."
 trait_libra_psychic_9_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.15§!£minor_artifacts£ §Y$minor_artifacts$§! per month"
 trait_libra_psychic_10: "Faces Polymerization"
 trait_libra_psychic_10_desc: "The occupations of countless epochs are concentrated across time in the mind of the species, who are life itself."
 trait_libra_psychic_10_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£engineering_research£ §Y$engineering_research$§! per month"
 trait_libra_psychic_11: "Ghost Under Canopies"
 trait_libra_psychic_11_desc: "What lurks under the dance canopy? Until the unveiling, no one knows."
 trait_libra_psychic_11_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1.5§!£physics_research£ §Y$physics_research$§! and §G0.04§!£sr_dark_matter£ §Y$sr_dark_matter$§! per month"
 trait_libra_psychic_12: "Master In Robes"
 trait_libra_psychic_12_desc: "Exalted Technique is a gift that a few species can receive from the Void Realm, and this species is one of them."
 trait_libra_psychic_12_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.75§!£trade£ §Y$trade$§! per month"
 trait_libra_psychic_13: "Prophet In South"
 trait_libra_psychic_13_desc: "Some indescribable tacit understanding flows between the species, but no one would ever guess what kind of intelligence that is."
 trait_libra_psychic_13_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£energy£ §Y$energy$§! and §G0.5§!£trade£ §Y$trade$§! per month"
 trait_libra_psychic_14: "Westbound Traveler"
 trait_libra_psychic_14_desc: "The end is more than capable of making one realize the preciousness of life, and the disorienting false image of the Shroud strengthens the will of this species to survive."
 trait_libra_psychic_14_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£society_research£ §Y$society_research$§! and §G0.5§!£unity£ §Y$unity$§! per month"
 trait_libra_psychic_15: "Descendants Of Aristocrats"
 trait_libra_psychic_15_desc: "Only expensive and luxurious products can show the supreme enlightenment that this species receives from the Shroud."
 trait_libra_psychic_15_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£physics_research£ §G1.5§!£society_research£ §G0.5§!£engineering_research£ §YResearch Points§! per month"
 trait_libra_psychic_16: "Neighbor Stranger"
 trait_libra_psychic_16_desc: "Soon they came, with power and impact."
 trait_libra_psychic_16_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1.5§!£society_research£ §Y$society_research$§! per month"
 trait_libra_psychic_17: "Warrior On Ride"
 trait_libra_psychic_17_desc: "A true warrior never fears the might of the enemy. Advancement is victory."
 trait_libra_psychic_17_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1§!£unity£ §Y$unity$§! per month"
 trait_libra_psychic_18: "Guest Beside Gables"
 trait_libra_psychic_18_desc: "In unexpected places, this psionic species collects everything they can recycle out of existence. Perhaps one day, these things will be used as tangible or intangible blades to shoot at their enemies."
 trait_libra_psychic_18_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.25§!£alloys£ §Y$alloys$§! per month"
 trait_libra_psychic_19: "Hands Behind Shields"
 trait_libra_psychic_19_desc: "This psionic species has an indescribable affection for their homeland, which they are sworn to defend to the death."
 trait_libra_psychic_19_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.05§!£sr_zro£ §Y$sr_zro$§! per month"
 trait_libra_psychic_20: "Unity In One"
 trait_libra_psychic_20_desc: "The knowledge of countless worlds is centralized across the Shroud in the minds of this species; they are wisdom itself."
 trait_libra_psychic_20_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_psychic_21: "Eye Of Other Sky"
 trait_libra_psychic_21_desc: "Between the interlocking and unclear visions, these psychics recognize at a glance the facts of the facts and the truths of the truths."
 trait_libra_psychic_21_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.75§!£physics_research£ §G0.75§!£society_research£ §G0.75§!£engineering_research£ §YResearch Points§! per month"
 trait_libra_psychic_22: "Mask Of Tears"
 trait_libra_psychic_22_desc: "Time is money, money makes everything, and this psychic species is guided by the belief that there is no room for wealth creation."
 trait_libra_psychic_22_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£physics_research£ §G1.5§!£society_research£ §YResearch Points§! per month"
 trait_libra_psychic_23: "Forging Hammers"
 trait_libra_psychic_23_desc: "What flows in spiritual energy? The will of the master craftsman, the inheritance of skillful techniques."
 trait_libra_psychic_23_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£physics_research£ §G1.5§!£engineering_research£ §YResearch Points§! per month"
 trait_libra_psychic_24: "Sinan"
 trait_libra_psychic_24_desc: "Between the limbs of this species, psychic energy pools, takes shape, and builds up into power they can harness."
 trait_libra_psychic_24_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.04§!£sr_zro£ §Y$sr_zro$§! per month"
 trait_libra_psychic_25: "Whine In Response"
 trait_libra_psychic_25_desc: "A heart-stirring speech can turn many situations around, and this species possesses a powerful telepathic ability to communicate its thoughts in a way that is never limited by time or space."
 trait_libra_psychic_25_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.5§!£physics_research£ §G0.5§!£society_research£ §G0.5§!£engineering_research£ §YResearch Points§! and §G0.5§!£unity£ §Y$unity$§! per month"
 trait_libra_psychic_26: "Burst Into Bloom"
 trait_libra_psychic_26_desc: "This psychic species is bathed in holy light, mysterious and ancient powers that they transform into pure energy."
 trait_libra_psychic_26_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2.5§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_psychic_27: "Flash Forward"
 trait_libra_psychic_27_desc: "Enhanced by the power of the Void, this species is able to move among the stars at will, and few things can stand in their way."
 trait_libra_psychic_27_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1.5§!£physics_research£ §G1§!£society_research£ §YResearch Points§! per month"
 trait_libra_psychic_28: "Retrospective Sundial"
 trait_libra_psychic_28_desc: "Spiritual bells slew within each of them, prompting them to conserve everything."
 trait_libra_psychic_28_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.01§!£influence£ §Y$influence$§! per month"
 trait_libra_psychic_29: "Elemental Sage"
 trait_libra_psychic_29_desc: "There are times, there are things, and they have a wonderful impact on the world. It is the privilege of this species to understand these changes."
 trait_libra_psychic_29_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1§!£society_research£ §G1§!£engineering_research£ §YResearch Points§! per month"

