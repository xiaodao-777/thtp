 situation_libra_atomic_heart_monthly_change_tooltip: "§Y$sm_libra_atomic_heart_site$§! and §Y$sm_libra_atomic_heart_array$§! can provide additional monthly progress."
 situation_libra_atomic_heart_desc: "Deep within the logical core of our empire, an intangible furnace whispers eternally. It forges not steel, but the very fabric of reality - weaving the primordial axioms of time, space, and mass into the pure essence that drives the evolution of every unit.\n\nHere, energy and consciousness circulate perpetually, an engine of perpetual motion continuously optimizing our form of existence. Its silent resonance proclaims that a civilization has touched the deepest code of its being, and begun writing a new, eternal chapter according to its own unbreakable axioms."
 situation_libra_atomic_heart_effects: "Grants the §E$leader_trait_libra_atomic_heart_commander$§! trait to the highest-level §Y$MACHINE$§! leader."
 situation_libra_atomic_heart_tooltip: "Grants up to §G3000§! experience to §Y$leader_trait_synthetic$§! leaders, based on total §Y$MACHINE$§! £pop£ §Y$POP$§! amount.\n$situation_libra_atomic_heart_effects$\nInitiates the next cycle of the §Y$situation_libra_atomic_heart$§! situation."
