 tech_libra_mutation_encoding: "Advanced Genetic Encoding"
 tech_libra_mutation_encoding_desc: "$libra_genetics_tech_biomorphosis_tt$Further developed genetic techniques allow us to make more modifications to biological phenotypes.\n$libra_gate_banner_15$"
 TECH_UNLOCK_LIBRA_LRT_TITLE: "$libra_unlock_features$Complex Gene Grafting"
 TECH_UNLOCK_LIBRA_LRT_DESC: "§HComplex Gene Grafting§!\nEnables adding species traits from §Y$libra_mod_name$§! to phenotypes regardless of restrictions through genetic modification. Includes the following groups:\n$t$['concept_libra_humanoid_traits']\n$t$['concept_libra_mammalian_traits']\n$t$['concept_libra_molluscoid_traits']\n$t$['concept_libra_fungoid_traits']\n$t$['concept_libra_plantoid_traits']\n$t$['concept_libra_lithoid_traits']\n$t$['concept_libra_necroid_traits']\n$t$['concept_libra_aquatic_traits']\n$t$['concept_libra_reptilian_traits']\n$t$['concept_libra_avian_traits']\n$t$['concept_libra_infernal_traits']\n\nThis capability is also unlocked if £mutation£ ['tradition_category:tradition_mutation'] is selected at all stages of the ['concept_biomorphosis'] situation and the ['tradition:tr_mutation_unnatural_selection'] tradition is adopted, which will then provide additional bonuses."

 tech_libra_mutation_integration: "Genome Integration"
 tech_libra_mutation_integration_desc: "In the early stages of our science, splicing DNA was an unimaginable endeavor. Now we possess the ability to achieve this feat.\n$libra_gate_banner_15$"
 building_libra_evolutionary_laboratory: "Evolutionary Laboratory"
 building_libra_evolutionary_laboratory_desc: "This facility is used for complex transgenic experiments and can also provide medical support to residents."
 building_libra_evolutionary_laboratory_effect_desc: "For each level of §Y$planetary_ascension$§!, provides §G+3%§! £mod_produces_mult£ §Y$mod_planet_jobs_produces_mult$§! and §R+2%§! £mod_upkeep_mult£ §Y$mod_planet_jobs_upkeep_mult$§!."

 tech_libra_mutation_protection: "Mutation Safeguard"
 tech_libra_mutation_protection_desc: "This special medical support system enrolls all eligible residents into a health management network, ensuring individuals with negative mutations receive timely treatment.\n$libra_gate_banner_15$"
edict_libra_mutation_protection: "Comprehensive Care"
edict_libra_mutation_protection_desc: "Our medical personnel ensure the physical health of every individual."

 tech_repeatable_libra_mutation: "Self-Iteration"
 tech_repeatable_libra_mutation_desc: "Highly enhanced mutagenic genes reduce the time required for biological evolution from millions of years to mere months or even days, giving us ample time to select our desired evolutionary path.\n$libraf_te_banner_15$"


 ap_libra_evolutionary_endpoint: "Evolutionary Endpoint"
 ap_libra_evolutionary_endpoint_desc: "Mutations shape life, conflicts weave history; the changing cosmos has become our stage.\n$libraf_aa_banner_30$\n"
 ap_libra_evolutionary_endpoint_tooltip: "$mod_country_produces_mult$: §R-16%§!\nFor each trait of the §YPrimary Species§!:\n$t$$mod_country_produces_mult$: §G+3.50%§! (Max: §G+56%§!)\n$t$$MOD_COUNTRY_SOCIETY_TECH_RESEARCH_SPEED$: §G+5%§! (Max: §G+80%§!)\n$libra_unlock_traits$$leader_trait_libra_evolutionary_endpoint$\n$t$§Y$leader_trait_libra_evolutionary_endpoint$§! is automatically granted to £leader£ §Ybiological leaders§! over time; its $EFFECTS_TXT$ improves with §Ytotal leader trait level§!.\n$libra_start_situation$$situation_libra_evolutionary_endpoint$\n$t$§Y$situation_libra_evolutionary_endpoint$§! provides up to §G+3§! £mod_country_government_civic_points_add£ §Y$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$§! and §G+50%§! £mod_pop_bonus_workforce_mult£ §Y$mod_organic_pop_bonus_workforce_mult$§! as it progresses.\n$libra_unlock_decisions$$decision_libra_evolutionary_endpoint$\n$t$§Y$decision_libra_evolutionary_endpoint$§! can be enacted on colonies with a £building£ ['building:building_libra_evolutionary_laboratory'], each execution adding progress to the §Y$situation_libra_evolutionary_endpoint$§! situation."
 libra_fairy.12000.name: "Focus and Ascend"
 libra_fairy.12000.desc: "Our bloodline has never ceased its hymn to change. While other civilizations see genes as blueprints, we revere them as a flowing symphony. Now, its notes transcend flesh, resonating within the very fabric of our society.\n\nWe have woven the truth of §Y$mutation$§! from base pairs into legal codes, imprinting the wisdom of adaptation from chromosomes into our cultural veins. Our society has become a grand organism - breathing, growing, reshaping itself with each challenge to find its optimal form. Infinite diversity converges into singular harmony; myriad possibilities lead to one inevitable conclusion.\n\nWe did not drift with the tide of evolution to its endpoint; we chose the most fitting answer by our own will. At this peak, we are the unique solution to all variations."
 libra_fairy.12000.a: "This body is the bridge to countless futures."
 leader_trait_libra_evolutionary_endpoint: "Evolutionary Complex"
 leader_trait_libra_evolutionary_endpoint_desc: "This leader is a near-ultimate lifeform, capable of harnessing all traits as strength."
 situation_libra_evolutionary_endpoint: "Evolutionary Compass"
 situation_libra_evolutionary_endpoint_type: "$situation_libra_evolutionary_endpoint$"
 situation_libra_evolutionary_endpoint_monthly_change_tooltip: "Enacting £decision£ §Y$decision_libra_evolutionary_endpoint$§! adds progress to the situation."
 situation_libra_evolutionary_endpoint_desc: "Evolution was once a blind process of trial and error. Now, we have taken the right to choose our evolution from nature, applying the wisdom of genetic mutation to the construction of social forms. This compass guides us through countless possible paths, allowing us to gradually unlock the potential of our social structure, optimize the efficiency of every individual, and ultimately lead our civilization to a state of dynamic, perfect equilibrium."
 situation_libra_evolutionary_endpoint_tooltip: "Gain §G+3§! £mod_country_government_civic_points_add£ §Y$MOD_COUNTRY_GOVERNMENT_CIVIC_POINTS_ADD$§! and §G+50%§! £mod_pop_bonus_workforce_mult£ §Y$mod_organic_pop_bonus_workforce_mult$§!"
 situation_libra_evolutionary_endpoint_approach: "Selective Compilation"
 libra_fairy.12010.name: "Undercurrents Stirring"
 libra_fairy.12010.desc: "The seeds of change have taken root in society's lifeblood. Old conventions loosen as new ways of thinking emerge spontaneously across the empire, like genetic mutations. We stand at the dawn of a great transformation, feeling the deep, powerful pulse from the very foundation of our civilization."
 libra_fairy.12010.a: "Flow with the inner tide."
 libra_fairy.12011.name: "Structural Reshaping"
 libra_fairy.12011.desc: "The genetic sequence of society is being rewritten and optimized on a massive scale. The invisible force of evolution has permeated the core structures of law, economy, and culture, rendering them more flexible and efficient than ever. The empire is transforming from a rigid body into a living organism capable of self-adaptation and continuous optimization."
 libra_fairy.12011.a: "Order shall guide this torrent of change."
 libra_fairy.12012.name: "Dynamic Eternity"
 libra_fairy.12012.desc: "The wave of transformation has not subsided, but it no longer brings chaos. Instead, it has become our civilization's new steady state - an eternal, elegant dynamic equilibrium. Our society has finally reached the legendary universal solution: a perfect system capable of embracing myriad forms, maintaining peak vitality through perpetual change."
 libra_fairy.12012.a: "We are the answer to evolution."
 decision_libra_evolutionary_endpoint: "Expand Experimental Zone"
 decision_libra_evolutionary_endpoint_desc: "Designate an area on this colony for deploying cutting-edge research projects."
 decision_libra_evolutionary_endpoint_tt_1: "Gain §G12~24§! Progress"
 decision_libra_evolutionary_endpoint_tt_2: "When £building£ §Y$building_libra_evolutionary_laboratory$§! is established, §G+200§! §Y$libra_chromosome_engineer_type_plural_with_icon$§! jobs will be provided."
 d_libra_evolutionary_endpoint: "Evolutionary Optimization Facility"
 d_libra_evolutionary_endpoint_desc: "This area is used for complex experiments studying biological evolution and social transformation."
 libra_fairy.12021.name: "Symbiotic Pulse"
 libra_fairy.12021.desc: "The planetary ecosystem seems to have awakened overnight. Flora and fauna have formed unexpected symbiotic relationships with our infrastructure: vines reinforce building structures, fungal networks optimize data flow. This provides new inspiration for biotechnology, but also raises concerns about ecological overexpansion."
 libra_fairy.12021.a: "Guide this life force."
 libra_fairy.12021.b: "Impose restrictions."
 libra_fairy.12022.name: "Pheromone Consensus"
 libra_fairy.12022.desc: "A complex pheromone communication network has spontaneously formed among the population, drastically improving large-scale coordination efficiency. However, the boundaries between individual minds are blurring, risking the submersion of unique personalities by a collective consciousness."
 libra_fairy.12022.a: "Embrace the collective wisdom."
 libra_fairy.12022.b: "Defend individuality."
 libra_fairy.12022.b.tt: "All £leader£ §Ybiological leaders§! gain §G3000§! experience"
 libra_fairy.12023.name: "Adaptive Stress Response"
 libra_fairy.12023.desc: "The population's adaptation to new environments is astonishingly rapid, but also manifests unstable gene expression. Some individuals develop useful new traits, while others exhibit irrational fears or aggression."
 libra_fairy.12023.a: "Screen for beneficial mutations."
 libra_fairy.12023.b: "Treat the faulty mutations."
 libra_evolutionary_endpoint_mod_3_1: "Selective Mutation"
 libra_evolutionary_endpoint_mod_3_2: "Healthcare"
 libra_fairy.12024.name: "Metabolic Overclock"
 libra_fairy.12024.desc: "A high-energy consumption, high-output metabolic pattern is spreading through the population. Productivity soars, but resource consumption reaches dangerous levels."
 libra_fairy.12024.a: "We strive for the limits."
 libra_fairy.12024.b: "Stable variation is good variation."
 libra_evolutionary_endpoint_mod_4_1: "Metabolic Overclock"
 libra_fairy.12025.name: "Directed Senescence"
 libra_fairy.12025.desc: "Our biologists have discovered the potential to deactivate cellular aging processes, enabling significant lifespan extension. However, implementing this mutagenesis is costly and can only be allocated to those who need it most."
 libra_fairy.12025.a: "Embrace longevity."
 libra_fairy.12025.b: "Direct the technology where it's needed."
 libra_evolutionary_endpoint_mod_5_1: "Anti-Aging Mutation"
 libra_fairy.12026.name: "Predator's Mark"
 libra_fairy.12026.desc: "Instincts as apex predators have been unexpectedly enhanced, making our military more intimidating, but also rendering internal competition colder and more brutal."
 libra_fairy.12026.a: "Forge the blade."
 libra_fairy.12026.b: "Civilize the instinct."
 libra_evolutionary_endpoint_mod_6_1: "Predator Instinct"
 libra_fairy.12027.name: "Dream Resonance"
 libra_fairy.12027.desc: "Part of the population has evolved faint, unpromising psionic potential. Their dreams have begun to interconnect, forming a shared dreamscape - a breeding ground for creativity, but also an abyss of collective subconscious, full of both opportunity and risk."
 libra_fairy.12027.a: "Utilize the dream network."
 libra_fairy.12027.b: "Implement dream isolation."
 libra_fairy.12028.name: "Efficiency Supremacism"
 libra_fairy.12028.desc: "An ideology venerate absolute efficiency is rising in the empire. It prioritizes productivity above all, showing increasing hostility towards perceived inefficiencies - such as art and philosophy."
 libra_fairy.12028.a: "Efficiency!"
 libra_fairy.12028.b: "We require no bias."
 libra_evolutionary_endpoint_mod_8_1: "Efficiency Supremacy"
 libra_fairy.12029.name: "Voluntary Dormancy"
 libra_fairy.12029.desc: "Part of the population voluntarily enters dormancy to weather the social transition or cede resources to others. This temporarily alleviates pressure but creates a vast, forgotten group."
 libra_fairy.12029.a: "Establish large dormancy facilities."
 libra_fairy.12029.b: "No time for sleep, join the revelry."
 libra_evolutionary_endpoint_mod_9_2: "Sleepless Revelry"
 libra_fairy.12030.name: "Linguistic Collapse"
 libra_fairy.12030.desc: "In pursuit of ultimate communication efficiency, language is rapidly evolving to become more concise and logical. If this continues, complex expressions like poetry and metaphor may soon vanish."
 libra_fairy.12030.a: "Accelerate linguistic optimization."
 libra_fairy.12030.b: "The old expressions are necessary."
 libra_evolutionary_endpoint_mod_10_1: "Logical Language"
 libra_fairy.12031.name: "Swarm Whisper"
 libra_fairy.12031.desc: "An unexpected pheromone network has emerged from experiments. Part of the population exhibits highly coordinated behavior, their individual minds seemingly connected by a mild collective consciousness. Work efficiency has notably improved, but sparks of individual creativity appear to be dimming."
 libra_fairy.12031.a: "We need no puppets."
 libra_fairy.12031.b: "Isolate them for study."
 libra_fairy.12031.c: "What's the harm?"
 libra_fairy.12032.name: "Photosynthetic Glands"
 libra_fairy.12032.desc: "An experiment aimed at optimizing energy utilization has made a breakthrough. Some subjects have developed skin glands capable of advanced photosynthesis. They draw energy directly from sunlight, drastically reducing their need for traditional food."
 libra_fairy.12032.a: "Promote this mutation widely."
 libra_fairy.12032.b: "Research further."
 libra_fairy.12032.c: "But they look like goblins!"
 libra_fairy.12033.name: "Living Infrastructure"
 libra_fairy.12033.desc: "Experimental gene sequences have escaped the lab, unexpectedly merging with the local ecology. A benign biomass has begun growing on urban building surfaces - self-repairing, purifying air, and even seemingly assisting in climate regulation."
 libra_fairy.12033.a: "A living city, fantastic."
 libra_fairy.12033.b: "Utilize them for greening."
 libra_fairy.12033.c: "This is contamination; it must be purged."
 libra_fairy.12034.name: "Hyperimmune Response"
 libra_fairy.12034.desc: "Our population has developed an immensely powerful immune system, capable of adapting to and destroying all known pathogens. However, this defense mechanism sometimes overactivates, misidentifying harmless environmental particles or even physical contact as threats, leading to new social isolation issues."
 libra_fairy.12034.a: "Mere overreaction, nothing to worry about."
 libra_fairy.12034.b: "Adjust pheromones to suppress aggression."
 libra_fairy.12034.c: "This could make excellent bioweapons."
 libra_evolutionary_endpoint_mod_14_2: "Immune System Mutation"
 libra_evolutionary_endpoint_mod_14_3: "Killer Cell Organization"
 libra_fairy.12035.name: "Ancestral Whispers"
 libra_fairy.12035.desc: "Deep genetic scans reveal that our experiments have inadvertently activated ancient segments of so-called 'junk DNA'. Some newborns show a natural affinity for knowledge and skills they have never learned, as if ancestral memories are awakening within their bloodline."
 libra_fairy.12035.a: "Excavate this treasure trove!"
 libra_fairy.12035.b: "Replace them with more reliable genes."
 libra_fairy.12035.c: "Activate only the useful parts."
 libra_evolutionary_endpoint_mod_15_3: "Ancestral Edge"

#

 ap_libra_cutefied_world: "Cuteness is All"
 ap_libra_cutefied_world_desc: "When a civilization directs the potential of genetics into the abyss of form and appearance, life blooms beyond mere functionality. We shall reshape flesh and blood, bestowing upon our people dreamlike aesthetics, fervent souls - and power that defies common sense.\n$libraf_aa_banner_31$\n"
 ap_libra_cutefied_world_tooltip: "Alters the $EFFECTS_TXT$ of some ['concept_libra_expand_technology',Genetic Expansion Technologies]\nIncreases £opinion£ §Y$OPINION$§! from other empires by §G+100§!\n$libra_start_situation$$situation_libra_cutefied_world_1$\n$t$§Y$situation_libra_cutefied_world_1$§! upon completion, transforms all §YSentient Biological Species'§! £pop£ §YFree $POP$§!, £leader£ §YLeaders§!, and £army_ship£ §Y$army$§! into §Y$LIBRACUTE$§! and unlocks all the following capabilities.\n$libra_start_situation$$situation_libra_cutefied_world_2$\n$t$§Y$situation_libra_cutefied_world_2$§! each completion generates $EFFECTS_TXT$ based on the current §YSolution§!.\n$libra_unlock_traits$$leader_trait_libra_cutefied$\n$t$§Y$leader_trait_libra_cutefied$§! has a §G65%§! chance to be initially carried by £leader£ §Y$LIBRACUTE$ Leaders§!.\n$libra_unlock_traits$['concept_libra_cutefied_traits']\n$t$§Y$concept_libra_cutefied_traits$§! divided into two groups, providing different types of bonuses.\n$libra_unlock_component$$LIBRA_CUTE_MONITOR$\n$t$§Y$LIBRA_CUTE_MONITOR$§! enhances ship offensive capabilities but also increases £mod_logistics_mult£ §Y$mod_ships_logistics_mult$§!."
 libra_fairy.12100.name: "The Ultimate Moe Thing Is, M-M-Me!"
 libra_fairy.12100.desc: "An intangible ripple pierces the silence of the stellar sea. It is not a declaration of war, nor a broadcast of technological breakthrough. It is more like a poem - a hymn written in genetic sequences and sung in forms of life.\n\nAmidst the cold laws of the cosmos and ruthless material competition, a civilization has proudly walked a path no one imagined. They gazed into the genetic abyss, yet did not succumb to the lure of supreme efficiency, nor indulge in the ancient rut of violent enhancement.\n\nThey chose 'Moe'.\n\nThey sculpted fantasy with scholarly rigor and fused aesthetics with artisan's passion. They painted the future of their race into a bold, romantic form that transcends all existing templates. This is not a childish escape from reality, but a courage of deeper significance - in the vast, silent universe, they resolutely declared: the meaning of life lies not only in survival and conquest, but also in becoming the landscape itself.\n\nTheir existence has now become a living parable. A parable about how life shakes off the shackles of utilitarianism to pursue that unique, gleaming 'self'. The star-faring races may mock, ponder, or fail to comprehend, but none can deny:\n\nThe first, different light has already shone."
 libra_fairy.12100.a: "Let the world hear the voice of Moe!"
 libra_cutefied_world_mod_0: "Moe Manifesto"
 opinion_libra_cutefied_world: "Beautiful 2D Characters"
 situation_libra_cutefied_world_1: "Moe-fication Process"
 situation_libra_cutefied_world_1_type: "$situation_libra_cutefied_world_1$"
 situation_libra_cutefied_world_1_monthly_change_tooltip: "Researching ['concept_libra_expand_technology', Genetic Expansion Technologies] can add progress to the situation."
 situation_libra_cutefied_world_1_desc: "We are rewriting the blueprint of life, seeking confession from genetic science for anime-inspired creations. When this project is complete, every one of us will become the form we desire - Magical Girls, Primates of Nature, or Idols who bench press."
 situation_libra_cutefied_world_1_tooltip: "Transforms biological species into §Y$LIBRACUTE$§! and unlocks all capabilities of §Y$ap_libra_cutefied_world$§!"
 situation_libra_cutefied_world_1_approach: "Moe-fication"
 libra_fairy.12110.name: "Budding Experiments"
 libra_fairy.12110.desc: "Small-scale experiments are underway. The first volunteers have entered the genetic testing grounds, becoming pioneers of the new era. Meanwhile, theories for directly creating lifeforms of the target form are also being verified, with results expected soon."
 libra_fairy.12110.a: "Let the change begin."
 libra_fairy.12111.name: "Prototype Encoding"
 libra_fairy.12111.desc: "The first native genetically modified prototype was born within a sealed ecosphere. The prototype exhibits the preset animal-ear and tailbone structures, with improved metabolic efficiency, but also shows significantly increased hormone secretion in unfamiliar environments. She looks out through the glass with curious eyes - we know the technological path is correct, but balancing traits remains an unresolved challenge."
 libra_fairy.12111.a: "Look at them run… like the wind."
 libra_fairy.12111.b: "Everyone, transform!"
 libra_fairy.12112.name: "Mirrored Twins"
 libra_fairy.12112.desc: "A significant portion of the transformed individuals are now freely active within society as observation subjects. Social structures have thus developed subtle stratification: Moe-fied groups form new subcultural circles, while the unmodified feel an intangible pressure.\n\n'Do you choose to stay in yesterday, or embrace the self of tomorrow?'\n\nMeanwhile, the first mixed-trait individuals have been born - they naturally carry stable Moe-fication genes, marking that the change has permeated the genetic level."
 libra_fairy.12112.a: "This mirror reflects both past and future."
 libra_fairy.12113.name: "Crosshairs"
 libra_fairy.12113.desc: "The future diverges here - the comprehensive transformation of the empire is about to begin.\n\nDifferent strategies will bring different impacts, and each is irreversible: Pursue ultimate adaptation? Forge bonds of the soul? Or embrace diverse potential?"
 libra_fairy.12113.a: "Let our existence become the planet's harmony."
 libra_fairy.12113.b: "Link our hearts together; we are never alone."
 libra_fairy.12113.c: "Let every uniqueness find its shining stage."
 libra_cutefied_world_mod_1: "Path: Environmental Harmony"
 libra_cutefied_world_mod_2: "Path: Spirit Resonance"
 libra_cutefied_world_mod_3: "Path: Specialized Bloom"
 libra_fairy.12114.name: "Dawn of Moe"
 libra_fairy.12114.desc: "The final and largest project is complete. The reflection in the mirror has utterly changed.\n\nAnimal ears twitch, luminous wings unfold, spirit tails sway - the entire empire welcomes a unified yet diverse rebirth."
 libra_fairy.12114.a: "We are the most beautiful creation."
 libra_fairy.12114.b: "The world is in the shape of Moe!"
 situation_libra_cutefied_world_2: "Moe Growth"
