 tech_repeatable_libra_psionic_dod: "Divine Or Devil"
 tech_repeatable_libra_psionic_dod_desc: "We will use our mind to discern things clearly, to find out, to comprehend, and to understand all the gestures of the world.\n$libraf_te_banner_2$"

 tech_repeatable_libra_psionic_balmy_breeze: "Balmy Breeze"
 tech_repeatable_libra_psionic_balmy_breeze_desc: "Soft winds blow through our dwellings, bringing prosperity and flourishing. In it, we perceive an infinite future.\n$libraf_te_banner_2$"

 tech_repeatable_libra_psionic_foreordination: "Foreordination"
 tech_repeatable_libra_psionic_foreordination_desc: "We are in control of our own destiny, and it will flow to the right place, not a minute earlier or a second later.\n$libraf_te_banner_2$"

