 trait_libra_modularity_war: "Composite Combat Protocol"
 trait_libra_modularity_war_desc: "A mechanical template dedicated to military objectives, effectively increasing deterrence."
 trait_libra_modularity_war_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.01§!£influence£ §Y$influence$§! per month"
 edict_libra_modularity_campaign_3: "Protocol Contingency"
 edict_libra_modularity_campaign_3_desc: "Contingency protocols allow our mechanical units to consume additional resources under favorable conditions to boost production efficiency."

 tech_libra_modular_trait_points_2: "Advanced Replacement Template"	
 tech_libra_modular_trait_points_2_desc: "Upgraded modular technology allows for the integration of more components within a limited form factor.\n$libraf_te_banner_5$"
 edict_libra_modularity_campaign_4: "Rapid Replacement"
 edict_libra_modularity_campaign_4_desc: "Modularity enables us to iterate mechanical components at an accelerated pace as needs evolve."

 tech_libra_modular_edge_IoT: "Edge IoT"
 tech_libra_modular_edge_IoT_desc: "Through modular upgrades, the empire will become more interconnected than ever - much like the industrial revolutions of old.\n$libraf_te_banner_5$"
 building_libra_super_assembly_plant: "Super Assembly Plant"
 building_libra_super_assembly_plant_desc: "Within this colossal futuristic structure, autonomous intelligences coordinate countless assembly lines operating in unison, tirelessly producing new mechanical brethren."
 edict_libra_modularity_campaign_5: "Cross-System Cloud Computing"
 edict_libra_modularity_campaign_5_desc: "Leveraging FTL communications and modular design, computational strain on resource-starved units can be evenly distributed to other individuals in adjacent regions, maximizing the utilization of surplus resources."

 tech_repeatable_libra_modular_allocation_algorithm: "Improved allocation algorithm"
 tech_repeatable_libra_modular_allocation_algorithm_desc: "Directing the right resources to where they are needed most.\n$libraf_te_banner_5$"

 tech_repeatable_libra_modular_pioneer_unit: "Pioneer Unit Deployment"
 tech_repeatable_libra_modular_pioneer_unit_desc: "We possess, and require, the capability to deploy pioneering individuals to guide strategic shifts.\n$libraf_te_banner_5$"

 tech_repeatable_libra_modular_precision_components: "Advanced Precision Components"
 tech_repeatable_libra_modular_precision_components_desc: "Prioritizing production targets above all else, deferring cost considerations.\n$libraf_te_banner_5$"

