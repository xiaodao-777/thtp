 ap_libra_hurricane_eye: "Hurricane Eye"
 ap_libra_hurricane_eye_desc: "It must be known that a great tower begins with a foundation, and a extra-long dike collapses in an anthill.\nEven if it starts at the end of a millimetre, nano swarms can flood the sea of stars.\n$libraf_aa_banner_71$\n"
 ap_libra_hurricane_eye_tooltip: "$libra_unlock_edicts$['edict:libra_recycling_nanite_swarmer',$edict_libra_recycling_nanite_swarmer$]\n$t$§Y$edict_libra_recycling_nanite_swarmer$§! converts the excess §Y$nanite_swarmer_plural$§! and §Y$nanite_interdictor_plural$§! back to £nanites£ §Y$nanites$§!.\n$libra_start_situation$$situation_libra_hurricane_eye$\n$t$§Y$situation_libra_hurricane_eye$§! will cycle repeatedly. Upon completion, it unleashes a specified type of §YNanostorm§! at a designated location. In certain circumstances, this costs £influence£ §Y$influence$§! and may reduce £opinion£ §Y$OPINION$§!.\n$libra_start_situation$$situation_libra_hurricane_eye_2$\n$t$§Y$situation_libra_hurricane_eye_2$§! will cycle repeatedly. Based on the £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§! already used at each start, it produces £physics_research£ £society_research£ £engineering_research£ §YResearch Points§! and spawns a §YNanofleet§! upon completion.\n$libra_unlock_policies$$policy_libra_hurricane_eye_1$$t$$policy_libra_hurricane_eye_2$\n$t$§Y$policy_libra_hurricane_eye_1$§! controls the generation mode of §YNanostorm§!.\n$t$§Y$policy_libra_hurricane_eye_2$§! Controls the generation composition of §YNanofleet§!.\n$libra_unlock_decisions$$decision_libra_hurricane_eye$\n$t$§Y$decision_libra_hurricane_eye$§! sets the specified §Y$pc_nanotech$§! to be the location where §YNanofleet§! is generated; when unspecified, §YNanofleet§! will be generated in the capital."
 libra_fairy.16100.name: "Genesis of the Storm"
 libra_fairy.16100.desc: "Before [Root.GetName], nanites were tools, weapons, a single drop in a torrent. But in their hands, the infinitesimal ceased to be passive - it became the active extension of collective will. They have grasped the ultimate secret: when every microscopic unit carries the empire's intent, the notion that 'quantity begets quality' no longer applies - for from the moment the first swarm was granted intelligence, the qualitative leap had already occurred.\n\nNow this civilization stands at the eye of the storm. Not because it has tamed the storm, but because it has become the storm's source. Across the sea of stars, matter and energy begin to answer the empire's call, woven by the nanite network. Deep within barren worlds, instructions for reconstruction are being executed; beyond enemy hulls, pulses of disintegration stand ready.\n\nThis is a turning point. The boundary between macro and micro is erased; the barrier between destruction and creation is dismantled. From this moment onward, they are no longer followers of cosmic law - they are editors of cosmic law.\n\nThe vast expanse of stars bears witness to this moment: a civilization that took nanites as its starting point and the sea of stars as its horizon, rewriting 'impossible' as 'not yet accomplished'."
 libra_fairy.16100.a: "The eye of the storm is ours to define."
 libra_fairy.16100.tt: "Unleashes §Y$libra_hurricane_eye_storm_2$§! at the capital"
 libra_hurricane_eye_mod: "I Am the Storm"
 edict_libra_recycling_nanite_swarmer: "Nanite Recycle"
 edict_libra_recycling_nanite_swarmer_desc: "Recycle $nanite_swarmer_plural$ into useful raw materials for other uses."
 edict_libra_recycling_nanite_swarmer_tooltip: "Recall all the items that are neither fighting nor commanding §Y$nanite_swarmer$§! and §Y$nanite_interdictor$§!, gaining §G300§! £nanites£ §Y$nanites$§! per £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!."
 libra_fairy.16110.name: "$nanite_swarmer_plural$ Recovered"
 libra_fairy.16110.desc: "All free $nanite_swarmer_plural$ and $nanite_interdictor_plural$ have been converted to $nanites$."
 situation_libra_hurricane_eye: "Gale Approaching"
 situation_libra_hurricane_eye_type: "$situation_libra_hurricane_eye$"
 situation_libra_hurricane_eye_modifier: "$situation_libra_hurricane_eye$"
 situation_libra_hurricane_eye_monthly_change_tooltip: "Researching ['concept_libra_expand_technology',Nanite Expansion Technologies] can add progress to the situation."
 situation_libra_hurricane_eye_desc: "When the nanite torrent is no longer passive, it transforms into an untamed storm sweeping across star systems.\nUnder core directives, a nanostorm can carve deadly wounds into enemy vessels or shower barren lands with the rain of reconstruction.\n\n§YNanostorm§! radius is affected by §YGalaxy Size§!"
 situation_libra_hurricane_eye_tooltip: "Unleash the §YNanofleet§! and §YNanostorm§!"
 situation_libra_hurricane_eye_stage_2_tt: "Random §Y$subclass_commander_admiral$§! gains §Y$leader_trait_libra_hurricane_eye$§! trait"
 situation_libra_hurricane_eye_a: "Quality Enhancement"
 situation_libra_hurricane_eye_a_tooltip: "When the situation is complete, release §Y$libra_hurricane_eye_storm_1$§!:\n$t$Giant storms with fixed locations\n$t$Create a wide-area suppression effect\n$t$Persists for §Y1§! year and then dissipates\n "
 situation_libra_hurricane_eye_b: "Synchronized Growth"
 situation_libra_hurricane_eye_b_tooltip: "When the situation is complete, release §Y$libra_hurricane_eye_storm_2$§!:\n$t$Fast-moving medium-sized storms\n$t$More aggressive and destructive\n$t$Dissipate when it reach the end\n "
 situation_libra_hurricane_eye_c: "Algorithmic Focus"
