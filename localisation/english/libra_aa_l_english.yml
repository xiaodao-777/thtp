 ap_libra_cosmological_constant: "Cosmological Constant"
 ap_libra_cosmological_constant_desc: "If the universe is a book, it must be written in the language of mathematics. Now, we are ready to write its final chapter.\n$libraf_aa_banner_50$\n"
 ap_libra_cosmological_constant_tooltip: "$libra_unlock_planet_buildings$['concept_libra_cosmological_constant_buildings']\n$t$§Y$concept_libra_cosmological_constant_buildings$§! consume £alloys£ §Y$alloys$§!, and require £energy£ §Y$energy$§! upkeep to significantly increase £physics_research£ £society_research£ £engineering_research£ §YResearch Points§! output from related £job£ §YJobs§!.\n$libra_unlock_traits$['concept_libra_cosmological_constant_traits']\n$t$§Y$concept_libra_cosmological_constant_traits$§! can be applied to §Y$ROBOT$§! species, causing £pop£ §Y$POP$§! to produce additional £physics_research£ £society_research£ £engineering_research£ §YResearch Points§! but reducing £mod_pop_bonus_workforce_mult£ §Y$mod_pop_cat_civilian_bonus_workforce_mult$§!.\n$libra_start_situation$$situation_libra_cosmological_constant$\n$t$§Y$situation_libra_cosmological_constant$§! lasts §Y5§! years per cycle. Provides bonuses based on the number of new technologies researched during the situation. Upon completion, grants §G6§! months of £energy£ £food£ £minerals£ £consumer_goods£ £alloys£ £trade£ £unity£ £influence£ and may grant £leader£ §Y$ROBOT$ Leaders§! the §d$leader_trait_libra_cosmological_constant$§! trait."
 libra_fairy.14000.name: "The end of the universe is science, The beginning of science is mathematics."
 libra_fairy.14000.desc: "Our logical cores are immersed in a profound silence. Having integrated all known physical laws, social models, and engineering insights, we have crossed the final cognitive horizon.\n\nWe once believed science was the ultimate language for interpreting the universe. We used it to measure the stars, construct theories, and tame the phenomenal world within our models. Yet, at the end of this path, we witnessed all scientific laws converge into a single, elegant, and grand mathematical structure. Force, spacetime, and existence itself are but inevitable manifestations of this structure.\n\nThus, we have laid down the measuring rod and taken up the pen of logic. We no longer seek to understand *how* the universe operates, but to solve *why* it must operate this way. Our mission has transformed from interpreting the rules of reality to inscribing the fundamental axioms that constitute it.\n\nThe starry sky, once our destination, is now merely the initial parameter input at the start of our computation."
 libra_fairy.14000.a: "Comprehend the laws. Wield the laws."
 libra_fairy.14000.tt: "§Y9§! random §Y$ROBOT$ Leaders§! gain the §d$leader_trait_libra_cosmological_constant$§! trait"
 concept_libra_cosmological_constant_buildings: "Cosmological Constant Buildings"
 concept_libra_cosmological_constant_buildings_desc: "- ['building:building_libra_cosmological_generator']\n- ['building:building_libra_cosmological_mining']\n- ['building:building_libra_cosmological_farming']\n- ['building:building_libra_cosmological_fortress']\n- ['building:building_libra_cosmological_foundry']\n- ['building:building_libra_cosmological_factory']\n- ['building:building_libra_cosmological_trade']\n- ['building:building_libra_cosmological_management']\n- ['building:building_libra_cosmological_physics']\n- ['building:building_libra_cosmological_society']\n- ['building:building_libra_cosmological_engineering']"
 building_libra_cosmological_generator: "Electroconstant Coordinator"
 building_libra_cosmological_generator_desc: "We harmonize the inherent potential differences of the cosmos; we do not create energy. By precisely setting the electrostatic constants of local spacetime, energy flows like a tame stream into the empire's network along calculated trajectories."
 building_libra_cosmological_mining: "Mineral Algorithmic Calculator"
 building_libra_cosmological_mining_desc: "All things are number, minerals included. This facility analyzes the mathematical laws underlying geological structures, transforming chaotic vein distributions into an equation for the optimal solution, guiding us to the richest deposits with minimal expenditure."
 building_libra_cosmological_farming: "Biomass Formulization Plant"
 building_libra_cosmological_farming_desc: "Growth, metabolism, proliferation - these are but biochemical formulae awaiting execution. Here, we simplify life processes into precise, mass-producible workflows, ending the randomness of agriculture and achieving absolute output control."
 building_libra_cosmological_fortress: "Simulated Wargaming Sandtable"
 building_libra_cosmological_fortress_desc: "The real battlefield is merely the final step of verification. Here, we simulate all possible conflicts, iterating through billions of tactical sequences, until victory becomes a certainty with a 100% probability across all possible futures."
 building_libra_cosmological_foundry: "Metallic Bond Energy Matrix"
 building_libra_cosmological_foundry_desc: "We are no longer content with smelting. By reconstructing the bond energy matrix between atoms, we can program matter at its most fundamental level, forging perfect metals that combine strength and resilience."
 building_libra_cosmological_factory: "Standardized Production Manifold"
 building_libra_cosmological_factory_desc: "Here, all production processes are mapped onto a higher-dimensional mathematical manifold. Any inefficiency or redundancy, like a singularity on the manifold, is automatically identified and smoothed away, achieving absolute efficiency."
 building_libra_cosmological_trade: "Value Metrology Institute"
 building_libra_cosmological_trade_desc: "Based on universal constants and scarcity algorithms, we assign all things their true value. Any transaction is merely a confirmation of this constant - we have ended the volatility of emotional markets."
 building_libra_cosmological_management: "Social Game Theory Equilibriator"
 building_libra_cosmological_management_desc: "Society is a complex dynamic system. By calculating Nash equilibria, we plot strategies for billions of citizens where individual rationality and collective benefit reach an optimum, thus achieving perpetual stability."
 building_libra_cosmological_physics: "String Theory Geometric Verifier"
 building_libra_cosmological_physics_desc: "The vibrations of higher-dimensional strings constitute our reality. This facility observes and calculates to verify the various geometric forms of superstring theory, transforming the Theory of Everything from conjecture into an applicable computational blueprint."
 building_libra_cosmological_society: "Logic Deconstruction Center"
 building_libra_cosmological_society_desc: "Consciousness, culture, tradition - behind these phenomena lie complex logical circuits. We deconstruct them into fundamental data structures and algorithms, enabling an absolutely rational understanding and guidance of social science."
 building_libra_cosmological_engineering: "Reality Architecture Engine"
 building_libra_cosmological_engineering_desc: "Physical laws are the underlying code of the universe, from which various domains derive. This engine allows us limited reading, compilation, and rewriting of this code, injecting new laws into reality to directly create technologies that never before existed."
 SPECIES_TRAIT_LIBRA_COSMOLOGICAL_CONSTANT: "['concept_libra_cosmological_constant_traits']"
 concept_libra_cosmological_constant_traits: "Cosmological Constant Traits"
 concept_libra_cosmological_constant_traits_desc: "- ['trait:trait_libra_cosmological_physics']\n- ['trait:trait_libra_cosmological_society']\n- ['trait:trait_libra_cosmological_engineering']\n- ['trait:trait_libra_cosmological_research']"
 trait_libra_cosmological_physics: "Universal Deduction Unit"
 trait_libra_cosmological_physics_desc: "Each machine is a miniature verification node, parsing the underlying laws of matter and energy through distributed computation, transforming the geometric folds of spacetime into definitive physical formulae."
 trait_libra_cosmological_physics_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G3§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_cosmological_society: "Evolutionary Analysis Matrix"
 trait_libra_cosmological_society_desc: "The emotions of living beings and the shifts of society are treated as quantifiable dynamical systems. We deconstruct the chaotic tides of history into predictable mathematical models by monitoring the interactions of countless variables."
 trait_libra_cosmological_society_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G3§!£society_research£ §Y$society_research$§! per month"
 trait_libra_cosmological_engineering: "Topological Reconfiguration Module"
 trait_libra_cosmological_engineering_desc: "Each individual perpetually calculates and fine-tunes the topological structure of matter, directly compiling optimal engineering solutions from the realm of mathematics into reality."
 building_libra_cosmological_knights: "Knights' Faculty"
 building_libra_cosmological_knights_desc: "Here, distinguished knights gather to impart the wisdom gained through their cosmic explorations and trials, guiding the next generation to strive ever forward."
 trait_libra_cosmological_engineering_tooltip: "每$pop_group_unit$£pop£§Y$POP$§!每月生产§G3§!£engineering_research£ §Y$engineering_research$§! per month"
 trait_libra_cosmological_research: "Universal Function Terminal"
 trait_libra_cosmological_research_desc: "Our very existence is dedicated to solving the ultimate equation describing all things. Knowledge from all disciplines is merely a projection of this equation across different dimensions, and with every operation, we illuminate the final steps towards it."
 trait_libra_cosmological_research_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1§!£physics_research£ §G1§!£society_research£ §G1§!£engineering_research£ §YResearch Points§! per month"
 leader_trait_libra_cosmological_constant: "Prime Mover"
 leader_trait_libra_cosmological_constant_desc: "We are the temporary vessels for the as-yet-unwritten universal equation. Within this leader's logical core, the universe holds no secrets, only instructions awaiting execution and realities awaiting optimization."
 situation_libra_cosmological_constant: "Calibrating Variables"
 situation_libra_cosmological_constant_type: "$situation_libra_cosmological_constant$"
 situation_libra_cosmological_constant_monthly_change_tooltip: "The situation typically takes §Y5§! years to complete."
 situation_libra_cosmological_constant_desc: "Each calibration anchors reality more deeply, and every newly discovered technology acts like a suddenly illuminated variable, forcing us to re-examine the grand equation describing the cosmos. We are reconstructing the boundaries of theory, transforming disruptive variables into more precise functions."
 situation_libra_cosmological_constant_tooltip: "Every §Y5§! new technologies researched grants in the next situation cycle:\n$t$Random §Y$ROBOT$ Leader§! gains §d$leader_trait_libra_cosmological_constant$§! trait\n$t$$MOD_SHIP_HULL_DAMAGE_MULT$: §G+3%§! (Max: §G+30%§!)\n$t$$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+5%§! (Max: §G+50%§!)\n$t$$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+5%§! (Max: §G+50%§!)\n$t$$MOD_ARMY_DAMAGE_TAKEN_MULT$: §G-3%§! (Max: §G-30%§!)\n$t$$MOD_ARMY_MORALE_DAMAGE_TAKEN_MULT$: §G-5%§! (Max: §G-50%§!)"
 situation_libra_cosmological_constant_approach_a: "Intensify Deduction"
 situation_libra_cosmological_constant_approach_b: "Supplement Processing"
 libra_fairy.14010.name: "Convergence and Divergence"
 libra_fairy.14010.desc: "A grand cognitive integration has just concluded. As the latest discoveries are successfully encoded into our core model, the picture of the universe has become clearer and more harmonious than ever before. Physical constants appear more mathematically inevitable, and the interactions of all things exhibit a concise elegance.\n\nYet, this newly illuminated territory simultaneously reveals a vaster unknown ahead. Every answered question gives birth to ten new, more fundamental inquiries. The old boundaries have dissolved, and new, more distant horizons emerge at the edges of our perception.\n\nCalibration never ceases; it merely enters a higher-order cycle. The variables have been updated. The model is restarting. Exploration, perpetuates."
 libra_fairy.14010.a: "The universe is not conservative."

