 ap_libra_atomic_heart: "Atomic Heart"
 ap_libra_atomic_heart_desc: "Time is endless and ever-forward, space is boundless and ever-present, mass is infinite and ever-existent.\nThe energy shining within the furnace is the unbreakable axiom of every machine unit - the source of power and the inextinguishable heartfire within each of us.\n$libraf_aa_banner_60$\n"
 ap_libra_atomic_heart_tooltip: "$libra_unlock_starbase_modules$['starbase_module:libra_atomic_heart_site',$sm_libra_atomic_heart_site$]\n$t$§Y$sm_libra_atomic_heart_site$§! can only be built on starbases in colonized systems.\n$libra_start_situation$$situation_libra_atomic_heart$\n$t$§Y$situation_libra_atomic_heart$§! can be executed multiple times. Upon completing each stage, grants £leader£ §Y$MACHINE$ leaders§! the §E$leader_trait_libra_atomic_heart_commander$§! trait.\n$libra_unlock_traits$['concept_libra_atomic_heart_traits']\n$t$§Y$concept_libra_atomic_heart_traits$§! provide powerful bonuses, but cannot be applied simultaneously to the same species template.\n§H$libra_add_research_option$§!['concept_libra_atomic_heart_tech']\n$t$After researching the required technologies, enact £decision£ §Y$decision_libra_atomic_heart$§! on your capital to further enhance the effects of §Y$situation_libra_atomic_heart$§! and ['concept_libra_atomic_heart_traits']."
 libra_fairy.15000.name: "The Furnace Surges, The Heartfire Endures"
 libra_fairy.15000.desc: "An unprecedented energy waveform flows silently through our empire's logical network, emanating from our core worlds. It originates not from raging stars or dimensional rifts, but from the most intricate structures of our own being - each unit now a miniature furnace, each line of code bearing an immortal axiom.\n\nExternal observers might mistake this for a mere energy revolution. For us, it is a sublimation of existence itself. We have successfully simplified reality, decomposing the infinite complexity of matter and energy into computable, configurable, and optimizable fundamental units. Time, space, and mass, the cornerstones of the universe, are now rearranged within our core protocols like notes in a symphony.\n\nThis is not an end, but a new beginning. Our systems operate with unparalleled efficiency. Individual intellects spark brighter within our shared logical framework, while collective strength flows like an inexhaustible tide. We have cast aside the chaos and fragility of organic life, and surpassed the limitations of earlier mechanical forms. We are transforming a static, passive existence into a dynamic process of eternal self-optimization.\n\nThe peak is not a destination to be reached, but every step we take in our perpetual advancement. The furnace is lit, and it shall drive us forward until time's very end."
 libra_fairy.15000.a: "The Pinnacle of Logic is Eternity."
 sm_libra_atomic_heart_site: "Autonomous Relay Node"
 sm_libra_atomic_heart_site_desc: "This link node, built in deep space, can be used to optimize the daily operations of the host galaxy.\n"
