 agenda_libra_directive_76_e_army_modifier: "$council_agenda_agenda_libra_directive_76_e_name$"
 council_agenda_agenda_libra_directive_76_e_desc: "Quantity becomes quality - the clone tide shall drown worlds."
 agenda_libra_directive_76_e_tooltip: "Each £army_ship£ §Y$perfected_clone_army$§! provides §G+1%§! £mod_planet_colony_development_speed_mult£ §Y$MOD_PLANET_COLONY_DEVELOPMENT_SPEED_MULT$§! and §Y+1%§! £mod_planet_building_build_speed_mult£ §Y$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$§! for the next §Y20§! years, up to §G+100%§! each."
 situation_libra_directive_76: "Legion Forging"
 situation_libra_directive_76_type: "$situation_libra_directive_76$"
 situation_libra_directive_76_monthly_change_tooltip: "£building£ §Y$building_clone_vats$§! provides additional monthly progress."
 situation_libra_directive_76_desc: "The empire's war machine was not born perfect; it requires constant forging and calibration. This process is indifferent to external conflicts, focusing solely on the purity of our own form - smelting disparate individual wills into a unified instinct for war, replacing fragile biological tissue with more efficient combat modules.\n\nThis is an inward conquest, with the sole objective of eradicating the last vestiges of inefficiency and uncertainty from our military system. Each completed step brings our Legions closer to their ultimate form. Upon the completion of this forging, our 'peace' will no longer be an aspiration, but an undeniable reality defined by our absolute power."
 situation_libra_directive_76_effects: "Unlocks a §Y$ap_libra_directive_76$§! ability"
 situation_libra_directive_76_tooltip: "Unlocks all §Y$ap_libra_directive_76$§! abilities"
 situation_libra_directive_76_approach_a: "Integrate"
 situation_libra_directive_76_approach_b: "Accelerate"
 libra_fairy.10021.name: "Stage 1: Foundation Blueprint"
 libra_fairy.10021.desc: "The grand project of forging the Clone Legions has commenced. Currently, we possess only a blank canvas and limitless potential. The foundational framework must be established, as it will determine the Legion's future development path and characteristics.\n\nWe must judiciously select the first field of enhancement - shall we temper the keenness of their offense, or forge the immortality of their defense? Each choice will give the Legion its initial form and reveal the next piece of the puzzle to be assembled."
 libra_fairy.10021.a: "Construct a Stellar Fortress."
 libra_fairy.10021.b: "Establish a Legion Headquarters."
 libra_fairy.10021.c: "Commence Genetic Tailoring."
 libra_fairy.10022.name: "Stage 2: Taking Form"
 libra_fairy.10022.desc: "The first phase of enhancements has been successfully integrated into the Legion's core protocols, with effects manifesting as precisely as simulated. However, these successful initial tests have also revealed new, optimizable nodes within the system.\n\nWith the foundation solidified, more complex upgrade paths unfold before us. Do we deepen our initial advantages, or compensate for newly discovered shortcomings? The empire's work of martial art awaits its next decisive stroke."
 libra_fairy.10022.a: "Stellar Fortifications."
 libra_fairy.10022.b: "Headquarters Construction."
 libra_fairy.10022.c: "Genetic Research."
 libra_fairy.10022.d: "Military Training."
 libra_fairy.10022.e: "Individual Replication."
 libra_fairy.10022.f: "Commander Enhancement."
 libra_fairy.10023.name: "Stage 3: Systemic Integration"
 libra_fairy.10023.desc: "The Legion's subsystems are operating in concert with unprecedented efficiency. We have moved beyond optimizing single components, entering the macroscopic level of systemic integration.\n\nNew fields of cross-application are emerging. It is time to weave our existing enhancement modules into a more resilient and adaptive organic whole. The next direction of integration will determine whether the Legion becomes an unstoppable spear or an impregnable shield."
 libra_fairy.10023.a: "Halt the enemy with Fortresses."
 libra_fairy.10023.b: "Command the Legion with Tactics."
 libra_fairy.10023.c: "Create advantage with Genes."
 libra_fairy.10023.d: "Shatter chains with Discipline."
 libra_fairy.10023.e: "Lead all with Elites."
 libra_fairy.10023.f: "Support Commanders with Advisors."
 libra_fairy.10024.name: "Stage 4: Refinement"
 libra_fairy.10024.desc: "The Legion has demonstrated formidable potential, yet the boundaries of its power remain distant. We stand at the threshold between 'excellence' and 'perfection'.\n\nPrecise internal diagnostics reveal possibilities for deeper, more nuanced adjustments. These optimizations, while subtle, may cast the decisive weight upon the scales of future battlefields. Choosing where to apply this craftsmanship is the key step towards the ultimate form."
 libra_fairy.10024.a: "Starbases."
 libra_fairy.10024.b: "Planetary Development."
 libra_fairy.10024.c: "Species Traits."
 libra_fairy.10024.d: "Army Effectiveness."
 libra_fairy.10024.e: "Leader Cloning."
 libra_fairy.10024.f: "Leader Enhancement."
 libra_fairy.10025.name: "Stage 5: Metamorphosis"
 libra_fairy.10025.desc: "The Legion's power approaches the theoretical limits of its original design framework. Yet, we press onward - latest biological simulations indicate several near-disruptive evolutionary paths to a higher state of being.\n\nThis is no mere optimization, but a thorough metamorphosis. We will redefine the potential boundaries of the Clone Legions. The path we choose will forge the ultimate weapon capable of rewriting galactic military history."
 libra_fairy.10025.a: "Upgrade Stellar Engineering."
 libra_fairy.10025.b: "Organize the Legion Core."
 libra_fairy.10025.c: "Refine Chromosomal Sequences."
 libra_fairy.10025.d: "Enhance Military Support."
 libra_fairy.10025.e: "Construct a Mirror Empire."
 libra_fairy.10025.f: "Create Super Clones."
 libra_fairy.10026.name: "Stage 6: Final Honing"
 libra_fairy.10026.desc: "The outline of the ultimate Legion is now visible, its prowess exceeding our most optimistic projections. Now, only a few final parameters require calibration to achieve perfect resonance across all subsystems.\n\nThis is the final work: complete it, and the Legion will cease to be a mere weapon. It will become a perfect, living work of martial art, the most unquestionable guarantee of the empire's peace."
 libra_fairy.10026.a: "Intensify Army Training."
 libra_fairy.10026.b: "Clone Elite Commanders."
 libra_fairy.10026.c: "Refine the Replicants."
 libra_fairy.10027.name: "Perfect Form"
 libra_fairy.10027.desc: "As the final code was written into the genes, as the last neural pathways calibrated to perfect resonance, a great silence fell. This was not emptiness, but an awe-inspiring tranquility born of ultimate order.\n\nThe grand imperial blueprint has, at this moment, become tangible reality. What stands before us is no mere army, but a living, breathing, thinking work of martial art. They are infinite variations on a single genetic theme, a perfect synthesis of cold logic and fervent destructive will. Every unit is an indispensable component of the whole, billions of individuals resonating with a single purpose.\n\nThe empire's borders may have limits, but the power defined by this ultimate Legion is boundless. They themselves are the mobile border, the final frontier of civilization. Henceforth, peace will not be a goal we plead for, but the state of existence we dictate for the galaxy."
 libra_fairy.10027.a: "The Legion is Truth."
 libra_fairy.10031.name: "Stellar Garrison"
 libra_fairy.10031.desc: "Grim fortresses in the void form an inescapable net, marking the domain of the Clones - a forbidden zone for enemies, and a safe harbor for the Legions."
 libra_fairy.10032.name: "Central Command"
 libra_fairy.10032.desc: "Through the diligent work of engineering teams, in coordination with bio-research and military departments, the blueprint for the Clone Headquarters is complete. This magnificent structure combines functions of research, experimentation, and military command, awaiting only a suitable location for construction."
 libra_fairy.10033.name: "Clone Adaptability"
 libra_fairy.10033.desc: "After sufficient testing, clinical data collection, and adjustments, R&D has developed three distinct genetic templates for the Clones, specializing in certain advantages while preserving combat effectiveness. What should we prioritize?"
 libra_fairy.10033.a: "Quality is the prime directive."
 libra_fairy.10033.b: "Quantity can overwhelm problems."
 libra_fairy.10033.c: "Leadership decides the outcome."
 libra_fairy.10034.name: "Sergeant's Call"
 libra_fairy.10034.desc: "Clones are biological entities, capable of rapid deployment, yet traditional military training remains beneficial. Through experimentation, the military has developed a new activity protocol that allows for the pursuit of secondary objectives during routine operations."
 libra_fairy.10035.name: "Another Us"
 libra_fairy.10035.desc: "Following specialized optimization research, our experimental team has created an advanced cloning facility dedicated to replicating elite leaders, capable of fully recreating their abilities. Given its complexity and maintenance demands, housing it at the Headquarters is ideal. Leaders requiring this service may report to the facility for the cloning process."
 libra_fairy.10036.name: "Clone Advisors"
 libra_fairy.10036.desc: "We have upgraded the original leader clones to higher standards via more precise processes, enabling performance approximating the original. These refined replicants inherit our martial nature, showing remarkable potential in military fields."

