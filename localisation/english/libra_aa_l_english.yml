 tech_libra_purity_sanctuary: "Throne of Purity"
 tech_libra_purity_sanctuary_desc: "$libra_genetics_tech_biomorphosis_tt$Construct a sanctum to symbolize our future.\n$libra_gate_banner_15$"
 building_libra_flawless_sanctuary: "Sanctuary of Flawlessness"
 building_libra_flawless_sanctuary_desc: "This magnificent hall serves as a residence for noble beings, equipped with advanced medical facilities and capable of accommodating hundreds of millions for their daily living."

 tech_libra_purity_enhancement: "Physiological Enhancement"
 tech_libra_purity_enhancement_desc: "Optimizing physiological structures can shield us from certain congenital defects and enhance overall capabilities.\n$libra_gate_banner_15$"
 edict_libra_purity_enhancement: "Exceptional Efficiency"
 edict_libra_purity_enhancement_desc: "Awaken our instinct for efficiency."

 tech_libra_purity_traits: "Paragon Organism"
 tech_libra_purity_traits_desc: "We can - and will - be the universe's perfect creation, harnessing nature's gifts to their utmost potential.\n$libraf_te_banner_14$"
 TECH_UNLOCK_LIBRA_TPST_TITLE: "$libra_unlock_traits$$concept_libra_purity_traits$"
 TECH_UNLOCK_LIBRA_TPST_DESC: "§H$concept_libra_purity_traits$§!\n$concept_libra_purity_traits_desc$"
 SPECIES_TRAIT_LIBRA_PURITY: "['concept_libra_purity_traits']"
 concept_libra_purity_traits: "Paragon Species Traits"
 concept_libra_purity_traits_desc: "Uses §Y2§! §Y$species_trait_points_add$§! to provide powerful bonuses. For empires not following the £purity£ ['tradition_category:tradition_purity'] path, these are treated as $TRAIT_TITLE$ costing §Y4§! §Y$species_trait_points_add$§!, including:\n$t$- ['trait:trait_libra_purity_energy']\n$t$- ['trait:trait_libra_purity_minerals']\n$t$- ['trait:trait_libra_purity_food']\n$t$- ['trait:trait_libra_purity_army']\n$t$- ['trait:trait_libra_purity_trade']\n$t$- ['trait:trait_libra_purity_consumer_goods']\n$t$- ['trait:trait_libra_purity_alloys']\n$t$- ['trait:trait_libra_purity_unity']\n$t$- ['trait:trait_libra_purity_research']\n$t$- ['trait:trait_libra_purity_leader']"
 trait_libra_purity_energy: "Mechanic Instinct"
 trait_libra_purity_energy_desc: "This species is designed to generate electricity, and the soul of a mechanic flows through their body."
 trait_libra_purity_minerals: "Miner Talent"
 trait_libra_purity_minerals_desc: "It takes extraordinary skill, endurance and perseverance to work continuously in a mining field, even in the interstellar age."
 trait_libra_purity_food: "Agricultural Mind"
 trait_libra_purity_food_desc: "In the past, the skills of watering and fertilizing crops were passed down from mouth to mouth among laborers, but now, these skills are the basic knowledge of this species thanks to genetic engineering."
 trait_libra_purity_army: "Battlefield Instinct"
 trait_libra_purity_army_desc: "This species embodies the perfect soldier: strong, brave, loyal, and resilient."
 trait_libra_purity_trade: "Overall Consideration"
 trait_libra_purity_trade_desc: "Commercial talent is not usually innate, but this species has been genetically modified to achieve top business skills."
 trait_libra_purity_consumer_goods: "Skilled Craftsman"
 trait_libra_purity_consumer_goods_desc: "Bloodline has endowed this species with unique aesthetic attestation and a powerful operational ability to produce the finest works of art."
 trait_libra_purity_alloys: "Master Mechanic"
 trait_libra_purity_alloys_desc: "This species' cognition of numbers, shapes and Spaces has been greatly improved, and they are able to accurately operate smelting equipment in any situation to produce high-quality alloys."
 trait_libra_purity_unity: "Official Tradition"
 trait_libra_purity_unity_desc: "Congenital genetic modifications give them keen insight, so this species has no problem in the administrative realm."
 trait_libra_purity_research: "Scholar Thinking"
 trait_libra_purity_research_desc: "The wisdom of hundreds of ages and countless ages is condensed in the minds of this species, giving them unparalleled wisdom."
 trait_libra_purity_leader: "Natural Leadership"
 trait_libra_purity_leader_desc: "Phenotypic enhancements bestow supreme charisma and leadership, making this species adept at managing interpersonal dynamics."

 tech_repeatable_libra_purity: "Morphological Optimization"
 tech_repeatable_libra_purity_desc: "Morphological modifications unlock further potential.\n$libraf_te_banner_15$"


 ap_libra_ode_to_babel: "Ode to Babel"
 ap_libra_ode_to_babel_desc: "We compose our genes into verses and weave our bloodlines into melodies, singing a sacred hymn that reaches for the starry heavens. In due time, a great tower shall be raised to commemorate this grand achievement, preserving our supreme accomplishment for all eternity.\n$libraf_aa_banner_20$\n"
 ap_libra_ode_to_babel_tooltip: "$libra_start_situation$$situation_libra_rebuilding_babel$\n$t$§Y$situation_libra_rebuilding_babel$§! grants additional progress from choosing the £purity£ ['tradition_category:tradition_purity'] ['concept_flexible_tradition'] during the ['concept_biomorphosis'] situation. Once completed, it allows the construction or reconstruction of the £building£ §Y$building_libra_babel_tower$§!.\n$libra_unlock_decisions$$decision_libra_ode_to_babel$\n$t$§Y$decision_libra_ode_to_babel$§! spends £energy£ §Y$energy$§! and £unity£ §Y$unity$§! to add the §Y$decision_libra_babel_modifier$§! to a colony, increasing £mod_pop_bonus_workforce_mult£ §Y$mod_organic_pop_bonus_workforce_mult$§! and £mod_planet_building_build_speed_mult£ §Y$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$§!.\n$libra_unlock_starbase_buildings$['starbase_building:libra_babel_tower',$sm_libra_babel_tower$]\n$t$§Y$sm_libra_babel_tower$§! must be built on a §Y$starbase_starhold$§! or higher-level §Y$shipclass_starbase$§!. Provides system-wide benefits.\n$libra_unlock_planet_buildings$['building:building_libra_babel_tower']\n$t$§Y$building_libra_babel_tower$§! can be upgraded §Y99§! times. Each upgrade increases §G+3%§! £mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§! and §G+1.2%§! §Y$mod_planet_jobs_productive_produces_mult$§!. Every §Y11§! upgrades grant an additional $EMPIRE_EFFECTS_W_ICON$."
 libra_fairy.11000.name: "Marduk's Foresight"
 libra_fairy.11000.desc: "While countless civilizations in the galaxy still wander lost in the labyrinth of genetics, we have already discerned that perilous path leading to the summit. This is not gentle refinement, but a grand wager with our entire species at stake - stripping away all impurities, tempering the purest form of life, and tethering our race's destiny to a tower that reaches the very limits of the cosmos.\n\nEvery optimized gene sequence is a brave rupture with millions of years of evolutionary history; every purification of lifeform is a direct challenge to the laws of the universe. You have rejected the comfortable paths of evolution, choosing instead the most arduous, yet most glorious, ascent. Even if an abyss of utter destruction lies ahead, the very courage to touch the taboos of life has already crowned your civilization."
 libra_fairy.11000.a: "The summit is our only direction!"
 libra_fairy.11000.tt: "$building_libra_babel_tower$ Starting Level: §G+5§!"
 libra_fairy.11002.name: "The Fall of Babel"
 libra_fairy.11002.desc: "A mournful cry of shattering gene chains echoes from the heavens, as the radiance of the Babel Tower extinguishes inch by inch across the stars. This celestial ladder, bearing the ultimate dream of our civilization, now turns into fragments of falling stars plummeting to the ground. Each falling crystal carries our incomplete genetic codes, scattering in the wind like blood-stained covenants.\n\nYet, the blueprint for construction, deeply ingrained in our bloodline, still burns within every cell. The shattered genetic codes seek recombination in the void. This is not the end, but a new covenant between our species and destiny - since we once built a ladder to the stars, we are destined to compose an even more magnificent movement upon the ruins."
 libra_fairy.11002.a: "Begin from the ashes, rebirth from the genes."
 situation_libra_rebuilding_babel: "Rebuilding Babel"
 situation_libra_rebuilding_babel_type: "$situation_libra_rebuilding_babel$"
 situation_libra_rebuilding_babel_monthly_change_tooltip: "Choosing the ['tradition_category:tradition_purity'] ['concept_flexible_tradition'] during the ['concept_biomorphosis'] situation adds extra progress."
 situation_libra_rebuilding_babel_desc: "While the silhouette of the Babel Tower remains in our genetic memory, or its wreckage still lies scattered upon our worlds, the ancient blueprint sleeping within our bloodline is reawakened. We must gather the purest gene sequences, calibrate the resonant frequency of every hereditary trait, until the lost structure becomes clear once more within our collective will. When the final genetic key is activated, the sacred hymn shall resonate anew atop the tower, heralding the return of an unyielding civilization."
 situation_libra_rebuilding_babel_tooltip: "Allows the construction of £building£ §Y$building_libra_babel_tower$§!"
 situation_libra_rebuilding_babel_approach: "Prepare"
 libra_fairy.11010.name: "The Celestial Ladder's Return"
 libra_fairy.11010.desc: "fter countless cycles of genetic evolution and material reconstruction, the spiral ladder to the sea of stars has finally transformed from blueprint into reality. The foundation of the Babel Tower is deeply rooted in the purest genetic code of our species, its structure inscribed with information woven from the energetic forms of countless individual lives. Its existence is not merely an edifice, but a declaration of our civilization's advance towards its ultimate form."
 libra_fairy.11010.r.desc: "From the ruins, from memory, the Babel Tower rises once more. Past scars are covered by new gene sequences, broken resonances reconnected. This reborn celestial ladder is sturdier than before, for it carries the indomitable will of a civilization and its fidelity to the origin of life."
 libra_fairy.11010.a: "Our bloodline is eternity."
 building_libra_babel_tower: "Babel Tower"
 building_libra_babel_tower_desc: "This spiral celestial ladder, constructed from pure gene sequences, uses the perfect genetic code of our species as its foundation, converging the biological resonance of our entire civilization into a symphony reaching for the sea of stars. Each growth of the tower is a return to the origin of life; each new level brings us closer to life's ultimate form. Even should the tower crumble, the blueprint of life ingrained in every cell will ensure the civilization's sacred hymn resonates across the galaxy once more."
 building_libra_babel_tower_2: "$building_libra_babel_tower$"
 building_libra_babel_tower_2_desc: "$building_libra_babel_tower_desc$"
 planet_libra_babel: "$building_libra_babel_tower$"
 building_libra_babel_tower_level: "Babel Tower Level: §Y[Owner.libra_babel_level]§!/99\n\n"
 building_libra_babel_tower_effect: "Increases §G+3%§! £mod_country_naval_cap_mult£ §Y$MOD_COUNTRY_NAVAL_CAP_MULT$§! per §Y$sm_libra_babel_tower$§! in the empire, up to §G+120%§!.\nIncreases §G+4%§! £mod_country_all_tech_research_speed£ §Y$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$§! per §Y$decision_libra_babel_modifier$§! in the empire, up to §G+120%§!."
 requires_libra_rebuilding_babel_sit: "$TRIGGER_FAIL$Requires the completion of the §Y$situation_libra_rebuilding_babel$§! situation."
 decision_libra_ode_to_babel: "Sing the Ode to Babel"
 decision_libra_ode_to_babel_desc: "Let the pure gene sequences achieve their final resonance within the civilization's hymn, solidifying our lifeforms into an eternal coordinate pointing towards the sea of stars."
 decision_libra_babel_modifier: "Monument of Purity"
 decision_libra_babel_modifier_desc: "The Babel Tower signifies the absolute purity of our species. This monument drives our people ever forward, fueled by pride.。"
 sm_libra_babel_tower: "Tower of Purity"
 sm_libra_babel_tower_desc: "This facility transforms the space environment into a paradise for biological organisms. Advanced genetic technology allows us to move with ease even in zero-gravity.\n"
 libra_fairy.11023.name: "Cornerstone Secured"
 libra_fairy.11023.desc: "As the thirty-third tier of the Babel Tower stabilizes amidst genetic spirals, a gentle yet resilient energy field slowly expands from the tower, enveloping the entire empire like an intangible tapestry of life. Henceforth, the foundation of our civilization is inextricably linked to this genetic monument, making our existence unshakable by any turmoil."
 libra_fairy.11023.a: "Our foundation is unbreakable."
 libra_fairy.11026.name: "Stellar Resonance"
 libra_fairy.11026.desc: "The Babel Tower breaches the sixty-sixth tier, establishing a profound resonance between the biological crystal at its apex and the starry expanse. It is no longer merely a structure, but a colossal living sensor, translating the whispers of the stellar sea into revelations we can comprehend. Every individual in the empire can faintly sense a form of guidance and blessing emanating from the depths of the cosmos."
 libra_fairy.11026.a: "Heed the revelations of the stellar sea."
 libra_fairy.11029.name: "Where the Tower Stands, the Empire Endures"
 libra_fairy.11029.desc: "As the final gene sequence perfectly locks into place at the spire, the Babel Tower achieves its ultimate form. It is no longer just a tower, but the eternal projection of our pure species within the material universe. What flows through its structure is no longer light, but life's laws condensed into substance; its very existence constitutes an independent benchmark of reality.\n\nFrom this moment, the fate of the empire is wholly fused with the Babel Tower. While the Tower stands, our civilization endures; while it remains erect, our genes are immortal. Even should galaxies reverse and dimensions crumble, so long as a single brick of this great tower exists in any space-time, our civilization forever retains the right to be reborn and return."
 libra_fairy.11029.a: "We sing of purity within eternity."

 ap_libra_ei_dorado: "Ei Dorado"
 ap_libra_ei_dorado_desc: "云端之上，星河之外，构筑唯一且永恒的乐土。\n$libraf_aa_banner_20$\n"
 ap_libra_ei_dorado_tooltip: ""


