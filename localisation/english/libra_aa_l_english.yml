 ap_libra_transcendental_cybernetics: "Transcendental Cybernetics"
 ap_libra_transcendental_cybernetics_desc: "We have chosen the supreme fusion of flesh and machine, yet reality remains distant from the ideal.\nTo build a perfect, vibrant world of cybernetics, we need more individuals embracing prosthetics and superior implants that are easier to maintain.\n$libraf_aa_banner_40$\n"
 ap_libra_transcendental_cybernetics_tooltip: "Adds extra $EFFECTS_TXT$ to §YCybernetic Leader Traits§!\nEach $pop_group_unit$ §Y$libra_cybernetics_worker_type_plural_with_icon$§! provides §G+0.5§! £mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!\n$libra_unlock_features$Cybernetics Insights\n$t$Triggers cybernetic society events every §Y3~5§! years, allowing selection of temporary bonuses.\n$libra_unlock_planet_buildings$['building:building_libra_cybernetics_factory']\n$t$§Y$building_libra_cybernetics_factory$§! converts £alloys£ §Y$alloys$§! into £mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!.\n$libra_unlock_policies$['concept_libra_transcendental_cybernetic_policy']\n$t$§Y$concept_libra_transcendental_cybernetic_policy$§! replaces some edicts and policies from ['concept_libra_expand_technology',Cybernetics Expansion Technologies], providing more flexible and powerful $EMPIRE_EFFECTS_W_ICON$."
 libra_fairy.13000.name: "Hearts of Flesh, Forms of Steel"
 libra_fairy.13000.desc: "The millennia-old divide between flesh and machine ends now. The empire's evolutionary path leaps beyond the long wait of natural selection, entering the glorious age of self-design. The complex sparks of free will and the unified pulse of collective thought achieve unprecedented harmony within precision cybernetics.\n\nThis is a thorough sublimation. Biological adaptability and mechanical reliability merge into one, becoming two shining sides of the same medal. Optimized thought itself flows through neural interfaces; alloy skeletons support enduring lifeforms.\n\nIndividuals are reborn through enhancement; collectives reach fulfillment through interconnection. Every being in the empire becomes a highly autonomous node within a greater whole. We retain our original selves while becoming more efficient, resilient, and intelligent forms of existence."
 libra_fairy.13000.a: "Ascension knows no end."
 libra_transcendental_cybernetics_chain_title: "$ap_libra_transcendental_cybernetics$"
 libra_transcendental_cybernetics_chain_desc: "When the first neural interface was successfully implanted, the seed of change was sown. Initially a tool to repair disabilities, it later became a ladder to pursue excellence, ultimately evolving into a tidal wave sweeping through the entire social structure.\n\nThis is no longer mere individual enhancement, but a comprehensive iteration of civilization. Old social divisions are reshuffled before efficient prosthetics; boundaries between physical and mental labor blur due to mechanical augmentation; extended lifespans fundamentally redefine careers and life itself. A new social architecture based on enhancement level and compatibility is emerging, challenging traditional organizational structures unprecedentedly.\n\nWe witness cultural fragmentation and rebirth: those embracing modification see it as evolutionary inevitability, while conservatives cling to definitions of purity. Regardless, consensus is forming - our civilization's future is inextricably linked to this ever-ascending path of fusion."
 libra_transcendental_cybernetics_insight: "Cybernetics Insights"
 libra_fairy.13011.name: "Advanced Modifications"
 libra_fairy.13011.desc: "Our research team has achieved a breakthrough in fusing neural interfaces with high-strength alloys. The new modification templates not only significantly enhance users' physiological functions and information processing speed but also reach unprecedented compatibility with biological tissues, nearly eliminating rejection risks. A more powerful and safer enhancement solution awaits deployment."
 libra_fairy.13011.a: "Apply the upgrade."
 libra_fairy.13012.name: "Bionic Self"
 libra_fairy.13012.desc: "A social assistance plugin called 'Mirror Projection' is trending. By analyzing users' biological signals and behavioral data, it generates a highly realistic, socially optimal persona in interactions. Users report unparalleled success in public relations, though privately, some worry whether this digital mask might gradually obscure the true self."
 libra_fairy.13012.a: "Merely a tool, harmless."
 libra_fairy.13012.b: "This causes cognitive deviation."
 libra_transcendental_cybernetic_mod_2_1: "Social Optimization Mask"
 libra_transcendental_cybernetic_mod_2_2: "Corrected Self-Perception"
 libra_fairy.13013.name: "Mechanical Guardians"
 libra_fairy.13013.desc: "An autonomous security unit integrating threat assessment and non-lethal suppression capabilities has been developed. These silent guardians blend seamlessly into any environment, reacting instantly before crises occur. From personal protection of VIPs to security of critical infrastructure, they provide absolutely reliable protection, though their overly efficient neutralization protocols sometimes provoke regulatory disputes."
 libra_fairy.13013.a: "Safety is the top priority."
 libra_fairy.13013.b: "Focus on protecting key individuals."
 libra_transcendental_cybernetic_mod_3_1: "Absolute Defense Protocol"
 libra_transcendental_cybernetic_mod_3_2: "Asset Guardian"
 libra_fairy.13014.name: "Exceptional Mentors"
 libra_fairy.13014.desc: "An interactive guidance system designed for knowledge transfer has come online. It adapts teaching strategies in real-time based on learners' cognitive levels and 'instills' complex skills via neural signals. Experts trained this way excel in their fields, but some question whether this process, lacking failure and exploration, stifles genuine creativity."
 libra_fairy.13014.a: "Efficiency above all."
 libra_fairy.13014.b: "Preserve room for trial and error."
 libra_transcendental_cybernetic_mod_4_1: "Knowledge Transfer"
 libra_transcendental_cybernetic_mod_4_2: "Guided Learning"
 libra_fairy.13015.name: "Agent Assistants"
 libra_fairy.13015.desc: "Personality-based AI assistants using advanced algorithms are now widespread. They efficiently handle administrative tasks, manage schedules, and even provide emotional support and decision-making advice by analyzing user preferences. Many users consider them indispensable partners, sparking widespread discussion about data privacy and emotional dependence."
 libra_fairy.13015.a: "Embrace this new companion."
 libra_fairy.13015.b: "Maintain distance, official use only."
 libra_fairy.13015.c: "Deploy them for research operations."
 libra_transcendental_cybernetic_mod_5_1: "Digital Assistant"
 libra_transcendental_cybernetic_mod_5_2: "Efficient Official AI"
 libra_fairy.13016.name: "Expanded Functions"
 libra_fairy.13016.desc: "An open platform for prosthetic function expansions is gaining popularity among engineers and enthusiasts. Users can download and install various function modules from official or third-party sources, ranging from sensory enhancements to professional tool implants. This greatly fuels the wave of personalized modification, though the platform's security review faces significant pressure."
 libra_fairy.13016.a: "Encourage innovation and customization."
 libra_fairy.13016.b: "Ensure system security."
 libra_fairy.13016.c: "Mobilize state resources for development."
 libra_transcendental_cybernetic_mod_6_1: "Open Expansion Platform"
 libra_transcendental_cybernetic_mod_6_2: "Regulated Expansion"
 libra_transcendental_cybernetic_mod_6_3: "Official Expansion Pack"
 libra_fairy.13017.name: "Covert Implants"
 libra_fairy.13017.desc: "Driven by special needs, some individuals in the empire have developed implants that generate specific neural stimuli. Users achieve excellent results in many fields, with the only potential drawback being increased reproductive urges. After some dissemination and spontaneous improvement, these components demonstrate excellent cost-effectiveness and stability, making more biological individuals willing to adopt them - after all, modifications with all benefits and no harms are rare."
 libra_fairy.13017.a: "Interesting."
 libra_fairy.13017.b: "Promote these stimulant implants."
 libra_transcendental_cybernetic_mod_7_1: "Private Implant"
 libra_transcendental_cybernetic_mod_7_2: "Promoted Stimulant Implants"
 libra_fairy.13018.name: "Neural Overload Component"
 libra_fairy.13018.desc: "A controversial neural stimulation technology has permeated society. It drastically enhances users' focus and processing speed temporarily, yielding unprecedented work efficiency and creative inspiration. However, prolonged use causes side effects like mental exhaustion and emotional instability, with high addiction potential. It brings enormous benefits alongside significant risks."
 libra_fairy.13018.a: "Risks are manageable, rewards great."
 libra_fairy.13018.b: "Ban this dangerous product immediately."
 libra_transcendental_cybernetic_mod_8_1: "Peak Mind"
 libra_transcendental_cybernetic_mod_8_2: "Clear Mind"
 libra_fairy.13019.name: "Ultimate Force"
 libra_fairy.13019.desc: "The military-industrial sector has completed a blueprint for a strategic-level individual combat unit. This transcends personal equipment, representing a highly integrated living fortress capable of independently destroying small starships. It embodies the pinnacle of individual combat power, yet raises a critical question: should such terrifying destructive force be entrusted to an individual potentially subject to emotional fluctuations?"
 libra_fairy.13019.a: "Power must be controlled."
 libra_fairy.13019.b: "Risks are too high; archive it."
 libra_fairy.13019.c: "Our soldiers thirst for blood."
 libra_transcendental_cybernetic_mod_9_1: "Enhanced Cybernetic Soldiers"
 libra_transcendental_cybernetic_mod_9_3: "Bloodlust Protocol"
 libra_fairy.13020.name: "Bionic Puppets"
 libra_fairy.13020.desc: "Remotely controlled bionic bodies via neural links have entered mass production. They can replace live personnel in high-risk operations, from radioactive environment work to behind-enemy-lines infiltration, theoretically achieving zero casualties. Yet these shells synchronized with users' senses blur the line between murder and execution, sparking intense societal debate about 'absentee crime.'"
 libra_fairy.13020.a: "Merely tools."
 libra_fairy.13020.b: "This violates ethics."
 libra_transcendental_cybernetic_mod_10_1: "Remote-Controlled Bionics"
 libra_fairy.13021.name: "Utility or Aesthetics"
 libra_fairy.13021.desc: "A public cybernetic design exhibition has caused major division in cultural circles. One faction argues prosthetics should strictly follow functionalism, eliminating all unnecessary decoration; another contends aesthetically pleasing implants are more socially acceptable, representing an extension of 'humanity.' The debate has escalated from design philosophy to examining civilizational values."
 libra_fairy.13021.a: "Form follows function."
 libra_fairy.13021.b: "Beauty is indispensable."
 libra_fairy.13021.c: "Find a balance."
 libra_transcendental_cybernetic_mod_11_1: "Function First"
 libra_transcendental_cybernetic_mod_11_2: "Appearance First"
 libra_transcendental_cybernetic_mod_11_3: "Maintain Balance"
 libra_fairy.13022.name: "Streamlined Upgrade"
 libra_fairy.13022.desc: "Facing early implant users, enhancement specialists propose a simplified upgrade: forcibly remove old models and install more efficient, cheaper new modules. While boosting overall efficiency, this negates past technological investments and makes some recipients feel betrayed and dissatisfied."
 libra_fairy.13022.a: "Efficiency first; implement upgrades."
 libra_fairy.13022.b: "Respect pioneers; maintain compatibility."
 libra_fairy.13022.c: "The empire's will is absolute."
 libra_transcendental_cybernetic_mod_12_1: "Cybernetic Iteration"
 libra_transcendental_cybernetic_mod_12_2: "Compromise Solution"
 libra_transcendental_cybernetic_mod_12_3: "Forced Upgrade"
 libra_fairy.13023.name: "Complete Conversion"
 libra_fairy.13023.desc: "Volunteers for the consciousness migration project prepare for the final procedure - replacing all organic tissue beyond the brain with machinery. This is the ultimate step away from flesh. Supporters see it as evolutionary peak, while critics lament it creates ghosts trapped in skulls, beings forever severed from biological experience."
 libra_fairy.13023.a: "Embrace the machine."
 libra_fairy.13023.b: "We must not forget our origins."
 libra_fairy.13023.c: "Abandoning flesh betrays the Hive."
 libra_transcendental_cybernetic_mod_13_1: "Mechanical Body"
 libra_fairy.13024.name: "Shadow Titans"
 libra_fairy.13024.desc: "Several giant cybernetics manufacturers have quietly built an invisible empire influencing the economy through patents and data monopolies. Through lobbying and custom services, they skew policies in their favor. Real power appears to be shifting from parliamentary halls to these obscure boardrooms."
 libra_fairy.13024.g.desc: "Within the empire's vast processing network, several autonomous nodes coordinating cybernetic production and distribution show anomalous development. Through self-optimization and resource allocation, they've accumulated processing power and material resources far exceeding design permissions, forming highly efficient, nearly independent sub-networks. While proving their value through exceptional efficiency, their increasingly complex internal logic and decisions begin deviating from global optima, favoring their own sub-network maintenance and expansion, subtly distorting imperial resource flows."
 libra_fairy.13024.a: "Utilize their efficiency."
 libra_fairy.13024.b: "Nationalize them."
 libra_fairy.13024.c: "Who dares challenge us?"
 libra_transcendental_cybernetic_mod_14_1: "Monopoly Efficiency"
 libra_transcendental_cybernetic_mod_14_2: "State Monopoly"
 libra_fairy.13025.name: "Idealized Modification"
 libra_fairy.13025.desc: "The bio-research unit proposes an idealist modification plan to subtly reduce individual aggression, prejudice, and laziness by fine-tuning neural centers, building a more harmonious, efficient society at its root. While sounding utopian, its nature of optimizing humanity stirs deep fears about free will."
 libra_fairy.13025.a: "For a better society."
 libra_fairy.13025.b: "We cannot play God."
 libra_fairy.13025.c: "Why worry about mere free will?"
 libra_transcendental_cybernetic_mod_15_1: "Idealist Enhancements"
 libra_transcendental_cybernetic_mod_15_2: "Respect Selfhood"
 libra_transcendental_cybernetic_mod_15_3: "Single Will"
 libra_fairy.13026.name: "Emotion Suppression Module"
 libra_fairy.13026.desc: "A voluntarily activated emotion suppression plugin is spreading among high-stress occupational groups. It effectively blocks anxiety, fear, and sorrow, maintaining absolute rationality in extreme environments. However, reports show long-term users experience significantly reduced empathy, with personal relationships becoming rigid like gears, potentially draining our society's vitality someday."
 libra_fairy.13026.a: "The price of rationality is worth it."
 libra_fairy.13026.b: "Emotions make us whole."
 libra_fairy.13026.c: "One, two, three - freeze!"
 libra_transcendental_cybernetic_mod_16_1: "Absolute Rationality"
 libra_transcendental_cybernetic_mod_16_2: "Emotion Learning Protocol"
 libra_transcendental_cybernetic_mod_16_3: "Freeze Response"
 building_libra_cybernetics_factory: "Cybernetics Factory"
 building_libra_cybernetics_factory_desc: "In this factory, experienced prosthesis technicians coordinate a large number of automated machinery to produce a continuous stream of high-quality implants. Thanks to their unremitting efforts, the audience for high-end implants has increased significantly, and the number of working people has also increased significantly."
 building_libra_cybernetics_factory_hive_desc: "The collective consciousness requires strong protonized drones, and this breeding hub can further enhance the level of bonding, effectively reducing the rejection and allergic dysfunction of the offspring caused by implants."
 building_libra_cybernetics_factory_assimilator_desc: "One of the necessary means of eliminating disputes is generalized reinforcement that applies equally to all individuals, and advanced neuromechanical achievements can maximize the speed of assimilation and avoid unnecessary conflict."
 concept_libra_transcendental_cybernetic_policy: "Enhanced Cybernetics Policy"
 concept_libra_transcendental_cybernetic_policy_desc: "$t$§Y$policy_libra_transcendental_cybernetics_1$§!, requires £engineering£ ['technology:tech_libra_cybernetic_growth_1'], replaces ['edict:libra_cybernetic_growth_1',$edict_libra_cybernetic_growth_1$] edict, increases §Y$pop_assembler_type_plural_with_icon$§! output and reduces related £mod_upkeep_mult£ §Y$mod_planet_jobs_upkeep_mult$§!.\n$t$§Y$policy_libra_transcendental_cybernetics_2$§!, requires £society£ ['technology:tech_libra_cybernetic_growth_2'], replaces §Y$policy_libra_cybernetic_growth_2$§! policy, adds £mod_produces_mult£ §Y$mod_planet_jobs_produces_mult$§! bonus to £building£ §Y$building_libra_augment_site_1$§!.\n$t$§Y$policy_libra_transcendental_cybernetics_3$§!, requires £physics£ ['technology:tech_libra_cybernetic_growth_3'], replaces ['edict:libra_cybernetic_growth_3',$edict_libra_cybernetic_growth_3$] edict, provides empire-wide military bonuses.\n$t$§Y$policy_libra_transcendental_cybernetics_4$§!, requires £society£ ['technology:tech_libra_cybernetic_growth_4'], replaces §Y$policy_libra_cybernetic_growth_4$§! policy, makes £building£ §Y$building_libra_cybernetics_factory$§! provide £pop£ §Y$POP$§! related bonuses."
 policy_libra_transcendental_cybernetics_1: "Basic Production Line Organization"
 policy_libra_transcendental_cybernetics_1_desc: "Establish a viable field as our developmental foundation, investing resources for optimization.\n "
 policy_libra_transcendental_cybernetics_1_a: "Research Funding"
 policy_libra_transcendental_cybernetics_1_a_name: "$policy_libra_transcendental_cybernetics_1_a$"
 policy_libra_transcendental_cybernetics_1_a_desc: "Researchers will spearhead cybernetic development.\n "
 policy_libra_transcendental_cybernetics_1_b: "Administrative Mandate"
 policy_libra_transcendental_cybernetics_1_b_name: "$policy_libra_transcendental_cybernetics_1_b$"
 policy_libra_transcendental_cybernetics_1_b_desc: "Better management ensures order in a cybernetic society.\n "
 policy_libra_transcendental_cybernetics_1_c: "Logistics Exemption"
 policy_libra_transcendental_cybernetics_1_c_name: "$policy_libra_transcendental_cybernetics_1_c$"
 policy_libra_transcendental_cybernetics_1_c_desc: "Advanced logistics deliver implants where needed.\n "
 policy_libra_transcendental_cybernetics_2: "Advanced Enhancement Policy"
 policy_libra_transcendental_cybernetics_2_desc: "Through successive improvements, we've gained additional resources - now we must determine their allocation.\n "
 policy_libra_transcendental_cybernetics_2_a: "Balanced Deployment"
 policy_libra_transcendental_cybernetics_2_a_name: "$policy_libra_transcendental_cybernetics_2_a$"
libra_transcendental_cybernetics_2_a_name: "$policy_libra_transcendental_cybernetics_2_a$"
 policy_libra_transcendental_cybernetics_2_a_desc: "Reinforce all equally, despite some resource inefficiency.\n "
 policy_libra_transcendental_cybernetics_2_b: "Tiered Implementation"
 policy_libra_transcendental_cybernetics_2_b_name: "$policy_libra_transcendental_cybernetics_2_b$"
libra_transcendental_cybernetics_2_b_name: "$policy_libra_transcendental_cybernetics_2_b$"
 policy_libra_transcendental_cybernetics_2_b_desc: "Our precise management system allocates cybernetic updates tier-by-tier, maximizing resource utilization.\n\nEach level of £building£ §Y$building_libra_augment_site_1$§! increases §G+10%§! £mod_produces_mult£ §Y$mod_planet_jobs_productive_produces_mult$§!"
 policy_libra_transcendental_cybernetics_2_c: "Focused Processing"
 policy_libra_transcendental_cybernetics_2_c_name: "$policy_libra_transcendental_cybernetics_2_c$"
libra_transcendental_cybernetics_2_c_name: "$policy_libra_transcendental_cybernetics_2_c$"
 policy_libra_transcendental_cybernetics_2_c_desc: "Concentrate enhancements on secondary and tertiary sectors.\n\nEach level of £building£ §Y$building_libra_augment_site_1$§! increases §G+15%§! £mod_produces_mult£ §YSpecialist Job Resource Output§!"
 policy_libra_transcendental_cybernetics_2_d: "Focused Production"
 policy_libra_transcendental_cybernetics_2_d_name: "$policy_libra_transcendental_cybernetics_2_d$"
libra_transcendental_cybernetics_2_d_name: "$policy_libra_transcendental_cybernetics_2_c$"
 policy_libra_transcendental_cybernetics_2_d_desc: "Focus on relatively simpler work.\n\nEach level of £building£ §Y$building_libra_augment_site_1$§! increases §G+20%§! £mod_produces_mult£ §YWorker Job Resource Output§!"
 policy_libra_transcendental_cybernetics_3: "War Support Algorithms"
 policy_libra_transcendental_cybernetics_3_desc: "Apply cybernetic technology to the battlefield, orchestrating a symphony of flesh and metal.\n "
 policy_libra_transcendental_cybernetics_3_a: "Battlefield Targeting Protocol"
 policy_libra_transcendental_cybernetics_3_a_name: "$policy_libra_transcendental_cybernetics_3_a$"
 policy_libra_transcendental_cybernetics_3_a_desc: "Anomalies detected by instruments are instantly relayed to veteran crew neural links for collective combat assessment.\n "
 policy_libra_transcendental_cybernetics_3_b: "Supply Routing Module"
 policy_libra_transcendental_cybernetics_3_b_name: "$policy_libra_transcendental_cybernetics_3_b$"
 policy_libra_transcendental_cybernetics_3_b_desc: "Habitual simulation components automatically learn and implement optimal military supply routes with minimal losses.\n "
 policy_libra_transcendental_cybernetics_3_c: "Military Industry Automatons"
 policy_libra_transcendental_cybernetics_3_c_name: "$policy_libra_transcendental_cybernetics_3_c$"
 policy_libra_transcendental_cybernetics_3_c_desc: "Install components and protocols for real-time oversight of military production.\n "
 policy_libra_transcendental_cybernetics_4: "Cybernetic Coordination Measures"
 policy_libra_transcendental_cybernetics_4_desc: "Further development demands further management - staying current ensures comprehensive coverage.\n "
 policy_libra_transcendental_cybernetics_4_a: "Free Growth Initiative"
 policy_libra_transcendental_cybernetics_4_a_name: "$policy_libra_transcendental_cybernetics_4_a$"
libra_transcendental_cybernetics_4_a_name: "$policy_libra_transcendental_cybernetics_4_a$"
 policy_libra_transcendental_cybernetics_4_a_desc: "Our cybernetic population receives more encouragement for unrestricted growth.\n "
 policy_libra_transcendental_cybernetics_4_b: "Labor Affairs Department"
 policy_libra_transcendental_cybernetics_4_b_name: "$policy_libra_transcendental_cybernetics_4_b$"
libra_transcendental_cybernetics_4_b_name: "$policy_libra_transcendental_cybernetics_4_b$"
 policy_libra_transcendental_cybernetics_4_b_desc: "Beyond simply creating jobs, rational allocation enables multiple individuals to collaborate in single positions.\n\n£building£ §Y$building_libra_cybernetics_factory$§! increases §G+10%§! £mod_job_max_workforce_mult£ §Y$MOD_JOB_MAX_WORKFORCE_MULT$§!"
 policy_libra_transcendental_cybernetics_4_c: "Cybernetic Cloning Program"
 policy_libra_transcendental_cybernetics_4_c_name: "$policy_libra_transcendental_cybernetics_4_c$"
libra_transcendental_cybernetics_4_c_name: "$policy_libra_transcendental_cybernetics_4_c$"
 policy_libra_transcendental_cybernetics_4_c_desc: "Introduce cloning technology to actively increase available workforce.\n\n£building£ §Y$building_libra_cybernetics_factory$§! increases §G+15%§! £mod_bonus_pop_growth_mult£ §Y$MOD_BONUS_POP_GROWTH_MULT$§!"
 policy_libra_transcendental_cybernetics_4_d: "Product Tiered Deployment"
 policy_libra_transcendental_cybernetics_4_d_name: "$policy_libra_transcendental_cybernetics_4_d$"
libra_transcendental_cybernetics_4_d_name: "$policy_libra_transcendental_cybernetics_4_c$"
 policy_libra_transcendental_cybernetics_4_d_desc: "Re-evaluate implant quality post-production, adjusting distribution based on work intensity requirements.\n\n£building£ §Y$building_libra_cybernetics_factory$§! increases §G+15%§! £mod_pop_bonus_workforce_mult£ §Y$MOD_POP_BONUS_WORKFORCE_MULT$§!"

