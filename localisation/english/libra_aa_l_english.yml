 trait_libra_cutefied_0: "Kemonomimi"
 trait_libra_cutefied_0_desc: "Genetic modifications grant this species bestial traits - they gain excellent physical prowess and… a stable estrous cycle."
 trait_libra_cutefied_0_tooltip: "Per §YNegative $TRAIT_TITLE$§! owned:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+15%§!"
 trait_libra_cutefied_1: "Dragon Girl"
 trait_libra_cutefied_1_desc: "Through modification, this species inherits ancient dragon lineage, noble and powerful; but also inherits draconic habits, finding shiny treasures irresistible."
 trait_libra_cutefied_1_tooltip: "Every $pop_group_unit$£pop£§Y$POP$§! consumes an additional §R0.50§!£energy£ §Y$energy$§!"
 trait_libra_cutefied_2: "Avian"
 trait_libra_cutefied_2_desc: "This cute species possesses avian genes and human intellect."
 trait_libra_cutefied_2_tooltip: "$MOD_LEADER_SPECIES_EXP_GAIN$: §G+10%§!\n$t$- Per §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+2%§!"
 trait_libra_cutefied_3: "Maid"
 trait_libra_cutefied_3_desc: "Maintaining cleanliness is a servant's duty. These diligent individuals meticulously tend to their living environments, ensuring comfort and habitability."
 trait_libra_cutefied_3_tooltip: "Per §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+5%§!"
 trait_libra_cutefied_4: "Slime Girl"
 trait_libra_cutefied_4_desc: "This species is modified into a special shapeshifting lifeform capable of proliferating in most environments."
 trait_libra_cutefied_4_tooltip: "Per 10% §Y$HABITABILITY$§! of the colony:\n$tt$- $MOD_BONUS_POP_GROWTH_MULT$: §G+1%§!"
 trait_libra_cutefied_5: "Tentacle Girl"
 trait_libra_cutefied_5_desc: "These adorable tentacles can perform intricate maneuvers difficult for ordinary limbs."
 trait_libra_cutefied_5_tooltip: "Per §Y$TRAIT_TITLE$§! owned:\n$tt$- $specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+2%§!"
 trait_libra_cutefied_6: "Elf"
 trait_libra_cutefied_6_desc: "This species is long-lived, noble, and erudite, yet they only favor environments perfectly suited to them."
 trait_libra_cutefied_6_tooltip: "Per 10% §Y$HABITABILITY$§! of the colony:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+1%§!"
 trait_libra_cutefied_7: "Idol"
 trait_libra_cutefied_7_desc: "Strengths can be amplified infinitely, while flaws must be concealed as much as possible. As long as one doesn't step out of line, even the worst problems can be glossed over, right?"
 trait_libra_cutefied_7_tooltip: "Per §YPositive $TRAIT_TITLE$§! owned:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.10§!£society_research£ §Y$society_research$§! and §G0.15§!£unity£ §Y$unity$§! per month"
 trait_libra_cutefied_8: "Wraith"
 trait_libra_cutefied_8_desc: "For a necroid species with slight psionic ability, genetic modification is a relatively challenging feat. Success, however, allows them to output resentment as potent energy, just like them."
 trait_libra_cutefied_8_tooltip: "Per §YNegative $TRAIT_TITLE$§! owned:\n$tt$- $mod_planet_pops_upkeep_mult$: §G-5%§!"
 trait_libra_cutefied_9: "Mermaid"
 trait_libra_cutefied_9_desc: "A human half eliminates these fish's concerns about droughts; they can sing enchanting songs anywhere."
 trait_libra_cutefied_9_tooltip: "Per 10% §Y$HABITABILITY$§! of the colony:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.05§!£physics_research£ §Y$physics_research$§! and §G0.025§!£society_research£ §Y$society_research$§! per month"
 trait_libra_cutefied_10: "Shrine Maiden"
 trait_libra_cutefied_10_desc: "This species can perceive events happening in slightly more distant worlds."
 trait_libra_cutefied_10_tooltip: "Per §Y$TRAIT_TITLE$§! owned:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.05§!£physics_research£ §G0.05§!£society_research£ §G0.05§!£engineering_research£ §YResearch Points§! per month"
 trait_libra_cutefied_n1: "Gleaming Adornments"
 trait_libra_cutefied_n1_desc: "This species excessively adores alloy ornaments, a demand that almost rises to the level of a necessity."
 trait_libra_cutefied_n1_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R0.1§!£alloys£ §Y$alloys$§!"
 trait_libra_cutefied_n2: "Desk-corner Expert"
 trait_libra_cutefied_n2_desc: "This species expends considerable energy on self-gratification, leading to a lack of enthusiasm in practical operations."
 trait_libra_cutefied_n3: "Awkward Dialogue"
 trait_libra_cutefied_n3_desc: "They simply wish to speak normally, unaware that their phrasing creates subtle ambiguities for listeners."
 trait_libra_cutefied_n4: "Dangerous Hairstyle"
 trait_libra_cutefied_n4_desc: "This species' popular hairstyle is too uniformly classic, seemingly bedecked with flags foretelling some misfortune."
 trait_libra_cutefied_n5: "Magic Mirror Dependence"
 trait_libra_cutefied_n5_desc: "Members of this species often ask anyone they meet, 'Who is the fairest of them all?'"
 trait_libra_cutefied_n6: "Toothbrush Enthusiast"
 trait_libra_cutefied_n6_desc: "This species loves small objects with tiny motors, like electric toothbrushes."
 trait_libra_cutefied_n7: "Devious X"
 trait_libra_cutefied_n7_desc: "This species enjoys a passive position - or rather, they always set traps to induce the other party to make the first move."
 trait_libra_cutefied_n8: "Master's Task"
 trait_libra_cutefied_n8_desc: "This species is engrossed in role-playing, neglecting daily duties."
 trait_libra_cutefied_m1: "Preferred Showcase"
 trait_libra_cutefied_m1_desc: "Only environments chosen by this species can showcase their beauty; elsewhere, they're just ordinary."
 trait_libra_cutefied_m2: "Solitude-seeking Tendency"
 trait_libra_cutefied_m2_desc: "This species enjoys admiring their own beautiful appearance alone."
 trait_libra_cutefied_m3: "Perverse Regeneration"
 trait_libra_cutefied_m3_desc: "This species' regenerative ability is accompanied by secretion of special hormones, making them more prone to radical behavior. Simply put, they're all psychopaths."
 trait_libra_cutefied_m4: "Social Squatter"
 trait_libra_cutefied_m4_desc: "Once they decide on their place, they are unwilling to make any changes, even if staying put means facing peculiar misfortunes."
 trait_libra_cutefied_m5: "Paw Paw Punch"
 trait_libra_cutefied_m5_desc: "Their physical strength is rather low; if used to attack, it's more likely to elicit excitement in the opponent than to cause actual harm."
 trait_libra_cutefied_m6: "Arch-nemesis of the Bed"
 trait_libra_cutefied_m6_desc: "This species loves sleeping in very much and often delays important moments, such as when emigration flights are scheduled to depart."
 trait_libra_cutefied_m7: "Breastfeeding Constitution"
 trait_libra_cutefied_m7_desc: "A particular genetic expression influences this species' hormone secretion, causing them to produce copious amounts of milk when stimulated even without pregnancy, which imposes a considerable nutritional burden."
 trait_libra_cutefied_m7_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£food£ §Y$food$§!"

# ####################
# Cybernetic
# ####################

 tech_libra_centralised_cybernetics: "Centralised Cybernetics"
 tech_libra_centralised_cybernetics_desc: "As a theory conceived as far back as the mechanical age, cybernetics will be interpreted in a whole new way in today's age of prosthetics, allowing us to reach our goals faster and more consistently.\n$libraf_te_banner_3$"

 tech_libra_cybernetic_adaptive_standards: "Adaptive Standards"
 tech_libra_cybernetic_adaptive_standards_desc: "Even on the same planet, the same set of prostheses can be used in quite different environments, and we should compile a more flexible set of implementation procedures for all plug-ins to make them as user-friendly as possible.\n$libraf_te_banner_3$"
 building_libra_augment_dispatch_centre: "Augment Dispatch Centre"
 building_libra_augment_dispatch_centre_desc: "This building integrates all $building_augmentation_centre$ data and indirectly schedules the production, transport and installation of all cyborg implants within the empire."
 building_libra_augment_dispatch_centre_effect_desc: "Increase by §G+4%§! $libra_empire$ £mod_pop_growth_speed£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!, §Y+1%§! $libra_empire$§Y$mod_planet_jobs_produces_mult$§! and §Y$mod_planet_jobs_upkeep_mult$§! for every £building£ §Y$building_augmentation_center$§! in the empire, up to a maximum of §G+100%§! £mod_pop_growth_speed£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!, §Y+25%§! §Y$MOD_POP_BONUS_WORKFORCE_MULT$§! and §Y$mod_planet_jobs_upkeep_mult$§!."
 building_libra_augment_dispatch_centre_hive: "Augment Dispatch Hub"
 building_libra_augment_dispatch_centre_hive_desc: "$building_libra_augment_dispatch_centre_desc$"
 building_libra_augment_dispatch_centre_assimilator: "Augment Dispatch Node"
 building_libra_augment_dispatch_centre_assimilator_desc: "$building_libra_augment_dispatch_centre_desc$"
 building_libra_augment_dispatch_centre_assimilator_effect_desc: "Increase by §G+1%§! $libra_empire$ £mod_pop_growth_speed£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!, §Y+0.25%§! $libra_empire$ §Y$mod_planet_jobs_produces_mult$§! and §Y$mod_planet_jobs_upkeep_mult$§! for every £job_gestation_drone£ §Y$job_gestation_drone$§! in the empire, up to a maximum of §G+100%§! £mod_pop_growth_speed£ §Y$MOD_LOGISTIC_GROWTH_MULT$§!, §Y+25%§! §Y$MOD_POP_BONUS_WORKFORCE_MULT$§! and §Y$mod_planet_jobs_upkeep_mult$§!."

 tech_libra_universal_prosthesis: "Universal Prosthesis"
 tech_libra_universal_prosthesis_desc: "We need a universal, powerful and easily generalizable component that can be applied to all of our individuals to strengthen them equally.\n$libraf_te_banner_3$"
 TECH_UNLOCK_LIBRA_UCT_TITLE: "$libra_unlock_features$Universal Prosthetic Modification"
 TECH_UNLOCK_LIBRA_UCT_DESC: "§HUniversal Prosthetic Modification§!\n$concept_libra_universal_prosthesis_traits_desc$"
 concept_libra_universal_prosthesis_traits: "Universal Prosthetic Traits"
 concept_libra_universal_prosthesis_traits_desc: "Cyborg traits that can be applied to §Y$trait_cybernetic$§! and §Y$ROBOT$§! species, cannot be assembled to §Y$trait_psionic$§! or §Y$trait_robot_digital_1$§! species. Including:\n$t$- ['trait:trait_libra_universal_prosthesis_energy']\n$t$- ['trait:trait_libra_universal_prosthesis_minerals']\n$t$- ['trait:trait_libra_universal_prosthesis_food']\n$t$- ['trait:trait_libra_universal_prosthesis_trade']\n$t$- ['trait:trait_libra_universal_prosthesis_consumer_goods']\n$t$- ['trait:trait_libra_universal_prosthesis_alloys']\n$t$- ['trait:trait_libra_universal_prosthesis_unity']\n$t$- ['trait:trait_libra_universal_prosthesis_research']\n$t$- ['trait:trait_libra_universal_prosthesis_crime']"
 libra_prosthesis_energy_upkeep_1_tt: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R0.50§!£energy£ §Y$energy$§!"
 libra_prosthesis_energy_upkeep_2_tt: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£energy£ §Y$energy$§!"
 trait_libra_universal_prosthesis_energy: "Mechanic's Kits"
 trait_libra_universal_prosthesis_energy_desc: "Prosthetic sets dedicated to the operation, adjustment and repair of electrical installations."
 trait_libra_universal_prosthesis_minerals: "Extractive Equation"
 trait_libra_universal_prosthesis_minerals_desc: "This enhanced plug-in allows the user to operate dozens of workhorses simultaneously to perform mining operations."
 trait_libra_universal_prosthesis_food: "Nutrient Enrichment Tank"
 trait_libra_universal_prosthesis_food_desc: "Special containers for the direct synthesis of nutrients such as starch are capable of larger scale production organization when connected to a prosthetic network."
 trait_libra_universal_prosthesis_trade: "Rapid Market Protocol"
 trait_libra_universal_prosthesis_trade_desc: "Plugin for enabling fast transactions."
 trait_libra_universal_prosthesis_consumer_goods: "Precision Work Template"
 trait_libra_universal_prosthesis_consumer_goods_desc: "A high-precision robotic arm that can process artwork and other consumables on its own according to a preset schedule."
 trait_libra_universal_prosthesis_alloys: "Furnace Boosters"
 trait_libra_universal_prosthesis_alloys_desc: "This heavy-duty component is able to intervene directly in the nanofurnace to increase and maintain the furnace's operating power."
 trait_libra_universal_prosthesis_unity: "Proclamation Amplifier"
 trait_libra_universal_prosthesis_unity_desc: "This plug-in can be implemented by the wearer to receive and understand various decrees, and can also be forced to correct the wearer's violations."
 trait_libra_universal_prosthesis_research: "Logic Enhancement Circuit"
 trait_libra_universal_prosthesis_research_desc: "These chips can greatly enhance an individual's ability to think logically to a limited extent."
 trait_libra_universal_prosthesis_crime: "Riot Control Module"
 trait_libra_universal_prosthesis_crime_desc: "Cybernetic augmentation significantly enhances individual capabilities while introducing additional instability. These modules possess elevated privileges in certain domains, enabling them to readily suppress criminal activities."

 tech_libra_multiprosthesis_integration: "Multi-module Integration"
 tech_libra_multiprosthesis_integration_desc: "Integrating many different types of but highly correlated implants, we can create powerful magical puppet components that take our existence to a whole new level.\n$libraf_te_banner_3$"
 TECH_UNLOCK_LIBRA_MCT_TITLE: "$libra_unlock_features$Integrated Prosthetic Modification"
 TECH_UNLOCK_LIBRA_MCT_DESC: "§HIntegrated Prosthetic Modification§!\n$concept_libra_multi_prosthesis_traits_desc$"
 SPECIES_TRAIT_LIBRA_MUTI_CYBORG: "['concept_libra_multi_prosthesis_traits']"
 concept_libra_multi_prosthesis_traits: "Integrated Prosthetic Traits"
 concept_libra_multi_prosthesis_traits_desc: "Cyborg traits that can be applied to §Y$trait_cybernetic$§! and §Y$ROBOT$§! species, provide the corresponding type of enhancement for the leader, but cannot be assembled at the same time. Including:\n$t$- ['trait:trait_libra_multi_prosthesis_a']\n$t$- ['trait:trait_libra_multi_prosthesis_b']\n$t$- ['trait:trait_libra_multi_prosthesis_c']\n$t$- ['trait:trait_libra_multi_prosthesis_d']\n$t$- ['trait:trait_libra_multi_prosthesis_e']\n$t$- ['trait:trait_libra_multi_prosthesis_f']"
 trait_libra_multi_prosthesis_a: "Demon: Psychodynamics"
 trait_libra_multi_prosthesis_a_desc: "This Demon is capable of unleashing power from deep within the user's consciousness, and is incredibly tough on the battlefield."
 trait_libra_multi_prosthesis_a_tt: "Grant £leader£ §YLeaders§! $libra_veteran_cyborg_leader_traits$ that increases £energy£ £trade£ output"
 leader_trait_libra_multi_prosthesis_a: "Psychodynamics"
 leader_trait_libra_multi_prosthesis_a_desc: "This leader is configured with components for lifting somatic neural constraints."
 trait_libra_multi_prosthesis_b: "Demon: Surge Forward"
 trait_libra_multi_prosthesis_b_desc: "There's nothing that can't be solved with pep, and the users of this group of Demons are always full of pep."
 trait_libra_multi_prosthesis_b_tt: "Grant £leader£ §YLeaders§! $libra_veteran_cyborg_leader_traits$ that increases £energy£ £food£ £minerals£ output"
 leader_trait_libra_multi_prosthesis_b: "Surge Forward"
 leader_trait_libra_multi_prosthesis_b_desc: "This leader is fitted with special components capable of lifting the spirits and increasing mobility somewhat."
 trait_libra_multi_prosthesis_c: "Demon: Echo Protocol"
 trait_libra_multi_prosthesis_c_desc: "Specialized Demons used for listening and population management."
 trait_libra_multi_prosthesis_c_tt: "Grant £leader£ §YLeaders§! $libra_veteran_cyborg_leader_traits$ that increases £unity£ £trade£ output"
 leader_trait_libra_multi_prosthesis_c: "Echo Protocol"
 leader_trait_libra_multi_prosthesis_c_desc: "This leader's implant is plugged into a surveillance protocol terminal and has ready access to covert intelligence."
 trait_libra_multi_prosthesis_d: "Demon: Border Craftsman"
 trait_libra_multi_prosthesis_d_desc: "Groups of people fitted with this Demon are able to share some of their skills and support each other for a fee."
 trait_libra_multi_prosthesis_d_tt: "Grant £leader£ §YLeaders§! $libra_veteran_cyborg_leader_traits$ that increases £alloys£ £consumer_goods£ output"
 leader_trait_libra_multi_prosthesis_d: "Border Craftsman"
 leader_trait_libra_multi_prosthesis_d_desc: "How to refine it, how to make it, this leader couldn't be clearer, because the answer is there."
 trait_libra_multi_prosthesis_e: "Demon: Wisdom Of Fools"
 trait_libra_multi_prosthesis_e_desc: "Frequent to extreme lessons learned are the best feature of this Demon, who discovers the future through trial and error."
 trait_libra_multi_prosthesis_e_tt: "Grant £leader£ §YLeaders§! $libra_veteran_cyborg_leader_traits$ that increases £physics£ £society£ £engineering£ output"
 leader_trait_libra_multi_prosthesis_e: "Wisdom Of Fools"
 leader_trait_libra_multi_prosthesis_e_desc: "This leader has an advanced assistant AI that can quickly find the most appropriate reference from all past cases."
 trait_libra_multi_prosthesis_f: "Demon: Golem Games"
 trait_libra_multi_prosthesis_f_desc: "This set of Demons cuts away unnecessary worries of the assembler and puts them in a happy mood."
 trait_libra_multi_prosthesis_f_tt: "Grant £leader£ §YLeaders§! $libra_veteran_cyborg_leader_traits$ that increases £energy£ £unity£ output"
 leader_trait_libra_multi_prosthesis_f: "Golem Games"
 leader_trait_libra_multi_prosthesis_f_desc: "The goal of the Golem is extreme value utilization, and this leader is familiar with the potential value of the prosthetic body."

 tech_libra_cybernetic_exoskeleton_1: "Plasteel Reinforcements"
 tech_libra_cybernetic_exoskeleton_1_desc: "The use of plasteel materials to improve our mechanical body, perhaps it is not perfect in all aspects, and also difficult to update frequently, but compared with the traditional alloy is a mother of all questionable improvement.\n$libraf_te_banner_3$"
 building_libra_augment_site_1: "Enhanced Service Site"
 building_libra_augment_site_1_desc: "This building houses state-of-the-art equipment for maintaining and updating implant fittings to provide effective support to the colony."
 building_libra_augment_site_effect_desc: "Every $pop_group_unit$ §Y$libra_cybernetics_worker_type_plural_with_icon$§! brings §G+2.5%§! £mod_produces_mult£ §Y$mod_cyborg_pop_bonus_workforce_mult$§!."

 tech_libra_cybernetic_exoskeleton_2: "Durasteel Implants"
 tech_libra_cybernetic_exoskeleton_2_desc: "The advanced durasteel material is not only strong and less likely to cause rejection, but can also be produced quickly in an assembly line.\n$libraf_te_banner_3$"
 building_libra_augment_site_2: "Enhanced Service Center"
 building_libra_augment_site_2_desc: "Not only does it provide support services, but the service center is also able to produce highly customized accessories on a site-specific basis."

 tech_libra_cybernetic_exoskeleton_3: "Neutronium Exoskeleton"
 tech_libra_cybernetic_exoskeleton_3_desc: "Neutronium Armor marks the highest level in the field of material science, and with that combination we will be equally indestructible, turning the untouchable into reality.\n$libraf_te_banner_3$"
 building_libra_augment_site_3: "Enhanced Service Hubs"
 building_libra_augment_site_3_desc: "This complex produces a wide range of prosthetic accessories at an alarming rate, with a large number of professionals implementing drop-off, maintenance and recycling throughout the colony."

 tech_libra_cybernetic_growth_1: "Industrial Scale"
 tech_libra_cybernetic_growth_1_desc: "Guided by a new theory of control, we are able to organise huge implant production lines unique to the prosthetic society, ensuring that there will never be a shortage of labour.\n$libraf_te_banner_3$"
 edict_libra_cybernetic_growth_1: "Integrated Dispatch"
 edict_libra_cybernetic_growth_1_desc: "With the help of an optimised implant the decree is declared and transmitted without delay."

 tech_libra_cybernetic_growth_2: "Near-future Modulation"
 tech_libra_cybernetic_growth_2_desc: "How to form and stabilise a social order geared towards the implant era is no small challenge, and while continuing old strategies, we need to find new ways out.\n$libraf_te_banner_3$"
 policy_libra_cybernetic_growth_2: "Evolutionary Iteration"
 policy_libra_cybernetic_growth_2_desc: "We could make a more radical choice: abandon some of the weak individuals who can't adapt to the mechanical implants and engage in an interstellar age competition for survival.\n "
 policy_libra_cybernetic_growth_2_a: "Conservative Strategies"
 policy_libra_cybernetic_growth_2_a_name: "$policy_libra_cybernetic_growth_2_a$"
 libra_cybernetic_growth_2_a_name: "$policy_libra_cybernetic_growth_2_a$"
 policy_libra_cybernetic_growth_2_a_desc: "We will not really implement the strategy, and the so-called competition is nothing more than a warning.\n "
 policy_libra_cybernetic_growth_2_b: "Standardised Scheme"
 policy_libra_cybernetic_growth_2_b_name: "$policy_libra_cybernetic_growth_2_b$"
 libra_cybernetic_growth_2_b_name: "$policy_libra_cybernetic_growth_2_b$"
 policy_libra_cybernetic_growth_2_b_desc: "Properly implemented iterative plans weed out only the individuals who don't fit in: stripping them out of productivity planning and leaving the position open for suitable others.\n "
 policy_libra_cybernetic_growth_2_c: "Full-scale Promotion"
 policy_libra_cybernetic_growth_2_c_name: "$policy_libra_cybernetic_growth_2_c$"
 libra_cybernetic_growth_2_c_name: "$policy_libra_cybernetic_growth_2_c$"
 policy_libra_cybernetic_growth_2_c_desc: "Only the good enough mechanised individuals are qualified members of our society, and as for the old and the sick, all we can bring them is a painless end.\n "

 tech_libra_cybernetic_growth_3: "Algorithm Refinement"
 tech_libra_cybernetic_growth_3_desc: "Re-optimised high-performance implant algorithms can significantly improve our execution efficiency in all areas.\n$libraf_te_banner_3$"
 edict_libra_cybernetic_growth_3: "Logical Adaptation"
 edict_libra_cybernetic_growth_3_desc: "Combining biological sensibility with mechanical rationality, we can have better choices in some situations."

 tech_libra_cybernetic_growth_4: "Integrating Resilience"
 tech_libra_cybernetic_growth_4_desc: "The process of the prosthesis adapting to us, and us adapting to the prosthesis, are mutual. We need as much control as possible to avoid abnormalities such as rejection and to ensure that the mechanical implant always moves as well as our flesh and blood.\n$libraf_te_banner_3$"
 policy_libra_cybernetic_growth_4: "Growth Potential"
 policy_libra_cybernetic_growth_4_desc: "Appropriate investment of resources with a view to further broadening the sources of labour.\n "
 policy_libra_cybernetic_growth_4_a: "Prosthetic Benefits"
 policy_libra_cybernetic_growth_4_a_name: "$policy_libra_cybernetic_growth_4_a$"
 libra_cybernetic_growth_4_a_name: "$policy_libra_cybernetic_growth_4_a$"
 policy_libra_cybernetic_growth_4_a_desc: "Small grants for the voluntary population to increase their growth dynamics.\n "
 policy_libra_cybernetic_growth_4_b: "Intensive Maintenance"
 policy_libra_cybernetic_growth_4_b_name: "$policy_libra_cybernetic_growth_4_b$"
 libra_cybernetic_growth_4_b_name: "$policy_libra_cybernetic_growth_4_b$"
 policy_libra_cybernetic_growth_4_b_desc: "Our intensivists are focused on collecting and analysing every set of failure data, and our medical unit is fully committed to resolving every prosthetic injury to ensure the best possible hygiene for all.\n "
 policy_libra_cybernetic_growth_4_c: "Maximum Supports"
 policy_libra_cybernetic_growth_4_c_name: "$policy_libra_cybernetic_growth_4_c$"
 libra_cybernetic_growth_4_c_name: "$policy_libra_cybernetic_growth_4_c$"
 policy_libra_cybernetic_growth_4_c_desc: "This includes, but is not limited to, pre-positioned public works, peer-to-peer maintenance placements, etc., and we will implement all actions to drive population growth.\n "

