 job_libra_cybernetics_drone_swap_plural_with_icon: "[libra_cybernetics_drone.GetIcon] [libra_cybernetics_drone.GetName]"

 tech_repeatable_libra_cybernetic_labor: "Pre-positioned Labor"
 tech_repeatable_libra_cybernetic_labor_desc: "A mechanized workforce deployed in advance can facilitate our activities to a great extent, which, of course, requires our prosthetic interfaces to be adapted specifically for this purpose.\n$libraf_te_banner_3$"

 tech_repeatable_libra_cybernetic_experience_sharing: "Experience Sharing"
 tech_repeatable_libra_cybernetic_experience_sharing_desc: "The network of implants allows our individuals to share their situation anytime, anywhere, to get references from others and to add to the experience of others.\n$libraf_te_banner_3$"

 tech_repeatable_libra_cybernetic_growth: "Growth Optimisation"
 tech_repeatable_libra_cybernetic_growth_desc: "Deploy mass production processes for a range of core components such as biocompatible materials, brain-neuro implants, semi-automated control terminals, etc. at better cost, production lines and planning.\n$libraf_te_banner_3$"

