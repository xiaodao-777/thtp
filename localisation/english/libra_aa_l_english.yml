# ####################
# Virtuality
# ####################

 tech_libra_reality_deconstruction: "Reality Deconstruction"
 tech_libra_reality_deconstruction_desc: "By deconstructing the material world into computable and editable streams of information, we erase the boundary between reality and virtuality, allowing the empire within the digital realm to gain absolute control over the physical domain.\n$libraf_te_banner_7$"

 tech_libra_augmented_reality: "Augmented Reality"
 tech_libra_augmented_reality_desc: "Augmented reality is not particularly novel technology today, but when combined with virtual technology, it can significantly reduce the inconveniences brought by virtualization, markedly decreasing operational errors or network latency.\n$libraf_te_banner_7$"
 building_libra_AR_server: "Augmented Reality Server"
 building_libra_AR_server_desc: "These servers overlay the physical world with a real-time, interactive data layer, significantly improving efficiency from decision-making to execution."
 building_libra_AR_server_effect: "$EMPIRE_EFFECTS_W_ICON$ varies with the §Y$policy_virtuality_focus$§!."
 edict_libra_virtuality_1: "Virtual Network"
 edict_libra_virtuality_1_desc: "Utilizing virtual space to construct an efficient collaborative network, exceptional individual consciousness can issue commands here, transcending physical distance and vastly expanding our management capabilities."
 edict_libra_virtuality_2: "Simulated Reality Training"
 edict_libra_virtuality_2_desc: "All leaders undergo millennia of simulated governance and crisis management in highly realistic virtual environments. This condensed experience is directly imprinted into their core memory, tempering and elevating their abilities to unprecedented levels."

 tech_libra_virtuality_overclocking: "Server Overload"
 tech_libra_virtuality_overclocking_desc: "We have mastered the technology to temporarily push processors and energy systems beyond their design limits within safe thresholds. This controlled overload delivers explosive performance gains but requires precise management of the immense stress and degradation that follows.\n$libraf_te_banner_7$"
 building_libra_overclocking_matrix: "Overclocking Matrix"
 building_libra_overclocking_matrix_desc: "This facility fully unleashes the limits of local processors and the energy network, pushing computational power and productivity to their theoretical maximum. Within the matrix, all units operate beyond design specifications, yielding astonishing efficiency gains, but this also leads to rapid energy consumption and accelerated component wear."
 edict_libra_virtuality_3: "Planned Overclocking"
 edict_libra_virtuality_3_desc: "To meet urgent production demands, periodic overclocking of core servers is authorized. Output will be significantly increased, but the energy network and system maintenance will endure tremendous pressure."
 edict_libra_virtuality_4: "Planned Maintenance"
 edict_libra_virtuality_4_desc: "A strict preventive maintenance schedule involving regular downclocking, maintenance, and component replacement for critical systems. This sacrifices some peak performance but ensures long-term system stability and significantly reduces operational costs."

 tech_libra_virtuality_topology: "Topological Reconstruction"
 tech_libra_virtuality_topology_desc: "This technology enables us to reorganize a planet's physical space and resource distribution as if optimizing data storage structures. By 'defragmenting' and 're-indexing' planetary topology, we can unlock its hidden carrying potential.\n$libraf_te_banner_7$"
 building_libra_topology_planning: "Topology Planning Core"
 building_libra_topology_planning_desc: "This core is a powerful reality simulator capable of pre-completing the entire planet's district topology and construction plans in virtual space. By compiling optimal solutions directly into reality, it fundamentally redefines a world's carrying potential and makes construction projects as precise and rapid as data writing."
 building_libra_topology_planning_effect_desc: "Increases §G+1§! £mod_planet_max_districts_add£ §Y$MOD_PLANET_MAX_DISTRICTS_ADD$§! per §Y$planetary_ascension$§! tier."
 edict_libra_virtuality_5: "Expanded Computational Logic"
 edict_libra_virtuality_5_desc: "Directs the vast majority of virtual computing power towards scientific research. Simulated experiments iterate at unprecedented speeds, with new scientific discoveries flowing from virtual laboratories into reality like a tide."
 edict_libra_virtuality_6: "Supply-Oriented Compass"
 edict_libra_virtuality_6_desc: "Computing power is reallocated to focus on optimizing fleet logistics, simulating tactical maneuvers, and operating virtual shipyards. This greatly enhances our fleet's mobilization efficiency and size limit."

 tech_libra_virtuality_synchronous: "Global Synchronization Protocol"
 tech_libra_virtuality_synchronous_desc: "Develop a supreme coordination protocol covering the entire empire, eliminating all communication delays and comprehension discrepancies between individuals and systems. Henceforth, the empire can think and act as a unified organism.\n$libraf_te_banner_7$"
 building_libra_synchronous_coordinator: "Synchronous Coordinator"
 building_libra_synchronous_coordinator_desc: "This structure is designed to optimize data flow and collaboration protocols among all units in the colony, eliminating any delay or redundancy in task assignment, ensuring every command is executed at the optimal moment by the most suitable unit."
 edict_libra_virtuality_7: "Directive Balancing Act"
 edict_libra_virtuality_7_desc: "Via the synchronization protocol, the consciousness and decision-making processes of council members are deeply interlinked, forming an efficient collective mind. Their specialized knowledge complements each other, making every aspect of national governance almost perfect."
 edict_libra_virtuality_8: "Expanded Link Nodes"
 edict_libra_virtuality_8_desc: "This highly decentralized system intelligently shares the administrative load, minimizing the management resistance caused by imperial expansion."

 tech_repeatable_libra_virtuality_a: "Expanded Branch Network"
 tech_repeatable_libra_virtuality_a_desc: "Delegating some tasks to other entities can reduce our processing load; the handover process directly determines how much we can offload without incurring burden.\n$libraf_te_banner_7$"

 tech_repeatable_libra_virtuality_b: "Construction Template Upgrade"
 tech_repeatable_libra_virtuality_b_desc: "Improving our construction templates to reduce the constraints reality imposes on the expansion of the virtual world.\n$libraf_te_banner_7$"

 tech_repeatable_libra_virtuality_c: "Terminal Material Optimization"
 tech_repeatable_libra_virtuality_c_desc: "To exert influence in the physical world, movable forms are essential. By improving the execution terminals, we will achieve higher overall efficiency.\n$libraf_te_banner_7$"

