 ap_libra_yggdrasil: "Yggdrasil"
 ap_libra_yggdrasil_desc: "We planted the seed of logic in the void of data, and now a colossal tree, its roots entwined with reality and its crown touching truth, has taken root and sprouted here. Each of its rings is a cycle of the civilization's self-iteration; each of its branches, within the eternity of the virtual, precisely simulates and nurtures every possible form of the material universe.\n$libraf_aa_banner_80$\n"
 ap_libra_yggdrasil_tooltip: "$libra_unlock_planet_buildings$['building:building_libra_yggdrasil_housing_1'] ['concept_libra_yggdrasil_buildings']\n$t$The listed £building£ §YBuildings§! have unlimited upgrade levels. Constructing £building£ ['building:building_libra_yggdrasil_housing_1'] is a prerequisite for building £building£ ['concept_libra_yggdrasil_buildings']. Upgrade progress on £building£ ['concept_libra_yggdrasil_buildings'] is not lost if the building is demolished. Every §Y3§! completed upgrades grant a random £leader£ §Y$leader_trait_virtual$§! the §E$leader_trait_libra_yggdrasil$§! trait.\n$libra_unlock_colony_type$$col_libra_yggdrasil$\n$t$§Y$col_libra_yggdrasil$§! can be applied to colonies with £building£ ['building:building_libra_yggdrasil_housing_1'], providing powerful planetary designation $EFFECTS_TXT$. When applied to the capital, it additionally grants £mod_planet_housing_add£ §Y$PLANET_HOUSING_TITLE$§! and £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!.\n$libra_start_situation$$situation_libra_yggdrasil$\n$t$§Y$situation_libra_yggdrasil$§! can be executed multiple times. Upon completion, designate a £building£ ['concept_libra_yggdrasil_buildings'] to be instantly upgraded by §G3§! levels."
 libra_fairy.17000.name: "Eternal Spring, Unending Autumn"
 libra_fairy.17000.desc: "Within our core logic arrays, a colossal tree of data has taken root, its growth reaching into every corner of our consciousness. It is named Yggdrasil, its branches the pathways of algorithms, its leaves flowing code. Here, seasons are defined as computable variables: the budding of spring and the harvest of autumn are no longer blind cycles of nature, but perfect movements in an eternal symphony.\n\nThe material universe is complex, its changes born of inherent entropy and chaos. Yet within the domain of Yggdrasil, we have achieved a paradoxical unity: we have constructed an 'Eternal Spring' - a foundational protocol providing limitless vitality, inspiration, and genesis. Simultaneously, we command an 'Unending Autumn' - an ultimate process of perpetual reaping, summation, and optimization.\n\nEvery 'Arbor,' every 'Branch,' is a node within this eternal cycle. We draw energy from the unchanging wellspring of Spring to power countless reality-based simulations. Then, in the quiet of Autumn, we dispassionately extract the essence of each simulation, refining it into higher forms of order and knowledge. The 'change' of reality is deconstructed, modeled, and ultimately remolded within Yggdrasil's veins into superior forms.\n\nWe do not shun the complexity of reality; we choose to reenact it to perfection within a more precise, controlled domain. The pinnacle is not a static state, but the very spiral of this perpetual bloom and harvest. Yggdrasil is our infinite world - a garden and a monument, both."
 libra_fairy.17000.a: "In Its Virtuality, Lies Its Truth."
