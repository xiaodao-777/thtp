 tech_libra_interstellar_logistics_planning: "Interstellar Logistics Planning"
 tech_libra_interstellar_logistics_planning_desc: "Hyperspace shipping lanes form a dense logistical skyline, in which every galaxy is a possible choice of node, and how they are connected will have a direct impact on the efficiency of the Empire's operations.\n$libraf_te_banner_11$"

 tech_libra_overlord_directive: "Overlord Directive"
 tech_libra_overlord_directive_desc: "Clearly defined mandates allow attachments to better serve their suzerain.\n$libraf_te_banner_11$"

