 decision_libra_hive_survival_competition: "Survival Competition"
 decision_libra_hive_survival_competition_desc: "Even as a single entity, not all sub-units hold equal value to the hive. Through competition, weaker individuals become nourishment for the stronger, allowing the collective consciousness to develop more effectively."
 decision_libra_hive_survival_competition_effect: "Culls §R20%§! of £pop£ §Y$POP$§!\nEach culled £pop£ §Y$POP$§! yields  £physics£§G2§! £society£§G2§! £engineering£§G2§! £unity£§G1§! £trade£§G3§!\nFor every $pop_group_unit$ £pop£ §Y$POP$§! lost, gain the following for §Y3600§! days:\n$t$$MOD_PLANET_AMENITIES_NO_HAPPINESS_MULT$: §G+1%§! (Max: §G+25%§!)\n$t$$mod_planet_jobs_produces_mult$: §G+2%§! (Max: §G+50%§!)\n$t$$mod_planet_jobs_simple_drone_produces_mult$: §G+2%§! (Max: §G+50%§!)"
