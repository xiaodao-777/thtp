 concept_libra_qualified_ascension_desc: "Ascension Perks from which up to §Y2§! may be chosen, §Ywith a weakened effect when used in conjunction with a Crisis AP§!, including:\n$t$- ['ascension_perk:ap_libra_golden_rule']\n$t$- ['ascension_perk:ap_libra_valiant_heroic']\n$t$- ['ascension_perk:ap_libra_genetic_potential']\n$t$- ['ascension_perk:ap_libra_warrant_of_return']\n$t$- ['ascension_perk:ap_libra_synthetic_voice']\n$t$- ['ascension_perk:ap_libra_intergalactic_junkie']\n$t$- ['ascension_perk:ap_libra_astral_blade']\n$t$- ['ascension_perk:ap_libra_ghost_mechanist']"

 concept_libra_executive_ascension: "Executive AP"
 concept_libra_executive_ascension_desc: "Can reduce £empire_sprawl£ §Y$EMPIRE_SIZE$§! or £mod_empire_size_penalty_mult£ §Y$MOD_EMPIRE_SIZE_PENALTY_MULT$§!, you can only choose one of them, including:\n$t$- ['ascension_perk:ap_libra_transcendent_covenant']\n$t$- ['ascension_perk:ap_libra_galaxy_ambition']\n$t$- ['ascension_perk:ap_libra_shift_in_focus']\n$t$- ['ascension_perk:ap_libra_third_choice']\n$t$- ['ascension_perk:ap_libra_ultimate_directive']\n$t$- ['ascension_perk:ap_libra_gestalt_era']\n$t$- ['ascension_perk:ap_libra_sages_notes']\n$t$- ['ascension_perk:ap_libra_collective_unity']\n$t$- ['ascension_perk:ap_libra_cardinal_cosmos']\n$t$- ['ascension_perk:ap_libra_kings_game']"

 concept_libra_advanced_ascension: "Advanced AP"
 concept_libra_advanced_ascension_desc: "You can only choose one of them, including:\n$t$- ['tradition_category:tradition_cloning']: ['ascension_perk:ap_libra_directive_76']\n$t$- ['tradition_category:tradition_purity']: ['ascension_perk:ap_libra_ode_to_babel']\n$t$- ['tradition_category:tradition_mutation']: ['ascension_perk:ap_libra_evolutionary_endpoint']$t$['ascension_perk:ap_libra_cutefied_world']\n$t$- ['tradition_category:tradition_cybernetics']: ['ascension_perk:ap_libra_transcendental_cybernetics']\n$t$- ['tradition_category:tradition_synthetics']: ['ascension_perk:ap_libra_cosmological_constant']\n$t$- ['tradition_category:tradition_modularity']: ['ascension_perk:ap_libra_atomic_heart']\n$t$- ['tradition_category:tradition_nanotech']: ['ascension_perk:ap_libra_nanocore']$t$['ascension_perk:ap_libra_hurricane_eye']\n$t$- ['tradition_category:tradition_virtuality']: ['ascension_perk:ap_libra_yggdrasil']\n$t$- ['tradition_category:tradition_psionics_shroud']: ['ascension_perk:ap_libra_heavenly_throne']$t$['ascension_perk:ap_libra_liber_genesis']\nAfter enabling §Y$concept_libra_advanced_ascension$§!, you may still select §YCrisis Ascension§!, but this will deactivate §Y$concept_libra_advanced_ascension$§!.\n\n§YWhen playing the Ascension expansion content, please refrain from using mods that alter the Ascension paths, as this may cause conflicts.§!"

 concept_libra_expand_technology: "Expand Technology Options"
 concept_libra_expand_technology_desc: "Expanded technology tree based on ascension paths. The first technology in each path is:\n$t$- ['tradition_category:tradition_cloning']: £society£ ['technology:tech_libra_genetics_demystified'] £physics£ ['technology:tech_libra_cloning_method']\n$t$- ['tradition_category:tradition_purity']: £society£ ['technology:tech_libra_genetics_demystified'] £engineering£ ['technology:tech_libra_purity_sanctuary']\n$t$- ['tradition_category:tradition_mutation']: £society£ ['technology:tech_libra_genetics_demystified'] £society£ ['technology:tech_libra_mutation_encoding']\n$t$- ['tradition_category:tradition_cybernetics']: £society£ ['technology:tech_libra_centralised_cybernetics'] £engineering£ ['technology:tech_libra_cybernetic_growth_1']\n$t$- ['tradition_category:tradition_synthetics']: £physics£ ['technology:tech_libra_synthetic_commands'] £engineering£ ['technology:tech_libra_synthetic_leaders']\n$t$- ['tradition_category:tradition_modularity']: £society£ ['technology:tech_libra_modular_society']\n$t$- ['tradition_category:tradition_nanotech']: £engineering£ ['technology:tech_libra_nanite_shipyard'] £engineering£ ['technology:tech_libra_nanite_locusts']\n$t$- ['tradition_category:tradition_virtuality']: £physics£ ['technology:tech_libra_reality_deconstruction']\n$t$- ['tradition_category:tradition_psionics_shroud']: £society£ ['technology:tech_libra_psionic_apocalypse']\n\nNote:\n$t$- Constructing more than §Y24§! £building£ §Y$building_fe_clinic_1$§! or £building£ §Y$building_fe_assembly_1$§! will cause certain technologies to become §Rdisabled§!.\n$t$- §YWhen playing the Ascension expansion content, please refrain from using mods that alter the Ascension paths, as this may cause conflicts.§!"

