 tech_libra_gestalt_maintenance_1: "Planetary Maintenance"
 tech_libra_gestalt_maintenance_1_desc: "Deploy self-service facilities centered around the capital building, allowing sub-unit cabinets to independently address related needs.\n$libraf_te_banner_11$"
 edict_libra_gestalt_maintenance: "Enhanced Maintenance"
 edict_libra_gestalt_maintenance_desc: "Planets under Gestalt rule must remain spotless, increasing maintenance operations."
 tech_libra_gestalt_maintenance_2: "Outpost Supply"
 tech_libra_gestalt_maintenance_2_desc: "Expand maintenance nodes and establish additional supply stations to improve colonial cleanliness.\n$libraf_te_banner_11$"
 tech_libra_gestalt_maintenance_3: "Colonial Logistics"
 tech_libra_gestalt_maintenance_3_desc: "Systematic maintenance arrangements allow the Gestalt Empire to sustain the daily activities of more sub-units with fewer maintenance sub-unit populations.\n$libraf_te_banner_11$"
 policy_libra_gestalt_colony_maintenance: "Maintenance Policy"
 policy_libra_gestalt_colony_maintenance_desc: "Determines how the collective will utilizes maintenance operations.\n "
 policy_libra_gestalt_colony_maintenance_a: "Research Assistant"
 policy_libra_gestalt_colony_maintenance_a_desc: "Data collected from maintenance operations is utilized for scientific research to advance the empire.\n "
 policy_libra_gestalt_colony_maintenance_a_swap: "$policy_libra_gestalt_colony_maintenance_a$"
 policy_libra_gestalt_colony_maintenance_a_swap_desc: "$policy_libra_gestalt_colony_maintenance_a_desc$\n "
 policy_libra_gestalt_colony_maintenance_b: "Signal Relay"
 policy_libra_gestalt_colony_maintenance_b_desc: "Simple instructions can be relayed by maintenance sub-units without consuming administrative resources.\n "
 policy_libra_gestalt_colony_maintenance_b_swap: "$policy_libra_gestalt_colony_maintenance_b$"
 policy_libra_gestalt_colony_maintenance_b_swap_desc: "$policy_libra_gestalt_colony_maintenance_b_desc$\n "
 policy_libra_gestalt_colony_maintenance_c: "Logistical Support"
 policy_libra_gestalt_colony_maintenance_c_desc: "Assign idle individuals to participate in logistical work.\n "
 policy_libra_gestalt_colony_maintenance_c_swap: "$policy_libra_gestalt_colony_maintenance_c$"
 policy_libra_gestalt_colony_maintenance_c_swap_desc: "$policy_libra_gestalt_colony_maintenance_c_desc$\n "
 policy_libra_gestalt_colony_maintenance_d: "Self-Tuning"
 policy_libra_gestalt_colony_maintenance_d_desc: "Adjust sub-unit maintenance standards and permit self-maintenance to reduce overall maintenance pressure.\n "
 policy_libra_gestalt_colony_maintenance_e: "High-Speed Delivery"
 policy_libra_gestalt_colony_maintenance_e_desc: "Only unobstructed logistics can ensure the smooth operation of maintenance work.\n "
 tech_libra_gestalt_maintenance_4: "Cross-Star System Delivery"
 tech_libra_gestalt_maintenance_4_desc: "A highly developed management system allows the Gestalt Empire to coordinate operations across multiple star systems.\n$libraf_te_banner_11$"

 tech_libra_gestalt_research_1: "Mind Expansion"
 tech_libra_gestalt_research_1_desc: "A Gestalt Empire must look further into the future, not just at the stars beneath its feet.\n$libraf_te_banner_12$"
 tech_libra_gestalt_research_2: "Mental Concentration"
 tech_libra_gestalt_research_2_desc: "Our research units can achieve higher efficiency - so long as no drones break free from central control.\n$libraf_te_banner_12$"
 edict_libra_gestalt_research: "Integrated Attention"
 edict_libra_gestalt_research_desc: "Scrutinize every set of research feedback returned to the core to ensure no possibility is overlooked."
 tech_libra_gestalt_research_3: "Unconventional Algorithms"
 tech_libra_gestalt_research_3_desc: "Amidst unchanging research lies unique possibilities - ones conventional methods struggle to reveal. The Gestalt Empire must occasionally break from the norm.\n$libraf_te_banner_12$"
 TECH_UNLOCK_LIBRA_GLPSR_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$ - $logistics_policy_libra_gestalt_4$"
 TECH_UNLOCK_LIBRA_GLPSR_DESC: "§H$logistics_policy_libra_gestalt_4$§!\nConverts a portion of £trade£ §Y$trade$§! into £physics£ £society£ £engineering£ §YResearch Points§!."
 tech_libra_analyze_node_optimisation: "Analysis Node Optimization"
 tech_libra_analyze_node_optimisation_desc: "Reorganize the analysis-statistical network with $councilor_gestalt_cognitives$ as the core and star systems as units.\n$libraf_te_banner_11$"
 edict_libra_gestalt_analyze_optimisation: "Neural Network Interlinking"
 edict_libra_gestalt_analyze_optimisation_desc: "Linking all analysis units of the Gestalt to perform research tasks together can greatly reduce resource waste caused by redundant computations."

 tech_libra_gestalt_trade_1: "High-Speed Sorting"
 tech_libra_gestalt_trade_1_desc: "Optimized sorting processes reduce time wastage.\n$libraf_te_banner_10$"
 tech_libra_gestalt_trade_2: "Centralized Distribution"
 tech_libra_gestalt_trade_2_desc: "Establish composite processing sites to integrate scattered logistical capabilities.\n$libraf_te_banner_10$"
 tech_libra_gestalt_trade_3: "Node-Based Logistics"
 tech_libra_gestalt_trade_3_desc: "Arrange a broader interstellar logistics network centered on hierarchically distributed nodes.\n$libraf_te_banner_10$"
 building_libra_gestalt_logistics_dome: "Logistics Dome"
 building_libra_gestalt_logistics_dome_desc: "This massive structure can accommodate thousands of drones working simultaneously, dispatching supplies across the empire."
 tech_libra_logistics_node_optimisation: "Logistics Node Optimisation"
 tech_libra_logistics_node_optimisation_desc: "The Gestalt Consciousness will reprogramme its own support network to provide efficient material support to sub-individuals.\n$libraf_te_banner_11$"

 tech_libra_gestalt_power_hub: "Unified Energy"
 tech_libra_gestalt_power_hub_desc: "Through centralized energy distribution, the collective consciousness can precisely transmit power to every sub-unit in need, completely eliminating energy waste.\n$libraf_te_banner_10$"
 building_libra_gestalt_energy_nub: "Singularity Energy Hub"
 building_libra_gestalt_energy_nub_desc: "This facility generates near-limitless energy through a microscopic singularity and instantaneously distributes it to every corner of the empire via a quantum entanglement network"
 TECH_UNLOCK_LIBRA_GLPSE_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$ - $logistics_policy_libra_gestalt_1$"
 TECH_UNLOCK_LIBRA_GLPSE_DESC: "§H$logistics_policy_libra_gestalt_1$§!\nConverts a portion of £trade£ §Y$trade$§! into £energy£ §Y$energy$§!."
 tech_libra_gestalt_food_processing: "Mass-Produced Food"
 tech_libra_gestalt_food_processing_desc: "Through molecular recombination technology, the collective consciousness can convert any organic matter into nutritional paste, perfectly meeting the metabolic needs of all drones.\n$libraf_te_banner_11$"
 building_libra_gestalt_food_nub: "Nutrient Replication Center"
 building_libra_gestalt_food_nub_desc: "Utilizing matter replication technology, these facilities synthesize perfect nutritional combinations from basic atoms, ensuring optimal nourishment for all drones."
 TECH_UNLOCK_LIBRA_GLPSF_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$ - $logistics_policy_libra_gestalt_2$"
 TECH_UNLOCK_LIBRA_GLPSF_DESC: "§H$logistics_policy_libra_gestalt_2$§!\nConverts a portion of £trade£ §Y$trade$§! into £food£ §Y$food$§!."
 tech_libra_gestalt_mineral_purification: "Coordinated Extraction"
 tech_libra_gestalt_mineral_purification_desc: "Tens of thousands of drones operate in unison like a single entity, mining and refining mineral resources with maximum efficiency while completely avoiding losses typical of traditional mining.\n$libraf_te_banner_12$"
 building_libra_gestalt_mineral_nub: "Quantum Drilling Core"
 building_libra_gestalt_mineral_nub_desc: "Through quantum tunneling effects, these drills extract minerals directly from planetary cores while producing metals of unprecedented purity via molecular-level refinement."
 TECH_UNLOCK_LIBRA_GLPSM_TITLE: "§H$libra_unlock_policies$§!$policy_logistics_policy$ - $logistics_policy_libra_gestalt_3$"
 TECH_UNLOCK_LIBRA_GLPSM_DESC: "§H$logistics_policy_libra_gestalt_3$§!\nConverts a portion of £trade£ §Y$trade$§! into £minerals£ §Y$minerals$§!."
 tech_libra_gestalt_combat_training: "Legion Directive"
 tech_libra_gestalt_combat_training_desc: "By directly downloading combat data through neural interfaces, every warrior drone instantly masters various combat skills, forming perfectly synchronized legions.\n$libraf_te_banner_11$"
 building_libra_gestalt_army_nub: "Combat Command Node"
 building_libra_gestalt_army_nub_desc: "These nodes connect all combat units in real-time via FTL communication, enabling the collective consciousness to coordinate military operations across the empire at light speed, achieving unparalleled tactical synergy."

 logistics_policy_libra_gestalt_1: "Generator Support"
 logistics_policy_libra_gestalt_1_desc: "Operating power facilities is simple yet hazardous work. Deploying logistical units to assist technician drones can effectively reduce related losses and maximize additional output.\n\nConverts §Y40%§! of £trade£ §Y$trade$§! income into §Y100%§! £energy£ §Y$energy$§!."
 logistics_policy_libra_gestalt_2: "Agricultural Support"
 logistics_policy_libra_gestalt_2_desc: "The collective's agricultural output cannot rely solely on drones cultivating crops in fields or synthesizing nutrients in facilities. Allocating part of logistical capacity to organic production yields additional supplies.\n\nConverts §Y40%§! of £trade£ §Y$trade$§! income into §Y100%§! £food£ §Y$food$§!."
 logistics_policy_libra_gestalt_3: "Extraction Support"
 logistics_policy_libra_gestalt_3_desc: "Our logistical units collect mineral resources from all possible sources, including but not limited to asteroid debris, refining residues, and discarded construction materials. All collected materials are reprocessed and reused.\n\nConverts §Y40%§! of £trade£ §Y$trade$§! income into §Y80%§! £minerals£ §Y$minerals$§!."
 logistics_policy_libra_gestalt_4: "Cognitive Support"
 logistics_policy_libra_gestalt_4_desc: "Formless consciousness entities form a vital part of the collective. Linking a segment of the logistical network to the consciousness network allows the Gestalt Empire to see further.\n\nConverts §Y40%§! of £trade£ §Y$trade$§! income into §Y12%§! £physics£ £society£ £engineering£ §YResearch Points§!."
 logistics_policy_libra_gestalt_5: "Regulatory Support"
 logistics_policy_libra_gestalt_5_desc: "通过优化子个体间的协调效率，减少内部摩擦损耗，从而增强集体意识的统一性。\n\nConverts §Y40%§! of £trade£ §Y$trade$§! income into §Y50%§! £unity£ §Y$unity$§!."
 logistics_policy_libra_gestalt_6: "Nursing Support"
 logistics_policy_libra_gestalt_6_desc: "分配部分后勤资源用于子个体的维护与修复，延长其服务寿命并保持最佳工作状态。\n\nConverts §Y40%§! of £trade£ §Y$trade$§! income into §Y50%§! £consumer_goods£ §Y$consumer_goods$§!."

