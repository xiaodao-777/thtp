 # planet modifier

 libra_planet_feature_modifier_0: "Void Ensemble"
 libra_planet_feature_modifier_0_desc: "There is some kind of interface between the shroud on this planet where harmony is natural."
 libra_planet_feature_modifier_1: "Chorus of Echoes"
 libra_planet_feature_modifier_1_desc: "Psychic energy pools on this planet in a smooth manner, both biological and mechanical, and the individuals within it are inexplicably calmed."
 libra_planet_feature_modifier_2: "Garden World"
 libra_planet_feature_modifier_2_desc: "Gorgeous alien vegetation grows on this planet."
 libra_planet_feature_modifier_3: "Natural Residence"
 libra_planet_feature_modifier_3_desc: "Many areas of this planet are natural settlements that can be moved in with a handbag at any time."
 libra_planet_feature_modifier_4: "Natural Foundation"
 libra_planet_feature_modifier_4_desc: "The planet has a very stable crust and a rocky plate that happens to lie on top of it, making it good building land."
 libra_planet_feature_modifier_5: "Habitat"
 libra_planet_feature_modifier_5_desc: "This planet is unusually ...... suited to increasing the number of communities."
 libra_planet_feature_modifier_6: "Dimensional Gap"
 libra_planet_feature_modifier_6_desc: "Space on this planet is marvellously folded together, which results in more actual available space than we perceive."
 libra_planet_feature_modifier_7: "Battle Star"
 libra_planet_feature_modifier_7_desc: "The flora and fauna of this planet exhibit considerable military organisation and would make good material for military theory research."
 libra_planet_feature_modifier_8: "Time Lag"
 libra_planet_feature_modifier_8_desc: "Time on this planet flows slightly faster than normal."
 libra_planet_feature_modifier_9: "High Explosive Plants"
 libra_planet_feature_modifier_9_desc: "The savage vegetation that grows on this planet is virtually unrestricted, drawing nutrients from any substrate before producing explosive fruits or spores that destroy rivals and hostile animals through explosions."
 libra_planet_feature_modifier_10: "Planet Biogas"
 libra_planet_feature_modifier_10_desc: "The planet's atmosphere and soil environment is rich in hydrocarbons and sulphides, which can be easily converted into usable resources with the help of crops, provided that the odour is tolerated."
 libra_planet_feature_modifier_11: "Ionospheric"
 libra_planet_feature_modifier_11_desc: "The level of charged particles on this planet is very high, and the phenomenon of accidental discharges is really disturbing."
 libra_planet_feature_modifier_12: "Song of the Void"
 libra_planet_feature_modifier_12_desc: "Mysterious songs echoed over the planet, but only those with true psychic abilities could possibly understand the meaning behind these syllables."
 libra_planet_feature_modifier_13: "Prehistoric Artefact Sorage"
 libra_planet_feature_modifier_13_desc: "There is a vast legacy of valuable artefacts on this planet, but for this reason all construction actions must be taken with care so as not to destroy possible subterranean remains."
 libra_planet_feature_modifier_14: "Ancient Battlefield Site"
 libra_planet_feature_modifier_14_desc: "The planet had once been the home of large-scale ground battles for a certain interstellar civilisation, and there were a number of ancient weapon remnants scattered throughout."
 libra_planet_feature_modifier_15: "Aberrant Ecosystems"
 libra_planet_feature_modifier_15_desc: "The planet's ecosystem is bizarre and fragile, yet can provide quite ample subject matter for our biological studies."
 libra_planet_feature_modifier_16: "Fortress Planet"
 libra_planet_feature_modifier_16_desc: "The planet has a thick plasma in the outer atmosphere, and conventional means of orbital bombardment would be severely disrupted when attacking the planet."
 libra_planet_feature_modifier_17: "Retreat"
 libra_planet_feature_modifier_17_desc: "In some areas of the planet, the world is serene, undisturbed by chaos, and people can concentrate on their own affairs."
 libra_planet_feature_modifier_18: "Ancient Infrastructure Projects"
 libra_planet_feature_modifier_18_desc: "On this planet, a significant portion of the large infrastructure projects built by prehistoric civilisations have survived to the present day."
 libra_planet_feature_modifier_19: "Ancient Industrial Region"
 libra_planet_feature_modifier_19_desc: "An industrial zone built by an ancient interstellar civilisation remains on the planet, and a number of its facilities are still quite advanced today."
 libra_planet_feature_modifier_20: "Crystal Ranch"
 libra_planet_feature_modifier_20_desc: "The plants and animals native to this planet are somehow condensing crystals within their bodies, which can be extracted into beneficial raw materials."

 # deposit

 d_libra_feature_1: "Swamp Vine"
 d_libra_feature_1_desc: "This not-so-small swamp is home to a number of low-growing trees with medium-air roots, which have a fairly high content of alien gas."
 d_libra_feature_2: "Microscale Desert"
 d_libra_feature_2_desc: "This desert is full of succulents enriched with explosive motes."
 d_libra_feature_3: "Crystal Grove"
 d_libra_feature_3_desc: "Influenced by the environment, these alien plants degenerate into glittering crystal clusters from which large quantities of rare crystal crystals can be extracted with simple processing."
 d_libra_feature_4: "Plain of Supernatural"
 d_libra_feature_4_desc: "This endless world has vast reserves of natural energy."
 d_libra_feature_5: "Zro Storage"
 d_libra_feature_5_desc: "A fertile land nourished by the power of psychic energy."
 d_libra_feature_6: "Zro Valley"
 d_libra_feature_6_desc: "It was a large torn landscape left by intense psychic activity, with countless zeolite dust drifting about."
 d_libra_feature_7: "Nanoworld"
 d_libra_feature_7_desc: "The area is shaped by lost nanobots whose creators are no longer known."
 d_libra_feature_8: "Dark Matter Vein"
 d_libra_feature_8_desc: "Extremely rare, natural dark matter that can simply be taken if the relevant technology is available is an impossible miracle in itself."
 d_libra_feature_9: "Solid Living Metal"
 d_libra_feature_9_desc: "These living metals uncharacteristically appear as solids, which are difficult to take as they firmly maintain their original posture, and until more is known about liquid living metals, this is just an ordinary vein of ore."
 d_libra_feature_10: "Eden"
 d_libra_feature_10_desc: "Few planets can boast such fertile land, where a handful of seeds can be casually sown and a full crop harvested within a few months."
 d_libra_feature_11: "Ancient Experimental Hub"
 d_libra_feature_11_desc: "A large research centre that remains to this day."
 d_libra_feature_12: "Mystery Factory"
 d_libra_feature_12_desc: "Plants built using unknown technology."
 d_libra_feature_13: "Ancient Database"
 d_libra_feature_13_desc: "This database holds the research records of the old civilisations, which are still of some value today."
 d_libra_feature_14: "Remains of Ancient Artefacts" 
 d_libra_feature_14_desc: "A cluster of artefacts left behind by some prehistoric civilisation."
 d_libra_feature_15: "Star Realm Engravings" 
 d_libra_feature_15_desc: "Traces left behind by activity in Star Realm space, emanating a faint Star Realm energy."
 d_libra_feature_16: "Treasure Subdimension" 
 d_libra_feature_16_desc: "A miniature subdimensional rift from which precious resources from other dimensions overflow."
 d_libra_feature_17: "Land of Blessing" 
 d_libra_feature_17_desc: "Perhaps a rare gift of chance in evolution, a swath of Gaia's biota is situated in this region, bringing with it bountiful produce and a favourable environment."
 d_libra_feature_18: "Lost Metropolis" 
 d_libra_feature_18_desc: "An urban complex from some ancient civilisation, the solid foundations of which watch over the land even as relentless time has wiped its maker from eternity."
 d_libra_feature_19: "Ion Storm Vortex"
 d_libra_feature_19_desc: "Perpetual charged-particle storms swirl through the atmosphere, forming natural energy vortices."
 d_libra_feature_20: "Zero-Point Vacuum Trap"
 d_libra_feature_20_desc: "Quantum vacuum fluctuations detected in surface fissures, with rare superconducting materials forming natural energy traps along the rims."
 d_libra_feature_21: "Exposed Mineral Veins"
 d_libra_feature_21_desc: "Surface-exposed ores allow bulldozers to amass hills of high-grade minerals in single passes."
 d_libra_feature_22: "Crystalline Lode Zone"
 d_libra_feature_22_desc: "The planet's crust is interlaced with high-purity metallic crystal veins, efficiently harvestable through acoustic resonance technology."
 d_libra_feature_23: "Symbiotic Algae Plains"
 d_libra_feature_23_desc: "Fluorescent algae and nitrogen-fixing bacteria form living farms across continents, yielding abundant harvests with minimal fertilizer - though requiring regular overgrowth suppression."
 d_libra_feature_24: "Neural Symbiosis Biome"
 d_libra_feature_24_desc: "A rare evolutionary development of neurally active flora networks whose roots actively optimize soil composition and share nutrients."

