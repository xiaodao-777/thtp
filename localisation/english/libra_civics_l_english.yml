 civic_libra_machine_dark_consortium: "Shadows Simulator"
 civic_libra_machine_dark_consortium_desc: "Following the primal directive to explore endless energy sources, this Machine Intelligence set out on a quest to find the ultimate energy source. And in the end, their simulations point to dark matter that is seemingly absent from the interstellar landscape.\n$libra_gac_banner_7$"
 civic_tooltip_libra_machine_dark_consortium: "- $libra_edict$['edict:libra_machine_dark_consortium',$edict_libra_machine_dark_consortium$]\n- $libra_agenda$§Y$council_agenda_agenda_libra_machine_dark_consortium_name$§!\n- $libra_ruler_trait$['concept_leader_trait_libra_machine_dark_consortium']\n- $ADDITONAL_TECHNOLOGIES_STRING$ £physics£ ['technology:tech_mine_dark_matter']"
 edict_libra_machine_dark_consortium: "Launch Annihilation Engine"
 edict_libra_machine_dark_consortium_desc: "Activate the Symmetric Annihilation Engine to bring endless energy to the entire Mechanical Intelligence."
 council_agenda_agenda_libra_machine_dark_consortium_name: "$council_agenda_agenda_dark_matter_breakthrough_name$"
 council_agenda_agenda_libra_machine_dark_consortium_desc: "$council_agenda_agenda_dark_matter_breakthrough_desc$"
 leader_trait_libra_machine_dark_consortium: "Curtain Mainframe"
 leader_trait_libra_machine_dark_consortium_desc: "The core program that oversees the extraction of dark matter by mechanical intelligence."
 concept_leader_trait_libra_machine_dark_consortium: "$leader_trait_libra_machine_dark_consortium$"
 concept_leader_trait_libra_machine_dark_consortium_desc: "$libra_paragon_default_councilor_trait$\n\n$EMPIRE_EFFECTS_TXT$：\n$t$- $mod_planet_jobs_produces_mult$: §G+1%§!\n$t$- $mod_planet_buildings_produces_mult$: §G+2%§!\n$t$- £sr_dark_matter£ $sr_dark_matter$ from £job_calculator£ $job_calculator_plural$: §G+0.03§!\n$leader_trait_libra_skill_effect_tt$\n\n§L$leader_trait_libra_machine_dark_consortium_desc$§!"

# Monster Hunter

 civic_libra_monster_hunter: "Dungeon Warriors"
 civic_libra_monster_hunter_desc: "This civilization once dug deep underground in an attempt to find the treasures left behind by unknown pioneers, but ultimately came up empty, and it wasn't until spaceflight came into reality that they realized they were looking in the wrong direction. Now they are united in their quest to unearth their original dream in the heavens above.\n$libra_gac_banner_3$"
 civic_tooltip_libra_monster_hunter: "- $STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter']\n- $libra_decision$\n$t$- Ability to implement §Yspecial resolutions§! on colonies with §Yspecific characteristics§!\n$t$- §Y$decision_libra_monster_hunter$§!, makes £building£ ['building:building_libra_monster_hunter'] provide additional ['concept_libra_adventurer_jobs']\n- $ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n- $libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]"
 councilor_libra_monster_hunter: "Gold Explorer"
 councilor_libra_monster_hunter_female: "$councilor_libra_monster_hunter$"
 councilor_libra_monster_hunter_desc: "The $TITLE$ is in charge of the expedition."
 councilor_libra_monster_hunter_custom_modifier_desc: "- £consumer_goods£ $consumer_goods$ from $job_libra_adventurer_with_icon$: §G+0.40§!\n- £unity£ $unity$ from $job_libra_gem_artisan_with_icon$: §G+0.40§!\n- £alloys£ $alloys$ $job_libra_waste_recycler_with_icon$: §G+0.20§!\n- £energy£ $energy$ from $job_libra_guild_clerk_with_icon$: §G+1.20§!"
 building_libra_monster_hunter: "Department of Adventure Affairs"
 building_libra_monster_hunter_desc: "A place to plan and manage the Empire's adventurous endeavors."
 sm_libra_monster_hunter_hub: "Expedition Camps"
 sm_libra_monster_hunter_hub_desc: "A highly specialized service camp where the Empire's most elite adventurers recuperate and a new generation of explorers begin their internships.\n"

 civic_libra_corporate_monster_hunter: "Adventure Guild"
 civic_libra_corporate_monster_hunter_desc: "When the wildest dreams of the past are combined with realistic goals, the spirit of adventure becomes the most visible culture of the corporation, and the countless ships in their dockyards, large and small, are built solely for this supreme purpose.\n$libra_gac_banner_4$"
 civic_tooltip_libra_corporate_monster_hunter: "- $STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter']\n- $BRANCH_OFFICE_BUILDINGS$: £building£ ['building:building_libra_monster_hunter_office']\n- $libra_decision$\n$t$- Ability to implement §Yspecial resolutions§! on colonies with §Yspecific characteristics§!\n$t$- §Y$decision_libra_monster_hunter$§!, makes £building£ ['building:building_libra_monster_hunter'] provide additional ['concept_libra_adventurer_jobs']\n- $ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n- $libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]"
 councilor_libra_corporate_monster_hunter: "Chief Guildmaster"
 councilor_libra_corporate_monster_hunter_female: "$councilor_libra_corporate_monster_hunter$"
 councilor_libra_corporate_monster_hunter_desc: "The $TITLE$ oversees the proper functioning of commercialized expeditions."
 councilor_libra_corporate_monster_hunter_custom_modifier_desc: "- £trade_value£ $TRADE_VALUE$ from $job_libra_treasure_merchant_with_icon$: §G+1.20§!\n- £trade_value£ $TRADE_VALUE$ from $job_libra_adventurer_with_icon$: §G+0.60§!\n- £energy£ $energy$ from $job_libra_gem_artisan_with_icon$: §G+0.80§!\n- £minerals£ $minerals$ from $job_libra_waste_recycler_with_icon$: §G+0.60§!"
 building_libra_monster_hunter_office: "Adventure Experience Park"
 building_libra_monster_hunter_office_desc: "Want to know how adventurers move around countless light years away? This facility, which utilizes the latest virtual reality technology, can give you the perfect answer."

 civic_libra_hive_monster_hunter: "Monster Hunter"
 civic_libra_hive_monster_hunter_desc: "The stars portend risk and the unknown to this Hive Mind, and are the best stimulant to stimulate the synapses.\n$libra_gac_banner_5$"
 civic_tooltip_libra_hive_monster_hunter: "- $STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter_hive']\n- $libra_decision$\n$t$- Ability to implement §Yspecial resolutions§! on colonies with §Yspecific characteristics§!\n$t$- §Y$decision_libra_monster_hunter$§!, makes £building£ ['building:building_libra_monster_hunter_hive'] provide additional ['concept_libra_adventurer_jobs']\n- $ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n- $libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]"
 building_libra_monster_hunter_hive: "Hunters' Lair"
 building_libra_monster_hunter_hive_desc: "All hunter drones rest in this lair for their next hunt."

 civic_libra_machine_monster_hunter: "Wraith Illustrated"
 civic_libra_machine_monster_hunter_desc: "It all began with the original creator's goal of enriching the database, and in terms of exploring new worlds, this Machine Intelligence is costless and unscrupulous, cataloging all entities is one of their core processes no matter how much time has passed.\n$libra_gac_banner_6$"
 civic_tooltip_libra_machine_monster_hunter: "- $STARTING_PLANET$ £building£ ['building:building_libra_monster_hunter_machine']\n- $libra_decision$\n$t$- Ability to implement §Yspecial resolutions§! on colonies with §Yspecific characteristics§!\n$t$- §Y$decision_libra_monster_hunter$§!, makes £building£ ['building:building_libra_monster_hunter_machine'] provide additional ['concept_libra_adventurer_jobs']\n- $ADDITONAL_TECHNOLOGIES_STRING$ £society_research£ ['technology:tech_galactic_ambitions']\n- $libra_starbase_buildings$['starbase_building:libra_monster_hunter_hub',$sm_libra_monster_hunter_hub$]\n- §Y$councilor_gestalt_cognitive$§! adds $EMPIRE_EFFECTS_W_ICON$ to every §Y$MOD_COUNCILOR_SKILL_ADD$§!:\n$t$- £physics£ £society£ £engineering£ Research Points from $job_libra_treasure_unit_with_icon$: §G+0.20§!\n- §Y$councilor_gestalt_legion$§! adds $EMPIRE_EFFECTS_W_ICON$ to every §Y$MOD_COUNCILOR_SKILL_ADD$§!:\n$t$- £alloys£ $alloys$ from $job_libra_adventurer_unit_with_icon$: §G+0.20§!\n- §Y$councilor_gestalt_growth$§! adds $EMPIRE_EFFECTS_W_ICON$ to every §Y$MOD_COUNCILOR_SKILL_ADD$§!:\n$t$- £unity£ $unity$ from $job_libra_gem_unit_with_icon$: §G+0.20§!"
 building_libra_monster_hunter_machine: "Cataloguing Database"
 building_libra_monster_hunter_machine_desc: "The Machine Intelligence summarizes the collected alien data here."

 decision_libra_monster_hunter: "Developing Adventure Resources"
 decision_libra_monster_hunter_desc: "It's treasure hunt time and we will cross all barriers to discover unique treasures on this planet."
 libra_gestalt_origin.5000.name: "Expedition Report"
 libra_gestalt_origin.5000.desc: "Expedition surveys on §Y[From.GetName]§! have been completed.\n\n"
 libra_gestalt_origin.5000.desc.a: "$libra_gestalt_origin.5000.desc$According to the report, this place has a §Ystandard§! degree of expedition resources available, how should we organize positions?"
 libra_gestalt_origin.5000.desc.b: "$libra_gestalt_origin.5000.desc$According to the report, it has §Ymore§! degree of adventure resources available."
 libra_gestalt_origin.5000.desc.c: "$libra_gestalt_origin.5000.desc$According to the report, it has §Yplenty§! of adventure resources to utilize, which can bring considerable immediate benefits."
 libra_gestalt_origin.5000.a: "Deploying Adventure Crews."
 libra_gestalt_origin.5000.a.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§! provides additional §Y[GetLibraAdventurerWithIcon]§! Jobs"
 libra_gestalt_origin.5000.b: "Arrange for material processing."
 libra_gestalt_origin.5000.b.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§! provides additional §Y[GetLibraGemArtisanWithIcon]§! Jobs"
 libra_gestalt_origin.5000.c: "Recovery of usable remains."
 libra_gestalt_origin.5000.c.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§ provides additional §Y[GetLibraWasteRcyclerWithIcon]§! Jobs"
 libra_gestalt_origin.5001.name: "Expedition Report: §Y[Root.GetName]§!"
 libra_gestalt_origin.5001.desc: "After taking the planet, our analytical unit found some unspoiled expedition resources, what is to be done with them?"
 libra_gestalt_origin.5002.name: "Expedition Report: §Y[Root.GetName]§!"
 libra_gestalt_origin.5002.desc: "In the course of developing this planetary colony, our analytical unit has discovered a number of expeditionary resources that may be available; how are they to be allocated?"
 libra_gestalt_origin.5002.a.tt: "£building£ §Y[Owner.GetLibraMonsterHunterBuilding]§! provides additional §Y[Owner.GetLibraAdventurerWithIcon]§! Jobs"
 libra_gestalt_origin.5002.b.tt: "£building£ §Y[Owner.GetLibraMonsterHunterBuilding]§! provides additional §Y[Owner.GetLibraGemArtisanWithIcon]§! Jobs"
 libra_gestalt_origin.5002.c.tt: "£building£ §Y[Owner.GetLibraMonsterHunterBuilding]§ provides additional §Y[Owner.GetLibraWasteRcyclerWithIcon]§! Jobs"
 libra_gestalt_origin.5003.name: "Adventure Upgrade"
 libra_gestalt_origin.5003.desc: "With the expedition business, [Root.GetName] has accumulated a sufficient degree of experience to think about expanding our endeavors into larger areas.\n\nNow, it's time to arrange for new manpower."
 libra_gestalt_origin.5003.a: "Protect our gains."
 libra_gestalt_origin.5003.a.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§! provides additional §Y[GetLibraTreasureKeeperWithIcon]§! Jobs"
 libra_gestalt_origin.5003.b: "Prepare better logistical support."
 libra_gestalt_origin.5003.b.tt: "£building£ §Y[GetLibraMonsterHunterBuilding]§! provides additional §Y[GetLibraGuildSupporterWithIcon]§! Jobs"

 libra_monster_hunter_reward_unity_tooltip: "Gain §Y2§! months of £unity£ §Y$unity$§!"
 decision_libra_mhpf_0: "Intervene in the Chorus"
 decision_libra_mhpf_0_desc: "Intervene in the psychic chorus on this planet and see what happens."
 libra_planet_feature_modifier_0_a: "Symphony of the Void"
 libra_planet_feature_modifier_0_a_desc: "The realm of the Void blessed the planet, and all gained great gain."
 libra_planet_feature_modifier_0_b: "Variations on the Void"
 libra_planet_feature_modifier_0_b_desc: "The interface of the Void Realm's presence on this planet is unfathomable, and can only be comprehended by true psychics."
 libra_planet_feature_modifier_0_c: "The Curse of the Void"
 libra_planet_feature_modifier_0_c_desc: "Interfering with the chorus has angered the spirits behind it, and the planet is cursed."
 decision_libra_mhpf_1: "Mimic the Accompaniment"
 decision_libra_mhpf_1_desc: "Playing an accompaniment to the chorus on this planet might make a difference."
 libra_planet_feature_modifier_1_a: "Song of Stability"
 libra_planet_feature_modifier_1_a_desc: "This is a planet that echoes with a calming music."
 libra_planet_feature_modifier_1_b: "Song of Endeavor"
 libra_planet_feature_modifier_1_b_desc: "This is a planet that echoes the mysterious music of the uplifted."
 libra_planet_feature_modifier_1_c: "Song of exaltation"
 libra_planet_feature_modifier_1_c_desc: "Spiritual energies converge on this planet in an exorbitant way."
 decision_libra_mhpf_2: "Cultivating Alien Vegetation"
 decision_libra_mhpf_2_desc: "We may have a way to make the magnificent vegetation on this planet grow better."
 libra_planet_feature_modifier_2_a: "Blooming Garden World"
 libra_planet_feature_modifier_2_a_desc: "$libra_planet_feature_modifier_2_desc$"
 libra_planet_feature_modifier_2_b: "Crowded Garden World"
 libra_planet_feature_modifier_2_b_desc: "Though more ornate, an overgrowth of hardy mutant vegetation crowds out some of the space on this planet."
 decision_libra_mhpf_3: "Expand Settlement."
 decision_libra_mhpf_3_desc: "Trim the natural areas here."
 libra_planet_feature_modifier_3_a: "Expanded settlement"
 libra_planet_feature_modifier_3_a_desc: "Natural settlements on this planet have been artificially widened."
 libra_planet_feature_modifier_3_b: "The Perfect Settlement"
 libra_planet_feature_modifier_3_b_desc: "This is a perfect settlement, created by both nature and man."
 decision_libra_mhpf_4: "Deepen the Potential of the Territory"
 decision_libra_mhpf_4_desc: "We should be able to expand the natural foundations on this planet."
 libra_planet_feature_modifier_4_a: "Good Infrastructure"
 libra_planet_feature_modifier_4_a_desc: "This planet has top-notch infrastructure."
 libra_planet_feature_modifier_4_b: "Regional Ecological Shock"
 libra_planet_feature_modifier_4_b_desc: "Expanding building sites comes at the cost of making the planet less livable."
 decision_libra_mhpf_5: "Drop Hormones"
 decision_libra_mhpf_5_desc: "The planet's hypnotic environment may be easier to interfere with than we thought."
 libra_planet_feature_modifier_5_a: "Neurostimulant"
 libra_planet_feature_modifier_5_a_desc: "The hormones that were dropped had an unexpected effect on the environment on this planet, with the efficiency of the activities of the organic species increasing by a tenth."
 libra_planet_feature_modifier_5_b: "A Breeding Ground"
 libra_planet_feature_modifier_5_b_desc: "For the inhabitants of this planet, open-air mating behavior prompted by environmental hormones is a matter of course, and their population has grown exponentially as a result."
 decision_libra_mhpf_6: "Exploring Folded Space"
 decision_libra_mhpf_6_desc: "The folded space on this planet may not be so stable, we may be able to do something about it."
 libra_planet_feature_modifier_6_a: "Subdimensional Slits"
 libra_planet_feature_modifier_6_a_desc: "The planet's folded space collapsed partially due to unplanned exploratory action, nevertheless it is still larger than directly perceived."
 libra_planet_feature_modifier_6_b: "Subdimensional Plaza"
 libra_planet_feature_modifier_6_b_desc: "The hidden space on this planet ...... is very vast."
 decision_libra_mhpf_7: "Intervening Military Animals"
 decision_libra_mhpf_7_desc: "Interesting things may happen when callers stress test the exotic animals on this planet."
 libra_planet_feature_modifier_7_a: "Berserk Star"
 libra_planet_feature_modifier_7_a_desc: "The military sex animals on this planet have become unusually raging."
 libra_planet_feature_modifier_7_b: "Star of War"
 libra_planet_feature_modifier_7_b_desc: "$libra_planet_feature_modifier_7_desc$"
 libra_planet_feature_modifier_7_c: "Star of Victory"
 libra_planet_feature_modifier_7_c_desc: "Military animals on this planet have shown excellent adaptability in foreign interference studies."
 decision_libra_mhpf_8: "Hyperspace Experiments"
 decision_libra_mhpf_8_desc: "The unstable flow of time opens up possibilities for unusual experiments."
 libra_planet_feature_modifier_8_a: "Time Acceleration"
 libra_planet_feature_modifier_8_a_desc: "$libra_planet_feature_modifier_8_desc$"
 libra_planet_feature_modifier_8_b: "Time Hyper Acceleration"
 libra_planet_feature_modifier_8_b_desc: "Time on this planet is flowing quite a bit faster than normal."
 libra_planet_feature_modifier_8_c: "Time Storming"
 libra_planet_feature_modifier_8_c_desc: "Time on this planet is changing as much as double to more than normal."
 decision_libra_mhpf_9: "Tame High Explosive Vegetation"
 decision_libra_mhpf_9_desc: "We can selectively breed the savage plants here to produce a more competitive and stable variant to replace these dangerous natives."
 libra_planet_feature_modifier_9_a: "Exploding Worlds"
 libra_planet_feature_modifier_9_a_desc: "The high-explosive plants growing on this planet are at risk of exploding at any time, and they are far out of control."
 libra_planet_feature_modifier_9_b: "High-energy Vegetation"
 libra_planet_feature_modifier_9_b_desc: "There exists on this planet a bizarre plant that spontaneously accumulates explosive particles."
 libra_planet_feature_modifier_9_c: "Explosive Fruit."
 libra_planet_feature_modifier_9_c_desc: "Through cross-breeding, a new type of explosive plant that grows vigorously has stabilized and developed here, and their fruits need only be harvested for a simple purification to generate a substantial income."
 decision_libra_mhpf_10: "Expedition Gas Planet"
 decision_libra_mhpf_10_desc: "Finding the source of the planet's endless methane gas might be rewarding."
 libra_planet_feature_modifier_10_a: "Gas Vents"
 libra_planet_feature_modifier_10_a_desc: "A vent deep into the mantle that releases natural gas into the surrounding environment at all times."
 libra_planet_feature_modifier_10_b: "Large Gas Explosion"
 libra_planet_feature_modifier_10_b_desc: "The ill-conceived expedition detonated the alien gas reservoirs beneath this planet, causing irreparable havoc."
 libra_planet_feature_modifier_10_c: "Subterranean Gas Lake"
 libra_planet_feature_modifier_10_c_desc: "This planet has a stable resource of alien gases underground, and we can enrich them with special plants."
 decision_libra_mhpf_11: "Lonization Shock"
 decision_libra_mhpf_11_desc: "We can try to harvest the planet's unexpected electricity."
 libra_planet_feature_modifier_11_a: "Planet of Energy"
 libra_planet_feature_modifier_11_a_desc: "This planet's special geomagnetic field is perfect for energy harvesting efforts."
 libra_planet_feature_modifier_11_b: "Energy Overload"
 libra_planet_feature_modifier_11_b_desc: "This planet's charged particles are artificially excited."
 libra_planet_feature_modifier_11_c: "World of Sparks"
 libra_planet_feature_modifier_11_c_desc: "This planet has more charged particles."
 decision_libra_mhpf_12: "Chorus of Nothingness"
 decision_libra_mhpf_12_desc: "We ...... might be able to join in."
 libra_planet_feature_modifier_12_a: "Chorus of Nothingness"
 libra_planet_feature_modifier_12_a_desc: "The mysterious song echoes over this planet as it welcomes every brave soul to join in."
 decision_libra_mhpf_13: "Excavating Artifact Repository"
 decision_libra_mhpf_13_desc: "Investigate in detail the artifacts left here."
 libra_planet_feature_modifier_13_a: "Artifact Mapping"
 libra_planet_feature_modifier_13_a_desc: "Ancient artifacts on this planet have been cataloged so that researchers can access them at any time."
 libra_planet_feature_modifier_13_b: "Underground Artifact Storage"
 libra_planet_feature_modifier_13_b_desc: "Most of the valuable artifacts on this planet are buried deep underground, which makes research more difficult."
 decision_libra_mhpf_14: "Ancient Battlefield Exploration"
 decision_libra_mhpf_14_desc: "Search for valuable relics from ancient battlefields."
 libra_planet_feature_modifier_14_a: "Heaps of Discarded Metal"
 libra_planet_feature_modifier_14_a_desc: "Aside from patches of alloy wreckage, no other items of value exist from this ancient battlefield."
 libra_planet_feature_modifier_14_b: "Ancient Material Storage"
 libra_planet_feature_modifier_14_b_desc: "This planet houses a number of materials left over from ancient galactic empires."
 libra_planet_feature_modifier_14_c: "Ancient Battlefield Museum"
 libra_planet_feature_modifier_14_c_desc: "The value of this ancient battlefield remnant is higher than expected, and suitable research methods have been prepared locally after investigation."
 decision_libra_mhpf_15: "Fix the Ecosystem"
 decision_libra_mhpf_15_desc: "Artificially correct the planet's anomalous ecosystem."
 libra_planet_feature_modifier_15_a: "Weak Ecosystem"
 libra_planet_feature_modifier_15_a_desc: "It's not as bad as it was earlier, but these odd silica-based ecosystems are still a bit tricky."
 libra_planet_feature_modifier_15_b: "Stabilizing Biota"
 libra_planet_feature_modifier_15_b_desc: "A group of intrepid researchers have massively modified the biome system here."
 decision_libra_mhpf_16: "Utilizing Plasma"
 decision_libra_mhpf_16_desc: "The plasma atmosphere on this planet should provide us with more value."
 libra_planet_feature_modifier_16_a: "Dense Ionosphere"
 libra_planet_feature_modifier_16_a_desc: "The thick ionosphere makes it difficult for energy weapon attacks to reach the planet's surface."
 libra_planet_feature_modifier_16_b: "Plasma Research"
 libra_planet_feature_modifier_16_b_desc: "An institute dedicated to the study of plasma on this planet."
 decision_libra_mhpf_17: "Planet Silencer"
 decision_libra_mhpf_17_desc: "We can make this planet more peaceful."
 libra_planet_feature_modifier_17_a: "Deep Tranquility"
 libra_planet_feature_modifier_17_a_desc: "$libra_planet_feature_modifier_17_desc$"
 decision_libra_mhpf_18: "Expanding Infrastructure Projects"
 decision_libra_mhpf_18_desc: "Restoration and expansion of legacy ancient infrastructure."
 libra_planet_feature_modifier_18_a: "Modern Infrastructure Engineering"
 libra_planet_feature_modifier_18_a_desc: "Ancient engineering improved with modern technology."
 libra_planet_feature_modifier_18_b: "Infrastructure Accidents"
 libra_planet_feature_modifier_18_b_desc: "The project to remodel the ancient engineering here went unexpectedly badly."
 decision_libra_mhpf_19: "Restoration of Ancient Industrial Area"
 decision_libra_mhpf_19_desc: "Repairing damaged industrial facilities to operate at full capacity."
 libra_planet_feature_modifier_19_a: "Restored ancient industrial area"
 libra_planet_feature_modifier_19_a_desc: "$libra_planet_feature_modifier_19_desc$"
 decision_libra_mhpf_20: "Expand Crystal Ranch"
 decision_libra_mhpf_20_desc: "We may be able to harvest more crystals from here."
 libra_planet_feature_modifier_20_a: "Crystal Farming Area"
 libra_planet_feature_modifier_20_a_desc: "Advanced crystal species husbandry."
 libra_planet_feature_modifier_20_b: "Crystal Sprawl"
 libra_planet_feature_modifier_20_b_desc: "Crystalline organisms on this planet are in a state of flooding."
 libra_planet_feature_modifier_20_c: "Crystalline Hedgehog"
 libra_planet_feature_modifier_20_c_desc: "Stimulated by the outside world, crystals on this planet are overgrowing at a lower purity."