 leader_trait_libra_scientist_governor_spiritualist: "Supreme Chorus"
 leader_trait_libra_scientist_governor_spiritualist_desc: "The sage-weaver transforms the starzone into a multidimensional resonant sanctuary - when the first hymn echoes from the capital planet [this.GetHeShe] governs, all researchers' minds interlink through subspace harmonics. Holy light-dust hymns overflowing from main labs make data streams spontaneously crystallize into theoretical models, while scholars in distant colonies, though hearing nothing, find resonance-enhanced formulas flowing from their pens, as if the entire galaxy's wisdom trembles in unison.\n$libraf_lt_banner_6$"
