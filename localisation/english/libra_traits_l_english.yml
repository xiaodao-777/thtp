 leader_trait_libra_synthetic_scientist_scholar_d_2_tt: "Upon completion of salvage or study of debris:\n$tt$- Gain £alloys£§G300§! £influence£§G30§!\n$tt$- Repair §G50%§! of the hull and armor of your ships in the galaxy"
