 leader_trait_libra_scientist_governor_egalitarian: "Frontier Academy of Sciences"
 leader_trait_libra_scientist_governor_egalitarian_desc: "When knowledge returns to its creators' hands, truth blossoms from every laboring hand. Technological achievements will ultimately benefit every individual equally - the question of sequence is merely outdated talk from an era of insufficient productivity.\n$libraf_lt_banner_5$"
