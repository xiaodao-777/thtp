 leader_trait_libra_synthetic_scientist_explorer_b: "Starburst Unit"
 leader_trait_libra_synthetic_scientist_explorer_b_desc: "This exploration protocol enables the discovery of new insights from new worlds and their random expansion into the academic realm."
