# admiral

 leader_trait_libra_commander_admiral_destiny_a: "Ghost Captain"
 leader_trait_libra_commander_admiral_destiny_a_desc: "Elusive as a phantom, this commander slips undetected through enemy lines, striking lethally from the safest positions.\n$libraf_lt_banner_11$"
 leader_trait_libra_commander_admiral_destiny_a_tt: "$t$- While fleet is cloaked:\n$tt$- $MOD_SHIP_SPEED_MULT$: §G+50%§!\n$tt$- $MOD_SHIP_SPEED_REDUCTION$: §G-40%§!\n$tt$- $MOD_SHIP_JUMPDRIVE_COOLDOWN_MULT$: §G-40%§!"

 leader_trait_libra_commander_admiral_destiny_b: "Master of Disguise"
 leader_trait_libra_commander_admiral_destiny_b_desc: "Dilapidated equipment and undisciplined crews form most observers' first impression. Unbeknownst to them, beneath calm waters lies a meticulously laid trap where prey willingly throw themselves into destruction like moths to a flame.\n$libraf_lt_banner_11$"
 leader_trait_libra_commander_admiral_destiny_b_tt: "$t$- While fleet is not in combat:\n$tt$- $MOD_SHIP_ACCURACY_MULT$: §R-25%§!\n$tt$- $MOD_SHIP_WEAPON_DAMAGE$: §R-50%§!\n$tt$- $MOD_SHIP_FIRE_RATE_MULT$: §R-50%§!"

 leader_trait_libra_commander_admiral_destiny_c: "Swarm Lord"
 leader_trait_libra_commander_admiral_destiny_c_desc: "This admiral's mind operates as a precision war-node, weaving vast strike craft armadas into unified storms of annihilation. Under their command, each craft becomes a coordinated fang, multiplying combat efficiency exponentially and reducing enemy ships to cosmic dust beneath saturation barrages.\n$libraf_lt_banner_11$"
 leader_trait_libra_commander_admiral_destiny_c_tt_1: "$t$- When £navy_size£ §Y$FLEET_SIZE_TITLE$§! reaches §Y200§!: \n$tt$- $MOD_STRIKE_CRAFT_ARMOR_MULT$: §G+100%§!\n$tt$- $MOD_STRIKE_CRAFT_SHIELD_MULT$: §G+100%§!"
 leader_trait_libra_commander_admiral_destiny_c_tt_2: "$t$- When £navy_size£ §Y$FLEET_SIZE_TITLE$§! reaches §Y400§!: \n$tt$- $mod_weapon_type_strike_craft_weapon_damage_mult$: §G+100%§!\n$tt$- $mod_weapon_type_strike_craft_weapon_fire_rate_mult$: §G+100%§!"

 leader_trait_libra_commander_admiral_destiny_d: "Domain Harmonizer"
 leader_trait_libra_commander_admiral_destiny_d_desc: "This tactician's fleet shifts like living metal, turning nebula currents and radiation storms into deliberate moves within strategic designs.\n$libraf_lt_banner_11$"
 leader_trait_libra_commander_admiral_destiny_d_tt_1: "$t$- While in §YNebula§!:\n$tt$- $MOD_SHIP_ARMOR_PENETRATION_ADD$: §G+50%§!\n$tt$- $MOD_SHIP_SHIELD_PENETRATION_ADD$: §G+50%§!"
 leader_trait_libra_commander_admiral_destiny_d_tt_2: "$t$- While in §Y$pc_black_hole$§! system:\n$tt$- $MOD_SHIP_EVASION_MULT$: §G+35%§!"
 leader_trait_libra_commander_admiral_destiny_d_tt_3: "$t$- While in §Y$pc_neutron_star$§! system:\n$tt$- $MOD_SHIP_TRACKING_MULT$: §G+35%§!"
 leader_trait_libra_commander_admiral_destiny_d_tt_4: "$t$- While in §Y$pc_pulsar$§! system:\n$tt$- $MOD_SHIP_HULL_DAMAGE_MULT$: §G+35%§!"

 leader_trait_libra_commander_admiral_militarist: "Iron Rain Weaver"
 leader_trait_libra_commander_admiral_militarist_desc: "Among many ways to destroy foes, this commander masters one above all: [this.GetHeShe] relentlessly unleashes barrages that reduce any enemy to dust.\n$libraf_lt_banner_2$"

 leader_trait_libra_commander_admiral_pacifist: "Bulwark of Peace"
 leader_trait_libra_commander_admiral_pacifist_desc: "This commander's fleet stands as a silent fortress on the battlefield, drawing and halting all conflict with immovable presence.\n$libraf_lt_banner_3$"

 leader_trait_libra_commander_admiral_authoritarian: "Imperial Vanguard"
 leader_trait_libra_commander_admiral_authoritarian_desc: "This admiral is the Empire's tempered blade, commanding steel tides with absolute authority. Their fleet advances like imperial decrees through the void, transforming the Supreme Leader's will into storms that crush rebellion.\n$libraf_lt_banner_4$"
 leader_trait_libra_commander_admiral_authoritarian_tt: "$t$- Per §Y$MOD_COUNCILOR_SKILL_ADD$§! of §Y$councilor_defense$§!:\n$tt$- $MOD_SHIP_FIRE_RATE_MULT$: §G+2%§! (Max: §G+60%§!)\n$tt$- $MOD_SHIP_WEAPON_DAMAGE$: §G+3%§! (Max: §G+90%§!)"
 leader_trait_libra_commander_admiral_authoritarian_g_tt: "$t$- Per §Y$MOD_COUNCILOR_SKILL_ADD$§! of §Y$councilor_gestalt_legion$§!:\n$tt$- $MOD_SHIP_FIRE_RATE_MULT$: §G+2%§! (Max: §G+60%§!)\n$tt$- $MOD_SHIP_WEAPON_DAMAGE$: §G+3%§! (Max: §G+90%§!)"

 leader_trait_libra_commander_admiral_egalitarian: "Allied Bastion"
 leader_trait_libra_commander_admiral_egalitarian_desc: "This commander is a nexus forged by collective will. Their exceptional tactics unite scattered ships into an unbreakable bulwark of shared resolve, building defensive resilience beyond mere metal across the stars.\n$libraf_lt_banner_5$"

 leader_trait_libra_commander_admiral_spiritualist: "Celestial Covenant"
 leader_trait_libra_commander_admiral_spiritualist_desc: "This commander walks the stars as a blessed vessel, their soul an anchor to the divine. Ships under their command blaze with consecrated radiance-wounds seal with preternatural speed, firepower tears reality through faith. Their reach transcends mortal limits to the very borders of celestial will.\n$libraf_lt_banner_6$"
 leader_trait_libra_commander_admiral_spiritualist_tt: "$t$- Per owned §YAscension Perk§!:\n$tt$- $MOD_SHIP_WEAPON_RANGE_MULT$: §G+5%§! (Max: §G+40%§!)\n$tt$- $MOD_SHIP_ENGAGEMENT_RANGE_MULT$: §G+10%§! (Max: §G+80%§!)"

 leader_trait_libra_commander_admiral_materialist: "Battlefield Deconstructor"
 leader_trait_libra_commander_admiral_materialist_desc: "War to [Root.GetHeShe] is but cold calculus: cosmic laws fuel defensive algorithms, while reality-subverting technologies become chaotic variables in attack functions-each iteration exponentially increases devastation. Emotion is redundant code; morality an undefined variable-only quantifiable combat efficacy is the solution.\n$libraf_lt_banner_7$"
 leader_trait_libra_commander_admiral_materialist_tt_1: "$t$- Per researched §RDangerous Technology§!:\n$tt$- $MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+3%§! (Max: §G+15%§!)\n$tt$- $MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+3%§! (Max: §G+15%§!)"
 leader_trait_libra_commander_admiral_materialist_tt_2: "$t$- Per researched §MRare Technology§!:\n$tt$- $MOD_SHIP_ARMOR_HARDENING_ADD$: §G+1%§! (Max: §G+40%§!)\n$tt$- $MOD_SHIP_SHIELD_HARDENING_ADD$: §G+1%§! (Max: §G+40%§!)"

 leader_trait_libra_commander_admiral_xenophobe: "Ferryman of Styx"
 leader_trait_libra_commander_admiral_xenophobe_desc: "Cold efficiency is their sole creed. This commander views purification as sacred reaping-each successful purge infuses their weapons with victims' essence, heightening lethality for future harvests. They are not conquerors, but undertakers; their fleet a mobile graveyard among stars.\n$libraf_lt_banner_8$"
 leader_trait_libra_commander_admiral_xenophobe_tt_1: "$t$- Current §Y[Owner.libra_pop_purged_count]§!, per cumulative purification of $pop_group_unit$ £pop£ §Y$POP$§!:\n$tt$- $MOD_SHIP_WEAPON_DAMAGE$: §G+1%§! (Max: §G+125%§!)"
 leader_trait_libra_commander_admiral_xenophobe_tt_2: "Current §Y0§!, per cumulative purification of $pop_group_unit$ £pop£ §Y$POP$§!:\n$tt$- $MOD_SHIP_WEAPON_DAMAGE$: §G+1%§! (Max: §G+125%§!)"

 leader_trait_libra_commander_admiral_xenophile: "Alliance Sentinel"
 leader_trait_libra_commander_admiral_xenophile_desc: "To this commander, pacts are not mere words but true bulwarks of galactic peace. Each treaty grants broader operational authority, deeper intelligence sharing, and firmer conviction-they guard not alone, but a fragile order upheld by countless civilizations.\n$libraf_lt_banner_9$"
 leader_trait_libra_commander_admiral_xenophile_tt_1: "$t$- Per active §YNon-Aggression Pact§!:\n$tt$- $MOD_SHIP_WEAPON_DAMAGE$: §G+25%§! (Max: §G+100%§!)\n$tt$- $MOD_SHIP_FRIENDLY_TERRITORY_ACCURACY_MULT$: §G+5%§! (Max: §G+20%§!)"
 leader_trait_libra_commander_admiral_xenophile_tt_2: "$t$- Per active §YDefensive Pact§!:\n$tt$- $MOD_SHIP_FIRE_RATE_MULT$: §G+25%§! (Max: §G+100%§!)\n$tt$- $MOD_SHIP_FRIENDLY_TERRITORY_TRACKING_MULT$: §G+5%§! (Max: §G+20%§!)"

# general

 leader_trait_libra_commander_general_destiny_a: "Tennoheika Banzai"
 leader_trait_libra_commander_general_destiny_a_desc: "If charges fail, blame soldiers' courage; if courage exists, blame numbers. This commander believes in glorious melee - nothing remains uncut when [this.GetHeShe] strikes.\n$libraf_lt_banner_12$"

 leader_trait_libra_commander_general_destiny_b: "Demolition Savant"
 leader_trait_libra_commander_general_destiny_b_desc: "This commander embodies destruction. [this.GetHeShe] employs ruthless methods to maximize devastation, for ruin itself is [this.GetHisHer] creed.\n$libraf_lt_banner_12$"

 leader_trait_libra_commander_general_destiny_c: "Bastion Commandant"
 leader_trait_libra_commander_general_destiny_c_desc: "Specializing in peacekeeping, this commander gathers exotic knowledge while leading veteran garrisons.\n$libraf_lt_banner_12$"
 leader_trait_libra_commander_general_destiny_c_tt: "$t$- While fleet orbits colony:\n$tt$- Consumes §R4§!£energy£ §Y$energy$§! to produce §G1§!£physics_research£ §G1§!£society_research£ §G1§!£engineering_research£ §YResearch Points§! per $pop_group_unit$ £pop£ §Y$POP$§!"

 leader_trait_libra_commander_general_destiny_d: "Battle Scavenger"
 leader_trait_libra_commander_general_destiny_d_desc: "To this commander, battlefields are open-pit mines. When enemies fall, [this.GetHeShe] deploys engineers to melt wreckage into fresh alloys. Conquest is but relabeling enemy assets.\n$libraf_lt_banner_12$"
 leader_trait_libra_commander_general_destiny_d_tt: "When conquering colonies:\n$tt$- Gains £alloys£§G275§! £influence£§G5§! per §Y$MOD_LEADER_SKILL_ADD$§!"

 leader_trait_libra_commander_general_militarist: "Death-Debit Shuriken"
 leader_trait_libra_commander_general_militarist_desc: "This commander audits war: each unit destroyed yields energy credits from salvaged gear, while shrapnel delivers random death dividends.\n$libraf_lt_banner_2$"
 leader_trait_libra_commander_general_militarist_tt: "When killing garrison units:\n$tt$- Gains £energy£§G100§! £influence£§G0.5§!\n$tt$- Deals §G360§! damage to random enemies"

 leader_trait_libra_commander_general_pacifist: "Benevolence Paradox"
 leader_trait_libra_commander_general_pacifist_desc: "True peace isn't absence of war, but making aggressors unravel themselves. This commander surgically disables invaders before they strike.\n$libraf_lt_banner_3$"
 leader_trait_libra_commander_general_pacifist_tt: "When defending colonies:\n$tt$- §Y65%§! chance to repel attacker $commander_with_icon$, disabling them for §Y180§! days"

 leader_trait_libra_commander_general_authoritarian: "Annexation Exactor"
 leader_trait_libra_commander_general_authoritarian_desc: "Conquest is this commander's ultimate tax collection. [this.GetHeShe] wields armies like precision instruments - bayonets as calipers gauging loyalty, guns as revenue stamps. Occupied territories yield prosperity, not ruins.\n$libraf_lt_banner_4$"
 leader_trait_libra_commander_general_authoritarian_tt: "When conquering colonies:\n$tt$- Gains £energy£§G3§! £trade£§G2§! per £pop£ §Y$POP$§!"

 leader_trait_libra_commander_general_egalitarian: "Equilibrium Breaker"
 leader_trait_libra_commander_general_egalitarian_desc: "Equality spreads like wildfire. Under war's smoke, this general plants foreign ideals deep within enemy societies. When foes realize their doom, it's too late.\n$libraf_lt_banner_5$"
 leader_trait_libra_commander_general_egalitarian_tt: "£time£ §Y90§! days, when invading colonies, apply the following effect to the target empire for §Y75§! days:\n$tt$- $MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §R-25%§!\n$tt$- $MOD_SHIP_FIRE_RATE_MULT$: §R-25%§!\n$tt$- $mod_planet_pops_upkeep_mult$: §R+25%§!"
 leader_trait_libra_commander_general_egalitarian_effect: "Egalitarian Flame"
 leader_trait_libra_commander_general_egalitarian_effect_desc: "War-borne ideologies temporarily complicate imperial governance."

 leader_trait_libra_commander_general_spiritualist: "Psychic Verdict"
 leader_trait_libra_commander_general_spiritualist_desc: "Against heretics, this commander is the ultimate judge. When [this.GetHeShe] treads alien soil, victory is decided before weapons fire.\n$libraf_lt_banner_6$"
 leader_trait_libra_commander_general_spiritualist_tt: "£time£ §Y90§! days, when invading:\n$tt$- Deals §G240§! damage to §Ydefense armies§!\n$tt$- Deals §G720§! damage to §Yassault armies§!"

 leader_trait_libra_commander_general_materialist: "Knowledge-Inferno"
 leader_trait_libra_commander_general_materialist_desc: "[this.GetHeShe] wages recursive warfare: breach walls, harvest tech, forge deadlier weapons, and then breach stronger walls. Alien labs are but mechanical lambs for dissection.\n$libraf_lt_banner_7$"
 leader_trait_libra_commander_general_materialist_tt: "When conquering colonies:\n$tt$- Gains £minor_artifacts£§G100§!\n$tt$- Gain §G6§! months of £physics£ £society£ £engineering£ §YResearch Points§! output"

 leader_trait_libra_commander_general_xenophobe: "Crimson Rite"
 leader_trait_libra_commander_general_xenophobe_desc: "Newly conquered worlds require foundation ceremonies. Half a population's extinction roots imperial will through fear. This efficiency provides hellish lessons for fellow commanders.\n$libraf_lt_banner_8$"
 leader_trait_libra_commander_general_xenophobe_tt: "When conquering colonies with at least §Y800§! £pop£ §Y$POP$§!:\n$tt$ $commander_with_icon$ with lowest level gains §G1§! experience per £pop£ §Y$POP$§!\n$tt$- §R50%§! £pop£ §Y$POP$§! purged, yielding £unity£§G8§! £influence£§G0.03§! per purge"

 leader_trait_libra_commander_general_xenophile: "Non-zero-sum Tactics"
 leader_trait_libra_commander_general_xenophile_desc: "Victory needs no ruins. Every maneuver considers post-war reconstruction. Spare innocents, crush combatants.\n$libraf_lt_banner_9$"

# commander governor

 leader_trait_libra_commander_governor_destiny_a: "Discipline Commissioner"
 leader_trait_libra_commander_governor_destiny_a_desc: "Order transcends all - chaotic societies inevitably collapse. This commander prioritizes colonial stability above all, considering it synonymous with prosperity.\n$libraf_lt_banner_13$"
 leader_trait_libra_commander_governor_destiny_a_tt_1: "$t$- Per 1% £stability£ §Y$PLANET_STABILITY_TITLE$§!:\n$tt$- $mod_planet_jobs_produces_mult$: §G+0.6%§!"
 leader_trait_libra_commander_governor_destiny_a_tt_2: "$t$- Per 1% £stability£ §Y$PLANET_STABILITY_TITLE$§!:\n$tt$- $mod_planet_jobs_produces_mult$: §G+0.3%§!"

 leader_trait_libra_commander_governor_destiny_b: "Mirrorwall Grasp"
 leader_trait_libra_commander_governor_destiny_b_desc: "Here lies forbidden ground\nBefore us, the chasm stands.\nThough legions surge\nNone shall cross these lands.\n$libraf_lt_banner_13$"

 leader_trait_libra_commander_governor_destiny_c: "Network Core"
 leader_trait_libra_commander_governor_destiny_c_desc: "Planetary governance is challenging; interstellar coordination doubly so. This commander possesses unique methods to make celestial operations seamless.\n$libraf_lt_banner_13$"

 leader_trait_libra_commander_governor_destiny_d: "Logistics Overseer"
 leader_trait_libra_commander_governor_destiny_d_desc: "This specialist views sectors as frigid circulatory systems where laborers are mere nutrient-bearing erythrocytes. [this.GetHeShe] engineers each cog to precision standards - conveyor belts must pulse like arteries, warehouse throughput should rival supernovae. When trade values shatter gauges under steel-clad edicts, colonial veins tolerate not a speck of criminal sediment.\n$libraf_lt_banner_13$"

 leader_trait_libra_commander_governor_militarist: "Fortress Architect"
