 leader_trait_libra_synthetic_scientist_scholar_c: "Scholarly Logic"
 leader_trait_libra_synthetic_scientist_scholar_c_desc: "This Scientist is able to efficiently organize research findings and translate them into easy-to-understand academic presentations."
