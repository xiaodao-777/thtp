 concept_libra_corrupt_leader_traits: "Corrupt Leader Trait"
 concept_libra_corrupt_leader_traits_desc: "$libra_veteran_corrupt_leader_traits$:\n$t$Leaders may possess only one. Normally obtained by random conversion from §Y$leader_trait_libra_corrupt_beacon$§!. Effects scale with §YTotal Level of Negative Traits§!. The ['tradition_category:tradition_libra_degeneracy'] tradition enhances their effects.\n\n$libra_paragon_corrupt_leader_traits$:\n$t$Requires no prerequisite technology. Upon acquisition, randomly adds one §YNegative Trait§!."

 leader_trait_libra_corrupt_beacon: "Corruption Beacon"
 leader_trait_libra_corrupt_beacon_desc: "Degeneracy is the beginning of corruption.\n$libraf_lt_banner_23$"
 leader_trait_libra_corrupt_beacon_tt: "\nTransforms into a random ['concept_libra_corrupt_leader_traits',$libra_veteran_corrupt_leader_traits$] in §Y1080§! days.$leader_trait_libra_corrupt_effect_tt$"


 leader_trait_libra_corrupt_generic_a: "Fool Me Endlessly"
 leader_trait_libra_corrupt_generic_a_desc: "Fool me once, fool me twice... but at least they've gained experience in getting hurt."
 leader_trait_libra_corrupt_generic_b: "Stranger from Afar"
 leader_trait_libra_corrupt_generic_b_desc: "Somehow, this leader was replaced by their counterpart from a parallel universe.\n...Isekai transmigration? Is that even possible?"
 leader_trait_libra_corrupt_generic_c: "Ging Gang Goolie"
 leader_trait_libra_corrupt_generic_c_desc: "Colonies overseen by this leader are always exceptionally joyful."
 leader_trait_libra_corrupt_generic_d: "Cost-Cutting Efficiency"
 leader_trait_libra_corrupt_generic_d_desc: "This leader strives to slash production costs while boosting output, regardless of feasibility."
 leader_trait_libra_corrupt_generic_e: "Old Guard"
 leader_trait_libra_corrupt_generic_e_desc: "This leader constantly pines for the glory of a bygone era, using it as the benchmark for the entire empire."
 leader_trait_libra_corrupt_generic_f: "PDX Gamer"
 leader_trait_libra_corrupt_generic_f_desc: "This leader draws inspiration from beyond the screen, directing the empire's operations with ruthless efficiency."

 leader_trait_libra_corrupt_node_a: "PDX Node"
 leader_trait_libra_corrupt_node_a_desc: "This node receives directives from beyond the screen, efficiently directing the empire's operations."
 leader_trait_libra_corrupt_node_b: "Muscle Node"
 leader_trait_libra_corrupt_node_b_desc: "This node prioritizes military projects to an extreme degree, causing the Gestalt to massively expand its armed forces amid 'unforeseen circumstances.'"
 leader_trait_libra_corrupt_node_c: "Coercive Tasking"
 leader_trait_libra_corrupt_node_c_desc: "Directives relayed through this node take on an irresistible compulsion for drones - even the Overmind cannot fully perceive what transpires in between."
 leader_trait_libra_corrupt_node_d: "Warehouse Directive"
 leader_trait_libra_corrupt_node_d_desc: "This node enjoys issuing commands to collect items - regardless of where those artifacts originated."
 leader_trait_libra_corrupt_node_e: "Cryptic Directive"
 leader_trait_libra_corrupt_node_e_desc: "Task instructions issued through this node are as inscrutable as riddles, requiring semi‑autonomous units to expend some effort deciphering their true intent."
 leader_trait_libra_corrupt_node_f: "Random Sequence"
 leader_trait_libra_corrupt_node_f_desc: "Directives from this node undergo subtle variations based on random number generation, yet consistently align with a certain delicate constant."

 leader_trait_libra_corrupt_commander_admiral_a: "Raging Demon"
 leader_trait_libra_corrupt_commander_admiral_a_desc: "A thousand strikes in one flash, toppling mountains and shaking the earth, wailing ghosts herald the demon's ascent."
 leader_trait_libra_corrupt_commander_admiral_b: "Nothing Personal, Kid"
 leader_trait_libra_corrupt_commander_admiral_b_desc: "You have nowhere to run."
 leader_trait_libra_corrupt_commander_admiral_c: "Golden Bell Defense"
 leader_trait_libra_corrupt_commander_admiral_c_desc: "Merely conceals the weak points, that's all."
 leader_trait_libra_corrupt_commander_admiral_d: "EXPLOSION!"
 leader_trait_libra_corrupt_commander_admiral_d_desc: "Bestowing the Crimson Demon's farewell upon the enemy!"

 leader_trait_libra_commander_admiral_corrupt_destiny_a: "5-Second God Mode"
 leader_trait_libra_commander_admiral_corrupt_destiny_a_desc: "I'm invincible... for the next five seconds!\n$libraf_lt_banner_24$"
 leader_trait_libra_commander_admiral_corrupt_destiny_a_tt: "£time£ §Y120§! days, within §Y5§! days after fleet enters combat:\n$tt$- $MOD_SHIP_DAMAGE_REDUCTION_MULT$: §G+100%§!\n$tt$- $MOD_SHIP_WEAPON_DAMAGE$: §G+100%§!"
 leader_trait_libra_commander_admiral_corrupt_destiny_a_effect: "$leader_trait_libra_commander_admiral_corrupt_destiny_a$"
 leader_trait_libra_commander_admiral_corrupt_destiny_b: "Mark of the Stars"
 leader_trait_libra_commander_admiral_corrupt_destiny_b_desc: "This commander has forged a connection with an interstellar anomaly from another epoch.\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_commander_general_a: "Psychic Butcher"
 leader_trait_libra_corrupt_commander_general_a_desc: "The supreme art of war is to subdue the enemy without fighting. This commander excels at shattering enemy morale while besieging their strongholds."
 leader_trait_libra_corrupt_commander_general_b: "Banana Peel Tactic"
 leader_trait_libra_corrupt_commander_general_b_desc: "This commander occasionally makes moves that look like clumsy missteps, but are actually sharp ripostes poised to strike. However, if it is a genuine blunder... the consequences will backfire hard."
 leader_trait_libra_corrupt_commander_general_c: "Wushuang"
 leader_trait_libra_corrupt_commander_general_c_desc: "Decimating the enemy commander amidst legions!"
 leader_trait_libra_corrupt_commander_general_d: "Secret Art: Floating Passage"
 leader_trait_libra_corrupt_commander_general_d_desc: "This commander's tactics revolve around overwhelming the enemy with fluid, relentless combos."

 leader_trait_libra_commander_general_corrupt_destiny_a: "Jodan-no-kamae"
 leader_trait_libra_commander_general_corrupt_destiny_a_desc: "This general masters a swift and fierce close-combat technique. With proper angles, durasteel blades can slice neutronium armor effortlessly.\n$libraf_lt_banner_24$"
 leader_trait_libra_commander_general_corrupt_destiny_a_tt: "When attacking colonies:\n$tt$- Deals §Y7§! instances of §G1300§! damage to random enemies\n$t$- When defending colonies:\n$tt$- Deals §Y9§! instances of §G2700§! damage to random enemies"
 leader_trait_libra_commander_general_corrupt_destiny_b: "Stellar Covenant"
 leader_trait_libra_commander_general_corrupt_destiny_b_desc: "There are... things not to forget... purposes to fulfill...\n$libraf_lt_banner_25$"
 leader_trait_libra_commander_general_corrupt_destiny_b_tt: "When conquering colonies:\n$tt$- Gains £rare_crystals£§G12§! £exotic_gases£§G12§! £volatile_motes£§G12§! £astral_threads£§G25§! per £planetsize£ §Y$PLANET_SIZE$§!\n$t$- When defending colonies:\n$tt$- Summons §Y3§! §Y$sentinel_army$§! units"


 leader_trait_libra_corrupt_commander_governor_a: "Warden"
 leader_trait_libra_corrupt_commander_governor_a_desc: "This commander vigilantly prevents and crushes any lawbreakers."
 leader_trait_libra_corrupt_commander_governor_b: "Slow Living"
 leader_trait_libra_corrupt_commander_governor_b_desc: "After returning to the rear, this commander embraced a primitive yet simple life of production."
 leader_trait_libra_corrupt_commander_governor_c: "Pain Averse"
 leader_trait_libra_corrupt_commander_governor_c_desc: "Hates the thought of the planet falling, so ensures defenses are absolutely maxed out."
 leader_trait_libra_corrupt_commander_governor_d: "Construction Specialist"
 leader_trait_libra_corrupt_commander_governor_d_desc: "This commander is an engineering expert, cracking down hard on shoddy construction."

 leader_trait_libra_commander_governor_corrupt_destiny_a: "Treasure Excavator"
 leader_trait_libra_commander_governor_corrupt_destiny_a_desc: "Prime materials needn't wait for factory processing. This commander deploys custom-built tech directly at mining sites, separating valuables at the source. The true yield far exceeds imperial ledger entries.\n$libraf_lt_banner_24$"
 leader_trait_libra_commander_governor_corrupt_destiny_b: "Deadline Factory"
 leader_trait_libra_commander_governor_corrupt_destiny_b_desc: "This commander pursues peak efficiency through untested frontier theories.\nEnvironmental contamination? Worker casualties? Regrettably, these aren't priority concerns.\n$libraf_lt_banner_25$"
 leader_trait_libra_commander_governor_corrupt_destiny_b_tt_1: "$t$- Per researched §RDangerous Technology§!:\n$tt$- $mod_planet_technician_energy_produces_add$: §G+0.80§! (Max: §G+4§!)\n$tt$- $mod_planet_miners_minerals_produces_add$: §G+0.80§! (Max: §G+4§!)\n$tt$- $mod_planet_farmers_food_produces_add$: §G+0.80§! (Max: §G+4§!)"
 leader_trait_libra_commander_governor_corrupt_destiny_b_tt_2: "$t$- Per researched §RDangerous Technology§!:\n$tt$- $mod_planet_technician_energy_produces_add$: §G+0.40§! (Max: §G+2§!)\n$tt$- $mod_planet_miners_minerals_produces_add$: §G+0.40§! (Max: §G+2§!)\n$tt$- $mod_planet_farmers_food_produces_add$: §G+0.40§! (Max: §G+2§!)"


 leader_trait_libra_corrupt_commander_councilor_a: "Faded Valor"
 leader_trait_libra_corrupt_commander_councilor_a_desc: "Accumulated merits led this commander to promotion and retirement from the frontlines, yet [this.GetHeShe] still yearns for the battles of old."
 leader_trait_libra_corrupt_commander_councilor_b: "Imperial Guard"
 leader_trait_libra_corrupt_commander_councilor_b_desc: "This strategist can organize rock-solid, dependable armies."
 leader_trait_libra_corrupt_commander_councilor_c: "Overseer"
 leader_trait_libra_corrupt_commander_councilor_c_desc: "It's best not to let this leader catch wind of any criminal activity."
 leader_trait_libra_corrupt_commander_councilor_d: "Transportation Chief"
 leader_trait_libra_corrupt_commander_councilor_d_desc: "This commander seems significantly more adept at leading logistics... for better or worse."


 leader_trait_libra_corrupt_official_governor_a: "Penny-Pincher"
 leader_trait_libra_corrupt_official_governor_a_desc: "Every cent saved is a cent earned."
 leader_trait_libra_corrupt_official_governor_b: "Loudspeaker Master"
 leader_trait_libra_corrupt_official_governor_b_desc: "This administrator achieves governance goals through high-pressure management."
 leader_trait_libra_corrupt_official_governor_c: "Midnight Serenade"
 leader_trait_libra_corrupt_official_governor_c_desc: "Indulge in pleasure."
 leader_trait_libra_corrupt_official_governor_d: "Max-level Crafter"
 leader_trait_libra_corrupt_official_governor_d_desc: "Flaws aside, this administrator is undeniably a master of industrial production."

 leader_trait_libra_official_governor_corrupt_destiny_a: "Dazzling Spectacle"
 leader_trait_libra_official_governor_corrupt_destiny_a_desc: "To this official, construction projects and dance symphonies blur together - the rhythm of tools is melodic as tap shoes.\n$libraf_lt_banner_24$"
 leader_trait_libra_official_governor_corrupt_destiny_b: "Prosperity Catalyst"
 leader_trait_libra_official_governor_corrupt_destiny_b_desc: "This commissioner weaponizes consumerism, inspiring citizens to pursue better lives while boosting economic vitality. The plan is flawless - if you overlook the waste and ensure ample goods.\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_official_delegate_a: "Tall-Tale Spinner"
 leader_trait_libra_corrupt_official_delegate_a_desc: "This administrator's knack for spinning yarns is astounding; it'd be a waste not to exploit it."
 leader_trait_libra_corrupt_official_delegate_b: "Professional Victim"
 leader_trait_libra_corrupt_official_delegate_b_desc: "To gain an edge in diplomacy, this administrator employs any means necessary."
 leader_trait_libra_corrupt_official_delegate_c: "Reverse Causality"
 leader_trait_libra_corrupt_official_delegate_c_desc: "This administrator has elevated the art of sophistry to its peak."
 leader_trait_libra_corrupt_official_delegate_d: "Space Police"
 leader_trait_libra_corrupt_official_delegate_d_desc: "This administrator advocates military intervention in interstellar affairs."

 leader_trait_libra_official_delegate_corrupt_destiny_a: "Riddler"
 leader_trait_libra_official_delegate_corrupt_destiny_a_desc: "This delegate resembles a performance artist - their speeches are cryptic, their actions self-contradictory. While difficult to record as a serious case in diplomatic history, they nonetheless possess a peculiar educational value.\n$libraf_lt_banner_24$"
 leader_trait_libra_official_delegate_corrupt_destiny_a_tt: "After vetoing a resolution proposed by own faction:\n$tt$- Gain §G300§!£influence£ §Y$influence$§!\n$tt$- All $official_with_icon$ gain §G1000§! experience"
 leader_trait_libra_official_delegate_corrupt_destiny_b: "You're Absolutely Right (Not)"
 leader_trait_libra_official_delegate_corrupt_destiny_b_desc: "Surface compliance doesn't equate to genuine agreement. This administrator lavishly flatters foreign emissaries while quietly burying true objectives deep within.n$libraf_lt_banner_25$"
 leader_trait_libra_official_delegate_corrupt_destiny_b_tt: "$t$- When successfully opposing a resolution:\n$tt$- Gain §G100§!£influence£ §Y$influence$§!\n$tt$- $ADD_COUNCIL_AGENDA_PROGRESS$ §G+75%§!\n$tt$- Gain up to §G100000§!£trade£ §Y$trade$§! based on §Y50%§! £diplo_weight£ §Y$diplomatic_weight$§!"


 leader_trait_libra_corrupt_official_diplomacy_councilor_a: "Stepping Stone Plan"
 leader_trait_libra_corrupt_official_diplomacy_councilor_a_desc: "When handling foreign affairs, this administrator frequently authorizes aggressive measures."
 leader_trait_libra_corrupt_official_diplomacy_councilor_b: "Violent Analects"
 leader_trait_libra_corrupt_official_diplomacy_councilor_b_desc: "When a friend comes from afar to spar, how can I not give them a good thrashing?" 
 leader_trait_libra_corrupt_official_diplomacy_councilor_c: "Friend Fee"
 leader_trait_libra_corrupt_official_diplomacy_councilor_c_desc: "This month's dues, hand them over~"
 leader_trait_libra_corrupt_official_diplomacy_councilor_d: "Universal Gesture of Friendship"
 leader_trait_libra_corrupt_official_diplomacy_councilor_d_desc: "You're the villain, not an ally."

 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a: "The Feeble Me"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a_desc: "Look upon this feeble nation from barren lands, having nothing yet daring to show our face in diplomatic circles... have pity on us, 'sobsobwhimper'...\n$libraf_lt_banner_24$"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a_tt_1: "$t$- Per §YIndependence Guarantee§! received:\n$tt$- $MOD_DIPLO_ACTION_ACCEPTANCE_ADD$: §G+2§! (Max: §G+10§!)\n$tt$- $mod_country_produces_mult$: §G+3%§! (Max: §G+15%§!)\n$tt$- $MOD_DIPLO_WEIGHT_MULT$: §G+3%§! (Max: §G+15%§!)"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_a_tt_2: "$t$- Per §YIndependence Guarantee§! received:\n$tt$- $MOD_DIPLO_ACTION_ACCEPTANCE_ADD$: §G+3§! (Max: §G+15§!)\n$tt$- $mod_country_produces_mult$: §G+2%§! (Max: §G+10%§!)\n$tt$- $MOD_DIPLO_WEIGHT_MULT$: §G+3%§! (Max: §G+15%§!)"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_b: "Brog's Obsession"
 leader_trait_libra_official_diplomacy_councilor_corrupt_destiny_b_desc: "This leader harbors a near-fanatical fascination for species with soft bodies- especially those with elongated tentacles.\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_official_economy_councilor_a: "Obsessive Collector"
 leader_trait_libra_corrupt_official_economy_councilor_a_desc: "Good things are meant to be hoarded."
 leader_trait_libra_corrupt_official_economy_councilor_b: "Starter Village Guide"
 leader_trait_libra_corrupt_official_economy_councilor_b_desc: "This is where the dream begins."
 leader_trait_libra_corrupt_official_economy_councilor_c: "Stellar Cryptids"
 leader_trait_libra_corrupt_official_economy_councilor_c_desc: "This administrator compiles and treats inter-stellar cryptid legends and rules horror as regional guidelines."
 leader_trait_libra_corrupt_official_economy_councilor_d: "Monopoly Tycoon"
 leader_trait_libra_corrupt_official_economy_councilor_d_desc: "Stonks!"

 leader_trait_libra_official_economy_councilor_corrupt_destiny_a: "New Era Mandate"
 leader_trait_libra_official_economy_councilor_corrupt_destiny_a_desc: "This leader offers unwavering support for the current regime's legitimacy, periodically issuing new directives to 'help' the populace embrace this identity.\n$libraf_lt_banner_24$"
 leader_trait_libra_official_economy_councilor_corrupt_destiny_b: "Fountain of Youth"
 leader_trait_libra_official_economy_councilor_corrupt_destiny_b_desc: "This administrator is obsessed with the mysterious yet sublime power from legends of old. While legends often stray from fact, the technology of this age can make them real.\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_scientist_explorer_a: "Forbidden Zone"
 leader_trait_libra_corrupt_scientist_explorer_a_desc: "That place is off-limits for exploration!"
 leader_trait_libra_corrupt_scientist_explorer_b: "Procrastinating Traveler"
 leader_trait_libra_corrupt_scientist_explorer_b_desc: "I'll explore the area ahead... tomorrow!"
 leader_trait_libra_corrupt_scientist_explorer_c: "Living Magnifying Glass"
 leader_trait_libra_corrupt_scientist_explorer_c_desc: "This science officer drives the crew to repeatedly verify scan data, ensuring no detail is overlooked."
 leader_trait_libra_corrupt_scientist_explorer_d: "Grand Deception"
 leader_trait_libra_corrupt_scientist_explorer_d_desc: "This science officer employs peak cloaking capabilities to achieve objectives."

 leader_trait_libra_scientist_explorer_corrupt_destiny_a: "Unbound Voyager"
 leader_trait_libra_scientist_explorer_corrupt_destiny_a_desc: "This explorer has grown weary of arduous and perilous daily duties. [this.GetHeShe] equips the science ship with robust armor and sensitive instruments, delegates piloting to the crew, outsources analysis to the homeworld, all to enjoy a carefree existence alone.\n$libraf_lt_banner_24$"
 leader_trait_libra_scientist_explorer_corrupt_destiny_b: "Stellar Echo"
 leader_trait_libra_scientist_explorer_corrupt_destiny_b_desc: "Distant worlds whisper distant hopes - the final wishes of those struggling to survive after civilization's unforeseen end.\n$libraf_lt_banner_25$"
 leader_trait_libra_scientist_explorer_corrupt_destiny_b_tt: "$t$- After surveying a §YStar§!:\n$tt$- Gain §G1.5§! months of £physics_research£ §Y$physics_research$§!\n$t$- After surveying an §YAsteroid§!:\n$tt$- Gain §G0.5§! months of £engineering_research£ §Y$engineering_research$§!\n$t$- After surveying an §YAstral Scar§!:\n$tt$- Gain §G7.5§! months of £society_research£ §Y$society_research$§!"


 leader_trait_libra_corrupt_scientist_scholar_a: "Eldritch Epiphany"
 leader_trait_libra_corrupt_scientist_scholar_a_desc: "Eerie whispers fill this scientist's mind; during relic excavations, [this.GetHeShe] occasionally strikes a miraculous shovel blow."
 leader_trait_libra_corrupt_scientist_scholar_b: "Beastmaster"
 leader_trait_libra_corrupt_scientist_scholar_b_desc: "This science officer knows how to net the largest haul of fauna in one sweep."
 leader_trait_libra_corrupt_scientist_scholar_c: "Beyond the Sky"
 leader_trait_libra_corrupt_scientist_scholar_c_desc: "Starry rivers above, twinkling lights below - what tales unfold in that other world?"
 leader_trait_libra_corrupt_scientist_scholar_d: "Spinach Mechanic"
 leader_trait_libra_corrupt_scientist_scholar_d_desc: "This science officer can direct maintenance crews to complete repair operations at ludicrously fast speeds."

 leader_trait_libra_scientist_scholar_corrupt_destiny_a: "Relic Plunderer"
 leader_trait_libra_scientist_scholar_corrupt_destiny_a_desc: "This science officer works diligently on archaeology's front lines, not to uncover hidden secrets, but to profit from millennia-old ruins.\n$libraf_lt_banner_24$"
 leader_trait_libra_scientist_scholar_corrupt_destiny_a_tt_1: "$t$- Per archaeology stage completed:\n$tt$- $mod_leader_scientists_minor_artifacts_produces_add$: §G+0.50§!"
 leader_trait_libra_scientist_scholar_corrupt_destiny_a_tt_2: "Upon completion of Archaeological Site:\n$tt$- Gain §G4§! months of £energy£ §Y$energy$§!, £trade£ §Y$trade$§! and £minor_artifacts£ §Y$minor_artifacts$§! output"
 leader_trait_libra_scientist_scholar_corrupt_destiny_b: "Free-Spirited Scholar"
 leader_trait_libra_scientist_scholar_corrupt_destiny_b_desc: "This scientist abandons rigid theoretical systems, seeking knowledge from across the stars. With sufficient funding for the crew, all research becomes possible.\n$libraf_lt_banner_25$"
 leader_trait_libra_scientist_scholar_corrupt_destiny_b_tt: "Per anomaly investigated:\n$tt$- $mod_leader_scientists_physics_research_produces_add$: §G+12§!\n$tt$- $mod_leader_scientists_society_research_produces_add$: §G+12§!\n$tt$- $mod_leader_scientists_engineering_research_produces_add$: §G+12§!"


 leader_trait_libra_corrupt_scientist_governor_a: "Catching Stars" 
 leader_trait_libra_corrupt_scientist_governor_a_desc: "Twinkle, twinkle, little star~"
 leader_trait_libra_corrupt_scientist_governor_b: "Super Battery"
 leader_trait_libra_corrupt_scientist_governor_b_desc: "This science officer equips research units with uniquely ringed energy storage, boosting research efficiency."
 leader_trait_libra_corrupt_scientist_governor_c: "Greenpeace Enforcer"
 leader_trait_libra_corrupt_scientist_governor_c_desc: "A member of the nature preservation initiative, this science officer rigorously scrutinizes and enforces related plans."
 leader_trait_libra_corrupt_scientist_governor_d: "Labor Dispatcher"
 leader_trait_libra_corrupt_scientist_governor_d_desc: "This science officer rapidly assigns idle personnel to where the work is."

 leader_trait_libra_scientist_governor_corrupt_destiny_a: "Academic OCD"
 leader_trait_libra_scientist_governor_corrupt_destiny_a_desc: "This science officer has very strict requirements for the experimental environment: all equipment must be neatly arranged, and all personnel must follow procedures step by step. Only then can [this.GetHeShe] perform at [this.GetHisHer] best.\n$libraf_lt_banner_24$"
 leader_trait_libra_scientist_governor_corrupt_destiny_a_tt_1: "$t$- $mod_planet_jobs_productive_produces_mult$: §G+30%§!\n$t$- $mod_planet_buildings_physics_research_produces_mult$: §G+40%§!\n$t$- $mod_planet_buildings_society_research_produces_mult$: §G+40%§!\n$t$- $mod_planet_buildings_engineering_research_produces_mult$: §G+40%§!\n$t$- Per §YColony Modifier§!:\n$tt$- $mod_planet_jobs_productive_produces_mult$: §R-6%§!"
 leader_trait_libra_scientist_governor_corrupt_destiny_a_tt_2: "$t$- $mod_planet_jobs_productive_produces_mult$: §G+15%§!\n$t$- $mod_planet_buildings_physics_research_produces_mult$: §G+20%§!\n$t$- $mod_planet_buildings_society_research_produces_mult$: §G+20%§!\n$t$- $mod_planet_buildings_engineering_research_produces_mult$: §G+20%§!\n$t$- Per §YColony Modifier§!:\n$tt$- $mod_planet_jobs_productive_produces_mult$: §R-3%§!"
 leader_trait_libra_scientist_governor_corrupt_destiny_b: "Mad Scientist"
 leader_trait_libra_scientist_governor_corrupt_destiny_b_desc: "Day after day, year after year, this analyst continues [this.GetHisHer] bizarre and grotesque experiments. None know what results they may yield, nor where the end of this research may lie.\n$libraf_lt_banner_25$"


 leader_trait_libra_corrupt_scientist_councilor_a: "Backseat Researcher"
 leader_trait_libra_corrupt_scientist_councilor_a_desc: "This science officer frequently offers unsolicited advice to juniors based on 'experience'."
 leader_trait_libra_corrupt_scientist_councilor_b: "Misinterpretation Analyst"
 leader_trait_libra_corrupt_scientist_councilor_b_desc: "This science officer appears deeply knowledgeable about relics, but it's mostly dumb luck."
 leader_trait_libra_corrupt_scientist_councilor_c: "Plan B Proponent"
 leader_trait_libra_corrupt_scientist_councilor_c_desc: "When the initial plan fails, this science officer swiftly pivots to alternative schemes to advance research."
 leader_trait_libra_corrupt_scientist_councilor_d: "Unconventional Tactician"
 leader_trait_libra_corrupt_scientist_councilor_d_desc: "This science officer always employs unconventional methods to direct research."

