 leader_trait_libra_scientist_governor_destiny_c: "Overclocked Scholar"
 leader_trait_libra_scientist_governor_destiny_c_desc: "Scientific research necessitates funding. This analyst generously allocates budgets, supplying every subordinate lab with ample rare resources, enabling researchers to experiment wholeheartedly without cost concerns.\n$libraf_lt_banner_21$"

 leader_trait_libra_scientist_governor_destiny_d: "Folk Academia"
 leader_trait_libra_scientist_governor_destiny_d_desc: "This analyst believes wisdom thrives in common streets. [this.GetHeShe] encourages citizens to invest extra rations into home experiments and spontaneous discussions - whether verifying chemical theories with kitchenware or calculating runic sequences on looms. When countless household windows glow with diligent study, [this.GetHeShe] moves among these starlit civilian think-tanks, weaving scattered sparks into systematic theoretical models.\n$libraf_lt_banner_21$"

 leader_trait_libra_scientist_governor_militarist: "Military-Industrial R&D"
 leader_trait_libra_scientist_governor_militarist_desc: "Technology proving valuable on the battlefield is truly useful technology. All research must aim to support military operations. This science officer develops and tests weapons technology during military exercises - the colonies [this.GetHeShe] oversees serve as both training grounds and proving grounds.\n$libraf_lt_banner_2$"

 leader_trait_libra_scientist_governor_pacifist: "Harmony Equation"
 leader_trait_libra_scientist_governor_pacifist_desc: "Harmony is this science officer's ultimate pursuit. Every step of the rationally-guided equation signifies abundance. Here, all unconsumed moments of peace eventually flow into the lab's tranquil pool, crystallizing into stars of pure reason.\n$libraf_lt_banner_3$"
