 leader_trait_libra_synthetic_scientist_explorer_c: "Treasure Hunt Procedure"
 leader_trait_libra_synthetic_scientist_explorer_c_desc: "While researching the galactic environment, this program also collects valuable celestial debris or easily mined mineral deposits."
