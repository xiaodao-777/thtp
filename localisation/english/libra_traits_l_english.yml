 leader_trait_libra_synthetic_scientist_scholar_b: "Astral Design"
 leader_trait_libra_synthetic_scientist_scholar_b_desc: "This Science Officer's processing program allows for productive insights from the astral realm, as well as the extraction of more rare substances from the rift."
