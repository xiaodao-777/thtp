 leader_trait_libra_scientist_governor_authoritarian: "Academic Overlord"
 leader_trait_libra_scientist_governor_authoritarian_desc: "Wisdom only crystallizes into civilization's tools when enshrined on the altar of hierarchy. Scholars in ivory towers savor specially-brewed coffee from extra rations, while researchers in lower labs sigh silently under heavy workloads. Yet none dare voice discontent openly - for achieving sufficient research results remains their only path to class advancement.\n$libraf_lt_banner_4$"
