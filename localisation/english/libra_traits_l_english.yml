 concept_libra_radiation_adaptability: "Radiation Adaptability"
 concept_libra_radiation_adaptability_desc: "Species possessing any of the following traits will be considered to have §Y$concept_libra_radiation_adaptability$§!:\n$t$- ['trait:trait_plantoid_radiotrophic']\n$t$- ['trait:trait_presapient_irradiated']\n$t$- ['trait:trait_pc_nuked_preference']"

 SPECIES_TRAIT_LIBRA_HUMANOID: "§E$libra_mod_name$§! ['concept_libra_humanoid_traits']"
 concept_libra_humanoid_traits: "Humanoid Species Traits"
 concept_libra_humanoid_traits_desc: "Phenotypic species traits applicable to §Y$HUM$§!, including:\n$t$- ['trait:trait_libra_humanoid_0']\n$t$- ['trait:trait_libra_humanoid_1']\n$t$- ['trait:trait_libra_humanoid_2']\n$t$- ['trait:trait_libra_humanoid_3']\n$t$- ['trait:trait_libra_humanoid_4']\n$t$- ['trait:trait_libra_humanoid_5']\n$t$- ['trait:trait_libra_humanoid_6']\n$t$- ['trait:trait_libra_humanoid_7']\n$t$- ['trait:trait_libra_humanoid_8']\n$t$- ['trait:trait_libra_humanoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_humanoid_0: "Iron Skeleton"
 trait_libra_humanoid_0_desc: "This upright species has evolved an excellent nervous system and spinal structure that doesn't break easily from impact or make low-level errors in transmitting nerve signals."
 trait_libra_humanoid_1: "Past Master"
 trait_libra_humanoid_1_desc: "This humanoid species has flexible limbs and they operate tools with ease."
 trait_libra_humanoid_2: "Agelong Starburst"
 trait_libra_humanoid_2_desc: "For the continuation of the faith, these humanoids gather under the same banner to keep relaying - even if that banner may be contrary to the Empire."
 trait_libra_humanoid_3: "Evergreen Olive"
 trait_libra_humanoid_3_desc: "This humanoid species yearns for peace, and they long for the continuation of prosperity."
 trait_libra_humanoid_4: "Veteran Banneret"
 trait_libra_humanoid_4_desc: "Since its journey through strife and war, this humanoid species has developed a tradition of self-realisation amidst the smoke and mirrors."
 trait_libra_humanoid_5: "New Scrolls"
 trait_libra_humanoid_5_desc: "This humanoid species values classical traditions, and they are generally highly philosophical."
 trait_libra_humanoid_6: "Eclectic Eager"
 trait_libra_humanoid_6_desc: "With a desire to excel, these humanoids set out on the path of no return between the stars."
 trait_libra_humanoid_7: "Outstandingly Intelligent"
 trait_libra_humanoid_7_desc: "Long-term evolution has endowed this humanoid species with an extremely high level of intelligence, and they have thus produced a brilliant civilisation."
 trait_libra_humanoid_8: "Merchantability"
 trait_libra_humanoid_8_desc: "These humanoids are extremely business minded and they profit greatly from their business actions."
 trait_libra_humanoid_9: "Dressed Gentleman"
 trait_libra_humanoid_9_desc: "These humanoid creatures had extraordinary faces and seemed to have the manners of a gentleman."

 SPECIES_TRAIT_LIBRA_MAM: "§E$libra_mod_name$§! ['concept_libra_mammalian_traits']"
 concept_libra_mammalian_traits: "Mammalian Species Traits"
 concept_libra_mammalian_traits_desc: "Phenotypic species traits applicable to §Y$MAM$§!, including:\n$t$- ['trait:trait_libra_mammalian_0']\n$t$- ['trait:trait_libra_mammalian_1']\n$t$- ['trait:trait_libra_mammalian_2']\n$t$- ['trait:trait_libra_mammalian_3']\n$t$- ['trait:trait_libra_mammalian_4']\n$t$- ['trait:trait_libra_mammalian_5']\n$t$- ['trait:trait_libra_mammalian_6']\n$t$- ['trait:trait_libra_mammalian_7']\n$t$- ['trait:trait_libra_mammalian_8']\n$t$- ['trait:trait_libra_mammalian_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_mammalian_0: "Advanced Mammary Glands"
 trait_libra_mammalian_0_desc: "This mammalian species possesses glands that secrete nutrient-rich milk in substantial quantities."
 trait_libra_mammalian_0_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R0.5§!£food£ §Y$food$§! to produce §G0.5§!£food£ §Y$food$§! per month\n$t$- When §YSpecies $GENDER$§! is §Y$female$§!:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+30%§!\n$t$- When §YSpecies $GENDER$§! is §Yother§!:\n$tt$- $farmer_jobs_bonus_workforce_mult$: §G+40%§!"
 trait_libra_mammalian_1: "Adaptive Fur"
 trait_libra_mammalian_1_desc: "This species develops fur during life stages for thermoregulation, protection, or social signaling."
 trait_libra_mammalian_1_tooltip: "Before §YColony Age§! reaches §Y8§! years:\n$tt$- $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+30%§!\n$t$- After §YColony Age§! reaches §Y8§! years:\n$tt$- $worker_and_simple_drone_cat_bonus_workforce_mult$: §G+5%§!\n$tt$- $specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+10%§!"
 trait_libra_mammalian_2: "Bone Conduction Hearing"
 trait_libra_mammalian_2_desc: "Enhanced auditory ossicles grant superior sound sensitivity compared to other species."
 trait_libra_mammalian_2_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.25§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_mammalian_3: "Diaphragmatic Respiration"
 trait_libra_mammalian_3_desc: "A specialized diaphragm separates thoracic and abdominal cavities, boosting pulmonary efficiency and stamina."
 trait_libra_mammalian_4: "Advanced Neocortex"
 trait_libra_mammalian_4_desc: "Proportionally large brains house highly evolved cortices, enabling exceptional learning, problem-solving, and social cognition."
 trait_libra_mammalian_5: "Precision Thermoregulation"
 trait_libra_mammalian_5_desc: "Homeothermic animals are not uncommon, but few species have evolved such an efficient and complex warm-blooded mechanism, enabling them to remain active across a wide range of environmental temperatures."
 trait_libra_mammalian_5_tooltip: "$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+15%§!\n$t$- $MOD_ARMY_HEALTH$: §G+50%§!\n$t$- For each §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+1%§! (Max: §G+10%§!)"
 trait_libra_mammalian_6: "Heterodont Dentition"
 trait_libra_mammalian_6_desc: "Through a long process of evolution and specialization, the teeth of this mammal species have differentiated into different types, enabling it to use teeth in different positions to perform different functions."
 trait_libra_mammalian_7: "Baby Bag"
 trait_libra_mammalian_7_desc: "This mammal species has a pouch that allows the young to continue developing outside the body until they reach a stage where they are capable of certain behaviors."
 trait_libra_mammalian_7_tooltip: "When the §YColony Age§! is less than §Y5§! years:\n$tt$- Each £pop£ §YPop Group§! gain §G+0.50§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_mammalian_8: "Ruminant Digestion"
 trait_libra_mammalian_8_desc: "This mammal species uses its multi-chambered stomach to pre-digest food, then regurgitates it back into its mouth to chew again, enabling it to digest nutrients such as cellulose more efficiently."
 trait_libra_mammalian_9: "Polyembryonic Birth"
 trait_libra_mammalian_9_desc: "This mammal species has multiple uteruses and frequent estrus cycles, which greatly accelerates their population growth. However, the large increase in population significantly consumes the carrying capacity of the environment."
 trait_libra_mammalian_9_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! provides §G0.02§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"

 SPECIES_TRAIT_LIBRA_MOL: "§E$libra_mod_name$§! ['concept_libra_molluscoid_traits']"
 concept_libra_molluscoid_traits: "Molluscoid Species Traits"
 concept_libra_molluscoid_traits_desc: "Phenotypic species traits applicable to §Y$MOL$§!, including:\n$t$- ['trait:trait_libra_molluscoid_0']\n$t$- ['trait:trait_libra_molluscoid_1']\n$t$- ['trait:trait_libra_molluscoid_2']\n$t$- ['trait:trait_libra_molluscoid_3']\n$t$- ['trait:trait_libra_molluscoid_4']\n$t$- ['trait:trait_libra_molluscoid_5']\n$t$- ['trait:trait_libra_molluscoid_6']\n$t$- ['trait:trait_libra_molluscoid_7']\n$t$- ['trait:trait_libra_molluscoid_8']\n$t$- ['trait:trait_libra_molluscoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_molluscoid_0: "Mantle"
 trait_libra_molluscoid_0_desc: "This species possesses a superior mantle that secretes calcium carbonate and organic material at a lower metabolic cost to reinforce the shell, while also aiding in daily activities."
 trait_libra_molluscoid_1: "Radula"
 trait_libra_molluscoid_1_desc: "This ribbon-like, chitinous, file-shaped structure allows its owner to rapidly grind down food- or any other necessary material."
trait_libra_molluscoid_1_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.10§! £alloys£ §Y$alloys$§! per month"
 trait_libra_molluscoid_1_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.10§!£alloys£ §Y$alloys$§! per month"
 trait_libra_molluscoid_2: "Muscular Foot"
 trait_libra_molluscoid_2_desc: "A foot composed of muscle grants this species excellent mobility; for predators, it also serves as a fine food source."
 trait_libra_molluscoid_2_tooltip: "$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+15%§!\n$t$- For each §YNegative $TRAIT_TITLE$§! owned:\n$tt$- $livestock_jobs_bonus_workforce_mult$: §G+25%§!"
 trait_libra_molluscoid_3: "Open Circulatory System"
 trait_libra_molluscoid_3_desc: "This molluscoid species has a relatively simple circulatory system. While it lacks some capacity for complex activities, it excels in stability and low energy consumption."
 trait_libra_molluscoid_4: "Specialized Respiration"
 trait_libra_molluscoid_4_desc: "This molluscoid species can respire through its skin or cloaca, enhancing its activity levels and environmental adaptability."
 trait_libra_molluscoid_5: "Extreme Intelligence"
 trait_libra_molluscoid_5_desc: "This cephalopod species has evolved a highly complex brain and advanced sensory organs, exhibiting remarkable abilities in learning, memory, problem-solving, and tool use."
 trait_libra_molluscoid_6: "Filter-Feeding Specialization"
 trait_libra_molluscoid_6_desc: "Highly specialized filter-feeding structures, combined with a ciliary system, allow this species to efficiently extract food particles from fluids."
 trait_libra_molluscoid_6_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.50§!£engineering_research£ §Y$engineering_research$§! per month"
 trait_libra_molluscoid_7: "Biofluorescence"
 trait_libra_molluscoid_7_desc: "These molluscoid species possess bioluminescent capabilities, which can be used to lure prey, confuse predators, or attract mates."
 trait_libra_molluscoid_7_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! provides §G0.01§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_molluscoid_8: "Mimetic Morphing"
 trait_libra_molluscoid_8_desc: "Beyond mere color change, this cephalopod species can mimic the natural environment or other species to an exceptional degree, leaving them with virtually no natural predators."
 trait_libra_molluscoid_8_tooltip: "For each Species in the Colony:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+2%§! (Max: §G+10%§!)\n$tt$- $MOD_POP_POLITICAL_POWER$: §G+10%§! (Max: §G+50%§!)"
 trait_libra_molluscoid_9: "Tentacles"
 trait_libra_molluscoid_9_desc: "Tentacles serve a multitude of purposes- from feeding and manipulation to social interaction and reproduction- there is no domain they cannot facilitate."
 trait_libra_molluscoid_9_tooltip: "For every $pop_group_unit$ £pop£ §Y$POP$§! in the Colony:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+1%§! (Max: §G+15%§!)"

 SPECIES_TRAIT_LIBRA_FUN: "§E$libra_mod_name$§! ['concept_libra_fungoid_traits']"
 concept_libra_fungoid_traits: "Fungoid Species Traits"
 concept_libra_fungoid_traits_desc: "Phenotypic species traits applicable to §Y$FUN$§!, including:\n$t$- ['trait:trait_libra_fungoid_0']\n$t$- ['trait:trait_libra_fungoid_1']\n$t$- ['trait:trait_libra_fungoid_2']\n$t$- ['trait:trait_libra_fungoid_3']\n$t$- ['trait:trait_libra_fungoid_4']\n$t$- ['trait:trait_libra_fungoid_5']\n$t$- ['trait:trait_libra_fungoid_6']\n$t$- ['trait:trait_libra_fungoid_7']\n$t$- ['trait:trait_libra_fungoid_8']\n$t$- ['trait:trait_libra_fungoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_fungoid_0: "Lichen Symbiosis"
 trait_libra_fungoid_0_desc: "This symbiotic complex can adapt to extreme climates and secrete precious biological hormones, yet possesses weaker resistance to pollution."
 trait_libra_fungoid_0_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.02§!£exotic_gases£ §Y$exotic_gases$§! per month"
 trait_libra_fungoid_1: "Spore Emission"
 trait_libra_fungoid_1_desc: "Serving both as a means of reproduction and self-defense, the特殊 spores released by this species can cause significant trouble for animals - after all, respiratory infections are no small matter."
 trait_libra_fungoid_1_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.01§!£volatile_motes£ §Y$volatile_motes$§! per month\n$t$- When other species are present on the colony:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!"
 trait_libra_fungoid_2: "Thermophilic"
 trait_libra_fungoid_2_desc: "High ambient temperatures have never been a problem - so long as you can absorb and utilize them like this fungal species does."
 trait_libra_fungoid_3: "Anaerobic"
 trait_libra_fungoid_3_desc: "Perhaps it's not just oxygen; this fungal species' minimum requirement for atmospheric gases is extraordinarily low. Or rather, they simply have no need for them."
 trait_libra_fungoid_4: "Bioluminescent"
 trait_libra_fungoid_4_desc: "These fungi can emit fluorescence under particular conditions, transmitting signals understood only by themselves."
 trait_libra_fungoid_4_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.50§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_fungoid_5: "Hyphal Network"
 trait_libra_fungoid_5_desc: "Connecting through interwoven hyphae, this fungal species gradually constructs a vast information network within their habitat, enhancing any member linked to it."
 trait_libra_fungoid_5_tooltip: "For each level of §YPlanetary Capital§! on the colony:\n$tt$- $worker_and_simple_drone_cat_bonus_workforce_mult$: §G+5%§!"
 trait_libra_fungoid_6: "Dimorphic Optimization"
 trait_libra_fungoid_6_desc: "This fungal species can actively switch between mycelial and yeast forms at a lower cost. Though they once struggled to alter their environment, they can always reap maximum benefits from change."
 trait_libra_fungoid_6_tooltip: "When the colony has a £food£ §Y$food$§! deficit:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+6%§!\n$t$- When the colony has a £food£ §Y$food$§! surplus:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+40%§!"
 trait_libra_fungoid_7: "Neural Parasitism"
 trait_libra_fungoid_7_desc: "The initial prosperity of this fungal species originated from the enslavement of other organisms. Delicate hyphae infiltrate every ganglion of the host, transforming them into puppets bereft of self."
 trait_libra_fungoid_7_tooltip: "When on colonies established by other civilizations:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!\n$tt$- $MOD_BONUS_POP_GROWTH_MULT$: §G+10%§!"
 trait_libra_fungoid_8: "Hallucinogenic Toxin"
 trait_libra_fungoid_8_desc: "These fungi can release extremely potent neurotoxins, inducing profoundly realistic hallucinations in those who ingest them."
 trait_libra_fungoid_8_tooltip: "For each §YPositive $TRAIT_TITLE$§! owned:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.10§!£society_research£ §Y$society_research$§! per month"
 trait_libra_fungoid_9: "Persistent Fission"
 trait_libra_fungoid_9_desc: "To perpetuate the species through various catastrophes, this fungal species evolved a relatively aberrant pheromone, turning their instinctive response to danger into the release of spores."
 trait_libra_fungoid_9_tooltip: "During wartime:\n$tt$- $MOD_BONUS_POP_GROWTH_MULT$: §G+15%§!\n$t$- When colony §YDevastation§! is above §Y35§!:\n$tt$- £pop£ §YPop Groups§! with a size not less than §Y1000§! gain §G+1§! £mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"

 SPECIES_TRAIT_LIBRA_PLANT: "§E$libra_mod_name$§! ['concept_libra_plantoid_traits']"
 concept_libra_plantoid_traits: "Plantoid Species Traits"
 concept_libra_plantoid_traits_desc: "Phenotypic species traits applicable to §Y$PLANT$§!, including:\n$t$- ['trait:trait_libra_plantoid_0']\n$t$- ['trait:trait_libra_plantoid_1']\n$t$- ['trait:trait_libra_plantoid_2']\n$t$- ['trait:trait_libra_plantoid_3']\n$t$- ['trait:trait_libra_plantoid_4']\n$t$- ['trait:trait_libra_plantoid_5']\n$t$- ['trait:trait_libra_plantoid_6']\n$t$- ['trait:trait_libra_plantoid_7']\n$t$- ['trait:trait_libra_plantoid_8']\n$t$- ['trait:trait_libra_plantoid_9']\n$t$- ['trait:trait_libra_plantoid_10']\n$libra_mod_species_trait_tooltip$"
 trait_libra_plantoid_0: "Infinite Growth"
 trait_libra_plantoid_0_desc: "Thanks to the existence of meristematic tissue, these plants can continuously produce new organs throughout their life cycle, with their growth limits determined more by the environment than by their genes."
 trait_libra_plantoid_0_tooltip: "When there are free £amenities£ §Y$PLANET_AMENITIES_TITLE$§! and £job£ §YJobs§!:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! provides §G0.03§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_plantoid_1: "Tumbleweed"
 trait_libra_plantoid_1_desc: "When the seeds mature or the environment changes, these round plants retract their roots and travel with the wind until they reach their new home."
 trait_libra_plantoid_1_tooltip: "When there are free £housing£ §YHousing§! and £job£ §YJobs§!:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!\n$tt$- $MOD_BONUS_POP_GROWTH_MULT$: §G+20%§!"
 trait_libra_plantoid_2: "Double Fertilization"
 trait_libra_plantoid_2_desc: "These angiosperms have a unique fertilization phenomenon: one sperm cell combines with the egg cell to form a zygote, while another sperm cell combines with the two polar nuclei to form a fertilized polar nucleus."
 trait_libra_plantoid_3: "Flowering buds"
 trait_libra_plantoid_3_desc: "These rare plants have very strict environmental requirements, but in ideal conditions, this species has unparalleled advantages."
 trait_libra_plantoid_4: "Predatory Flora"
 trait_libra_plantoid_4_desc: "This plant species evolved on barren land, no longer loyal to its position as a producer, but instead using specialized leaf structures to capture prey to supplement its nutrition."
 trait_libra_plantoid_4_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G2§!£food£ §Y$food$§! per month\n$t$- Can generate §Y$libra_plantoid_species_trait_army$§! defensive armies"
 libra_plantoid_species_trait_army: "Flytrap Ambushers"
 libra_plantoid_species_trait_army_desc: "These deadly hunters lie in wait across the planet, waiting for their prey to walk into their traps."
 trait_libra_plantoid_5: "Secondary Growth"
 trait_libra_plantoid_5_desc: "The vascular cambium activity of these woody plants produces secondary xylem and secondary phloem, causing the stems and roots to thicken continuously, providing strong support and long-term channels for material transport."
 trait_libra_plantoid_5_tooltip: "When the colony has £trade£ §Y$trade$§! surplus:\n$tt$- $trader_jobs_bonus_workforce_mult$: §G+15%§!"
 trait_libra_plantoid_6: "Rhizobial Symbiosis"
 trait_libra_plantoid_6_desc: "The roots of this plant species form nodules in symbiosis with rhizobia, which convert nutrients that are difficult to absorb from the air into a usable form."
 trait_libra_plantoid_6_tooltip: "$farmer_jobs_bonus_workforce_mult$: §G+10%§!\n$t$- For each §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $farmer_jobs_bonus_workforce_mult$: §G+5%§! (Max: §G+35%§!)"
 trait_libra_plantoid_7: "Vascular Tissue"
 trait_libra_plantoid_7_desc: "As a vascular plant, this species' conductive tissue can effectively transport nutrients, enabling it to grow taller."
 trait_libra_plantoid_7_tooltip: "When there is free £housing£ §YHousing§!:\n$tt$- $worker_and_simple_drone_cat_bonus_workforce_mult$: §G+15%§!\n$tt$- $specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+10%§!\n$tt$- $mod_pop_cat_ruler_bonus_workforce_mult$: §G+10%§!"
 trait_libra_plantoid_8: "Alternation of Generations"
 trait_libra_plantoid_8_desc: "The characteristics of the spore-bearing generation and the gamete-bearing generation of this species differ greatly, and they use these differences to occupy a larger share of the limited environment."
 trait_libra_plantoid_8_tooltip: "When having population advantage in colony:\n$tt$- $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+30%§!\n$t$- When there is no population advantage in colony:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+30%§!"
 trait_libra_plantoid_9: "Rose Thorns"
 trait_libra_plantoid_9_desc: "The sharp thorns are a natural armor that this plant species has acquired through evolution, protecting it from animal damage."
 trait_libra_plantoid_9_tooltip: "Every $pop_group_unit$ £pop£ §YWorking $POP$§! produces §G0.20§!£unity£ §Y$unity$§! per month"
 trait_libra_plantoid_10: "Mandragora Roars"
 trait_libra_plantoid_10_desc: "This plant species can emit a scream at an astonishing volume, stunning and paralyzing surrounding organisms with its sharp, piercing sound."
 trait_libra_plantoid_10_tooltip: "Every $pop_group_unit$ £pop_cat_specialist£ §Y$pop_cat_specialist_plural$§! or £pop_cat_complex_drone£ §Y$pop_cat_complex_drone_plural$§! £pop£ §Y$POP$§! produces §G0.50§!£physics_research£ §G1§!£society_research£ §YResearch Points§! per month\n$t$- Every $pop_group_unit$ £pop_cat_worker£ §Y$pop_cat_worker_plural$§! or £pop_cat_simple_drone£ §Y$pop_cat_simple_drone_plural$§! £pop£ §Y$POP$§! produces §G0.50§!£physics_research£ §G0.50§!£society_research£ §YResearch Points§! per month"

 SPECIES_TRAIT_LIBRA_LITHOID: "§E$libra_mod_name$§! ['concept_libra_lithoid_traits']"
 concept_libra_lithoid_traits: "Lithoid Species Traits"
 concept_libra_lithoid_traits_desc: "Phenotypic species traits applicable to §Y$LITHOID$§!, including:\n$t$- ['trait:trait_libra_lithoid_0']\n$t$- ['trait:trait_libra_lithoid_1']\n$t$- ['trait:trait_libra_lithoid_2']\n$t$- ['trait:trait_libra_lithoid_3']\n$t$- ['trait:trait_libra_lithoid_4']\n$t$- ['trait:trait_libra_lithoid_5']\n$t$- ['trait:trait_libra_lithoid_6']\n$t$- ['trait:trait_libra_lithoid_7']\n$t$- ['trait:trait_libra_lithoid_8']\n$t$- ['trait:trait_libra_lithoid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_lithoid_0: "Radiant"
 trait_libra_lithoid_0_desc: "The core minerals that make up this lithoid species contain high levels of radioactive elements, which have a notable impact on the surrounding environment."
 trait_libra_lithoid_0_tooltip: "If ['concept_libra_radiation_adaptability'] is present:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! provides §G0.05§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!\n$t$- If ['concept_libra_radiation_adaptability'] is not present:\n$tt$- Grants between §G+10%§! and §G+40%§! $MOD_LOGISTIC_GROWTH_MULT$, proportional to the number of pops on the planet."
 trait_libra_lithoid_1: "Plumbago"
 trait_libra_lithoid_1_desc: "Morphologically specific carbon forms the main structure of this lithoid species, and they are pliable and stable enough to adapt to the extreme environments that affect most lithoid organisms so much."
 trait_libra_lithoid_1_tooltip: "$MOD_HABITABILITY_FLOOR$: §G+50%§!\n$t$- For each §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $mod_planet_pops_upkeep_mult$: §G-2%§! (Max: §G-20%§!)\n$tt$- $researcher_jobs_bonus_workforce_mult$: §G+3%§! (Max: §G+30%§!)"
 trait_libra_lithoid_2: "Corundum"
 trait_libra_lithoid_2_desc: "This lithoid species is hard and unobtrusive, and they benefit from excellent physical and chemical properties."
 trait_libra_lithoid_2_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R0.50§!£minerals£ §Y$minerals$§!\n$t$- Very $pop_group_unit$ £pop_cat_civilian£ §Y$pop_cat_civilian_plural$§! and £pop_cat_maintenance_drone£ §Y$pop_cat_maintenance_drone_plural$§! £pop£ §Y$POP$§! consumes §R0.50§!£energy£ §Y$energy$§!"
 trait_libra_lithoid_3: "Fluorite"
 trait_libra_lithoid_3_desc: "This lithoid species is bright in appearance but brittle and soft in texture, which is fortunately compensated for by the wide range of minerals that co-exist with them."
 trait_libra_lithoid_4: "Barite"
 trait_libra_lithoid_4_desc: "This lithoid species is unusually soft and fragile compared to other congeners, they are less adaptable but reproduce more rapidly, and survive in an environment closer to most organic species."
 trait_libra_lithoid_5: "Meteors"
 trait_libra_lithoid_5_desc: "In the past they travelled with meteorites, but now they travel in spaceships and cross borders."
 trait_libra_lithoid_5_tooltip: "Colonial Completion:\n$t$$d_buried_lithoids$: §Y+2§!"
 trait_libra_lithoid_6: "Amaranthus Tricolor"
 trait_libra_lithoid_6_desc: "The lattice of this lithoid species grows wildly in an alien way, piercing the surface of the body to form dangerous spikes."
 trait_libra_lithoid_6_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.15§!£alloys£ §Y$alloys$§! per month"
 trait_libra_lithoid_7: "Resonance"
 trait_libra_lithoid_7_desc: "This lithoid species is capable of passively tuning the population balance through core structure resonance."
 trait_libra_lithoid_7_tooltip: "$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+20%§!\n$t$- Each £pop£ §YPop Group§! gain §G+0.10§! $MOD_BONUS_POP_GROWTH$\n$t$- Grants between §R-30%§! and §G+30%§! $MOD_LOGISTIC_GROWTH_MULT$, inversely proportional to the number of pops on the planet.\n$t$- Grants between §G+30%§! and §R-30%§! $MOD_BONUS_POP_GROWTH_MULT$, inversely proportional to the number of pops on the planet."
 trait_libra_lithoid_8: "Heteromorphism"
 trait_libra_lithoid_8_desc: "Although the main components that make up this lithoid species are essentially the same, their crystal structures are not identical, which makes them quite individually different from each other, and the areas in which they specialise are worlds apart."
 trait_libra_lithoid_8_tooltip: "When in an §Y$climate_wet$§! environment:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+8%§!\n$t$- When in an §Y$climate_dry$§! environment:\n$tt$- $MOD_POP_HOUSING_USAGE_MULT$: §G-40%§!\n$t$- When in an §Y$climate_cold$§! environment:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.35§!£physics_research£ §G0.35§!£society_research£ §G0.35§!£engineering_research£ §YResearch Points§!\n$t$- When in §YOther§! environments:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!"
 trait_libra_lithoid_9: "Crystals Symbiosis"
 trait_libra_lithoid_9_desc: "Special evolutionary processes have mixed a number of different mineral components, culminating in this particular lithoid species."
 trait_libra_lithoid_9_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.02§!£exotic_gases£ §G0.02§!£rare_crystals£ §G0.02§!£volatile_motes£ §YRare Resource§!"

 SPECIES_TRAIT_LIBRA_NECROID: "§E$libra_mod_name$§! ['concept_libra_necroid_traits']"
 concept_libra_necroid_traits: "Necroid Species Traits"
 concept_libra_necroid_traits_desc: "Phenotypic species traits applicable to §Y$NECROID$§!, including:\n$t$- ['trait:trait_libra_necroid_0']\n$t$- ['trait:trait_libra_necroid_1']\n$t$- ['trait:trait_libra_necroid_2']\n$t$- ['trait:trait_libra_necroid_3']\n$t$- ['trait:trait_libra_necroid_4']\n$t$- ['trait:trait_libra_necroid_5']\n$t$- ['trait:trait_libra_necroid_6']\n$t$- ['trait:trait_libra_necroid_7']\n$t$- ['trait:trait_libra_necroid_8']\n$t$- ['trait:trait_libra_necroid_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_necroid_0: "Witch-Lord"
 trait_libra_necroid_0_desc: "Necromantic creatures with a high degree of intelligence are quite potent beings, and they show considerable leadership."
 trait_libra_necroid_1: "Winding Sheet"
 trait_libra_necroid_1_desc: "This necromantic species is wrapped in layers of fabric impregnated with spices, which isolates it from harmful external entities."
 trait_libra_necroid_2: "Carving in Blood"
 trait_libra_necroid_2_desc: "This necromorphic species has trauma-like blood markings all over their body, a symbol of their cultural identity."
 trait_libra_necroid_3: "Murderous Dictator"
 trait_libra_necroid_3_desc: "This necromorphic species thirsts for killing, and on the battlefield they would be the most dangerous warriors."
 trait_libra_necroid_3_tooltip: "$libra_army_type$§Y$libra_necroid_species_trait_army$§!"
 libra_necroid_species_trait_army: "Killer Necroid"
 libra_necroid_species_trait_army_desc: "This Army is composed entirely of an extremely bloodthirsty species."
 trait_libra_necroid_4: "Scythe of Death"
 trait_libra_necroid_4_desc: "This necromantic species is able to draw strength from the withering of other beings."
 trait_libra_necroid_4_tooltip: "Per cumulative purification of $pop_group_unit$ £pop£ §Y$POP$§!:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+0.03%§! (Max: §G+15%§!)"
 trait_libra_necroid_5: "The Forgotten"
 trait_libra_necroid_5_desc: "As if forgotten by the world, this necromantic species has no presence to speak of."
 trait_libra_necroid_6: "Living Dead"
 trait_libra_necroid_6_desc: "Whether this species is alive or dead, even they themselves cannot say, but what is certain is that they are powerful and indomitable."
 trait_libra_necroid_6_tooltip: "$MOD_ARMY_DAMAGE_MULT$: §G+50%§!\n$t$- For each §YNegative $TRAIT_TITLE$§! owned:\n$tt$- $mod_planet_jobs_worker_only_produces_mult$: §G+7.5%§!"
 trait_libra_necroid_7: "Sewing Organism"
 trait_libra_necroid_7_desc: "This completely incongruous species of Necromancer looked as if it had been assembled from the body tissues of several different individuals - why was that? Who knows."
 trait_libra_necroid_7_tooltip: "For each §YNegative $TRAIT_TITLE$§! owned:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+3%§!"
 trait_libra_necroid_8: "Pacemaker"
 trait_libra_necroid_8_desc: "Regret, horror, resentment, unease ...... In those places where civilisation once flourished, the wounds of history nourish these necroids to grow again."
 trait_libra_necroid_8_tooltip: "When in §Y$pc_nuked$§! or §Y$pc_relic$§!:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+20%§!"
 trait_libra_necroid_9: "Life-absorbing"
 trait_libra_necroid_9_desc: "Death is the end for other species, but, the withering of others heralds the new birth of these necroids."
 trait_libra_necroid_9_tooltip: "When the colony performs §YPurification§!:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+135%§!\n$tt$- $MOD_BONUS_POP_GROWTH_MULT$: §G+45%§!"

 SPECIES_TRAIT_LIBRA_AQUATIC: "§E$libra_mod_name$§! ['concept_libra_aquatic_traits']"
 concept_libra_aquatic_traits: "Aquatic Species Traits"
 concept_libra_aquatic_traits_desc: "Phenotypic species traits applicable to §Y$AQUATIC$§!, including:\n$t$- ['trait:trait_libra_aquatic_0']\n$t$- ['trait:trait_libra_aquatic_1']\n$t$- ['trait:trait_libra_aquatic_2']\n$t$- ['trait:trait_libra_aquatic_3']\n$t$- ['trait:trait_libra_aquatic_4']\n$t$- ['trait:trait_libra_aquatic_5']\n$t$- ['trait:trait_libra_aquatic_6']\n$t$- ['trait:trait_libra_aquatic_7']\n$t$- ['trait:trait_libra_aquatic_8']\n$t$- ['trait:trait_libra_aquatic_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_aquatic_0: "Big Frame"
 trait_libra_aquatic_0_desc: "The low gravity burden has allowed this aquatic species to evolve large bodies, each of their individuals being a small ecosystem."
 trait_libra_aquatic_0_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.50§!£society_research£ §Y$society_research$§! per month"
 trait_libra_aquatic_1: "Antenna"
 trait_libra_aquatic_1_desc: "This aquatic species has many tentacles and is able to do many things that other species cannot."
 trait_libra_aquatic_1_tooltip: "When §YSpecies $GENDER$§! is §Y$female$§!:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+35%§!\n$t$- When §YSpecies $GENDER$§! is §Y$male$§!:\n$tt$- $MOD_BONUS_POP_GROWTH_MULT$: §G+20%§!\n$t$- When §YSpecies $GENDER$§! is §Yother§!:\n$tt$- $influential_jobs_bonus_workforce_mult$: §G+35%§!"
 trait_libra_aquatic_2: "Hermit Crab"
 trait_libra_aquatic_2_desc: "This species has evolved a dependence on living places abandoned by other species, who may be good processors, but are not suitable as producers."
 trait_libra_aquatic_3: "Cavity"
 trait_libra_aquatic_3_desc: "This aquatic species possesses a robust outer structure along with multiple chambers within the body, which enhances their ability to stabilise their activities in different environments."
 trait_libra_aquatic_4: "Congregate"
 trait_libra_aquatic_4_desc: "This aquatic species has always formed colonies with large numbers of individuals, using the strength of the group to seek survival."
 trait_libra_aquatic_4_tooltip: "For each §YNegative $TRAIT_TITLE$§! owned:\n$tt$- $MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-5%§!\n$tt$- $MOD_POP_HOUSING_USAGE_ADD$: §G-5%§!"
 trait_libra_aquatic_5: "Wandering"
 trait_libra_aquatic_5_desc: "The history of the evolution of this aquatic species is the history of wanderlust, and it is a miracle that civilisation has evolved for them, who go with the flow."
 trait_libra_aquatic_5_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! provides §G0.01§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"
 trait_libra_aquatic_6: "Polygamous"
 trait_libra_aquatic_6_desc: "Waters are home to this aquatic species, but not exclusively: they can also survive in dry conditions if necessary."
 trait_libra_aquatic_6_tooltip: "When in an §Y$climate_wet$§! environment:\n$tt$- $worker_and_simple_drone_cat_bonus_workforce_mult$: §G+12.5%§!\n$t$- Not in §Y$climate_wet$§! environment:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+20%§!"
 trait_libra_aquatic_7: "Wide Pharynx"
 trait_libra_aquatic_7_desc: "This aquatic species are big eaters, they can eat anything and also use what they eat further."
 trait_libra_aquatic_7_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.25§!£minerals£ §Y$minerals$§! per month"
 trait_libra_aquatic_8: "Bait Fishing"
 trait_libra_aquatic_8_desc: "This aquatic species is adept at releasing bait to catch prey, and they've taken that experience into space."
 trait_libra_aquatic_9: "Pearl Mussel"
 trait_libra_aquatic_9_desc: "This aquatic species secretes valuable substances that coalesce over time into sparkling treasures like pearls."
 trait_libra_aquatic_9_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G1§!£trade£ §Y$trade$§! per month"

 SPECIES_TRAIT_LIBRA_REPTILIAN: "§E$libra_mod_name$§! ['concept_libra_reptilian_traits']"
 concept_libra_reptilian_traits: "Reptilian Species Traits"
 concept_libra_reptilian_traits_desc: "Phenotypic species traits applicable to §Y$REP$§!, including:\n$t$- ['trait:trait_libra_reptilian_0']\n$t$- ['trait:trait_libra_reptilian_1']\n$t$- ['trait:trait_libra_reptilian_2']\n$t$- ['trait:trait_libra_reptilian_3']\n$t$- ['trait:trait_libra_reptilian_4']\n$t$- ['trait:trait_libra_reptilian_5']\n$t$- ['trait:trait_libra_reptilian_6']\n$t$- ['trait:trait_libra_reptilian_7']\n$t$- ['trait:trait_libra_reptilian_8']\n$t$- ['trait:trait_libra_reptilian_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_reptilian_0: "Master Climber"
 trait_libra_reptilian_0_desc: "This reptilian species has great climbing ability and they are able to make the best use of three dimensions when it comes to urban planning."
 trait_libra_reptilian_1: "Amniotic Oocyte"
 trait_libra_reptilian_1_desc: "The eggs produced by this reptilian species have a strong shell with an excellent seal, which protects them from microbes, fungi, etc., and ensures the healthy development of the embryo."
 trait_libra_reptilian_1_tooltip: "For each §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+2%§! (Max: §G+20%§!)\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+4%§! (Max: §G+40%§!)"
 trait_libra_reptilian_2: "Composite Crustaceans"
 trait_libra_reptilian_2_desc: "The armour of this reptilian species is so strong that it takes quite a while to cut it even with a laser, which makes it so that they never meet any natural enemies before heading towards the swarm."
 trait_libra_reptilian_2_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.15§!£alloys£ §Y$alloys$§! per month"
 trait_libra_reptilian_3: "Poikilotherm"
 trait_libra_reptilian_3_desc: "These reptiles have evolved a fruitful way of controlling body temperature that greatly reduces energy expenditure."
 trait_libra_reptilian_3_tooltip: "For each §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $mod_planet_pops_upkeep_mult$: §G-2.5%§! (Max: §G-20%§!)\n$tt$- $MOD_POP_AMENITIES_USAGE_MULT$: §G-5%§! (Max: §G-40%§!)"
 trait_libra_reptilian_4: "Infrared Vision"
 trait_libra_reptilian_4_desc: "During their evolution, this reptilian species drew on their ability to sense infrared light to catch their prey, and in the interstellar age they turned to their talent for operating industrial machinery."
 trait_libra_reptilian_4_tooltip: "For each §Y$TRAIT_TITLE$§! owned:\n$tt$- $technician_jobs_bonus_workforce_mult$: §G+3.5%§! (Max: §G+35%§!)\n$tt$- $foundry_jobs_bonus_workforce_mult$: §G+3.5%§! (Max: §G+35%§!)"
 trait_libra_reptilian_5: "Venomous Tooth"
 trait_libra_reptilian_5_desc: "The deadly toxins they used to hunt with in the past have now proved to be valuable medical ingredients, and although no longer suitable for battlefield roles, this reptilian species has been able to make its mark in the laboratory."
 trait_libra_reptilian_5_tooltip: "$MOD_ARMY_DAMAGE_MULT$: §G+15%§!\n$t$- $biologist_jobs_bonus_workforce_mult$: §G+15%§!\n$t$- For each rare technology owned:\n$tt$- $researcher_jobs_bonus_workforce_mult$: §G+2%§! (Max: §G+30%§!)"
 trait_libra_reptilian_6: "Multiple Eyelids"
 trait_libra_reptilian_6_desc: "The highly developed eyes of this reptilian species are tightly protected by multiple layers of tissue, which ensures their mobility in complex environments."
 trait_libra_reptilian_6_tooltip: "When in an §Y$climate_wet$§! or §Y$climate_dry$§! environment:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+7.5%§!\n$t$- When in §YOther§! environments:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+7.5%§!"
 trait_libra_reptilian_7: "Finite Cycle"
 trait_libra_reptilian_7_desc: "In order to be as efficient as possible in their activities, this reptilian species has evolved to reintegrate their circulatory system, where the energy represented by each degree of body heat is utilised to the maximum."
 trait_libra_reptilian_8: "Cuticle"
 trait_libra_reptilian_8_desc: "The epidermis of this reptilian species is highly keratinised and further protected by scale armour, making it virtually impossible for parasites to invade."
 trait_libra_reptilian_9: "Metamorphosis"
 trait_libra_reptilian_9_desc: "In order to maximise the size of its population, expand its living space and consolidate its dominance, this reptilian species has drastically altered its form and lifestyle at every stage of its growth."
 trait_libra_reptilian_9_tooltip: "When having population advantage in colony:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+15%§!\n$t$- When the same as the Imperial Species Class:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!"

 SPECIES_TRAIT_LIBRA_AVI: "§E$libra_mod_name$§! ['concept_libra_avian_traits']"
 concept_libra_avian_traits: "Avian Species Traits"
 concept_libra_avian_traits_desc: "Phenotypic species traits applicable to §Y$AVI$§!, including:\n$t$- ['trait:trait_libra_avian_0']\n$t$- ['trait:trait_libra_avian_1']\n$t$- ['trait:trait_libra_avian_2']\n$t$- ['trait:trait_libra_avian_3']\n$t$- ['trait:trait_libra_avian_4']\n$t$- ['trait:trait_libra_avian_5']\n$t$- ['trait:trait_libra_avian_6']\n$t$- ['trait:trait_libra_avian_7']\n$t$- ['trait:trait_libra_avian_8']\n$t$- ['trait:trait_libra_avian_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_avian_0: "Sharp Talons"
 trait_libra_avian_0_desc: "This avian species possesses sharp claws and teeth. They are excellent hunters and have been the dominant masters of the skies throughout their long history."
 trait_libra_avian_0_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.75§!£food£ §Y$food$§! per month"
 trait_libra_avian_1: "Feathers"
 trait_libra_avian_1_desc: "Only birds have evolved true feathers, and this species' feathers are particularly outstanding in both functionality and adaptability - benefiting everything from insulation and camouflage to courtship."
 trait_libra_avian_1_tooltip: "For each §Y$TRAIT_TITLE$§! owned:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+2%§! (Max: §G+20%§!)"
 trait_libra_avian_2: "Chitinous Beak"
 trait_libra_avian_2_desc: "Birds lack jaws and teeth, instead having beaks covered by a keratin sheath - but this did not meet all the needs of this species. Through long evolution, they developed a special tool made of high-strength chitin, far more durable than typical beaks and even more dangerous than ordinary claws."
 trait_libra_avian_3: "Double Respiration"
 trait_libra_avian_3_desc: "Flight demands extremely high oxygen consumption, which conventional respiratory systems cannot meet. A unique air sac structure solves this problem: whether inhaling or exhaling, new air continuously enters the lungs, ensuring constant gas exchange."
 trait_libra_avian_3_tooltip: "$specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+5%§!\n$t$- For each §YPositive $TRAIT_TITLE$§! owned:\n$tt$- $worker_and_simple_drone_cat_bonus_workforce_mult$: §G+2.5%§! (Max: §G+20%§!)"
 trait_libra_avian_4: "Syrinx"
 trait_libra_avian_4_desc: "These birds produce sound not in the larynx but at the junction of the trachea and bronchi, where air vibrates the tympanic membranes to create voice. Their calls are varied and melodious."
 trait_libra_avian_4_tooltip: "For each level of §Y$planetary_ascension$§! on the colony:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+2%§! (Max: §G+20%§!)"
 trait_libra_avian_5: "Hawk-Eyed"
 trait_libra_avian_5_desc: "These birds possess multiple types of cone cells, enabling them to perceive a broader spectrum of colors - including ultraviolet and infrared - and accurately navigate during flight or locate prey."
 trait_libra_avian_5_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.50§!£physics_research£ §Y$physics_research$§! per month"
 trait_libra_avian_6: "Messenger"
 trait_libra_avian_6_desc: "This avian species exhibits remarkable long-distance migration capabilities, using celestial bodies and geomagnetic fields as reliable guides to traverse vast distances between different homelands"
 trait_libra_avian_7: "Rapid Metabolism"
 trait_libra_avian_7_desc: "To sustain the enormous energy demands of flight, this avian species consumes and converts energy at an extremely high rate, maintaining a body temperature far above the average of related species."
 trait_libra_avian_7_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R1§!£energy£ §Y$energy$§!"
 trait_libra_avian_8: "High Nester"
 trait_libra_avian_8_desc: "Building lofty nests in ideal locations is a unique habit of this avian species, ensuring both a superior living environment and the safety of their offspring."
 trait_libra_avian_8_tooltip: "If the colony meets §Y$PLANET_CLASS_PREFERENCE_TRAITS$§!:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+15%§!"
 trait_libra_avian_9: "Gizzard"
 trait_libra_avian_9_desc: "This avian species lacks teeth, instead relying on a specialized stomach: ingesting grit to grind food through powerful muscular contractions in the gizzard."
 trait_libra_avian_9_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R0.20§!£minerals£ §Y$minerals$§!"

 SPECIES_TRAIT_LIBRA_INFERNAL: "§E$libra_mod_name$§! ['concept_libra_infernal_traits']"
 concept_libra_infernal_traits: "Infernal Species Traits"
 concept_libra_infernal_traits_desc: "Phenotypic species traits applicable to §Y$INF$§!, including:\n$t$- ['trait:trait_libra_infernal_0']\n$t$- ['trait:trait_libra_infernal_1']\n$t$- ['trait:trait_libra_infernal_2']\n$t$- ['trait:trait_libra_infernal_3']\n$t$- ['trait:trait_libra_infernal_4']\n$t$- ['trait:trait_libra_infernal_5']\n$t$- ['trait:trait_libra_infernal_6']\n$t$- ['trait:trait_libra_infernal_7']\n$t$- ['trait:trait_libra_infernal_8']\n$t$- ['trait:trait_libra_infernal_9']\n$libra_mod_species_trait_tooltip$"
 trait_libra_infernal_0: "Fiery Ambition"
 trait_libra_infernal_0_desc: "This burning species aspires to build a grand, enduring empire as magnificent and fervent as themselves."
 trait_libra_infernal_1: "Exhilaration"
 trait_libra_infernal_1_desc: "With high-temperature, high-pressure blood circulation within their bodies, this infernal species is perpetually aware of their existence in this world."
 trait_libra_infernal_1_tooltip: "£pop£ §YPop Groups§! with £happiness£ §Y$HAPPINESS$§! not less than §Y50%§! gain §G+10%§! £mod_pop_bonus_workforce_mult£ §Y$MOD_POP_BONUS_WORKFORCE_MULT$§!"
 trait_libra_infernal_2: "Celestial Fire"
 trait_libra_infernal_2_desc: "This species expands their homelands as swiftly and ferociously as asteroids."
 trait_libra_infernal_2_tooltip: "Colonial Completion:\n$tt$- $PLANET_DEVASTATION$: §R+35§!"
 trait_libra_infernal_3: "Heart of the Forge"
 trait_libra_infernal_3_desc: "Faced with geological activities like volcanic eruptions, the power of an individual seems minuscule. Thus, this infernal species forms vast communities to confront various crises."
 trait_libra_infernal_3_tooltip: "£pop£ §YPop Groups§! with a size not less than §Y1750§! gain §G+0.50§! £mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§! and §G+15%§! £mod_pop_bonus_workforce_mult£ §Y$specialist_and_complex_drone_cat_bonus_workforce_mult$§!"
 trait_libra_infernal_4: "Magma Scholar"
 trait_libra_infernal_4_desc: "The entire evolutionary history of this infernal species has been accompanied by the trials of volcanoes and magma. The innate talent to understand related changes has long been integrated into their genes, becoming part of their bloodline.。"
 trait_libra_infernal_4_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! produces §G0.75§!£engineering_research£ §Y$engineering_research$§! per month"
 trait_libra_infernal_5: "Stellar Stress"
 trait_libra_infernal_5_desc: "Reaching a hand toward the moon, one can feel the warmth of home. Perhaps there is no scorching magma there - though that very heat symbolizes the life of their kin."
 trait_libra_infernal_5_tooltip: "When on a §YMoon§! or a colony that §YHas a Moon§!:\n$tt$- $MOD_LOGISTIC_GROWTH_MULT$: §G+40%§!"
 trait_libra_infernal_6: "Molten Stride"
 trait_libra_infernal_6_desc: "This infernal species can move freely through lava, extracting valuable resources from within."
 trait_libra_infernal_7: "Eruption"
 trait_libra_infernal_7_desc: "The physiological rhythm of this perpetually burning species fluctuates like volcanic activity - after long periods of quiescence, astonishing eruptions follow."
 trait_libra_infernal_7_tooltip: "Very $pop_group_unit$ £pop£ §Y$POP$§! consumes §R0.35§!£alloys£ §Y$alloys$§!"
 trait_libra_infernal_8: "Infernal March"
 trait_libra_infernal_8_desc: "Evolving from the harshest environments, this species possesses remarkable discipline and military prowess."
 trait_libra_infernal_8_tooltip: "Every $pop_group_unit$ £pop£ §Y$POP$§! provides §G0.50§!£mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!"
 trait_libra_infernal_9: "Fire's Vigor"
 trait_libra_infernal_9_desc: "The flow of magma invigorates this species, but in places lacking warmth, their performance leaves much to be desired."
 trait_libra_infernal_9_tooltip: "When on §Y$pc_volcanic$§!:\n$tt$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\n$t$- When in an §Y$climate_dry$§! environment:\n$tt$- Every $pop_group_unit$ £pop£ §Y$POP$§! provides §G0.03§!£mod_bonus_pop_growth£ §Y$MOD_BONUS_POP_GROWTH$§!"

