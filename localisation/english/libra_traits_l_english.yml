 concept_libra_psionic_leader_traits: "Psychic Leader Trait"
 concept_libra_psionic_leader_traits_desc: "Special traits that leaders from §Y$trait_psionic$§! species can choose from."

# commander
 leader_trait_libra_psionic_aggressive: "Knockout Punch"
 leader_trait_libra_psionic_aggressive_desc: "This leader can use psychic energy to communicate instantly between fleets so that flush strikes can be carried out in an orderly fashion."
 leader_trait_libra_psionic_harding: "Shield Increase"
 leader_trait_libra_psionic_harding_desc: "With the power of psychic energy, the protective network of the fleet under this leader's command was effectively reinforced."
 leader_trait_libra_psionic_engineer: "Goddess of Mercy"
 leader_trait_libra_psionic_engineer_desc: "This leader can perform restoration work through mind manipulation that the average crew cannot do."
 leader_trait_libra_psionic_skirmisher: "Lightning Raid"
 leader_trait_libra_psionic_skirmisher_desc: "Projecting psychic energy to disrupt detection signals, this leader is always able to launch surprise attacks without anyone realising it."
 leader_trait_libra_psionic_weakness_perception: "Sense of Weakness"
 leader_trait_libra_psionic_weakness_perception_desc: "Anticipating the enemy's weaknesses combines both risk and reward, but it's no mean feat for this leader."
 leader_trait_libra_psionic_heavy_hitter: "Edge Tapping"
 leader_trait_libra_psionic_heavy_hitter_desc: "This leader often launches an onslaught from the weakest point of the enemy's formation and breaks through the enemy line in one fell swoop."
 leader_trait_libra_psionic_dreaded: "Fearless"
 leader_trait_libra_psionic_dreaded_desc: "Gives warriors strong spiritual power with psychic energy, making them fearless in close combat."
 leader_trait_libra_psionic_hardy: "Crisis Management"
 leader_trait_libra_psionic_hardy_desc: "Subtle fluctuations of psychic energy in subspace sometimes foreshadow the direction of reality, and capturing this information can avoid unnecessary risks."
 leader_trait_libra_psionic_iron_fist: "Oversee"
 leader_trait_libra_psionic_iron_fist_desc: "This leader will supervise the labourers' work with his spiritual energy to ensure that there is no slackness in their minds."
 leader_trait_libra_psionic_gale_speed: "Amazingly Rapid"
 leader_trait_libra_psionic_gale_speed_desc: "The power of the pact affects every friendly party where this leader is located, causing them to move with exceptional swiftness."
 leader_trait_libra_psionic_crew_trainer: "Co-commander"
 leader_trait_libra_psionic_crew_trainer_desc: "This leader is well versed in command strategy and communicates his knowledge telepathically to the other leaders."
 leader_trait_libra_psionic_fortifier: "Fortress Builder"
 leader_trait_libra_psionic_fortifier_desc: "This leader was able to build strong border defences."
 leader_trait_libra_psionic_armada_logistician: "Military Commander"
 leader_trait_libra_psionic_armada_logistician_desc: "This leader is able to dispatch supplies in real time to keep the Imperial fleet running efficiently."

 leader_trait_libra_psionic_energy_weapon_specialist: "Concentration of Energy"
 leader_trait_libra_psionic_energy_weapon_specialist_desc: "This commander knew how to make the fleet's barrages hit specific locations on uncertain targets in short succession, quickly overloading their armour and destroying them."
 leader_trait_libra_psionic_kinetic_weapon_specialist: "Violent Bang"
 leader_trait_libra_psionic_kinetic_weapon_specialist_desc: "This commander guided [this.GetHisHer] shots with precision and lethality, always hitting somewhere in the enemy ship's protective netting at just the right moment."
 leader_trait_libra_psionic_explosive_weapon_specialist: "Precision Guidance"
 leader_trait_libra_psionic_explosive_weapon_specialist_desc: "On the silent battlefields of space, nothing could be more terrifying than a curtain of missiles covering the sky, and to make matters worse, every weapon fired by this commander went straight for the jugular."
 leader_trait_libra_psionic_strike_craft_specialist: "Swarming Tactics"
 leader_trait_libra_psionic_strike_craft_specialist_desc: "Enhanced by the psychic barrier, the fighter clusters under this commander's command were able to execute a surprise defence and inflict serious damage on the enemy at speeds that exceeded normal tracks."
 leader_trait_libra_psionic_butcher: "Cold Blade"
 leader_trait_libra_psionic_butcher_desc: "This commander is capable of triggering spirit explosions on the battlefield, literally killing and wounding the enemy."
 leader_trait_libra_psionic_restrained: "Valiant"
 leader_trait_libra_psionic_restrained_desc: "Not limited to being mentally strong, this commander coordinates each warrior through psychic energy so that they move in an orderly fashion and advance and retreat as one."
 leader_trait_libra_psionic_frightener: "Intimidator"
