 leader_trait_libra_official_delegate_xenophile_tt: "When successfully supporting a resolution:\n$tt$- Gain §G6§! months of £energy£ §Y$energy$§!, £trade£ §Y$trade$§! and £unity£ §Y$unity$§! output"

# official diplomacy councilor

 leader_trait_libra_official_diplomacy_councilor_destiny_a: "Vassal Affairs Commissioner"
 leader_trait_libra_official_diplomacy_councilor_destiny_a_desc: "This administrator specializes in vassal relations with notable success. [this.GetHeShe] possesses countless methods to secure favorable outcomes in related negotiations.\n$libraf_lt_banner_17$"

 leader_trait_libra_official_diplomacy_councilor_destiny_b: "Big Stick Envoy"
 leader_trait_libra_official_diplomacy_councilor_destiny_b_desc: "This envoy masters the art of deterrence - [this.GetHeShe] forges each diplomatic confrontation into bargaining chips, turning rivals' every protest, threat, or fleet movement into added leverage at the imperial negotiation table. [this.GetHeShe] knows a fundamental truth: the universe's most solid interests are often tempered from opponents' fear and fury.\n$libraf_lt_banner_17$"

 leader_trait_libra_official_diplomacy_councilor_destiny_c: "Hospitality Mogul"
 leader_trait_libra_official_diplomacy_councilor_destiny_c_desc: "This envoy has built a rather large house back home, always warmly inviting all sorts of interstellar friends to visit.\n$libraf_lt_banner_17$"

 leader_trait_libra_official_diplomacy_councilor_destiny_d: "Cipher Master"
 leader_trait_libra_official_diplomacy_councilor_destiny_d_desc: "This diplomat excels at leveraging national conditions to initiate infiltration operations; few intelligence networks can stump [this.GetHeShe].\n$libraf_lt_banner_17$"
 leader_trait_libra_official_diplomacy_councilor_destiny_d_tt: "$t$- Per 100 £diplo_weight£ §Y$diplomatic_weight$§! produce £physics_research£§G2§! £society_research£§G2§! £engineering_research£§G2§! (Max: §G+4000§!)"


 leader_trait_libra_official_diplomacy_councilor_militarist: "War Tax Collector"
 leader_trait_libra_official_diplomacy_councilor_militarist_desc: "When war engulfs the stars, [this.GetHisHer] abacus clicks atop the ruins: every enemy wreck can be converted into alloy reserves, every fallen world's wail quantified into energy credits. Victories add glory to the empire; defeats are squeezed by [this.GetHeShe] for the last coin to fund the next conquest.\n$libraf_lt_banner_2$"
 leader_trait_libra_official_diplomacy_councilor_militarist_tt: "$t$- During §YWar§!:\n$tt$- $mod_country_produces_mult$: §G+5%§!\n$tt$- $MOD_POP_CITIZEN_HAPPINESS$: §G+15%§!\n$tt$- $mod_pop_ethic_militarist_attraction_mult$: §G+25%§!"

 leader_trait_libra_official_diplomacy_councilor_pacifist: "Prosperity Sentinel"
 leader_trait_libra_official_diplomacy_councilor_pacifist_desc: "This administrator is typically mild and approachable, but transforms into a stern arbiter at any sign of threat to our safety.\n$libraf_lt_banner_3$"
 leader_trait_libra_official_diplomacy_councilor_pacifist_tt: "During §YPeace§!:\n$tt$- $mod_country_produces_mult$: §G+10%§!\n$t$- During §YCrisis§!:\n$tt$- $mod_country_produces_mult$: §G+10%§!\n$t$- During §YDefensive War§!:\n$tt$- $MOD_STARBASE_SHIPYARD_BUILD_COST_MULT$: §G-10%§!"

 leader_trait_libra_official_diplomacy_councilor_authoritarian: "Grand Overseer"
 leader_trait_libra_official_diplomacy_councilor_authoritarian_desc: "Leadership is a talent; the leader's position is a gift. This envoy spares no effort in consolidating our suzerain status and profiting therefrom.\n$libraf_lt_banner_4$"
 leader_trait_libra_official_diplomacy_councilor_authoritarian_tt_1: "$t$- Per §YSubject§!:\n$tt$- $MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+1%§! (Max: §G+10%§!)"
 leader_trait_libra_official_diplomacy_councilor_authoritarian_tt_2: "$t$- Per §YProtectorate§!:\n$tt$- $MOD_COUNTRY_NAVAL_CAP_MULT$: §G+2%§! (Max: §G+10%§!)"

 leader_trait_libra_official_diplomacy_councilor_egalitarian: "Cornerstone of Compact"
 leader_trait_libra_official_diplomacy_councilor_egalitarian_desc: "This diplomat views reciprocal agreements as the optimal bridge for trust between civilizations, exerting influence subtly through amicable means.\n$libraf_lt_banner_5$"
 leader_trait_libra_official_diplomacy_councilor_egalitarian_tt: "$t$- Per active §YNon-Aggression Pact§!:\n$tt$- $mod_country_produces_mult$: §G+2%§! (Max: §G+8%§!)\n$tt$- $MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$: §G+5%§! (Max: §G+20%§!)"

 leader_trait_libra_official_diplomacy_councilor_spiritualist: "Path of Trial"
 leader_trait_libra_official_diplomacy_councilor_spiritualist_desc: "Rather than elevating national standing, this administrator focuses on tangible gains from diplomatic opportunities and challenges.\n$libraf_lt_banner_6$"
 leader_trait_libra_official_diplomacy_councilor_spiritualist_tt_1: "$t$- Per active §YCommercial Pact§!:\n$tt$- $MOD_COUNTRY_EDICT_FUND_MULT$: §G+4%§! (Max: §G+16%§!)\n$tt$- $mod_specimens_produces_mult$: §G+4%§! (Max: §G+16%§!)"
 leader_trait_libra_official_diplomacy_councilor_spiritualist_tt_2: "$t$- Per active §YMigration Pact§!:\n$tt$- $MOD_PLANET_POP_ASSEMBLY_MULT$: §G+4%§! (Max: §G+16%§!)\n$tt$- $MOD_BONUS_POP_GROWTH_MULT$: §G+4%§! (Max: §G+16%§!)"

 leader_trait_libra_official_diplomacy_councilor_materialist: "Xeno-Architect"
 leader_trait_libra_official_diplomacy_councilor_materialist_desc: "This envoy views Research Agreements as the optimal solution for knowledge flow - [this.GetHeShe] embeds data-diverting algorithms into treaty clauses, ensuring every byte of alien research precisely feeds the empire's think tank neural core. True sages never discriminate by source, only care how to refine the knowledge of all realms into a unified stellar syntax.\n$libraf_lt_banner_7$"
 leader_trait_libra_official_diplomacy_councilor_materialist_tt: "$t$- Per active §YResearch Agreement§!:\n$tt$- $mod_scientist_exp_gain$: §G+5%§! (Max: §G+20%§!)\n$tt$- $mod_planet_researchers_produces_mult$: §G+8%§! (Max: §G+32%§!)"

 leader_trait_libra_official_diplomacy_councilor_xenophobe: "Wall of Isolation"
 leader_trait_libra_official_diplomacy_councilor_xenophobe_desc: "Observe closely, analyze prudently, strip away all unfriendly signs from beyond- this is the simple yet essential work this administrator excels at.\n$libraf_lt_banner_8$"
 leader_trait_libra_official_diplomacy_councilor_xenophobe_tt_1: "$t$- Per empire with §YClosed Borders§!:\n$tt$- $mod_planet_jobs_productive_produces_mult$: §G+1%§! (Max: §G+10%§!)"
 leader_trait_libra_official_diplomacy_councilor_xenophobe_tt_2: "$t$- Per empire declared §YRival§!:\n$tt$- $mod_planet_structures_upkeep_mult$: §G-3%§! (Max: §G-15%§!)"

 leader_trait_libra_official_diplomacy_councilor_xenophile: "Guardian of Liberty"
 leader_trait_libra_official_diplomacy_councilor_xenophile_desc: "This administrator transforms every military aid operation into radiating diplomatic capital: escort fleet trails weave trust networks across the stars, while gratitude from protected worlds crystallizes into imperial cohesion. While other civilizations tremble in isolation, [this.GetHeShe] forges scattered stars into a shared constellation with oaths of guardianship.\n$libraf_lt_banner_9$"
 leader_trait_libra_official_diplomacy_councilor_xenophile_tt_1: "$t$- Per §YIndependence Guarantee§! given:\n$tt$- $mod_official_exp_gain$: §G+5%§! (Max: §G+20%§!)\n$tt$- $MOD_COUNTRY_TRUST_GROWTH$: §G+10%§! (Max: §G+40%§!)"
 leader_trait_libra_official_diplomacy_councilor_xenophile_tt_2: "$t$- Per active §YDefensive Pact§!:\n$tt$- $mod_commander_exp_gain$: §G+5%§! (Max: §G+20%§!)\n$tt$- $MOD_SHIP_FRIENDLY_TERRITORY_FIRE_RATE_MULT$: §G+10%§! (Max: §G+40%§!)"

# official economy councilor

 leader_trait_libra_official_economy_councilor_destiny_a: "Council Luminary"
 leader_trait_libra_official_economy_councilor_destiny_a_desc: "True governance efficiency lies not in the speed of passing resolutions, but in granting each resolution a self-sustaining rhythm after implementation. This advisor masters the art of political timing - while peers debate details, [this.GetHeShe] already sets policy gears spinning at self-reinforcing frequencies.\n$libraf_lt_banner_18$"
 leader_trait_libra_official_economy_councilor_destiny_a_tt: "$t$- Provides up to §G100%§!£mod_council_agenda_progress_speed£ §Y$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$§! based on current agenda progress"

 leader_trait_libra_official_economy_councilor_destiny_b: "Legacy Master"
 leader_trait_libra_official_economy_councilor_destiny_b_desc: "[this.GetHeShe] hears the whispers of bronze codes in climate-controlled displays and deciphers entropy ciphers in every celestial mural groove: time never passes - it merely folds into more refined forms on the master's display shelves.\n$libraf_lt_banner_18$"
 leader_trait_libra_official_economy_councilor_destiny_b_tt: "$t$- Per owned §Y$relics$§!:\n$tt$- $mod_planet_jobs_specialist_produces_mult$: §G+2%§! (Max: §G+10%§!)"

 leader_trait_libra_official_economy_councilor_destiny_c: "Core Engineer"
 leader_trait_libra_official_economy_councilor_destiny_c_desc: "Structures in the stars are skeletal extensions of terrestrial civilization; every inch of construction material represents the will to pursue prosperity. This advisor crystallizes the people's hopes, crafting the finest star charts upon the night sky's canvas.\n$libraf_lt_banner_18$"

 leader_trait_libra_official_economy_councilor_destiny_d: "Ascension Architect"
 leader_trait_libra_official_economy_councilor_destiny_d_desc: "With each celestial mark we break through, the crust yields more readily to the imprints of our existence. With each step up the heavenly ladder, the ground beneath accelerates into the shape of our thoughts.\n$libraf_lt_banner_18$"
 leader_trait_libra_official_economy_councilor_destiny_d_tt: "$t$- Per owned §YAscension Perk§!:\n$tt$- $MOD_PLANET_COLONY_DEVELOPMENT_SPEED_MULT$: §G+5%§! (Max: §G+40%§!)\n$tt$- $MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G+5%§! (Max: §G+40%§!)"


 leader_trait_libra_official_economy_councilor_militarist: "Grand Commandant"
 leader_trait_libra_official_economy_councilor_militarist_desc: "This leader's directives for allocating interstellar resources are as steady as a mountain, ensuring that relevant personnel can respond immediately to any contingency.\n$libraf_lt_banner_2$"
 leader_trait_libra_official_economy_councilor_militarist_tt: "$t$- Per controlled §YSystem§!:\n$tt$- $mod_country_councilor_trade_produces_add$: §G+5§!\n$tt$- $mod_country_councilor_unity_produces_add$: §G+4§!"

 leader_trait_libra_official_economy_councilor_pacifist: "Harmony Consul"
 leader_trait_libra_official_economy_councilor_pacifist_desc: "True prosperity never requires heavy taxation- only making each breath of civilization lighter and each transmission of wisdom more complete.\n$libraf_lt_banner_3$"

 leader_trait_libra_official_economy_councilor_authoritarian: "Edict Annunciator"
 leader_trait_libra_official_economy_councilor_authoritarian_desc: "This administrator is the absolute authority within the imperial cabinet, the primary conduit for [owner.Ruler.GetName]'s decrees.\n$libraf_lt_banner_4$"

 leader_trait_libra_official_economy_councilor_egalitarian: "Symphony of Voices"
 leader_trait_libra_official_economy_councilor_egalitarian_desc: "This advisor treats empire factions as an unfinished symphony- [this.GetSheHe] suppresses no voice but calibrates a unique resonance for each group. When merchant guilds' profit-seeking clashes with environmentalists' ecological pleas within [this.GetSheHe]'s dialogue arena, discord itself becomes flint sparking new ideas. All factions discover under [this.GetHerHis] orchestration: only when diverse voices are heard equally do their propositions transform into real momentum driving civilization forward.\n$libraf_lt_banner_5$"

 leader_trait_libra_official_economy_councilor_spiritualist: "Spiritual Stratum Trace"
 leader_trait_libra_official_economy_councilor_spiritualist_desc: "Each celestial ascension observed by the enlightened one draws spiritual waves to temper relic veins. One ascension layer, artifacts resonate with knowledge; another layer, shattered steles project star charts. Myriad traces overlay in radiance, like presenting Sanskrit hymns in civilization's temple.\n$libraf_lt_banner_6$"
 leader_trait_libra_official_economy_councilor_spiritualist_tt: "$t$- Per completed §YTradition Tree§!:\n$tt$- $MOD_PLANETARY_ASCENSION_COST_MULT$: §G-1%§! (Max: §G-7%§!)\n$tt$- $mod_aesthetic_wonder_specimens_produces_mult$: §G+5%§! (Max: §G+35%§!)\n$tt$- $mod_xeno_geology_specimens_produces_mult$: §G+5%§! (Max: §G+35%§!)"

 leader_trait_libra_official_economy_councilor_materialist: "Stellar Think Tank"
 leader_trait_libra_official_economy_councilor_materialist_desc: "This administrator is dedicated to building a management system connecting the entire empire, promoting collective progress among all leaders through perfect knowledge sharing while maintaining alignment.\n$libraf_lt_banner_7$"
 leader_trait_libra_official_economy_councilor_materialist_tt: "$t$- §Y$councilor_research$§!每§Y$MOD_COUNCILOR_SKILL_ADD$§!：\n$tt$- $MOD_LEADER_SPECIES_EXP_GAIN$: §G+1%§! (Max: §G+30%§!)"

 leader_trait_libra_official_economy_councilor_xenophobe: "Pureblood Forge"
 leader_trait_libra_official_economy_councilor_xenophobe_desc: "Our bloodlines and gears alike require sterilization; only absolutely pure replication grants civilization's body permanent antibodies against galactic pathogens. Our propagation never relies on heterogeneous contamination; only in absolutely pure petri dishes can the racial fire reignite exponentially.\n$libraf_lt_banner_8$"

 leader_trait_libra_official_economy_councilor_xenophile: "Visionary Painter"
 leader_trait_libra_official_economy_councilor_xenophile_desc: "Rich in ideals and striving relentlessly toward them, this administrator works to create a harmonious world.\n$libraf_lt_banner_9$"
 leader_trait_libra_official_economy_councilor_xenophile_tt: "$t$- Per unique §YSpecies§!:\n$tt$- $mod_planet_jobs_produces_mult$: §G+0.50%§! (Max: §G+10%§!)"

# scientist explorer

 leader_trait_libra_scientist_explorer_destiny_a: "Stargazer's Log"
 leader_trait_libra_scientist_explorer_destiny_a_desc: "This explorer publishes detailed manuscripts compiled from survey records. As primary sources on xenobiology, [this.GetHisHer] works are highly popular among civilian researchers.\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_a_tt: "$t$- Per celestial body scanned:\n$tt$- $mod_leader_scientists_energy_produces_add$: §G+2§!\n$tt$- $mod_leader_scientists_trade_produces_add$: §G+1§!"

 leader_trait_libra_scientist_explorer_destiny_b: "Star Chart Cartographer"
 leader_trait_libra_scientist_explorer_destiny_b_desc: "When this explorer's sensors sweep unfamiliar systems, each celestial body's orbital parameters and mineral spectra compile into two distinct reports: one becomes deluxe star charts for administrative centers, fueling bureaucratic celebrations over new territorial claims; the other delivers raw data to research institutes, sparking sudden inspirations.\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_b_tt: "$t$- When entering a new system:\n$tt$- Gain §G1§! month of £physics£ £society£ £engineering£ §YResearch Points§! output\n$tt$- If system is occupied by another empire:\n$ttt$- All £leader£ councilor Leaders receive §G125§! Experience"

 leader_trait_libra_scientist_explorer_destiny_c: "Stellar Weavewright"
 leader_trait_libra_scientist_explorer_destiny_c_desc: "This science officer interprets cosmic activities as logical code, social phenomena, or engineering theories. These research notes, written directly by the stars, continuously flood the empire's databases like an inexhaustible river pouring into civilization's cup.\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_c_tt: "$t$- Per system scanned:\n$tt$- $mod_leader_scientists_physics_research_produces_add$: §G+12§!\n$tt$- $mod_leader_scientists_society_research_produces_add$: §G+12§!\n$tt$- $mod_leader_scientists_engineering_research_produces_add$: §G+12§!"

 leader_trait_libra_scientist_explorer_destiny_d: "Wellspring of Insight"
 leader_trait_libra_scientist_explorer_destiny_d_desc: "We measure the distances between stars, ultimately measuring civilization's weight on the cosmic scale. From endless adventures, we gain knowledge, renown, and the right to define the future.\n$libraf_lt_banner_19$"
 leader_trait_libra_scientist_explorer_destiny_d_tt: "$t$- Upon completion of system survey:\n$tt$- Random technology §G+25%§! progress\n$tt$- Gain §G25~50§! £influence£ §Y$influence$§! based on output"

 leader_trait_libra_scientist_explorer_militarist: "Debris Organizer"
 leader_trait_libra_scientist_explorer_militarist_desc: "Ancient battlefields hold more than ruins. This science officer commands a salvage fleet capable of collecting reusable raw materials from any debris field or waste disposal site [this.GetHeShe] encounters.\n$libraf_lt_banner_2$"
 leader_trait_libra_scientist_explorer_militarist_tt: "$t$- $mod_leader_scientists_alloys_produces_add$: §G+18§!\n$t$- Per system scanned:\n$tt$- $mod_leader_scientists_alloys_produces_add$: §G+4§!\n$tt$- $mod_leader_scientists_engineering_research_produces_add$: §G+4§!"

 leader_trait_libra_scientist_explorer_pacifist: "Chronicles of the Unfamiliar"
 leader_trait_libra_scientist_explorer_pacifist_desc: "Our goal in exploring worlds isn't to create more conflict, but to bring back tales from beyond to our homeland, showing everyone the splendors of harmony.\n$libraf_lt_banner_3$"
 leader_trait_libra_scientist_explorer_pacifist_tt: "$t$- When entering a new system:\n$tt$- Gain £minerals£§G300§! £consumer_goods£§G300§!\n$t$- Upon completion of system survey:\n$tt$- Gain §G2§! months of £volatile_motes£ £exotic_gases£ £rare_crystals£ §YRare Resource§!"

 leader_trait_libra_scientist_explorer_authoritarian: "Cogwheel of Labor"
 leader_trait_libra_scientist_explorer_authoritarian_desc: "This science officer's status stems from relentless effort and a powerful advisory team: frontline warriors charge ahead while rear-echelon consultants stand ready. Their efforts, seamlessly joined across time and space, form the secret to this exploration magnate's success.\n$libraf_lt_banner_4$"
 leader_trait_libra_scientist_explorer_authoritarian_tt: "$t$- During fleet missions:\n$tt$- $mod_leader_scientists_influence_produces_add$: §G+1§!\n$tt$- $mod_leader_scientists_unity_produces_add$: §G+20§!"

 leader_trait_libra_scientist_explorer_egalitarian: "Public Prospector"
 leader_trait_libra_scientist_explorer_egalitarian_desc: "This science officer dedicates findings to public service - transforming stellar spectra into free energy for communal grids, converting habitable world data directly into colony planning templates. This knowledge is never locked in research vaults but becomes tools accessible on every citizen's terminal - from schoolchildren's climate projects to farmers' planting algorithms. The stars have never shone so equally upon all.\n$libraf_lt_banner_5$"
 leader_trait_libra_scientist_explorer_egalitarian_tt: "Upon completion of survey:\n$tt$- Gain £physics£§G300§! £society£§G300§! £engineering£§G300§!\n$tt$- If surveying a §YCentral Body§!:\n$ttt$- $ADD_COUNCIL_AGENDA_PROGRESS$ §G+600§!\n$tt$- If surveying a §YHabitable World§!:\n$ttt$- Random $scientist_with_icon$ receive §G600§! experience"

 leader_trait_libra_scientist_explorer_spiritualist: "Celestial Guide"
 leader_trait_libra_scientist_explorer_spiritualist_desc: "When [this.GetHisHer] hymns resonate across the bridge, the ship sheds its metallic shell, transforming into spirit-foil imbued with Shroud's radiance. Each tremor of the jump drive harmonizes devoutly with stellar pulsations, guiding the fleet like penitents receiving cosmic grace along destined psionic threads toward the other shore.\n$libraf_lt_banner_6$"

 leader_trait_libra_scientist_explorer_materialist: "Stellar Stenographer"
 leader_trait_libra_scientist_explorer_materialist_desc: "The universe's answers are already written across the stars - we merely lacked a simultaneous translator. This explorer's neural interface maintains constant resonance with the science ship's scanners, converting anomalies into standardized data capsules transmitted via FTL communication to the homeworld.\n$libraf_lt_banner_7$"
 leader_trait_libra_scientist_explorer_materialist_tt_1: "$t$- Per celestial body scanned:\n$tt$- $mod_leader_scientists_unity_produces_add$: §G+0.40§!"
 leader_trait_libra_scientist_explorer_materialist_tt_2: "$t$- Upon completion of system survey:\n$tt$- Gain §G2§! months of £physics£ £society£ £engineering£ §YResearch Points§! output"

 leader_trait_libra_scientist_explorer_xenophobe: "Xeno-Codex"
 leader_trait_libra_scientist_explorer_xenophobe_desc: "This explorer views alien planets as heretical specimens for dissection. All non-native data gets processed into warning beacons for the empire, uniting the populace through shared fear into a steel-solid whole.\n$libraf_lt_banner_8$"
 leader_trait_libra_scientist_explorer_xenophobe_tt: "Upon completion of survey:\n$tt$- Gain §G0.5§! months of £unity£ §Y$unity$§! output\n$tt$- Gain additional §G0.5§! months of £unity£ §Y$unity$§! when surveying §YHabitable Worlds§!"

 leader_trait_libra_scientist_explorer_xenophile: "Stardust Weaver"
 leader_trait_libra_scientist_explorer_xenophile_desc: "With tendrils caressing starlight,\nForeign memories crystallize into amber badges.\nCountless cultures' sentiments seep into the homeland's soul,\nCo-composing a boundless symphony.\n$libraf_lt_banner_9$"
 leader_trait_libra_scientist_explorer_xenophile_tt: "When entering a new system:\n$tt$- Gain £influence£§G25§!\n$tt$- Gain §G500~5000§! £unity£ §Y$unity$§! based on output"

# scientist scholar

 leader_trait_libra_scientist_scholar_destiny_a: "Stardust Cornucopia"
 leader_trait_libra_scientist_scholar_destiny_a_desc: "The cosmos is the greatest treasure, awaiting discovery by the capable. This scholar's instruments adapt symbiotically to environments: capturing biochemical pulses in methane oceans for gas storage, recording light's end at event horizons for research, transforming ordinary phenomena into potential gains.\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_a_tt_1: "$t$- While in §Y$pc_black_hole$§! system:\n$tt$- $mod_leader_scientists_physics_research_produces_add$: §G+200§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_2: "$t$- While in §Y$pc_neutron_star$§! system:\n$tt$- $mod_leader_scientists_society_research_produces_add$: §G+200§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_3: "$t$- While in §Y$pc_pulsar$§! system:\n$tt$- $mod_leader_scientists_engineering_research_produces_add$: §G+200§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_4: "$t$- While in §YAsteroid Belt§!:\n$tt$- $mod_leader_scientists_volatile_motes_produces_add$: §G+18§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_5: "$t$- While in §YNebula§!:\n$tt$- $mod_leader_scientists_exotic_gases_produces_add$: §G+18§!"
 leader_trait_libra_scientist_scholar_destiny_a_tt_6: "$t$- While in §YStorm§!:\n$tt$- $mod_leader_scientists_rare_crystals_produces_add$: §G+18§!"

 leader_trait_libra_scientist_scholar_destiny_b: "Glimpsing Truth"
 leader_trait_libra_scientist_scholar_destiny_b_desc: "Where others see chaotic noise in anomalies, this scholar sees scattered cognitive puzzle pieces across the stars. [this.GetHeShe] gently reassembles these fragments within data streams, restoring their original form.\nEach mystery solved adds weight to the empire's voice and clears fog from future paths.\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_b_tt: "Upon completion of anomaly:\n$tt$- Gain £influence£§G25§!\n$tt$- Gain §G3§! months of £physics£ £society£ £engineering£ §YResearch Points§! output"

 leader_trait_libra_scientist_scholar_destiny_c: "Master of Reutilization"
 leader_trait_libra_scientist_scholar_destiny_c_desc: "This frontier scholar views battlefield debris as unopened technical scriptures - [this.GetHisHer] scans across shattered alien hulls hear energy circuit secrets in every melted weld and material science taboos in every warped armor plate.\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_c_tt: "Upon completion of salvage or study of debris:\n$tt$- $ADD_COUNCIL_AGENDA_PROGRESS$ §G+10%§!\n$tt$- Increase §G+20%§!£mod_country_engineering_tech_research_speed£§Y$MOD_COUNTRY_ENGINEERING_TECH_RESEARCH_SPEED$§! for §Y5§! years"
 leader_trait_libra_scientist_scholar_destiny_c_effect: "Debris Reutilization"
 leader_trait_libra_scientist_scholar_destiny_c_effect_desc: "ata from alien ship fragments advances imperial engineering."

 leader_trait_libra_scientist_scholar_destiny_d: "Astrosociology"
 leader_trait_libra_scientist_scholar_destiny_d_desc: "Through fleeting glimpses beyond rifts, this scholar perceives intangible multicultural collisions, deducing numerous worthy societal research topics.\n$libraf_lt_banner_20$"
 leader_trait_libra_scientist_scholar_destiny_d_tt: "$t$- Upon completion of Astral Rift:\n$tt$- Gain §G3§! months of £society_research£ §Y$society_research$§! and £unity£ §Y$unity$§! output\n$tt$- Increase §G+25%§!£mod_country_society_tech_research_speed£§Y$MOD_COUNTRY_SOCIETY_TECH_RESEARCH_SPEED$§! for §Y5§! years"
 leader_trait_libra_scientist_scholar_destiny_d_effect: "Astrosociology"
 leader_trait_libra_scientist_scholar_destiny_d_effect_desc: "We have acquired sociological knowledge from other planes."

 leader_trait_libra_scientist_scholar_militarist: "Ground Crew Liaison"
 leader_trait_libra_scientist_scholar_militarist_desc: "When [this.GetHeShe]'s calculation tapes interface with military channels, cruiser engine trails optimize into Fibonacci spirals for minimal energy consumption, and battleship coolant systems follow thermodynamic sonnets [this.GetHeShe] composed - few command logistics better on the frontline.\n$libraf_lt_banner_2$"

 leader_trait_libra_scientist_scholar_pacifist: "Armored Miner"
 leader_trait_libra_scientist_scholar_pacifist_desc: "The scholar navigates [this.GetHisHer] ship safely through shattered celestial bodies. Hull armor auto-calibrates resonance frequencies to convert meteor impacts into cushioning kinetic energy, while exploration lasers scan geological compositions and directly suction ore-rich fragments into modified cargo holds.\n$libraf_lt_banner_3$"
 leader_trait_libra_scientist_scholar_pacifist_tt: "$t$- Per §YAsteroid Belt§! in system:\n$tt$- $mod_leader_scientists_energy_produces_add$: §G+36§!\n$tt$- $mod_leader_scientists_minerals_produces_add$: §G+36§!"

 leader_trait_libra_scientist_scholar_authoritarian: "Frontier Mentor"
 leader_trait_libra_scientist_scholar_authoritarian_desc: "This scholar is not merely a seasoned engineer but the head of an entire school. [this.GetHeShe] meticulously arranges everything for the empire's long-term development.\n$libraf_lt_banner_4$"
 leader_trait_libra_scientist_scholar_authoritarian_tt: "Upon completion of Archaeological Site:\n$tt$- Random technology §G+100%§! progress\n$tt$- £leader£ Leader with lowest Skill Level boosts §G+3§! skill level"

 leader_trait_libra_scientist_scholar_egalitarian: "Nebula Chronicles"
 leader_trait_libra_scientist_scholar_egalitarian_desc: "Knowledge's true power lies not in temporary guidance from great minds, but in sparks kindled by millions collectively. Every story from the distant past, every possibility beyond stars, quietly narrates legends of the unknown.\n$libraf_lt_banner_5$"
 leader_trait_libra_scientist_scholar_egalitarian_tt: "Per Astral Exploration completed:\n$tt$- $mod_leader_scientists_physics_research_produces_add$: §G+36§!\n$tt$- $mod_leader_scientists_astral_threads_produces_add$: §G+2§!\n$t$- Per Archaeological Excavation completed:\n$tt$- $mod_leader_scientists_society_research_produces_add$: §G+36§!\n$tt$- $mod_leader_scientists_minor_artifacts_produces_add$: §G+2§!"

 leader_trait_libra_scientist_scholar_spiritualist: "Oracle Emissary"
 leader_trait_libra_scientist_scholar_spiritualist_desc: "Knowledge should not be monopolized; all who resonate with the universe's mysterious strings elevate the empire's collective consciousness.\n$libraf_lt_banner_6$"
 leader_trait_libra_scientist_scholar_spiritualist_tt: "Upon completion of anomaly:\n$tt$- All $official_with_icon$ gain §G200§! experience\n$tt$- All $commander_with_icon$ gain §G200§! experience"

 leader_trait_libra_scientist_scholar_materialist: "Natural Philosopher"
 leader_trait_libra_scientist_scholar_materialist_desc: "This scholar possesses expertise across multiple fields, offering unique insights from rare cyclones on gas giants to architectural ruins on lost colonies. The universe holds no isolated knowledge, only data dust with undiscovered connections.\n$libraf_lt_banner_7$"
 leader_trait_libra_scientist_scholar_materialist_tt: "$t$- Upon completion of anomaly:\n$tt$- $ADD_COUNCIL_AGENDA_PROGRESS$ §G+2500§!\n$t$- Upon completion of salvage or study of debris:\n$tt$- Gain £physics£§G900§! £society£§G900§! £engineering£§G900§! £trade£§G1500§!"

 leader_trait_libra_scientist_scholar_xenophobe: "Xeno-Scavenger"
 leader_trait_libra_scientist_scholar_xenophobe_desc: "Enemy wreckage requires thorough sterilization, and this cold scholar is the perfect executioner: resources found in debris are repurposed, prisoners dragged from corners are immediately executed.\n$libraf_lt_banner_8$"
 leader_trait_libra_scientist_scholar_xenophobe_tt: "Upon completion of salvage or study of debris:\n$tt$- Gain £energy£§G1800§! £influence£§G35§!"

 leader_trait_libra_scientist_scholar_xenophile: "Stellar Whisperer"
 leader_trait_libra_scientist_scholar_xenophile_desc: "While others ignore the chaotic whispers of astral rifts, this science officer actively extends sensors into dimensional folds- - not for sampling, but for handshakes. Each rift pulse becomes an intercultural love letter in [this.GetHisHer] translation, with twisted physics reforming into bridges in [this.GetHisHer] lab, helping the empire's tech tree grow new branches nourished by alien sunlight.\n$libraf_lt_banner_9$"
 leader_trait_libra_scientist_scholar_xenophile_tt: "For §Y5§! years after completing Astral Rift:\n$tt$- $MOD_COUNTRY_PHYSICS_TECH_RESEARCH_SPEED$: §G+5%§!\n$tt$- $mod_planet_jobs_productive_upkeep_mult$: §G-10%§!"
 leader_trait_libra_scientist_scholar_xenophile_effect: "Embracing the Rift"
 leader_trait_libra_scientist_scholar_xenophile_effect_desc: "We always choose open hands over clenched fists, for every embrace of the unknown eventually receives the multiverse's kiss in return."

# scientist governor

 leader_trait_libra_scientist_governor_destiny_a: "Exacting Optimizer"
 leader_trait_libra_scientist_governor_destiny_a_desc: "This specialist wields [this.GetHisHer] knowledge as the measure of all things - with each leap in cognitive ability, the lab's error tolerance tightens further; for ordinary staff to keep pace, superhuman effort is the only option.\nExcellence never begs for satisfaction, it only answers the demands of the wise.\n$libraf_lt_banner_21$"

 leader_trait_libra_scientist_governor_destiny_b: "Furrow Tracker"
 leader_trait_libra_scientist_governor_destiny_b_desc: "This meticulous scientist never overlooks a question worth exploring. [this.GetHeShe] wanders mountains and fields, compiling observed puzzles into records. Later, dedicated assistant teams transform these insights into new knowledge.\n$libraf_lt_banner_21$"
