 tr_libra_magnificence_4: "Art of Force Fields"
 tr_libra_magnificence_4_delayed: "Harness energy, weave laws. Let every force field become a hymn."
 tr_libra_magnificence_4_desc: "If a fully-upgraded §Y$tech_sentry_array$§! is owned:\n$t$$MOD_SHIP_CLOAKING_DETECTION_ADD$: §G+1§!\n$t$$MOD_SPY_NETWORK_DAILY_VALUE_MULT$: §G+25%§!\nIf a fully-upgraded §Y$tech_strategic_coordination$§! is owned:\n$t$$MOD_COUNCILOR_SKILL_ADD$: §G+1§!\n$t$$MOD_SHIP_FIRE_RATE_MULT$: §G+25%§!\nIf a fully-upgraded §Y$tech_mega_shipyard$§! is owned:\n$t$$MOD_COUNTRY_SHIP_UPGRADE_COST_MULT$: §G-10%§!\n$t$$mod_shipclass_military_build_speed_mult$: §G+25%§!"
 tr_libra_magnificence_5: "Eternal Radiance Unmoved"
 tr_libra_magnificence_5_delayed: "When grandeur becomes the norm, the cost of its maintenance must also be elegantly erased by our hands."

