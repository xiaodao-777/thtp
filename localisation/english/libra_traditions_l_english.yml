 situation_libra_pendragon_desc: "My honor is my life.\nMercy triumphs over conquest.\nCourage faces the abyss.\nJustice is like the scales.\nLet piety illuminate the soul.\nUnwavering loyalty endures.\nHumility builds monuments.\nSacrifice kindles eternity."
