 tradition_libra_meditation: "Meditation"
 tradition_libra_meditation_desc: "When thoughts pierce the abyss, civilizations ignite across the eternal night."
 tradition_libra_meditation_adopt_desc: "$tradition_libra_meditation_desc$$libraf_tr_banner_3$"
 tr_libra_meditation_adopt: "Meditation Tradition"
 tr_libra_meditation_adopt_desc: "$libra_unlock_edicts_y$['edict:libra_meditation_campaign_1',$edict_libra_meditation_campaign_1$]"
 council_agenda_agenda_libra_meditation_name: "Meditation in Mind"
 council_agenda_agenda_libra_meditation_desc: "In the mind's crucible, cosmic visions are forged; with spirit as flame, stairs to the infinite rise."
 agenda_libra_meditation_finish_modifier: "$council_agenda_agenda_libra_meditation_name$ Agenda"
 agenda_libra_meditation_finish_effect: "§YSkill Level§! of §Y3§! random £leader£ §YLeaders§! with the lowest level increased by §G+1§!\n§Y$planetary_ascension$§! of a random colony with the lowest tier increased by §G+1§!"
 tr_libra_meditation_finish: "Meditation Tradition Finish"
 tr_libra_meditation_1: "Nightwhispers"
 tr_libra_meditation_1_delayed: "Gaze upon stardust swirling in the void, heed entropic whispers frozen in stone. When thought plumbs matter's deepest folds, the universe reveals threads weaving all creation."
 tr_libra_meditation_1_desc: "$libra_unlock_edicts_y$['edict:libra_meditation_campaign_2',$edict_libra_meditation_campaign_2$]"
 tr_libra_meditation_2: "Abyss Sailing"
 tr_libra_meditation_2_delayed: "Forge memories into rafts; sail time's frozen eddies upstream. Amid causality's reefs, gather crystals of unchosen possibilities."
 tr_libra_meditation_2_desc: "$libra_unlock_edicts_y$['edict:libra_meditation_campaign_3',$edict_libra_meditation_campaign_3$]"
 tr_libra_meditation_3: "Orbital Truths"
 tr_libra_meditation_3_delayed: "From orbital dances of celestial bodies, we discern cosmic laws."
 tr_libra_meditation_3_desc: "Per controlled §YSystem§!:\n$t$$mod_starbases_upkeep_mult$: §G-1%§! (Max: §G-25%§!)\n$t$$MOD_SHIP_STARTING_EXPERIENCE_ADD$: §G+40§! (Max: §G+1000§!)"
 tr_libra_meditation_4: "Inscribed Truths"
 tr_libra_meditation_4_delayed: "From ancient pages and bygone ages, we grasp eternal truths."
 tr_libra_meditation_4_desc: "Per owned §HInsight Technology§!:\n$t$$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+1%§! (Max: §G+10%§!)\n$t$$MOD_LEADER_SPECIES_EXP_GAIN$: §G+1%§! (Max: §G+10%§!)"
 tr_libra_meditation_5: "Thought Confluence"
 tr_libra_meditation_5_delayed: "Entropic tides and stellar laws converge in our grasp - we cast lines into the Shroud to harvest bounty for mortal realms."
 tr_libra_meditation_5_desc: "$libra_unlock_edicts_y$\n$t$['edict:libra_meditation_campaign_4',$edict_libra_meditation_campaign_4$]\n$t$['edict:libra_meditation_campaign_5',$edict_libra_meditation_campaign_5$]\n$t$['edict:libra_meditation_campaign_6',$edict_libra_meditation_campaign_6$]"
 edict_libra_meditation_campaign_1: "Master's Wisdom: Paths Untangled"
 edict_libra_meditation_campaign_1_desc: "Where discourse tangles, clarity dawns - agendas unfold like straight roads through wilds."
 edict_libra_meditation_campaign_2: "Master's Wisdom: Swift Current"
 edict_libra_meditation_campaign_2_desc: "Thought outpaces light; stars bow to will - fleets ride the void's flow between heartbeats."
 edict_libra_meditation_campaign_3: "Master's Wisdom: Late Advantage"
 edict_libra_meditation_campaign_3_desc: "A delayed hand moves with timeless grace - marble towers rise where dust once lay."
 edict_libra_meditation_campaign_4: "Master's Wisdom: Emptiness-Realized"
 edict_libra_meditation_campaign_4_desc: "When matter and mind dissolve as mist - guns speak the piercing truth of void."
 edict_libra_meditation_campaign_5: "Master's Wisdom: Illusion's Loom"
 edict_libra_meditation_campaign_5_desc: "Reality weaves with phantom thread - mortal hands spin cosmic yields."
 edict_libra_meditation_campaign_6: "Master's Wisdom: Life Reforged"
 edict_libra_meditation_campaign_6_desc: "From withered branch, new blossoms surge - eternal tides birth nations in a sigh."

