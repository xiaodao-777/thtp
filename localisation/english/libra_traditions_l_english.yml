 LIBRA_CEREMONY_TRADITION_EFFECT_2_DESC: "It's time to start preparing for the new ceremony.\n\n§HCan trigger the $tr_libra_ceremony_adopt$ effect\nGet §G2§! sheets of ['concept_libra_ceremony_characters']§!"
 concept_libra_ceremony_characters: "Peach Characters"
