 libra_fairy.1600.name: "Celestial Vows"
 libra_fairy.1600.desc: "When the last trial-flame flickers out in the void,\nStellar relics hum into sacred silence -\nYour bloodline, tempered by a thousand days of cosmic crusades,\nHas etched immortal runes upon the firmament:\n\nStardust for flesh, virtue for soul, oaths for bone\n\nBehold! The bane-lances that sundered armadas\nNow shatter as crystal starshatter before your shield.\nThe entropic abyss that barred celestial paths\nBlossoms with light-trails beneath your tread.\n\nThe cosmos shall remember this truth of chivalry:\nNot for blades that cleave chaos are we hallowed,\nBut when mortal steel is forged in astral fires,\nNot one spark betrays the primal vow."


