 tradition_libra_autarchy: "Autarchy"
 tradition_libra_autarchy_desc: "Mandated by Heaven, enduring and eternally prosperous."
 tradition_libra_autarchy_adopt_desc: "$tradition_libra_autarchy_desc$$libraf_tr_banner_17$"
 tr_libra_autarchy_adopt: "Autarchy Tradition"
 council_agenda_agenda_libra_autarchy_name: "Heaven's Mandate"
 council_agenda_agenda_libra_autarchy_desc: "Boundless is Heaven's grace, lightening the burdens of all living beings; eternal is the Imperial reign, its virtue nourishing all things, sparing them from waste."
 agenda_libra_autarchy_finish_modifier: "$council_agenda_agenda_libra_autarchy_name$ Agenda"
 tr_libra_autarchy_finish: "Autarchy Tradition Finish"
 tr_libra_autarchy_1: "Mirror of Celestial Observation"
 tr_libra_autarchy_1_delayed: "A mirror hung high among the star-forts, a beacon illuminating the eight wildernesses; where its light flows, wisdom is born."
 tr_libra_autarchy_1_desc: "Each point of utilized £mod_country_starbase_capacity_add£ §Y$STARBASE_CAPACITY_TITLE$§! grants £physics£§G45§! £society£§G45§! £engineering£§G45§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_1',$edict_libra_autarchy_1$]"
 tr_libra_autarchy_2: "Pillars of the Stabilizing Palace"
 tr_libra_autarchy_2_delayed: "Palaces rise above myriad domains, their pillars rooted deep in the soil of a trillion subjects.\nClearer governance begets brighter halls, greater intellect and skill."
 tr_libra_autarchy_2_desc: "Each £district£ §YDistrict§! grants £physics£§G3§! £society£§G3§! £engineering£§G3§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_2',$edict_libra_autarchy_2$]"
 tr_libra_autarchy_3: "Seal of Heavenly Succession"
 tr_libra_autarchy_3_delayed: "He who holds this seal commands the lifelines of the starry river.\nThe flow of star-sectors becomes tribute; lands within the mapped domain overflow with richness."
 tr_libra_autarchy_3_desc: "Each controlled £system£ §YStar System§! grants £energy£§G7§! £trade£§G5§! £alloys£§G3§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_3',$edict_libra_autarchy_3$]"
 tr_libra_autarchy_4: "Tripod of Established Dominion"
 tr_libra_autarchy_4_delayed: "The Nine Tripods secure the eight directions; divided lands offer rare treasures.\nNo hidden ore or secret hoard within the realm touched by the King's transformation dares not be presented."
 tr_libra_autarchy_4_desc: "Each owned £planet£ §YColony§! grants £volatile_motes£§G5§! £exotic_gases£§G5§! £rare_crystals£§G5§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_4',$edict_libra_autarchy_4$]"
 tr_libra_autarchy_5: "Sovereign of Mortal Realms"
 tr_libra_autarchy_5_delayed: "The Lord of all living beings, defending the Way with force, enlightening wisdom with the Way."
 tr_libra_autarchy_5_desc: "Each point of utilized £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§! grants £physics£§G0.50§! £society£§G0.50§! £engineering£§G0.50§!\n$libra_unlock_edicts_y$['edict:libra_autarchy_5',$edict_libra_autarchy_5$]"
 edict_libra_autarchy_1: "Heaven's Listening Edict"
 edict_libra_autarchy_1_desc: "Spread eyes and ears throughout the starry sea, listening to the breath of all domains. Those whose territory is not yet full shall make their multitudes diligent and their central court swift in judgment."
 edict_libra_autarchy_2: "Earthly Ordinance Command"
 edict_libra_autarchy_2_desc: "Survey and map, establish registers, clarify borders and administration. Those whose territory is newly formed shall let their talents fully blossom, and ensure edicts circulate across all stars."
 edict_libra_autarchy_3: "Cosmic Cartography"
 edict_libra_autarchy_3_desc: "Comprehend the celestial star charts, gather all cosmic mysteries. Whether as guardian of the starry sea, or holding half the galaxy's mountains and rivers, let the wisdom of investigation surge forth like a spring."
 edict_libra_autarchy_4: "Tribute from the Four Seas"
 edict_libra_autarchy_4_desc: "Might extends to the four seas, virtue covers the eight wilderness. Whether wielding guardianship authority, or grasping half the celestial pivot, let the military be mighty, and the hundred-times refined fine metal flow unceasingly."
 edict_libra_autarchy_5: "Mandate of Heaven's Return"
 edict_libra_autarchy_5_desc: "Tread the supreme seat, rule the six directions. On the day the entire cosmos is governed, the Mandate of Heaven materializes into form; the Great Way's Jade Seal appears henceforth."
 libra_autarchy_0_requires: "$TRIGGER_FAIL$Control at least §Y25§! Systems"
 libra_autarchy_1_requires: "$TRIGGER_FAIL$Control at least §Y50§! Systems"
 libra_autarchy_2_requires: "$TRIGGER_FAIL$Control at least §Y100§! Systems"
 libra_autarchy_3_requires: "$TRIGGER_FAIL$Control at least §Y200§! Systems"
 libra_fairy.1650.name: "The Mandate Made Manifest"
 libra_fairy.1650.desc: "The alignment of stars subtly shifts, the galaxy's spiral arms seem to slow their rotation for this moment. As you ascend to the throne of the starry sea and grasp the supreme authority, an indescribable resonance ripples through every corner of the Empire.\n\nStarport engineers find once-complex maintenance procedures suddenly flowing smoothly; bureaucrats on administrative worlds notice piled-up budget proposals becoming instantly clear, redundant expenditures vanishing like frost under sunlight; even the most remote mining stations see equipment wear drop to unprecedented lows.\n\nThe Mandate is no longer a concept; it has become an observable, tangible, utilizable objective reality for your Empire. Stardust flow offers you efficiency; energy surges save you fractions. This is not thrift - it is the cosmos' tribute. This is not rule - it is the universe's submission."
 libra_fairy.1650.a: "Ascend to our throne."
 r_libra_autarchy_seal: "Imperial Seal of Heaven's Mandate"
 r_libra_autarchy_seal_desc: "Forging celestial governance upon a foundation of vast domains; all who touch the stars shall revere the crown as sovereign."
 libra_autarchy_seal_effect_tt: "§RThis relic has no effect for empires that do not meet the conditions§!"
 libra_autarchy_seal_active_effect: "Gain £influence£§G2§! £trade£§G500§! per controlled System"
 libra_autarchy_seal_modifier: "Commanding the Starry Sea"
 libra_autarchy_seal_modifier_desc: "Where the star-sectors reach, all is royal soil; what the scepter's light touches, all transforms into jade order."

