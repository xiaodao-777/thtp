 tradition_libra_havoc: "Havoc"
 tradition_libra_havoc_desc: "Where the blade points, mountains and rivers turn to ruins;\nWhere the iron hooves pass, legions become dust."
 tradition_libra_havoc_adopt_desc: "$tradition_libra_havoc_desc$$libraf_tr_banner_21$"
 tr_libra_havoc_adopt: "Havoc Tradition"
 council_agenda_agenda_libra_havoc_name: "Final Declaration"
 council_agenda_agenda_libra_havoc_desc: "War never changes; it merely awaits a more perfect form.\nWhen peace becomes a eulogy, we are the only verb."
 agenda_libra_havoc_finish_modifier: "$council_agenda_agenda_libra_havoc_name$ Agenda"
 agenda_libra_havoc_finish_effect: "During the period of the agenda's effect, all war $EFFECTS_TXT$ of the §E$libra_mod_name$§! shall be activated."
 tr_libra_havoc_finish: "Havoc Tradition Finish"
 tr_libra_havoc_finish_desc: "Each §Ypurified§! or §Ybombed§! £pop£ §Y$POP$§! brings £energy£§G2§! £trade£§G2§!"
 tr_libra_havoc_1: "Form of Latency"
 tr_libra_havoc_1_delayed: "Let the land forget the weight of armies, until it needs to remember the warmth of blood."
 tr_libra_havoc_1_desc: "$libra_peace_effect$\n$t$$mod_armies_upkeep_mult$: §G-20%§!\n$libra_war_effect$\n$t$$MOD_ARMY_ATTACK_DAMAGE_MULT$: §G+50%§!\n$t$$MOD_ARMY_ATTACK_MORALE_MULT$: §G+50%§!\n$t$$MOD_ARMY_ATTACK_HEALTH_MULT$: §G+50%§!"
 tr_libra_havoc_2: "Sea of Silence"
 tr_libra_havoc_2_delayed: "Let the star-sea grow accustomed to the absence of fleet shadows, so that when it shatters, a clearer sound can be heard."
 tr_libra_havoc_2_desc: "$libra_peace_effect$\n$t$$mod_ships_upkeep_mult$: §G-20%§!\n$libra_war_effect$\n$t$$MOD_SHIP_ACCURACY_MULT$: §G+10%§!\n$t$$MOD_SHIP_TRACKING_MULT$: §G+10%§!\n$t$$MOD_SHIP_ORBITAL_BOMBARDMENT_MULT$: §G+50%§!"
 tr_libra_havoc_3: "Oath of the Forge"
 tr_libra_havoc_3_delayed: "In peacetime, our forges operate at full capacity, shaping every gram of metal; when war comes, they roar solely to shatter shields."
 tr_libra_havoc_3_desc: "$libra_peace_effect$\n$t$$MOD_ARMY_BUILD_SPEED_MULT$: §G+50%§!\n$libra_war_effect$\n$t$$MOD_ARMY_BUILD_SPEED_MULT$: §G+25%§!\n$t$$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+10%§!"
 tr_libra_havoc_4: "Pact of Iron and Blood"
 tr_libra_havoc_4_delayed: "Every battery raised in the void is a simple promise: the armor you rely on shall become your final coffin."
 tr_libra_havoc_4_desc: "$libra_peace_effect$\n$t$$mod_shipclass_military_station_build_speed_mult$: §G+50%§!\n$libra_war_effect$\n$t$$mod_shipclass_military_station_build_speed_mult$: §G+25%§!\n$t$$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+10%§!"
 tr_libra_havoc_5: "Furnace of the End"
 tr_libra_havoc_5_delayed: "When the last warship leaves the dock, construction itself loses meaning. Thereafter, the sole purpose of existence is to ensure the enemy's ends before ours."
 tr_libra_havoc_5_desc: "$libra_peace_effect$\n$t$$mod_shipclass_military_build_speed_mult$: §G+50%§!\n$libra_war_effect$\n$t$$mod_shipclass_military_build_speed_mult$: §G+25%§!\n$t$$MOD_SHIP_HULL_DAMAGE_MULT$: §G+15%§!"

#

 tradition_libra_bastion: "Bastion"
 tradition_libra_bastion_desc: "Sacrifice ourselves for the national calamity, viewing death as just returning home!"
 tradition_libra_bastion_adopt_desc: "$tradition_libra_bastion_desc$$libraf_tr_banner_22$"
 tr_libra_bastion_adopt: "Bastion Tradition"
 council_agenda_agenda_libra_bastion_name: "The Sky Wall"
 council_agenda_agenda_libra_bastion_desc: "Our border is the edge of the universe."
 agenda_libra_bastion_finish_modifier: "$council_agenda_agenda_libra_bastion_name$ Agenda"
 agenda_libra_bastion_finish_effect: "Create up to §G3§! §Y$military_station_small_plural$§! for §Y$dsc_name$§! and §Y$orbital_ring_tier_1$§! that have empty slots"
 tr_libra_bastion_finish: "Bastion Tradition Finish"
 tr_libra_bastion_1: "Ramparts Like Mountains"
 tr_libra_bastion_1_delayed: "When crisis arrives, every inch of land becomes a battlefield, every city transforms into a fortress that shall never fall."
 tr_libra_bastion_1_desc: "$libra_unlock_decisions_y$$decision_libra_bastion_1_a$"
 decision_libra_bastion_1_a: "Emergency Defenses"
 decision_libra_bastion_1_a_desc: "When alarms echo across the sky, the land must learn to grow fangs. All territory shall be conscripted, becoming the first line of resistance."
 decision_libra_bastion_1_b: "Dismantle Temporary Fortifications"
 decision_libra_bastion_1_b_desc: "Lift the crisis response fortifications on this colony."
 d_libra_bastion_tradition: "Bulwark Defensive Works"
 d_libra_bastion_tradition_desc: "This colony's core facilities have been relocated deep within the defense network."
 tr_libra_bastion_2: "Homeland's Blessing"
 tr_libra_bastion_2_delayed: "Under the starlight of our homeland, warships carry the weight of civilization; at the moment of victory, the stars themselves offer tribute."
 tr_libra_bastion_2_desc: "$libra_unlock_features_y$['concept_libra_warrior_reward']"
 concept_libra_warrior_reward: "Warrior's Incentive"
 concept_libra_warrior_reward_desc: "Every §Y2§! years, when winning a §Yspace battle in home territory§!, gain §G3§! months (no less than §Y1800§!) of £alloys£ §Y$alloys$§! and §G5§! months (no less than §Y5000§!) of £trade£ §Y$trade$§!, and grant §G3600§! experience to the $commander_with_icon$ with the §Ylowest skill level§!."
 tr_libra_bastion_3: "Forged Frontier"
 tr_libra_bastion_3_delayed: "Raise immortal gates within the void; each star fortress stands as a testament to our oath, causing invaders to halt in their tracks."
 tr_libra_bastion_3_desc: "$libra_unlock_edicts_y$['edict:libra_bastion_1',$edict_libra_bastion_1$]"
 edict_libra_bastion_1: "Not One Inch Ceded"
 edict_libra_bastion_1_desc: "We solemnly declare: every planet shall become a fortress. If enemies wish to lay hands on our lands, they must first pay the price of blood for the entire starry sky."
 tr_libra_bastion_4: "Scorched to the Last Ash"
 tr_libra_bastion_4_delayed: "Lost lands still breathe; with every pulse, they cry out for vengeance. We shall mark the day of their fall with the annihilation of our enemies."
 tr_libra_bastion_4_desc: "$libra_unlock_features_y$['concept_libra_reclaiming_homeland']\n$MOD_STARBASE_DEFENSIVE_WAR_SHIP_BUILD_SPEED_MULT$: §G+50%§!\n$mod_deep_space_citadel_limit_add$: §G+1§!"
 concept_libra_reclaiming_homeland: "Reclaiming the Homeland"
 concept_libra_reclaiming_homeland_desc: "For §Y720§! days after a £system£ §YSystem§! §Yfalls§! or is §Ycaptured§!, gain §G+10%§! £mod_ship_weapon_damage£ §Y$MOD_SHIP_WEAPON_DAMAGE$§! and £mod_ship_home_territory_fire_rate_mult£ §Y$MOD_SHIP_HOME_TERRITORY_FIRE_RATE_MULT$§!, and reduce §G-1%§! £mod_country_war_exhaustion_mult£ §Y$MOD_COUNTRY_WAR_EXHAUSTION_MULT$§!. Effects are calculated independently $EMPIRE_EFFECTS_W_ICON$ with £time£ §Yduration§!. Can only trigger once per £system£ §YSystem§! within §Y360§! days."
 tr_libra_bastion_5: "Anchored in Perpetual Night"
 tr_libra_bastion_5_delayed: "Let defense platforms sink like anchors into the star-sea, let docked warships become a shield-wall that never falls. The peace of the frontier begins with our unyielding vigilance."

