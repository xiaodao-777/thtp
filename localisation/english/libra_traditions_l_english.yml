 tradition_libra_imperium: "Imperium"
 tradition_libra_imperium_desc: "Power shifts like stellar currents, systems converge where sovereignty burns."
 tradition_libra_imperium_adopt_desc: "$tradition_libra_imperium_desc$$libraf_tr_banner_4$"
 tr_libra_imperium_adopt: "Imperium Tradition"
 council_agenda_agenda_libra_imperium_a_name: "Sovereign Mandate"
 council_agenda_agenda_libra_imperium_a_desc: "Decentralized power converges at the core, weaving governance into the ruler's palm; all realms within the void thrive under this law."
 agenda_libra_imperium_a_finish_modifier: "$council_agenda_agenda_libra_imperium_a_name$ Agenda"
 tr_libra_imperium_finish: "Imperium Tradition Finish"
