 tradition_libra_drudgery: "Drudgery"
 tradition_libra_drudgery_desc: "Civilization is built upon nameless bones,\nStarlight rises from the dust and smoke of toil."
 tradition_libra_drudgery_adopt_desc: "$tradition_libra_drudgery_desc$$libraf_tr_banner_16$"
 tr_libra_drudgery_adopt: "Drudgery Tradition"
 council_agenda_agenda_libra_drudgery_name: "Flesh Tribute"
 council_agenda_agenda_libra_drudgery_desc: "Non-citizens are but state assets. Their numbers are our mineral deposits, their very lives our sustenance."
 agenda_libra_drudgery_finish_modifier: "$council_agenda_agenda_libra_drudgery_name$ Agenda"
