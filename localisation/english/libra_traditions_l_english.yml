 tr_libra_ceremony_3: "Wish of the Year"
 tr_libra_ceremony_3_delayed: "The monument to heritage."
 tr_libra_ceremony_3_desc: "Every §Y5§! years, get §G1§! sheet of ['concept_libra_ceremony_characters'] when §Ybuilt§! or §Yupgrade $megastructures$§!"
 tr_libra_ceremony_4: "Fleeting Glimpses of Celestial Glow"
 tr_libra_ceremony_4_delayed: "Here and there, wherever possible, infinite treasures lurk."
 tr_libra_ceremony_4_desc: "Get §G11§! sheets of ['concept_libra_ceremony_characters']"
 tr_libra_ceremony_5: "Starlit Brilliance Like Blazing Flames"
 tr_libra_ceremony_5_delayed: "The blessings of nature are with us: providence is upon us."
 tr_libra_ceremony_5_desc: "Get §G1§! sheet of ['concept_libra_ceremony_characters'] every §Y5§! years"
 LIBRA_CEREMONY_TRADITION_EFFECT_TITLE: "$tr_libra_ceremony_adopt$ Refreshed"
