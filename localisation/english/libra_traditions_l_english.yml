 tradition_libra_vector: "Vector"
 tradition_libra_vector_desc: "Set the course, command the route."
 tradition_libra_vector_adopt_desc: "$tradition_libra_vector_desc$$libraf_tr_banner_20$"
 tr_libra_vector_adopt: "Vector Tradition"
 council_agenda_agenda_libra_vector_name: "Beyond Lightspeed"
 council_agenda_agenda_libra_vector_desc: "The ceiling of speed is but a footnote left by predecessors. And we shall overwrite it with a new definition."
 agenda_libra_vector_finish_modifier: "$council_agenda_agenda_libra_vector_name$ Agenda"
 tr_libra_vector_finish: "Vector Tradition Finish"
 tr_libra_vector_finish_desc: "$libra_unlock_edicts_y$['edict:libra_vector_finish',$edict_libra_vector_finish$]"
 edict_libra_vector_finish: "Master the Space"
 edict_libra_vector_finish_desc: "We know the length of the starry sky and are ready to make use of it at any time."
 tr_libra_vector_1: "Path Optimization Protocol"
 tr_libra_vector_1_delayed: "Recalibrating spatial tension and launch coordinates, transforming each activation of the macro-launcher into a parsable stream of transit data."
 tr_libra_vector_1_desc: "$libra_unlock_edicts_y$['edict:libra_vector_1',$edict_libra_vector_1$]"
 edict_libra_vector_1: "Channel Research"
 edict_libra_vector_1_desc: "Capture the shadows of time and space from the energy dissipation of relays; every joule ignites a spark of thought."
 tr_libra_vector_2: "Evasion Protocol Analysis"
 tr_libra_vector_2_delayed: "Preload risk matrices for all navigation vehicles, calculating the most stable safe path in advance along the cliffs of probability."
 tr_libra_vector_2_desc: "$libra_unlock_edicts_y$['edict:libra_vector_2',$edict_libra_vector_2$]"
 edict_libra_vector_2: "Risk Evasion"
 edict_libra_vector_2_desc: "Preset an elegant exit route for every unit; survival itself is the best intelligence."
 tr_libra_vector_3: "Deep-Space Constant Compilation"
 tr_libra_vector_3_delayed: "From each successful deep-space projection, reversely compile more precise physical foundations that drive the cosmos."
 tr_libra_vector_4: "Recursive Loop Optimization"
 tr_libra_vector_4_delayed: "Apply buffer technology derived from risk protocols, significantly reducing the cooldown of FTL engines and enhancing fleet mobility."
 tr_libra_vector_5: "Portal Effect"
 tr_libra_vector_5_delayed: "When every stargate hums the same frequency, space itself bends to our melody."
 tr_libra_vector_5_desc: "For each §Y$gateway_final$§! owned:\n$t$$MOD_SHIP_SPEED_MULT$: §G+3%§! (Max: §G+30%§!)\n$t$$mod_planet_traders_physics_research_produces_add$: §G+0.20§! (Max: §G+2§!)\n$t$$mod_planet_politicians_physics_research_produces_add$: §G+0.20§! (Max: §G+2§!)"
 tr_libra_vector_5_s1_desc: "For each §Y$gateway_final$§! owned:\n$t$$MOD_SHIP_SPEED_MULT$: §G+3%§! (Max: §G+30%§!)\n$t$$mod_planet_traders_physics_research_produces_add$: §G+0.20§! (Max: §G+2§!)\n$t$$mod_planet_evaluators_physics_research_produces_add$: §G+0.20§! (Max: §G+2§!)"

