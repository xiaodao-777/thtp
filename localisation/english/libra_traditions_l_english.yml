 tr_libra_drudgery_1: "Minimum Work Hours"
 tr_libra_drudgery_1_delayed: "Reduce their sleep and meals, strip away their joys and sorrows; beneath weary bodies lies efficiency."
 tr_libra_drudgery_2: "Sustenance Control"
 tr_libra_drudgery_2_delayed: "Feed them scraps, control them with empty pleasures; a low-maintenance body is a good tool."
 tr_libra_drudgery_3: "Caged World"
 tr_libra_drudgery_3_delayed: "Forged bars for a sky, drawn lines for a cage; with no other path, only exhaustive effort remains."
 tr_libra_drudgery_3_desc: "$libra_unlock_policies_y$$policy_libra_drudgery_tradition$"
 policy_libra_drudgery_tradition: "Labor Charter"
 policy_libra_drudgery_tradition_desc: "Determines how we utilize the productivity of slaves and convicts."
 policy_libra_drudgery_tradition_a: "Planetary Maintenance"
 policy_libra_drudgery_tradition_a_desc: "Street sweeping is fundamental work."
 policy_libra_drudgery_tradition_b: "Construction Drudgery" 
 policy_libra_drudgery_tradition_b_desc: "Assign them to the most dangerous and labor-intensive construction tasks."
 policy_libra_drudgery_tradition_c: "Warfare Attendants"
 policy_libra_drudgery_tradition_c_desc: "The strong are conscripted; the rest serve as combat practice for our soldiers."
 policy_libra_drudgery_tradition_d: "Stevedores & Handlers"
 policy_libra_drudgery_tradition_d_desc: "Endless, repetitive labor will break the will of the unfree."
 policy_libra_drudgery_tradition_e: "Alien Playthings"
 policy_libra_drudgery_tradition_e_desc: "Those stripped of dignity become a means of stress relief for Imperial citizens."
 tr_libra_drudgery_4: "High-Pressure Oversight"
 tr_libra_drudgery_4_delayed: "Fear is the finest catalyst.\nUnder the whip and surveillance, any slack is a luxury."
 tr_libra_drudgery_4_desc: "$libra_unlock_decisions_y$$decision_libra_drudgery_4$"
 decision_libra_drudgery_4: "Normalized Oppression"
 decision_libra_drudgery_4_desc: "Using non-person bodies as fuel, desperate souls as furnace fire."
 libra_drudgery_decision_modifier: "High-Pressure Taskmasters"
 libra_drudgery_decision_modifier_desc: "Every individual on this world must bear the burden of heavy corvée labor."
 tr_libra_drudgery_5: "Covert Infiltration"
 tr_libra_drudgery_5_delayed: "Unseen eyes and whispers bind souls better than shackles.\nInternal division is the most efficient supervision."
 tr_libra_drudgery_5_desc: "$libra_unlock_decisions_y$$decision_libra_drudgery_5$"
 decision_libra_drudgery_5: "End Oversight"
 decision_libra_drudgery_5_desc: "Nothing left to enslave here. Let's find another place."

