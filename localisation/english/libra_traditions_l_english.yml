 decision_libra_adventure_finish: "Planetary Adventure"
 decision_libra_adventure_finish_desc: "Let's see if this place hides any unknown treasures."
 decision_libra_adventure_finish_effect: "There is a chance of finding §Y$specimens$§!."
 libra_adventure_decision_modifier: "Adventure Aftermath"
 libra_adventure_decision_modifier_desc: "The adventure frenzy is over, but there's a lot we can arrange while we're at it."
 tr_libra_adventure_1: "Alien Scenery"
 tr_libra_adventure_1_delayed: "In the past, the forefathers fantasized countless times about the other side of the river of stars.\nThe present, the visions of yesteryear are within reach."
 tr_libra_adventure_1_desc: "Neocolonial completion:\n$t$§Y$SECTOR_GOVERNOR_TITLE$§! gain §G120§! experience\n$t$§YAll $official_with_icon$§! gain §G120§! experience"
 tr_libra_adventure_2: "Starry Map"
 tr_libra_adventure_2_delayed: "See the star-studded points of light in the night sky?\nThat's where we're about to arrive."
 tr_libra_adventure_2_desc: "First time visiting a system:\n$t$£leader£ §YShip Leader§! gain §G240§! experience\n$t$Gain §Y0.5§! months of £physics£ £society£ £engineering£ §YResearch Points§! output"
 tr_libra_adventure_3: "Treasure trove."
 tr_libra_adventure_3_delayed: "May we know the value of the treasure?\nOur trophy warehouse is ready."
 tr_libra_adventure_4: "Support the fleet."
 tr_libra_adventure_4_delayed: "Our adventures are not possible without complete logistics."
 tr_libra_adventure_5: "Radical experimentation"
 tr_libra_adventure_5_delayed: "Is there anything that isn't available?\nTry it to find out."
 libra_adventure_aesthetic_wonders_1: "Diamond-encrusted Artifacts"
 libra_adventure_aesthetic_wonders_1_desc_short: "Ancient Diamond Crafts"
 libra_adventure_aesthetic_wonders_1_desc_details: "The function of this piece of jewelry is enigmatic; it may be part of a pendant, or it may be a link in a ring or necklace. Regardless, this item brings a novel art form into our empire."
 libra_adventure_aesthetic_wonders_2: "Rune Compass"
 libra_adventure_aesthetic_wonders_2_desc_short: "A compass inscribed with runes"
 libra_adventure_aesthetic_wonders_2_desc_details: "This compass is inscribed with alien writing, the purpose of which is unknown. At the very least, it looks rather ornate."
 libra_adventure_aesthetic_wonders_3: "Decorative Picture Frames"
 libra_adventure_aesthetic_wonders_3_desc_short: "Ruby-encrusted picture frame"
 libra_adventure_aesthetic_wonders_3_desc_details: "This metal frame made of a low-purity alloy is inlaid with a large number of rubies for a classic aesthetic."
 libra_adventure_aesthetic_wonders_4: "Glass Ornament"
 libra_adventure_aesthetic_wonders_4_desc_short: "Amber-like glass artwork"
 libra_adventure_aesthetic_wonders_4_desc_details: "A miniature miniature bonsai is enclosed in this glass sphere."
 libra_adventure_aesthetic_wonders_5: "Miniature Crystal Palace"
 libra_adventure_aesthetic_wonders_5_desc_short: "Ultra-small works of art made in the micro-sculpture process"
 libra_adventure_aesthetic_wonders_5_desc_details: "Who would believe that this opulent crystal palace was actually carved on a mineral crystal less than 1 centimeter long, which is hard to see in its entirety with the naked eye."
 libra_adventure_aesthetic_wonders_6: "Mystic Badge"
 libra_adventure_aesthetic_wonders_6_desc_short: "Badge made of gold and sapphire"
 libra_adventure_aesthetic_wonders_6_desc_details: "Ornate and valuable, its replicas are enough to start a treasure-hunting frenzy in the Empire."
 libra_adventure_aesthetic_wonders_7: "Shield of Glitter"
 libra_adventure_aesthetic_wonders_7_desc_short: "Ritual Shield"
 libra_adventure_aesthetic_wonders_7_desc_details: "A shield used for royal ceremonies in some ancient empire, representing the highest level of metallurgical technology at the time."
 libra_adventure_aesthetic_wonders_8: "Crystal Crown"
 libra_adventure_aesthetic_wonders_8_desc_short: "Hollow crystal artifact"
 libra_adventure_aesthetic_wonders_8_desc_details: "It is rumored that mastery of this crown is also mastery of ultimate wealth."
 libra_adventure_aesthetic_wonders_9: "Rock Flowers"
 libra_adventure_aesthetic_wonders_9_desc_short: "A flower carved out of a block of natural rock"
 libra_adventure_aesthetic_wonders_9_desc_details: "Uncut and put together in no way, this gorgeous flower was taken out of the rock by a skilled craftsman."
 libra_adventure_aesthetic_wonders_10: "Heart of Mia"
 libra_adventure_aesthetic_wonders_10_desc_short: "Treasures from the Astral Plane"
 libra_adventure_aesthetic_wonders_10_desc_details: "An accessory belonging to 'Mia the Enforcer', with an intense energy mass inside. Its mysterious energy affects and enhances our entire empire."
 libra_adventure_historical_items_1: "Ancient Quantum Processor"
 libra_adventure_historical_items_1_desc_short: "Ancient chipset of unknown purpose"
 libra_adventure_historical_items_1_desc_details: "Processing terminals left behind by some ancient mechanical empire of unknown use and some research value."
 libra_adventure_historical_items_2: "Crystalline Levitation Lamp"
 libra_adventure_historical_items_2_desc_short: "Floating streetlights made of crystals"
 libra_adventure_historical_items_2_desc_details: "In the distant past, street lamps utilizing this ‘crystal levitation lamp’ technology were a common sight on the streets of an empire."
 libra_adventure_historical_items_3: "Ancient Lamps"
 libra_adventure_historical_items_3_desc_short: "Medieval crafts"
 libra_adventure_historical_items_3_desc_details: "A unique lamp, it is not easy for an item made of paper and bamboo sticks to be preserved until now."
 libra_adventure_historical_items_4: "Ornate Artifacts"
 libra_adventure_historical_items_4_desc_short: "Large medieval artifacts"
 libra_adventure_historical_items_4_desc_details: "Luxurious ornaments made of gold, diamonds, glass, crystal, and a host of other luxurious materials, the aesthetics of the craftsmen who made it are quite ahead of their time today."
 libra_adventure_historical_items_5: "Rock Machinery"
 libra_adventure_historical_items_5_desc_short: "Rock-constructed mechanical clock"
 libra_adventure_historical_items_5_desc_details: "Mechanical clocks made of fluorite and other diverse stone composites that seem to have been running uninterrupted for tens of thousands of years without showing any signs of wear."
 libra_adventure_historical_items_6: "Ancient Energy Transmitter"
 libra_adventure_historical_items_6_desc_short: "Small energy weapons produced by the Prehistoric Empire"
 libra_adventure_historical_items_6_desc_details: "An advanced one-man weapon made by one of the Ultra-Ancient Empires, it's power at full power when charged exceeds that of even a small Gamma Laser Battery."
 libra_adventure_historical_items_7: "Ancient Cold Weapon"
 libra_adventure_historical_items_7_desc_short: "The unbroken sword"
 libra_adventure_historical_items_7_desc_details: "The historical legends of various civilizations are true and hard to verify. It does, however, make for a sharp sword that cuts through iron."
 libra_adventure_historical_items_8: "Mechanical Pocket Watch"
 libra_adventure_historical_items_8_desc_short: "Mechanical watch containing ze celluloid dust"
 libra_adventure_historical_items_8_desc_details: "Not accelerating the time around it, individuals who are in the vicinity of this pocket watch unconsciously increase their speed of movement. Apparently, this is due to psychic energy wave perturbation."
 libra_adventure_historical_items_9: "Crystalline Dust Battle Flag"
 libra_adventure_historical_items_9_desc_short: "Flag of the ghostly blue"
 libra_adventure_historical_items_9_desc_details: "A flag that seems to suck souls into it, it is impossible to predict or know how many entities in the past have fallen to the horrors of this deep blue."
 libra_adventure_historical_items_10: "The Golden Red Treasure"
 libra_adventure_historical_items_10_desc_short: "The Treasure of the Named"
 libra_adventure_historical_items_10_desc_details: "It is rumored that there was once a great empire in the Otherworld like no other, and that this treasure is the only legacy left behind from the time of its overthrow, and that those who obtain it will be able to gain access to intangible revelations. As far as we're concerned, it's just a decorated empty chest."
 libra_adventure_xeno_geology_1: "Rare Crystal Clusters"
 libra_adventure_xeno_geology_1_desc_short: "Rare natural mineral crystals"
 libra_adventure_xeno_geology_1_desc_details: "Discovered by explorers, this exotic crystal cluster contains almost every rare metal that can be found on the periodic table. The strange phenomenon of multiple elements coming together in the same mineral was long thought to be impossible."
 libra_adventure_xeno_geology_2: "Tree of Crystallization"
 libra_adventure_xeno_geology_2_desc_short: "The Crystal Tree that pools psychic energy"
 libra_adventure_xeno_geology_2_desc_details: "This is a crystal sapling made of silica, which is quite similar to stony creatures. Possibly due to the original growth environment being rich in reiatsu, its metabolism is constantly absorbing zeolite particles from the converging surroundings."
 libra_adventure_xeno_geology_3: "Rainbow Flower"
 libra_adventure_xeno_geology_3_desc_short: "Colorful undefeated flower"
 libra_adventure_xeno_geology_3_desc_details: "Flowers from alien plants that, due to their special tissue structure, quickly lignify the moment they are plucked, transforming them into showy but fragile works of art."
 libra_adventure_xeno_geology_4: "Strange Flowers"
 libra_adventure_xeno_geology_4_desc_short: "Flower bushes that secrete special hormones"
 libra_adventure_xeno_geology_4_desc_details: "The bouquet of this alien vegetation produces an aphrodisiac hormone that sends creatures that smell it into a state of excess energy."
 libra_adventure_xeno_geology_5: "Living Metal Plant"
 libra_adventure_xeno_geology_5_desc_short: "Plants made of living metal"
 libra_adventure_xeno_geology_5_desc_details: "These living metals spontaneously grow to look like natural vegetation, and their growth does not stop as long as the energy supply is sufficient. However, it is not life in any sense of the word, and this strange phenomenon is difficult to replicate."
 libra_adventure_xeno_geology_6: "Crown of Crystalline Mines"
 libra_adventure_xeno_geology_6_desc_short: "Crown natural ore"
 libra_adventure_xeno_geology_6_desc_details: "Crystal ore that coalesces into the perfect shape of a crown, even when compared to the work of a skilled artisan."
 libra_adventure_xeno_geology_7: "Snowflake Alloy"
 libra_adventure_xeno_geology_7_desc_short: "Alloy mineral in the shape of a snowflake"
 libra_adventure_xeno_geology_7_desc_details: "A rare alloy mineral, and while the cause can be inferred, the thought process that went into deriving this conclusion is really interesting."
 libra_adventure_xeno_geology_8: "Otherworldly Flower"
 libra_adventure_xeno_geology_8_desc_short: "A flower not of this world"
 libra_adventure_xeno_geology_8_desc_details: "This flower does not conform to the laws of this world at all, it is not attached to anything, it floats alone in mid-air, and it took a good deal of effort to catch it. There is only one possible explanation: it is an otherworldly creature that has drifted from the Astral Plane."
 libra_adventure_xeno_geology_9: "Sticky Consciousness Body"
 libra_adventure_xeno_geology_9_desc_short: "Fantastical lifeform"
 libra_adventure_xeno_geology_9_desc_details: "If creatures from fantasy worlds come to reality what would they be like, this marvelous creature is one of the answers. It looks quite similar to the single-celled organisms we know, without possessing a similar structure, and has a fair degree of intelligence."
 libra_adventure_xeno_geology_10: "Natural Auric Shield"
 libra_adventure_xeno_geology_10_desc_short: "Naturally occurring auric shield"
 libra_adventure_xeno_geology_10_desc_details: "Things with psychic powers often have some sort of concept attached to them as well, which in this case means 'guard'. The power of the Void Realm is unfathomable, and from here we get a subtle glimpse of it."

