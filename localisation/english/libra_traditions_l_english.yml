 tradition_libra_suzerainty: "Suzerainty"
 tradition_libra_suzerainty_desc: "A hundred chieftains offer tribute from afar; ten thousand kingdoms pay homage before the unending court."
 tradition_libra_suzerainty_adopt_desc: "$tradition_libra_suzerainty_desc$$libraf_tr_banner_23$"
 tr_libra_suzerainty_adopt: "Suzerainty Tradition"
 council_agenda_agenda_libra_suzerainty_name: "Sovereign of All Under Heaven"
 council_agenda_agenda_libra_suzerainty_desc: "The celestial gates of the Nine Heavens swing open to the palace; ten thousand courts, in robes and coronets, bow before the imperial crown."
 agenda_libra_suzerainty_finish_modifier: "$council_agenda_agenda_libra_suzerainty_name$ Agenda"
 agenda_libra_suzerainty_finish_effect: "Subjects with £loyalty£ §Y$LOYALTY$§! reaching §Y50§! receive §G12§! months of £energy£ £minerals£ £food£ £alloys£ £consumer_goods£ £trade£ output\nSubjects with £loyalty£ §Y$LOYALTY$§! at §Y100§! receive §G24§! months of £alloys£ £consumer_goods£ £trade£ £physics£ £society£ £engineering£ output"
 libra_fairy.1691.name: "The Suzerain's Bounty"
 libra_fairy.1691.desc: "Our suzerain, §Y[From.GetName]§!, is most pleased with our loyalty. A vast convoy of their transport ships, laden with the promised advanced industrial goods and technological achievements, has already made landfall on [Capital.GetName]."
 libra_fairy.1691.a: "Accept the gift with gratitude."
 libra_fairy.1691.b: "Prepare a gift in return for the Suzerain."
 libra_fairy.1692.name: "The Suzerain's Support"
 libra_fairy.1692.desc: "Our suzerain, §Y[From.GetName]§!, commends our faithfulness. As a mark of recognition, they have dispatched a transport fleet laden with various supplies, intended to foster our development - and our future allegiance."
 libra_fairy.1692.a: "Accept the offering."
 libra_fairy.1692.b: "Express thanks to the Suzerain."
 libra_fairy.1693.name: "The Subject's Return Gift"
 libra_fairy.1693.desc: "§Y[From.GetName]§! is deeply grateful upon receiving our bestowal. They have specially assembled a diplomatic mission to express their thanks and pledge their continued service as our loyal subordinates. Our embassy has received them, and it is anticipated that this action will yield positive influence in the diplomatic sphere."
 libra_fairy.1693.a: "Accept their loyalty."
 tr_libra_suzerainty_finish: "Suzerainty Tradition Finished"
 tr_libra_suzerainty_1: "Tributary Consolidation"
 tr_libra_suzerainty_1_delayed: "Absorb their lands, incorporate their people, relocate their able-bodied to fill our granaries.\nThe vassal's soil is also the King's storehouse."
 tr_libra_suzerainty_1_desc: "$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_1$"
 tr_libra_suzerainty_2: "Awe from Afar"
 tr_libra_suzerainty_2_delayed: "Let their vessels sail beneath our banner; let their port garrisons serve as our vanguard.\nThe vassal's armor is also the King's claws and fangs."
 tr_libra_suzerainty_2_desc: "$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_2$"
 tr_libra_suzerainty_3: "Benevolent Rule"
 tr_libra_suzerainty_3_delayed: "The shade of the grand hall excludes not a single tile; the Sovereign's faith abandons no one from afar."
 tr_libra_suzerainty_4: "Divided Strategy"
 tr_libra_suzerainty_4_delayed: "Minuscule states depend on our breath; we nourish their withering forms with wisdom and craft, they repay our nurturing with reverence and compliance."
 tr_libra_suzerainty_4_desc: "Per §YProtectorate§!:\n$t$$MOD_COUNCIL_AGENDA_FINISHING_EFFECT_DURATION_MULT$: §G+5%§! (Max: §G+25%§!)\n$t$$MOD_COUNTRY_EXTERNAL_LEADER_POOL_SIZE$: §G+1§! (Max: §G+5§!)\n$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_3$"
 tr_libra_suzerainty_5: "Tribute and Commerce"
 tr_libra_suzerainty_5_delayed: "Ten thousand kingdoms come to court; goods circulate and flow. We nourish their barren lands with our abundance; they serve our celestial realm with sincere devotion."
 tr_libra_suzerainty_5_desc: "Per §YSubject§!:\n$t$$MOD_EMPIRE_SIZE_ADD$: §Y-10§! (Max: §Y-100§!)\n$t$$mod_country_traditions_influence_produces_add$: §G+0.20§! (Max: §G+2§!)\n$libra_unlock_tradable_action_y$$trade_action_libra_suzerainty_4$"
 trade_action_libra_suzerainty_1: "Conscript Labor"
 trade_action_libra_suzerainty_1_desc: "Dispatch their able-bodied to fortify our domain. The vassal's people are also the King's children; to relocate and employ them is to follow the Mandate of Heaven."
 trade_action_libra_suzerainty_1_effect: "Transfer §Y10%§! of total £pop£ §Y$POP$§! count to §Y[From.GetName]§!"
 trade_action_libra_suzerainty_1_modifier: "$trade_action_libra_suzerainty_1$"
 trade_action_libra_suzerainty_1_modifier_desc: " "
 trade_action_libra_suzerainty_2: "Lease Military Ports"
 trade_action_libra_suzerainty_2_desc: "Borrow their docks and anchorages to station our warships. The vassal's territory is also the King's garrison; to station and defend there is to jointly protect the realm."
 trade_action_libra_suzerainty_2_effect: " "
 trade_action_libra_suzerainty_2_modifier: "$trade_action_libra_suzerainty_2$"
 trade_action_libra_suzerainty_2_modifier_desc: "We have transferred usage rights of some military installations to our Suzerain."
 trade_action_libra_suzerainty_3: "Technological Support"
 trade_action_libra_suzerainty_3_desc: "Impart cunning devices, enlighten their ignorance. The vassal's wisdom is also the King's treasury; to teach and transform is to ascend together in civilization."
 trade_action_libra_suzerainty_3_effect: " "
 trade_action_libra_suzerainty_3_modifier: "$trade_action_libra_suzerainty_3$"
 trade_action_libra_suzerainty_3_modifier_desc: "The Suzerain has assigned expert teams to ensure our technological progress."
 trade_action_libra_suzerainty_4: "Economic Support"
 trade_action_libra_suzerainty_4_desc: "Dispatch grain and silk, facilitate their trade. The vassal's wealth is also the King's treasury; to give and aid is to share in universal peace."
 trade_action_libra_suzerainty_4_effect: " "
 trade_action_libra_suzerainty_4_modifier: "$trade_action_libra_suzerainty_4$"
 trade_action_libra_suzerainty_4_modifier_desc: "The Suzerain has provided us with their production insights."