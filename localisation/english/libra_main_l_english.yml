 r_libra_mystic_grail: "Mystic Grail"
 r_libra_mystic_grail_desc: "A relic of unknown origin, bearing the power to manifest the deepest yearnings of sentient beings."
 libra_mystic_grail_effect_tt: "§ROther empires may use the '§Y$casus_belli_cb_libra_mystic_grail$§!' Casus Belli§!"
 libra_mystic_grail_modifier: "Luminous Benediction"
 libra_mystic_grail_modifier_desc: "Bathed in the Grail's radiance, our path is illuminated."
 war_goal_wg_libra_mystic_grail: "Grail Crusade"
 war_goal_wg_libra_mystic_grail_desc: "To reach the Origin, this sacrosanct struggle is ordained."
 casus_belli_cb_libra_mystic_grail: "Claim the Grail"
 libra_main.1000.name: "The §E$r_libra_mystic_grail$§! is Lost!"  
 libra_main.1000.desc: "We fell before [From.GetAdj] covetous assault. As recompense for defeat, the Grail now rests among their spoils of war."  
 libra_main.1001.name: "The §E$r_libra_mystic_grail$§! is Ours!"  
 libra_main.1001.desc: "[From.From.GetName] lies vanquished. The Grail's sanctum now answers to our will."  
 libra_main.1002.name: "Grail Manifestation"  
 libra_main.1002.desc: "What was myth has coalesced into reality. The Vessel holding the Aetheric Essence now resides beyond the causal chain - silently gracing our reliquary."  
 libra_main.1004.name: "Grail's Radiance Revealed"  
 libra_main.1004.desc: "Whispers suggest §H[From.GetName]§! has attained the Grail's blessing - that legendary force which bends fate to mortal will."  

#

 libra_main_story_site_1: "Deserted Nexus"
 libra_main_story_site_1_desc: "Within this system, marked by unmistakable artificial traces, lies the remains of a massive abandoned colony. Who built this? And why was it left to fall into ruin?"
 libra_main.2000.name: "Ancient Rift"
 libra_main.2000.desc: "Initial surveys have led our researchers to conclude that a significant amount of matter in this system originated from other dimensions - while the planets are composed of materials common to this region of space, their structure is entirely different. Some even bear clear signs of dimensional drift.\n\nThe highly unstable astral rifts currently found in the system were, ages ago, one massive and stable fissure, which served as the source of matter for the formation of this very star system."
 libra_main.2000.a: "Fascinating."
 libra_main.2001.name: "Celestial Core"
 libra_main.2001.desc: "By compiling and analyzing survey data from the system's other planets, and conducting core samples on some, our researchers have developed a further hypothesis: the builders launched masses of material from their own world into this system as core structures. They then released some form of force field, causing these cores to attract matter en masse, much like a black hole, eventually forming the high-density celestial bodies we see now.\n\nThe entire process might have taken only a few short hours."
 libra_main.2001.a: "Astonishing technology."
 libra_main.2002.name: "Unfinished Celestial Body"
 libra_main.2002.desc: "Despite their impressive technology, the system's builders did not - or could not - refine the resulting planets much beyond arranging them into their current configuration. Even so, the fact that they orchestrated the movement of different planets at opposite ends of the same orbit, maintaining stable angles and distances even to this day, shows they were masters of controlling celestial trajectories.\n\nFurther investigation of the star system yields diminishing returns. [Root.Leader.GetName] will now direct the crew to investigate the only planet bearing signs of construction."
 libra_main.2002.a: "Incredible."
 libra_main.2003.name: "Impossible Architecture"
 libra_main.2003.desc: "Although deserted, [From.Planet.GetName] still features some structures that have maintained their form. Before committing fully, [Root.Leader.GetName] dispatched teams to collect and analyze the characteristics of these planetary constructs. These bizarre buildings completely lack foundations or similar structures, nor is there any application of anti-gravity or equivalent technology - they simply float suspended in the air. Yet, no matter how much force testers applied, the structures remained immovable. However, a violent impact or weapons fire caused them to shatter with ease."
 libra_main.2003.a: "A peculiar technique."
 libra_main.2003.b: "Could we replicate this architecture?"
 libra_main.2004.name: "Internal Survey Report"
 libra_main.2004.desc: "Teams assigned by [Root.Leader.GetName] ventured inside some structures to investigate, but found surprisingly little. They scoured every corner yet found no interior furnishings, machinery, or signs of habitation. Sample analysis indicates these structures - which might not be buildings at all - are composed of a single material, similar to the deep-core substances previously obtained through drilling. This material, too, is foreign to this star system."
 libra_main.2004.a: "How unfortunate."
 libra_main.2005.name: "Analysis Summary"
 libra_main.2005.desc: "After spending more time surveying [From.Planet.GetName], [Root.Leader.GetName]'s investigation team temporarily withdrew from the surface, requiring time to collate their findings. It is certain that the builders of this system left behind no traces that would allow us to study them further. We may never know who they were."
 libra_main.2005.a: "The star-shaping method warrants study."
 libra_main.2005.b: "We need this exotic architectural technique."
 libra_main.2006.name: "Final Report"
 libra_main.2006.desc: "After confirming new objectives, [Root.Leader.GetName] directed the team to conduct final research, a process that was, unsurprisingly, fraught with difficulties. No matter how many times we scanned and analyzed with our instruments, we were left with little more than conjecture and hypothesis. We could not glean the technical insights behind the incredibly efficient arrangement of celestial bodies, nor could we fully grasp the properties of the construction material. Perhaps our initial research direction was flawed, or maybe the builders possessed some force unknown in this universe. Regardless, we should not invest more time here."
libra_main.2006.a: "Perhaps we can find another use for it."

 libra_main_story_site_2: "Decoy Tomb"
 libra_main_story_site_2_desc: "On this world lies a massive crystalline structure resembling a tomb. What secrets might it hold?"
 libra_main.2010.name: "Peculiar Material"
 libra_main.2010.desc: "The crystal composing this tomb is of a single, incredibly sturdy material. When our explorers attempted to take samples, the chipped-off fragments vanished into thin air - both their molecular structure and mass instantaneously zeroed out the moment they separated from the main structure."
 libra_main.2010.a: "Interesting."
 libra_main.2010.b: "Where have we seen it before?"
 libra_main.2011.name: "Signal Insulation"
 libra_main.2011.desc: "After attempting scans, [Root.Leader.GetName] realized the material constituting this "tomb" absorbs and neutralizes waves of most wavelengths. The principle behind this mechanism is utterly inexplicable. However, the effect is certain: we must either breach it by force or explore it slowly. Either approach carries unknown risks."
 libra_main.2011.a: "Breach these troublesome walls."
 libra_main.2011.b: "Proceed with caution."
 libra_main.2012.name: "Exploration Report"
 libra_main.2012.desc: "After considerable effort, the research team reached the core chamber of the site. The interior was no different from the outside - devoid of carvings or burial objects, just an empty sarcophagus lying silently in the center of the hall."
 libra_main.2012.a: "Disappointing."
 libra_main.2013.name: "Unexpected Discovery"
 libra_main.2013.desc: "After leaving the central chamber, our researchers followed another labyrinthine path to the periphery. [Root.Leader.GetName] keenly noticed several murals hidden in a corner. These paintings were fragmented, but their message was clear: a new king being crowned on a crystal throne, artisans crafting a dagger from stone, a pointed-eared humanoid figure in sorcerer's robes enchanting the dagger... and finally, an assassin plunging the dagger into the king's chest.\n\nIt seems these murals record a piece of history, but the guardians of that history are not here. The murals do not explain the cause or consequence of the assassination, and we may never know."
 libra_main.2013.a: "A fascinating tale."

 libra_main_story_site_3: "Crystal Cottage"
 libra_main_story_site_3_desc: "A massive, clearly artificially carved crystal floats silently among an asteroid belt. Clear voids and inclusions are visible within."
 libra_main.2020.name: "Seeking an Entrance"
 libra_main.2020.desc: "The survey team spent weeks scanning the crystal, repeatedly confirming that no openings exist on its surface. However, optical sensor data indicated a complex network of passages and rooms inside, though the entrance's location remained elusive."
 libra_main.2020.a: "Keep looking."
 libra_main.2021.name: "Hidden Passage"
 libra_main.2021.desc: "During recent work, [Root.Leader.GetName] accidentally let an instrument slip, striking the crystal. Fortunately, the impacted area shattered easily, revealing a passage inward. Previous surveys, using both optical scans and wave detection, had indicated this spot was solid structure. Upon review, [Root.Leader.GetName] realized the builders utilized an obscure but not deeply complex physical phenomenon to conceal the entrance from the team."
 libra_main.2021.a: "A clever disguise."
 libra_main.2022.name: "Crystal Manor"
 libra_main.2022.desc: "The interior structure of the cottage feels unnatural, unlike something carved from a single crystal. It appears more as if a building was instantly transformed into crystal, from the paintings on the walls to the crystallized potted plants in the hallway - everything is eerily preserved. Our current knowledge cannot explain this transformation; it seems more like the work of supernatural forces - psionics, perhaps."
 libra_main.2022.a: "Marvelous."
 libra_main.2022.b: "The structure of this crystal seems familiar."
 libra_main.2023.name: "A Letter in the Crystal"
 libra_main.2023.desc: "After searching the cottage, [Root.Leader.GetName] found the only object within that wasn't made of crystal, layered deep within the center of a perfect regular icosahedron. This paper-like object seems to bear neat writing, but our researchers cannot read it directly through the crystal to parse the text."
 libra_main.2023.a: "Extract it carefully."
 libra_main.2024.name: "'To Mia'"
 libra_main.2024.desc: "After considerable effort, the team successfully extracted the paper and deciphered the text. As its grammar is similar to our native language, the work proceeded smoothly after initial progress. The translation follows:\n\n§HTo the esteemed Lady Mia,\nMay this letter find you bathed in the tranquility of autumn upon its arrival at your secluded abode.\nThe chill mists deepen of late, and the crystallization in my left hand increasingly coils around the bone like thorns, making it difficult to grasp the reins upon waking. The whispers of court physicians and their herbs prove as futile as morning dew. I recall only your past sigh, noting this curse is "like frost upon glass", suggesting a glimmer of hope yet remains.\nNews from the northern woodlands is also disquieting - the pointed-eared folk have been sighted quietly crossing the Snow River. Sentinels report their silver armor shimmering like scales under moonlight, yet not a single arrow has been loosed. Their silence is more alarming than wolves' howls. Perhaps you have long foreseen the turmoil in the stars.\nShould you, amidst your tomes or by the hearth, think of an old friend, I would be grateful for any guidance. May magic shield your tower, as ever.\n\nYours faithfully,\nDe Villefort\nOn the seventeenth twilight of the Frostleaf Moon§!
 libra_main.2024.a: "Did this cottage belong to Villefort?"
 libra_main.2024.b: "It seems a curse turned this place to crystal."

 libra_main_story_site_4: "Chaotic Mass"
 libra_main_story_site_4_desc: "A bizarre mass stands here, its composition a mix of biomass, rock, and metal."
 libra_story_specimen_1: "Chaotic Neural Tissue"
 libra_story_specimen_1_desc_short: "Ancient Biological Specimen"
 libra_story_specimen_1_desc_details: "A ganglion from an ancient creature, releasing an electromagnetic pulse every 11.37 seconds."
 libra_main.2030.name: "Silhouettes and Echoes"
 libra_main.2030.desc: "As researchers align the sensor array toward the mass, instrument readings descend into chaos.\n\nEchoes from the active sonar exhibit inexplicable delays - as if the signals undertook an arduous journey within the mass before returning. Multispectral scanning reveals the simultaneous presence on its surface of the flexible folds of organic matter, the layered fractures of sedimentary rock, and the directional scratches characteristic of cold-rolled metal. These three materials exist §Hdirectly adjacent§! in a way that is neither layered nor fused, with no transitional traces at their interfaces.\n\nMore unsettling are the passive detections: the mass is emitting extremely faint electromagnetic pulses at an unstable frequency, with intervals of approximately 11.37 seconds - like a heartbeat."
 libra_main.2030.a: "Expand the scan range. Confirm if there are any extended structures underground."
 libra_main.2030.b: "Is it dead?"
 libra_main.2031.name: "Threefold Flesh"
 libra_main.2031.desc: "A laser cutter opens a coin-sized window on the mass's surface. The debris extracted by the sampling drill reveals astonishing differences in the petri dish: the rock fragments are common silicates, their isotope ratios matching this planet's crust; the metal fragments are a cobalt-chromium-molybdenum alloy, highly corrosion-resistant, with micro-grooves left by precision machining on their surfaces; and the biological sample - the cellular structure of the biological sample is not yet completely inert.\n\nAfter seven hours in a nutrient solution, some cells resumed weak metabolic activity. Gene sequencing shows these cells originate from three completely unrelated phyla: a molluscoid organism, an arthropod organism, and a §Hthird type§! we cannot place within the natural evolutionary tree.\n\nIn some unfathomable way, they coexisted within a single body."
 libra_main.2031.a: "A joint of three life forms - who did this?"
 libra_main.2032.name: "Forbidden Experiment"
 libra_main.2032.desc: "The coexistence of three heterologous tissues cannot be explained by natural chimerism - this is most likely the abandoned product of rogue genetic editing. Based on available evidence, the research team proposes a preliminary hypothesis: the mass is the failed result of some genetic experiment where researchers attempted to integrate biological traits from different phyla into a single organism, aiming to create a biological weapon combining molluscoid regeneration, arthropod defense, and the感知 of an unknown species. The mass's state suggests that the integrated immune system collapsed at a critical threshold, causing the individual, in immense pain, to curl itself into a ball, ultimately dying from rejection shock.\n\nThis hypothesis gains agreement from most researchers, but it still lacks rationality."
 libra_main.2032.a: "Remain skeptical. Continue analysis."
 libra_main.2033.name: "Unspeakable"
 libra_main.2033.desc: "Re-examination reveals no traces of chimeric editing at the cellular boundaries of the three tissues; they are §Hnative§!. This means the individual was not assembled, but was §Hborn this way§!. Secondly, the machining marks on the metal surface are actually wear marks, their direction perfectly matching the muscle attachment points on the biological parts. When this creature was alive, it must have rubbed its body against something hundreds or thousands of times.\n\nUnable to find a satisfactory explanation, another voice emerges within the team: this is a creation of the Shroud - only supernatural dimensional distortion could explain the native symbiosis of organic and inorganic matter."
 libra_main.2033.a: "That explains nothing at all."
 libra_main.2033.b: "Are there really psychic entities that enjoy bizarre lumps of flesh?"
 libra_main.2034.name: "Within Tentative Reach"
 libra_main.2034.desc: "The final report is personally authored by [Root.Leader.GetName]. The critical breakthrough comes from an overlooked sequence in the biological sample: a type of §Hneural interface protein§!. Its configuration is highly similar to proteins used in known cybernetic augmentation technology for brain-computer signal conversion, but it is older by about four thousand years.\n\nCombining the direction of wear marks on the metal parts with the muscle attachment points on the biological parts, the team reconstructs part of this creature's posture: it possessed multiple elongated appendages covered in cobalt-chromium-molybdenum alloy exoskeleton. The marks on the inner sides of the appendages were formed by them rubbing against each other: when alive, it would often intertwine and rub its appendages together to remove excess metallic growths, much like a human nervously twisting their fingers, or a rodent gnawing down its ever-growing incisors. This was not a monster from a failed experiment, nor a riddle cast by the Shroud. It was simply a sapient being that had undergone deep cybernetic augmentation. It came from some civilization unknown to us, with molluscoid ancestors, arthropod cousins, and a name we will never know.\n\nIt died four thousand years ago, curling its body into a posture to ward off the cold. Then, over the long ages, its flesh decomposed and re-sedimented, its metal oxidized and re-crystallized, rock debris blown by wind filled the gaps - it slowly merged with the planet's geological cycle, becoming a corpse that was no longer a corpse, a mass that would never be a fossil.\n\nThe electromagnetic pulses are the occasional action potentials fired by its remnant ganglion, once every 11.37 seconds, like a heartbeat, never ceasing for four thousand years."
 libra_main.2034.a: "Sever the nerve. Let it rest."
 libra_main.2034.b: "Excellent material for scientific research."

 libra_main_story_site_5: "Tengawa Shrine"
 libra_main_story_site_5_desc: "An ancient, abandoned shrine, containing many old paintings depicting starry skies."
 libra_story_specimen_2: "The Tengawa-in Bestiary of Monsters"
 libra_story_specimen_2_desc_short: "Ancient Illustrated Codex"
 libra_story_specimen_2_desc_details: "A collection of folk tales of demons and monsters, compiled by an ancient scholar, documenting twenty-seven kinds of strange creatures."
 libra_main.2040.name: "Astrolabe and Spider's Web"
 libra_main.2040.desc: "The shrine's main structure is reasonably well-preserved, but the roof of the main hall has collapsed, allowing starlight to enter the worship hall and fall upon the faded offerings.\n\nAs [Root.Leader.GetName] leads the team in clearing away the accumulated dust, several ancient scrolls and a rusted astrolabe are discovered hidden in a secret compartment behind the shrine. The astrolabe's design principles are primitive, yet its calibrations are anomalously precise - given the technological level of the medieval era, its creator should not have possessed such accurate astronomical knowledge.\n\nThe ancient paintings all depict the same theme: an pitch-black night sky, with stars dotted using gold pigment, certain celestial bodies intentionally enlarged and connected into unnatural geometric patterns. In one painting, the Milky Way cascades down like a curtain, and beneath the curtain, a blurred figure walks towards the shrine.\n\nThe artist's signature bears a seal: §HTengawa§!."
 libra_main.2040.a: "Carefully pack these artifacts."
 libra_main.2041.name: "Kamakura Star Chart"
 libra_main.2041.desc: "After preliminary deciphering, [Root.Leader.GetName] confirms these artifacts were created about eight hundred years ago - corresponding to the late medieval period of this civilization, an era of incessant strife among the islands.\n\nAn inscription on the back of the astrolabe records that it once belonged to an Onmyoji named §HTengawa-in§!. He served the Shogunate but was exiled to the frontier for observing inauspicious stars. The inscription is written in classical language with obscure phrasing:\n\n§H'In the second year of Bun'ei, a comet emerged from the Purple Forbidden enclosure. The Emperor summoned Tengawa-in to inquire about fortune and misfortune. He replied: 'This is no comet, but the opening of the gods' dwelling place. Guests shall come from the sea of stars, speaking not, silent, their forms unseen, leaving only threads falling like rain.' The Emperor, angered, denounced his words as sorcery and exiled him to the Eastern Sea.''§!\n\nHidden alongside it is a blank talisman paper, still faintly shimmering even after a millennium, woven from Astral Threads."
 libra_main.2041.a: "Guests from the sea of stars - what did he see?"
 libra_main.2041.b: "An Onmyoji's era, yet artifacts of an industrial civilization."
 libra_main.2042.name: "Useless Divine Treasures"
 libra_main.2042.desc: "The team conducts a full scan of all paintings and the astrolabe. The conclusion is as follows:\n\nThe astronomical knowledge embedded in these artifacts does not exceed the limits of naked-eye observation. Although the astrolabe's calibrations are precise, it utilizes no mechanical principles beyond its era. They seem more like remnants of some psychic energy rather than analyzable technological products, yet their cultural value is immeasurable.\nThe star charts repeatedly appearing in the paintings depict stellar arrangements not found in the natural night sky; certain stars deliberately drawn larger, upon simulation reconstruction, are found to be highly similar to the relative positions within a globular cluster eight thousand light-years away - a cluster whose existence would have been almost impossible for the inhabitants of eight hundred years ago to conceive.\n\nTengawa-in did not paint the stars he saw; he painted the stars he §Hdreamed§!."
 libra_main.2042.a: "An ancient who dreamed of the shores beyond the stars."
 libra_main.2042.b: "These star charts are worth archiving."
 libra_main.2043.name: "A Transcription of the Night Parade of One Hundred Demons"
 libra_main.2043.desc: "In a secret drawer within the sutra rack of the main hall, investigators discover a handwritten manuscript.\n\nThe book is titled §H'The Tengawa-in Bestiary of Strange Beings'§!, the ink composure, the page corners worn and curled, clearly compiled and supplemented over many years. The bestiary delicately sketches the forms of twenty-seven kinds of monster, with marginal notes on their names, habits, haunting grounds, and methods of exorcism.\n\nThe logic of this book's compilation bears similarities to modern biological taxonomy: Tengawa-in classified the monster into categories, and under some entries, he even annotated in red ink with words like 'unconfirmed,' 'suspected,' or 'need checking.'\n\nThis was an Onmyoji from eight hundred years ago, using the language understandable in his era, attempting to §Hdefine the undefinable§!.\n\n -  'Jorōgumo': active by night, weaves webs in tall trees, the silk vanishing upon contact with heat;\n -  'Aname': dwells hidden in abandoned houses, licks utensils, its saliva can rust metal;\n -  'Himenogū': appears like a celestial maiden, trailing threads of light behind her, approach her and your voice is lost, gaze upon her and your form dissolves; ancient texts state this demon appears and disappears unpredictably, with no recorded instances of exorcism.\n\nOn the final page of the bestiary, Tengawa-in wrote one last line in trembling handwriting: §H'This is no demon. I know not its name.'§!"
 libra_main.2043.a: "Seems to have been a natural philosopher born out of his time."
 libra_main.2044.name: "Tengawa"
 libra_main.2044.desc: "As the excavation nears its end, [Root.Leader.GetName] reaches a final conclusion:\n\nThe master of this shrine, 'Tengawa-in,' was a heretical scholar rejected by the mainstream. Using dreams as a window, he glimpsed a sea of stars that should not exist and copied it onto silk. He also foresaw a certain destruction - an end that deprives both speech and form, manifesting as 'threads,' 'light,' and 'demons.'\n\nEight hundred years after his death, we have visited this land. The starry sky he dreamed of, we have marked on our chart. The demons he feared, we do not yet know their true names.\n\nBut at least, this abandoned shrine has finally awaited those who understand it.\n\n§H'Guests come from the sea of stars'§! - and perhaps we are also among those guests."
 libra_main.2044.a: "May the wise rest in peace."
 libra_main.2044.b: "Demons and star charts - what have we overlooked?"

 libra_main_story_site_6: "The Silent Utopia"
 libra_main_story_site_6_desc: "A land of abundant water and lush vegetation conceals traces of a civilization - abandoned fields, broken walls, seemingly over ten millennia old."
 libra_story_specimen_3: "Secret Records of the Utopia"
 libra_story_specimen_3_desc_short: "Ancient Legend"
 libra_story_specimen_3_desc_details: "A metal foil inscribed with the legend of the Takamagahara Judgment."
 libra_main.2050.name: "Unattended Hearth Smoke"
 libra_main.2050.desc: "As [Root.Leader.GetName] leads the landing team, the sight of this planet confounds everyone - the field ridges are not completely overgrown, the reservoirs still hold fresh water, and near the metal stoves in several dwellings lie packaged meals left uncooked.\n\nThermal imaging shows the most recent traces of cooking are no more than three standard weeks old. Yet, throughout the entire settlement, not a single corpse is found, nor any sign of hasty evacuation. The dog chains are still fastened, the livestock pen gates are bolted shut - as if, on some ordinary afternoon, the inhabitants simultaneously decided to put down whatever they were doing and simply walked into the forest."
 libra_main.2050.a: "Where did they go?"
 libra_main.2051.name: "Ten Millennia of Rice Scent"
 libra_main.2051.desc: "Organic residues in the soil, the fibrous structure of dwelling timbers, even the charcoal particles in stove ash - all samples point to an era approximately eleven thousand standard years ago. Yet the degree of disuse in these fields, calculated by natural succession, should not exceed a single growing season.\n\nWhat unsettles [Root.Leader.GetName] more is the spectral analysis: adhered to the soil particle surfaces is a trace but uniform layer of an anomalous substance. Its crystal lattice arrangement bears §Hstriking similarities§! to the weapon composition material we detected in the §HGeneral's Rock§! samples - though this information is only archived in the research log's footnotes.\n\nThis land itself has been §Hsuspended§! by something."
 libra_main.2051.a: "Three hundred thousand years... or three days?"
 libra_main.2051.b: "Mark the anomalous substance as a priority research target."
 libra_main.2052.name: "Morning Meal Still Warm"
 libra_main.2052.desc: "Systematic investigation of the residential area reveals a complete cross-section of a society.\n\nHearths still bear the scorch marks of the last meal cooked; a loom's crossbeam holds half a bolt of unfinished plain silk; in the stables, the skeleton of some cloven-hoofed creature is preserved - its cervical vertebrae feature precision alloy interfaces, indicating cybernetically enhanced draft animals.\n\nFrom the alloy composition of cookware to the etching precision of communication terminal circuits, a comprehensive assessment places this civilization at a post-industrial level. Yet there are no bodies, no signs of struggle, no remnants of disease or war. It is as if, on some ordinary evening, they simply put down their bowls, opened their doors, and departed."
 libra_main.2052.a: "Like droplets of water that evaporated together."
 libra_main.2053.name: "Remnant Shadow of the Keep"
 libra_main.2053.desc: "On the hill north of the settlement, the survey team discovers the only complex with defensive characteristics in the area.\n\nStone walls rise in seven layers; though the turret gate has collapsed, the noble's insignia is still identifiable on the foundation. The interior of the main hall is in disarray, but not from looting - it seems more like the lord knocked over a table in haste while leaving."
 libra_main.2053.a: "Where did the inhabitants go?"
 libra_main.2054.name: "The Unsent Letter"
 libra_main.2054.desc: "Most paper documents have crumbled into dust, but [Root.Leader.GetName] finds a well-preserved letter in a secret compartment within the lord's study. Its paper is thin as a wing, the ink still fresh.\n\nThe translation reads as follows:\n\n§H...Three days ago, a fast horseman arrived from the eastern border. The messenger's lips were purple; he fell as soon as he dismounted, the letter in his bosom damp with frost and dew.\n\nThe letter said: In the coastal villages, for half a month, all human voices have ceased. Stoves are cold, beds still warm, doors left unlatched. In the markets, unsold bonito still lie on the fish stalls. A monk spoke of seeing silver threads descend from the night sky, fine as hair, bright as needles, vanishing upon touching the ground. In the following nights, the village infants fell silent first, then the dogs, then the adults, sitting face to face, gradually losing speech, by dawn all had become empty husks. When the wind blew, the husks scattered like sand.\n\nI asked the messenger: Did they feel pain? The messenger could not answer - his tongue had already stiffened.§!\n\nThe letter ends here. Below the signature is only a single dried drop of ink."
 libra_main.2054.a: "Silver threads... some kind of orbital weapon?"
 libra_main.2054.b: "It seems the author never finished this letter."
 libra_main.2055.name: "Shadow of a Higher Existence"
 libra_main.2055.desc: "In a deeper chamber beneath the lord's residence, the research team finds the final document.\n\nThis is no ordinary text, but a long poem inscribed on a sheet of metal foil. Deciphered, its content is confirmed as an ancient prayer to §HTakamagahara§! - a place depicted in the text as a judgment seat among the stars, where a council of deities verdict the rise and fall of civilizations.\n\nOne passage reads:\n\n§H'They lower threads from the sea of stars, to weigh our sins.\nFirst, hubris: approaching the divine realm in mortal form;\nSecond, endurance: prolonging life's course against Heaven's way;\nThird, forgetting form: replacing flesh and blood with copper and iron.\nWhere the threads fall, speech ceases, form dissolves, names return to nothingness.'§!\n\nThat interstellar civilization - possessing weapons of anomalous matter, capable of suspending time upon this very land - perhaps the very 'deities of Takamagahara' mentioned in the document - with some unimaginable technology, passed judgment on this world's inhabitants for their 'sins.' The silver threads descended, speech was deprived, names were erased. Eleven thousand years ago, the sentence was carried out.\n\nAnd this utopia never even realized it had been indicted."
 libra_main.2055.a: "The observers abandoned their toys."
 libra_main.2055.b: "The tragic fate of a primitive civilization."

 libra_main_story_site_7: "General's Rock"
 libra_main_story_site_7_desc: "A solitary monolith, its lower half embedded with numerous broken blades, its upper half carved with unfamiliar script. Striking the rock yields a clear, resonant echo."
 libra_story_specimen_4: "Azusa-Cutter"
 libra_story_specimen_4_desc_short: "Legendary Demon Blade"
 libra_story_specimen_4_desc_details: "An ancient general once carried this blade through countless campaigns, slaying innumerable foes."
 libra_main.2060.name: "Scan Report"
 libra_main.2060.desc: "The rock's primary composition is different from its surrounding environment, more suggestive of an external object than a natural formation. Scanning instruments indicate a small hollow space at the rock's center, with sealed earth beneath it, extending to the base of the rock."
 libra_main.2060.a: "Intriguing."
 libra_main.2061.name: "Epitaph"
 libra_main.2061.desc: "Deciphered inscriptions reveal this rock marks the tomb of an ancient general, originally situated within a peach grove, though it has somehow migrated to its current location.\n\nThe text chronicles the general's life: from youthful ambition, through middle age disappointment, to his eventual decline into indulgence and melancholy. The blades embedded in the rock belonged to foes the general vanquished in his early years, now long rusted. The inscription is filled with regret and self-criticism, yet speaks with great admiration of a woman described as 'ephemeral as a sparkler,' suggesting it was the loss of this worthy lady that led to the general's downfall."
 libra_main.2061.a: "We hold no reverence for the decadent past."
 libra_main.2061.b: "Is there no further account?"
 libra_main.2062.name: "Internal Investigation"
 libra_main.2062.desc: "The sealed earth, weakened by time, is easily cleared. Within the rock, we find the general's remains - a desiccated humanoid form. Interred beside him are several dehydrated flower petals, a folded set of garments, a pair of worn wooden clogs, and a gleaming single-edged long blade."
 libra_main.2062.a: "Wealth and glory in life, desolation in death."
 libra_main.2062.b: "Prioritize examination of the grave goods."
 libra_main.2063.name: "Analysis Report"
 libra_main.2063.desc: "Sampling indicates the garments, wooden clogs, and the remains themselves all date to approximately 400 years ago. Only the long blade defies analysis; its composition is a material with strength approach to zero-element armor, an artifact impossible for the industrial age.\n\nAdditionally, excavators have discovered fragmented paper, suspected a letter, within the garments and are attempting to restore it."
 libra_main.2063.a: "A pairing that transcends eras?"
 libra_main.2064.name: "The General's Last Wish"
 libra_main.2064.desc: "The restored letter is the general's final testament. He foresaw that intruders would one day disturb his rest.\n\nAccording to the letter, the buried sword was one of his favored weapons; its counterpart, a spear named 'Moon-Viewing Spear,' has been lost. As the epitaph suggested, the general reminisces about his departed wife, then warns the reader to beware of a red-haired woman - a demon in human form, utterly untrustworthy. If possible, he implores future generations to use this demon blade to avenge him."
 libra_main.2064.a: "Secure the weapon. Re-inter the general."
 libra_main.2064.b: "Merely a source of amusement."

 libra_main_story_site_8: "Wraith of the Fallen"
 libra_main_story_site_8_desc: "The wreckage of a gargantuan starship lies crashed here. Its primary structure is composed of a translucent metallic substance."
 libra_story_specimen_5: "Vitreous Metal Hardware"
 libra_story_specimen_5_desc_short: "Ancient Technological Databank"
 libra_story_specimen_5_desc_details: "An ancient storage device utilizing vitreous metal as its primary medium. Even after vast epochs, the information stored within remains intact."
 libra_main.2070.name: "The Translucent Remains"
 libra_main.2070.desc: "The gargantuan ship is lodged at an angle in the permafrost. Its primary structure is forged from a strange, translucent silver-grey metal - neither glass nor crystal, but a dense metal with the light-transmitting properties of crystal. Light penetrating the surface does not reflect back, seeming instead to be swallowed into shallow depths.\n\nDebris litters the area around the wreck, with fragments scattered up to three kilometers away. It took the cleanup crew six work cycles to分离 the main hull from the impact crater. Notably, the fractures in the translucent metal exhibit characteristics of §Hsimultaneous failure§! - as if, in a single instant, the vessel was severed entirely."
 libra_main.2070.a: "Locate an access hatch."
 libra_main.2070.b: "This bears a striking resemblance to our own weapons."
 libra_main.2071.name: "Frost at Corridor's End"
 libra_main.2071.desc: "The internal corridors are surprisingly well-preserved. Luminescent veins are embedded within the translucent metal walls - a now-inactive energy conduit system, leaving only a faint residual glow. The corridors have a hexagonal cross-section and dimensions clearly not serving a typical biological entity: their height is more than double [Root.Leader.GetName]'s stature, and there are no visible stairs or ramps on the floor.\n\nIn several compartments, investigators find disperse objects: saddle-like fixtures, a ring-shaped screen over three meters in diameter, and a large container overturned during the crash, its inner walls bearing desiccated residues identified as §Hhydrocarbons and iron oxide§! - traces of potable water.\n\nAt the corridor's end, an airlock door stands ajar, its inner frame coated with a thin layer of frost."
 libra_main.2071.a: "Proceed deeper."
 libra_main.2072.name: "The Belated Sentinel"
 libra_main.2072.desc: "Passing the third airlock, the survey team triggers an unknown mechanism. The glow within the veins intensifies, and the metal walls on both sides rapidly heat to scalding temperatures. Some survey equipment is instantly fusing andadhesion in place. Then, from fissures in the walls, hair-thin metallic filaments emerge - probing, turning in mid-air like antennae sensing prey.\n\n[Root.Leader.GetName] orders an emergency retreat, temporarily disabling power to this corridor segment with Targeting EMP. Subsequent analysis identifies this as a residual function of the ship's §Hbiological defense system§!: discern non-authorized moving organisms and initiating area-clearance protocols. Yet the system's deployment logic is perplexing: it guards neither the external hatches nor the munitions depots, but concentrates its heaviest firepower on the corridor leading to the bow.\n\nThe ship's designers seemingly feared their own crew approaching the bow from within, more than they feared enemies forcing an entry from without."
 libra_main.2072.a: "Detour. Find another path."
 libra_main.2073.name: "Calibrations within a Nut"
 libra_main.2073.desc: "Taking an alternate route, [Root.Leader.GetName] reaches the ship's core. This is a spherical chamber, roughly thirty meters in diameter. Here, the translucent metal walls achieve near-perfect transparency. Standing within, one can see the external stars directly through the hull, as if encased within a solidification droplet.\n\nAt the chamber's center, a massive crystalline column hangs suspended, its surface densely engraved with symbols arrayed in layered circles, each layer rotating at a different interval. It resembles some kind of coordinate system, pointing to a fourth axis beyond three-dimensional space.\n\nThe research team records three interpretable sets of point. Cross-referenced with local star charts, they correspond to: an empty interstellar dust belt; a black hole shrouded in Shroud energy; and finally, the §Hship's own crash site§!.\n\nThe base of the crystalline column bears a fragmentary section, as if sheared away by a blade."
 libra_main.2073.a: "Coordinates for navigation beyond three dimensions?"
 libra_main.2073.b: "Where is the missing piece?"
 libra_main.2074.name: "The Command Chamber"
 libra_main.2074.desc: "The command chamber lies above the spherical room, accessible via a narrow vertical shaft. Damage here is most severe: consoles meltdown by some high-thermal weapon, seats overturned, the floor scattered with fine, burnt particles identified as carbonized organic residue.\n\nFortunately, the storage terminal's protective casing remains intact. [Root.Leader.GetName] and linguistic researchers spend considerable time achieving tentative decryption. Ship logs use a suffix-agglutinative language with an ancient grammatical structure, unrelated to any known language in this galaxy. However, patterns in the symbol system allow partial reconstruction:\n\n§H...Twenty-fourth cleansing operation, target sector pacified. Residual resistance forces retreating to the fourth planetary ring, deemed non-threatening.\nCommendation received from Imperial High Command; the High Priest expresses satisfaction with our efficiency.\n...Three ambushes in seven days. The enemy is using modified wreckage of our obsolete space-time engines to construct suicide ramming craft. They learn quickly.§!\n\nThe final log entry has a fragmentary timestamp. Its content is a single line: §H'Hundreds of lights kindle on the galactic rim. They have come again.'§!"
 libra_main.2074.a: "A truly monumental war."
 libra_main.2074.b: "A ship with such technological advantages was destroyed."
 libra_main.2075.name: "Defeat"
 libra_main.2075.desc: "The deepest storage unit in the command chamber is password-locked. Deciphering it reveals a file labeled 'Tactical Situation Record.' Its timestamp shows it was generated seventeen minutes before the ship's structural collapse.\n\n§HResistance Third and Seventh Fleets have breached the outer defense perimeter. The flagship is unresponsive; command authority has been provisionally transferred to this vessel.§!\n\nThe enemy flagship is a captured and modified older Imperial escort. Its hull number remains visible; its transponder still uses Empire standard format.\nThey are repeating a transmission on our channels, in our language.§!\n\nThe recording pauses for three seconds, during which background audio picks up an infrasonic vibration - bombardment.\n\n§H...They, too, cry out 'Omiya'§!\n\nThe file ends there. [Root.Leader.GetName] powers down the terminal.\n\nThe evidence draw the outline of this picture: an Interstellar Power calling itself an 'Empire' conducted cleansing operations in this sector; a 'Resistance,' using captured ships and retrofitted equipment, mounted a delayed but increasingly effective counteroffensive. In a decisive battle, this Imperial vessel was brought down here by Resistance forces.\n\n'Omiya' - they invoked it in the conqueror's tongue, then destroyed the conquerors.\n\nThe wreck is silent, frost gathering. The sea of stars has witnessed countless such stories: Empires come like the tide, and recede like sand; but the lights of the resisters kindle again and again upon its surface."
 libra_main.2075.a: "Of considerable military interest."
 libra_main.2075.b: "Hail the ancient warriors who dared challenge the giants."

 libra_main_story_site_9: "Shattered Star System"
 libra_main_story_site_9_desc: "A black hole, surrounded by debris."
 libra_main.2080.name: "Year of Ashes"
 libra_main.2080.desc: "When explorers direct their sensor array towards the system's core, readings are initially mistaken for instrument malfunction. A black hole exists, undeniably - its gravitational lensing warp all background celestial objects, its accretion disk spinning at hundreds of kilometers per second. But the anomaly lies in this: the total mass contained within the debris field encircling the black hole far exceeds the mass of the progenitor star required to form a black hole of this size.\n\nSimulation models repeatedly yield the same conclusion: there should have been a red giant here, roughly 14.8 times a standard stellar mass. The conventional path would be for the red giant to decay into a white dwarf, then collapse into a black hole through accretion or merger.\n\nYet, the abundance of heavy elements in the debris field indicates that at the time of the red giant's death, the planetary system hosted at least four interstellar civilizations. A stable red giant does not directly kill planets; it expands gently, gradually enveloping its outer layers, allowing worlds in its orbit to burn within its atmosphere for a millennium, like insects in amber.\n\nWhat happened here was something else entirely - a premeditated §Hmurder§!."
 libra_main.2080.a: "What kind of force could detonate a star?"
 libra_main.2081.name: "Contemporary Bones"
 libra_main.2081.desc: "Compositional analysis of the debris field presents a second paradox.\n\nThe fragments have diverse origins: starship armor, space station structures, the massive trusses of orbital rings, and things that defy categorization - storage containers with cores wrapped in spherical graphite, their interiors still retaining samples of highly compressed atmosphere, the oxygen-nitrogen ratio perfectly suited for most organic respirators.\n\nThe radiation damage, micrometeorite impact crater density, and oxidation levels on all fragment surfaces point to the same temporal scale. They died §Hsimultaneously§!. Not a single warship managed to jump to escape, not a single space station launched escape pods. Even those storage containers - perhaps biosphere domes, perhaps cryo-sleep chambers - were never ejected. Every creation in the entire system lost power at the same instant, then slowly drifted over millennia, captured and ground into a belt by the dead star's gravity."
 libra_main.2081.a: "We will decipher this."
 libra_main.2082.name: "Unfinished Obelisk"
 libra_main.2082.desc: "At the periphery of the debris field, the survey team discovers an anomalous fragment. It is not a ship, not a space station; it comes from a §Hasteroid§! that was modified. One side was carved into a near-perfect plane, upon which stand seven unfinished obelisks. The monuments are covered in relief carvings, exquisite in craftsmanship, fluency in line.\n\nBased on the inscriptions, this is a memorial, its theme being 'Farewell to Scattered Kin.' The reliefs depict the fleet leaving its home system, landing on alien worlds, and finally establishing settlements on unfamiliar soil. The last obelisk remains unfinished, bearing only a single humanoid figure gazing at the stars.\n\nThe inscription's end bears a line of small characters, severely worn, with only one word identifiable: 'Return.'\n\nBut no one returned. There are no returning ships, no returning messages, not even returning wreckage here. Only seven unfinished monuments, telling the story of their arrival."
 libra_main.2082.a: "Yet their achievements are long gone."
 libra_main.2082.b: "So much like ourselves when we first set out."
 libra_main.2083.name: "Imperial Library"
 libra_main.2083.desc: "In the subsequent search, [Root.Leader.GetName] locates an unusually well-preserved fragment.\n\nThis is the core storage unit of a shipborne archive, its shell bearing the highest known security classification of this civilization. Deciphering the text requires immense effort and time - their writing system is logographic, grammar highly context-dependent.\n\n§HEra 4712, Minutes of the First Meeting of the Crisis Response Committee\nThe Alien Fleet has breached the distant Fifth Frontier March. Its sailing relies on no known method, its combat doctrine is indecipherable, its language bears no relation to any linguistic family in the galaxy. Our envoys attempted contact, only to be met with direct weapons fire.\nThey accept no surrender, conduct no negotiations, permit no requests for evacuation.\n'We need nothing of yours.'\nThis is the sole communication received from them§!"
 libra_main.2083.a: "A terrifying invader."
 libra_main.2084.name: "Inscriptions and the Arrival"
 libra_main.2084.desc: "The investigation gradually draws to a close. Recoverable data grows scarce. What is clear: within days or weeks following that meeting, the central red giant collapsed into a black hole with terrifying speed, tearing the signs of once prosperity to shreds, utterly annihilating this civilization that once dwelt somewhere within the galaxy."
 libra_main.2084.a: "Perhaps their homeworld remains unscathed."
 libra_main.2084.b: "Who invades for the sake of destruction?"

 libra_main_story_site_10: "The Grand Temple"
 libra_main_story_site_10_desc: "The ruins of an ancient interstellar empire's city, its defensive installations, residential quarters, and central temple remarkably well-preserved, with automated machinery patrolling the area."
r_ libra_main_story_1: "The Final Guidebook"
r_ libra_main_story_1_desc: "By the time our archaeological team departed the temple, this ancient book had already appeared within the science ship's control room."
 libra_main.2090.name: "Silent Sentinels"
 libra_main.2090.desc: "As [Root.Leader.GetName]'s team approaches the city ruins, the first to greet them are the dots of laser designators.\n\nThree hovering drones rise from the architecture shadows, their hulls forming perfect regular tetrahedrons, bearing no markings whatsoever. They issue no warning, demand no identification - they simply open fire, their energy beams halted only by our shields. The heat of the impacts is faintly perceptible even within the environment suits, indicating formidable military-grade weaponry.\n\nThe exchange lasts seven minutes. Two drones are destroyed, one retreats, vanishing into the complex. One team member suffers minor injuries, their armor scarred by molten traces.\n\nAnalysis of the wreckage reveals the drones utilize a plasma technology based on room temperature superconductors, achieving extreme energy density. They were manufactured approximately three thousand years ago, yet show minimal wear, as if only recently commissioned.\n\nPast the wreckage of the downed drones, the gates to the outer perimeter stand open."
 libra_main.2090.a: "Secure the drone wreckage for study."
 libra_main.2090.b: "Maintain high alert for further opposition."
 libra_main.2091.name: "Steel Thorns"
 libra_main.2091.desc: "Passing through the outer defensive belt, the survey team gains insight into this city's defensive philosophy.\n\nThere are no conventional turret arrays or shield generators here. Instead, the ground is embedded with hexagonal metal plates, slender spires rise every hundred meters, and dark reticulation structures coat building surfaces. Scans confirm these form a distributed point-defense system - any incoming object, missile or small craft, would be sensed by the mesh, engaged by energy projected from the plates, and have its remnants vaporized by high-energy lasers from the spires.\n\nThe system possesses immense redundancy; even with half its components disabled, the remainder could still cover the entire city.\n\nMore concerning to [Root.Leader.GetName] is its §Hpower source§!. The spire bases connect to conduits descending kilometers into the planet - the city draws geothermal energy directly from the planetary core, transmitting it wirelessly to all defense nodes.\n\nThis means that for three millennia, though the city's masters departed, this system §Hnever shut down§!. Had we not entered through the main gate, the consequences would have been catastrophic."
 libra_main.2091.a: "Technology beyond imagination."
 libra_main.2092.name: "Patrol Routes"
 libra_main.2092.desc: "Advancing roughly two kilometers along the main thoroughfare, a second wave of drones appears. This time, twelve of them, flying in perfect formation, executing scanning patterns in a grid. The moment their sensors detect the survey team, the formation scatters, converging from three sides.\n\nThe engagement occurs at the entrance to the residential sector. These drones carry heavier weaponry; two team members are wounded. Through a combination of personal shields and accurate fire, the team eventually eliminates them all, at the cost of one-third of their ammunition reserves and two destroyed portable energy shields.\n\nBeyond the battlefield, the residential zone emerges in the twilight. Buildings ordered like a chessboard, streets wide and straight, all doors and windows identical in dimension.\n\nBut there are no lights, no sounds, no movement. Only the wind, whistling low through empty window frames."
 libra_main.2092.a: "Regroup and re-equip before proceeding."
 libra_main.2093.name: "The Sterile Hive"
 libra_main.2093.desc: "The interior of the residential zone baffles everyone. The buildings show no trace of habitation. Furniture, clothing, utensils, decorations... nothing. Walls are smooth alloy panels, floors coated with an ultrathin antibacterial layer. The air smells of ozone and industrial cleansers. Everything is spotless, as if not a single day, let alone three thousand years, had passed.\n\n[Root.Leader.GetName] orders air samples taken. Analysis reveals trace residues of §Hnanobots§! in the atmosphere. These machines were programmed to resolve all organic debris, dust, even microorganisms, converting them to base elements and expelling them from the structures. For three millennia, they have scrubbed these uninhabited rooms, day after day, until today.\n\nBut a more unsettling detail emerges: all storage spaces, cabinets, even hidden compartments beneath floors, are §Hempty§!. The inhabitants took everything with them when they left, as if they never intended to return, and would permit no one to learn of their lives."
 libra_main.2093.a: "Trace the nanobot command source. It might lead to a control center."
 libra_main.2094.name: "The Gap in the Thorns"
 libra_main.2094.desc: "Using the defense system's energy transmission map, we identify a blind spot in the patrol coverage. It lies in the gap between two geothermal conduits - here, Mutual Inductance Effect interferes with sensors, preventing precise identification of small targets.\n\nThe survey team slowly navigates this narrow path, moving towards the temple at the city's core. Towering buildings flank them, their empty window openings staring like hollow eye sockets. Occasional drone formations pass overhead, but never trigger an alarm.\n\nPassing a final barrier of abandoned construction machinery, the Grand Temple reveals itself in full. It has no spire, no idol, no stained glass. It is a immense, semi-submerged regular icosahedron, each facet composed of dark metal, its surface dense with optical networks that pulse with a slow, breathing-like rhythm of light. The entrance faces the team directly; above the lintel is carved a single symbol: a ring enclosing another ring, with a dot at the center.\n\nFinality. Return. Origin.\n\nLinguists have yet to interpret its meaning, but all present feel its profound, almost religious solemnity."
 libra_main.2094.a: "Enter the temple."
 libra_main.2094.b: "This symbol... seems familiar?"
 libra_main.2095.name: "Temple Guardians"
 libra_main.2095.desc: "The underground passages beneath the temple are far more expansive than the surface structures. As the team descends the ramp roughly two hundred meters and enters the first hall, the lights suddenly blaze to life.\n\nThese are not ordinary drones. Four heavy combat robots, four meters tall, mount multi-legged chassis and six armed manipulators, each tipped with a plasma cannon, a rapid-fire electromagnetic railgun, and a §Hnever-before-seen forcefield projector§!. Their armor is emblazoned with the same symbol as the lintel. Without warning or parley, they open fire simultaneously.\n\nPlasma beams melting metal pillars, electromagnetic rounds explosion blinding flashes against the shields. The forcefield robot projects an invisible shockwave that instantly reduces a section of rock wall to dust.\n\nThe survey team returns fire from cover, deploying all heavy weapons. In the end, three members are severely wounded, two robots are destroyed, and the remaining two, damaged, retreat into deeper corridors.\n\nAs the smoke clears, [Root.Leader.GetName] locates a partially melting data core within the wreckage of the forcefield robot."
 libra_main.2095.a: "Hope the wounded recover."
 libra_main.2095.b: "Recover the data core. This is critical intelligence."
 libra_main.2096.name: "The Day of Departure"
 libra_main.2096.desc: "Bypassing the destroyed robots, the survey team enters the temple's core - the archive.\n\nThis is a hemispherical hall, its walls lined with crystalline storage units. The central console still functions, its interface displaying unfamiliar symbols but allowing interaction via holographic projection. [Root.Leader.GetName] orders the download of all accessible data. However, the vast majority of storage units have been §Hphysically destroyed§! - their surfaces bear traces of high-temperature melting, dated to approximately three thousand years ago. The only intact preserved file is a log, recording the final evacuation:\n\n§HOrthodox Calendar 5231, Cycle 37, Day 6. All personnel have been evacuated aboard the 'Wings of Purification.' Temple automation systems remain operational. Purge protocols executed. May Finality accept this site's devotion.§!\n\nAt that moment, alarms blare. Sensors reveal all remaining drones in the city are converging on the temple. [Root.Leader.GetName] makes an instant decision, ordering entire evacuation. As the team bursts from the temple, the first wave of drones is already in sight. Laser beams detonate the walls behind them, dust and debris choking the passageways. But they are faster - sprinting past those empty streets, through those sterile residential blocks, past those silent defense towers.\n\nAs the final transport ship ascends, breaking atmosphere, [Root.Leader.GetName] looks back. The city remains silent, its lights still pulse, the drone swarm circles above the temple like insects around a sacred relic. For three thousand years they guarded an empty temple. For decades to come, they will continue."
 libra_main.2096.a: "Classify as high-risk relic. Prohibit civilian exploration."
 libra_main.2096.b: "The Orthodox Order? Another heretical sect, from who knows where?"

 libra_main_story_site_11: "The Endless Wasteland"
 libra_main_story_site_11_desc: "A toxic planet, scarred by ruins and littered with the remnants of war."
 libra_story_specimen_6: "Nowhereland"
 libra_story_specimen_6_desc_short: "A collection of photographs taken in a war-torn wasteland"
 libra_story_specimen_6_desc_details: "Light pierces the toxic clouds, staining the barren plains a dark crimson... All of it, a testament to the cruelty of war."
 libra_main.2100.name: "Bone-Eating Wind"
 libra_main.2100.desc: "As [Root.Leader.GetName]'s landing craft pierces the cloud layer, sensor readings begin to scream. The corrosive agents in the planet's atmosphere far exceed those of typical toxic worlds. Seven minutes after the first sampling robots deploy, their transmission joints begin to seize - acidic fog erosion the lubricating coatings. Within twenty minutes, three of the four robots are lost. The last robot's camera transmits an image of wreckage strewn across the wasteland, the outline of some large structure, and the corrosive fluid streaking its own lens.\n\n[Root.Leader.GetName] orders all staff withdrawal and a switch to fully sealed exploration gear. The new batch of robots is coated with multilayer acid-resistant materials, sensor windows replaced with sapphire crystal instead of glass. The cost is several days and a significant budget overrun, but no one complains."
 libra_main.2100.a: "Commence formal exploration."
 libra_main.2101.name: "Forest of Rust"
 libra_main.2101.desc: "The exploration team spends three days merely preliminarily delineating the site's extent: from low orbit, it covers a third of the entire continent. Military installations layered - wreckage of destroyed ships, collapsed hangars, half-buried gun emplacements, and a crisscrossing network of trenches and bunkers. All structures share a common design language: rugged, massive, prioritizing protection over comfort.\n\nBut what strikes most is not the scale, but the §Hdensity§!. Every inch of this continent was fought over repeatedly, craters within craters, wreckage atop wreckage. In some areas, metallic debris piles up like mountains, analysis revealing at least four different types of armor alloy.\n\nAt one point on the battlefield, the team discovers the wreckage of a colossal war machine - or rather, its lower half. Its upper body was completely vaporized by some high-energy weapon, molten metal flowing downwards and solidifying into stalactite-like formations. Inside the wreckage, a partially destroyed production line still operates weakly, driven by faint pulses, attempting to manufacture reinforcements that will never arrive. Radioisotope analysis indicates it has been running for six thousand five hundred years."
 libra_main.2101.a: "What kind of war was this..."
 libra_main.2101.b: "Trace the production line. It might yield clues to identify the factions."
 libra_main.2102.name: "The Gun Battery's Memory"
 libra_main.2102.desc: "The data storage unit is successfully repaired. The logs span roughly three months, recording this battery's operations during a campaign:\n\n§HDay 1: Fleet detected in northern space; Count: 51; Type: large mixed formation; Engaging.\nDay 8: Enemy landing forces breached second defensive line. Battery switching to ground mode. Confirmed enemy heavy units destroyed: 129.\nDay 22: Position sustained seventh orbital bombardment. Turret 3 destroyed. All repair robots dispatched.\nDay 41: Ammunition remaining 3%. Enemy offensive undiminished. Headquarters orders: Hold at all costs.\nDay 42: ...§!\n\nHere, the log contains a forty-eight-hour gap. The recovered content is only one line:\n\n§HThey are here. Guns depressed. May Finality accept our sacrifice.§!\n\nThe log ends six thousand five hundred years ago. Context suggests this battery belonged to the enemy of the northern fleet, though the enemy's name is never recorded.\n\nFurthermore, when scanning the gun's barrel inscriptions, the team discovered a set of etched symbols: a ring, enclosing another ring, with a dot at the center."
 libra_main.2102.a: "This symbol... seems familiar."
 libra_main.2102.b: "Finality... what is that?"
 libra_main.2103.name: "Shared Origins, Shared Foes"
 libra_main.2103.desc: "The exploration team finds answers at the crash site of the northern fleet. It is the wreck of a colossal warship - or rather, its forward section. The bow is lodged in the corroded metal ground, the cockpit shattered, its interior eroded into a honeycomb by sixty-five centuries of acid rain.\n\nBut on the ship's hull, a set of symbols is clearly visible: a ring, enclosing another ring, with a dot at the center.\n\nPerfectly identical.\n\n[Root.Leader.GetName] stares at the scan images in prolonged silence. The defenders used this symbol. The attackers used this symbol. They slaughtered each other to the last on this very planet, in the most brutal manner, yet they bore the same insignia.\n\nFurther investigation brings more paradoxes: fragments of personal logs among the wreckage - if those scorched, partially molten metal plates can be called 'personal' - show that the everyday language of both sides were §Hdialects of the same language§!. Grammar is identical; only vocabulary choice and accent differ.\n\nThey came from the same civilization - they were once compatriots."
 libra_main.2103.a: "This was... a civil war?"
 libra_main.2104.name: "Two Forms"
 libra_main.2104.desc: "In a low valley at the battlefield's center, the team discovers the remains of soldiers from both sides.\n\nThe defenders' remains are poorly preserved, but their basic form is recognizable: humanoid, roughly two meters tall, skeletal structure similar to humanoids, but with twice the usual number of ribs, and clear implant ports on the rear of the skull. Some remains have spines fused with metal vertebrae, arm bones embedded with power augmentation fibers. They are §Hfusions§! of biology and machine. Whether born this way or modified, it's impossible to determine.\n\nThe attackers' remains are completely different: purely mechanical, full metal skeletons, joints covered with flexible armor, heads as hemispherical sensor arrays, chest cavities completely empty. They are purely §Hsynthetic§!. Yet their wrecks also bear that same ring-within-ring symbol.\n\nTwo morphologically distinct groups, using the same language, wearing the same emblem, waging war on this wasteland.\n\n[Root.Leader.GetName] posits that Omiya - the civilization this name refers to - once split into two hostile factions over some fundamental disagreement. One chose the fusion of biology and machine; the other embraced complete synthetic ascension. The disagreement escalated into civil war, civil war into genocide. This planet was one of countless battlefields.\n\nIt is a reasonable inference.\nBut it has one problem."
 libra_main.2104.a: "Continue the research."
 libra_main.2104.b: "What problem?"
 libra_main.2105.name: "Same Origin, Divergent Paths"
 libra_main.2105.desc: "The team conducts a systematic comparison of the weaponry found in both sides' wreckage. The results are perplexing: both sides' energy weapons operate on the same principle - accelerating plasma via room-temperature superconducting coils; both sides' kinetic weapons use the same caliber - though projectile design differs slightly. The armor alloys of both sides show almost §Hidentical§! elemental ratios in spectral analysis, only differing in crystalline structure due to smelting techniques.\n\nTheir technological level is perfectly matched; their technological lineage springs from a single source. Yet their §Hstandards§! are vastly different.\n\nThe defenders' weapons feature modular design, interchangeable parts, easy maintenance; the attackers' weapons are integrally cast, slightly superior performance, but irreparable once damaged. The defenders' power interfaces are universal, any device can connect; the attackers' interfaces are proprietary, mutually incompatible. The defenders' communication protocols are open; large amounts of broadcast data can be intercepted from their wreckage; the attackers' communications are encrypted, still indecipherable after six and a half millennia...\n\nThis is not like a civil war. Civil wars see opposing sides sharing a common technological heritage, just applied differently. This is more like...\n\nTwo groups, sharing technology, yet with fundamentally divergent design philosophies. Perhaps they never belonged to the same society. Perhaps they merely coincidentally used the same symbol, spoke the same language, but parted ways on every fundamental issue.\n\nThe site can offer no more information. Sixty-five centuries of acid rain have eroded too much. Those unanswered questions - where they came from, why they fought, who won, who lost - will remain forever buried beneath this endless wasteland, awaiting answers that will never come.\n\nThe exploration team packs their equipment, preparing to withdraw. One final ray of light pierces the toxic clouds, staining the barren plains a dark crimson. The shadows of the wreckage stretch long, like countless hands reaching for the sky."
 libra_main.2105.a: "They were once compatriots."
 libra_main.2105.b: "Or perhaps, they never were."

 libra_main_story_site_12: "Primeval Starbase"
 libra_main_story_site_12_desc: "A derelict ancient starbase, adrift around a central celestial body, estimated to be ten millennia old."
 libra_story_specimen_7: "Ancient Starbase Schematics"
 libra_story_specimen_7_desc_short: "Scan Records of an Ancient Starbase"
 libra_story_specimen_7_desc_details: "A starbase with a novel and avant-garde design, difficult to imagine as a relic from 18,000 years ago."
 libra_main.2110.name: "Xenogeometry"
 libra_main.2110.desc: "The starbase slowly rotates around a dim white dwarf. Its primary structure is an incomplete nested double ring - the outer ring tilted at thirty-seven degrees, the inner ring perpendicular to the direction of artificial gravity commonly used by ships. Six massive cantilever arms extend from the junction of the two rings, their ends docking bays, warehouses, and spherical chambers of undetermined function.\n\nThe corridors have a regular hexagonal cross-section. Door frames are arched, but the arch is on the side. The viewports follow no axis of symmetry in their arrangement. This structure was not designed for humanoid life - not even for any creature that considers upright walking the norm.\n\nYet it was built, and it has functioned in space for vast ages. Armor thickness on parts of the outer ring reaches twenty meters, sufficient to withstand micrometeoroid bombardment for tens of millennia; the inner ring's surface is dense with cooling fins, their total area hinting at the astronomical energy once consumed here."
 libra_main.2110.a: "An avant-garde design from eighteen thousand years ago."
 libra_main.2111.name: "Rusted Marvel"
 libra_main.2111.desc: "Upon entering the starbase, the team's first impression is: grandeur.\nThe main corridor is thirty meters high, fifty meters wide, enough for small warships to proceed side-by-side. Walls are embedded with two-meter diameter conduits, still containing trace amounts of inert gas; every ten meters along the ceiling are lighting fixtures, long extinguished, yet their precision optical lenses still refract the light from the explorers' helmets.\n\nBut as investigation deepens, a second impression emerges: §Hobsolescence§!.\nThose conduits carried inferior liquid coolant, while modern ship cooling systems are far more efficient and simpler to maintain; the lighting used cheap tungsten filaments - industrial age technology, rarely seen even in civilian facilities today. The power transmission system was copper busbars, not superconducting; data storage was magnetic media disks, not crystalline holographic matrices; even the airlocks' atmospheric seals relied heavily on mechanical latches. The facility's design philosophy was ahead of its time, yet now holds little reference value.\n\nEighteen thousand years ago, this starbase was the pride of some civilization. Here, they assembled fleets, planned routes, and perhaps swore oaths of loyalty to the stars. Now, it is merely an antique drifting in space."
 libra_main.2111.a: "Continue the investigation."
 libra_main.2111.b: "Historical value is not diminished by technological backwardness."
 libra_main.2112.name: "Unfinished Voyage"
 libra_main.2112.desc: "Proceeding along Cantilever Six, the team reaches the starbase's core functional area - the main shipyard. This is a spherical space eight hundred meters in diameter, capable of accommodating an entire starship. Massive docking frames, like metal ribs, extend inward from the sphere's walls, suspending a half-destroyed vessel at the center.\n\nThe ship is roughly ten kilometers long, its design consistent with the starbase: asymmetric, unconventional, non-humanoid. Its bow was pierced by some weapon, molten metal curling inward to form petal-like wounds; the left third of its hull is completely missing, the cross-section exposing dense bundles of cables and conduits; the engine bay at the stern has a gaping hole, through which only one of four thrusters remains barely intact.\n\nRepair robots on the docking frames ceased working long ago, frozen in their final postures from six thousand years ago - some hover mid-air, manipulators pointing at wounds; others lie prone on the hull, optical lenses shattered; some are clustered at the dock entrance, as if about to depart.\n\nEighteen thousand years ago, this ship was towed into the dock, awaiting repairs. But the repairs were never completed.\n\nSomething brought all maintenance to a halt, left the robots forever still, left this ship berthed here for a span longer than most civilizations have existed.\n\nIt will never set sail."
 libra_main.2112.a: "Archive the record."
 libra_main.2113.name: "The Empty Throne"
 libra_main.2113.desc: "The central command chamber lies deepest within the inner ring, surrounded layer by layer by blast doors. The chamber itself is elliptical, its walls dense with long-dead screens and consoles. The command seat occupies one focus of the ellipse, shaped like a half-open shell, its padding compressed to a thin film by millennia.\n\nThe team activates portable scanners, attempting to extract data from the consoles. The attempt is a complete failure - all storage units have been §Hphysically destroyed§!. The sole survivor is a nameplate on the console surface, made of corrosion-resistant alloy, bearing two lines of text:\n\nFirst line: a ring enclosing another ring, with a dot at the center.\nSecond line: §HFinality witnesses all. Nothing remains here to be taken.§!\n\nThe implication is unsettling. When they left, they took all information, leaving only the empty command chamber, the derelict starbase, and a half-destroyed ship that will never be repaired.\n\nThey did not want anyone to know them.\nOr, they did not want §Hsomething§! to know them."
 libra_main.2113.a: "They were thorough."
 libra_main.2114.name: "What Remains"
 libra_main.2114.desc: "Excavation complete, on the final day before withdrawal, [Root.Leader.GetName] returns alone to the shipyard.\n\nThe half-destroyed vessel remains in place, cradled by the docking frames like an offering to the stars. It has been berthed here for eighteen thousand years - longer than most civilizations have existed. With an assistant's help, [Root.Leader.GetName] removes a sample of its armor. The analysis was already known: the alloy composition is completely different from contemporary ships, slightly lower in strength and heat resistance, but contains a rare earth element seldom used today. The metallurgy of eighteen thousand years ago had its own contemporary rationality.\n\n'Obsolete' does not mean 'useless.' It is merely no longer needed.\n\nThe science ship slowly pulls away. Through the viewport, the starbase's double-ring structure slowly rotates in the starlight, the tilted outer ring and vertical inner ring forming an eternal geometry... just as it did eighteen thousand years ago."
 libra_main.2114.a: "Set course for home."

 libra_main_story_site_13: "Graveyard of Silence"
 libra_main_story_site_13_desc: "A vast congregation of space creature corpses drifts within this system, yet shows no signs of decay whatsoever."
 libra_story_specimen_8: "Aetheric Eroded Tissue"
 libra_story_specimen_8_desc_short: "A slice of space creature dip dyeing with Aether"
 libra_story_specimen_8_desc_details: "A cross-section sample of a Lithoid tentacle. The biological tissue has lost its original coloration, becoming translucent."
 libra_main.2120.name: "Stellar Sepulcher"
 libra_main.2120.desc: "Thousands of space creature corpses drift silently within a spherical volume seven million kilometers in radius. They remain frozen in the postures of death - some curled, some extended, some appearing to still swim. The smallest are no larger than a shuttlecraft; the largest, a space whale whose skeleton could accommodate an entire battleship.\n\nThe diversity of species is astonishing, encompassing nearly all known large spaceborne lifeforms. Amoebae have solidified into translucent gel; Lithoid multi-legged appendages intertwine like dead branches; space whale vertebrae gleam pallidly in the starlight; Voidworm segments twist into improbable geometries. They originated from different sectors, different ecological niches, different evolutionary branches - yet here they have converged into a single stellar necropolis.\n\nMore unsettling: none of the corpses show §Hany trace of decay§!.\n\nThe amoeba gel has not liquefied, the Lithoid carapaces bear no moss, the space whale abdomens have not collapsed, the Voidworm segments remain unsundered... They died - perhaps millennia, perhaps millions of years ago - yet their bodies refuse to return to stellar dust."
 libra_main.2120.a: "Begin sampling and analysis."
 libra_main.2120.b: "Who would establish a graveyard here?"
 libra_main.2121.name: "Uninvited Guests"
 libra_main.2121.desc: "Analysis reveals: all samples contain trace but uniformly distributed §Hunknown substances§! within their interstitial tissues. Their molecular structure corresponds to no known organic or inorganic matter; their mode of existence lies between 'filling' and 'permeation' - they occupy the space that cells would vacate through decay, yet participate in no biochemical reactions.\n\nMore critically: they inhibit decomposers.\n\nSpace teems with hundreds of microbial species, bacteriophages, and parasites specialized to feed on corpses. They would ordinarily attach immediately to deceased organisms, initiating the decomposition cycle. But in this graveyard, no decomposers exist. Those approaching the corpses lose activity, as if their souls were drained.\n\nThis alien substance is non-toxic to life itself - yet it is lethal to the §Hprocess of decomposing life§!."
 libra_main.2121.a: "Continue isolating samples. Seek the source."
 libra_main.2122.name: "The Untraceable Rein"
 libra_main.2122.desc: "Dissection of a space whale carcass consumes six work cycles. When the final protective tissues are stripped away, the dissection team confronts a three-meter diameter ganglion - the space whale's 'brain.' Naturally, this organ would rapidly degrade post-mortem, leaving only a cavity within years. Yet this ganglion remains nearly pristine, the mysterious alien substance fixing every neuron in its before death configuration.\n\nNeural interface specialists begin scanning, expecting to find some implant - chips, electrodes, nanofibers - used to control this leviathan's behavior. This is the conventional approach to 'control.' They find nothing.\n\nYet the neuronal connections... are abnormal. Space whale neural structures should evolve for autonomous survival. Here, however, connection patterns exhibit highly ordered repetition. Certain neuron clusters bear traces of repeated activation, forming fixed neural circuits - not the result of natural evolution, but imprints left by §Htraining§! or §Hguidance§!.\n\nLike a horse's muscles memorizing a gait after repeated riding."
 libra_main.2122.a: "How was this achieved?"
 libra_main.2123.name: "Fragile Permanence"
 libra_main.2123.desc: "In-depth study of the alien substance yields new confusion. Physics lab personnel attempt to isolate it from tissue samples - and fail. Whenever the separation process reaches a certain point, the substance §Hinstantly vanishes§!. No decay products, no energy release. It simply transitions from existence to non-existence.\n\nFurther experiments reveal its properties: this substance §Hcannot persist independently of a physical entity§!. It requires attachment to some 'host' structure - cells, fibers, even intercellular spaces. Once stripped away, it returns to nothingness.\n\nYet it is not alive. It does not reproduce, metabolize, or respond to any biological stimulus. It merely 'exists.' As ice preserves bodies, it preserves these remains. Only ice melts, and it does not - unless forcibly separated.\n\nThis substance's mode of existence strikingly resembles something from legend:\n\nAether.\n\nThat elusive 'fifth element,' spoken of by certain psychics, hovering between energy and matter.\n\nBut Aether is fluid, active - another form of life. This thing is static, silent, like the velvet lining a coffin.\n\nWhat is it?"
 libra_main.2123.a: "Continue searching for energy residues."
 libra_main.2124.name: "Embers"
 libra_main.2124.desc: "The search expands to the graveyard's periphery. On a Voidworm carcass near the system edge, the team finds something.\n\nThis corpse differs from others. Its exoskeleton surface bears faint §Hburn marks§! - not wounds from weapons, but energy burns emanating from within. The marks radiate outward from a central point. Spectral analysis reveals extremely high-intensity energy residues in the burned areas, waveforms matching no known energy weapon or kinetic impact. They more closely resemble power overflow by psychics under extreme emotional duress, but orders of magnitude more intense. Crucially: the burn marks correlate with the alien substance's concentration. Denser burns correlate with lower concentrations, as if energy release consumed the substance, expel it from the physical entity.\n\nThe team traces the energy residue's origin. It was not caused by weapons; it originated §Hwithin§! the Voidworm. Before death, immense energy surged from inside this creature, leaving burn marks and dispelling the alien substance. And that energy shares §Hopposite properties, yet identical origin§! with the alien substance.\n\nOne fluid, one solidified, like two sides of the same coin."
 libra_main.2124.a: "Is the alien substance solidified energy?"
 libra_main.2124.b: "Record the energy waveform."
 libra_main.2125.name: "Necronomicon"
 libra_main.2125.desc: "If we term the alien substance 'coagulated Aether' and the energy residues 'fluidic Aether,' then the anomalous neural connection patterns can be understood as imprints of Aetheric manipulation.\n\nThese space creatures did not die naturally, nor were they slaughtered by weapons. They were once tools of some force - domesticated, harnessed, organized into a fleet through Aetheric energy. And this graveyard is where that army was interred. From the Voidworm's burn marks, we can infer: some catastrophe caused the Aether to spiral out of control. Coagulated Aether sought to maintain control; fluidic Aether sought to break free. Their conflict tore apart the bodies and souls of these beings.\n\nAll the corpses stopped, frozen at the instant of their rending.\n\nWho tamed them? Who lost them? [Root.Leader.GetName] consults archives, recalling rare but documented cases in the galaxy: necromantic techniques. Using certain energies to drive the dead - or their bodies - to serve. This typically requires complex rituals, precise implants or parasites, and continuous maintenance. But if an energy existed that could bypass all intermediate steps, acting directly upon a being's nervous system and soul... If that energy were fluidic, malleable,导 by 'will' itself... Aether... then a fleet of fully automated necromantic vessels is not impossible.\n\n§HGraveyard of Silence. A place where the dead remain. Let the living stay away.§!"
 libra_main.2125.a: "Perhaps we need greater knowledge of the Aether."
 libra_main.2125.b: "It seems we cannot resurrect them."

 libra_main_story_site_14: "The Sandstone Obelisk"
 libra_main_story_site_14_desc: "A huge obelisk, half-buried in the shifting sands, with strange characters carved on its surface."
 libra_story_specimen_9: "The Sandstone Obelisk Molding"
 libra_story_specimen_9_desc_short: "An electronic scan of the inscriptions on the obelisk"
 libra_story_specimen_9_desc_details: "It tells the history of a civilization."
 libra_main.2130.name: "Orphan of the Sand Sea"
 libra_main.2130.desc: "The research vessel had already captured its outline from the planet's orbit - a black obelisk, half-submerged in the orange-red sand sea, with the other half casting a long, narrow shadow under the fading light of the star.\n\nThe landing team reached the obelisk during a lull in the sandstorm. It was about forty meters tall, made of some kind of black igneous rock, and its surface was finely polished, with no discernible seams even to the most sensitive touch. Carbon-14 dating could not be directly applied to the rock, but the tiny meteorite particles embedded in the surrounding sand layers indicated that the obelisk had stood there for at least a hundred thousand years.\n\nAt the top of the obelisk, where the wind and sand had eroded most fiercely, a set of symbols remained clearly legible: a circle within another circle, with a dot at the center.\n\nThe linguist gazed at the mark and whispered the name that had repeatedly appeared in certain ruins: 'The End'."
 libra_main.2130.a: "Start systematic scanning of the inscriptions."
 libra_main.2131.name: "Memory of Elda"
 libra_main.2131.desc: "The inscriptions were carved in dense ideographic symbols, with neat fonts arranged like a chessboard. The linguist spent two weeks establishing a preliminary character correspondence table - this script was based on monosyllabic roots and formed complex concepts by superimposing symbols. Its grammar was simple but precise in meaning.\n\nThe first section of the deciphered text revealed the identity of the obelisk's owner:\n\n§H Our people are called Elda, born in a land favored by the stars. We hold fire in our palms and thunder in our hearts. Our ancestors called it 'magic', with which we tamed the clouds and the rain, and moved mountains and seas. In those days, heaven and earth were not yet divided, and gods and humans lived together. §!\n\nThe accompanying relief depicted humanoid beings releasing light from their palms, causing plants to grow, rocks to crack, and water to change course. They were tall and slender, with gentle faces, and shared similarities with most humanoid races in the current galaxy, yet carried an indescribable sense of otherness.\n\nThis was the beginning of their civilization - possessing an ability called "magic" and living in harmony with nature. But the text ended there, followed by a completely different narrative."
 libra_main.2131.a: "Continue translation."
 libra_main.2131.b: "Magic?"
 libra_main.2132.name: "The Day of Revelation"
 libra_main.2132.desc: "The next section of the inscriptions was carved with deeper grooves, as if the writer wanted to emphasize its importance:\n\n§H In ancient times, our people worshipped the Mother of Fertility, offering the first ears of grain and the firstborn to the altar. The mother goddess smiled, and the weather was favorable, and the five grains never ceased. §!\n\nIn the relief, the Elda people danced around a plump female deity, who held ears of wheat and fruits in her hands. But then, the scene suddenly turned gloomy:\n\n§H One day, the sky cracked. A light descended from the crack, its color like dead ash, its sound like a baby's cry. A form appeared in the light, faceless, limbless, and silent. But all of our people knew what it proclaimed - Omiya, the God of the End. The Mother Goddess fell silent, and the altar crumbled. From then on, our people knew that the world had a beginning and an end, and that life was finite. §!\n\nThe inscription did not describe war or coercion. That light alone, when it appeared, changed the entire civilization's faith. Linguists pored over the text and eventually confirmed its wording: the Eldar regarded this as §Hdivine revelation§! and they accepted the end. "
 libra_main.2132.a: "Is this faceless being a true god or just a figment of imagination?"
 libra_main.2132.b: "Keep digging. There should be more inscriptions below."
 libra_main.2133.name: "A Thousand Years of Prosperity"
 libra_main.2133.desc: "Beneath the sand, the monument extends. The excavation team cleared fifteen meters down, and a new inscription appeared:\n\n§HKnowing the end, our people began to explore the unknown with magic. In the past, we sought abundance; today, we seek the end. Magic is the harbinger of the end. Those with strong magic, those closer to the end, gain great wisdom. §!\n\nThe relief changed significantly: the Eldar no longer surrounded the Goddess of Abundance but looked up at the stars, their hands releasing more intense light. Individual differences began to appear in the scene: some had strong light, some weak, and those with strong light were surrounded by others, like mentors or kings.\n\n§HAt first, the powerful in magic competed, causing mountains to crumble and rivers to run red with blood. But the eye of the end watched, and the powerful gradually realized that contention was futile. They made a pact, determining status by the depth of their magic, and with the end in mind, they educated the masses. From then on, our people entered a thousand years of prosperity, with palaces touching the clouds and ships traversing the stars. Where magic reached, nothing was impossible. §!\n\nThe inscription records a civilization that reached unprecedented strength under the belief in the end. Magic individuals emerged, and society stratified by the level of magic, yet maintained long-lasting peace and progress. They built ships that crossed the star sea and began to explore the universe."
 libra_main.2133.a: "What happened next?"
 libra_main.2134.name: "The End in the Distance"
 libra_main.2134.desc: "The excavation reached the bottom of the monument, and the final inscription was carved at the very bottom:\n\n§HAfter a thousand years of prosperity, our people's footprints covered the stars. But the end remained ahead, never drawing closer. If the end is in the distance, we should seek it there. Select the most powerful in magic, board the great ship, and sail into the depths of the star river. The rest will remain here, waiting for their news. §!\n\nThe relief depicts a huge ship ascending into the sky, its deck filled with people emitting intense light, sailing into the dark depths of the universe. Behind them, the people on the home planet raised their hands in farewell, their expressions calm - even expectant.\n\nThere are no more inscriptions below the monument, only uncarved natural rock. Ten thousand years have passed, and those Eldar who sought the end in the distance never returned, nor did they send any news. What did the people who remained here wait for?\n\nThe inscription does not say, and the wind and sand have buried the answer. Only this monument stands quietly in the desert, waiting for a reunion that will never happen."
 libra_main.2134.a: "They went to seek the end but vanished in the star sea."
 libra_main.2134.b: "That 'distance'..."

 libra_main_story_site_15: "The Mountain of Oblivion"
 libra_main_story_site_15_desc: "Some kind of psychic-like force restricts the valley. Those who enter can return safely but have almost no memory of the period, as if something is being concealed."
 libra_story_specimen_10: "Dust of Forgetting"
 libra_story_specimen_10_desc_short: "Objects in the Valley of Oblivion shatter upon touch, leaving behind this dust."
 libra_story_specimen_10_desc_details: "It conceals psychic power and is constantly absorbing Zelo dust from the surrounding environment."
 libra_main.2140.name: "Silhouette in the Mist"
 libra_main.2140.desc: "The exploration team noticed anomalies from orbit: all frequency bands of the valley area showed varying degrees of signal attenuation, with imaging as blurry as through frosted glass, and radar echoes distorted into uninterpretable noise by some field. When the landing team established a forward base at the valley entrance, the sensor's effective detection range was less than a hundred meters, and communication delay was as high as three seconds - the signal seemed to have undergone a long refraction before struggling to escape the valley.\n\nBut [Root.Leader.GetName] noticed a detail: when a trace amount of §H Zelo §! crystal was added as a filtering medium to the equipment, the signal clarity significantly improved. Zelo - a rare substance known to enhance psychic perception - seemed to play a role in countering interference here. The valley was resisting being probed, but it seemed to make an exception for psychic-sensitive media.\n\n[Root.Leader.GetName] ordered the installation of Zelo components in the detection equipment and prepared for the first exploratory entry."
 libra_main.2140.a: "Prepare to enter."
 libra_main.2141.name: "Path Without Trace"
 libra_main.2141.desc: "The first batch of entering team members carried enhanced communication devices, and their signals were relayed back to the forward base through Zelo repeaters in directional beams.\n\nThey walked for three hours. When the first batch of team members emerged from the valley, [Root.Leader.GetName] went to meet them, only to find that everyone's eyes were empty and blank. They remembered the decision to enter the valley, remembered taking the first step, and then... nothing. Three hours of memory were completely erased, not even leaving dream-like fragments.\n\nFortunately, real-time communication showed everything. In the generated audio file, the team members' voices were initially clear, describing the gradually thickening mist, the plants they had never seen before underfoot, and a feeling of "being watched". As they went deeper, the signal began to break up, but key fragments were retained:\n...There is a kind of energy here... not psychic, but similar... it's scanning us... \n…… There are building silhouettes ahead... \n…… Wait, what's that? - The recording was interrupted for thirty seconds here. When it resumed, there was only a low breathing sound and the words: "Let's keep going." There were no more valid records until the exit."
 libra_main.2141.a: "Analyze the recording and look for clues."
 libra_main.2141.b: "Prepare for the second exploration and bring more equipment."
 libra_main.2142.name: "Mana's Trace"
 libra_main.2142.desc: "The second exploration was led by [Root.Leader.GetName] in person. The outpost received real-time signals, and all equipment, including multi-angle cameras, biological sensors, and energy analyzers, were fully activated. After the team advanced about two kilometers, the energy analyzer first raised an alarm: a strong fluctuation in an unknown energy field was detected. Immediately after, an invisible shockwave surged from the depths of the fog - all electronic devices overloaded instantly, three reconnaissance drones smoked and crashed, and the shield generators of the team members screeched and failed. The spectrum of this energy was similar to that of psychic energy, but its ground state was completely different. It was not based on biological consciousness but was an independent, controllable primordial energy, tentatively called 'Mana'. The valley used it to trigger traps, to shield memories, and to guard something."
 libra_main.2142.a: "Keep trying."
 libra_main.2143.name: "Under the Purple Ring"
 libra_main.2143.desc: "During the third exploration, [Root.Leader.GetName] adjusted the strategy: all equipment operated in passive mode, reducing active detection to avoid triggering more traps. The team moved slowly but steadily deeper into the valley. At a certain critical point, the fog suddenly dissipated. Before them was the bottom of the valley - a circular flat area surrounded by towering cliffs. On the cliffs, a huge mural occupied the entire view: a purple ring encircling another, with a dot at the center. A massive mark, in an unprecedented size and color, quietly overlooked the intruders. Below the mural was a group of low buildings - altars, stone platforms, and corridors, arranged neatly, with a strange matte texture. At the base of the cliffs, several openings extended inward, with scrolls and books faintly visible inside."
 libra_main.2143.a: "Inspect the sacrificial facilities."
 libra_main.2143.b: "Search for books in the cliff caves."
 libra_main.2144.name: "Dust-Covered"
 libra_main.2144.desc: "[Root.Leader.GetName] led the team towards the nearest altar, which was made of some kind of stone-like material, with complex carvings on its surface - seemingly a ritual flowchart, depicting the process of energy flowing from the center of the altar to the surroundings. In the central depression, there were dark traces remaining, perhaps blood, perhaps paint. A team member attempted to touch the carvings, and the entire altar suddenly collapsed, turning into countless fine particles that silently scattered on the ground, like a sand pile being blown away by the wind. Other team members tried to rescue, touching other stone platforms and corridor railings - the same result. All the buildings disintegrated upon contact, leaving a ground of dust that could not be pieced together. Analysis showed that the molecular structure of these materials had been thoroughly permeated by Mana energy over the long years, losing all structural strength. Their existence was entirely dependent on the maintenance of Mana. Once an outsider disrupts this delicate balance, they return to nothingness."
 libra_main.2144.a: "Nothing remains."
 libra_main.2145.name: "Dissolve into Ashes"
 libra_main.2145.desc: "The number of books in the cave is astonishing. Hundreds of volumes are neatly arranged on the stone shelves, with their covers uniformly made of dark leather, each imprinted with that purple circular mark. [Root.Leader.GetName] carefully reached out a hand, attempting to pick up the outermost volume. The moment his fingertips touched the cover, the book began to curl, fade, and disintegrate from the point of contact, like paper licked by flames - within two seconds, the entire book turned to ashes and slipped through his fingers. Team members tried to retrieve the books remotely using mechanical arms, vacuum suction cups, and electrostatic fields, but the result was the same. No matter the method, any form of contact with the books would cause them to turn to dust. Even the scan of optical instruments might trigger their disintegration. Through linguistic analysis, they could barely make out the titles on the covers: 'The Apocalypse Revelation', 'The Theory of Mana Origin', 'The Chronicles of the Sunset School', 'Detailed Explanation of the Forgotten Ritual'. The titles appeared like phantoms and then vanished into the dust. They existed, they recorded secrets, but they refused to be read."
 libra_main.2145.a: "This is clearly to prevent later generations from knowing."
 libra_main.2146.name: "Whispers of the End"
 libra_main.2146.desc: "The investigation team searched every cave but only brought back a few kilograms of dust and debris - the remnants of what were once altars, stone platforms, and books. The mana energy field flowed slowly through the valley, like a river of time, neither taking away nor holding on. [Root.Leader.GetName] ordered the team to evacuate, and they followed the path they came, through the mist, out of the valley. Just as the last team member stepped out of the valley's boundary, everyone simultaneously stopped. A voice - or rather, a consciousness - emerged in their minds, as clear as a whisper: "You have left the place where the end descended." Then, everything went blank. [Root.Leader.GetName] stood in the outpost, looking at the team members around him in confusion. They remembered entering the valley, triggering the trap, and then... nothing. The communication device's records were still there, the dust samples were still there, but the experience itself had been completely erased. That voice left no trace, except for this memory that echoed at the edge of their consciousness. [Root.Leader.GetName] looked at the sample bottle in his hand, the dust inside faintly glowing purple under the starlight. This was the only thing they took from the sacred place, and the only thing the sacred place allowed them to take."
 libra_main.2146.a: "Some secrets perhaps should never be remembered."
 libra_main.2146.b: "Was it warning us? Or merely stating a fact?"

