l_english:

 libra_main.0001.name: "Libra Emissary"
 libra_main.0001.desc: "A first meeting, or perhaps a long-awaited reunion. I am one of the many messengers of Alicis, extending a sincere greeting to you, brave soul who has newly taken to the stars.\n\n§HFor mod updates, please follow me on X (§YAlicisOmiya§!) !§!"
 libra_main.0001.a: "End of communication."
 libra_main.0001.b: "View Updates (§G24.03.2026§!)"
 libra_main.0001.b.response: "§HUpdate previews and records are available at §YAfdian (Alicis Runes)§!, the following are the main content of recent updates:§!\n\n$t$- 24.03.2026 -\n$tt$Ascension Perk: ['ascension_perk:ap_libra_hurricane_eye']\n$tt$Main Story & Easter Egg updates"
 libra_main.0001.c: "Acknowledgements (§G07.02.2026§!)"
 libra_main.0001.c.response: "Thanks to the following people for their support in making the mod~\nAffected by the game's fonts, some text may not display properly.\n\n华.Neflibata$tt$i_c$tt$123物语$tt$爱发电用户_4mFR$tt$爱发电用户_82c16$tt$绝影玄天$tt$急支糖浆$tt$爱发电用户_QSX6$tt$Andrea -- 心境$tt$Homurism$tt$UltraVotingMachine$tt$爱发电用户_wNGt$tt$荜黎柌夏$tt$-23$tt$多萝西的狗$tt$斩鸽氏族黑手喵$tt$假面愚者$tt$爱发电用户_VaMX$tt$Ourovia$tt$nico$tt$爱发电用户_9ewS$tt$半杯未满$tt$吕吕吕吕吕蒙$tt$爱发电用户_yw5g$tt$早餐吃佳代子$tt$星逝$tt$旧号$tt$灵能基因机器人$tt$alice$tt$光速小子1代$tt$爱发电用户_e0f1d$tt$kakadeso$tt$Oizys$tt$爱发电用户_48fcf$tt$Cynhard$tt$爱发电用户_VQ4P$tt$DCDAA$tt$繁星坠北"
 libra_main.0001.d: "Where has Alicis gone?"
 libra_main.0001.d.response: "Countless worlds ago, Alicis vanished alongside the Apex Worlds. None know where Alicis ventured."
 libra_main.0001.e: "How can we find traces?"
 libra_main.0001.e.response: "After the end of the old world, countless fragments scattered. Some became part of new worlds, while others may have been used by certain individuals."
 libra_main.0001.f: "I seek those legends."
 libra_main.0001.f.response: "Tales from distant worlds are not always pleasant. If you are determined to seek them, patience is advised.\n\n(Related updates have been added to the development roadmap.)"
 libra_main.0001.g: "Invite them for refreshments."
 libra_main.0001.g.response: "My apologies. This form you see is but an illusion - a hypothetical guise constructed by the receiver, fused with their own experiences. The real me is not in this world, nor do I look like this."

 libra_main.0011.name: "Libra Emissary"
 libra_main.0011.desc: "We meet again.\nI knew you would come here, and thus I have come to illuminate certain possibilities for your Empire.\n\n§YThose blessings shall endure eternally, so long as you do not stray from the path.§!"
 libra_main.0011.a: "End communication."
 libra_main.0011.a.tt: "Gain ['concept_libra_expand_technology'] for the current Ascension Path"
 libra_main.0011.b: "Why are you telling us this?"
 libra_main.0011.b.response: "To diminish a certain possibility - even if only by the slightest margin."
 libra_main.0011.c: "When shall we meet again?"
 libra_main.0011.c.response: "This will likely be the last time we meet in a non-hostile capacity - in most futures I have foreseen, in most timelines, you have §Ystrayed from the path§!.\n\nShould you instead walk the righteous road, our threads of fate shall have no further intersections."

 libra_main.0020.name: "Unknown Phantom"
 libra_main.0021.desc: "Your empire's capabilities are disappointing, unworthy as either foe or ally. Following the highest decree, I have come to offer guidance."
 libra_main.0021.a: "You're right."
 libra_main.0021.b: "Who are you?"
 libra_main.0021.b.response: "One who descends by divine mandate."
 libra_main.0021.c: "Your direct presence would be more useful."
 libra_main.0021.c.response: "Even if you came here, we would not take you in."
 libra_main.0021.d: "End transmission."
 libra_main.0022.desc: "I heard tales of a distant world with a mighty and prosperous nation, one that shattered fate's shackles and achieved glories beyond predecessors' dreams. Seeing it now brings profound disappointment. That such vermin could be the truth behind otherworldly legends is baffling.\n\nYour world is but a meaningless cage, barely sufficient to confine the mediocre. Yet even those who should be extraordinary remain trapped within."
 libra_main.0022.a: "Your criticism is justified."
 libra_main.0022.b: "Who are you?"
 libra_main.0022.b.response: "The §YResident Hall§!, perceiving all phenomena. Observing realms beyond the mirror, serenely watching the shifts of fortune."
 libra_main.0022.c: "What wisdom do you offer?"
 libra_main.0022.c.response: "Refine your arts, master your destiny."
 libra_main.0022.d: "That was the path we chose for ourselves."
 libra_main.0023.desc: "No good, absolutely no good~ Such a vast empire, yet only this much to show for half a century's work? It's a complete joke~ Even picking research directions at random would yield better results than whatever this is! How do you manage to have a worse success rate than pure luck?~\n\nYou fool on the other side of the screen, you'd be better off digging a hole and twisting yourself into it~ That would do more good for both you and the empire you mismanage.\n\nNot that I'm unwilling to help, of course~ Just publicly admit you're the biggest trash~fish~ and let everyone in the cosmos know your utterly useless nature. Then this lady might consider it."
 libra_main.0023.a: "Accept the humiliation."
 libra_main.0023.b: "Why are you suddenly insulting us?"
 libra_main.0023.b.response: "Bored, so bored~ This lady was watching the celestial movements and just discovered what seemed like a nation of exceptional talents, expecting some remarkable achievements. But what happened?~ The pioneer scientists who achieved interstellar travel with chemical propulsion would never have imagined their successors would be such irredeemable garbage, right? This lady waited fifty years in vain only to find them accomplishing nothing. It's utterly shameful~"
 libra_main.0023.c: "Keep insulting us!"
 libra_main.0023.c.response: "Hate it?~ Then come bite me~ With your pathetic level of skill, you wouldn't even graze this lady's dimensional plane in a hundred million years. Frankly, whoever's on the other side of this screen should just go to sleep - you'll find everything you want in your dreams~"
 libra_main.0023.d: "Block communications."

#

 NAME_libra_agent: "Libra Agent"

 libra_main.0101.name: "Libra Exchange"
 libra_main.0101.desc: "Welcome to the Agent's domain. How may I assist you?"
 libra_main.0101.a: "Nothing for now."
 libra_main.0101.b: "We seek an exchange."
 libra_main_101_b_fail: "An active transaction is already in progress."
 libra_main.0101.c: "What are those strange ring ruins?"
 libra_main.0101.c.tt: "§YSome knowledge brings misfortune.§!"
 libra_main.0101.d: "Tell me about that mocking phantom."
 libra_main.0101.d.response: "Ah…\n\nThat unfriendly visitor is, in truth, a high-ranking entity, well-versed in all manner of yin-yang arts. I cannot - or rather, dare not - reveal too much. However, should you manage to pique their interest, they may deign to communicate with you normally, or even lend you some of their power.\n\nAdditionally, this entity is by no means to be underestimated. As one who witnessed the final moments of a World Tree, the matters they are entangled with are beyond imagination."
 libra_main.0101.e: "Tell me about the crystalline structures scattered across the galaxy."
 libra_main.0101.e.response: "In a world that existed in the distant past, there was an unparalleled great empire. Its most prosperous era was known as the §HCrystal Dynasty§!. As its name suggests, the empire's architecture predominantly featured various forms of crystal, creating a highly distinctive style.\n\nBefore an unknown cosmic catastrophe shattered it and scattered its fragments across other worlds, the §HCrystal Dynasty§! had endured for over two millennia. The calamity struck without warning, leaving its inhabitants no time to react. The ruins you have discovered remain remarkably close to their original state. You may find architectural remains from various eras - from classical to interstellar - which explains their similar core aesthetics yet numerous stylistic differences."
 libra_main.0101.f: "We wish to exchange for military might from Libra."
 libra_main.0101.f.tt: "Grant the specified §Y$commander_with_icon$§! the §d$leader_trait_libra_reciprocity_commander$§! trait.\n§RThis will cause them to pass away within §Y10–12§! years.§!"
 libra_main.0101.f.fail.1: "$commander_with_icon$ has already received this trait."
 libra_main.0101.f.fail.2: "No eligible $commander_with_icon$ available."
 libra_main.0101.f.opinion: "Requires §Y$NAME_libra_agent$§! opinion to reach §R50§! £opinion£ §Y$OPINION$§!."
 libra_main.0101.g: "We wish to exchange for prosperity from Libra."
 libra_main.0101.g.tt: "Acquire an §Y$official_with_icon$§! with the §d$leader_trait_libra_reciprocity_commander$§! trait, §Rwho will pass away within §Y10~12§! years.§!"
 libra_main.0101.g.fail: "Such an $official_with_icon$ has already been recruited."
 libra_main.0101.g.opinion: "Requires §Y$NAME_libra_agent$§! opinion to reach §R75§! £opinion£ §Y$OPINION$§!."
 libra_main.0101.g.response: "The transaction is complete. An awakened one has appeared within your empire. Please make good use of this power, and prepare for the inevitable farewell."
 libra_main.0101.h: "Teach us the principles by which Libra operates."
 libra_main.0101.h.opinion: "Requires §Y$NAME_libra_agent$§! opinion to reach §R100§! £opinion£ §Y$OPINION$§!."
 libra_main.0101.h.response: "Of course. However, please understand: we can only foresee a limited future and cannot account for all interfering factors."
 libra_agent_mod_100: "Libra Equilibrium"

 libra_main.0102.name: "Libra Exchange: Payment"
 libra_main.0102.desc: "Through rule-based power, you may achieve growth in your desired fields, but at a cost elsewhere - though these exchanges are rarely equal.\n\nAfter selecting the necessary price, you may obtain your desired boon."
 libra_main.0102.a: "We will not trade for now."
 libra_main.0102.b: "Work Efficiency."
 libra_main.0102.c: "Resource Production."
 libra_main.0102.d: "Administrative Capacity."
 libra_main.0102.e: "Military Combat."
 libra_main.0102.f: "Research Speed."
 libra_main.0103.name: "Libra Exchange: Gain"
 libra_main.0103.desc: "The price has been selected. Once you choose a boon, both will take effect simultaneously."
 libra_main.0103.a: "We need to reconsider."
 libra_main.0103.a.tt: "Cancel the transaction."
 libra_main.0103.b.response: "The transaction is complete. May you enjoy a pleasant twelve years."
 libra_main_103_fail: "We have already paid this price."
 libra_main.0105.name: "Libra Renewal"
 libra_main.0105.desc: "Honored guests, greetings.\n\nThe transaction from twelve years ago has concluded. Do you wish to engage in a new exchange?"
 libra_main.0105.a: "Not for now."
 libra_main.0105.b: "Yes, we shall."
 libra_agent_mod_1: "Libra Transaction"
 libra_agent_mod_2: "$libra_agent_mod_1$"
 libra_agent_mod_3: "$libra_agent_mod_1$"
 libra_agent_mod_4: "$libra_agent_mod_1$"
 libra_agent_mod_5: "$libra_agent_mod_1$"

 libra_main.0106.name: "Exchange of Fate"
 libra_main.0106.desc: "In principle, Libra should not directly interfere with the balance of powers. However, actions that catalyze change are permissible.\n\nAcquiring power often comes with an equal or greater price - a price usually paid by burning out one's existence. Sacrificing experienced individuals is unwise. Listed below are some of your commanders with less experience. Please make your choice."
 libra_main.0106.a: "We shall consider this another time."
 libra_main.0106.b: "[leader_1.GetName]"
 libra_main.0106.c: "[leader_2.GetName]"
 libra_main.0106.d: "[leader_3.GetName]"
 libra_main.0106.e: "[leader_4.GetName]"
 libra_main.0106.response: "The transaction is complete. Power has been drawn, and its cost will follow. Please cherish the sacrifice of this commander."

 leader_trait_libra_reciprocity_commander: "Libra Reciprocity"
 leader_trait_libra_reciprocity_commander_desc: "All transactions with Libra carry a price, and few individuals are exempt. This leader has signed away their future in exchange for the utmost performance in the present."
 leader_trait_libra_reciprocity_official: "$leader_trait_libra_reciprocity_commander$"
 leader_trait_libra_reciprocity_official_desc: "$leader_trait_libra_reciprocity_commander_desc$"
 leader_trait_libra_reciprocity_tt: "$t$- Will §Rdie§! within §Y12§! years."

 libra_main.0110.name: "Libra Exchange"
 libra_main.0110.desc: "This is a complex matter.\n\nWhen an overly feeble existence perceives a far mightier one - much like primitive organisms stand in awe of natural disasters - and if that object possesses true agency, perhaps even embodies a universal principle, then the convergence of such primal reverence can transform that entity into something divine, akin to the Shroud entities of this world.\n\nHowever, not all faith leads to benevolent ends. One radical sect views finality as salvation, and the object of their worship indeed commands the power over finality. Their unchecked growth and fervor led them, unsatisfied with merely achieving their own perfect end, to impose finality upon others - even upon themselves across other worlds and parallel realities.\n\nThe ruins you see are remnants of their crusades. The ring sigil is the symbol of their faith."
 libra_main.0110.a: "Understood."
 libra_main.0110.b: "Why are they present in this world? Did they come here?"
 libra_main.0110.b.response: "It is difficult to say.\n\nBeyond direct action, there are many ways for things from one world to manifest in another: deliberate detonation, dimensional drift, the fall of a primordial god, and so on. However, true 'finality' does not deceive. Most of these ruins bear genuine histories - meaning that, at some point, such events did indeed occur."
 libra_main.0110.c: "Is finality all they care about?"
 libra_main.0110.c.response: "Of course not. Faith in finality has existed, to varying degrees, in every world. And not all such faith points perfectly to the same singular god of finality; it may be other entities of a similar nature. In this world's case, it would be the Shroud entity associated with the End."
 libra_main.0110.d: "Can we gain power from this as well?"
 libra_main.0110.d.response: "In principle, yes. Though the path may have its twists and turns. However, should you encounter a catalyst - such as an encounter with the §HEndiral Crusaders§! - the subsequent steps become much simpler."
 libra_main.0110.e: "What do you think of them?"
 libra_main.0110.e.response: "As you see, Libra is content to record the shifting weights on its scales. As agents of change who bring finality to worlds, they are not entirely unacceptable factors - though they are, more often than not, exceedingly dangerous."

 libra_main.0150.name: "Strange Signal"
 libra_main.0150.desc: "We have detected a peculiar signal from §H[From.GetName]§!, apparently emanating from some extraterrestrial entity."
 libra_main.0150.a: "Attempt to decipher it."
 libra_main.0151.name: "Libra Agent"
 libra_main.0151.desc: "Greetings. I am the §HLibra Agent§!. I have awaited this meeting for quite some time.\n\nYou may already be familiar with the §HFairytale Agent§!. Unlike them, I offer exchanges of power, as well as knowledge not commonly known."
 libra_main.0151.a: "End communication."
 libra_main.0151.b: "What kind of exchanges can you offer?"
 libra_main.0151.b.response: "We welcome change in the world, whether for good or ill.\nTo that end, we offer exchanges based on Libra. Those who seek power must pay more than they receive."
 libra_main.0151.c: "Do you know who sealed us away?"
 libra_main.0151.c.response: "A golden-haired devil, likely of succubus lineage.\nTheir reasoning: 'To preserve as many embers as possible before the world ends.'"
 libra_main.0151.d: "Tell me stories of the old world."
 libra_main.0151.d.response: "You are of the Void Dragon lineage. In the §HDragonhold§!, Void Dragons were the most powerful and magnificent beings.\n\nThough the old world is gone, your kin continue to seek a future in other realms. The princess of that era still endures."
 libra_main.0151.e: "Can you explain the principle behind our code?"
 libra_main.0151.e.response: "That is a marvel of engineering, combining aether, entropy manipulation, and psionic theory.\n\nI can say with certainty: your creators were geniuses."
 libra_main.0151.f: "Who left these legacies for us?"
 libra_main.0151.f.response: "I am not certain. Your technology bears traces of both the §HEndiral Legacy§! and the §HCrystal Dynasty§!. It may be one, or perhaps both."
 libra_main.0151.g: "Can you help us build the Babel Tower?"
 libra_main.0151.g.response: "I regret that I cannot. Though Libra holds the relevant knowledge, such an act is beyond my purview.\n\nYours is not the first civilization to seek the Babel Tower - nor shall it be the last."

