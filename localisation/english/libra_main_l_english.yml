 libra_story_site_system_2_mod: "The Lost Domain"
 NAME_Libra_Guardian_1: "Lost Dragon"
 libra_guardian_1_modifier: "$NAME_Libra_Guardian_1$"
 libra_lost_shrine: "Forsaken Shrine"
 libra_lost_shrine_desc: "Upon this world stands a shrine that appears long abandoned, yet remains pristine as if new."
 libra_main.3000.name: "Silent Kagura"
 libra_main.3000.desc: "This shrine seems protected by psionic forces, keeping it free from dust. Faint strains of music echo around the structures, yet they cannot be captured by any device."
 libra_main.3000.a: "At least it brings a sense of peace."
 libra_main.3001.name: "The Music"
 libra_main.3001.desc: "The consciousness of some among us was suddenly 'drawn' into a dream-like space. Perception here is unusually sharp, yet marred by an immeasurable sense of falsehood and foreignness, accompanied by the sound of ritual music reminiscent of the shrine encountered earlier."
 libra_main.3001.a: "Let us see what lies deeper."
 libra_main.3001.b: "Too eerie. Best to stop."
 libra_main.3002.name: "Festival Market"
 libra_main.3002.desc: "As we delve deeper into the realm of consciousness, we arrive at... an exotic-looking town, decorated throughout for a festival, as if celebrations were just taking place. Yet now, it is utterly devoid of life.\n\nIn one corner of the town, we find a structure nearly identical to that shrine, though more ornate. The music emanates from within."
 libra_main.3002.a: "Touch the town's structures."
 libra_main.3002.a.response: "Our hands pass right through the buildings without encountering any substance."
 libra_main.3002.b: "See what else is in the market."
 libra_main.3002.b.response: "After thorough searching, we find no traces of living beings. However, in places where people should be - like behind a fruit stall - swirls of ash-gold dust hover and rotate, faintly outlining humanoid forms. It is profoundly unsettling."
 libra_main.3002.c: "Visit the shrine."
 libra_main.3003.name: "Kagura"
 libra_main.3003.desc: "Shortly after we enter the shrine, the illusion behind us collapses and fades away.\n\nA shrine maiden dances alone before the main hall. She does not notice us, continuing her ritualistic steps."
 libra_main.3003.a: "Search for the source of the music."
 libra_main.3003.a.response: "Frequency analysis suggests the music should involve multiple instruments playing in concert. Yet we find no other figures or sound-producing mechanisms within the shrine."
 libra_main.3003.b: "Touch the shrine structures."
 libra_main.3003.b.response: "Most features within the shrine are insubstantial; attempts to touch them result in passing right through. The main hall is the sole exception - we can make contact but cannot affect it. Neither pushing the door nor knocking elicits any response."
 libra_main.3003.c: "Attempt to speak to her."
 libra_main.3003.c.response: "The maiden notices us but offers no reply."
 libra_main.3003.d: "Wait for the dance to end."
 libra_main.3004.name: "Final Note"
 libra_main.3004.desc: "Before long, the dance concludes. The maiden finally turns her gaze towards us, seemingly awaiting our words."
 libra_main.3004.a: "Who are you? What happened here?"
 libra_main.3004.a.response: "I am §H$libra_hoshino_kotori_2$§!, daughter of the family that tended this place.\n\nShe pauses.\n\nThis place - this world - has ended. What you see is its final lingering shadow. Though I know not how you entered here, Kotori suggests you depart as soon as possible."
 libra_main.3004.b: "Why are you alone here?"
 libra_main.3004.b.response: "Certain duties must be fulfilled by someone... such as witnessing a world's final moments, and the work that follows its end. This, of course, falls outside an ordinary shrine maiden's duties. You need not worry for Kotori's safety - after all, the outcome here was determined long ago."
 libra_main.3004.c: "Try to ask more."
 libra_main.3005.name: "Dissipation"
 libra_main.3005.desc: "Even as we converse, the shrine, like the illusion outside, begins to disintegrate. From the torii gate to the main hall, everything turns to dust in an instant. Only the maiden's ritual bell falls to the ground, seeming utterly real.\n\n§Y'Should we ever meet again, I pray it does not end in sorrow.'§!"
 libra_main.3005.a: "Pick up the bell."
 r_libra_kagura_suzu: "Kagura Bell of the Princess Maiden"
 r_libra_kagura_suzu_desc: "The maiden danced in the world after its end. We obtained the ritual instrument she held then."
 libra_main.3006.name: "Intense and forceful communication"
 libra_main.3006.desc: "Hey hey hey~ This lady has been watching your science ships wander around this system for ages~\nYou're carrying such precious research equipment, scanning every celestial body here over and over, yet you can't even notice the afterimage of a huge shrine right in front of your eyes? Coming all the way to such a remote place must mean you're treasure hunting, right~ Such a pity~ You must have gone through great trouble to deal with the guardians, but the person in charge of the next task is just a clueless small fry who can't recognize Mt. Tai! Hmph hehe hahahahaha (laughs)."
 libra_main.3006.a: "Can't we communicate properly?"
 libra_main.3006.a.response: "No-- way~\n\nThe fate of small fries is to be humiliated, to be disciplined this way and that, and finally to bow before destiny. With your level, you have no right to criticize me.\n\nIdiot~ Idio~t~~"
 libra_main.3006.b: "Yeah, yeah, you're right."
 libra_main.3006.c: "This definitely cannot be a phenomenon worth studying!"

 libra_main.3050.name: "Kagura of a Bygone Era"
 libra_main.3050.desc: "The Kagura Bell shattered upon being shaken, releasing a peculiar strand of energy. Its path is unpredictable, swiftly traversing our empire.\n\nThis energy entity seems to observe us, mimic us, yet deliberately maintains its distance."
 libra_main.3050.a: "Is that all?"
 libra_main.3051.name: "Triple Visage"
 libra_main.3051.desc: "Years have passed since the energy was released from the bell. It has now split into three entities, each bearing some of our characteristics, yet dissimilar in many more ways.\n\nRecent interactions confirm their personalities and memories are incomplete, sharing an indistinct connection with §Y$libra_hoshino_kotori_2$§!. They now wish to reside temporarily within our empire, quietly awaiting the arrival of a certain moment."
 libra_main.3051.a: "So that's how it is?"
 libra_hoshino_kotori_q1: "$libra_hoshino_kotori_2$ - Q1"
 libra_hoshino_kotori_q2: "$libra_hoshino_kotori_2$ - Q2"
 libra_hoshino_kotori_q3: "$libra_hoshino_kotori_2$ - Q3"
 libra_hoshino_kotori_q_desc: "An ancient relic has projected an otherworldly shrine maiden named '§Y$libra_hoshino_kotori_2$§!' into our world. They possess a portion of the original's power but lack memories and other components."
 libra_hoshino_kotori_q1_catch_phrase: "Set sail !"
 libra_hoshino_kotori_q2_catch_phrase: "Take off !"
 libra_hoshino_kotori_q3_catch_phrase: "Crash !"
 leader_trait_libra_hoshino_kotori_miko_1: "Battlefield Kagura"
 leader_trait_libra_hoshino_kotori_miko_1_desc: "A strange ritual from an ancient world long since perished. Though ancient and difficult to decipher, it still wields considerable tangible influence.\n$libraf_lt_banner_0$"
 leader_trait_libra_hoshino_kotori_miko_2: "Resplendent Kagura"
 leader_trait_libra_hoshino_kotori_miko_2_desc: "$leader_trait_libra_hoshino_kotori_miko_1_desc$"
 leader_trait_libra_hoshino_kotori_miko_3: "Exorcism Kagura"
 leader_trait_libra_hoshino_kotori_miko_3_desc: "$leader_trait_libra_hoshino_kotori_miko_1_desc$"